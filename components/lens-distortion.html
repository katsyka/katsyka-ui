<style>
.bg-ldx{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;--ink:#ffffff;--fb:#7a3a1c;--ink2:var(--ink);background:var(--fb);color:var(--ink);isolation:isolate;font:16px/1.5 Geist,system-ui,sans-serif}
.bg-ldx canvas,.bg-ldx>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.bg-ldx>img{display:none;filter:none}
.bg-ldx.nogl canvas{display:none}.bg-ldx.nogl>img{display:block}
.bg-ldx-nav{display:flex;align-items:center;gap:28px;padding:20px clamp(16px,4vw,48px)}
.bg-ldx-nav nav{display:flex;gap:22px}
.bg-ldx-nav b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.bg-ldx-nav a{color:inherit;text-decoration:none;font-size:14px;opacity:.72;transition:opacity .15s ease-out}.bg-ldx-nav a:hover{opacity:1}
.bg-ldx-main{flex:1;display:grid;padding:clamp(24px,5vw,64px) clamp(16px,4vw,48px) clamp(32px,6vw,72px)}
.bg-ldx-eye{margin:0;font:500 11px/1.4 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.bg-ldx-sub{font-size:17px;line-height:1.55;max-width:44ch;margin:0;opacity:.8;text-wrap:pretty}
.bg-ldx-mono{font:13px "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.bg-ldx-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--ink);color:var(--fb);font:600 15px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease-out,opacity .15s ease-out}
.bg-ldx-btn:active{transform:scale(.97)}.bg-ldx-ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink) 35%,transparent)}
.bg-ldx-card{background:color-mix(in oklab,var(--fb) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in oklab,var(--ink) 12%,transparent);border-radius:16px;padding:20px}
.bg-ldx-card>.bg-ldx-eye:first-child{margin-bottom:10px}
.bg-ldx-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.bg-ldx-pal{margin-left:auto;display:flex;gap:2px}
.bg-ldx-pal button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.bg-ldx-pal button i{width:18px;height:18px;border-radius:50%;background:var(--g);box-shadow:0 0 0 1px color-mix(in oklab,var(--ink) 30%,transparent);transition:transform .15s ease-out}
.bg-ldx-pal button[aria-pressed=true] i{box-shadow:0 0 0 2px var(--fb),0 0 0 3.5px var(--ink)}
.bg-ldx :focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:760px){.bg-ldx-main{grid-template-columns:1fr!important;gap:28px!important}.bg-ldx-nav nav{display:none}}

.bg-ldx-main{grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:48px;align-items:end}
.bg-ldx h1{font:600 clamp(40px,6vw,78px)/.95 Geist,system-ui,sans-serif;letter-spacing:-.045em;margin:12px 0 0;max-width:10ch;text-shadow:0 1px 24px rgb(0 0 0/.25)}
.bg-ldx-slots{display:grid;gap:8px;margin:14px 0 16px;border:0;padding:0}
.bg-ldx-slots label{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:52px;padding:0 14px;border-radius:10px;border:1px solid color-mix(in oklab,var(--ink) 16%,transparent);cursor:pointer;font-size:14.5px;font-variant-numeric:tabular-nums}
.bg-ldx-slots label:has(input:checked){border-color:var(--ink)}.bg-ldx-slots input{accent-color:var(--ink);margin:0}.bg-ldx-slots small{opacity:.6;display:block}
.bg-ldx-card{color:var(--ink2);--ink:var(--ink2)}.bg-ldx-card .bg-ldx-btn{width:100%}

</style>
<section class="bg-ldx">
  <canvas aria-hidden="true"></canvas>
  <img src="media/pics/w/564.jpg" alt="" crossorigin="anonymous">
  <header class="bg-ldx-nav"><b>Narrow Light</b><nav aria-label="Narrow Light"><a href="#">Walks</a><a href="#">Gear hire</a><a href="#">Gallery</a></nav><div class="bg-ldx-pal" role="group" aria-label="Colour"><button type="button" aria-pressed="true" data-k="#ffffff,#ffffff,#ffffff" style="--g:linear-gradient(135deg,#ffffff,#ffffff)" aria-label="Clear"><i></i></button><button type="button" aria-pressed="false" data-k="#ffd6a8,#ffffff,#ffffff" style="--g:linear-gradient(135deg,#ffd6a8,#ffffff)" aria-label="Amber"><i></i></button><button type="button" aria-pressed="false" data-k="#c9e9ff,#ffffff,#ffffff" style="--g:linear-gradient(135deg,#c9e9ff,#ffffff)" aria-label="Ice"><i></i></button></div></header>
  <main class="bg-ldx-main">
<div><p class="bg-ldx-eye">Guided photo walks · 3 hours</p><h1>Shoot the canyon at noon light.</h1></div>
<form class="bg-ldx-card" onsubmit="return false"><p class="bg-ldx-eye">Choose a session</p><fieldset class="bg-ldx-slots"><legend class="bg-ldx-vh">Session</legend>
<label><input type="radio" name="sl" checked><span>Sat 11:30<small>Overhead beams</small></span><span>€45</span></label>
<label><input type="radio" name="sl"><span>Sun 11:00<small>4 places left</small></span><span>€45</span></label>
<label><input type="radio" name="sl"><span>Sun 15:30<small>Warm walls</small></span><span>€40</span></label></fieldset>
<button class="bg-ldx-btn" type="submit">Book this walk</button></form>
</main>
</section>
<script>
(()=>{
const S=document.currentScript?document.currentScript.previousElementSibling:document.querySelector(".bg-ldx");
const root=S&&S.classList.contains("bg-ldx")?S:document.querySelector(".bg-ldx");
const cv=root.querySelector("canvas"),gl=cv.getContext("webgl",{antialias:false});
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches,IMG=true;
const off=()=>root.classList.add("nogl");
if(!gl)return off();
const FS="precision highp float;uniform vec2 r,m,us;uniform float t,ld;uniform sampler2D u;uniform vec3 k0,k1,k2;\nfloat h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}\nvec2 h2(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}\nfloat n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\nfloat fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=mat2(.8,.6,-.6,.8)*p*2.03+1.7;a*=.5;}return v;}\nvec2 cover(vec2 q){float ra=r.x/r.y,ia=us.x/us.y;vec2 s=ra>ia?vec2(1.,ia/ra):vec2(ra/ia,1.);return (q-.5)*s+.5;}\nvec3 img(vec2 q){return texture2D(u,clamp(q,.001,.999)).rgb;}\nfloat lum(vec3 c){return dot(c,vec3(.299,.587,.114));}\n\nvec2 orb(vec2 p,vec2 c,float R,inout float hit,inout float rim){vec2 d=p-c;float l=length(d);if(l<R){float k=l/R;hit=max(hit,1.);rim=max(rim,smoothstep(.75,1.,k));float z=sqrt(1.-k*k);return c+d*(.45+.55*k*k)-d*(1.-z)*.1;}return p;}\nvoid main(){vec2 uv=gl_FragCoord.xy/r,a=vec2(r.x/r.y,1.);vec2 p=uv*a;float hit=0.,rim=0.;\nvec2 q=p;q=orb(q,vec2(.28*a.x+.06*sin(t*.3),.62+.05*cos(t*.37)),.2,hit,rim);q=orb(q,vec2(.76*a.x+.05*cos(t*.25),.3+.06*sin(t*.31)),.15,hit,rim);q=orb(q,m*a,.17,hit,rim);\nvec2 o=(q-p)*.06;vec3 col;col.r=img(cover((q+o)/a)).r;col.g=img(cover(q/a)).g;col.b=img(cover((q-o)/a)).b;\ncol*=mix(1.,1.08,hit);col=mix(col,k0,rim*.18);col+=pow(rim,6.)*.25;col=mix(vec3(.12),col,ld);gl_FragColor=vec4(col,1);}";
const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
const P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}"));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(P);
if(!gl.getProgramParameter(P,gl.LINK_STATUS))return off();
gl.useProgram(P);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};["r","m","us","t","ld","k0","k1","k2"].forEach(k=>U[k]=gl.getUniformLocation(P,k));
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
let fr=0,ready=!IMG,vis=true,raf=0,t0=performance.now(),mx=.5,my=.5,sx=.5,sy=.5,ld=0,ldT=0;
const pal=k=>{k.split(",").forEach((c,i)=>gl.uniform3fv(U["k"+i],hex(c)));if(RM)draw()};
if(IMG){const im=root.querySelector("img"),tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,...p));
  const go=()=>{try{gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im)}catch(e){return off()}gl.uniform2f(U.us,im.naturalWidth,im.naturalHeight);ready=true;ldT=performance.now();loop()};
  im.complete&&im.naturalWidth?go():(im.onload=go,im.onerror=off)}
function size(){const d=Math.min(devicePixelRatio||1,1.5)*1,w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(U.r,w,h)}
function draw(){if(!ready)return;size();const now=performance.now();sx+=(mx-sx)*.06;sy+=(my-sy)*.06;
  gl.uniform1f(U.t,RM?8:(now-t0)/1000);gl.uniform2f(U.m,sx,sy);gl.uniform1f(U.ld,IMG?Math.min(1,(now-ldT)/900):1);gl.drawArrays(gl.TRIANGLES,0,3)}
function loop(){cancelAnimationFrame(raf);if(RM){draw();if(IMG&&performance.now()-ldT<1000)raf=requestAnimationFrame(loop);return}if(!vis||document.hidden)return;if(fr++%1===0)draw();raf=requestAnimationFrame(loop)}
root.addEventListener("pointermove",e=>{const b=root.getBoundingClientRect();mx=(e.clientX-b.left)/b.width;my=1-(e.clientY-b.top)/b.height});
root.addEventListener("pointerleave",()=>{mx=.5;my=.5});
new IntersectionObserver(([e])=>{vis=e.isIntersecting;loop()}).observe(root);
document.addEventListener("visibilitychange",loop);
new ResizeObserver(()=>{if(RM)draw()}).observe(root);
root.querySelectorAll("[data-tg]").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")));
root.querySelectorAll("[data-one]").forEach(b=>b.addEventListener("click",()=>b.parentNode.querySelectorAll("[data-one]").forEach(x=>x.setAttribute("aria-pressed",x===b))));
const btns=[...root.querySelectorAll("[data-k]")];
btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.setAttribute("aria-pressed",x===b));pal(b.dataset.k);const s=root.style;["ink","fb"].forEach(k=>b.dataset[k]?s.setProperty("--"+k,b.dataset[k]):s.removeProperty("--"+k))});
pal("#ffffff,#ffffff,#ffffff");loop();
})();
</script>

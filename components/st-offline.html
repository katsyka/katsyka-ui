<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}

<div class="k of"><main class="of-w"><div class="of-bn" id="bn" role="status"><span class="of-dot"></span><span id="bt"></span><button class="b gh sm" id="sim"></button></div>
<section class="of-c"><h1>Shopping list</h1><form id="f" class="of-f"><label class="vh" for="it">Add item</label><input class="in" id="it" placeholder="Add an item" autocomplete="off"><button class="b ac">Add</button></form><ul class="of-l" id="l"></ul></section>
<p class="of-ft mu" id="ft"></p></main></div>
<script>
const $=i=>document.getElementById(i);let sim=false,I=[{t:'Oat milk',s:'s'},{t:'Lemons',s:'s'}];const on=()=>navigator.onLine&&!sim;
function draw(){$('l').innerHTML=I.map(x=>`<li class="${x.s}"><span>${x.t.replace(/</g,'&lt;')}</span><small>${x.s==='q'?'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:12px;height:12px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> Waiting to sync':x.s==='y'?'Syncing…':'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:12px;height:12px"><path d="M20 6 9 17l-5-5"/></svg> Synced'}</small></li>`).join('');const q=I.filter(x=>x.s==='q').length;$('bn').classList.toggle('off',!on());$('bt').textContent=on()?(q?`Back online. Syncing ${q} change${q>1?'s':''}…`:'Online. Everything is synced.'):`You're offline. ${q?q+' change'+(q>1?'s':'')+' saved on this device.':'Changes will be saved on this device.'}`;$('sim').textContent=sim?'Reconnect':'Simulate offline';$('ft').textContent=`Real connection: ${navigator.onLine?'online':'offline'}.`}
function flush(){if(!on())return;let d=0;I.filter(x=>x.s==='q').forEach(x=>{x.s='y';setTimeout(()=>{if(on()){x.s='s'}else x.s='q';draw()},500+(d+=350))});draw()}
$('f').onsubmit=e=>{e.preventDefault();const v=$('it').value.trim();if(!v)return;I.unshift({t:v,s:on()?'y':'q'});$('it').value='';draw();if(on())setTimeout(()=>{I[0].s='s';draw()},500)};
$('sim').onclick=()=>{sim=!sim;draw();if(!sim)flush()};addEventListener('online',()=>{draw();flush()});addEventListener('offline',draw);draw();
</script>

<style>
.to-stage{min-height:100vh;display:grid;place-items:center;background:#09090b}
.to-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.to-btns button{height:42px;padding:0 18px;border-radius:11px;border:1px solid #ffffff1a;background:#121215;color:#e6e6ea;font:500 14px Geist,sans-serif;cursor:pointer;transition:background .2s}
.to-btns button:hover{background:#1a1a1e}
.to-wrap{position:fixed;right:24px;bottom:24px;width:360px;height:0;z-index:9}
.to{--i:0;position:absolute;right:0;bottom:0;width:100%;display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 16px;border-radius:14px;background:#17171b;border:1px solid #ffffff17;box-shadow:0 14px 40px -12px #000c;
  transform:translateY(calc(var(--i)*-12px)) scale(calc(1 - var(--i)*.05));opacity:calc(1 - var(--i)*.25);transition:transform .45s cubic-bezier(.2,1.1,.3,1),opacity .35s;transform-origin:bottom center;overflow:hidden}
.to.hide{opacity:0}
.to-wrap:hover .to{transform:translateY(var(--y));opacity:1}
.to.in{animation:to-in .5s cubic-bezier(.2,1.1,.3,1)}
@keyframes to-in{from{transform:translateY(120%);opacity:0}}
.to.out{transform:translateX(110%)!important;opacity:0!important;transition:transform .35s cubic-bezier(.6,0,.4,1),opacity .3s}
.to i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px Geist,sans-serif;font-style:normal;color:#0a0a0a;background:var(--c)}
.to b{display:block;font-size:14px;font-weight:550;margin-bottom:2px}.to p{margin:0;font-size:13px;color:#8a8a94}
.to button{margin-left:auto;border:0;background:none;color:#66666f;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}.to button:hover{color:#fff}
.to::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--c);opacity:.6;transform-origin:left;animation:to-t 5s linear forwards}
.to-wrap:hover .to::after{animation-play-state:paused}
@keyframes to-t{to{transform:scaleX(0)}}
@media (max-width:480px){.to-wrap{left:12px;right:12px;width:auto}}
</style>
<div class="to-stage"><div class="to-btns"><button data-k="ok">Success</button><button data-k="info">Info</button><button data-k="err">Error</button></div></div>
<div class="to-wrap"></div>
<script>
(()=>{
const W=document.querySelector(".to-wrap"),K={ok:["✓","#3ddc84","Deployment complete","main → production in 38s"],info:["i","#5ab8ff","New comment","Kenji replied to your design"],err:["!","#ff5c5c","Payment failed","Card ending 4242 was declined"]};
let list=[];
const layout=()=>{let y=0;list.forEach((t,i)=>{t.style.setProperty("--i",Math.min(i,3));t.style.zIndex=99-i;t.classList.toggle("hide",i>3);t.style.setProperty("--y",-y+"px");y+=t.offsetHeight+10})};
const kill=t=>{if(!list.includes(t))return;clearTimeout(t._t);list=list.filter(x=>x!==t);t.classList.add("out");setTimeout(()=>t.remove(),350);layout()};
const timer=t=>{clearTimeout(t._t);t._t=setTimeout(()=>W.matches(":hover")?timer(t):kill(t),5000)};
const push=k=>{const[ic,c,ti,tx]=K[k],t=document.createElement("div");t.className="to in";t.style.setProperty("--c",c);
  t.innerHTML=`<i>${ic}</i><div><b>${ti}</b><p>${tx}</p></div><button aria-label="Dismiss">×</button>`;
  t.querySelector("button").onclick=()=>kill(t);W.append(t);list.unshift(t);layout();timer(t)};
document.querySelectorAll(".to-btns button").forEach(b=>b.onclick=()=>push(b.dataset.k));
setTimeout(()=>push("ok"),400);setTimeout(()=>push("info"),1100);
})();
</script>

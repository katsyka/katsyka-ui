<style>
.ap{position:relative;min-height:100vh;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;background:#0a0908;color:#efe7da;overflow:hidden}
.ap canvas{width:100%;height:100vh;display:block}
.ap-copy{padding:0 clamp(20px,5vw,72px);position:relative;z-index:1}
.ap-eye{font:500 12px "Geist Mono",monospace;color:#ff7a3d;letter-spacing:.08em}
.ap h1{font-size:clamp(40px,5.6vw,84px);line-height:.95;letter-spacing:-.055em;font-weight:600;margin:18px 0}
.ap p{color:#9b9285;font-size:16.5px;line-height:1.6;max-width:400px;margin:0 0 28px}
.ap-sets{display:flex;gap:6px;flex-wrap:wrap}
.ap-sets button{height:34px;padding:0 14px;border-radius:8px;border:1px solid #ffffff1a;background:none;color:#9b9285;font:500 13px "Geist Mono",monospace;cursor:pointer;transition:all .2s}
.ap-sets button.on{background:#efe7da;color:#0a0908;border-color:#efe7da}
@media (max-width:800px){.ap{grid-template-columns:1fr}.ap canvas{height:60vh}.ap-copy{padding-top:48px}}
</style>
<section class="ap">
  <div class="ap-copy"><div class="ap-eye">// rendered in text</div><h1>A whole world in 7,000 characters.</h1>
    <p>A lit, rotating planet drawn every frame with nothing but glyphs. Touch the surface to send ripples across it.</p>
    <div class="ap-sets"><button class="on" data-s=" .:-=+*#%@">classic</button><button data-s=" ·•●">dots</button><button data-s=" ░▒▓█">blocks</button><button data-s=" 01">binary</button></div></div>
  <canvas></canvas>
</section>
<script>
(()=>{
const root=document.querySelector(".ap"),c=root.querySelector("canvas"),x=c.getContext("2d");
let set=" .:-=+*#%@",W,H,cols,rows,cw,ch,dpr=Math.min(devicePixelRatio,2),ripples=[],vis=true;
const fit=()=>{W=c.width=c.clientWidth*dpr;H=c.height=c.clientHeight*dpr;cw=8*dpr;ch=14*dpr;cols=W/cw|0;rows=H/ch|0;x.font=`${12*dpr}px "Geist Mono",monospace`;x.textBaseline="top"};
new ResizeObserver(fit).observe(c);fit();
root.querySelectorAll(".ap-sets button").forEach(b=>b.onclick=()=>{root.querySelector(".ap-sets .on").classList.remove("on");b.classList.add("on");set=b.dataset.s});
c.addEventListener("pointermove",e=>{if(e.buttons||Math.random()<.08){const b=c.getBoundingClientRect();ripples.push({x:(e.clientX-b.left)*dpr,y:(e.clientY-b.top)*dpr,t:performance.now()})}});
c.addEventListener("pointerdown",e=>{const b=c.getBoundingClientRect();ripples.push({x:(e.clientX-b.left)*dpr,y:(e.clientY-b.top)*dpr,t:performance.now(),big:1})});
new IntersectionObserver(([e])=>vis=e.isIntersecting).observe(root);
const hash=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5;return s-Math.floor(s)};
const noise=(a,b)=>{const i=Math.floor(a),j=Math.floor(b),f=a-i,g=b-j,u=f*f*(3-2*f),v=g*g*(3-2*g);
  return (hash(i,j)*(1-u)+hash(i+1,j)*u)*(1-v)+(hash(i,j+1)*(1-u)+hash(i+1,j+1)*u)*v};
(function f(now){requestAnimationFrame(f);if(!vis)return;
  x.fillStyle="#0a0908";x.fillRect(0,0,W,H);
  const rot=now/6000,R=Math.min(cols*cw,rows*ch)*.36,ox=W/2,oy=H/2,L=[-.5,.55,.67];
  ripples=ripples.filter(r=>now-r.t<2200);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const px=i*cw+cw/2,py=j*ch+ch/2;let dx=(px-ox)/R,dy=(py-oy)/R;
    let rip=0;for(const r of ripples){const age=(now-r.t)/1000,d=Math.hypot(px-r.x,py-r.y)/(R*.5),wv=d-age*2.2;rip+=Math.exp(-wv*wv*18)*(1-age/2.2)*(r.big?.5:.25)}
    const d2=dx*dx+dy*dy;
    if(d2>1){ // atmosphere specks
      if(d2<1.18){const a=(1.18-d2)/.18;if(hash(i,j+((now/400)|0))<a*.25){x.fillStyle=`rgba(255,122,61,${a*.35})`;x.fillText("·",i*cw,j*ch)}}continue}
    const z=Math.sqrt(1-d2);
    const lon=Math.atan2(dx,z)+rot,lat=Math.asin(-dy);
    const land=noise(lon*2.2+10,lat*2.6)*.65+noise(lon*5,lat*5)*.35;
    let b=.14+.86*Math.max(0,dx*L[0]+-dy*L[1]+z*L[2]);b=b*(land>.52?1:.55)+rip;
    const k=Math.min(set.length-1,Math.max(0,(b*set.length)|0));if(k===0&&rip<.05)continue;
    x.fillStyle=land>.52?`hsl(${22+land*20},${70+rip*30}%,${35+b*45}%)`:`hsl(32,15%,${20+b*40}%)`;
    x.fillText(set[k],i*cw,j*ch)}
})(performance.now());
})();
</script>

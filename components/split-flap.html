<style>
.sf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:30px 12px;background:#121110;color:#f2e9da}
.sf-head{display:flex;justify-content:space-between;width:min(900px,100%);font:500 12px "Geist Mono",monospace;letter-spacing:.14em;color:#8a8073}
.sf-head b{color:#ffb547;font-weight:500}
.sf-board{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:16px;background:#0a0908;box-shadow:inset 0 2px 10px #000,0 30px 60px -30px #000}
.sf-row{display:flex;gap:4px}
.sf-c{position:relative;width:clamp(18px,3.3vw,34px);height:clamp(28px,5vw,52px);perspective:200px;font:600 clamp(16px,3vw,32px)/1 "Geist Mono",monospace;color:#f2e9da}
.sf-c .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#1d1b19;display:flex;justify-content:center}
.sf-c .h span{line-height:clamp(28px,5vw,52px)}
.sf-c .t{top:0;border-radius:4px 4px 0 0;align-items:flex-start}.sf-c .b{bottom:0;border-radius:0 0 4px 4px;align-items:flex-end;background:#1a1816}
.sf-c .b span{transform:translateY(-50%)}.sf-c .t span{transform:translateY(0)}
.sf-c .h{display:block;text-align:center}.sf-c .b span{display:block;transform:translateY(-50%)}
.sf-c::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000;z-index:3}
.sf-c .f{position:absolute;left:0;right:0;top:0;height:50%;overflow:hidden;background:#1d1b19;border-radius:4px 4px 0 0;transform-origin:bottom;z-index:2;text-align:center;backface-visibility:hidden}
.sf-c .f span{display:block;line-height:clamp(28px,5vw,52px)}
.sf-c.go .f{animation:sf-flip .07s linear}
@keyframes sf-flip{to{transform:rotateX(-90deg);filter:brightness(.6)}}
.sf-row.hd .sf-c{color:#ffb547}
.sf-ctl{display:flex;gap:8px}.sf-ctl button{height:40px;padding:0 16px;border-radius:10px;border:1px solid #ffffff1a;background:none;color:#f2e9da;font:500 13px "Geist Mono",monospace;cursor:pointer}.sf-ctl button:hover{background:#ffffff0d}
.sf-ctl input{height:40px;width:min(280px,60vw);padding:0 12px;border-radius:10px;border:1px solid #ffffff1a;background:#0a0908;color:#f2e9da;font:14px "Geist Mono",monospace;text-transform:uppercase;outline:0}
</style>
<section class="sf">
  <div class="sf-head"><span>DEPARTURES · <b data-clock>00:00</b></span><span>GATE 14 · TERMINAL 2</span></div>
  <div class="sf-board"></div>
  <form class="sf-ctl"><input maxlength="22" placeholder="Type your own message" aria-label="Message"><button>Display</button></form>
</section>
<script>
(()=>{
const COLS=22,CH=" ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-→",board=document.querySelector(".sf-board");
const R=(t,d,g)=>t+" "+d.padEnd(12)+g,HEAD="TIME  DESTINATION GATE";
const SETS=[[HEAD,R("09:40","LISBON","A12"),R("10:05","REYKJAVIK","B03"),R("10:30","KYOTO","C21"),R("11:15","SANTIAGO","D07")],
            [HEAD,R("12:00","OSLO","A04"),R("12:20","NAIROBI","B11"),R("12:45","SEOUL","C02"),R("13:10","MEXICO CITY","D15")]];
const rows=SETS[0].map((_,r)=>{const row=document.createElement("div");row.className="sf-row"+(r?"":" hd");board.append(row);
  return[...Array(COLS)].map(()=>{const c=document.createElement("div");c.className="sf-c";c.innerHTML='<div class="h t"><span> </span></div><div class="h b"><span> </span></div><div class="f"><span> </span></div>';row.append(c);return{c,cur:" ",busy:0}})});
const show=(cell,ch)=>{cell.c.querySelectorAll("span").forEach(s=>s.textContent=ch)};
function flipTo(cell,target,delay){clearTimeout(cell.t);cell.t=setTimeout(function step(){if(cell.cur===target)return;
  const next=CH[(CH.indexOf(cell.cur)+1)%CH.length]??" ";const f=cell.c.querySelector(".f span"),t=cell.c.querySelector(".t span"),b=cell.c.querySelector(".b span");
  f.textContent=cell.cur;t.textContent=next;cell.c.classList.remove("go");void cell.c.offsetWidth;cell.c.classList.add("go");
  setTimeout(()=>{b.textContent=next;f.textContent=next},60);cell.cur=next;cell.t=setTimeout(step,70)},delay)}
function display(lines){lines.forEach((l,r)=>{const s=l.toUpperCase().padEnd(COLS).slice(0,COLS);rows[r].forEach((cell,i)=>flipTo(cell,CH.includes(s[i])?s[i]:" ",r*90+i*25))})}
let k=0;display(SETS[0]);const auto=setInterval(()=>display(SETS[++k%2]),9000);
document.querySelector(".sf-ctl").onsubmit=e=>{e.preventDefault();const v=e.target.querySelector("input").value;if(!v)return;clearInterval(auto);display(["",v,"","",""].map((x,i)=>i===1?"  "+x:x))};
const clk=document.querySelector("[data-clock]");setInterval(()=>clk.textContent=new Date().toTimeString().slice(0,5),1000);clk.textContent=new Date().toTimeString().slice(0,5);
})();
</script>

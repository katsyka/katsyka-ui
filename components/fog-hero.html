<style>
.fh{--fg:#eef0f2;position:relative;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;color:var(--fg);background:#15181c;font:16px/1.5 Geist,system-ui,sans-serif;overflow:hidden}
.fh video,.fh .fh-po{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fh>*:not(video):not(.fh-po){position:relative;z-index:1}
.fh-nav{display:flex;align-items:center;gap:24px;padding:20px clamp(16px,4vw,48px)}.fh-nav b{font-size:17px;letter-spacing:.02em}.fh-nav nav{display:flex;gap:22px;margin-left:auto;font-size:14px}.fh-nav a{color:inherit;text-decoration:none;opacity:.85}.fh-nav a:hover{opacity:1}
.fh-main{align-self:end;padding:0 clamp(16px,4vw,48px) 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end}
.fh h1{margin:0;font-size:clamp(44px,7vw,92px);line-height:.95;letter-spacing:-.04em;font-weight:620;text-wrap:balance}
.fh-l{list-style:none;margin:0;padding:0;border-top:1px solid #ffffff40}.fh-l li{display:grid;grid-template-columns:80px 1fr auto;gap:16px;padding:14px 0;border-bottom:1px solid #ffffff40;align-items:baseline;font-size:15px}.fh-l time{font:500 13px 'Geist Mono',monospace;opacity:.8}.fh-l span{opacity:.8;font-variant-numeric:tabular-nums}
.fh-l a{color:inherit;text-decoration:none}.fh-l a:hover b{text-decoration:underline;text-underline-offset:4px}
.fh-ft{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px) max(16px,env(safe-area-inset-bottom));font-size:13px;opacity:.85}
.fh-pp{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff59;background:none;color:inherit;display:grid;place-items:center;cursor:pointer}.fh-pp svg{width:16px;height:16px}.fh-pp:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (max-width:760px){.fh-nav nav{display:none}.fh-main{grid-template-columns:1fr;gap:28px}}
@media (prefers-reduced-motion:reduce){.fh video{display:none}}
</style>
<section class="fh" aria-label="Vesper">
<img class="fh-po" src="media/planet.jpg" alt="">
<video src="media/planet.mp4" poster="media/planet.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
<header class="fh-nav"><b>VESPER</b><nav><a href="#">Trailer</a><a href="#">Devlog</a><a href="#">Press kit</a></nav></header>
<div class="fh-main"><h1>Land somewhere quiet.</h1>
<ul class="fh-l" aria-label="Release dates"><li><time>NOW</time><a href="#"><b>Play the free prologue</b></a><span>PC · 40 min</span></li><li><time>MAR 12</time><a href="#"><b>Early access</b></a><span>PC · Steam</span></li><li><time>2027</time><a href="#"><b>Console release</b></a><span>PS5 · Switch 2</span></li></ul></div>
<footer class="fh-ft"><span>A slow exploration game. No combat, no map, one ringed planet overhead.</span><button class="fh-pp" id="fhp" aria-label="Pause background video"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor"/></svg></button></footer>
</section>
<script>
(()=>{const v=document.querySelector('.fh video'),b=document.getElementById('fhp'),P='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor"/></svg>',Y='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l8 5-8 5z" fill="currentColor"/></svg>';
if(matchMedia('(prefers-reduced-motion:reduce)').matches){v.pause();b.innerHTML=Y;b.setAttribute('aria-label','Play background video')}
b.onclick=()=>{if(v.paused){v.play();b.innerHTML=P;b.setAttribute('aria-label','Pause background video')}else{v.pause();b.innerHTML=Y;b.setAttribute('aria-label','Play background video')}};})();
</script>

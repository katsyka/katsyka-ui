<style>
.hgt{--fg:#efe6da;--mu:#8b8378;--ac:#e8a46a;position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#000;color:var(--fg);font-family:Geist,system-ui,sans-serif}
.hgt-in{width:100%;display:flex;align-items:center;gap:clamp(24px,6vw,80px);padding:32px 16px;flex-wrap:wrap;justify-content:center}
.hgt-glass{width:min(440px,80vw);aspect-ratio:1;position:relative}
.hgt-glass canvas{width:100%;height:100%;display:block;transition:transform .8s cubic-bezier(.6,0,.3,1)}
.hgt-glass.flip canvas{transform:rotate(180deg)}
.hgt-glass::after{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,#0000 62%,#000)}
.hgt-ui{width:min(320px,100%)}
.hgt-ui small{font:12px/1 "Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.hgt-t{margin:12px 0 4px;font:400 clamp(64px,9vw,104px)/1 "Instrument Serif",serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hgt-st{margin:0 0 22px;font-size:14px;color:var(--mu);min-height:21px}
.hgt-seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:#ffffff0f;margin-bottom:14px}
.hgt-seg button{flex:1;height:32px;border:0;border-radius:999px;background:none;color:var(--mu);font:500 13px Geist,system-ui,sans-serif;cursor:pointer}
.hgt-seg button[aria-pressed="true"]{background:var(--fg);color:#000}
.hgt-row{display:flex;gap:8px}
.hgt-row button{height:44px;padding:0 20px;border-radius:999px;border:1px solid #ffffff2e;background:none;color:var(--fg);font:500 14px Geist,system-ui,sans-serif;cursor:pointer}
.hgt-row .hgt-go{flex:1;background:var(--ac);border-color:var(--ac);color:#1a0d03}
.hgt button:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.hgt-dots{display:flex;gap:6px;margin-top:22px}
.hgt-dots i{width:22px;height:4px;border-radius:2px;background:#ffffff1f}.hgt-dots i.on{background:var(--ac)}
</style>
<section class="hgt">
  <div class="hgt-in">
    <div class="hgt-glass"><canvas aria-hidden="true"></canvas></div>
    <div class="hgt-ui">
      <small>Deep work · session <span class="hgt-n">1</span> of 4</small>
      <div class="hgt-t" role="timer" aria-live="off">25:00</div>
      <p class="hgt-st" aria-live="polite">Pick a length and turn it over.</p>
      <div class="hgt-seg" role="group" aria-label="Length"><button data-m="1" aria-pressed="false">1 min</button><button data-m="15" aria-pressed="false">15</button><button data-m="25" aria-pressed="true">25</button><button data-m="50" aria-pressed="false">50</button></div>
      <div class="hgt-row"><button class="hgt-go">Start</button><button class="hgt-flip">Flip</button></div>
      <div class="hgt-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
</section>
<script>
(()=>{
// The sand frame is the elapsed fraction; Flip turns the glass over and restarts.
const FRAMES=80,SRC=i=>`media/hourglass/${String(i+1).padStart(2,"0")}.jpg`;
const R=document.querySelector(".hgt"),glass=R.querySelector(".hgt-glass"),cv=glass.querySelector("canvas"),x=cv.getContext("2d"),tEl=R.querySelector(".hgt-t"),st=R.querySelector(".hgt-st"),go=R.querySelector(".hgt-go"),fl=R.querySelector(".hgt-flip"),segs=[...R.querySelectorAll(".hgt-seg button")],dots=[...R.querySelectorAll(".hgt-dots i")],nEl=R.querySelector(".hgt-n");
const red=matchMedia("(prefers-reduced-motion:reduce)").matches;
const imgs=[...Array(FRAMES)].map((_,i)=>{const im=new Image();im.src=SRC(i);if(i===0)im.onload=()=>paint(0);return im});
let D=25*60e3,el=0,run=false,last=0,shown=-1,sessions=0,flipping=false;
const paint=n=>{const im=imgs[n];if(!im.complete||!im.naturalWidth)return;shown=n;x.drawImage(im,0,0,cv.width,cv.height)};
new ResizeObserver(()=>{const d=Math.min(devicePixelRatio||1,2);cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;shown=-1}).observe(cv);
const fmt=ms=>{const s=Math.ceil(ms/1000);return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`};
const ui=()=>{tEl.textContent=fmt(D-el);go.textContent=run?"Pause":el>0&&el<D?"Resume":"Start";dots.forEach((d,i)=>d.classList.toggle("on",i<sessions));nEl.textContent=Math.min(4,sessions+1)};
const restart=()=>{el=0;shown=-1;ui()};
const flip=()=>{if(flipping)return;run=false;if(red||el===0){restart();st.textContent="Turned over. Ready.";return}
  flipping=true;glass.classList.add("flip");st.textContent="Turning it over…"};
cv.addEventListener("transitionend",()=>{if(!flipping)return;cv.style.transition="none";glass.classList.remove("flip");restart();void cv.offsetWidth;cv.style.transition="";flipping=false;st.textContent="Turned over. Ready."});
go.onclick=()=>{if(flipping)return;if(el>=D)restart();run=!run;last=performance.now();st.textContent=run?"Sand is running. Stay with it.":"Paused.";ui()};
fl.onclick=flip;
segs.forEach(b=>b.onclick=()=>{segs.forEach(s=>s.setAttribute("aria-pressed",s===b));D=+b.dataset.m*60e3;run=false;restart();st.textContent=`${b.dataset.m} minute${b.dataset.m==="1"?"":"s"}. Press start.`});
(function loop(t){requestAnimationFrame(loop);
  if(run){el=Math.min(D,el+(t-last));if(el>=D){run=false;sessions=Math.min(4,sessions+1);st.textContent=sessions>=4?"Four sessions. Take a long break.":"Time. Flip it for the next one."}ui()}last=t;
  const n=Math.round(el/D*(FRAMES-1));if(n!==shown)paint(n)})(performance.now());
ui();
})();
</script>

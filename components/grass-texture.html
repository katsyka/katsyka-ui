<style>
.bg-gtx{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;--ink:#fbfff2;--fb:#2e5a24;--ink2:var(--ink);background:var(--fb);color:var(--ink);isolation:isolate;font:16px/1.5 Geist,system-ui,sans-serif}
.bg-gtx canvas,.bg-gtx>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.bg-gtx>img{display:none;filter:none}
.bg-gtx.nogl canvas{display:none}.bg-gtx.nogl>img{display:block}
.bg-gtx-nav{display:flex;align-items:center;gap:28px;padding:20px clamp(16px,4vw,48px)}
.bg-gtx-nav nav{display:flex;gap:22px}
.bg-gtx-nav b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.bg-gtx-nav a{color:inherit;text-decoration:none;font-size:14px;opacity:.72;transition:opacity .15s ease-out}.bg-gtx-nav a:hover{opacity:1}
.bg-gtx-main{flex:1;display:grid;padding:clamp(24px,5vw,64px) clamp(16px,4vw,48px) clamp(32px,6vw,72px)}
.bg-gtx-eye{margin:0;font:500 11px/1.4 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.bg-gtx-sub{font-size:17px;line-height:1.55;max-width:44ch;margin:0;opacity:.8;text-wrap:pretty}
.bg-gtx-mono{font:13px "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.bg-gtx-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--ink);color:var(--fb);font:600 15px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease-out,opacity .15s ease-out}
.bg-gtx-btn:active{transform:scale(.97)}.bg-gtx-ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink) 35%,transparent)}
.bg-gtx-card{background:color-mix(in oklab,var(--fb) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in oklab,var(--ink) 12%,transparent);border-radius:16px;padding:20px}
.bg-gtx-card>.bg-gtx-eye:first-child{margin-bottom:10px}
.bg-gtx-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.bg-gtx-pal{margin-left:auto;display:flex;gap:2px}
.bg-gtx-pal button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.bg-gtx-pal button i{width:18px;height:18px;border-radius:50%;background:var(--g);box-shadow:0 0 0 1px color-mix(in oklab,var(--ink) 30%,transparent);transition:transform .15s ease-out}
.bg-gtx-pal button[aria-pressed=true] i{box-shadow:0 0 0 2px var(--fb),0 0 0 3.5px var(--ink)}
.bg-gtx :focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:760px){.bg-gtx-main{grid-template-columns:1fr!important;gap:28px!important}.bg-gtx-nav nav{display:none}}

.bg-gtx-main{grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:48px;align-items:start}
.bg-gtx h1{font:400 clamp(44px,6.5vw,88px)/.95 "Instrument Serif",serif;letter-spacing:-.02em;margin:14px 0 0;max-width:11ch}
.bg-gtx-card{padding:24px}.bg-gtx-card h2{font:600 20px Geist,system-ui,sans-serif;margin:0 0 6px}
.bg-gtx-opts{display:grid;gap:8px;margin:20px 0;border:0;padding:0}.bg-gtx-opts legend{font-size:13px;opacity:.7;margin-bottom:8px}
.bg-gtx-opts label{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 14px;border-radius:10px;border:1px solid color-mix(in oklab,var(--ink) 18%,transparent);cursor:pointer;font-size:15px}
.bg-gtx-opts label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.bg-gtx-opts input{accent-color:var(--ink);margin:0 10px 0 0}
.bg-gtx-opts span{font-variant-numeric:tabular-nums}.bg-gtx-card .bg-gtx-btn{width:100%}

</style>
<section class="bg-gtx">
  <canvas aria-hidden="true"></canvas>
  <header class="bg-gtx-nav"><b>Verge Seed Co.</b><nav aria-label="Verge Seed Co."><a href="#">Lawns</a><a href="#">Meadows</a><a href="#">Guides</a></nav><div class="bg-gtx-pal" role="group" aria-label="Colour"><button type="button" aria-pressed="true" data-k="#0e2410,#3f8a2c,#c9ec7a" style="--g:linear-gradient(135deg,#0e2410,#3f8a2c)" aria-label="Spring"><i></i></button><button type="button" aria-pressed="false" data-k="#1d2a0c,#7a8f23,#e9d77a" style="--g:linear-gradient(135deg,#1d2a0c,#7a8f23)" aria-label="Summer"><i></i></button><button type="button" aria-pressed="false" data-k="#0f1f22,#4f7f7a,#e6f4ef" style="--g:linear-gradient(135deg,#0f1f22,#4f7f7a)" aria-label="Frost"><i></i></button></div></header>
  <main class="bg-gtx-main">
<div><p class="bg-gtx-eye">Shade mix · sow March to May</p><h1>Stays green under the oak tree.</h1></div>
<form class="bg-gtx-card" onsubmit="return false"><h2>Shade mix lawn seed</h2><p class="bg-gtx-sub" style="margin:0">Fine fescues that cope with four hours of light a day.</p>
<fieldset class="bg-gtx-opts"><legend>Bag size</legend>
<label><span><input type="radio" name="sz" checked>1 kg · 30 m²</span><span>€14</span></label>
<label><span><input type="radio" name="sz">2.5 kg · 75 m²</span><span>€29</span></label>
<label><span><input type="radio" name="sz">5 kg · 150 m²</span><span>€52</span></label></fieldset>
<button class="bg-gtx-btn" type="submit">Add to basket</button></form>
</main>
</section>
<script>
(()=>{
const S=document.currentScript?document.currentScript.previousElementSibling:document.querySelector(".bg-gtx");
const root=S&&S.classList.contains("bg-gtx")?S:document.querySelector(".bg-gtx");
const cv=root.querySelector("canvas"),gl=cv.getContext("webgl",{antialias:false});
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches,IMG=false;
const off=()=>root.classList.add("nogl");
if(!gl)return off();
const FS="precision highp float;uniform vec2 r,m,us;uniform float t,ld;uniform sampler2D u;uniform vec3 k0,k1,k2;\nfloat h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}\nvec2 h2(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}\nfloat n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\nfloat fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=mat2(.8,.6,-.6,.8)*p*2.03+1.7;a*=.5;}return v;}\nvec2 cover(vec2 q){float ra=r.x/r.y,ia=us.x/us.y;vec2 s=ra>ia?vec2(1.,ia/ra):vec2(ra/ia,1.);return (q-.5)*s+.5;}\nvec3 img(vec2 q){return texture2D(u,clamp(q,.001,.999)).rgb;}\nfloat lum(vec3 c){return dot(c,vec3(.299,.587,.114));}\n\nvoid main(){vec2 p=gl_FragCoord.xy/r.y;float ar=r.x/r.y;vec3 col=k0*.5;float mx=m.x*ar;\nfor(int l=0;l<8;l++){float L=float(l);float yb=1.08-L*.16;float H=.34+L*.012;float k=(p.y-yb)/H;if(k<0.||k>1.)continue;\nfloat d=90.-L*6.;float wind=(n(vec2(p.x*1.6+t*.4,L*3.))-.5)*.1+sin(t*1.3+p.x*3.+L)*.008;float dx=p.x-mx;float push=exp(-dx*dx*60.)*sign(dx)*.07*exp(-abs(p.y-m.y)*3.);\nfloat x=p.x-k*k*(wind+push)+L*.37;float id=floor(x*d);float hr=.55+.45*h(vec2(id,L));float f=fract(x*d)-.5-(h(vec2(id,L+9.))-.5)*.5;\nfloat kk=k/hr;float w=.42*(1.-kk);if(kk<1.&&abs(f)<w){float sh=.55+.45*L/7.;vec3 b=mix(k0,k1,.3+.5*kk)*mix(.8,1.15,h(vec2(id,L+3.)));b=mix(b,k2,pow(kk,3.)*.55);b*=sh*(.6+.4*kk);b*=.85+.3*smoothstep(0.,w,w-abs(f));col=b;}}\ngl_FragColor=vec4(col,1);}";
const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
const P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}"));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(P);
if(!gl.getProgramParameter(P,gl.LINK_STATUS))return off();
gl.useProgram(P);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};["r","m","us","t","ld","k0","k1","k2"].forEach(k=>U[k]=gl.getUniformLocation(P,k));
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
let fr=0,ready=!IMG,vis=true,raf=0,t0=performance.now(),mx=.5,my=.5,sx=.5,sy=.5,ld=0,ldT=0;
const pal=k=>{k.split(",").forEach((c,i)=>gl.uniform3fv(U["k"+i],hex(c)));if(RM)draw()};
if(IMG){const im=root.querySelector("img"),tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,...p));
  const go=()=>{try{gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im)}catch(e){return off()}gl.uniform2f(U.us,im.naturalWidth,im.naturalHeight);ready=true;ldT=performance.now();loop()};
  im.complete&&im.naturalWidth?go():(im.onload=go,im.onerror=off)}
function size(){const d=Math.min(devicePixelRatio||1,1.5)*1,w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(U.r,w,h)}
function draw(){if(!ready)return;size();const now=performance.now();sx+=(mx-sx)*.06;sy+=(my-sy)*.06;
  gl.uniform1f(U.t,RM?8:(now-t0)/1000);gl.uniform2f(U.m,sx,sy);gl.uniform1f(U.ld,IMG?Math.min(1,(now-ldT)/900):1);gl.drawArrays(gl.TRIANGLES,0,3)}
function loop(){cancelAnimationFrame(raf);if(RM){draw();if(IMG&&performance.now()-ldT<1000)raf=requestAnimationFrame(loop);return}if(!vis||document.hidden)return;if(fr++%1===0)draw();raf=requestAnimationFrame(loop)}
root.addEventListener("pointermove",e=>{const b=root.getBoundingClientRect();mx=(e.clientX-b.left)/b.width;my=1-(e.clientY-b.top)/b.height});
root.addEventListener("pointerleave",()=>{mx=.5;my=.5});
new IntersectionObserver(([e])=>{vis=e.isIntersecting;loop()}).observe(root);
document.addEventListener("visibilitychange",loop);
new ResizeObserver(()=>{if(RM)draw()}).observe(root);
root.querySelectorAll("[data-tg]").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")));
root.querySelectorAll("[data-one]").forEach(b=>b.addEventListener("click",()=>b.parentNode.querySelectorAll("[data-one]").forEach(x=>x.setAttribute("aria-pressed",x===b))));
const btns=[...root.querySelectorAll("[data-k]")];
btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.setAttribute("aria-pressed",x===b));pal(b.dataset.k);const s=root.style;["ink","fb"].forEach(k=>b.dataset[k]?s.setProperty("--"+k,b.dataset[k]):s.removeProperty("--"+k))});
pal("#0e2410,#3f8a2c,#c9ec7a");loop();
})();
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.ig{align-items:start}.ig-w{width:min(760px,100%);display:grid;gap:16px}.ig-w h1{margin:0;font-size:24px;letter-spacing:-.02em}
.ig-tb{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.ig-s{display:flex;gap:8px;align-items:center;height:40px;padding:0 12px;border:1px solid var(--ctl);border-radius:10px;color:var(--mu);background:var(--bg);flex:1;min-width:200px}.ig-s input{border:0;outline:0;background:none;font-size:16px;color:var(--fg);flex:1;min-width:0}.ig-s:focus-within{border-color:var(--ac)}
.ig-f{display:flex;gap:4px}.ig-f button{height:34px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--mu)}.ig-f [aria-pressed=true]{background:var(--sf2);color:var(--fg)}
.ig-l{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.ig-l li{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}.ig-l li:first-child{border:0}
.ig-lg{width:44px;height:44px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:750;font-size:16px}.ig-l div{display:grid;gap:2px}.ig-l small{color:var(--mu);font-size:13px}.ig-l .on small{color:var(--ok)}.ig-l .em{display:block;text-align:center;color:var(--mu);padding:24px}
.ig-d{width:min(420px,calc(100% - 32px));border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--bg);color:var(--fg)}.ig-d::backdrop{background:#0006}.ig-d[open]{animation:igd .2s cubic-bezier(.23,1,.32,1)}@keyframes igd{from{opacity:0;transform:scale(.97)}}.ig-d h2{margin:0 0 4px;font-size:19px}.ig-d p{margin:0 0 12px;font-size:14px}
.ig-sc{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px;font-size:14px}.ig-sc li{display:flex;gap:10px;align-items:center}.ig-sc .i{color:var(--ok)}.ig-ac{display:flex;gap:8px;justify-content:flex-end}
</style>
<div class="k ig"><div class="ig-w"><h1>Integrations</h1><div class="ig-tb"><label class="ig-s"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search apps" aria-label="Search apps"></label><div class="ig-f" role="group" aria-label="Category" id="cf"></div></div><ul class="ig-l" id="l"></ul></div>
<dialog class="ig-d" id="dl" aria-labelledby="dh"><h2 id="dh"></h2><p class="mu">This app will be able to:</p><ul id="sc" class="ig-sc"></ul><div class="ig-ac"><button class="b gh" id="cx">Cancel</button><button class="b ac" id="ok">Allow and connect</button></div></dialog></div>
<script>
const A=[["Slack","Chat","#4a154b","Post updates to channels",["Post messages to channels you choose","Read channel names"],1,"Synced 2 min ago"],["GitHub","Dev","#24292f","Link commits and pull requests",["Read repository metadata","Read pull request status"],1,"Synced 1 h ago"],["Figma","Design","#a259ff","Embed live frames",["View files you share"]],["Linear","Dev","#5e6ad2","Sync issues both ways",["Read and create issues","Read team names"]],["Google Drive","Files","#1a73e8","Attach docs and sheets",["View files you pick"]],["Zoom","Chat","#2d8cff","Start calls from tasks",["Create meetings on your behalf"]]];
let cat='',cur=-1;const l=document.getElementById('l'),q=document.getElementById('q'),dl=document.getElementById('dl');
document.getElementById('cf').innerHTML=['All',...new Set(A.map(a=>a[1]))].map((c,i)=>`<button aria-pressed="${!i}" data-c="${i?c:''}">${c}</button>`).join('');
function draw(){const L=A.map((a,i)=>[a,i]).filter(([a])=>(!cat||a[1]===cat)&&(a[0]+a[3]).toLowerCase().includes(q.value.toLowerCase()));l.innerHTML=L.length?L.map(([a,i])=>`<li class="${a[5]?'on':''}"><span class="ig-lg" style="--c:${a[2]}">${a[0][0]}</span><div><b>${a[0]}</b><small>${a[5]?'● Connected · '+a[6]:a[3]}</small></div>${a[5]?(a[7]?`<span style="display:flex;gap:6px"><button class="b gh sm" data-k="${i}">Keep</button><button class="b sm" style="background:var(--err);color:#fff" data-y="${i}">Disconnect</button></span>`:`<button class="b gh sm" data-d="${i}">Disconnect</button>`):`<button class="b sec sm" data-c="${i}">Connect</button>`}</li>`).join(''):`<li class="em">No apps match “${q.value.replace(/</g,'&lt;')}”. <a href="#">Request an integration</a></li>`}
l.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.c!==undefined&&b.closest('li')){cur=+d.c;const a=A[cur];document.getElementById('dh').textContent=`Connect ${a[0]}`;document.getElementById('sc').innerHTML=a[4].map(s=>`<li><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M20 6 9 17l-5-5"/></svg>${s}</li>`).join('');dl.showModal();return}if(d.d){A[d.d][7]=1}if(d.k){A[d.k][7]=0}if(d.y){A[d.y][5]=0;A[d.y][7]=0}draw()};
document.getElementById('cx').onclick=()=>dl.close();document.getElementById('ok').onclick=e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Connecting…';setTimeout(()=>{A[cur][5]=1;A[cur][6]='Synced just now';dl.close();b.disabled=false;b.textContent='Allow and connect';draw()},800)};
document.getElementById('cf').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#cf button').forEach(x=>x.setAttribute('aria-pressed',x===b));cat=b.dataset.c;draw()};q.oninput=draw;draw();
</script>

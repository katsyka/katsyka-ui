<style>
.dn{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.dn :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dn ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.dn *,.dn *::before,.dn *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.dn{min-height:100vh;display:grid;place-items:center;padding:32px 16px;transition:background .6s,color .6s}
.dn.dark{color-scheme:dark}.dn.light{color-scheme:light}
.dn-card{width:min(420px,100%);padding:24px;border-radius:24px;background:var(--sf);box-shadow:var(--shadow);transition:background .6s}
.dn-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.dn-row b{display:block;font-size:16px;font-weight:600}.dn-row small{display:block;font-size:13.5px;color:var(--mu);margin-top:2px}
.dn-sw{--k:0;position:relative;flex:none;width:96px;height:44px;border-radius:999px;border:0;padding:0;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in oklab,#5cb6ff calc((1 - var(--k)) * 100%),#0b1638),color-mix(in oklab,#a8dcff calc((1 - var(--k)) * 100%),#1c2a5a));box-shadow:inset 0 2px 6px #0004,0 0 0 1px #0000001a}
.dn-sw:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.dn-orb{position:absolute;top:5px;left:5px;width:34px;height:34px;border-radius:50%;transform:translateX(calc(var(--k) * 52px)) rotate(calc(var(--k) * 200deg));transition:transform .7s cubic-bezier(.6,-.25,.3,1.3);
  background:color-mix(in oklab,#ffd84d calc((1 - var(--k)) * 100%),#e6e9f2);box-shadow:inset -3px -3px 6px #0002,0 0 0 calc((1 - var(--k)) * 6px) #ffe58f55,0 0 0 calc((1 - var(--k)) * 12px) #ffe58f2a}
.dn-orb i{position:absolute;border-radius:50%;background:#c5cad8;opacity:var(--k);transition:opacity .5s}
.dn-orb i:nth-child(1){width:9px;height:9px;left:7px;top:8px}.dn-orb i:nth-child(2){width:6px;height:6px;left:19px;top:19px}.dn-orb i:nth-child(3){width:4px;height:4px;left:9px;top:22px}
.dn-cl{position:absolute;height:12px;border-radius:99px;background:#fff;transform:translateY(calc(var(--k) * 40px));transition:transform .6s var(--ease)}
.dn-cl::before{content:"";position:absolute;width:55%;height:180%;left:18%;bottom:30%;border-radius:50%;background:inherit}
.dn-cl.a{width:30px;right:10px;top:22px}.dn-cl.b{width:22px;right:30px;top:28px;opacity:.85;transition-delay:.05s}
.dn-stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:var(--k);transform:translateY(calc((1 - var(--k)) * -20px));transition:opacity .5s .15s,transform .6s .1s}
.dn-stars i:nth-child(2n){animation:dn-tw 2s ease-in-out infinite}
@keyframes dn-tw{50%{opacity:calc(var(--k) * .3)}}
.dn-sw[aria-checked=true]{--k:1}
.dn-sw{transition:--k .7s}
@property --k{syntax:"<number>";inherits:true;initial-value:0}
.dn-prev{margin-top:20px;padding:16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);transition:background .6s,border-color .6s}
.dn-prev h4{margin:0 0 6px;font-size:15px}.dn-prev p{margin:0 0 12px;color:var(--mu);font-size:14px;line-height:1.5}
.dn-prev button{height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--ac);color:var(--ac-fg);font:600 14px Geist,sans-serif;cursor:pointer;transition:background .6s,color .6s}
.dn-sys{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13.5px;color:var(--mu);cursor:pointer;user-select:none}
.dn-sys input{width:18px;height:18px;accent-color:var(--ac)}
</style>
<section class="dn light"><div class="dn-card">
  <div class="dn-row"><div><b id="dnL">Dark mode</b><small data-o>Light theme is on</small></div>
    <button class="dn-sw" role="switch" aria-checked="false" aria-labelledby="dnL"><span class="dn-stars" aria-hidden="true"><i style="left:14px;top:10px"></i><i style="left:26px;top:22px"></i><i style="left:40px;top:9px"></i><i style="left:20px;top:32px"></i><i style="left:34px;top:30px"></i></span>
      <span class="dn-cl a"></span><span class="dn-cl b"></span><span class="dn-orb" aria-hidden="true"><i></i><i></i><i></i></span></button></div>
  <div class="dn-prev"><h4>Live preview</h4><p>This card uses the same tokens as every Katsyka UI core component, so the switch re-themes it for real.</p><button>Primary action</button></div>
  <label class="dn-sys"><input type="checkbox"> Follow system setting</label>
</div></section>
<script>
(()=>{
const root=document.querySelector(".dn"),sw=root.querySelector(".dn-sw"),out=root.querySelector("[data-o]"),sys=root.querySelector(".dn-sys input"),mq=matchMedia("(prefers-color-scheme: dark)");
const set=d=>{sw.setAttribute("aria-checked",d);root.classList.toggle("dark",d);root.classList.toggle("light",!d);out.textContent=(d?"Dark":"Light")+" theme is on"+(sys.checked?" (system)":"")};
sw.onclick=()=>{sys.checked=false;set(sw.getAttribute("aria-checked")!=="true")};
sys.onchange=()=>{sw.disabled=sys.checked;sw.style.opacity=sys.checked?.6:1;if(sys.checked)set(mq.matches);else set(sw.getAttribute("aria-checked")==="true")};
mq.addEventListener("change",()=>sys.checked&&set(mq.matches));
set(false);
})();
</script>

<style>
.rc{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.rc :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.rc ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.rc *,.rc *::before,.rc *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.rc{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.rc-pn{width:min(640px,100%);display:grid;gap:28px}
.rc fieldset{border:0;margin:0;padding:0;min-width:0}
.rc legend{padding:0;margin-bottom:12px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rc-card{position:relative;display:flex;flex-direction:column;gap:3px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;box-shadow:0 1px 2px #0000000a;transition:border-color .15s,box-shadow .2s,background-color .15s}
.rc-card:hover{border-color:color-mix(in oklab,var(--line),var(--fg) 25%)}
.rc-card input{position:absolute;opacity:0;width:1px;height:1px}
.rc-card .rd{position:absolute;top:16px;right:16px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ctl);transition:border .15s}
.rc-card .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ac);transform:scale(0);transition:transform .2s var(--ease)}
.rc-card:has(input:checked){border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 4px 14px -6px color-mix(in oklab,var(--ac) 45%,transparent);background:color-mix(in oklab,var(--ac-sf) 50%,var(--bg))}
.rc-card:has(input:checked) .rd{border-color:var(--ac)}
.rc-card:has(input:checked) .rd::after{transform:scale(1)}
.rc-card:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.rc-card:has(input:disabled){opacity:.5;cursor:not-allowed}
.rc-card b{font-size:14.5px;font-weight:600;padding-right:24px}
.rc-card small{font-size:13px;color:var(--mu);line-height:1.45}
.rc-card .pr{margin-top:10px;font-size:22px;font-weight:650;letter-spacing:-.03em}
.rc-card .pr span{font-size:13px;font-weight:450;color:var(--mu);letter-spacing:0}
.rc-card .tag{align-self:flex-start;margin-top:8px;padding:2px 8px;border-radius:99px;background:var(--ok-sf);color:var(--ok);font-size:11.5px;font-weight:600}
.rc-list{display:grid;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.rc-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:background-color .15s}
.rc-row+.rc-row{border-top:1px solid var(--line)}
.rc-row:hover{background:var(--sf)}
.rc-row input{position:absolute;opacity:0;width:1px;height:1px}
.rc-row .rd{flex:none;position:relative;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ctl)}
.rc-row .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ac);transform:scale(0);transition:transform .2s var(--ease)}
.rc-row:has(input:checked){background:color-mix(in oklab,var(--ac-sf) 50%,var(--bg))}
.rc-row:has(input:checked) .rd{border-color:var(--ac)}.rc-row:has(input:checked) .rd::after{transform:scale(1)}
.rc-row:has(input:focus-visible) .rd{outline:2px solid var(--focus);outline-offset:2px}
.rc-row .ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sf2)}
.rc-row .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rc-row b{display:block;font-size:14.5px;font-weight:550}.rc-row small{font-size:13px;color:var(--mu)}
.rc-row em{margin-left:auto;font-style:normal;font:500 13px "Geist Mono",monospace;color:var(--mu);white-space:nowrap}
@media (max-width:600px){.rc-grid{grid-template-columns:1fr}}
</style>
<div class="rc">
  <div class="rc-pn">
    <fieldset><legend>Plan</legend>
      <div class="rc-grid">
        <label class="rc-card"><input type="radio" name="rcPlan" value="hobby"><span class="rd"></span><b>Hobby</b><small>Personal projects and experiments.</small><div class="pr">$0 <span>/ mo</span></div></label>
        <label class="rc-card"><input type="radio" name="rcPlan" value="pro" checked><span class="rd"></span><b>Pro</b><small>For professionals shipping weekly.</small><div class="pr">$20 <span>/ mo</span></div><span class="tag">Most popular</span></label>
        <label class="rc-card"><input type="radio" name="rcPlan" value="team"><span class="rd"></span><b>Team</b><small>Shared workspaces and roles.</small><div class="pr">$48 <span>/ mo</span></div></label>
      </div>
    </fieldset>
    <fieldset><legend>Delivery</legend>
      <div class="rc-list">
        <label class="rc-row"><input type="radio" name="rcShip" checked><span class="rd"></span><span class="ic"><svg viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9M19 18h2a1 1 0 0 0 1-1v-3.6a1 1 0 0 0-.2-.6l-3.5-4.4A1 1 0 0 0 17.5 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></span><span><b>Standard</b><small>4–6 business days</small></span><em>Free</em></label>
        <label class="rc-row"><input type="radio" name="rcShip"><span class="rd"></span><span class="ic"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg></span><span><b>Express</b><small>1–2 business days</small></span><em>$12.00</em></label>
        <label class="rc-row"><input type="radio" name="rcShip"><span class="rd"></span><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></span><span><b>Pick up in store</b><small>Ready today after 4 pm</small></span><em>Free</em></label>
      </div>
    </fieldset>
  </div>
</div>

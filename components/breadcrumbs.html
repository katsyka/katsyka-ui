<style>
.bc{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.bc :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bc ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.bc *,.bc *::before,.bc *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.bc{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.bc-pn{width:min(680px,100%);display:grid;gap:14px}
.bc-c{padding:20px 22px;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.bc-lb{font:500 11px/1 "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:14px}
.bc ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:14px}
.bc li{display:flex;align-items:center;gap:2px;min-width:0}
.bc li a,.bc li button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px;border-radius:6px;color:var(--mu);text-decoration:none;border:0;background:none;font:inherit;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s}
.bc li a:hover,.bc li button:hover{color:var(--fg);background:var(--sf2)}
.bc li [aria-current]{color:var(--fg);font-weight:550;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .sep{flex:none;width:14px;height:14px;fill:none;stroke:color-mix(in oklab,var(--mu) 60%,var(--bg));stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bc .sl{color:color-mix(in oklab,var(--mu) 50%,var(--bg));padding:0 2px}
.bc li svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bc-more{position:relative}
.bc-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:5;min-width:180px;padding:4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);box-shadow:0 12px 28px -8px #0003;display:none}
.bc-menu.on{display:block}
.bc-menu a{display:flex!important;width:100%;height:32px!important}
.bc-pill ol{gap:6px}
.bc-pill li a,.bc-pill li [aria-current]{height:30px;padding:0 12px;border-radius:99px;background:var(--sf);border:1px solid var(--line)}
.bc-pill li [aria-current]{background:var(--fg);color:var(--bg);border-color:var(--fg);display:inline-flex;align-items:center}
.bc-file ol{font:500 13px "Geist Mono",monospace}
.bc-file li a{height:26px;padding:0 4px}
.bc-file .sl{font-family:"Geist Mono",monospace}
.bc-file .br{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;margin-right:8px;border-radius:6px;background:var(--ac-sf);color:var(--ac);font-weight:500}
.bc-file .br svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<div class="bc">
  <div class="bc-pn">
    <div class="bc-c"><div class="bc-lb">Chevron with home icon</div>
      <nav aria-label="Breadcrumb"><ol>
        <li><a href="#" aria-label="Home"><svg class="i" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></a><svg class="sep" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></li>
        <li><a href="#">Projects</a><svg class="sep" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></li>
        <li><a href="#">Website redesign</a><svg class="sep" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></li>
        <li><span aria-current="page">Settings</span></li>
      </ol></nav></div>
    <div class="bc-c"><div class="bc-lb">Collapsed · slash</div>
      <nav aria-label="Breadcrumb"><ol>
        <li><a href="#">Docs</a><span class="sl" aria-hidden="true">/</span></li>
        <li class="bc-more"><button aria-label="Show 3 more levels" aria-expanded="false" aria-haspopup="true">…</button><span class="sl" aria-hidden="true">/</span>
          <div class="bc-menu"><a href="#">Components</a><a href="#">Forms</a><a href="#">Inputs</a></div></li>
        <li><a href="#">Text field</a><span class="sl" aria-hidden="true">/</span></li>
        <li><span aria-current="page">Validation</span></li>
      </ol></nav></div>
    <div class="bc-c bc-pill"><div class="bc-lb">Pill</div>
      <nav aria-label="Breadcrumb"><ol>
        <li><a href="#">Shop</a></li><li><svg class="sep" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></li>
        <li><a href="#">Outdoor</a></li><li><svg class="sep" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></li>
        <li><span aria-current="page">Field Bottle 750</span></li>
      </ol></nav></div>
    <div class="bc-c bc-file"><div class="bc-lb">File path</div>
      <nav aria-label="File path"><ol>
        <li><span class="br"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10a6 6 0 0 1-6 6H8"/></svg>main</span></li>
        <li><a href="#">katsyka-ui</a><span class="sl">/</span></li><li><a href="#">src</a><span class="sl">/</span></li><li><a href="#">components</a><span class="sl">/</span></li><li><span aria-current="page">Button.tsx</span></li>
      </ol></nav></div>
  </div>
</div>
<script>
document.querySelectorAll('.bc a[href="#"]').forEach(a=>a.addEventListener("click",e=>e.preventDefault()));
const mb=document.querySelector(".bc-more button"),mm=document.querySelector(".bc-menu");
mb.addEventListener("click",()=>{const o=!mm.classList.contains("on");mm.classList.toggle("on",o);mb.setAttribute("aria-expanded",o);if(o)mm.querySelector("a").focus()});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".bc-more")){mm.classList.remove("on");mb.setAttribute("aria-expanded",false)}});
mm.addEventListener("keydown",e=>{if(e.key==="Escape"){mm.classList.remove("on");mb.setAttribute("aria-expanded",false);mb.focus()}});
</script>

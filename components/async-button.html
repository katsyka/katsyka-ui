<style>
.ab{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.ab :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ab ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.ab *,.ab *::before,.ab *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.ab{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.ab-pn{width:min(560px,100%);background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ab-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;border-top:1px solid var(--line)}
.ab-row:first-child{border-top:0}
.ab-row b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ab-row small{display:block;margin-top:2px;font-size:13px;color:var(--mu)}
.ab-b{position:relative;flex:none;height:40px;padding:0 18px;border:0;border-radius:10px;font:550 14px/1 Geist,system-ui,sans-serif;cursor:pointer;overflow:hidden;display:inline-grid;grid-template:100%/100%;transition:background-color .25s,color .25s,width .35s var(--ease),transform .1s}
.ab-b:active{transform:translateY(1px)}
.ab-b>span{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .35s var(--ease),opacity .25s}
.ab-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.ab-b .s1,.ab-b .s2,.ab-b .s3{opacity:0;transform:translateY(110%)}
.ab-b[data-s=loading] .s0,.ab-b[data-s=done] .s0,.ab-b[data-s=error] .s0{opacity:0;transform:translateY(-110%)}
.ab-b[data-s=loading] .s1,.ab-b[data-s=done] .s2,.ab-b[data-s=error] .s3{opacity:1;transform:none}
.ab-b[data-s=done] .s1,.ab-b[data-s=error] .s1{opacity:0;transform:translateY(-110%)}
.ab-b.pri{background:var(--fg);color:var(--bg)}
.ab-b.pri:hover{background:color-mix(in oklab,var(--fg) 85%,var(--bg))}
.ab-b.acc{background:var(--ac);color:var(--ac-fg)}
.ab-b.acc:hover{background:var(--ac-h)}
.ab-b.out{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--line),var(--fg) 14%)}
.ab-b.out:hover{background:var(--sf)}
.ab-b[data-s=done]{background:var(--ok);color:light-dark(#fff,#052e14)}
.ab-b[data-s=error]{background:var(--err);color:light-dark(#fff,#2a0606);animation:ab-shake .4s}
.ab-b[data-s=loading]{cursor:progress}
.ab-sp{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:ab-r .7s linear infinite}
.ab-ck path{stroke-dasharray:24;stroke-dashoffset:24}
.ab-b[data-s=done] .ab-ck path{animation:ab-d .35s .1s forwards}
.ab-bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:currentColor;opacity:.5}
.ab-b[data-s=loading] .ab-bar{animation:ab-p var(--t,1.6s) linear forwards}
@keyframes ab-r{to{transform:rotate(1turn)}}
@keyframes ab-d{to{stroke-dashoffset:0}}
@keyframes ab-p{to{width:100%}}
@keyframes ab-shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.ab-msg{padding:0 24px 0;max-height:0;overflow:hidden;font-size:13px;color:var(--err);transition:max-height .3s var(--ease),padding .3s}
.ab-msg.on{max-height:60px;padding:0 24px 18px}
.ab-ft{display:flex;align-items:center;gap:8px;padding:12px 24px;background:var(--sf);border-top:1px solid var(--line);font-size:12.5px;color:var(--mu)}
.ab-ft kbd{font:500 11px "Geist Mono",monospace;padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
@media (max-width:480px){.ab-row{flex-direction:column;align-items:flex-start}}
</style>
<div class="ab">
  <div class="ab-pn">
    <div class="ab-row"><div><b>Profile</b><small>Changes sync to every device.</small></div>
      <button class="ab-b pri" data-ok="1" data-t="1400"><span class="s0">Save changes</span><span class="s1"><i class="ab-sp" aria-hidden="true"></i>Saving</span><span class="s2"><svg class="ab-ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Saved</span><span class="s3">Try again</span><i class="ab-bar"></i></button></div>
    <div class="ab-row"><div><b>Production deploy</b><small>Simulates a failing build.</small></div>
      <button class="ab-b acc" data-ok="0" data-t="1800"><span class="s0"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Deploy</span><span class="s1"><i class="ab-sp" aria-hidden="true"></i>Building</span><span class="s2"><svg class="ab-ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Live</span><span class="s3"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Retry</span><i class="ab-bar"></i></button></div>
    <div class="ab-msg" role="alert"></div>
    <div class="ab-row"><div><b>Invite teammates</b><small>Sends 3 invitations by email.</small></div>
      <button class="ab-b out" data-ok="1" data-t="1100"><span class="s0">Send invites</span><span class="s1"><i class="ab-sp" aria-hidden="true"></i>Sending</span><span class="s2"><svg class="ab-ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Sent</span><span class="s3">Try again</span><i class="ab-bar"></i></button></div>
    <div class="ab-ft"><span aria-live="polite" class="ab-live"></span><span style="margin-left:auto">Width is locked while busy so layout never jumps.</span></div>
  </div>
</div>
<script>
const msg=document.querySelector(".ab-msg"),live=document.querySelector(".ab-live");
let fails=0;
document.querySelectorAll(".ab-b").forEach(b=>{
  b.addEventListener("click",()=>{
    if(b.dataset.s==="loading"||b.dataset.s==="done")return;
    const t=+b.dataset.t;b.style.setProperty("--t",t+"ms");
    b.dataset.s="loading";b.setAttribute("aria-busy","true");live.textContent=b.querySelector(".s1").textContent+"…";
    if(b.classList.contains("acc"))msg.classList.remove("on");
    setTimeout(()=>{
      b.removeAttribute("aria-busy");
      const ok=b.dataset.ok==="1"||fails>0;
      if(b.dataset.ok==="0"&&!ok){fails++;b.dataset.s="error";msg.textContent="Build failed: missing env var DATABASE_URL. Fixed it for you, retry to continue.";msg.classList.add("on");live.textContent="Failed";return}
      b.dataset.s="done";msg.classList.remove("on");live.textContent=b.querySelector(".s2").textContent;
      setTimeout(()=>{b.dataset.s="";if(b.dataset.ok==="0")fails=0},2200);
    },t);
  });
});
</script>

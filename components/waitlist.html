<style>
.wl{min-height:100vh;display:grid;place-items:center;text-align:center;background:#f3f1ec;color:#141414;padding:40px 16px}
.wl h2{font-size:clamp(40px,6vw,80px);letter-spacing:-.055em;line-height:.95;font-weight:600;margin:0 0 18px}
.wl h2 em{font-family:"Instrument Serif",serif;font-weight:400}
.wl p{color:#6b6862;font-size:17px;margin:0 auto 34px;max-width:440px}
.wl-f{position:relative;display:flex;width:min(440px,100%);margin:0 auto;height:56px;padding:5px;border-radius:99px;background:#fff;box-shadow:0 1px 0 #0000000a,0 10px 30px -12px #0003;border:1px solid #00000012;transition:width .6s cubic-bezier(.7,0,.2,1)}
.wl-f input{flex:1;min-width:0;border:0;background:none;padding:0 18px;font:16px Geist,sans-serif;outline:0;color:#141414;transition:opacity .3s}
.wl-f button{position:relative;flex:none;height:100%;padding:0 22px;border-radius:99px;border:0;background:#141414;color:#f3f1ec;font:600 14.5px Geist,sans-serif;cursor:pointer;transition:width .5s cubic-bezier(.7,0,.2,1),background .4s;white-space:nowrap;overflow:hidden}
.wl-f button i{display:none;width:18px;height:18px;border-radius:50%;border:2px solid #ffffff40;border-top-color:#fff;animation:wl-s .7s linear infinite}
@keyframes wl-s{to{transform:rotate(1turn)}}
.wl-f.load button span{display:none}.wl-f.load button i{display:inline-block}
.wl-f.done{width:280px}.wl-f.done input{opacity:0;pointer-events:none;flex:0;padding:0}
.wl-f.done button{flex:1;background:#1f8f4e}
.wl-f.done button span{display:inline-flex;gap:8px;align-items:center;animation:wl-in .5s .2s both}
@keyframes wl-in{from{opacity:0;transform:translateY(8px)}}
.wl-n{margin-top:22px;font-size:13.5px;color:#7b776f;display:flex;justify-content:center;align-items:center;gap:10px}
.wl-av{display:flex}.wl-av i{width:24px;height:24px;border-radius:50%;border:2px solid #f3f1ec;margin-left:-7px;background:var(--c)}
.wl-n b{font-variant-numeric:tabular-nums;color:#141414;font-weight:600}
</style>
<section class="wl"><div>
  <h2>Be first through <em>the door.</em></h2>
  <p>We're letting people in weekly. Leave your email and we'll save you a seat.</p>
  <form class="wl-f"><input type="email" required placeholder="you@company.com" aria-label="Email"><button><span>Join waitlist</span><i></i></button></form>
  <div class="wl-n"><span class="wl-av"><i style="--c:#ff8a5c"></i><i style="--c:#7a5cff"></i><i style="--c:#3ddc84"></i><i style="--c:#ffd43b"></i></span><span><b data-n>2,481</b> people ahead of you</span></div>
</div></section>
<script>
(()=>{
const f=document.querySelector(".wl-f"),n=document.querySelector("[data-n]");
f.addEventListener("submit",e=>{e.preventDefault();if(f.classList.contains("done"))return;f.classList.add("load");
  setTimeout(()=>{f.classList.replace("load","done");f.querySelector("button span").textContent="✓  You're on the list";
    let v=2481,to=2482,t0=performance.now();(function step(t){const p=Math.min(1,(t-t0)/600);n.textContent=Math.round(v+(to-v)*p).toLocaleString("en");if(p<1)requestAnimationFrame(step)})(t0);
    n.parentElement.lastChild.textContent=" on the list, including you"},1200)});
})();
</script>

<style>
.dp{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.dp :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dp ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.dp *,.dp *::before,.dp *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.dp{min-height:100vh;display:grid;place-items:start center;padding:80px 16px 48px;background:var(--sf)}
.dp-pn{width:min(340px,100%);position:relative}
.dp-pn>label{display:block;font-size:14px;font-weight:550;margin-bottom:6px}
.dp-trg{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid color-mix(in oklab,var(--ctl) 70%,var(--bg));background:var(--bg);color:var(--fg);font:14.5px Geist,system-ui,sans-serif;text-align:left;cursor:pointer;box-shadow:0 1px 2px #0000000a}
.dp-trg:hover{border-color:var(--ctl)}
.dp-trg[aria-expanded=true],.dp-trg:focus-visible{outline:0;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklab,var(--focus) 22%,transparent)}
.dp-trg svg{width:17px;height:17px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dp-trg .ph{color:var(--mu)}
.dp-hint{margin-top:6px;font-size:13px;color:var(--mu)}
.dp-cal{position:absolute;top:76px;left:0;z-index:5;width:316px;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:0 18px 40px -12px #00000040,0 2px 6px #0000001a;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .15s,transform .2s var(--ease)}
.dp-cal.on{opacity:1;transform:none;pointer-events:auto}
.dp-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-hd b{font-size:14.5px;font-weight:600}
.dp-hd button{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--fg);cursor:pointer}
.dp-hd button:hover{background:var(--sf2)}
.dp-hd svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dp-g{width:100%;border-collapse:collapse;table-layout:fixed}
.dp-g th{height:30px;font:500 12px Geist,system-ui,sans-serif;color:var(--mu)}
.dp-g td{padding:1px;text-align:center}
.dp-g button{width:100%;aspect-ratio:1;max-width:40px;border:0;border-radius:9px;background:none;color:var(--fg);font:500 13.5px Geist,system-ui,sans-serif;font-variant-numeric:tabular-nums;cursor:pointer;position:relative;transition:background-color .12s}
.dp-g button:hover{background:var(--sf2)}
.dp-g button.out{color:color-mix(in oklab,var(--mu) 70%,var(--bg))}
.dp-g button.today::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}
.dp-g button[aria-selected=true]{background:var(--fg);color:var(--bg)}
.dp-g button[aria-selected=true].today::after{background:var(--bg)}
.dp-g button[aria-disabled=true]{color:color-mix(in oklab,var(--mu) 55%,var(--bg));text-decoration:line-through;cursor:not-allowed;background:none}
.dp-g button:focus-visible{outline:2px solid var(--focus);outline-offset:0}
.dp-ft{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dp-ft button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 13px Geist,system-ui,sans-serif;cursor:pointer}
.dp-ft button:hover{background:var(--sf)}
</style>
<div class="dp">
  <div class="dp-pn">
    <label id="dpL">Appointment date</label>
    <button class="dp-trg" type="button" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="dpL dpV"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span id="dpV" class="ph">Pick a date</span></button>
    <div class="dp-hint">Weekends and past dates are unavailable.</div>
    <div class="dp-cal" role="dialog" aria-modal="false" aria-label="Choose date">
      <div class="dp-hd"><button type="button" class="pv" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><b aria-live="polite"></b><button type="button" class="nx" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
      <table class="dp-g" role="grid"><thead><tr><th abbr="Monday">Mo</th><th abbr="Tuesday">Tu</th><th abbr="Wednesday">We</th><th abbr="Thursday">Th</th><th abbr="Friday">Fr</th><th abbr="Saturday">Sa</th><th abbr="Sunday">Su</th></tr></thead><tbody></tbody></table>
      <div class="dp-ft"><button type="button" class="td">Today</button><button type="button" class="cl">Clear</button></div>
    </div>
  </div>
</div>
<script>
const trg=document.querySelector(".dp-trg"),V=document.getElementById("dpV"),cal=document.querySelector(".dp-cal"),title=cal.querySelector(".dp-hd b"),tb=cal.querySelector("tbody");
const T=new Date();T.setHours(0,0,0,0);
let view=new Date(T.getFullYear(),T.getMonth(),1),sel=null,foc=new Date(T);
const same=(a,b)=>a&&b&&a.getTime()===b.getTime();
const off=d=>d<T||d.getDay()===0||d.getDay()===6;
const fmtL=d=>d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const draw=(focus)=>{title.textContent=view.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const s=new Date(view);s.setDate(1-((view.getDay()+6)%7));let h="";
  for(let w=0;w<6;w++){h+="<tr>";for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+w*7+i);
    h+=`<td><button type="button" data-t="${d.getTime()}" tabindex="${same(d,foc)?0:-1}" class="${d.getMonth()!==view.getMonth()?"out":""}${same(d,T)?" today":""}" aria-selected="${same(d,sel)}" aria-label="${fmtL(d)}"${off(d)?' aria-disabled="true"':""}>${d.getDate()}</button></td>`}h+="</tr>"}
  tb.innerHTML=h;if(focus)tb.querySelector('[tabindex="0"]')?.focus()};
const open=o=>{cal.classList.toggle("on",o);trg.setAttribute("aria-expanded",o);if(o){foc=new Date(sel||T);view=new Date(foc.getFullYear(),foc.getMonth(),1);draw(true)}};
const pick=d=>{sel=d;V.textContent=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});V.className="";open(false);trg.focus()};
trg.addEventListener("click",()=>open(!cal.classList.contains("on")));
cal.querySelector(".pv").onclick=()=>{view.setMonth(view.getMonth()-1);draw()};
cal.querySelector(".nx").onclick=()=>{view.setMonth(view.getMonth()+1);draw()};
cal.querySelector(".td").onclick=()=>{foc=new Date(T);view=new Date(T.getFullYear(),T.getMonth(),1);draw(true)};
cal.querySelector(".cl").onclick=()=>{sel=null;V.textContent="Pick a date";V.className="ph";draw()};
tb.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.getAttribute("aria-disabled")!=="true")pick(new Date(+b.dataset.t))});
tb.addEventListener("keydown",e=>{const m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];const b=e.target.closest("button");if(!b)return;foc=new Date(+b.dataset.t);
  if(m){e.preventDefault();foc.setDate(foc.getDate()+m)}else if(e.key==="PageUp"||e.key==="PageDown"){e.preventDefault();foc.setMonth(foc.getMonth()+(e.key==="PageUp"?-1:1))}
  else if(e.key==="Home"){e.preventDefault();foc.setDate(foc.getDate()-((foc.getDay()+6)%7))}else if(e.key==="End"){e.preventDefault();foc.setDate(foc.getDate()+6-((foc.getDay()+6)%7))}else return;
  view=new Date(foc.getFullYear(),foc.getMonth(),1);draw(true)});
cal.addEventListener("keydown",e=>{if(e.key==="Escape"){open(false);trg.focus()}});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".dp-pn"))open(false)});
</script>

<style>
.hm{min-height:100vh;display:grid;place-items:center;padding:40px 16px;background:#0b0a09;color:#e7e5e4}
.hm-card{width:min(940px,100%);border-radius:22px;background:#12110f;border:1px solid #ffffff0d;padding:22px 24px}
.hm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hm-top h3{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:600}.hm-top p{margin:3px 0 0;font-size:13px;color:#78716c}
.hm-yr{display:flex;gap:4px}.hm-yr button{height:30px;padding:0 11px;border-radius:8px;border:0;background:none;color:#78716c;font:500 12.5px "Geist Mono",monospace;cursor:pointer}.hm-yr button.on{background:#292524;color:#fafaf9}
.hm-wrap{overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.hm-grid{position:relative;display:grid;grid-template-columns:28px repeat(53,minmax(0,1fr));grid-template-rows:16px repeat(7,auto);gap:3px;min-width:720px}
.hm-grid .m{font:11px "Geist Mono",monospace;color:#57534e;grid-row:1;white-space:nowrap}
.hm-grid .w{font:10.5px "Geist Mono",monospace;color:#57534e;grid-column:1;align-self:center}
.hm-grid i{aspect-ratio:1;border-radius:3px;background:var(--b,#1c1917);outline:1px solid #ffffff06;outline-offset:-1px;opacity:0;transform:scale(.4);animation:hm-in .5s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:var(--d);transition:outline-color .15s}
.hm-grid i:hover{outline:1.5px solid #fafaf9;outline-offset:0}
@keyframes hm-in{to{opacity:1;transform:none}}
.hm-tip{position:fixed;z-index:9;padding:6px 10px;border-radius:8px;background:#fafaf9;color:#1c1917;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-100%) translateY(-8px);transition:opacity .12s}
.hm-tip b{font-weight:600}
.hm-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:16px;flex-wrap:wrap;font-size:12.5px;color:#78716c}
.hm-stats{display:flex;gap:22px}.hm-stats b{display:block;color:#fafaf9;font-size:18px;letter-spacing:-.03em;font-weight:600}
.hm-lg{display:flex;align-items:center;gap:4px}.hm-lg i{width:11px;height:11px;border-radius:3px}
</style>
<div class="hm"><div class="hm-card">
  <div class="hm-top"><div><h3><span data-total>0</span> contributions</h3><p>Hover any day. Switch years to see the grid rebuild.</p></div><div class="hm-yr"><button data-y="2026" class="on">2026</button><button data-y="2025">2025</button><button data-y="2024">2024</button></div></div>
  <div class="hm-wrap"><div class="hm-grid"></div></div>
  <div class="hm-foot"><div class="hm-stats"><span><b data-s="best">0</b>best day</span><span><b data-s="streak">0</b>longest streak</span><span><b data-s="avg">0</b>per active day</span></div>
    <div class="hm-lg">Less <i style="background:#1c1917"></i><i style="background:#5c2a12"></i><i style="background:#9a3d12"></i><i style="background:#e0581f"></i><i style="background:#ffa36b"></i> More</div></div>
</div><div class="hm-tip"></div></div>
<script>
(()=>{
const grid=document.querySelector(".hm-grid"),tip=document.querySelector(".hm-tip"),L=["#1c1917","#5c2a12","#9a3d12","#e0581f","#ffa36b"];
function build(year){let seed=year;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const start=new Date(year,0,1);start.setDate(start.getDate()-start.getDay());
  let html="",lastM=-1,total=0,best=0,streak=0,run=0,active=0;
  ["Mon","Wed","Fri"].forEach((d,k)=>html+=`<span class="w" style="grid-row:${3+k*2}">${d}</span>`);
  for(let w=0;w<53;w++)for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);
    if(d===0&&dt.getMonth()!==lastM&&dt.getFullYear()===year){lastM=dt.getMonth();html+=`<span class="m" style="grid-column:${w+2}">${dt.toLocaleString("en",{month:"short"})}</span>`}
    const inYr=dt.getFullYear()===year&&dt<=new Date(2026,9,30);
    const season=.55+.45*Math.sin(w/53*6.28*2+year),weekend=d===0||d===6?.35:1;
    const n=inYr?Math.max(0,Math.round((rnd()*rnd()*22*season*weekend)-2)):0;
    total+=n;best=Math.max(best,n);if(n){active++;run++;streak=Math.max(streak,run)}else run=0;
    const lv=n===0?0:n<4?1:n<8?2:n<13?3:4;
    html+=`<i style="grid-column:${w+2};grid-row:${d+2};--b:${inYr?L[lv]:"transparent"};--d:${(w+d)*9}ms" data-n="${n}" data-t="${dt.toLocaleDateString("en",{weekday:"short",month:"short",day:"numeric"})}"${inYr?"":" hidden"}></i>`}
  grid.innerHTML=html;
  const count=(el,v)=>{const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(v*(1-(1-k)**3)).toLocaleString("en");if(k<1)requestAnimationFrame(f)})(t0)};
  count(document.querySelector("[data-total]"),total);count(document.querySelector('[data-s="best"]'),best);count(document.querySelector('[data-s="streak"]'),streak);count(document.querySelector('[data-s="avg"]'),Math.round(total/(active||1)))}
grid.addEventListener("pointerover",e=>{const c=e.target.closest("i");if(!c)return;const r=c.getBoundingClientRect(),n=+c.dataset.n;
  tip.innerHTML=`<b>${n?n+" contribution"+(n>1?"s":""):"No contributions"}</b> on ${c.dataset.t}`;tip.style.left=r.left+r.width/2+"px";tip.style.top=r.top+"px";tip.style.opacity=1});
grid.addEventListener("pointerleave",()=>tip.style.opacity=0);
document.querySelectorAll(".hm-yr button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".hm-yr button").forEach(x=>x.classList.toggle("on",x===b));build(+b.dataset.y)});
build(2026);
})();
</script>

<style>
.sd{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.sd :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sd ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.sd *,.sd *::before,.sd *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.sd{min-height:100vh;display:grid;place-items:center;padding:40px 16px;background:var(--sf)}
.sd-app{position:relative;width:min(400px,100%);height:600px;border-radius:28px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.sd-hd{padding:22px 22px 10px}
.sd-hd h2{margin:0;font-size:24px;letter-spacing:-.03em;font-weight:650}
.sd-hd p{margin:2px 0 0;font-size:13.5px;color:var(--mu)}
.sd-li{list-style:none;margin:0;padding:0 12px}
.sd-li li{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px}
.sd-li li+li{border-top:1px solid var(--line)}
.sd-li i{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--sf2);font-style:normal;font-size:18px}
.sd-li b{display:block;font-size:14.5px;font-weight:550}
.sd-li small{font-size:12.5px;color:var(--mu)}
.sd-li span{margin-left:auto;font:500 12px "Geist Mono",monospace;color:var(--mu)}
.sd-scrim{position:absolute;inset:0;background:color-mix(in oklab,var(--bg) 70%,transparent);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.sd.open .sd-scrim{opacity:1;pointer-events:auto}
.sd-dial{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:12px}
.sd-fab{width:58px;height:58px;border:0;border-radius:18px;background:var(--ac);color:var(--ac-fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px -6px color-mix(in oklab,var(--ac) 60%,transparent),0 2px 4px #0002;transition:border-radius .3s var(--ease),background-color .2s}
.sd-fab:hover{background:var(--ac-h)}
.sd-fab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;transition:transform .35s var(--ease)}
.sd.open .sd-fab{border-radius:50%}
.sd.open .sd-fab svg{transform:rotate(135deg)}
.sd-acts{list-style:none;margin:0;padding:0 5px 0 0;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sd-acts li{opacity:0;transform:translateY(12px) scale(.9);transition:opacity .18s,transform .25s var(--ease);transition-delay:calc((3 - var(--i))*25ms)}
.sd.open .sd-acts li{opacity:1;transform:none;transition-delay:calc(var(--i)*40ms)}
.sd-acts button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;cursor:pointer;color:var(--fg);font:550 13.5px Geist,system-ui,sans-serif}
.sd-acts button span{padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);box-shadow:0 2px 8px #00000014}
.sd-acts button i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);box-shadow:0 4px 12px -2px #0000001f;transition:background-color .15s}
.sd-acts button:hover i,.sd-acts button:focus-visible i{background:var(--sf2)}
.sd-acts button:focus-visible{outline:0}.sd-acts button:focus-visible i{outline:2px solid var(--focus);outline-offset:2px}
.sd-acts svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sd-toast{position:absolute;left:20px;bottom:30px;padding:9px 13px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.sd-toast.on{opacity:1;transform:none}
</style>
<div class="sd">
  <div class="sd-app">
    <div class="sd-hd"><h2>Expenses</h2><p>October · 5 entries</p></div>
    <ul class="sd-li">
      <li><i>☕</i><div><b>Blue Bottle</b><small>Food &amp; drink</small></div><span>−$6.40</span></li>
      <li><i>🚆</i><div><b>Caltrain</b><small>Transport</small></div><span>−$8.75</span></li>
      <li><i>📦</i><div><b>Hardware store</b><small>Office</small></div><span>−$42.10</span></li>
      <li><i>🍜</i><div><b>Team lunch</b><small>Food &amp; drink</small></div><span>−$96.00</span></li>
      <li><i>💡</i><div><b>Electric bill</b><small>Utilities</small></div><span>−$71.32</span></li>
    </ul>
    <div class="sd-scrim"></div>
    <div class="sd-dial">
      <button class="sd-fab" aria-label="Create" aria-expanded="false" aria-controls="sdActs"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <ul class="sd-acts" id="sdActs" role="menu" aria-label="Create">
        <li style="--i:0"><button role="menuitem" tabindex="-1"><span>Expense</span><i><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></i></button></li>
        <li style="--i:1"><button role="menuitem" tabindex="-1"><span>Scan receipt</span><i><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg></i></button></li>
        <li style="--i:2"><button role="menuitem" tabindex="-1"><span>Split bill</span><i><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg></i></button></li>
      </ul>
    </div>
    <div class="sd-toast" role="status"></div>
  </div>
</div>
<script>
const sd=document.querySelector(".sd"),fab=sd.querySelector(".sd-fab"),its=[...sd.querySelectorAll(".sd-acts button")],toast=sd.querySelector(".sd-toast");
const set=(o,f)=>{sd.classList.toggle("open",o);fab.setAttribute("aria-expanded",o);its.forEach(b=>b.tabIndex=o?0:-1);if(o&&f)its[0].focus()};
fab.addEventListener("click",()=>set(!sd.classList.contains("open"),true));
sd.querySelector(".sd-scrim").addEventListener("click",()=>set(false));
sd.addEventListener("keydown",e=>{
  if(!sd.classList.contains("open"))return;
  const i=its.indexOf(document.activeElement);
  if(e.key==="Escape"){set(false);fab.focus()}
  else if(e.key==="ArrowUp"&&i>-1){e.preventDefault();its[Math.min(its.length-1,i+1)].focus()}
  else if(e.key==="ArrowDown"){e.preventDefault();i<=0?fab.focus():its[i-1].focus()}
  else if(e.key==="ArrowUp"&&document.activeElement===fab){e.preventDefault();its[0].focus()}
});
its.forEach(b=>b.addEventListener("click",()=>{set(false);fab.focus();toast.textContent=b.textContent.trim()+" — opening…";toast.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove("on"),1600)}));
</script>

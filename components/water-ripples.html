<style>
.bg-wrx{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;--ink:#ffffff;--fb:#0b4b5e;--ink2:var(--ink);background:var(--fb);color:var(--ink);isolation:isolate;font:16px/1.5 Geist,system-ui,sans-serif}
.bg-wrx canvas,.bg-wrx>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.bg-wrx>img{display:none;filter:none}
.bg-wrx.nogl canvas{display:none}.bg-wrx.nogl>img{display:block}
.bg-wrx-nav{display:flex;align-items:center;gap:28px;padding:20px clamp(16px,4vw,48px)}
.bg-wrx-nav nav{display:flex;gap:22px}
.bg-wrx-nav b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.bg-wrx-nav a{color:inherit;text-decoration:none;font-size:14px;opacity:.72;transition:opacity .15s ease-out}.bg-wrx-nav a:hover{opacity:1}
.bg-wrx-main{flex:1;display:grid;padding:clamp(24px,5vw,64px) clamp(16px,4vw,48px) clamp(32px,6vw,72px)}
.bg-wrx-eye{margin:0;font:500 11px/1.4 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.bg-wrx-sub{font-size:17px;line-height:1.55;max-width:44ch;margin:0;opacity:.8;text-wrap:pretty}
.bg-wrx-mono{font:13px "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.bg-wrx-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--ink);color:var(--fb);font:600 15px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease-out,opacity .15s ease-out}
.bg-wrx-btn:active{transform:scale(.97)}.bg-wrx-ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink) 35%,transparent)}
.bg-wrx-card{background:color-mix(in oklab,var(--fb) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in oklab,var(--ink) 12%,transparent);border-radius:16px;padding:20px}
.bg-wrx-card>.bg-wrx-eye:first-child{margin-bottom:10px}
.bg-wrx-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.bg-wrx-pal{margin-left:auto;display:flex;gap:2px}
.bg-wrx-pal button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.bg-wrx-pal button i{width:18px;height:18px;border-radius:50%;background:var(--g);box-shadow:0 0 0 1px color-mix(in oklab,var(--ink) 30%,transparent);transition:transform .15s ease-out}
.bg-wrx-pal button[aria-pressed=true] i{box-shadow:0 0 0 2px var(--fb),0 0 0 3.5px var(--ink)}
.bg-wrx :focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:760px){.bg-wrx-main{grid-template-columns:1fr!important;gap:28px!important}.bg-wrx-nav nav{display:none}}

.bg-wrx-main{grid-template-rows:1fr auto;gap:32px}
.bg-wrx-temp{font:300 clamp(96px,18vw,220px)/.85 Geist,system-ui,sans-serif;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:8px 0 0}
.bg-wrx-temp sup{font-size:.3em;letter-spacing:0;vertical-align:top;margin-left:6px}
.bg-wrx-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.2fr);gap:12px}
.bg-wrx-tg{display:flex;flex-direction:column;align-items:flex-start;gap:18px;min-height:120px;text-align:left;font:500 15px Geist,system-ui,sans-serif;color:inherit;cursor:pointer;transition:background .2s ease-out}
.bg-wrx-tg i{position:relative;width:40px;height:24px;border-radius:12px;background:color-mix(in oklab,var(--ink) 25%,transparent);transition:background .2s ease-out}
.bg-wrx-tg i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s ease-out}
.bg-wrx-tg[aria-pressed=true] i{background:var(--ink)}.bg-wrx-tg[aria-pressed=true] i::after{background:var(--fb);transform:translateX(16px)}
.bg-wrx-tg:active{transform:scale(.97)}
.bg-wrx-q{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;align-content:end}.bg-wrx-q b{font:500 28px Geist,system-ui,sans-serif;font-variant-numeric:tabular-nums}
@media (max-width:760px){.bg-wrx-row{grid-template-columns:repeat(3,minmax(0,1fr))}.bg-wrx-q{grid-column:1/-1}}

</style>
<section class="bg-wrx">
  <canvas aria-hidden="true"></canvas>
  <header class="bg-wrx-nav"><b>Lido Home</b><nav aria-label="Lido Home"><a href="#">Pool</a><a href="#">Garden</a><a href="#">Energy</a></nav><div class="bg-wrx-pal" role="group" aria-label="Colour"><button type="button" aria-pressed="true" data-k="#063a4f,#2a9bb4,#e9fbff" style="--g:linear-gradient(135deg,#063a4f,#2a9bb4)" aria-label="Pool"><i></i></button><button type="button" aria-pressed="false" data-k="#043a33,#1fa58a,#f0fff6" style="--g:linear-gradient(135deg,#043a33,#1fa58a)" aria-label="Lagoon"><i></i></button><button type="button" aria-pressed="false" data-k="#1c1440,#5b4bb3,#ffe9d6" style="--g:linear-gradient(135deg,#1c1440,#5b4bb3)" aria-label="Dusk"><i></i></button></div></header>
  <main class="bg-wrx-main">
<div><p class="bg-wrx-eye">Water temperature · heating to 28°</p><p class="bg-wrx-temp">27.5<sup>°C</sup></p></div>
<div class="bg-wrx-row">
<button type="button" class="bg-wrx-card bg-wrx-tg" data-tg aria-pressed="true"><i></i>Filter pump</button>
<button type="button" class="bg-wrx-card bg-wrx-tg" data-tg aria-pressed="false"><i></i>Underwater lights</button>
<button type="button" class="bg-wrx-card bg-wrx-tg" data-tg aria-pressed="false"><i></i>Pool cover</button>
<div class="bg-wrx-card bg-wrx-q"><span class="bg-wrx-eye">Chlorine</span><span class="bg-wrx-eye">pH</span><b>1.4<small> ppm</small></b><b>7.3</b></div></div>
</main>
</section>
<script>
(()=>{
const S=document.currentScript?document.currentScript.previousElementSibling:document.querySelector(".bg-wrx");
const root=S&&S.classList.contains("bg-wrx")?S:document.querySelector(".bg-wrx");
const cv=root.querySelector("canvas"),gl=cv.getContext("webgl",{antialias:false});
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches,IMG=false;
const off=()=>root.classList.add("nogl");
if(!gl)return off();
const FS="precision highp float;uniform vec2 r,m,us;uniform float t,ld;uniform sampler2D u;uniform vec3 k0,k1,k2;\nfloat h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}\nvec2 h2(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}\nfloat n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\nfloat fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=mat2(.8,.6,-.6,.8)*p*2.03+1.7;a*=.5;}return v;}\nvec2 cover(vec2 q){float ra=r.x/r.y,ia=us.x/us.y;vec2 s=ra>ia?vec2(1.,ia/ra):vec2(ra/ia,1.);return (q-.5)*s+.5;}\nvec3 img(vec2 q){return texture2D(u,clamp(q,.001,.999)).rgb;}\nfloat lum(vec3 c){return dot(c,vec3(.299,.587,.114));}\n\nfloat caus(vec2 p,float T){vec2 i=p;float c=1.,inten=.005;for(int j=0;j<5;j++){float tt=T*(1.-(3.5/float(j+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));c+=1./length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}c/=5.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}\nvoid main(){vec2 uv=gl_FragCoord.xy/r,p=(gl_FragCoord.xy-.5*r)/r.y;vec2 mp=(m-.5)*vec2(r.x/r.y,1.);float d=length(p-mp);\np+=normalize(p-mp+1e-4)*sin(d*40.-t*5.)*.012*exp(-d*3.5);\nfloat T=t*.35+23.;float c=caus(mod(p*5.,6.2831)-250.,T);\nvec3 col=mix(k0,k1,.35+.45*uv.y+.2*fbm(p*2.+t*.05));col+=k2*clamp(c,0.,1.)*.55;col+=k2*smoothstep(.75,1.,fbm(p*3.-t*.08))*.08;\ngl_FragColor=vec4(col,1);}";
const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
const P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}"));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(P);
if(!gl.getProgramParameter(P,gl.LINK_STATUS))return off();
gl.useProgram(P);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};["r","m","us","t","ld","k0","k1","k2"].forEach(k=>U[k]=gl.getUniformLocation(P,k));
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
let fr=0,ready=!IMG,vis=true,raf=0,t0=performance.now(),mx=.5,my=.5,sx=.5,sy=.5,ld=0,ldT=0;
const pal=k=>{k.split(",").forEach((c,i)=>gl.uniform3fv(U["k"+i],hex(c)));if(RM)draw()};
if(IMG){const im=root.querySelector("img"),tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,...p));
  const go=()=>{try{gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im)}catch(e){return off()}gl.uniform2f(U.us,im.naturalWidth,im.naturalHeight);ready=true;ldT=performance.now();loop()};
  im.complete&&im.naturalWidth?go():(im.onload=go,im.onerror=off)}
function size(){const d=Math.min(devicePixelRatio||1,1.5)*1,w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(U.r,w,h)}
function draw(){if(!ready)return;size();const now=performance.now();sx+=(mx-sx)*.06;sy+=(my-sy)*.06;
  gl.uniform1f(U.t,RM?8:(now-t0)/1000);gl.uniform2f(U.m,sx,sy);gl.uniform1f(U.ld,IMG?Math.min(1,(now-ldT)/900):1);gl.drawArrays(gl.TRIANGLES,0,3)}
function loop(){cancelAnimationFrame(raf);if(RM){draw();if(IMG&&performance.now()-ldT<1000)raf=requestAnimationFrame(loop);return}if(!vis||document.hidden)return;if(fr++%1===0)draw();raf=requestAnimationFrame(loop)}
root.addEventListener("pointermove",e=>{const b=root.getBoundingClientRect();mx=(e.clientX-b.left)/b.width;my=1-(e.clientY-b.top)/b.height});
root.addEventListener("pointerleave",()=>{mx=.5;my=.5});
new IntersectionObserver(([e])=>{vis=e.isIntersecting;loop()}).observe(root);
document.addEventListener("visibilitychange",loop);
new ResizeObserver(()=>{if(RM)draw()}).observe(root);
root.querySelectorAll("[data-tg]").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")));
root.querySelectorAll("[data-one]").forEach(b=>b.addEventListener("click",()=>b.parentNode.querySelectorAll("[data-one]").forEach(x=>x.setAttribute("aria-pressed",x===b))));
const btns=[...root.querySelectorAll("[data-k]")];
btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.setAttribute("aria-pressed",x===b));pal(b.dataset.k);const s=root.style;["ink","fb"].forEach(k=>b.dataset[k]?s.setProperty("--"+k,b.dataset[k]):s.removeProperty("--"+k))});
pal("#063a4f,#2a9bb4,#e9fbff");loop();
})();
</script>

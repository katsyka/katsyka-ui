<style>
.bg-isx{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;--ink:#141416;--fb:#eceae6;--ink2:var(--ink);background:var(--fb);color:var(--ink);isolation:isolate;font:16px/1.5 Geist,system-ui,sans-serif}

.bg-isx>img{display:none;filter:none}
.bg-isx.nogl canvas{display:none}.bg-isx.nogl>img{display:block}
.bg-isx-nav{display:flex;align-items:center;gap:28px;padding:20px clamp(16px,4vw,48px)}
.bg-isx-nav nav{display:flex;gap:22px}
.bg-isx-nav b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.bg-isx-nav a{color:inherit;text-decoration:none;font-size:14px;opacity:.72;transition:opacity .15s ease-out}.bg-isx-nav a:hover{opacity:1}
.bg-isx-main{flex:1;display:grid;padding:clamp(24px,5vw,64px) clamp(16px,4vw,48px) clamp(32px,6vw,72px)}
.bg-isx-eye{margin:0;font:500 11px/1.4 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.bg-isx-sub{font-size:17px;line-height:1.55;max-width:44ch;margin:0;opacity:.8;text-wrap:pretty}
.bg-isx-mono{font:13px "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.bg-isx-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--ink);color:var(--fb);font:600 15px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease-out,opacity .15s ease-out}
.bg-isx-btn:active{transform:scale(.97)}.bg-isx-ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink) 35%,transparent)}
.bg-isx-card{background:color-mix(in oklab,var(--fb) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in oklab,var(--ink) 12%,transparent);border-radius:16px;padding:20px}
.bg-isx-card>.bg-isx-eye:first-child{margin-bottom:10px}
.bg-isx-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.bg-isx-pal{margin-left:auto;display:flex;gap:2px}
.bg-isx-pal button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.bg-isx-pal button i{width:18px;height:18px;border-radius:50%;background:var(--g);box-shadow:0 0 0 1px color-mix(in oklab,var(--ink) 30%,transparent);transition:transform .15s ease-out}
.bg-isx-pal button[aria-pressed=true] i{box-shadow:0 0 0 2px var(--fb),0 0 0 3.5px var(--ink)}
.bg-isx :focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:760px){.bg-isx-main{grid-template-columns:1fr!important;gap:28px!important}.bg-isx-nav nav{display:none}}

.bg-isx-main{grid-template-columns:minmax(0,440px) 1fr;align-items:center}
.bg-isx h1{font:500 clamp(44px,6vw,84px)/.95 Geist,system-ui,sans-serif;letter-spacing:-.05em;margin:12px 0 16px}
.bg-isx-buy{display:flex;align-items:center;gap:18px;margin-top:26px;font-variant-numeric:tabular-nums}
.bg-isx-note{display:flex;gap:20px;margin-top:40px;font-size:13px;opacity:.7}
@media (max-width:760px){.bg-isx-main{align-items:end}}

</style>
<section class="bg-isx">

  <main class="bg-isx-main">

<script>
(()=>{
const S=document.currentScript?document.currentScript.previousElementSibling:document.querySelector(".bg-isx");
const root=S&&S.classList.contains("bg-isx")?S:document.querySelector(".bg-isx");
const cv=root.querySelector("canvas"),gl=cv.getContext("webgl",{antialias:false});
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches,IMG=false;
const off=()=>root.classList.add("nogl");
if(!gl)return off();
const FS="precision highp float;uniform vec2 r,m,us;uniform float t,ld;uniform sampler2D u;uniform vec3 k0,k1,k2;\nfloat h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}\nvec2 h2(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}\nfloat n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\nfloat fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=mat2(.8,.6,-.6,.8)*p*2.03+1.7;a*=.5;}return v;}\nvec2 cover(vec2 q){float ra=r.x/r.y,ia=us.x/us.y;vec2 s=ra>ia?vec2(1.,ia/ra):vec2(ra/ia,1.);return (q-.5)*s+.5;}\nvec3 img(vec2 q){return texture2D(u,clamp(q,.001,.999)).rgb;}\nfloat lum(vec3 c){return dot(c,vec3(.299,.587,.114));}\n\nmat2 rot(float a){return mat2(cos(a),sin(a),-sin(a),cos(a));}\nfloat smin(float a,float b,float k){float hh=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,hh)-k*hh*(1.-hh);}\nfloat map(vec3 p){p.xz*=rot(t*.25+(m.x-.5)*1.5);p.yz*=rot(.5+(m.y-.5)*1.2);vec3 q=p;q.xy*=rot(t*.2);\nfloat tor=length(vec2(length(q.xz)-1.,q.y))-.32;float s1=length(p-vec3(sin(t*.5)*1.1,.5,cos(t*.4)*.6))-.38;float s2=length(p+vec3(cos(t*.37)*.9,.6,sin(t*.41)*.5))-.28;return smin(tor,smin(s1,s2,.4),.45);}\nvec3 film(float x){return .5+.5*cos(6.2831*(x+vec3(0.,.33,.67)));}\nvoid main(){vec2 p=(gl_FragCoord.xy-.5*r)/r.y;p.x-=clamp((r.x/r.y-1.)*.55,0.,.6);p.y+=r.x<r.y?-.25:0.;vec3 ro=vec3(0,0,4.2),rd=normalize(vec3(p,-1.6));float d=0.,hit=0.;\nfor(int i=0;i<72;i++){float s=map(ro+rd*d);if(s<.002){hit=1.;break;}d+=s;if(d>9.)break;}\nvec3 bgc=mix(k1,k0,smoothstep(-.6,.6,p.y+.2));vec3 col=bgc;\nif(hit>0.){vec3 P=ro+rd*d;vec2 e=vec2(.002,0);vec3 N=normalize(vec3(map(P+e.xyy)-map(P-e.xyy),map(P+e.yxy)-map(P-e.yxy),map(P+e.yyx)-map(P-e.yyx)));\nfloat fr=pow(1.-max(dot(N,-rd),0.),2.);vec3 R=reflect(rd,N);vec3 ir=mix(vec3(.93,.92,.95),film(dot(N,-rd)*1.1+R.y*.25+t*.03),.38);\ncol=mix(ir*mix(.62,.95,.5+.5*N.y),k2,smoothstep(.6,1.,R.y)*.5)+fr*film(fr*.8+.2)*.22;col+=pow(max(dot(R,normalize(vec3(.5,.8,.6))),0.),40.)*.9;col=mix(col,bgc,.08);}\ngl_FragColor=vec4(col,1);}";
const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
const P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}"));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(P);
if(!gl.getProgramParameter(P,gl.LINK_STATUS))return off();
gl.useProgram(P);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};["r","m","us","t","ld","k0","k1","k2"].forEach(k=>U[k]=gl.getUniformLocation(P,k));
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
let fr=0,ready=!IMG,vis=true,raf=0,t0=performance.now(),mx=.5,my=.5,sx=.5,sy=.5,ld=0,ldT=0;
const pal=k=>{k.split(",").forEach((c,i)=>gl.uniform3fv(U["k"+i],hex(c)));if(RM)draw()};
if(IMG){const im=root.querySelector("img"),tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,...p));
  const go=()=>{try{gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im)}catch(e){return off()}gl.uniform2f(U.us,im.naturalWidth,im.naturalHeight);ready=true;ldT=performance.now();loop()};
  im.complete&&im.naturalWidth?go():(im.onload=go,im.onerror=off)}
function size(){const d=Math.min(devicePixelRatio||1,1.5)*1,w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(U.r,w,h)}

  gl.uniform1f(U.t,RM?8:(now-t0)/1000);gl.uniform2f(U.m,sx,sy);gl.uniform1f(U.ld,IMG?Math.min(1,(now-ldT)/900):1);gl.drawArrays(gl.TRIANGLES,0,3)}

root.addEventListener("pointermove",e=>{const b=root.getBoundingClientRect();mx=(e.clientX-b.left)/b.width;my=1-(e.clientY-b.top)/b.height});
root.addEventListener("pointerleave",()=>{mx=.5;my=.5});
new IntersectionObserver(([e])=>{vis=e.isIntersecting;loop()}).observe(root);
document.addEventListener("visibilitychange",loop);
new ResizeObserver(()=>{if(RM)draw()}).observe(root);
root.querySelectorAll("[data-tg]").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")));
root.querySelectorAll("[data-one]").forEach(b=>b.addEventListener("click",()=>b.parentNode.querySelectorAll("[data-one]").forEach(x=>x.setAttribute("aria-pressed",x===b))));
const btns=[...root.querySelectorAll("[data-k]")];
btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.setAttribute("aria-pressed",x===b));pal(b.dataset.k);const s=root.style;["ink","fb"].forEach(k=>b.dataset[k]?s.setProperty("--"+k,b.dataset[k]):s.removeProperty("--"+k))});
pal("#eceae6,#c9c6c0,#ffffff");loop();
})();
</script>

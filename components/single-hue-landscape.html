<style>
.bg-shlx{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;--ink:#ffffff;--fb:#2f4a36;--ink2:var(--ink);background:var(--fb);color:var(--ink);isolation:isolate;font:16px/1.5 Geist,system-ui,sans-serif}
.bg-shlx canvas,.bg-shlx>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.bg-shlx>img{display:none;filter:grayscale(1)}
.bg-shlx.nogl canvas{display:none}.bg-shlx.nogl>img{display:block}
.bg-shlx-nav{display:flex;align-items:center;gap:28px;padding:20px clamp(16px,4vw,48px)}
.bg-shlx-nav nav{display:flex;gap:22px}
.bg-shlx-nav b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.bg-shlx-nav a{color:inherit;text-decoration:none;font-size:14px;opacity:.72;transition:opacity .15s ease-out}.bg-shlx-nav a:hover{opacity:1}
.bg-shlx-main{flex:1;display:grid;padding:clamp(24px,5vw,64px) clamp(16px,4vw,48px) clamp(32px,6vw,72px)}
.bg-shlx-eye{margin:0;font:500 11px/1.4 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.bg-shlx-sub{font-size:17px;line-height:1.55;max-width:44ch;margin:0;opacity:.8;text-wrap:pretty}
.bg-shlx-mono{font:13px "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.bg-shlx-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--ink);color:var(--fb);font:600 15px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease-out,opacity .15s ease-out}
.bg-shlx-btn:active{transform:scale(.97)}.bg-shlx-ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink) 35%,transparent)}
.bg-shlx-card{background:color-mix(in oklab,var(--fb) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in oklab,var(--ink) 12%,transparent);border-radius:16px;padding:20px}
.bg-shlx-card>.bg-shlx-eye:first-child{margin-bottom:10px}
.bg-shlx-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.bg-shlx-pal{margin-left:auto;display:flex;gap:2px}
.bg-shlx-pal button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.bg-shlx-pal button i{width:18px;height:18px;border-radius:50%;background:var(--g);box-shadow:0 0 0 1px color-mix(in oklab,var(--ink) 30%,transparent);transition:transform .15s ease-out}
.bg-shlx-pal button[aria-pressed=true] i{box-shadow:0 0 0 2px var(--fb),0 0 0 3.5px var(--ink)}
.bg-shlx :focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:760px){.bg-shlx-main{grid-template-columns:1fr!important;gap:28px!important}.bg-shlx-nav nav{display:none}}

.bg-shlx-main{grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:48px;align-items:end}
.bg-shlx h1{font:400 clamp(46px,7vw,100px)/.92 "Instrument Serif",serif;letter-spacing:-.02em;margin:10px 0 18px;max-width:10ch}
.bg-shlx-stats{display:flex;gap:28px;font-variant-numeric:tabular-nums}.bg-shlx-stats b{display:block;font:500 26px Geist,system-ui,sans-serif}.bg-shlx-stats span{font-size:13px;opacity:.7}
.bg-shlx-tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;margin-bottom:16px}
.bg-shlx-tbl th{text-align:left;font:500 11px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:0 0 10px}
.bg-shlx-tbl td{padding:12px 0;border-top:1px solid color-mix(in oklab,var(--ink) 16%,transparent)}.bg-shlx-tbl td:last-child,.bg-shlx-tbl th:last-child{text-align:right}
.bg-shlx-card .bg-shlx-btn{width:100%}

</style>
<section class="bg-shlx">
  <canvas aria-hidden="true"></canvas>
  <img src="media/pics/w/1018.jpg" alt="" crossorigin="anonymous">
  <header class="bg-shlx-nav"><b>Ridge 50</b><nav aria-label="Ridge 50"><a href="#">Race</a><a href="#">Route</a><a href="#">Volunteer</a></nav><div class="bg-shlx-pal" role="group" aria-label="Colour"><button type="button" aria-pressed="true" data-k="#0f1d14,#5f8a68,#e7f2e4" style="--g:linear-gradient(135deg,#0f1d14,#5f8a68)" aria-label="Sage"><i></i></button><button type="button" aria-pressed="false" data-k="#2a0f08,#b5532f,#ffe6d6" style="--g:linear-gradient(135deg,#2a0f08,#b5532f)" aria-label="Terracotta"><i></i></button><button type="button" aria-pressed="false" data-k="#060d2a,#2c4fc4,#e3eaff" style="--g:linear-gradient(135deg,#060d2a,#2c4fc4)" aria-label="Cobalt"><i></i></button></div></header>
  <main class="bg-shlx-main">
<div><p class="bg-shlx-eye">Trail race · 14 June</p><h1>Fifty kilometres along the green ridge.</h1>
<div class="bg-shlx-stats"><div><b>50 km</b><span>distance</span></div><div><b>2,140 m</b><span>climb</span></div><div><b>11 h</b><span>cut-off</span></div></div></div>
<div class="bg-shlx-card"><table class="bg-shlx-tbl"><thead><tr><th>Wave</th><th>Start</th><th>Places</th></tr></thead><tbody>
<tr><td>A · Fast</td><td>06:00</td><td>12 left</td></tr><tr><td>B · Open</td><td>06:30</td><td>48 left</td></tr><tr><td>C · Relay</td><td>07:00</td><td>20 teams</td></tr></tbody></table>
<a class="bg-shlx-btn" href="#">Enter the race</a></div>
</main>
</section>
<script>
(()=>{
const S=document.currentScript?document.currentScript.previousElementSibling:document.querySelector(".bg-shlx");
const root=S&&S.classList.contains("bg-shlx")?S:document.querySelector(".bg-shlx");
const cv=root.querySelector("canvas"),gl=cv.getContext("webgl",{antialias:false});
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches,IMG=true;
const off=()=>root.classList.add("nogl");
if(!gl)return off();
const FS="precision highp float;uniform vec2 r,m,us;uniform float t,ld;uniform sampler2D u;uniform vec3 k0,k1,k2;\nfloat h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}\nvec2 h2(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}\nfloat n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\nfloat fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=mat2(.8,.6,-.6,.8)*p*2.03+1.7;a*=.5;}return v;}\nvec2 cover(vec2 q){float ra=r.x/r.y,ia=us.x/us.y;vec2 s=ra>ia?vec2(1.,ia/ra):vec2(ra/ia,1.);return (q-.5)*s+.5;}\nvec3 img(vec2 q){return texture2D(u,clamp(q,.001,.999)).rgb;}\nfloat lum(vec3 c){return dot(c,vec3(.299,.587,.114));}\n\nvoid main(){vec2 uv=gl_FragCoord.xy/r;vec2 q=cover((uv-.5)*.94+.5+(m-.5)*.03+vec2(sin(t*.05),cos(t*.04))*.008);float l=lum(img(q));l=smoothstep(.05,.95,l);\nvec3 col=l<.5?mix(k0,k1,l*2.):mix(k1,k2,(l-.5)*2.);col+=(h(gl_FragCoord.xy+fract(t))-.5)*.05;col*=1.-.35*pow(length(uv-.5),2.);col=mix(k0,col,ld);gl_FragColor=vec4(col,1);}";
const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
const P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}"));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(P);
if(!gl.getProgramParameter(P,gl.LINK_STATUS))return off();
gl.useProgram(P);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};["r","m","us","t","ld","k0","k1","k2"].forEach(k=>U[k]=gl.getUniformLocation(P,k));
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
let fr=0,ready=!IMG,vis=true,raf=0,t0=performance.now(),mx=.5,my=.5,sx=.5,sy=.5,ld=0,ldT=0;
const pal=k=>{k.split(",").forEach((c,i)=>gl.uniform3fv(U["k"+i],hex(c)));if(RM)draw()};
if(IMG){const im=root.querySelector("img"),tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,...p));
  const go=()=>{try{gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im)}catch(e){return off()}gl.uniform2f(U.us,im.naturalWidth,im.naturalHeight);ready=true;ldT=performance.now();loop()};
  im.complete&&im.naturalWidth?go():(im.onload=go,im.onerror=off)}
function size(){const d=Math.min(devicePixelRatio||1,1.5)*1,w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(U.r,w,h)}
function draw(){if(!ready)return;size();const now=performance.now();sx+=(mx-sx)*.06;sy+=(my-sy)*.06;
  gl.uniform1f(U.t,RM?8:(now-t0)/1000);gl.uniform2f(U.m,sx,sy);gl.uniform1f(U.ld,IMG?Math.min(1,(now-ldT)/900):1);gl.drawArrays(gl.TRIANGLES,0,3)}
function loop(){cancelAnimationFrame(raf);if(RM){draw();if(IMG&&performance.now()-ldT<1000)raf=requestAnimationFrame(loop);return}if(!vis||document.hidden)return;if(fr++%1===0)draw();raf=requestAnimationFrame(loop)}
root.addEventListener("pointermove",e=>{const b=root.getBoundingClientRect();mx=(e.clientX-b.left)/b.width;my=1-(e.clientY-b.top)/b.height});
root.addEventListener("pointerleave",()=>{mx=.5;my=.5});
new IntersectionObserver(([e])=>{vis=e.isIntersecting;loop()}).observe(root);
document.addEventListener("visibilitychange",loop);
new ResizeObserver(()=>{if(RM)draw()}).observe(root);
root.querySelectorAll("[data-tg]").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")));
root.querySelectorAll("[data-one]").forEach(b=>b.addEventListener("click",()=>b.parentNode.querySelectorAll("[data-one]").forEach(x=>x.setAttribute("aria-pressed",x===b))));
const btns=[...root.querySelectorAll("[data-k]")];
btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.setAttribute("aria-pressed",x===b));pal(b.dataset.k);const s=root.style;["ink","fb"].forEach(k=>b.dataset[k]?s.setProperty("--"+k,b.dataset[k]):s.removeProperty("--"+k))});
pal("#0f1d14,#5f8a68,#e7f2e4");loop();
})();
</script>

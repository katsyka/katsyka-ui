<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.nr2{padding:0;place-items:stretch;display:grid;grid-template-columns:auto 1fr;background:var(--sf)}
.nr2-s{width:248px;background:var(--bg);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;transition:width .25s cubic-bezier(.23,1,.32,1);overflow:hidden;height:100dvh;position:sticky;top:0}.nr2-s.c{width:64px}
.nr2-t{display:flex;align-items:center;gap:10px;padding:4px 4px 12px;white-space:nowrap}.nr2-lg{width:32px;height:32px;border-radius:9px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}.nr2-t b{flex:1}.nr2-t .ibt .i{transition:transform .25s}.nr2-s.c .nr2-t b{opacity:0}.nr2-s.c .nr2-t{flex-direction:column;gap:8px}.nr2-s.c .nr2-t .ibt .i{transform:rotate(180deg)}
.nr2-s nav{display:grid;gap:2px}.nr2-g{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 10px 4px;font-size:11px;font-weight:650;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}.nr2-g .i{width:12px;height:12px;transition:transform .2s}.nr2-g[aria-expanded=false] .i{transform:rotate(-90deg)}.nr2-s.c .nr2-g{visibility:hidden;height:12px;padding:0}
.nr2-s a{position:relative;display:flex;gap:12px;align-items:center;height:38px;padding:0 12px;border-radius:9px;color:var(--mu);text-decoration:none;white-space:nowrap;font-size:14px;font-weight:500}.nr2-s a:hover{background:var(--sf);color:var(--fg)}.nr2-s a[aria-current]{background:var(--sf2);color:var(--fg)}.nr2-s a .i{flex:none}.nr2-s a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:var(--ac);color:var(--ac-fg);border-radius:999px;padding:1px 7px}
.nr2-s.c a span{opacity:0}.nr2-s.c a em{position:absolute;top:4px;right:6px;padding:0 5px;font-size:10px}.nr2-s.c a:hover::after,.nr2-s.c a:focus-visible::after{content:attr(data-l);position:fixed;left:72px;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:10;pointer-events:none}
.nr2-m{padding:32px}.nr2-m h1{margin:0 0 6px;font-size:24px}.nr2-m kbd{font:12px 'Geist Mono',monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px}
</style>
<div class="k nr2"><aside class="nr2-s" id="s" aria-label="Main"><div class="nr2-t"><span class="nr2-lg">Q</span><b>Quill</b><button class="ibt" id="tg" aria-label="Collapse sidebar" aria-expanded="true" title="Toggle sidebar ( [ )"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg></button></div><nav id="n"></nav></aside><main class="nr2-m"><h1>Inbox</h1><p class="mu">Press <kbd>[</kbd> to toggle the sidebar.</p></main></div>
<script>
const G=[["",[["home","Home"],["msg","Inbox",4,1],["cal","Calendar"]]],["Projects",[["hash","Kestrel launch"],["hash","Website refresh"],["hash","Q4 report"]]],["Workspace",[["users","Members"],["settings","Settings"]]]],IC={home:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',msg:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12z"/></svg>',cal:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',hash:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>',users:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/></svg>',settings:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'},n=document.getElementById('n'),s=document.getElementById('s'),tg=document.getElementById('tg'),fold=new Set();
function draw(){n.innerHTML=G.map(([g,L],gi)=>(g?`<button class="nr2-g" data-g="${gi}" aria-expanded="${!fold.has(gi)}">${g}<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>`:'')+(fold.has(gi)?'':L.map(([ic,l,b,cur])=>`<a href="#" data-l="${l}${b?' ('+b+')':''}" ${cur?'aria-current="page"':''}>${IC[ic]}<span>${l}</span>${b?`<em>${b}</em>`:''}</a>`).join(''))).join('')}
n.onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=+b.dataset.g;fold.has(g)?fold.delete(g):fold.add(g);draw()};
function set(c){s.classList.toggle('c',c);tg.setAttribute('aria-expanded',!c);tg.setAttribute('aria-label',c?'Expand sidebar':'Collapse sidebar');try{localStorage.setItem('nr2',c?'1':'')}catch(e){}}
tg.onclick=()=>set(!s.classList.contains('c'));addEventListener('keydown',e=>{if(e.key==='['&&!e.target.matches('input,textarea'))set(!s.classList.contains('c'))});try{set(localStorage.getItem('nr2')==='1')}catch(e){}draw();
</script>

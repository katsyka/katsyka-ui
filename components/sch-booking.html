<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.bk{width:min(940px,100%);display:grid;grid-template-columns:240px 1fr 200px;overflow:hidden;min-height:440px}.bk-h{padding:24px;border-right:1px solid var(--line);display:grid;gap:8px;align-content:start}.bk-h img{width:44px;height:44px;border-radius:50%;object-fit:cover}.bk-h span{font-size:13px}.bk-h h1{margin:0;font-size:22px;letter-spacing:-.02em}.bk-h p{margin:0;font-size:14px;line-height:1.55;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bk-c{padding:20px;display:grid;gap:12px;align-content:start}.bk-mh{display:flex;justify-content:space-between;align-items:center}.bk-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.bk-g .dw{font-size:11px;color:var(--mu);padding:4px 0}
.bk-g button{aspect-ratio:1;max-height:48px;border-radius:50%;font-weight:550;font-variant-numeric:tabular-nums;color:var(--mu);position:relative}.bk-g button.av{color:var(--ac);background:var(--ac-sf);font-weight:700}.bk-g button.av:hover{background:color-mix(in srgb,var(--ac) 22%,transparent)}.bk-g button[aria-selected=true]{background:var(--ac);color:var(--ac-fg)}.bk-g button:disabled{opacity:.4;cursor:default}.bk-g .td::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;border-radius:50%;background:currentColor;translate:-50%}
.bk-tz{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu)}.bk-tz select{border:0;background:none;font:inherit;color:var(--fg);padding:4px}
.bk-s{padding:20px 16px;border-left:1px solid var(--line);display:grid;gap:10px;align-content:start;max-height:520px;overflow:auto}.bk-s b{font-size:14px}.bk-sl{display:grid;gap:6px}.bk-sl button{height:44px;border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);color:var(--ac);border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums;animation:bkf .2s cubic-bezier(.23,1,.32,1) both}@keyframes bkf{from{opacity:0;transform:translateY(4px)}}.bk-sl button:hover{border-color:var(--ac)}.bk-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bk-pair button:first-child{background:var(--fg);color:var(--bg);border-color:var(--fg);animation:none}
.bk-f{display:grid;gap:10px;padding:20px;grid-column:2/-1;animation:bkf .25s}.bk-f .in{height:42px;font-size:15px}.bk-f textarea.in{height:auto;padding:10px}.bk-ok{grid-column:2/-1;padding:32px;display:grid;gap:10px;justify-items:start;animation:bkf .3s}.bk-ok h2{margin:0;font-size:22px}
@media (max-width:860px){.bk{grid-template-columns:1fr}.bk-h,.bk-s{border:0;border-bottom:1px solid var(--line)}.bk-f,.bk-ok{grid-column:1}}
</style>
<div class="k"><div class="bk card"><aside class="bk-h"><img src="media/pics/c/1014.jpg" alt=""><span class="mu">Ines Aldana</span><h1>Intro call</h1><p class="mu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 30 min · <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg> Video call</p><p>A quick call to see if we're a good fit. Bring one question you'd most like answered.</p></aside>
<div class="bk-c" id="c"><div class="bk-mh"><button class="ibt" id="pm" aria-label="Previous month"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg></button><b id="mn"></b><button class="ibt" id="nm" aria-label="Next month"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m9 18 6-6-6-6"/></svg></button></div><div class="bk-g" id="g" role="grid"></div><label class="bk-tz"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><select id="tz" aria-label="Time zone"></select></label></div>
<div class="bk-s" id="s"><b id="sd">Pick a day</b><div id="sl" class="bk-sl"></div></div></div></div>
<script>
const $=i=>document.getElementById(i),now=new Date();let vm=new Date(now.getFullYear(),now.getMonth(),1),sel=null,slot=null;const TZ=[Intl.DateTimeFormat().resolvedOptions().timeZone,'Europe/London','America/New_York','Asia/Tokyo'].filter((v,i,a)=>a.indexOf(v)===i);
$('tz').innerHTML=TZ.map(z=>`<option>${z}</option>`).join('');const avail=d=>{const wd=d.getDay();return d>now&&wd>0&&wd<6&&(d.getDate()*7)%5!==0};
function cal(){$('mn').textContent=vm.toLocaleDateString('en-GB',{month:'long',year:'numeric'});const f=(vm.getDay()+6)%7,dim=new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate();let h=['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<span class="dw">${d}</span>`).join('')+'<span></span>'.repeat(f);
for(let d=1;d<=dim;d++){const dt=new Date(vm.getFullYear(),vm.getMonth(),d),a=avail(dt),td=dt.toDateString()===now.toDateString();h+=`<button class="${a?'av':''}${td?' td':''}" ${a?'':'disabled'} data-d="${d}" aria-selected="${sel&&sel.toDateString()===dt.toDateString()}" aria-label="${dt.toDateString()}${a?', available':''}">${d}</button>`}$('g').innerHTML=h;$('pm').disabled=vm<=new Date(now.getFullYear(),now.getMonth(),1)}
function slots(){if(!sel)return;$('sd').textContent=sel.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});const tz=$('tz').value,S=[9,9.5,10.5,11,13,14.5,15,16];$('sl').innerHTML=S.map((h,i)=>{const u=new Date(Date.UTC(sel.getFullYear(),sel.getMonth(),sel.getDate(),h-1,(h%1)*60));const t=u.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:tz});return slot===i?`<div class="bk-pair"><button data-ok="${i}">${t}</button><button data-ok="${i}">Next</button></div>`:`<button data-s="${i}" style="animation-delay:${i*25}ms">${t}</button>`}).join('')}
$('g').onclick=e=>{const b=e.target.closest('button.av');if(!b)return;sel=new Date(vm.getFullYear(),vm.getMonth(),+b.dataset.d);slot=null;cal();slots()};$('pm').onclick=()=>{vm.setMonth(vm.getMonth()-1);cal()};$('nm').onclick=()=>{vm.setMonth(vm.getMonth()+1);cal()};$('tz').onchange=slots;
$('sl').onclick=e=>{const s=e.target.closest('[data-s]');if(s){slot=+s.dataset.s;slots();return}const o=e.target.closest('[data-ok]');if(o){const t=o.parentElement.firstChild.textContent;$('c').hidden=true;$('s').hidden=true;document.querySelector('.bk').insertAdjacentHTML('beforeend',`<form class="bk-f" id="bf"><b>${sel.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${t}</b><label><span class="lbl">Name</span><input class="in" required autocomplete="name"></label><label><span class="lbl">Email</span><input class="in" type="email" required autocomplete="email"></label><label><span class="lbl">Your question (optional)</span><textarea class="in" rows="2"></textarea></label><div style="display:flex;gap:8px"><button type="button" class="b gh" id="bb">Back</button><button class="b ac">Confirm booking</button></div></form>`);$('bb').onclick=()=>{$('bf').remove();$('c').hidden=false;$('s').hidden=false};$('bf').onsubmit=ev=>{ev.preventDefault();if(!$('bf').checkValidity()){$('bf').reportValidity();return}$('bf').outerHTML=`<div class="bk-ok"><span class="pill ok">Confirmed</span><h2>You're booked with Ines</h2><p class="mu" style="margin:0">${sel.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${t} (${$('tz').value}). A calendar invite is on its way.</p><button class="b sec"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Add to calendar</button></div>`}}};cal();
</script>

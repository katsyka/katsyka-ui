<style>
.bk{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.bk :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bk ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.bk *,.bk *::before,.bk *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.bk{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.bk-pn{width:min(760px,100%);background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.bk-row{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center;padding:22px 26px;border-top:1px solid var(--line)}
.bk-row:first-child{border-top:0}
.bk-lb{font:500 11px/1.3 "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.bk-set{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bk-b{--h:40px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 16px;border-radius:10px;border:1px solid transparent;font:550 14px/1 Geist,system-ui,sans-serif;letter-spacing:-.005em;cursor:pointer;white-space:nowrap;user-select:none;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s}
.bk-b:active:not(:disabled){transform:translateY(1px)}
.bk-b svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bk-b.pri{background:var(--fg);color:var(--bg);box-shadow:0 1px 2px #0000002e}
.bk-b.pri:hover{background:color-mix(in oklab,var(--fg) 84%,var(--bg))}
.bk-b.acc{background:var(--ac);color:var(--ac-fg);box-shadow:0 1px 2px #0000002e,inset 0 1px 0 #ffffff26}
.bk-b.acc:hover{background:var(--ac-h)}
.bk-b.sec{background:var(--sf2);color:var(--fg)}
.bk-b.sec:hover{background:color-mix(in oklab,var(--sf2),var(--fg) 7%)}
.bk-b.out{background:var(--bg);color:var(--fg);border-color:color-mix(in oklab,var(--line),var(--fg) 14%);box-shadow:0 1px 2px #0000000f}
.bk-b.out:hover{background:var(--sf)}
.bk-b.gho{background:transparent;color:var(--fg)}
.bk-b.gho:hover{background:var(--sf2)}
.bk-b.dst{background:var(--err);color:light-dark(#fff,#2a0606)}
.bk-b.dst:hover{background:color-mix(in oklab,var(--err) 86%,var(--fg))}
.bk-b.lnk{height:auto;padding:2px 0;border-radius:4px;background:none;color:var(--ac);text-underline-offset:4px}
.bk-b.lnk:hover{text-decoration:underline;color:var(--ac-h)}
.bk-b.sm{--h:32px;padding:0 12px;border-radius:8px;font-size:13px;gap:6px}
.bk-b.sm svg{width:14px;height:14px}
.bk-b.lg{--h:48px;padding:0 22px;border-radius:12px;font-size:15px}
.bk-b.xl{--h:56px;padding:0 28px;border-radius:14px;font-size:16px}
.bk-b.ico{width:var(--h);padding:0}
.bk-b.pill{border-radius:999px}
.bk-b:disabled{opacity:.45;cursor:not-allowed}
.bk-b kbd{margin-left:4px;padding:2px 5px;border-radius:5px;font:500 11px/1 "Geist Mono",monospace;background:color-mix(in oklab,currentColor 14%,transparent);color:inherit;opacity:.85}
.bk-sp{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:bk-r .7s linear infinite}
@keyframes bk-r{to{transform:rotate(1turn)}}
.bk-b[aria-busy=true]{cursor:progress}
.bk-b[aria-busy=true] .bk-tx{opacity:.8}
@media (max-width:620px){.bk-row{grid-template-columns:1fr;gap:12px;padding:18px}}
</style>
<div class="bk">
  <div class="bk-pn">
    <div class="bk-row"><div class="bk-lb">Variants</div><div class="bk-set">
      <button class="bk-b pri">Primary</button><button class="bk-b acc">Accent</button><button class="bk-b sec">Secondary</button><button class="bk-b out">Outline</button><button class="bk-b gho">Ghost</button><button class="bk-b dst">Delete</button><a class="bk-b lnk" href="#">Learn more</a>
    </div></div>
    <div class="bk-row"><div class="bk-lb">Sizes</div><div class="bk-set">
      <button class="bk-b pri sm">Small</button><button class="bk-b pri">Medium</button><button class="bk-b pri lg">Large</button><button class="bk-b pri xl">Extra large</button>
    </div></div>
    <div class="bk-row"><div class="bk-lb">With icons</div><div class="bk-set">
      <button class="bk-b acc"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New project</button>
      <button class="bk-b out">Continue<svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      <button class="bk-b sec"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Export<kbd>⌘E</kbd></button>
      <button class="bk-b out ico" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="bk-b pri ico pill" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div></div>
    <div class="bk-row"><div class="bk-lb">States</div><div class="bk-set">
      <button class="bk-b pri bk-load"><span class="bk-tx">Save changes</span></button>
      <button class="bk-b out" aria-busy="true" disabled><span class="bk-sp" aria-hidden="true"></span><span class="bk-tx">Syncing…</span></button>
      <button class="bk-b pri" disabled>Disabled</button>
      <button class="bk-b acc pill lg">Get started — it’s free</button>
    </div></div>
  </div>
</div>
<script>
document.querySelectorAll(".bk-load").forEach(b=>{
  const label=b.innerHTML;
  b.addEventListener("click",()=>{
    if(b.getAttribute("aria-busy")==="true")return;
    b.style.width=b.offsetWidth+"px";
    b.setAttribute("aria-busy","true");
    b.innerHTML='<span class="bk-sp" aria-hidden="true"></span><span class="bk-tx">Saving…</span>';
    setTimeout(()=>{b.innerHTML=label;b.removeAttribute("aria-busy");b.style.width=""},1600);
  });
});
document.querySelectorAll(".bk a[href='#']").forEach(a=>a.addEventListener("click",e=>e.preventDefault()));
</script>

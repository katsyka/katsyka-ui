<style>
.ik{position:relative;height:100vh;min-height:560px;overflow:hidden;background:#000;color:#f6efe6}
.ik video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(2.2);transition:transform 1.6s cubic-bezier(.6,0,.2,1)}
.ik.open video{transform:none}
.ik-ghost{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .8s}.ik-ghost h1{margin:0;color:transparent;-webkit-text-stroke:1px #ffffff26;font-size:clamp(72px,14.5vw,250px);line-height:.8;letter-spacing:-.07em;font-weight:800;text-align:center}.ik.open .ik-ghost{opacity:0}
/* black plate with white type, multiplied over the video: the ink only shows inside the letters */
.ik-mask{position:absolute;inset:0;display:grid;place-items:center;background:#000;mix-blend-mode:multiply;transition:opacity 1.2s cubic-bezier(.6,0,.2,1)}
.ik-mask h1{margin:0;color:#fff;font-size:clamp(72px,14.5vw,250px);line-height:.8;letter-spacing:-.07em;font-weight:800;text-align:center;transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.ik.open .ik-mask{opacity:0}.ik.open .ik-mask h1{transform:scale(1.25)}
.ik-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:28px clamp(20px,4vw,56px) 36px;pointer-events:none}
.ik-top{display:flex;justify-content:space-between;font-size:14px;font-weight:500}.ik-top span:last-child{font:500 12px "Geist Mono",monospace;color:#a89f94}
.ik-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.ik-bot p{max-width:380px;margin:0;font-size:16px;line-height:1.55;color:#cfc6bb;opacity:0;transform:translateY(12px);transition:all .8s .4s cubic-bezier(.2,.8,.2,1)}
.ik.open .ik-bot p{opacity:1;transform:none}
.ik-btn{pointer-events:auto;height:48px;padding:0 22px;border-radius:99px;border:1px solid #ffffff40;background:#00000040;backdrop-filter:blur(10px);color:#f6efe6;font:550 14px Geist,sans-serif;cursor:pointer;transition:background .3s}
.ik-btn:hover{background:#ffffff1f}
</style>
<section class="ik">
  <video src="media/ink.mp4" poster="media/ink.jpg" autoplay muted loop playsinline></video>
  <div class="ik-mask"><h1>INK &amp;<br>WATER</h1></div><div class="ik-ghost" aria-hidden="true"><h1>INK &amp;<br>WATER</h1></div>
  <div class="ik-ui">
    <div class="ik-top"><span>Studio Tinta</span><span>Motion · Identity · Film</span></div>
    <div class="ik-bot"><p>The headline is a window: white type on a black plate, multiplied over a live video. Open it and the whole frame floods.</p><button class="ik-btn">Open the frame</button></div>
  </div>
</section>
<script>
(()=>{const s=document.querySelector(".ik"),b=s.querySelector(".ik-btn");b.onclick=()=>{s.classList.toggle("open");b.textContent=s.classList.contains("open")?"Back to type":"Open the frame"}})();
</script>

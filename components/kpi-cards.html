<style>
.kp{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:56px clamp(16px,4vw,48px);background:#09090b;color:#e4e4e7}
.kp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.kp-head h2{margin:0;font-size:24px;letter-spacing:-.035em;font-weight:600}.kp-head p{margin:4px 0 0;color:#71717a;font-size:13.5px}
.kp-rng{position:relative;display:flex;padding:3px;border-radius:10px;background:#111113;border:1px solid #ffffff0d}
.kp-rng button{position:relative;z-index:1;height:30px;padding:0 12px;border:0;background:none;color:#71717a;font:500 13px "Geist Mono",monospace;cursor:pointer;transition:color .2s}
.kp-rng button.on{color:#fafafa}.kp-rng i{position:absolute;top:3px;bottom:3px;border-radius:7px;background:#27272a;transition:left .35s cubic-bezier(.3,1.2,.5,1),width .35s}
.kp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kp-c{position:relative;padding:18px 18px 0;border-radius:18px;background:#111113;border:1px solid #ffffff0d;overflow:hidden}
.kp-c span{font-size:13px;color:#a1a1aa}
.kp-v{display:flex;align-items:baseline;gap:10px;margin:8px 0 2px}
.kp-v b{font-size:30px;letter-spacing:-.04em;font-weight:600;font-variant-numeric:tabular-nums}
.kp-d{font:600 12px "Geist Mono",monospace;padding:2px 7px;border-radius:6px}
.kp-d.up{color:#4ade80;background:#4ade801a}.kp-d.dn{color:#f87171;background:#f871711a}
.kp-c small{font-size:12px;color:#52525b}
.kp-sv{position:relative;height:84px;margin:12px -18px 0;cursor:crosshair}
.kp-sv svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kp-ln{position:absolute;top:0;bottom:0;width:1px;background:#ffffff26;opacity:0;pointer-events:none}
.kp-dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;border:2px solid #111113;opacity:0;pointer-events:none}
.kp-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);padding:5px 8px;border-radius:7px;background:#fafafa;color:#09090b;font:600 11.5px "Geist Mono",monospace;white-space:nowrap;opacity:0;pointer-events:none}
.kp-tip em{font-style:normal;color:#71717a;font-weight:500;margin-right:6px}
.kp-sv:hover .kp-ln,.kp-sv:hover .kp-dot,.kp-sv:hover .kp-tip{opacity:1}
@media (max-width:1000px){.kp-g{grid-template-columns:1fr 1fr}}@media (max-width:560px){.kp-g{grid-template-columns:1fr}}
</style>
<section class="kp">
  <div class="kp-head"><div><h2>Overview</h2><p>Hover a sparkline to inspect any point.</p></div>
    <div class="kp-rng"><i></i><button data-r="24h">24h</button><button data-r="7d" class="on">7d</button><button data-r="30d">30d</button><button data-r="90d">90d</button></div></div>
  <div class="kp-g"></div>
</section>
<script>
(()=>{
const M=[{k:"Revenue",c:"#ff7a3d",f:v=>"$"+Math.round(v).toLocaleString("en"),base:52000,vol:.08,trend:.012},{k:"Active users",c:"#38bdf8",f:v=>Math.round(v).toLocaleString("en"),base:18400,vol:.05,trend:.006},
  {k:"Conversion",c:"#a78bfa",f:v=>v.toFixed(2)+"%",base:3.4,vol:.06,trend:-.004},{k:"Avg. latency",c:"#4ade80",f:v=>Math.round(v)+" ms",base:142,vol:.1,trend:-.01,inv:1}];
const N={"24h":24,"7d":28,"30d":30,"90d":45},grid=document.querySelector(".kp-g");let seed=1;
const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const gen=(m,n,s)=>{seed=s;let v=m.base,a=[];for(let i=0;i<n;i++){v*=1+m.trend+(rnd()-.5)*m.vol;a.push(v)}return a};
grid.innerHTML=M.map((m,i)=>`<div class="kp-c"><span>${m.k}</span><div class="kp-v"><b>–</b><em class="kp-d"></em></div><small>vs previous period</small>
  <div class="kp-sv"><svg preserveAspectRatio="none"><defs><linearGradient id="kpg${i}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${m.c}" stop-opacity=".28"/><stop offset="1" stop-color="${m.c}" stop-opacity="0"/></linearGradient></defs><path class="a" fill="url(#kpg${i})"/><path class="l" fill="none" stroke="${m.c}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
  <i class="kp-ln"></i><i class="kp-dot" style="background:${m.c}"></i><div class="kp-tip"></div></div></div>`).join("");
const cards=[...grid.children].map((el,i)=>({el,m:M[i],pts:null,cur:null,shown:0}));
const toPath=(a,w,h)=>{const mn=Math.min(...a),mx=Math.max(...a),sx=w/(a.length-1),P=a.map((v,i)=>[i*sx,h-6-(v-mn)/(mx-mn||1)*(h-18)]);
  let d=`M${P[0][0]} ${P[0][1]}`;for(let i=1;i<P.length;i++){const[x0,y0]=P[i-1],[x1,y1]=P[i],cx=(x0+x1)/2;d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`}return{d,P}};
const resample=(a,n)=>[...Array(n)].map((_,i)=>{const t=i/(n-1)*(a.length-1),k=Math.floor(t),f=t-k;return a[k]*(1-f)+(a[Math.min(k+1,a.length-1)])*f});
function draw(c){const sv=c.el.querySelector("svg"),w=sv.clientWidth,h=sv.clientHeight;sv.setAttribute("viewBox",`0 0 ${w} ${h}`);
  const {d,P}=toPath(c.cur,w,h);c.P=P;sv.querySelector(".l").setAttribute("d",d);sv.querySelector(".a").setAttribute("d",d+` L${w} ${h} L0 ${h}Z`)}
function setRange(r,first){const n=N[r];cards.forEach((c,i)=>{const next=gen(c.m,n,i*97+n*13+5),from=c.cur?resample(c.cur,n):next.map(()=>next[0]);
  const last=next[n-1],prev=next[0],pct=(last-prev)/prev*100,good=c.m.inv?pct<0:pct>0,dEl=c.el.querySelector(".kp-d");
  dEl.className="kp-d "+(good?"up":"dn");dEl.textContent=(pct>0?"+":"")+pct.toFixed(1)+"%";
  const b=c.el.querySelector(".kp-v b"),v0=c.shown||last*.6,t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/(first?1100:600)),e=1-(1-k)**3;c.cur=from.map((v,j)=>v+(next[j]-v)*e);draw(c);c.shown=v0+(last-v0)*e;b.textContent=c.m.f(c.shown);if(k<1)requestAnimationFrame(f)})(t0);c.data=next})}
cards.forEach(c=>{const sv=c.el.querySelector(".kp-sv"),ln=sv.querySelector(".kp-ln"),dot=sv.querySelector(".kp-dot"),tip=sv.querySelector(".kp-tip");
  sv.addEventListener("pointermove",e=>{const r=sv.getBoundingClientRect(),i=Math.round((e.clientX-r.left)/r.width*(c.P.length-1)),[x,y]=c.P[Math.max(0,Math.min(c.P.length-1,i))];
    ln.style.left=dot.style.left=tip.style.left=x+"px";dot.style.top=y+"px";tip.style.left=Math.max(40,Math.min(r.width-40,x))+"px";tip.innerHTML=`<em>#${i+1}</em>${c.m.f(c.data[i])}`})});
const rng=document.querySelector(".kp-rng"),pill=rng.querySelector("i");
const pick=b=>{rng.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));pill.style.left=b.offsetLeft+"px";pill.style.width=b.offsetWidth+"px"};
rng.querySelectorAll("button").forEach(b=>b.onclick=()=>{pick(b);setRange(b.dataset.r)});
addEventListener("resize",()=>cards.forEach(draw));
requestAnimationFrame(()=>{pick(rng.querySelector(".on"));setRange("7d",true)});
})();
</script>

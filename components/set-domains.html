<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.dm{align-items:start}.dm-w{width:min(720px,100%);display:grid;gap:14px}.dm-w h1{margin:0;font-size:24px;letter-spacing:-.02em}
.dm-add{display:flex;gap:8px}.dm-add .in{height:44px;font:15px 'Geist Mono',monospace}.dm-add .b{height:44px;flex:none}.dm-er{color:var(--err);font-size:13px;margin:-6px 0 0}.dm-er:empty{display:none}
.dm-l{display:grid;gap:12px}.dm-d{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;animation:dmf .25s cubic-bezier(.23,1,.32,1)}@keyframes dmf{from{opacity:0;transform:translateY(-4px)}}
.dm-h{display:flex;gap:12px;align-items:center;padding:14px 16px}.dm-h code{font:600 15px 'Geist Mono',monospace;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.dm-h .b{height:32px}
.dm-rec{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--sf);display:grid;gap:10px}.dm-rec p{margin:0;font-size:13px}.dm-tw{overflow-x:auto;position:relative}.dm-rec table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}.dm-rec th{text-align:left;font-weight:550;color:var(--mu);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}.dm-rec td{padding:8px 10px;font-family:'Geist Mono',monospace;white-space:nowrap}.dm-rec td .ibt{width:28px;height:28px}
.dm-sp{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:dms .7s linear infinite;display:inline-block}@keyframes dms{to{transform:rotate(1turn)}}
</style>
<div class="k dm"><div class="dm-w"><h1>Domains</h1><form class="dm-add" id="f" novalidate><label class="vh" for="d">Domain</label><input class="in" id="d" placeholder="docs.yourcompany.com" autocomplete="off" spellcheck="false" aria-describedby="er"><button class="b ac">Add domain</button></form><p class="dm-er" id="er" role="alert"></p><div id="l" class="dm-l"></div></div></div>
<script>
let D=[{d:'help.northwind.example',s:'live'}];const l=document.getElementById('l'),SP={live:['ok','● Live · SSL active'],pending:['warn','Waiting for DNS'],checking:['info','<span class="dm-sp"></span> Checking DNS…'],ssl:['info','<span class="dm-sp"></span> Issuing certificate…']};
const cp=t=>(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{});
function draw(){l.innerHTML=D.map((x,i)=>{const sub=x.d.split('.').length>2,name=sub?x.d.split('.')[0]:'@';return `<div class="dm-d"><div class="dm-h"><code>${x.d}</code><span class="pill ${SP[x.s][0]}">${SP[x.s][1]}</span>${x.s==='pending'?`<button class="b sec sm" data-c="${i}">Check again</button>`:''}<button class="ibt" data-r="${i}" aria-label="Remove ${x.d}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg></button></div>${x.s!=='live'?`<div class="dm-rec"><p>Add this record at your DNS provider. Changes can take up to an hour.${x.tries?` <b>Not found yet (${x.tries} ${x.tries>1?'checks':'check'}).</b>`:''}</p><div class="dm-tw"><table><thead><tr><th>Type</th><th>Name</th><th>Value</th><th></th></tr></thead><tbody><tr><td>${sub?'CNAME':'A'}</td><td>${name}</td><td>${sub?'cname.quill-hosting.net':'76.76.21.21'}</td><td><button class="ibt" data-cp="${sub?'cname.quill-hosting.net':'76.76.21.21'}" aria-label="Copy value"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button></td></tr><tr><td>TXT</td><td>_quill</td><td>verify=${btoa(x.d).slice(0,14).toLowerCase()}</td><td><button class="ibt" data-cp="verify=${btoa(x.d).slice(0,14).toLowerCase()}" aria-label="Copy value"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button></td></tr></tbody></table></div></div>`:''}</div>`}).join('')}
l.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cp){cp(b.dataset.cp);b.innerHTML='<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M20 6 9 17l-5-5"/></svg>';setTimeout(()=>b.innerHTML='<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',1200);return}if(b.dataset.r){D.splice(+b.dataset.r,1);draw();return}if(b.dataset.c){const x=D[+b.dataset.c];x.s='checking';draw();setTimeout(()=>{x.tries=(x.tries||0)+1;if(x.tries<2){x.s='pending';draw();return}x.s='ssl';draw();setTimeout(()=>{x.s='live';draw()},1400)},1200)}};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('d'),v=i.value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,''),er=document.getElementById('er');const ok=/^([a-z0-9-]+\.)+[a-z]{2,}$/.test(v);i.setAttribute('aria-invalid',!ok);er.textContent=!ok?'Enter a domain like docs.yourcompany.com, without https://':D.some(x=>x.d===v)?'That domain is already added.':'';if(er.textContent)return i.focus();D.unshift({d:v,s:'pending'});i.value='';draw()};draw();
</script>

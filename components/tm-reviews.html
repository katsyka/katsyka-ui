<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.rv{width:min(920px,100%);display:grid;grid-template-columns:240px 1fr;gap:36px;align-items:start}.rv-s{display:grid;gap:6px;position:sticky;top:16px}.rv-avg{font-size:48px;letter-spacing:-.04em;line-height:1}.rv-st{font-size:18px;letter-spacing:2px;color:#d97706}
.rv-h{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:4px}.rv-h button{width:100%;display:grid;grid-template-columns:28px 1fr 32px;gap:8px;align-items:center;font-size:13px;padding:4px 6px;border-radius:6px;min-height:32px}.rv-h button:hover{background:var(--sf2)}.rv-h [aria-pressed=true]{background:var(--sf2);font-weight:650}.rv-h i{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden}.rv-h i::after{content:"";display:block;height:100%;width:var(--w);background:#d97706;border-radius:4px}.rv-h span:last-child{text-align:right;color:var(--mu);font-variant-numeric:tabular-nums}
.rv-tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}.rv-tb select{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font:inherit;color:var(--fg);margin-left:6px}
.rv-l{list-style:none;padding:0;margin:0}.rv-l li{padding:18px 0;border-top:1px solid var(--line);display:grid;gap:8px;animation:rvf .25s cubic-bezier(.23,1,.32,1)}@keyframes rvf{from{opacity:0}}.rv-l .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}.rv-l .stars{color:#d97706;letter-spacing:1px}.rv-l h3{margin:0;font-size:15px}.rv-l p{margin:0;font-size:14px;line-height:1.6}.rv-l .vf{color:var(--ok);font-size:12px;display:flex;gap:4px;align-items:center}
.rv-hp{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}.rv-hp button{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:12px}.rv-hp [aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (max-width:760px){.rv{grid-template-columns:1fr}.rv-s{position:static}}
</style>
<div class="k"><section class="rv"><aside class="rv-s"><b class="rv-avg tn" id="av"></b><span class="rv-st" id="ss" aria-hidden="true"></span><span class="mu" id="ct"></span><ul class="rv-h" id="h"></ul></aside>
<div><div class="rv-tb"><span class="mu" id="sh"></span><label class="mu">Sort <select id="so"><option value="new">Newest</option><option value="help">Most helpful</option><option value="low">Lowest rating</option></select></label></div><ul class="rv-l" id="l"></ul></div></section></div>
<script>
const R=[[5,"Warm without the bulk","Wore it on a 6-hour hike at 2°C. Didn't take it off once.","Lina, Bergen",1,14,2],[4,"Great, runs a bit long","Love the fabric. Sleeves are long on me (I'm 1.65 m), size down if you're between sizes.","Jess, Leeds",1,31,6],[5,"Third one I've bought","Same as the last two, which is exactly what I wanted.","Marco, Turin",1,8,11],[2,"Pilled after a month","Comfortable, but the elbows pilled quickly. Support offered a replacement, which was nice.","Sam, Utrecht",1,22,18],[5,"Perfect travel layer","Packs into its own pocket, doesn't wrinkle.","Aiko, Osaka",0,5,25],[3,"Nice colour, thin","Lighter than I expected from the photos. Fine for spring.","Pat, Cork",1,3,40],[4,"Good value","Not the warmest, but the best one at this price.","Ola, Malmö",1,9,52]];
const voted=new Set();let fs=0;const $=i=>document.getElementById(i),st=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const avg=R.reduce((a,r)=>a+r[0],0)/R.length;$('av').textContent=avg.toFixed(1);$('ss').textContent=st(Math.round(avg));$('ct').textContent=`${R.length} reviews`;
function draw(){$('h').innerHTML=[5,4,3,2,1].map(n=>{const c=R.filter(r=>r[0]===n).length;return `<li><button aria-pressed="${fs===n}" data-n="${n}" aria-label="Show ${n}-star reviews (${c})"><span>${n}★</span><i style="--w:${c/R.length*100}%"></i><span>${c}</span></button></li>`}).join('');
const so=$('so').value,L=R.map((r,i)=>[r,i]).filter(([r])=>!fs||r[0]===fs).sort((a,b)=>so==='new'?a[0][6]-b[0][6]:so==='help'?b[0][5]-a[0][5]:a[0][0]-b[0][0]);$('sh').textContent=fs?`Showing ${L.length} ${fs}-star review${L.length!==1?'s':''} · `:'';if(fs)$('sh').innerHTML+=`<button id="cl" style="text-decoration:underline">Show all</button>`;
$('l').innerHTML=L.map(([[s,h,p,n,v,hp,d],i])=>`<li><div class="t"><span class="stars" aria-label="${s} out of 5">${st(s)}</span><b>${n}</b><span class="mu">${d} days ago</span>${v?'<span class="vf"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:12px;height:12px"><path d="M20 6 9 17l-5-5"/></svg>Verified purchase</span>':''}</div><h3>${h}</h3><p>${p}</p><div class="rv-hp"><button aria-pressed="${voted.has(i)}" data-v="${i}">Helpful</button><span class="tn">${hp+(voted.has(i)?1:0)} people found this helpful</span></div></li>`).join('');const cl=$('cl');if(cl)cl.onclick=()=>{fs=0;draw()}}
$('h').onclick=e=>{const b=e.target.closest('[data-n]');if(b){fs=fs===+b.dataset.n?0:+b.dataset.n;draw()}};$('l').onclick=e=>{const b=e.target.closest('[data-v]');if(b){const i=+b.dataset.v;voted.has(i)?voted.delete(i):voted.add(i);draw()}};$('so').onchange=draw;draw();
</script>

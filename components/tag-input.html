<style>
.ti{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.ti :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ti ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.ti *,.ti *::before,.ti *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.ti{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.ti-pn{width:min(520px,100%);display:grid;gap:22px;padding:26px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.ti-f{display:flex;flex-direction:column;gap:6px}
.ti-f>label{font-size:14px;font-weight:550;display:flex}
.ti-f>label small{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--mu)}
.ti-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:42px;padding:6px 8px;border-radius:10px;border:1px solid color-mix(in oklab,var(--ctl) 70%,var(--bg));background:var(--bg);cursor:text;box-shadow:0 1px 2px #0000000a;transition:border-color .15s,box-shadow .15s}
.ti-box:hover{border-color:var(--ctl)}
.ti-box:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklab,var(--focus) 22%,transparent)}
.ti-box input{flex:1;min-width:110px;height:28px;padding:0 4px;border:0;background:none;color:var(--fg);font:16px Geist,system-ui,sans-serif;outline:0}
.ti-box input:focus-visible{outline:0}
@media (min-width:640px){.ti-box input{font-size:14px}}
.ti-tag{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:7px;background:var(--sf2);font-size:13.5px;font-weight:500;animation:ti-in .2s var(--ease);max-width:100%}
.ti-tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-tag button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:5px;background:none;color:var(--mu);cursor:pointer}
.ti-tag button:hover{background:color-mix(in oklab,var(--fg) 10%,transparent);color:var(--fg)}
.ti-tag button svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.ti-tag.hl{background:var(--ac-sf);color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.ti-tag.dup{animation:ti-shake .35s}
.ti-tag.mail{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding-left:3px}
.ti-tag.mail .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 10px Geist,system-ui,sans-serif;color:#fff}
.ti-tag.bad{background:var(--err-sf);color:var(--err);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--err) 50%,transparent)}
@keyframes ti-in{from{opacity:0;transform:scale(.85)}}
@keyframes ti-shake{25%,75%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.ti-hint{font-size:13px;color:var(--mu)}
.ti-hint kbd{font:500 11px "Geist Mono",monospace;padding:1px 5px;border-radius:4px;border:1px solid var(--line);background:var(--sf)}
.ti-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ti-sug button{height:28px;padding:0 10px;border-radius:99px;border:1px dashed var(--ctl);background:none;color:var(--mu);font:500 13px Geist,system-ui,sans-serif;cursor:pointer}
.ti-sug button:hover{border-style:solid;color:var(--fg)}
</style>
<div class="ti">
  <div class="ti-pn">
    <div class="ti-f" data-tags data-max="6"><label for="tiA">Topics <small id="tiAc"></small></label>
      <div class="ti-box"><input id="tiA" placeholder="Add a topic…" aria-describedby="tiAh"></div>
      <div class="ti-hint" id="tiAh">Press <kbd>Enter</kbd> or <kbd>,</kbd> to add · <kbd>⌫</kbd> removes the last one</div>
      <div class="ti-sug" aria-label="Suggestions"></div></div>
    <div class="ti-f" data-tags data-mail><label for="tiB">Invite by email <small>Paste a list</small></label>
      <div class="ti-box"><input id="tiB" type="email" placeholder="name@company.com" aria-describedby="tiBh"></div>
      <div class="ti-hint" id="tiBh" aria-live="polite">Separate with commas, spaces or new lines.</div></div>
  </div>
</div>
<script>
const COLORS=["#c2410c","#0e7490","#7c3aed","#15803d","#be185d","#1d4ed8"];
const init={tiA:["design-systems","accessibility","css"],tiB:["mira@studio.io","jun@studio.io"]};
const sugg=["typography","motion","react","performance","color"];
const live=document.createElement("div");live.setAttribute("aria-live","polite");live.style.cssText="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)";document.body.append(live);
document.querySelectorAll("[data-tags]").forEach(f=>{
  const box=f.querySelector(".ti-box"),inp=box.querySelector("input"),mail=f.hasAttribute("data-mail"),max=+f.dataset.max||99,cnt=f.querySelector("small[id]"),sg=f.querySelector(".ti-sug");
  let tags=[];
  const valid=v=>!mail||/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  const render=()=>{box.querySelectorAll(".ti-tag").forEach(t=>t.remove());
    tags.forEach((t,i)=>{const el=document.createElement("span");el.className="ti-tag"+(mail?" mail":"")+(valid(t)?"":" bad");
      el.innerHTML=(mail?`<span class="av" style="background:${COLORS[t.charCodeAt(0)%COLORS.length]}">${t[0].toUpperCase()}</span>`:"")+`<span></span><button type="button" aria-label="Remove ${t}"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
      el.querySelector("span:not(.av)").textContent=t;
      el.querySelector("button").onclick=e=>{e.stopPropagation();tags.splice(i,1);render();live.textContent=`Removed ${t}`;inp.focus()};
      box.insertBefore(el,inp)});
    if(cnt)cnt.textContent=`${tags.length}/${max}`;inp.disabled=tags.length>=max;inp.placeholder=tags.length>=max?"Limit reached":(mail?"name@company.com":"Add a topic…");
    if(sg)sg.innerHTML=sugg.filter(s=>!tags.includes(s)).slice(0,4).map(s=>`<button type="button">+ ${s}</button>`).join("");
    if(sg)sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{add(b.textContent.slice(2));inp.focus()});
    const bad=tags.filter(t=>!valid(t)).length;if(mail)f.querySelector(".ti-hint").textContent=bad?`${bad} address${bad>1?"es look":" looks"} invalid. Click × to remove.`:`${tags.length} invite${tags.length===1?"":"s"} ready.`};
  const add=raw=>{const v=(mail?raw.trim():raw.trim().toLowerCase().replace(/\s+/g,"-")).replace(/^[,;]+|[,;]+$/g,"");if(!v)return;
    const i=tags.indexOf(v);if(i>-1){const el=box.querySelectorAll(".ti-tag")[i];el.classList.remove("dup");void el.offsetWidth;el.classList.add("dup");return}
    if(tags.length>=max)return;tags.push(v);render();live.textContent=`Added ${v}`};
  inp.addEventListener("keydown",e=>{
    if((e.key==="Enter"||e.key===","||(mail&&e.key===" "))&&inp.value.trim()){e.preventDefault();add(inp.value);inp.value=""}
    else if(e.key==="Backspace"&&!inp.value&&tags.length){const last=box.querySelectorAll(".ti-tag");const l=last[last.length-1];if(l.classList.contains("hl")){const t=tags.pop();render();live.textContent=`Removed ${t}`}else l.classList.add("hl")}
    else box.querySelectorAll(".ti-tag.hl").forEach(t=>t.classList.remove("hl"));
  });
  inp.addEventListener("paste",e=>{const t=(e.clipboardData||window.clipboardData).getData("text");if(/[,;\s\n]/.test(t.trim())){e.preventDefault();t.split(/[,;\s\n]+/).forEach(add)}});
  inp.addEventListener("blur",()=>{if(inp.value.trim()){add(inp.value);inp.value=""}});
  box.addEventListener("click",()=>inp.focus());
  tags=init[inp.id].slice();if(mail)tags.push("alex@");render();
});
</script>

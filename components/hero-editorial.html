<style>
.ed{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:#f2eee6;color:#1d1a16}
.ed-l{display:flex;flex-direction:column;justify-content:space-between;padding:32px clamp(20px,4vw,56px) 44px}
.ed-top{display:flex;justify-content:space-between;font:500 12px "Geist Mono",monospace;letter-spacing:.06em;color:#7a7268}
.ed h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(60px,9.5vw,150px);line-height:.86;letter-spacing:-.035em;margin:0}
.ed h1 i{font-style:italic}
.ed-list{list-style:none;margin:0;padding:0;border-top:1px solid #1d1a1622}
.ed-list li{display:grid;grid-template-columns:42px 1fr auto;align-items:baseline;padding:14px 0;border-bottom:1px solid #1d1a1622;cursor:pointer;transition:padding .4s cubic-bezier(.2,.8,.2,1)}
.ed-list li span{font:12px "Geist Mono",monospace;color:#9a9186}
.ed-list li b{font-weight:500;font-size:18px;letter-spacing:-.02em}
.ed-list li small{font-size:13px;color:#9a9186}
.ed-list li.on{padding-left:12px}.ed-list li.on b{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:21px}
.ed-r{position:relative;padding:28px 28px 28px 0}
.ed-frame{position:relative;height:100%;min-height:420px;border-radius:999px 999px 18px 18px;overflow:hidden;background:#d9d2c5}
.ed-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:circle(0% at 50% 60%);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}
.ed-frame img.on{clip-path:circle(150% at 50% 60%)}
.ed-frame img.under{clip-path:circle(150% at 50% 60%);transition:none}
.ed-num{position:absolute;right:48px;bottom:44px;font-family:"Instrument Serif",serif;font-size:64px;line-height:1;color:#fff;mix-blend-mode:difference}
.ed-prog{position:absolute;left:0;right:28px;bottom:10px;height:2px;background:#1d1a1615}.ed-prog i{position:absolute;inset:0;background:#1d1a16;transform-origin:left;transform:scaleX(0)}
@media (max-width:860px){.ed{grid-template-columns:1fr}.ed-r{padding:0 20px 30px;height:70vh}}
</style>
<section class="ed">
  <div class="ed-l">
    <div class="ed-top"><span>THE SLOW ISSUE</span><span>Nº 14 — AUTUMN</span></div>
    <h1>Places that<br><i>wait</i> for you.</h1>
    <ul class="ed-list">
      <li data-i="1015"><span>01</span><b>A river that forgets the sea</b><small>12 min</small></li>
      <li data-i="1039"><span>02</span><b>Waterfalls after the rain</b><small>8 min</small></li>
      <li data-i="1043"><span>03</span><b>The forest keeps time</b><small>15 min</small></li>
      <li data-i="1036"><span>04</span><b>Snow on the long road</b><small>10 min</small></li>
    </ul>
  </div>
  <div class="ed-r"><div class="ed-frame"></div><div class="ed-num">01</div><div class="ed-prog"><i></i></div></div>
</section>
<script>
(()=>{
const items=[...document.querySelectorAll(".ed-list li")],frame=document.querySelector(".ed-frame"),num=document.querySelector(".ed-num"),bar=document.querySelector(".ed-prog i");
const imgs=items.map(li=>{const im=new Image();im.src=`https://picsum.photos/id/${li.dataset.i}/900/1200`;im.alt="";frame.append(im);return im});
let cur=-1,timer,anim;
function go(i){if(i===cur)return;const prev=imgs[cur];imgs.forEach(im=>im.classList.remove("under"));
  if(prev){prev.classList.add("under");prev.classList.remove("on")}
  const im=imgs[i];frame.append(im);im.classList.remove("on");void im.offsetWidth;im.classList.add("on");
  items.forEach((li,k)=>li.classList.toggle("on",k===i));num.textContent=String(i+1).padStart(2,"0");cur=i;
  anim?.cancel();anim=bar.animate([{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:5000,easing:"linear",fill:"forwards"});
  clearTimeout(timer);timer=setTimeout(()=>go((cur+1)%imgs.length),5000)}
items.forEach((li,i)=>{li.addEventListener("mouseenter",()=>go(i));li.addEventListener("click",()=>go(i))});
go(0);
})();
</script>

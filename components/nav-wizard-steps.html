<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.wz{width:min(860px,100%);display:grid;grid-template-columns:260px 1fr;border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden;min-height:420px}.wz-n{border-right:1px solid var(--line);padding:18px;background:var(--sf)}.wz-p{display:flex;gap:6px;align-items:baseline;margin-bottom:14px}.wz-p b{font-size:22px}
.wz-n ol{list-style:none;padding:0;margin:0;display:grid}.wz-n li{position:relative;padding-bottom:6px}.wz-n li:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:-2px;width:2px;background:var(--line)}.wz-n li.dn::after{background:var(--ok)}
.wz-n button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:4px;border-radius:8px;font-size:14px;color:var(--mu)}.wz-n button:disabled{cursor:not-allowed}.wz-n button:not(:disabled):hover{background:var(--bg)}.wz-n .d{width:28px;height:28px;border-radius:50%;border:2px solid var(--ctl);display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg);flex:none}
.wz-n .dn button{color:var(--fg)}.wz-n .dn .d{background:var(--ok);border-color:var(--ok);color:#fff}.wz-n .cur button{color:var(--fg);font-weight:650}.wz-n .cur .d{border-color:var(--fg);color:var(--fg)}.wz-n .er .d{border-color:var(--err);color:var(--err)}.wz-n .er button{color:var(--err)}.wz-n .lk .d .i{width:12px;height:12px}
.wz-n ul{list-style:none;margin:2px 0 4px 44px;padding:0;display:grid;gap:2px;font-size:13px}.wz-n ul li{color:var(--mu);padding:0}.wz-n ul li::after{display:none}.wz-n ul li.ok{color:var(--fg)}.wz-n ul li.ok::before{content:"✓ ";color:var(--ok)}
.wz-c{padding:28px;display:grid;gap:14px;align-content:start}.wz-c h2{margin:0;font-size:22px;letter-spacing:-.02em}.wz-c p{margin:0}.wz-c .row{display:flex;gap:8px;margin-top:8px}.wz-c .b{height:42px}
@media (max-width:700px){.wz{grid-template-columns:1fr}.wz-n{border-right:0;border-bottom:1px solid var(--line)}}
</style>
<div class="k"><div class="wz"><nav class="wz-n" aria-label="Setup steps"><div class="wz-p"><b class="tn" id="pc"></b><span class="mu">complete</span></div><ol id="l"></ol></nav><section class="wz-c" id="c"></section></div></div>
<script>
const S=[["Company details",[],"Name, address and VAT number."],["Connect bank",["Choose bank","Approve in banking app","Pick accounts"],"Read-only access to import transactions."],["Import invoices",[],"Upload a CSV or connect your old tool."],["Invite accountant",[],"They get access to reports, not your bank login."],["Review and go live",[],"Check everything once more."]];let st=['dn','cur','','',''],cur=1,sub=1;const l=document.getElementById('l'),c=document.getElementById('c');
function draw(){const done=st.filter(x=>x==='dn').length;document.getElementById('pc').textContent=Math.round(done/S.length*100)+'%';
l.innerHTML=S.map(([n,ss],i)=>{const s=i===cur?'cur':st[i]||'lk';return`<li class="${s}"><button ${s==='lk'?'disabled':''} data-i="${i}" ${i===cur?'aria-current="step"':''}><span class="d">${s==='dn'?'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M20 6 9 17l-5-5"/></svg>':s==='lk'?'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>':s==='er'?'!':i+1}</span>${n}</button>${i===cur&&ss.length?`<ul>${ss.map((x,k)=>`<li class="${k<sub?'ok':''}">${x}</li>`).join('')}</ul>`:''}</li>`}).join('');
const [n,ss,d]=S[cur];c.innerHTML=`<h2>${n}</h2><p class="mu">${d}</p>${ss.length?`<p>Step ${Math.min(sub+1,ss.length)} of ${ss.length}: <b>${ss[Math.min(sub,ss.length-1)]}</b></p>`:''}<div class="row">${cur>0?'<button class="b gh" data-a="back">Back</button>':''}${cur===2?'<button class="b sec" data-a="err">Simulate upload error</button>':''}<button class="b ac" data-a="next">${cur===S.length-1?'Go live':ss.length&&sub<ss.length-1?'Continue':'Next step'}</button></div>`}
c.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='back'){cur--;sub=0;draw();return}if(a==='err'){st[cur]='er';cur=Math.min(S.length-1,cur+1);if(!st[cur])st[cur]='cur';draw();return}const ss=S[cur][1];if(ss.length&&sub<ss.length-1){sub++;draw();return}st[cur]='dn';if(cur<S.length-1){cur++;sub=0;if(!st[cur])st[cur]='cur'}else{c.innerHTML='<h2>You\'re live 🎉</h2><p class="mu">Invoices and bank feeds are syncing.</p>'.replace(' 🎉','');l.querySelectorAll('li').forEach(x=>x.className='dn');document.getElementById('pc').textContent='100%';return}draw()};
l.onclick=e=>{const b=e.target.closest('[data-i]');if(!b||b.disabled)return;cur=+b.dataset.i;sub=0;draw()};draw();
</script>

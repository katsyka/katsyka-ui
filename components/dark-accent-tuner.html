<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.at2{width:min(720px,100%);padding:24px}.at2 h2{margin:0;font-size:17px;font-weight:650}.at2 header p{margin:4px 0 16px}
.at2-row{display:flex;gap:8px}.at2-row input[type=color]{width:44px;height:40px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}.at2-row .in{font-family:"Geist Mono",monospace;width:120px}
.at2 input[type=range]{width:100%;accent-color:var(--ac)}
.at2-cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.at2-p{padding:16px;border-radius:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.at2-p.lt{background:#fff;color:#18181b;border:1px solid #e4e4e1;color-scheme:light}.at2-p.dk{background:#0f0f11;color:#ececee;border:1px solid #ffffff14;color-scheme:dark}
.at2-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.at2-b{height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px}
.at2-p a{font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:default}
.at2-p table{width:100%;border-collapse:collapse;font-size:12px}.at2-p td{padding:4px 0;border-top:1px solid color-mix(in srgb,currentColor 12%,transparent)}.at2-p td:last-child{text-align:right}
.at2-p .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px #8884}
.ok{color:#16a34a}.dk .ok{color:#4ade80}.no{color:#dc2626}.dk .no{color:#f87171}
.at2-out{margin:16px 0 0;font:500 13px "Geist Mono",monospace;padding:10px 12px;border-radius:10px;background:var(--sf);overflow-x:auto;white-space:nowrap}
@media (max-width:560px){.at2-cmp{grid-template-columns:1fr}}
</style>
<div class="k"><section class="card at2"><header><h2>Accent for dark mode</h2><p class="mu">Never reuse the light-mode accent as is. Lift it, calm it, check it.</p></header>
  <div class="at2-in"><label class="lbl" for="pk">Brand colour</label><div class="at2-row"><input type="color" id="pk" value="#c2410c"><input class="in tn" id="hx" value="#c2410c" maxlength="7" aria-label="Hex"></div>
  <label class="lbl" for="lf" style="margin-top:12px">Lightness lift <span class="mu tn" id="lfv"></span></label><input type="range" id="lf" min="0" max="0.3" step="0.01" value="0.14"><label class="lbl" for="cf">Chroma kept <span class="mu tn" id="cfv"></span></label><input type="range" id="cf" min="0.4" max="1" step="0.05" value="0.8"></div>
  <div class="at2-cmp"><div class="at2-p lt"><span class="at2-tag">Light</span><button class="at2-b" id="bl">Get started</button><a id="al">Read the docs →</a><table id="tl"></table></div><div class="at2-p dk"><span class="at2-tag">Dark</span><button class="at2-b" id="bd">Get started</button><a id="ad">Read the docs →</a><table id="td"></table></div></div>
  <p class="at2-out tn" id="out"></p></section></div>
<script>
const toLin=c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4,toS=c=>c<=.0031308?12.92*c:1.055*c**(1/2.4)-.055;
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
const rgb2hex=r=>"#"+r.map(c=>Math.round(Math.min(1,Math.max(0,c))*255).toString(16).padStart(2,"0")).join("");
const rgb2ok=([r,g,b])=>{r=toLin(r);g=toLin(g);b=toLin(b);const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);const L=.2104542553*l+.793617785*m-.0040720468*s,A=1.9779984951*l-2.428592205*m+.4505937099*s,B=.0259040371*l+.7827717662*m-.808675766*s;return[L,Math.hypot(A,B),Math.atan2(B,A)]};
const ok2rgb=([L,C,H])=>{const A=C*Math.cos(H),B=C*Math.sin(H);const l=(L+.3963377774*A+.2158037573*B)**3,m=(L-.1055613458*A-.0638541728*B)**3,s=(L-.0894841775*A-1.291485548*B)**3;return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s].map(toS)};
const lum=h=>{const[r,g,b]=hex2rgb(h).map(toLin);return .2126*r+.7152*g+.0722*b},cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const tbl=(acc,surf)=>surf.map(([n,s])=>{const c=cr(acc,s);return`<tr><td><span class="sw" style="background:${s}"></span>${n}</td><td class="${c>=4.5?"ok":c>=3?"":"no"}">${c.toFixed(2)}:1 ${c>=4.5?"text ✓":c>=3?"UI only":"✗"}</td></tr>`}).join("");
const run=()=>{const h=hx.value;if(!/^#[0-9a-f]{6}$/i.test(h))return;const[L,C,H]=rgb2ok(hex2rgb(h));const lift=+lf.value,keep=+cf.value;let dL=Math.min(.86,Math.max(L+lift,.68)),dC=C*keep,dh;
 for(let k=0;k<20;k++){dh=rgb2hex(ok2rgb([dL,dC,H]));if(cr(dh,"#26262b")>=4.5)break;dL+=.01}
 lfv.textContent="+"+lift.toFixed(2);cfv.textContent=Math.round(keep*100)+"%";
 const lfg=lum(h)>.4?"#111":"#fff",dfg=lum(dh)>.35?"#111":"#fff";
 bl.style.cssText=`background:${h};color:${lfg}`;al.style.color=h;bd.style.cssText=`background:${dh};color:${dfg}`;ad.style.color=dh;
 tl.innerHTML=tbl(h,[["Page #ffffff","#ffffff"],["Surface #f6f6f4","#f6f6f4"],["Raised #ececea","#ececea"]]);td.innerHTML=tbl(dh,[["Page #0f0f11","#0f0f11"],["Surface #18181b","#18181b"],["Raised #26262b","#26262b"]]);
 out.textContent=`--ac: light-dark(${h}, ${dh});  /* oklch(${dL.toFixed(3)} ${dC.toFixed(3)} ${((H*180/Math.PI+360)%360).toFixed(1)}) */`};
pk.oninput=()=>{hx.value=pk.value;run()};hx.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(hx.value))pk.value=hx.value;run()};lf.oninput=cf.oninput=run;run();
</script>

<style>
.sw{position:relative;height:440vh;background:#0e1013;color:#fff}
.sw-pin{position:sticky;top:0;height:100vh;overflow:hidden}
.sw canvas{position:absolute;inset:0;width:100%;height:100%}
.sw-a{position:absolute;left:clamp(20px,5vw,72px);top:50%;translate:0 -50%}
.sw small{font:500 12px "Geist Mono",monospace;letter-spacing:.16em;color:#ffffffc8}
.sw-a h2{margin:16px 0 12px;font-size:clamp(48px,6.4vw,100px);line-height:.9;letter-spacing:-.06em;font-weight:600}
.sw em{font:italic 400 1.05em "Instrument Serif",serif;letter-spacing:-.025em}
.sw-a p{margin:0;font:italic 400 26px "Instrument Serif",serif;color:#ffffffd8}
.sw-b{position:absolute;left:clamp(20px,5vw,72px);bottom:clamp(28px,8vh,72px);max-width:640px}
.sw-b h2{margin:14px 0 24px;font-size:clamp(38px,5vw,76px);line-height:.94;letter-spacing:-.055em;font-weight:600}
.sw-cta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.sw-cta a{display:inline-flex;align-items:center;height:46px;padding:0 22px;border-radius:99px;font-size:15px;font-weight:550;text-decoration:none;color:#0e1013;background:#fff;transition:transform .2s}
.sw-cta a:hover{transform:translateY(-2px)}
.sw-n{position:absolute;right:clamp(16px,4vw,56px);top:clamp(16px,4vh,40px);width:min(360px,calc(100% - 32px));display:grid;grid-template-columns:38px 1fr;gap:4px 12px;padding:14px 16px;border-radius:20px;background:#f5f5f4f0;color:#18181b;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 20px 50px -20px #0008;opacity:0;transform:translateY(-16px) scale(.97);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.25,1.2)}
.sw-n.on{opacity:1;transform:none}
.sw-n.ping{animation:sw-ping .45s cubic-bezier(.2,.9,.25,1.2)}
@keyframes sw-ping{40%{transform:scale(1.03)}}
.sw-n i{grid-row:span 3;width:38px;height:38px;border-radius:10px;background:#18181b;display:grid;place-items:center}
.sw-n i svg{width:20px;height:20px;fill:#facc15}
.sw-n header{display:flex;justify-content:space-between;font-size:12px;color:#71717a;letter-spacing:.02em}
.sw-n b{font-size:15px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sw-n p{margin:0;font-size:13.5px;line-height:1.45;color:#3f3f46}
.sw .bt{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.sw .bt.on{opacity:1;transform:none;pointer-events:auto}
.sw-after{height:40vh;display:grid;place-items:center;background:#0e1013;color:#6b7280;font-size:15px}
@media (prefers-reduced-motion:reduce){.sw .bt,.sw-n{transform:none!important;transition:opacity .3s}.sw-n.ping{animation:none}}
</style>
<section class="sw" aria-label="Stillroom storm alerts">
  <div class="sw-pin">
    <canvas role="img" aria-label="Camera moves from a quiet concrete room through an open window toward a supercell over wheat fields"></canvas>
    <div class="sw-a bt on"><small>STILLROOM</small><h2>It's quiet<br><em>in here.</em></h2><p>For now.</p></div>
    <div class="sw-b bt"><h2>Know before it <em>reaches the window.</em></h2>
      <div class="sw-cta"><a href="#">Get Stillroom, free</a></div></div>
    <div class="sw-n" role="status" aria-live="polite"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></i>
      <header><span>STILLROOM</span><span>now</span></header><b>Lightning 6.1 km north-west</b><p>Moving toward you at 28 km/h. Close windows in the next 12 min.</p></div>
  </div>
</section>
<div class="sw-after">The page continues.</div>
<script>
(()=>{
// 120 frames scrubbed by scroll. STRIKES are the frames where lightning flashes in the footage (found from per-frame sky brightness); each one updates the alert.
const N=120,DIR="media/storm/",STRIKES=[75,81,112],ALERTS=[["6.1 km north-west",12],["4.3 km north-west",9],["2.8 km west",6]];
const root=document.querySelector(".sw"),c=root.querySelector("canvas"),x=c.getContext("2d"),$=s=>root.querySelector(s);
const a=$(".sw-a"),b=$(".sw-b"),n=$(".sw-n"),nb=n.querySelector("b"),np=n.querySelector("p");
const imgs=[],load=i=>{if(imgs[i])return;const im=imgs[i]=new Image();im.onload=()=>{if(Math.abs(i-cur)<9)draw(true)};im.src=DIR+String(i+1).padStart(3,"0")+".jpg"};
load(0);new IntersectionObserver((e,o)=>{if(e[0].isIntersecting){o.disconnect();[8,4,2,1].forEach(s=>{for(let i=0;i<N;i+=s)load(i)})}},{rootMargin:"100%"}).observe(root);
let cur=0,tgt=0,shown=-1,raf=0,hits=0;
const pick=f=>{for(let d=0;d<N;d++)for(const j of[f-d,f+d]){const im=imgs[j];if(im&&im.complete&&im.naturalWidth)return im}};
function draw(force){const f=Math.round(cur);if(f===shown&&!force)return;const im=pick(f);if(!im)return;shown=f;
  const s=Math.max(c.width/im.naturalWidth,c.height/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h)}
new ResizeObserver(()=>{const d=Math.min(devicePixelRatio,2);c.width=c.clientWidth*d;c.height=c.clientHeight*d;draw(true)}).observe(c);
function update(){draw();const f=Math.round(cur),p=cur/(N-1),k=STRIKES.filter(s=>f>=s).length;
  a.classList.toggle("on",p<.28);b.classList.toggle("on",p>.5);n.classList.toggle("on",k>0);
  if(k&&k!==hits){const[d,m]=ALERTS[k-1];nb.textContent="Lightning "+d;np.textContent=`Moving toward you at 28 km/h. Close windows in the next ${m} min.`;
    n.classList.remove("ping");void n.offsetWidth;n.classList.add("ping")}hits=k}
const tick=()=>{cur+=(tgt-cur)*.2;if(Math.abs(tgt-cur)<.05)cur=tgt;update();raf=cur===tgt?0:requestAnimationFrame(tick)};
const onScroll=()=>{const r=root.getBoundingClientRect();tgt=Math.max(0,Math.min(1,-r.top/(root.offsetHeight-innerHeight)))*(N-1);if(!raf)raf=requestAnimationFrame(tick)};
addEventListener("scroll",onScroll,{passive:true});onScroll();
})();
</script>

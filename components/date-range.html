<style>
.dr-stage{min-height:100vh;display:grid;place-items:start center;padding:12vh 16px 40px;background:#0a0a0b;color:#e4e4e7}
.dr{position:relative}
.dr-trig{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:12px;border:1px solid #ffffff17;background:#111113;color:#fafafa;font:500 14.5px Geist,sans-serif;cursor:pointer;transition:border-color .2s}
.dr-trig:hover{border-color:#ffffff30}.dr-trig svg{width:17px;height:17px;fill:none;stroke:#a1a1aa;stroke-width:1.8;stroke-linecap:round}
.dr-trig small{font:12px "Geist Mono",monospace;color:#71717a;margin-left:6px}
.dr-pop{position:absolute;top:56px;left:50%;z-index:5;display:flex;border-radius:20px;background:#121214;border:1px solid #ffffff14;box-shadow:0 30px 70px -20px #000;transform:translate(-50%,-8px) scale(.98);transform-origin:top center;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.2,1,.3,1)}
.dr-pop.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.dr-pre{width:150px;padding:12px 8px;border-right:1px solid #ffffff0d;display:flex;flex-direction:column;gap:2px}
.dr-pre button{height:34px;padding:0 10px;border-radius:8px;border:0;background:none;color:#a1a1aa;font:500 13px Geist,sans-serif;text-align:left;cursor:pointer}
.dr-pre button:hover{background:#ffffff08;color:#fff}.dr-pre button.on{background:#ffffff0f;color:#fff}
.dr-main{padding:16px 18px 0}
.dr-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dr-nav button{width:32px;height:32px;border-radius:9px;border:1px solid #ffffff14;background:none;color:#e4e4e7;cursor:pointer;font-size:15px}.dr-nav button:hover{background:#ffffff0a}
.dr-months{display:flex;gap:28px;overflow:hidden}
.dr-m{width:252px;flex:none}
.dr-m h4{margin:0 0 10px;text-align:center;font-size:14px;font-weight:600}
.dr-g{display:grid;grid-template-columns:repeat(7,36px);row-gap:2px}
.dr-g span{height:28px;display:grid;place-items:center;font:500 11px "Geist Mono",monospace;color:#52525b}
.dr-d{position:relative;height:36px;border:0;background:none;color:#e4e4e7;font:500 13.5px Geist,sans-serif;cursor:pointer;z-index:0}
.dr-d::before{content:"";position:absolute;inset:3px;border-radius:10px;z-index:-1;transition:background .12s}
.dr-d:hover::before{background:#ffffff12}
.dr-d.out{visibility:hidden}.dr-d.past{color:#3f3f46;cursor:not-allowed}.dr-d.past:hover::before{background:none}
.dr-d.today::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#ff7a3d}
.dr-d.in{background:#ff5a1f1f;color:#fff}.dr-d.in::before{background:none}
.dr-d.prev{background:#ffffff0a}
.dr-d.s,.dr-d.e{color:#160a04;font-weight:600}.dr-d.s::before,.dr-d.e::before{background:#ff7a3d!important;inset:2px}
.dr-d.s{background:linear-gradient(90deg,transparent 50%,#ff5a1f1f 50%)}.dr-d.e{background:linear-gradient(90deg,#ff5a1f1f 50%,transparent 50%)}.dr-d.s.e{background:none}
.dr-d.s.today::after,.dr-d.e.today::after{background:#160a04}
.dr-slide{display:flex;gap:28px;transition:transform .35s cubic-bezier(.3,1,.3,1)}
.dr-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:14px -18px 0;padding:12px 18px;border-top:1px solid #ffffff0d}
.dr-foot span{font-size:13px;color:#a1a1aa}.dr-foot span b{color:#fafafa;font-weight:550}
.dr-foot div{display:flex;gap:8px}.dr-foot button{height:34px;padding:0 14px;border-radius:9px;border:1px solid #ffffff17;background:none;color:#e4e4e7;font:550 13px Geist,sans-serif;cursor:pointer}
.dr-foot button.pri{background:#fafafa;color:#0a0a0b;border-color:#fafafa}.dr-foot button:disabled{opacity:.35;cursor:default}
@media (max-width:760px){.dr-pre{display:none}.dr-m+.dr-m{display:none}}
</style>
<div class="dr-stage"><div class="dr">
  <button class="dr-trig"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><b>Select dates</b><small></small></button>
  <div class="dr-pop" role="dialog" aria-label="Choose a date range">
    <div class="dr-pre"><button data-p="7">Next 7 days</button><button data-p="14">Next 2 weeks</button><button data-p="w">This weekend</button><button data-p="m">Rest of month</button><button data-p="30">Next 30 days</button></div>
    <div class="dr-main"><div class="dr-nav"><button data-n="-1" aria-label="Previous month">‹</button><button data-n="1" aria-label="Next month">›</button></div>
      <div class="dr-months"><div class="dr-slide"></div></div>
      <div class="dr-foot"><span>Pick a check-in date</span><div><button class="cl">Clear</button><button class="pri" disabled>Apply</button></div></div></div>
  </div>
</div></div>
<script>
(()=>{
const TODAY=new Date(2026,9,30),pop=document.querySelector(".dr-pop"),trig=document.querySelector(".dr-trig"),slide=pop.querySelector(".dr-slide"),foot=pop.querySelector(".dr-foot span"),apply=pop.querySelector(".pri");
let view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),s=null,e=null,hov=null,applied=null;
const key=d=>d.getFullYear()*10000+d.getMonth()*100+d.getDate(),same=(a,b)=>a&&b&&key(a)===key(b),day=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const fmt=d=>d.toLocaleDateString("en",{month:"short",day:"numeric"});
function month(base){const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let h=`<div class="dr-m"><h4>${base.toLocaleDateString("en",{month:"long",year:"numeric"})}</h4><div class="dr-g">${["S","M","T","W","T","F","S"].map(x=>`<span>${x}</span>`).join("")}`;
  for(let i=0;i<first;i++)h+=`<button class="dr-d out" tabindex="-1"></button>`;
  for(let d=1;d<=n;d++){const dt=new Date(y,m,d),past=dt<TODAY,end=e||(s&&hov&&hov>s?hov:null);
    const c=["dr-d",past&&"past",same(dt,TODAY)&&"today",same(dt,s)&&"s",same(dt,end)&&"e",s&&end&&dt>s&&dt<end&&"in",!e&&hov&&s&&dt>s&&dt<hov&&"prev"].filter(Boolean).join(" ");
    h+=`<button class="${c}" data-k="${y}-${m}-${d}" ${past?"disabled":""} aria-label="${dt.toDateString()}">${d}</button>`}
  return h+"</div></div>"}
function render(){slide.innerHTML=month(view)+month(new Date(view.getFullYear(),view.getMonth()+1,1));
  const n=s&&e?Math.round((e-s)/864e5):0;foot.innerHTML=!s?"Pick a check-in date":!e?`<b>${fmt(s)}</b> → pick check-out`:`<b>${fmt(s)} – ${fmt(e)}</b> · ${n} night${n>1?"s":""}`;apply.disabled=!(s&&e)}
const go=dir=>{view=new Date(view.getFullYear(),view.getMonth()+dir,1);slide.style.transition="none";slide.style.transform=`translateX(${dir*40}px)`;slide.style.opacity=0;render();
  requestAnimationFrame(()=>{slide.style.transition="";slide.style.transform="none";slide.style.opacity=1})};
pop.querySelectorAll(".dr-nav button").forEach(b=>b.onclick=()=>go(+b.dataset.n));
slide.addEventListener("click",ev=>{const b=ev.target.closest(".dr-d[data-k]");if(!b||b.disabled)return;const[y,m,d]=b.dataset.k.split("-").map(Number),dt=new Date(y,m,d);
  pop.querySelectorAll(".dr-pre button").forEach(x=>x.classList.remove("on"));
  if(!s||e||dt<=s){s=dt;e=null}else e=dt;render()});
slide.addEventListener("mouseover",ev=>{const b=ev.target.closest(".dr-d[data-k]");if(!b||!s||e)return;const[y,m,d]=b.dataset.k.split("-").map(Number),dt=new Date(y,m,d);if(!same(dt,hov)){hov=dt;render()}});
pop.querySelectorAll(".dr-pre button").forEach(b=>b.onclick=()=>{pop.querySelectorAll(".dr-pre button").forEach(x=>x.classList.toggle("on",x===b));const p=b.dataset.p,t=day(TODAY);
  if(p==="w"){s=new Date(t);s.setDate(t.getDate()+((6-t.getDay()+7)%7||7)-1);e=new Date(s);e.setDate(s.getDate()+2)}
  else if(p==="m"){s=t;e=new Date(t.getFullYear(),t.getMonth()+1,0);if(same(s,e))e=new Date(t.getFullYear(),t.getMonth()+1,7)}
  else{s=t;e=new Date(t);e.setDate(t.getDate()+ +p)}view=new Date(s.getFullYear(),s.getMonth(),1);render()});
pop.querySelector(".cl").onclick=()=>{s=e=hov=null;pop.querySelectorAll(".dr-pre button").forEach(x=>x.classList.remove("on"));render()};
apply.onclick=()=>{applied=[s,e];trig.querySelector("b").textContent=`${fmt(s)} – ${fmt(e)}`;trig.querySelector("small").textContent=Math.round((e-s)/864e5)+" nights";pop.classList.remove("open")};
trig.onclick=ev=>{ev.stopPropagation();pop.classList.toggle("open");render()};
pop.onclick=ev=>ev.stopPropagation();document.addEventListener("click",()=>pop.classList.remove("open"));
addEventListener("keydown",ev=>{if(ev.key==="Escape")pop.classList.remove("open")});
render();
})();
</script>

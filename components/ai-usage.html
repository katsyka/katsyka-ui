<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.us{width:min(520px,100%);padding:20px;display:grid;gap:12px}.us-h{display:flex;justify-content:space-between;align-items:end}.us-h div{display:grid}.us-h span.mu{font-size:12px}.us-n{font-size:22px;font-weight:650;letter-spacing:-.02em}.us-n small{font-size:14px;color:var(--mu);font-weight:500}
.us-bar{display:flex;height:12px;border-radius:6px;background:var(--sf2);overflow:hidden;gap:2px}.us-bar i{width:var(--w);background:var(--c)}.us-lg{list-style:none;padding:0;margin:0;display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.us-lg li{display:flex;gap:6px;align-items:center}.us-lg i{width:8px;height:8px;border-radius:2px;background:var(--c)}.us-lg b{font-variant-numeric:tabular-nums}
.us-sp{width:100%;height:60px}.us-sp .a{fill:none;stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke}.us-sp .p{fill:none;stroke:var(--fg);stroke-dasharray:3 3;stroke-opacity:.45;vector-effect:non-scaling-stroke}.us-sp .cap{stroke:var(--err);stroke-opacity:.5;vector-effect:non-scaling-stroke}
.us-w{margin:0;font-size:13px;padding:10px 12px;border-radius:10px}.us-w.warn{background:var(--warn-sf)}.us-w.ok{background:var(--sf)}.us-lim{display:flex;gap:8px;align-items:center;font-size:14px}.us-lim input{width:18px;height:18px;accent-color:var(--fg)}
.us-m summary{cursor:pointer;font-size:14px;font-weight:550;min-height:28px}.us-m ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}.us-m li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:13px}.us-m .av{width:28px;height:28px;font-size:10px}
</style>
<div class="k"><div class="us card"><div class="us-h"><div><b>AI credits</b><span class="mu tn" id="per"></span></div><span class="tn us-n" id="n"></span></div><div class="us-bar" id="bar" role="img"></div><ul class="us-lg" id="lg"></ul><svg class="us-sp" id="sp" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true"></svg><p class="us-w" id="w"></p><label class="us-lim"><input type="checkbox" id="lim" checked> Stop AI features at the monthly limit</label><details class="us-m"><summary>By member</summary><ul id="mb"></ul></details></div></div>
<script>
const CAP=20000,F=[["Chat",8200,"var(--fg)"],["Summaries",3900,"#0ea5e9"],["Images",2600,"#d97706"]],d=new Date(),day=d.getDate(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),used=F.reduce((a,f)=>a+f[1],0),proj=Math.round(used/day*dim);
document.getElementById('per').textContent=`${d.toLocaleDateString('en-GB',{month:'long'})} · day ${day} of ${dim}`;document.getElementById('n').innerHTML=`${used.toLocaleString('en')} <small>/ ${CAP.toLocaleString('en')}</small>`;
document.getElementById('bar').innerHTML=F.map(([,v,c])=>`<i style="--w:${v/CAP*100}%;--c:${c}"></i>`).join('');document.getElementById('bar').setAttribute('aria-label',`${used} of ${CAP} credits used`);document.getElementById('lg').innerHTML=F.map(([n,v,c])=>`<li><i style="--c:${c}"></i>${n} <b>${v.toLocaleString('en')}</b></li>`).join('');
let acc=0;const D=Array.from({length:day},(_,i)=>acc+=used/day*(.7+((i*37)%10)/16)),X=i=>i/(dim-1)*300,Y=v=>58-v/(CAP*1.1)*56;
document.getElementById('sp').innerHTML=`<line class="cap" x1="0" x2="300" y1="${Y(CAP)}" y2="${Y(CAP)}"/><path class="a" d="M${D.map((v,i)=>`${X(i)},${Y(v*used/acc)}`).join('L')}"/><path class="p" d="M${X(day-1)},${Y(used)}L300,${Y(proj)}"/>`;
const w=document.getElementById('w'),lim=document.getElementById('lim');function warn(){const over=proj>CAP;w.className='us-w '+(over?'warn':'ok');w.textContent=over?`At this pace you'll use about ${proj.toLocaleString('en')} credits, over the limit around the ${Math.ceil(CAP/(used/day))}th. ${lim.checked?'AI features will pause then.':'Extra usage is billed at €2 per 1,000 credits.'}`:`On pace for about ${proj.toLocaleString('en')} credits. You're within your limit.`}lim.onchange=warn;warn();
document.getElementById('mb').innerHTML=[["Lena K.",6100,'#0f766e'],["Jonas L.",4300,'#7c3aed'],["Sam R.",2800,'#b45309'],["Others",1500,'#64748b']].map(([n,v,c])=>`<li><span class="av" style="--c:${c}">${n[0]}</span><span>${n}</span><b class="tn">${v.toLocaleString('en')}</b></li>`).join('');
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}

.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}

.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.tm2{width:min(780px,100%);padding:20px;margin:0}.tm2 figcaption{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}.tm2-bc{display:flex;gap:4px;align-items:center;font-size:14px;flex-wrap:wrap}.tm2-bc button{font-weight:600;color:var(--ac);min-height:28px}.tm2-bc span{color:var(--mu)}
.tm2-c{position:relative;height:340px;border-radius:10px;overflow:hidden}.tm2-c button{position:absolute;border:1.5px solid var(--bg);border-radius:6px;padding:8px;text-align:left;color:#fff;display:grid;align-content:start;gap:2px;font-size:12px;overflow:hidden;transition:filter .15s;animation:tmf .3s cubic-bezier(.23,1,.32,1) both}.tm2-c button:hover,.tm2-c button:focus-visible{filter:brightness(1.12)}.tm2-c b{font-size:13px}.tm2-c button.sm b,.tm2-c button.sm span{display:none}.tm2-c button[disabled]{cursor:default}@keyframes tmf{from{opacity:0;transform:scale(.97)}}
</style>
<div class="k"><figure class="tm2 card"><figcaption><nav class="tm2-bc" id="bc" aria-label="Path"></nav><span class="mu tn" id="sz"></span></figcaption><div class="tm2-c" id="c"></div></figure></div>
<script>
const T={n:'~',c:[{n:'Photos',c:[{n:'2024',s:38e9},{n:'2025',s:51e9},{n:'2026',s:27e9},{n:'Edits',s:9e9}]},{n:'Projects',c:[{n:'kestrel-app',s:12e9},{n:'website',s:3.1e9},{n:'archive',s:22e9},{n:'scratch',s:1.4e9}]},{n:'Music',s:31e9},{n:'Downloads',c:[{n:'installers',s:8e9},{n:'pdfs',s:2e9},{n:'videos',s:14e9}]},{n:'Library',s:19e9},{n:'Documents',s:6e9}]};
const sz=n=>n.s??n.c.reduce((a,x)=>a+sz(x),0),fmt=b=>b>=1e9?(b/1e9).toFixed(1)+' GB':(b/1e6).toFixed(0)+' MB',H=['#0f766e','#1d4ed8','#7c3aed','#b45309','#be123c','#15803d','#0369a1'];let path=[T];
function squarify(items,x,y,w,h,out){if(!items.length)return;const tot=items.reduce((a,i)=>a+i.v,0);if(items.length===1){out.push({...items[0],x,y,w,h});return}const horiz=w>=h,side=horiz?h:w;let row=[],best=Infinity,i=0;const worst=r=>{const s=r.reduce((a,x)=>a+x.v,0)/tot*w*h,len=s/side;return Math.max(...r.map(x=>{const a=x.v/tot*w*h,l2=a/len;return Math.max(len/l2,l2/len)}))};
for(;i<items.length;i++){const nr=[...row,items[i]],wv=worst(nr);if(wv>best)break;row=nr;best=wv}const rs=row.reduce((a,x)=>a+x.v,0),len=rs/tot*(horiz?w:h);let o=0;row.forEach(r=>{const l=r.v/rs*side;horiz?out.push({...r,x,y:y+o,w:len,h:l}):out.push({...r,x:x+o,y,w:l,h:len});o+=l});horiz?squarify(items.slice(i),x+len,y,w-len,h,out):squarify(items.slice(i),x,y+len,w,h-len,out)}
function draw(){const node=path[path.length-1],c=document.getElementById('c'),W=c.clientWidth,Hh=340,it=node.c.map((n,k)=>({n,v:sz(n),k})).sort((a,b)=>b.v-a.v),out=[];squarify(it,0,0,W,Hh,out);
c.innerHTML=out.map(r=>`<button style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${H[(r.k+path.length)%H.length]};animation-delay:${r.k*30}ms" class="${r.w<70||r.h<40?'sm':''}" ${r.n.c?'':'disabled'} data-k="${r.k}" aria-label="${r.n.n}, ${fmt(r.v)}${r.n.c?', open':''}"><b>${r.n.n}</b><span>${fmt(r.v)}</span></button>`).join('');
document.getElementById('bc').innerHTML=path.map((p,i)=>i<path.length-1?`<button data-p="${i}">${p.n}</button><span>/</span>`:`<b>${p.n}</b>`).join('');document.getElementById('sz').textContent=fmt(sz(node))}
document.getElementById('c').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const n=path[path.length-1].c[+b.dataset.k];if(n.c){path.push(n);draw()}};document.getElementById('bc').onclick=e=>{const b=e.target.closest('[data-p]');if(b){path=path.slice(0,+b.dataset.p+1);draw()}};draw();addEventListener('resize',draw);
</script>

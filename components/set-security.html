<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.ss{align-items:start}.ss-w{width:min(680px,100%);display:grid;gap:0}.ss-w h1{margin:0 0 16px;font-size:24px;letter-spacing:-.02em}.ss-w h2{font-size:15px;margin:32px 0 10px}
.ss-r{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}.ss-r div{display:grid}.ss-r span.mu{font-size:13px}
.ss-l{list-style:none;padding:0;margin:0 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.ss-l li{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);transition:opacity .25s}.ss-l li:first-child{border:0}.ss-l .ic{width:40px;height:40px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;color:var(--mu)}.ss-l div{display:grid}.ss-l small{color:var(--mu);font-size:13px}.ss-l .cur{color:var(--ok);font-weight:600;font-size:12px}.ss-l .out{opacity:.45}
.ss-w>.b{justify-self:start}.ss-m{font-size:14px;margin:10px 0 0;display:flex;gap:10px;align-items:center}.ss-m:empty{display:none}.ss-m button{text-decoration:underline;font-weight:600;min-height:32px}
</style>
<div class="k ss"><div class="ss-w"><h1>Security</h1>
<section class="ss-r"><div><b>Password</b><span class="mu">Last changed 4 months ago</span></div><button class="b sec sm">Change password</button></section>
<section class="ss-r"><div><b>Two-factor authentication</b><span class="mu">Authenticator app and 2 security keys</span></div><span class="pill ok"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:12px;height:12px"><path d="M20 6 9 17l-5-5"/></svg>On</span></section>
<section class="ss-r"><div><b>Passkeys</b><span class="mu">Sign in with Face ID or Touch ID on this device</span></div><button class="b sec sm" id="pk">Add passkey</button></section>
<h2>Where you're signed in</h2><ul class="ss-l" id="l"></ul><button class="b sec" id="all"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M2 2l20 20M8.5 16a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 4.2-2.6M14.8 9.9A10 10 0 0 1 19 12.5M2 9a15 15 0 0 1 4.5-2.9M10.7 5.1A15 15 0 0 1 22 9M12 20h.01"/></svg>Sign out of all other sessions</button><p class="ss-m" id="m" role="status"></p></div></div>
<script>
let S=[["phone","iPhone 16 · Safari","Hamburg, Germany","Active now",1],["file","MacBook Pro · Chrome 131","Hamburg, Germany","2 hours ago"],["grid","Windows · Edge","Vienna, Austria","3 days ago"],["phone","Pixel 8 · Quill app","Lisbon, Portugal","12 days ago"]].map((s,i)=>({i,ic:s[0],d:s[1],l:s[2],t:s[3],cur:!!s[4],out:false}));
const l=document.getElementById('l'),m=document.getElementById('m'),IC={phone:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',file:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',grid:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'};
function draw(){l.innerHTML=S.map(s=>`<li class="${s.out?'out':''}"><span class="ic">${IC[s.ic]}</span><div><b>${s.d}</b><small>${s.l} · ${s.out?'Signed out':s.t}</small></div>${s.cur?'<span class="cur">This device</span>':s.out?'':`<button class="b gh sm" data-i="${s.i}">Sign out</button>`}</li>`).join('')}
function undoable(ids,msg){ids.forEach(i=>S[i].out=true);draw();m.innerHTML=`${msg} <button id="u">Undo</button>`;document.getElementById('u').onclick=()=>{ids.forEach(i=>S[i].out=false);draw();m.textContent='Restored.'}}
l.onclick=e=>{const b=e.target.closest('[data-i]');if(b)undoable([+b.dataset.i],`Signed out ${S[b.dataset.i].d.split(' ·')[0]}.`)};
document.getElementById('all').onclick=()=>{const ids=S.filter(s=>!s.cur&&!s.out).map(s=>s.i);if(!ids.length){m.textContent='No other sessions.';return}undoable(ids,`Signed out of ${ids.length} other session${ids.length>1?'s':''}.`)};
document.getElementById('pk').onclick=e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Waiting for device…';setTimeout(()=>{b.textContent='Passkey added';},1200)};draw();
</script>

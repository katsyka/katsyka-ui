<style>
.elv{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:#e7e4de;font-family:Geist,system-ui,sans-serif;color:#1d1c1a}
.elv-in{display:grid;grid-template-columns:150px 1fr;gap:18px;width:min(820px,100%);height:min(560px,86vh)}
.elv-panel{border-radius:14px;padding:16px 14px;background:linear-gradient(90deg,#b9bcc1,#e4e6e9 30%,#c6c9ce 60%,#dfe1e4);box-shadow:inset 0 0 0 1px #0000001f,0 20px 40px -24px #0007;display:flex;flex-direction:column;align-items:center;gap:12px}
.elv-disp{width:100%;height:58px;border-radius:8px;background:#0d0d0c;display:flex;align-items:center;justify-content:center;gap:10px;font:500 32px/1 "Geist Mono",monospace;color:#ff9a3c;box-shadow:inset 0 2px 6px #000}
.elv-arr{font-size:16px;opacity:0}.elv.up .elv-arr.u,.elv.dn .elv-arr.d{opacity:1}
.elv-btns{display:flex;flex-direction:column-reverse;gap:10px;margin-top:6px}
.elv-btns button{display:flex;align-items:center;gap:10px;padding:0;border:0;background:none;cursor:pointer;font:500 12px Geist,system-ui,sans-serif;color:#3b3a37;text-align:left}
.elv-btns b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 15px "Geist Mono",monospace;color:#3b3a37;background:radial-gradient(circle at 40% 35%,#f4f5f6,#b5b8bd);box-shadow:inset 0 -2px 3px #0003,0 2px 3px #0003,0 0 0 3px #a3a6ab;transition:box-shadow .2s,color .2s}
.elv-btns button.q b{color:#ff8a24;box-shadow:inset 0 -2px 3px #0003,0 2px 3px #0003,0 0 0 3px #ff8a24}
.elv-btns button:active b{transform:translateY(1px)}
.elv-btns button:focus-visible{outline:2px solid #1d4ed8;outline-offset:4px;border-radius:24px}
.elv-car{position:relative;border-radius:14px;overflow:hidden;background:#f7f5f1;box-shadow:inset 0 0 0 1px #0000001a}
.elv-room{position:absolute;inset:0;padding:clamp(20px,5vw,48px);display:flex;flex-direction:column;justify-content:flex-end}
.elv-room small{font:12px/1 "Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8a857c}
.elv-room h2{margin:10px 0 8px;font:400 clamp(40px,6vw,72px)/.95 "Instrument Serif",serif}
.elv-room p{margin:0;max-width:420px;color:#5d5951;line-height:1.55;font-size:15px}
.elv-door{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(90deg,#a9adb3,#d9dbde 40%,#b3b7bc);transition:transform .7s cubic-bezier(.6,0,.3,1);z-index:2}
.elv-door.l{left:0;transform:translateX(-100%)}.elv-door.r{right:0;transform:translateX(100%)}
.elv.shut .elv-door{transform:none}
.elv-door.l{box-shadow:inset -1px 0 0 #0004}.elv-door.r{box-shadow:inset 1px 0 0 #fff8}
@media (max-width:600px){.elv-in{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto}.elv-car{min-height:340px}.elv-btns{flex-direction:row;flex-wrap:wrap;justify-content:center}.elv-btns button span{display:none}}
@media (prefers-reduced-motion:reduce){.elv-door{transition:none}}
</style>
<section class="elv">
  <div class="elv-in">
    <nav class="elv-panel" aria-label="Floors">
      <div class="elv-disp" aria-hidden="true"><span class="elv-arr u">▲</span><span class="elv-n">G</span><span class="elv-arr d">▼</span></div>
      <div class="elv-btns"></div>
    </nav>
    <div class="elv-car"><div class="elv-room" aria-live="polite"></div><div class="elv-door l"></div><div class="elv-door r"></div></div>
  </div>
</section>
<script>
(()=>{
// Floors are sections. Presses queue up and are served in travel direction, like a real car.
const F=[["G","Lobby","Welcome in.","A small studio making tools for people who work with their hands. Press a floor."],
  ["1","Work","Selected work.","Twelve years of identity, type and product design for slow companies."],
  ["2","Studio","Four people, one bench.","We share a workshop with a bookbinder and a very old espresso machine."],
  ["3","Journal","Notes from the bench.","Essays on craft, tools and the quiet economics of doing things properly."],
  ["4","Contact","Come up for tea.","hello@benchstudio.co · Thursdays are open-door from 3 pm."]];
const R=document.querySelector(".elv"),btnW=R.querySelector(".elv-btns"),num=R.querySelector(".elv-n"),room=R.querySelector(".elv-room");
const red=matchMedia("(prefers-reduced-motion:reduce)").matches;
btnW.innerHTML=F.map((f,i)=>`<button data-f="${i}" aria-label="Floor ${f[0]}, ${f[1]}"><b>${f[0]}</b><span>${f[1]}</span></button>`).join("");
const B=[...btnW.children],queue=new Set();let at=0,dir=0,busy=false;
const show=i=>{const f=F[i];room.innerHTML=`<small>Floor ${f[0]} · ${f[1]}</small><h2>${f[2]}</h2><p>${f[3]}</p>`};show(0);
const wait=ms=>new Promise(r=>setTimeout(r,red?0:ms));
const next=()=>{if(!queue.size)return null;const q=[...queue];const ahead=q.filter(f=>dir>=0?f>at:f<at);
  if(ahead.length)return dir>=0?Math.min(...ahead):Math.max(...ahead);const other=q.filter(f=>f!==at);return other.length?(dir>=0?Math.max(...other):Math.min(...other)):null};
const run=async()=>{if(busy)return;busy=true;
  while(queue.size){const to=next();if(to===null){queue.clear();break}
    R.classList.add("shut");await wait(750);dir=Math.sign(to-at);R.classList.toggle("up",dir>0);R.classList.toggle("dn",dir<0);
    while(at!==to){await wait(650);at+=dir;num.textContent=F[at][0];if(queue.has(at)&&at!==to)break} // stop on the way if someone pressed it
    queue.delete(at);B[at].classList.remove("q");show(at);await wait(250);R.classList.remove("shut","up","dn");await wait(900)}
  dir=0;busy=false};
B.forEach((b,i)=>b.onclick=()=>{if(i===at&&!busy)return;queue.add(i);b.classList.add("q");run()});
})();
</script>

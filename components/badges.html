<style>
.bd{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.bd :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bd ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.bd *,.bd *::before,.bd *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.bd{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.bd-pn{width:min(640px,100%);background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.bd-row{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center;padding:20px 24px;border-top:1px solid var(--line)}
.bd-row:first-child{border-top:0}
.bd-lb{font:500 11px/1.3 "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.bd-set{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.b{--c:var(--mu);display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font:550 12px/1 Geist,system-ui,sans-serif;white-space:nowrap}
.b.sf{background:color-mix(in oklab,var(--c) 13%,var(--bg));color:color-mix(in oklab,var(--c) 80%,var(--fg))}
.b.so{background:var(--c);color:var(--bg)}
.b.ol{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 45%,transparent);color:color-mix(in oklab,var(--c) 80%,var(--fg))}
.b.rd{border-radius:99px}
.b.lg{height:26px;padding:0 10px;font-size:13px}
.b .d{width:6px;height:6px;border-radius:50%;background:var(--c)}
.b svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.b button{display:grid;place-items:center;width:16px;height:16px;margin-right:-4px;border:0;border-radius:4px;background:none;color:inherit;cursor:pointer;opacity:.7}
.b button:hover{opacity:1;background:color-mix(in oklab,var(--c) 18%,transparent)}
.b button svg{width:10px;height:10px}
.c-n{--c:var(--mu)}.c-b{--c:var(--info)}.c-g{--c:var(--ok)}.c-y{--c:var(--warn)}.c-r{--c:var(--err)}.c-a{--c:var(--ac)}.c-v{--c:light-dark(#6d28d9,#c4b5fd)}
.b.mono{font-family:"Geist Mono",monospace;font-weight:500;letter-spacing:-.01em}
.bd-ib{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);color:var(--fg)}
.bd-ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd-ib .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:light-dark(#fff,#2a0606);font:650 11px/18px Geist,system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.bd-ib .dt{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--bg)}
.bd-gr{display:inline-flex;height:22px;border-radius:6px;overflow:hidden;font:500 12px/22px "Geist Mono",monospace}
.bd-gr span:first-child{padding:0 7px;background:light-dark(#3f3f46,#3f3f46);color:#fafafa}
.bd-gr span:last-child{padding:0 7px;color:#fff}
@media (max-width:560px){.bd-row{grid-template-columns:1fr;gap:10px}}
</style>
<div class="bd">
  <div class="bd-pn">
    <div class="bd-row"><div class="bd-lb">Soft</div><div class="bd-set"><span class="b sf c-n">Draft</span><span class="b sf c-b">In review</span><span class="b sf c-g">Published</span><span class="b sf c-y">Scheduled</span><span class="b sf c-r">Rejected</span><span class="b sf c-v">Beta</span><span class="b sf c-a">New</span></div></div>
    <div class="bd-row"><div class="bd-lb">Solid · outline</div><div class="bd-set"><span class="b so c-n">Default</span><span class="b so c-a">Pro</span><span class="b so c-g">Live</span><span class="b ol c-n">v2.4.0</span><span class="b ol c-b rd">Docs</span><span class="b ol c-r rd">Breaking</span></div></div>
    <div class="bd-row"><div class="bd-lb">Dot · icon</div><div class="bd-set"><span class="b sf c-g rd"><span class="d"></span>Online</span><span class="b sf c-y rd"><span class="d"></span>Degraded</span><span class="b sf c-r rd"><span class="d"></span>Offline</span><span class="b sf c-g"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Verified</span><span class="b sf c-a"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>Fast</span><span class="b sf c-n mono">+12.4%</span></div></div>
    <div class="bd-row"><div class="bd-lb">Removable</div><div class="bd-set" id="bdRm"><span class="b sf c-n lg">Design<button aria-label="Remove Design"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span><span class="b sf c-b lg">Frontend<button aria-label="Remove Frontend"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span><span class="b sf c-v lg">Research<button aria-label="Remove Research"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span><span class="b sf c-g lg">Remote<button aria-label="Remove Remote"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span></div></div>
    <div class="bd-row"><div class="bd-lb">Counters</div><div class="bd-set" style="gap:18px">
      <span class="bd-ib" role="img" aria-label="Notifications, 3 unread"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="n">3</span></span>
      <span class="bd-ib" role="img" aria-label="Inbox, 128 unread"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg><span class="n">99+</span></span>
      <span class="bd-ib" role="img" aria-label="Messages, new"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="dt"></span></span>
      <span class="bd-gr"><span>build</span><span style="background:#16a34a">passing</span></span><span class="bd-gr"><span>coverage</span><span style="background:#ca8a04">78%</span></span><span class="bd-gr"><span>license</span><span style="background:#2563eb">MIT</span></span>
    </div></div>
  </div>
</div>
<script>
document.querySelectorAll("#bdRm button").forEach(b=>b.addEventListener("click",()=>{const n=b.parentElement.nextElementSibling?.querySelector("button")||b.parentElement.previousElementSibling?.querySelector("button");b.parentElement.remove();n&&n.focus()}));
</script>

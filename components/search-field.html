<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}

.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}

.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k{place-items:start center;padding-top:96px}
.sf{position:relative;width:min(480px,100%)}
.sf-f{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:12px;border:1px solid var(--ctl);background:var(--bg);color:var(--mu);transition:border-color .15s,box-shadow .15s}
.sf-f:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.sf-f input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;color:var(--fg)}.sf-f input::placeholder{color:var(--mu)}
.sf-f kbd{font:500 12px Geist;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--mu)}
.sf-sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ac);animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
.sf-l{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto;animation:dd .15s var(--ease);transform-origin:top}
@keyframes dd{from{opacity:0;transform:translateY(-4px)}}
.sf-g{padding:8px 10px 4px;font-size:12px;font-weight:600;color:var(--mu)}
.sf-o{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}.sf-o .i{color:var(--mu);width:16px;height:16px}
.sf-o small{margin-left:auto;color:var(--mu);font-size:12px}.sf-o b{font-weight:650}
.sf-o[aria-selected=true]{background:var(--sf2)}
.sf-e{padding:16px 10px;color:var(--mu);text-align:center}
</style>
<div class="k"><div class="sf" id="w">
  <div class="sf-f"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" role="combobox" aria-expanded="false" aria-controls="lb" aria-autocomplete="list" placeholder="Search docs" autocomplete="off" spellcheck="false"><span class="sf-sp" id="sp" hidden></span><button class="ibt" id="cl" aria-label="Clear" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M18 6 6 18M6 6l12 12"/></svg></button><kbd id="kb">⌘K</kbd></div>
  <ul class="card sf-l" id="lb" role="listbox" hidden></ul></div></div>
<script>
const D=[["Getting started","Guide"],["Install with npm","Guide"],["Theming and tokens","Guide"],["Dark mode","Guide"],["Button","Component"],["Bottom sheet","Component"],["Tab bar","Component"],["Search field","Component"],["Tokens reference","API"],["useTheme()","API"]];
const RC=["Dark mode","Tab bar"];
const I=p=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`,CLK=I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),DOC=I('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>');
kb.textContent=/Mac|iPhone/.test(navigator.platform)?"⌘K":"Ctrl K";
let opts=[],act=-1,tm;const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const hl=(s,w)=>{const i=s.toLowerCase().indexOf(w);return i<0?esc(s):esc(s.slice(0,i))+"<b>"+esc(s.slice(i,i+w.length))+"</b>"+esc(s.slice(i+w.length))};
const open=o=>{lb.hidden=!o;q.setAttribute("aria-expanded",o)};
const render=w=>{let h="";opts=[];if(!w){h='<li class="sf-g" role="presentation">Recent</li>'+RC.map(r=>{opts.push(r);return`<li class="sf-o" role="option" id="o${opts.length-1}">${CLK}${esc(r)}</li>`}).join("")}else{const M=D.filter(d=>d[0].toLowerCase().includes(w));if(!M.length)h=`<li class="sf-e" role="presentation">No results for “${esc(w)}”</li>`;["Guide","Component","API"].forEach(g=>{const L=M.filter(m=>m[1]===g);if(L.length)h+=`<li class="sf-g" role="presentation">${g}s</li>`+L.map(m=>{opts.push(m[0]);return`<li class="sf-o" role="option" id="o${opts.length-1}">${DOC}${hl(m[0],w)}</li>`}).join("")})}lb.innerHTML=h;act=-1;q.removeAttribute("aria-activedescendant");open(true)};
const mark=i=>{act=i;lb.querySelectorAll(".sf-o").forEach((o,j)=>o.setAttribute("aria-selected",j===i));const el=document.getElementById("o"+i);if(el){q.setAttribute("aria-activedescendant",el.id);el.scrollIntoView({block:"nearest"})}};
const pick=i=>{if(i<0)return;q.value=opts[i];cl.hidden=false;open(false);if(!RC.includes(opts[i]))RC.unshift(opts[i]),RC.length=Math.min(RC.length,4)};
q.addEventListener("input",()=>{cl.hidden=!q.value;sp.hidden=false;clearTimeout(tm);tm=setTimeout(()=>{sp.hidden=true;render(q.value.trim().toLowerCase())},250)});
q.addEventListener("focus",()=>render(q.value.trim().toLowerCase()));
q.addEventListener("keydown",e=>{if(e.key==="ArrowDown"){e.preventDefault();if(lb.hidden)render(q.value.trim().toLowerCase());mark(Math.min(opts.length-1,act+1))}else if(e.key==="ArrowUp"){e.preventDefault();mark(Math.max(0,act-1))}else if(e.key==="Enter"){e.preventDefault();pick(act)}else if(e.key==="Escape"){if(!lb.hidden)open(false);else{q.value="";cl.hidden=true}}});
lb.addEventListener("mousedown",e=>e.preventDefault());lb.addEventListener("click",e=>{const o=e.target.closest(".sf-o");if(o)pick(+o.id.slice(1))});
lb.addEventListener("mousemove",e=>{const o=e.target.closest(".sf-o");if(o&&+o.id.slice(1)!==act)mark(+o.id.slice(1))});
q.addEventListener("blur",()=>open(false));
cl.onclick=()=>{q.value="";cl.hidden=true;q.focus()};
addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();q.focus();q.select()}});
</script>

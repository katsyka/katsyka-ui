<style>
.dd{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.dd :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dd ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.dd *,.dd *::before,.dd *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.dd{min-height:100vh;display:grid;place-items:start center;padding:70px 16px 48px;background:var(--sf)}
.dd-bar{width:min(560px,100%);display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px;border-radius:14px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow)}
.dd-bar b{font-size:15px;font-weight:620}
.dd-anc{position:relative}
.dd-trg{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 6px;border:0;border-radius:11px;background:none;color:var(--fg);cursor:pointer;font:550 14px Geist,system-ui,sans-serif}
.dd-trg:hover,.dd-trg[aria-expanded=true]{background:var(--sf2)}
.dd-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#c2410c;color:#fff;font-size:12px;font-weight:650}
.dd-trg svg{width:16px;height:16px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round}
.dd-m{position:absolute;top:calc(100% + 6px);right:0;z-index:10;width:260px;padding:5px;border-radius:13px;background:var(--bg);border:1px solid var(--line);box-shadow:0 18px 40px -12px #00000040,0 2px 6px #00000014;opacity:0;visibility:hidden;transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity .13s,transform .16s var(--ease),visibility 0s .16s}
.dd-m.on{opacity:1;visibility:visible;transform:none;transition:opacity .13s,transform .16s var(--ease)}
.dd-who{padding:10px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:5px}
.dd-who b{display:block;font-size:14px;font-weight:600}
.dd-who small{font-size:12.5px;color:var(--mu)}
.dd-gl{padding:8px 10px 4px;font:500 11px "Geist Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.dd-sep{height:1px;margin:5px -5px;background:var(--line)}
.dd-i{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--fg);font:500 14px Geist,system-ui,sans-serif;text-align:left;cursor:pointer}
.dd-i:focus{outline:0}
.dd-i:hover,.dd-i:focus-visible,.dd-i.act{background:var(--sf2)}
.dd-i svg{flex:none;width:16px;height:16px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dd-i kbd{margin-left:auto;font:500 11.5px "Geist Mono",monospace;color:var(--mu)}
.dd-i .ck{visibility:hidden;stroke:var(--ac)}
.dd-i[aria-checked=true] .ck{visibility:visible}
.dd-i .rd{width:16px;display:grid;place-items:center}
.dd-i .rd::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);transform:scale(0);transition:transform .15s}
.dd-i[aria-checked=true] .rd::after{transform:none}
.dd-i.dng{color:var(--err)}.dd-i.dng svg{stroke:var(--err)}
.dd-i.dng:hover,.dd-i.dng.act{background:var(--err-sf)}
.dd-i .bd{margin-left:auto;padding:1px 7px;border-radius:99px;background:var(--ac-sf);color:var(--ac);font-size:11px;font-weight:650}
.dd-out{width:min(560px,100%);margin-top:16px;font-size:13.5px;color:var(--mu);text-align:center}
</style>
<div class="dd">
  <div class="dd-bar"><b>Workspace</b>
    <div class="dd-anc"><button class="dd-trg" aria-haspopup="menu" aria-expanded="false" aria-controls="ddM"><span class="dd-av" aria-hidden="true">MO</span>Mira<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="dd-m" id="ddM" role="menu" aria-label="Account">
        <div class="dd-who" role="none"><b>Mira Okafor</b><small>mira@studio.io</small></div>
        <button class="dd-i" role="menuitem"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile<kbd>⇧⌘P</kbd></button>
        <button class="dd-i" role="menuitem"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Billing<span class="bd">PRO</span></button>
        <button class="dd-i" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Settings<kbd>⌘,</kbd></button>
        <div class="dd-sep" role="separator"></div>
        <button class="dd-i" role="menuitemcheckbox" aria-checked="true"><svg class="ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Show status bar</button>
        <button class="dd-i" role="menuitemcheckbox" aria-checked="false"><svg class="ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Compact mode</button>
        <div class="dd-sep" role="separator"></div>
        <div class="dd-gl" role="none" id="ddTg">Theme</div>
        <div role="group" aria-labelledby="ddTg">
          <button class="dd-i" role="menuitemradio" aria-checked="false"><span class="rd"></span>Light</button>
          <button class="dd-i" role="menuitemradio" aria-checked="false"><span class="rd"></span>Dark</button>
          <button class="dd-i" role="menuitemradio" aria-checked="true"><span class="rd"></span>System</button>
        </div>
        <div class="dd-sep" role="separator"></div>
        <button class="dd-i dng" role="menuitem"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Log out<kbd>⇧⌘Q</kbd></button>
      </div></div>
  </div>
  <div class="dd-out" aria-live="polite">Arrow keys, Home/End and type-ahead all work.</div>
</div>
<script>
const trg=document.querySelector(".dd-trg"),M=document.getElementById("ddM"),its=[...M.querySelectorAll(".dd-i")],out=document.querySelector(".dd-out");
let buf="",bt;
const focusI=i=>{its.forEach(x=>{x.tabIndex=-1;x.classList.remove("act")});its[i].tabIndex=0;its[i].classList.add("act");its[i].focus()};
const open=(i=0)=>{M.classList.add("on");trg.setAttribute("aria-expanded","true");focusI(i)};
const close=f=>{M.classList.remove("on");trg.setAttribute("aria-expanded","false");its.forEach(x=>x.classList.remove("act"));if(f)trg.focus()};
trg.addEventListener("click",()=>M.classList.contains("on")?close():open());
trg.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="Enter"||e.key===" "){e.preventDefault();open()}else if(e.key==="ArrowUp"){e.preventDefault();open(its.length-1)}});
M.addEventListener("keydown",e=>{const i=its.indexOf(document.activeElement);
  if(e.key==="ArrowDown"){e.preventDefault();focusI((i+1)%its.length)}else if(e.key==="ArrowUp"){e.preventDefault();focusI((i-1+its.length)%its.length)}
  else if(e.key==="Home"){e.preventDefault();focusI(0)}else if(e.key==="End"){e.preventDefault();focusI(its.length-1)}
  else if(e.key==="Escape"){e.preventDefault();close(true)}else if(e.key==="Tab"){close()}
  else if(e.key.length===1&&e.key!==" "){buf+=e.key.toLowerCase();clearTimeout(bt);bt=setTimeout(()=>buf="",500);const j=its.findIndex(x=>x.textContent.trim().toLowerCase().startsWith(buf));if(j>-1)focusI(j)}});
its.forEach((it,i)=>{it.addEventListener("pointermove",()=>{if(!it.classList.contains("act"))focusI(i)});
  it.addEventListener("click",()=>{const r=it.getAttribute("role"),name=it.textContent.replace(/⇧?⌘.*$|PRO$/,"").trim();
    if(r==="menuitemcheckbox"){const v=it.getAttribute("aria-checked")!=="true";it.setAttribute("aria-checked",v);out.textContent=`${name}: ${v?"on":"off"}`;return}
    if(r==="menuitemradio"){it.parentElement.querySelectorAll("[role=menuitemradio]").forEach(x=>x.setAttribute("aria-checked",x===it));out.textContent=`Theme: ${name}`;return}
    out.textContent=`Selected “${name}”`;close(true)})});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".dd-anc"))close()});
</script>

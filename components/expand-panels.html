<style>
.xp{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.xp :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.xp ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.xp *,.xp *::before,.xp *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.xp{min-height:100vh;display:grid;align-content:center;gap:28px;padding:48px clamp(16px,4vw,56px);background:var(--bg);color:var(--fg);font-family:Geist,system-ui,sans-serif}
.xp-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;max-width:1240px;width:100%;margin:0 auto}
.xp-h h2{margin:0;font-size:clamp(36px,4.6vw,64px);line-height:.95;letter-spacing:-.05em;font-weight:600}
.xp-h em{font:italic 400 1.05em "Instrument Serif",serif;letter-spacing:-.02em}
.xp-h p{margin:0;font:500 12px "Geist Mono",monospace;letter-spacing:.12em;color:var(--mu)}
.xp-l{display:flex;gap:10px;height:min(66vh,620px);max-width:1240px;width:100%;margin:0 auto;padding:0;list-style:none}
.xp-l li{flex:1;min-width:0;display:grid;grid-template-rows:1fr auto;gap:12px;transition:flex .7s cubic-bezier(.65,0,.35,1)}
.xp-l li.on{flex:5}
.xp-l button{position:relative;padding:0;border:0;border-radius:var(--r3);overflow:hidden;background:var(--sf2);cursor:pointer;min-height:0}
.xp-l img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;scale:1.12;transition:scale 1s cubic-bezier(.2,.8,.2,1)}
.xp-l li.on img{scale:1}
.xp-l p{display:flex;gap:12px;align-items:baseline;margin:0;white-space:nowrap;overflow:hidden;font-size:16px;font-weight:600;letter-spacing:-.02em}
.xp-l p span{font:500 12px "Geist Mono",monospace;letter-spacing:.08em;color:var(--mu)}
.xp-l p b{font-weight:600;opacity:0;transition:opacity .4s}
.xp-l li.on p b{opacity:1;transition-delay:.3s}
@media (max-width:700px){.xp-l{flex-direction:column;height:auto}.xp-l li{flex:none;grid-template-rows:auto auto}.xp-l button{height:64px;transition:height .7s cubic-bezier(.65,0,.35,1)}.xp-l li.on button{height:44vh}}
</style>
<section class="xp" aria-label="Expanding photo panels">
  <div class="xp-h"><h2>Five places <em>worth the detour.</em></h2><p>HOVER OR TAB THROUGH</p></div>
  <ul class="xp-l">
    <li class="on"><button type="button" aria-pressed="true" aria-label="Rainbow falls"><img src="media/pics/c/1035.jpg" alt=""></button><p><span>01</span><b>Rainbow falls</b></p></li>
    <li><button type="button" aria-pressed="false" aria-label="Moss gorge"><img src="media/pics/c/1039.jpg" alt=""></button><p><span>02</span><b>Moss gorge</b></p></li>
    <li><button type="button" aria-pressed="false" aria-label="Hilltop castle"><img src="media/pics/c/1040.jpg" alt=""></button><p><span>03</span><b>Hilltop castle</b></p></li>
    <li><button type="button" aria-pressed="false" aria-label="Granite valley"><img src="media/pics/c/1043.jpg" alt=""></button><p><span>04</span><b>Granite valley</b></p></li>
    <li><button type="button" aria-pressed="false" aria-label="Sea stacks"><img src="media/pics/c/1050.jpg" alt=""></button><p><span>05</span><b>Sea stacks</b></p></li>
  </ul>
</section>
<script>
(()=>{
// One panel is open at a time; hover, focus or click opens it (flex-grow animates the width; on mobile, the height).
const items=[...document.querySelectorAll(".xp-l li")];
const open=li=>items.forEach(o=>{const on=o===li;o.classList.toggle("on",on);o.querySelector("button").setAttribute("aria-pressed",on)});
items.forEach(li=>{const b=li.querySelector("button");li.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")open(li)});b.addEventListener("focus",()=>open(li));b.addEventListener("click",()=>open(li))});
})();
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.vn{width:min(640px,100%);display:grid;gap:14px}.vn h2{margin:0 0 4px;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.vn-c{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:16px;display:grid;gap:12px}.vn-t{display:flex;gap:12px;align-items:center}.vn-t img{width:40px;height:40px;border-radius:50%;object-fit:cover}.vn-t div{display:grid;flex:1;font-size:14px}.vn-t small{color:var(--mu);font-size:12px}
.vn-p{display:flex;gap:12px;align-items:center}.vn-pp{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none;transition:transform .12s}.vn-pp:active{transform:scale(.95)}
.vn-wv{flex:1;height:40px;display:flex;align-items:center;gap:2px;cursor:pointer}.vn-wv i{flex:1;border-radius:2px;height:var(--h);background:var(--ctl);opacity:.45}.vn-wv i.on{background:var(--ac);opacity:1}
.vn-tm{font:12px 'Geist Mono',monospace;color:var(--mu);width:36px;text-align:right}.vn-sp{height:28px;padding:0 8px;border:1px solid var(--line);border-radius:999px;font:600 11px 'Geist Mono',monospace}
.vn-tx{margin:0;font-size:14px;line-height:1.6;color:var(--mu)}.vn-tx span{transition:color .2s}.vn-tx span.on{color:var(--fg)}
</style>
<div class="k"><section class="vn"><h2>In their own voice</h2><div class="vn-l" id="l"></div></section></div>
<script>
const V=[["Rosa Mendes","Ceramics studio, Porto","media/pics/c/1012.jpg","I was dreading moving the class bookings. It took me one evening. My students didn't even notice, which is the best compliment I can give.",21],["Femi Adeyemi","Cycling club organiser","media/pics/c/1083.jpg","Before, I spent Sunday nights texting forty people about Monday's ride. Now they just check the app and I get my Sundays back.",17],["Hanne Lie","Freelance translator","media/pics/c/1014.jpg","The invoices look professional and they go out on time. Clients pay faster. That's really all I needed.",14]];
const l=document.getElementById('l');let cur=-1,t=null,pos=[0,0,0],sp=[1,1,1];
l.innerHTML=V.map(([n,r,img,tx,d],i)=>{let s=i*13+5;const rnd=()=>(s=s*16807%2147483647)/2147483647;return `<article class="vn-c"><div class="vn-t"><img src="${img}" alt=""><div><b>${n}</b><small>${r}</small></div></div><div class="vn-p"><button class="vn-pp" data-p="${i}" aria-label="Play ${n}'s voice note"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M7 4v16l13-8z" fill="currentColor"/></svg></button><div class="vn-wv" data-w="${i}" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="${d}" aria-valuenow="0" tabindex="0">${Array.from({length:48},(_,k)=>`<i style="--h:${Math.round(20+Math.abs(Math.sin(k/3+i))*60+rnd()*20)}%"></i>`).join('')}</div><span class="vn-tm tn" id="tm${i}">0:${String(d).padStart(2,'0')}</span><button class="vn-sp" data-s="${i}" aria-label="Playback speed">1×</button></div><p class="vn-tx" id="tx${i}">${tx.split(' ').map(w=>`<span>${w}</span>`).join(' ')}</p></article>`}).join('');
function ui(i){const d=V[i][4],p=pos[i]/d,W=l.querySelectorAll(`[data-w="${i}"] i`),S=l.querySelectorAll(`#tx${i} span`);W.forEach((w,k)=>w.classList.toggle('on',k/W.length<p));S.forEach((s,k)=>s.classList.toggle('on',k/S.length<p));l.querySelector(`[data-w="${i}"]`).setAttribute('aria-valuenow',Math.round(pos[i]));const r=Math.ceil(d-pos[i]);document.getElementById('tm'+i).textContent='0:'+String(r).padStart(2,'0')}
function stop(){if(cur<0)return;clearInterval(t);const b=l.querySelector(`[data-p="${cur}"]`);b.innerHTML='<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>';b.setAttribute('aria-label','Play');cur=-1}
function play(i){stop();cur=i;const b=l.querySelector(`[data-p="${i}"]`);b.innerHTML='<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M7 4h3v16H7zM14 4h3v16h-3z" fill="currentColor"/></svg>';b.setAttribute('aria-label','Pause');if(pos[i]>=V[i][4])pos[i]=0;t=setInterval(()=>{pos[i]=Math.min(V[i][4],pos[i]+.1*sp[i]);ui(i);if(pos[i]>=V[i][4])stop()},100)}
l.onclick=e=>{const p=e.target.closest('[data-p]');if(p){const i=+p.dataset.p;cur===i?stop():play(i);return}const s=e.target.closest('[data-s]');if(s){const i=+s.dataset.s;sp[i]=sp[i]===1?1.5:sp[i]===1.5?2:1;s.textContent=sp[i]+'×';return}const w=e.target.closest('[data-w]');if(w){const i=+w.dataset.w,r=w.getBoundingClientRect();pos[i]=(e.clientX-r.left)/r.width*V[i][4];ui(i)}};
l.onkeydown=e=>{const w=e.target.closest('[data-w]');if(!w)return;const i=+w.dataset.w;if(e.key==='ArrowRight')pos[i]=Math.min(V[i][4],pos[i]+2);else if(e.key==='ArrowLeft')pos[i]=Math.max(0,pos[i]-2);else return;e.preventDefault();ui(i)};
</script>

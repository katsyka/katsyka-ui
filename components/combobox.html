<style>
.cb-stage{min-height:100vh;display:grid;place-items:start center;padding:14vh 16px 40px;background:#f5f4f1;color:#1b1a17}
.cb{width:min(480px,100%)}
.cb label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px}
.cb-box{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:50px;padding:7px 10px;border-radius:14px;background:#fff;border:1.5px solid #e4e1da;transition:border-color .2s,box-shadow .2s;cursor:text}
.cb-box.focus{border-color:#1b1a17;box-shadow:0 0 0 4px #1b1a170d}
.cb-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 4px;border-radius:9px;background:#f1efea;font-size:13.5px;font-weight:500;animation:cb-pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes cb-pop{from{transform:scale(.6);opacity:0}}
.cb-chip.hit{background:#1b1a17;color:#fff}
.cb-chip code,.cb-it code{font:600 10px "Geist Mono",monospace;padding:3px 5px;border-radius:5px;background:#1b1a17;color:#fff}
.cb-chip button{width:20px;height:20px;border-radius:6px;border:0;background:none;color:inherit;opacity:.5;cursor:pointer}.cb-chip button:hover{opacity:1;background:#1b1a1712}
.cb-box input{flex:1;min-width:120px;height:32px;border:0;outline:0;background:none;font:15px Geist,sans-serif;color:inherit}
.cb-pop{margin-top:8px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px #1b1a170f,0 20px 50px -18px #1b1a1740;overflow:hidden;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1,.3,1)}
.cb-pop.open{opacity:1;transform:none;pointer-events:auto}
.cb-list{position:relative;max-height:320px;overflow:auto;padding:6px;margin:0;list-style:none}
.cb-g{padding:10px 10px 6px;font:500 11px "Geist Mono",monospace;letter-spacing:.08em;color:#a19d94;text-transform:uppercase}
.cb-it{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border-radius:10px;cursor:pointer;font-size:14.5px}
.cb-it.act{background:#f3f1ec}
.cb-it span{flex:1}.cb-it mark{background:#ffd8c2;color:inherit;border-radius:3px;padding:0 1px}
.cb-it small{font:12px "Geist Mono",monospace;color:#a19d94}
.cb-it .ok{width:16px;height:16px;color:#1b1a17;opacity:0}.cb-it.sel .ok{opacity:1}
.cb-it.create{color:#c2410c;font-weight:500}
.cb-empty{padding:28px;text-align:center;color:#a19d94;font-size:14px}
.cb-hint{display:flex;gap:14px;padding:10px 14px;border-top:1px solid #1b1a170d;font-size:12px;color:#a19d94}.cb-hint kbd{font:11px "Geist Mono",monospace;padding:1px 5px;border-radius:4px;border:1px solid #e4e1da;color:#6b675f}
</style>
<div class="cb-stage"><div class="cb">
  <label for="cbIn">Where is your team based?</label>
  <div class="cb-box"><input id="cbIn" role="combobox" aria-expanded="false" aria-controls="cbList" aria-autocomplete="list" placeholder="Search cities…" autocomplete="off"></div>
  <div class="cb-pop"><ul class="cb-list" id="cbList" role="listbox"></ul><div class="cb-hint"><span><kbd>↑↓</kbd> move</span><span><kbd>↵</kbd> select</span><span><kbd>⌫</kbd> remove last</span></div></div>
</div></div>
<script>
(()=>{
const CITIES=[["Lisbon","PT","Europe"],["Berlin","DE","Europe"],["Barcelona","ES","Europe"],["Bergen","NO","Europe"],["Amsterdam","NL","Europe"],["London","GB","Europe"],["Lagos","NG","Africa"],["Nairobi","KE","Africa"],["Cape Town","ZA","Africa"],
 ["Tokyo","JP","Asia"],["Seoul","KR","Asia"],["Singapore","SG","Asia"],["Bangalore","IN","Asia"],["Tbilisi","GE","Asia"],["New York","US","Americas"],["Mexico City","MX","Americas"],["São Paulo","BR","Americas"],["Buenos Aires","AR","Americas"],["Toronto","CA","Americas"],["Melbourne","AU","Oceania"]];
const RECENT=["Lisbon","Tokyo","New York"];
const box=document.querySelector(".cb-box"),inp=box.querySelector("input"),pop=document.querySelector(".cb-pop"),list=pop.querySelector("ul");
let sel=[],items=[],act=0;
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const hi=(t,q)=>{if(!q)return t;const i=norm(t).indexOf(q);return i<0?t:t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length)};
function render(){const q=norm(inp.value.trim());items=[];let html="";
  const add=(c,g)=>{if(g!==add.g){html+=`<li class="cb-g">${g}</li>`;add.g=g}const s=sel.includes(c[0]);html+=`<li class="cb-it${s?" sel":""}" role="option" id="cbo${items.length}" data-i="${items.length}" aria-selected="${s}"><code>${c[1]}</code><span>${hi(c[0],q)}</span><small>${c[2]}</small><svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5 9-10"/></svg></li>`;items.push(c[0])};
  add.g=null;
  if(!q)RECENT.forEach(n=>add(CITIES.find(c=>c[0]===n),"Recent"));
  const m=CITIES.filter(c=>!q||norm(c[0]).includes(q)||norm(c[2]).startsWith(q)).sort((a,b)=>norm(a[0]).indexOf(q)-norm(b[0]).indexOf(q)||a[2].localeCompare(b[2]));
  if(q)m.forEach(c=>add(c,c[2]));else m.filter(c=>!RECENT.includes(c[0])).slice(0,6).forEach(c=>add(c,"Popular"));
  if(q&&!CITIES.some(c=>norm(c[0])===q)){html+=`<li class="cb-it create" role="option" id="cbo${items.length}" data-i="${items.length}"><span>+ Add “${inp.value.trim().replace(/</g,"&lt;")}”</span></li>`;items.push("+"+inp.value.trim())}
  list.innerHTML=html||'<li class="cb-empty">No cities found</li>';act=Math.min(act,items.length-1);mark()}
function mark(){list.querySelectorAll(".cb-it").forEach(li=>li.classList.toggle("act",+li.dataset.i===act));const a=list.querySelector(".act");if(a){a.scrollIntoView({block:"nearest"});inp.setAttribute("aria-activedescendant",a.id)}}
function chips(){box.querySelectorAll(".cb-chip").forEach(c=>c.remove());sel.forEach(n=>{const c=CITIES.find(x=>x[0]===n)||[n,"··"];const el=document.createElement("span");el.className="cb-chip";
  el.innerHTML=`<code>${c[1]}</code>${n.replace(/</g,"&lt;")}<button aria-label="Remove ${n}">✕</button>`;el.querySelector("button").onclick=e=>{e.stopPropagation();sel=sel.filter(x=>x!==n);chips();render();inp.focus()};inp.before(el)})}
function pick(i){let v=items[i];if(v===undefined)return;if(v[0]==="+"){v=v.slice(1);CITIES.push([v,"··","Custom"])}
  sel=sel.includes(v)?sel.filter(x=>x!==v):[...sel,v];inp.value="";chips();render()}
const open=o=>{pop.classList.toggle("open",o);inp.setAttribute("aria-expanded",o)};
inp.addEventListener("focus",()=>{box.classList.add("focus");open(true);render()});
inp.addEventListener("blur",()=>setTimeout(()=>{if(document.activeElement!==inp){box.classList.remove("focus");open(false)}},120));
inp.addEventListener("input",()=>{act=0;open(true);render()});
inp.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();act=(act+1)%items.length;mark()}else if(e.key==="ArrowUp"){e.preventDefault();act=(act-1+items.length)%items.length;mark()}
  else if(e.key==="Enter"){e.preventDefault();pick(act)}else if(e.key==="Escape")open(false)
  else if(e.key==="Backspace"&&!inp.value&&sel.length){const last=box.querySelectorAll(".cb-chip");const c=last[last.length-1];if(c.classList.contains("hit")){sel.pop();chips();render()}else c.classList.add("hit")}});
list.addEventListener("mousedown",e=>e.preventDefault());
list.addEventListener("click",e=>{const li=e.target.closest(".cb-it");if(li)pick(+li.dataset.i)});
list.addEventListener("mousemove",e=>{const li=e.target.closest(".cb-it");if(li&&+li.dataset.i!==act){act=+li.dataset.i;mark()}});
box.addEventListener("click",()=>inp.focus());
})();
</script>

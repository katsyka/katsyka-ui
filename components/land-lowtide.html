<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}


.k.pg{display:block;place-items:normal;padding:0;background:var(--bg);font-size:16px;min-height:0}
.pg .w{width:min(1180px,100% - 32px);margin-inline:auto;min-width:0}
.pg{overflow-x:clip}
.pg img{display:block;max-width:100%}
.pg h1,.pg h2,.pg h3,.pg p{margin:0}
.pg .ser{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.pg .h1{font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:-.035em;font-weight:650;text-wrap:balance}
.pg .h2{font-size:clamp(30px,4.4vw,52px);line-height:1.05;letter-spacing:-.03em;font-weight:620;text-wrap:balance}
.pg .h3{font-size:19px;line-height:1.3;font-weight:620;letter-spacing:-.01em}
.pg .lead{font-size:clamp(17px,1.6vw,20px);line-height:1.5;color:var(--mu);text-wrap:pretty;max-width:60ch}
.pg .eb{font:500 12px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pg .sec{padding:clamp(64px,10vw,128px) 0}
.pg .b.lg{height:48px;padding:0 22px;font-size:15px;border-radius:12px}
.pg .ph{width:100%;height:100%;object-fit:cover}
.pg .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pg .top .w{display:flex;align-items:center;gap:24px;height:64px}
.pg .logo{white-space:nowrap;font-weight:700;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.pg .links{display:flex;gap:24px;margin-left:auto;font-size:14px}.pg .links a{color:var(--mu);text-decoration:none}.pg .links a:hover{color:var(--fg)}
.pg .menu{display:none;margin-left:auto;width:44px;height:44px;place-items:center;border-radius:10px}
.pg .foot{border-top:1px solid var(--line);padding:32px 0;font-size:13px;color:var(--mu)}.pg .foot .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:760px){.pg .links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}.pg .links a{padding:12px 0;font-size:16px}.pg .top.open .links{display:flex}.pg .menu{display:grid}.pg .top .b{display:none}}
.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.fe{--p1:#ff3d7f;--p2:#ffd23f;--p3:#3dd6c6;--pb:#1d1a6b;background:var(--pb)!important;color:#fff;transition:background .4s var(--ease)}
.fe .top{background:color-mix(in srgb,var(--pb) 85%,transparent);border-color:rgb(255 255 255/.14)}.fe .links a{color:rgb(255 255 255/.75)}.fe .logo{color:#fff;font-weight:800}.fe .b.ac{background:var(--p2);color:#14123d}.fe .foot{color:rgb(255 255 255/.65);border-color:rgb(255 255 255/.14)}.fe .menu{color:#fff}
.fe-hero{padding:56px 0 24px}.fe-k{font:600 13px/1.4 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--p3)}
.fe-t{font-size:clamp(96px,24vw,300px);line-height:.78;font-weight:900;letter-spacing:-.06em;display:grid;margin:18px 0 28px!important}.fe-t span:first-child{color:var(--p1)}.fe-t span:last-child{color:var(--p2);margin-left:.4em}
.fe-cd{display:flex;gap:10px;flex-wrap:wrap}.fe-cd div{background:#fff;color:var(--pb);border-radius:14px;padding:10px 14px;min-width:84px;display:grid;font-variant-numeric:tabular-nums}.fe-cd b{font-size:30px;line-height:1;font-weight:800}.fe-cd span{font-size:12px;font-weight:600;opacity:.7}
.fe-lu{padding:56px 0}.fe-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.fe-tabs button{height:44px;padding:0 18px;border-radius:99px;border:2px solid rgb(255 255 255/.35);color:#fff;font:600 15px Geist,sans-serif;background:none;cursor:pointer}.fe-tabs button[aria-selected=true]{background:#fff;color:var(--pb);border-color:#fff}
.fe-names{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;font-weight:850;letter-spacing:-.03em;text-transform:uppercase;line-height:1}.fe-names span{animation:fen .4s var(--ease) both}.fe-names .x1{font-size:clamp(44px,8vw,96px)}.fe-names .x2{font-size:clamp(30px,5vw,56px)}.fe-names .x3{font-size:clamp(20px,3vw,30px);opacity:.85}
@keyframes fen{from{opacity:0;transform:translateY(12px)}}
.fe-tk{padding:24px 0 80px}.fe-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.fe-tier{border-radius:20px;padding:20px;color:#14123d;display:grid;gap:10px}.fe-tier h3{margin:0;font-size:20px;font-weight:800}.fe-tier p{margin:0;font-size:14px;opacity:.8}.fe-tier .pr{font-size:34px;font-weight:850;letter-spacing:-.03em}
.fe-q{display:flex;align-items:center;gap:6px}.fe-q button{width:44px;height:44px;border-radius:12px;border:0;background:rgb(20 18 61/.12);color:inherit;display:grid;place-items:center;cursor:pointer}.fe-q button:disabled{opacity:.35}.fe-q output{min-width:32px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.fe-sum{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:18px;font-weight:700;border-top:1px solid rgb(255 255 255/.2);padding-top:16px}.fe-msg{margin-top:12px!important;color:var(--p3)}
@media (max-width:760px){.fe-tiers{grid-template-columns:1fr}}
</style>
<div class="k pg fe" id="pg">
<header class="top"><div class="w"><a class="logo" href="#">LOWTIDE ’27</a><nav class="links"><a href="#lu">Lineup</a><a href="#tk">Tickets</a></nav><a class="b ac" href="#tk">Get tickets</a><button class="menu ibt" aria-label="Menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button></div></header>
<section class="fe-hero"><div class="w"><p class="fe-k">3 days · 4 stages · on the old salt flats</p><h1 class="fe-t"><span>LOW</span><span>TIDE</span></h1>
<div class="fe-cd" id="cd" aria-label="Countdown to gates opening"></div></div></section>
<section class="w fe-lu" id="lu"><div class="fe-tabs" role="tablist" id="tabs"></div><div class="fe-names" id="names" role="tabpanel"></div></section>
<section class="w fe-tk" id="tk"><h2 class="h2">Tickets</h2><div class="fe-tiers" id="tiers"></div><div class="fe-sum"><span id="sum">0 tickets · €0</span><button class="b ac lg" id="buy" disabled>Checkout</button></div><p class="fe-msg" id="msg" role="status"></p></section>
<footer class="foot"><div class="w"><span>Lowtide is demo content.</span><span>Ages 16+. No glass on the flats.</span></div></footer>
</div>
<script>
document.querySelectorAll('.pg .menu').forEach(m=>m.addEventListener('click',()=>{const t=m.closest('.top');const o=t.classList.toggle('open');m.setAttribute('aria-expanded',o)}));
const DAYS={Friday:{c:['#ff3d7f','#ffd23f','#3dd6c6','#1d1a6b'],n:[['Marrow Bay',1],['Sister Cobalt',1],['Velvet Ferry',2],['Okra Moon',2],['The Low Bells',2],['Dune Static',3],['Pea Coat',3],['Hollis & Fen',3],['Twelve Kites',3]]},Saturday:{c:['#ffb703','#8ecae6','#ff5d5d','#5b1238'],n:[['Glass Animals Club',1],['Ruby Sedan',1],['Neon Parish',2],['Kelp',2],['Ana Lisboa',2],['Saltwater Choir',3],['Mopeds',3],['Lanternfish',3],['Gold Static',3]]},Sunday:{c:['#a3e635','#f472b6','#facc15','#0f3d3e'],n:[['Harbour Lights',1],['Juniper Rail',1],['Small Hours',2],['Tin Orchard',2],['Marisol',2],['The Undertow',3],['Paper Moons',3],['Fogline',3],['Wren',3]]}};
const pg=document.getElementById('pg'),tabs=document.getElementById('tabs'),names=document.getElementById('names');
function show(d){const D=DAYS[d];['--p1','--p2','--p3','--pb'].forEach((v,i)=>pg.style.setProperty(v,D.c[i]));tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.textContent===d));names.innerHTML=D.n.map((n,i)=>`<span class="x${n[1]}" style="color:${D.c[i%3]};animation-delay:${i*30}ms">${n[0]}</span>`).join('<span class="x3" aria-hidden="true">·</span>')}
Object.keys(DAYS).forEach(d=>{const b=document.createElement('button');b.role='tab';b.textContent=d;b.onclick=()=>show(d);tabs.append(b)});
tabs.onkeydown=e=>{const bs=[...tabs.children],i=bs.indexOf(document.activeElement);if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=bs[(i+(e.key==='ArrowRight'?1:bs.length-1))%bs.length];n.focus();n.click()}};show('Friday');
const gate=new Date(new Date().getFullYear()+1,6,16,14),cd=document.getElementById('cd');
function tick(){let s=Math.max(0,(gate-Date.now())/1e3|0);const u=[['days',86400],['hours',3600],['min',60],['sec',1]].map(([l,k])=>{const v=s/k|0;s-=v*k;return`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`});cd.innerHTML=u.join('')}tick();setInterval(tick,1000);
const T=[['Day pass','One day, any stage',69,'#ffd23f'],['Weekend','All three days',159,'#3dd6c6'],['Weekend + camp','Pitch on the flats',219,'#ff7eb3']],q=T.map(()=>0),tiers=document.getElementById('tiers'),sum=document.getElementById('sum'),buy=document.getElementById('buy');
T.forEach((t,i)=>{const d=document.createElement('div');d.className='fe-tier';d.style.background=t[3];d.innerHTML=`<h3>${t[0]}</h3><p>${t[1]}</p><span class="pr">€${t[2]}</span><div class="fe-q"><button aria-label="Remove one ${t[0]}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M5 12h14"/></svg></button><output aria-live="polite">0</output><button aria-label="Add one ${t[0]}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg></button></div>`;const [m,p]=d.querySelectorAll('button'),o=d.querySelector('output');const up=()=>{o.textContent=q[i];m.disabled=!q[i];p.disabled=q[i]>=8;const n=q.reduce((a,b)=>a+b,0);sum.textContent=`${n} ticket${n===1?'':'s'} · €${q.reduce((a,v,j)=>a+v*T[j][2],0)}`;buy.disabled=!n};m.onclick=()=>{q[i]--;up()};p.onclick=()=>{q[i]++;up()};up();tiers.append(d)});
buy.onclick=()=>{buy.disabled=true;buy.textContent='Reserving…';setTimeout(()=>{buy.textContent='Checkout';buy.disabled=false;document.getElementById('msg').textContent='Held for 10 minutes. (Demo: no payment is taken.)'},900)};
</script>

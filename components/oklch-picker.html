<style>
.ok3{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.ok3 :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ok3 ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.ok3 *,.ok3 *::before,.ok3 *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.ok3{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
.ok3-card{width:min(720px,100%);display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px;border-radius:24px;background:var(--sf);box-shadow:var(--shadow)}
.ok3-area{position:relative;aspect-ratio:5/4;border-radius:14px;overflow:hidden;touch-action:none;cursor:crosshair;background:#888}
.ok3-area canvas{width:100%;height:100%;display:block;image-rendering:auto}
.ok3-th{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0006,0 2px 6px #0005;pointer-events:none}
.ok3-area:focus-visible{outline-offset:3px}
.ok3-hue{position:relative;height:24px;margin-top:16px;border-radius:12px;background:linear-gradient(90deg,oklch(.7 .15 0),oklch(.7 .15 60),oklch(.7 .15 120),oklch(.7 .15 180),oklch(.7 .15 240),oklch(.7 .15 300),oklch(.7 .15 360));touch-action:none;cursor:pointer}
.ok3-hue i{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0006,0 2px 6px #0005;background:var(--hc)}
.ok3-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mu)}
.ok3-legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:repeating-linear-gradient(45deg,#8886 0 2px,transparent 2px 4px);border:1px solid var(--ctl)}
.ok3-r h3{margin:0 0 12px;font-size:16px;font-weight:600}
.ok3-sw{height:84px;border-radius:14px;background:var(--c);box-shadow:inset 0 0 0 1px #0000001a;margin-bottom:14px;display:flex;align-items:flex-end;padding:10px 12px;font-size:12px;font-weight:600;color:var(--on)}
.ok3-vals{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.ok3-v{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.ok3-v small{width:44px;font-size:12px;color:var(--mu)}.ok3-v code{flex:1;font:500 13.5px "Geist Mono",monospace}
.ok3-v button{height:32px;min-width:56px;border-radius:8px;border:1px solid var(--ctl);background:none;color:var(--fg);font:500 12.5px Geist,sans-serif;cursor:pointer}
.ok3-v button:hover{background:var(--sf2)}
.ok3-ct{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ok3-ct>div{padding:12px;border-radius:12px;border:1px solid var(--line)}
.ok3-ct b{display:block;font-size:22px;font-weight:600;color:var(--c);margin-bottom:6px}
.ok3-ct span{font:600 13px "Geist Mono",monospace}
.ok3-ct em{display:inline-block;margin:6px 4px 0 0;padding:2px 6px;border-radius:5px;font:600 10.5px "Geist Mono",monospace;font-style:normal}
.ok3-ct em.p{background:var(--ok-sf);color:var(--ok)}.ok3-ct em.f{background:var(--err-sf);color:var(--err)}
.ok3-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){.ok3-card{grid-template-columns:1fr}}
</style>
<section class="ok3"><div class="ok3-card">
  <div>
    <div class="ok3-area" tabindex="0" role="group" aria-label="Lightness and chroma. Arrow keys: up/down lightness, left/right chroma"><canvas width="250" height="200"></canvas><i class="ok3-th"></i></div>
    <div class="ok3-hue" role="slider" tabindex="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="360"><i></i></div>
    <div class="ok3-legend"><span>Outside sRGB gamut</span><b data-o="gam"></b></div>
  </div>
  <div class="ok3-r"><h3>OKLCH colour</h3><div class="ok3-sw">Aa — sample text</div>
    <div class="ok3-vals"><div class="ok3-v"><small>OKLCH</small><code data-o="oklch"></code><button>Copy</button></div><div class="ok3-v"><small>HEX</small><code data-o="hex"></code><button>Copy</button></div><div class="ok3-v"><small>RGB</small><code data-o="rgb"></code><button>Copy</button></div></div>
    <div class="ok3-ct"><div style="background:#fff;color:#111"><b>Aa</b><span data-o="cw"></span><div data-o="bw"></div></div><div style="background:#111;color:#fff"><b>Aa</b><span data-o="cb"></span><div data-o="bb"></div></div></div>
  </div>
  <div class="ok3-live" aria-live="polite"></div>
</div></section>
<script>
(()=>{
// OKLCH → linear sRGB (Björn Ottosson's matrices)
const toLin=(L,C,h)=>{const a=C*Math.cos(h*Math.PI/180),b=C*Math.sin(h*Math.PI/180),l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;
  return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s]};
const gam=x=>x<=.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-.055,inG=c=>c.every(v=>v>=-1e-4&&v<=1.0001);
const lum=c=>.2126*c[0]+.7152*c[1]+.0722*c[2],ratio=(a,b)=>(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
const MAXC=.37,root=document.querySelector(".ok3"),area=root.querySelector(".ok3-area"),cv=area.querySelector("canvas"),x=cv.getContext("2d"),th=area.querySelector(".ok3-th"),hue=root.querySelector(".ok3-hue"),live=root.querySelector(".ok3-live");
let L=.62,C=.19,H=40;
function paint(){const W=cv.width,Hh=cv.height,img=x.createImageData(W,Hh),d=img.data;
  for(let j=0;j<Hh;j++)for(let i=0;i<W;i++){const lin=toLin(1-j/(Hh-1),i/(W-1)*MAXC,H),k=(j*W+i)*4;
    if(inG(lin)){d[k]=gam(Math.max(0,lin[0]))*255;d[k+1]=gam(Math.max(0,lin[1]))*255;d[k+2]=gam(Math.max(0,lin[2]))*255}
    else{const v=((i+j)>>2)%2?150:120;d[k]=d[k+1]=d[k+2]=v}d[k+3]=255}
  x.putImageData(img,0,0)}
// clamp chroma into gamut so the picked colour is always displayable
const fit=()=>{let c=C;while(c>0&&!inG(toLin(L,c,H)))c-=.002;return Math.max(0,c)};
function update(rePaint){if(rePaint)paint();const c=fit(),lin=toLin(L,c,H),rgb=lin.map(v=>Math.round(gam(Math.min(1,Math.max(0,v)))*255)),hex="#"+rgb.map(v=>v.toString(16).padStart(2,"0")).join("");
  th.style.left=C/MAXC*100+"%";th.style.top=(1-L)*100+"%";th.style.background=hex;hue.querySelector("i").style.left=H/360*100+"%";hue.style.setProperty("--hc",`oklch(.7 .15 ${H})`);
  hue.setAttribute("aria-valuenow",Math.round(H));area.setAttribute("aria-valuetext",`Lightness ${(L*100).toFixed(0)}%, chroma ${c.toFixed(3)}`);
  const Y=lum(lin.map(v=>Math.min(1,Math.max(0,v)))),cw=ratio(Y,1),cb=ratio(Y,lum([0.0056,0.0056,0.0056]));
  root.style.setProperty("--c",hex);root.style.setProperty("--on",cw>cb?"#fff":"#111");
  const s={oklch:`oklch(${(L*100).toFixed(1)}% ${c.toFixed(3)} ${H.toFixed(1)})`,hex,rgb:`rgb(${rgb.join(" ")})`};for(const k in s)root.querySelector(`[data-o=${k}]`).textContent=s[k];
  const badge=r=>[["AA",4.5],["AAA",7],["AA large",3]].map(([n,t])=>`<em class="${r>=t?"p":"f"}">${r>=t?"✓":"✕"} ${n}</em>`).join("");
  root.querySelector("[data-o=cw]").textContent=cw.toFixed(2)+":1";root.querySelector("[data-o=cb]").textContent=cb.toFixed(2)+":1";
  root.querySelector("[data-o=bw]").innerHTML=badge(cw);root.querySelector("[data-o=bb]").innerHTML=badge(cb);
  root.querySelector("[data-o=gam]").textContent=c<C-.003?"Clamped to sRGB":""}
const drag=(el,fn)=>{let on=false;el.addEventListener("pointerdown",e=>{on=true;el.setPointerCapture(e.pointerId);fn(e)});el.addEventListener("pointermove",e=>on&&fn(e));el.addEventListener("pointerup",()=>on=false)};
drag(area,e=>{const r=area.getBoundingClientRect();C=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*MAXC;L=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));update()});
let hT;drag(hue,e=>{const r=hue.getBoundingClientRect();H=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*360;update();clearTimeout(hT);hT=setTimeout(()=>update(true),16)});
area.addEventListener("keydown",e=>{const s=e.shiftKey?.05:.01;({ArrowUp:()=>L=Math.min(1,L+s),ArrowDown:()=>L=Math.max(0,L-s),ArrowRight:()=>C=Math.min(MAXC,C+s*.37),ArrowLeft:()=>C=Math.max(0,C-s*.37)}[e.key]||(()=>0))();if(e.key.startsWith("Arrow")){e.preventDefault();update()}});
hue.addEventListener("keydown",e=>{const s=e.shiftKey?15:1,d={ArrowRight:s,ArrowUp:s,ArrowLeft:-s,ArrowDown:-s}[e.key];if(d){e.preventDefault();H=(H+d+360)%360;update(true)}});
root.querySelectorAll(".ok3-v button").forEach(b=>b.onclick=async()=>{const t=b.previousElementSibling.textContent;try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove()}
  b.textContent="Copied";live.textContent="Copied "+t;setTimeout(()=>b.textContent="Copy",1400)});
update(true);
})();
</script>

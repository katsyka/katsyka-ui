<style>
.lvl{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:#e4ddd0;background-image:radial-gradient(#00000008 1px,#0000 1.5px);background-size:6px 6px;font-family:Geist,system-ui,sans-serif;color:#2a251e;overflow:hidden;user-select:none;-webkit-user-select:none}
.lvl-in{display:flex;flex-direction:column;align-items:center;gap:20px}
.lvl-hang{position:relative;width:min(380px,80vw);padding-top:90px;transform-origin:50% 0;cursor:grab;touch-action:none}
.lvl-hang:active{cursor:grabbing}
.lvl-hang:focus-visible{outline:none}.lvl-hang:focus-visible .lvl-frame{outline:2px solid #1d4ed8;outline-offset:6px}
.lvl-nail{position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d4d4d8,#52525b);z-index:2}
.lvl-str{position:absolute;left:12%;top:0;width:76%;height:92px;pointer-events:none}
.lvl-frame{position:relative;padding:16px;background:linear-gradient(135deg,#3d2a1c,#6b4a31 50%,#3d2a1c);box-shadow:0 26px 36px -20px #0007,inset 0 0 0 1px #00000040}
.lvl-pic{aspect-ratio:4/3;background:radial-gradient(circle at 70% 34%,#fff3c4 0 7%,#0000 7.5%),linear-gradient(170deg,#0000 58%,#5b7f5f 58.2% 70%,#0000 70.2%),linear-gradient(185deg,#0000 64%,#3f6146 64.2%),linear-gradient(#f0b97a,#f6d9ae 55%,#c9d6c5 56%);box-shadow:inset 0 0 0 10px #f4efe4,inset 0 0 0 11px #0000001a}
.lvl-vial{position:absolute;left:50%;top:-14px;width:120px;height:20px;margin-left:-60px;border-radius:10px;background:linear-gradient(#e0e7a0,#b9c95a);box-shadow:inset 0 0 0 2px #ffffff80,0 0 0 3px #2c2c30,0 4px 6px -2px #0006;overflow:hidden}
.lvl-vial::before,.lvl-vial::after{content:"";position:absolute;top:2px;bottom:2px;width:1.5px;background:#2c2c30;left:calc(50% - 15px)}
.lvl-vial::after{left:calc(50% + 14px)}
.lvl-bub{position:absolute;left:50%;top:3px;width:26px;height:14px;margin-left:-13px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#ffffffee,#f6fbd6aa 60%,#d8e48a66)}
.lvl-read{font:500 28px/1 "Geist Mono",monospace;font-variant-numeric:tabular-nums}
.lvl.ok .lvl-read{color:#15803d}
.lvl-st{font-size:14px;color:#6d6457;min-height:21px}
.lvl-row button{height:40px;padding:0 16px;border-radius:999px;border:1px solid #2a251e33;background:#f6f1e7;color:#2a251e;font:500 13px Geist,system-ui,sans-serif;cursor:pointer}
.lvl-row button:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}
</style>
<section class="lvl">
  <div class="lvl-in">
    <div class="lvl-hang" tabindex="0" role="slider" aria-label="Picture tilt" aria-valuemin="-20" aria-valuemax="20">
      <span class="lvl-nail"></span>
      <svg class="lvl-str" viewBox="0 0 100 92" preserveAspectRatio="none" aria-hidden="true"><path d="M0 92 L50 0 L100 92" fill="none" stroke="#3a3530" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
      <div class="lvl-frame"><div class="lvl-vial" aria-hidden="true"><i class="lvl-bub"></i></div><div class="lvl-pic"></div></div>
    </div>
    <div class="lvl-read">6.8°</div>
    <div class="lvl-st" aria-live="polite">It's crooked. Drag the frame (or use ←→) until the bubble sits between the lines.</div>
    <div class="lvl-row"><button class="lvl-bump">Bump the wall</button></div>
  </div>
</section>
<script>
(()=>{
const R=document.querySelector(".lvl"),hang=R.querySelector(".lvl-hang"),bub=R.querySelector(".lvl-bub"),read=R.querySelector(".lvl-read"),st=R.querySelector(".lvl-st");
let a=6.8,v=0,rest=6.8,drag=null,wasOk=false;
const say=()=>{const ok=Math.abs(rest)<.25&&!drag;R.classList.toggle("ok",ok);
  if(ok&&!wasOk){st.textContent="Level. That's straight.";rest=0}else if(!ok&&wasOk)st.textContent="Off again. Drag it back.";wasOk=ok;
  hang.setAttribute("aria-valuenow",a.toFixed(1));hang.setAttribute("aria-valuetext",ok?"level":`${Math.abs(a).toFixed(1)} degrees ${a>0?"clockwise":"counter-clockwise"}`)};
hang.addEventListener("pointerdown",e=>{const r=hang.getBoundingClientRect();drag={x:e.clientX,a:rest,cx:r.left+r.width/2};hang.setPointerCapture(e.pointerId)});
hang.addEventListener("pointermove",e=>{if(!drag)return;rest=Math.max(-20,Math.min(20,drag.a+(e.clientX-drag.x)*.08))});
const up=()=>{if(!drag)return;drag=null;v+=(rest-a)*.5;say()};hang.addEventListener("pointerup",up);hang.addEventListener("pointercancel",up);
hang.addEventListener("keydown",e=>{const d={ArrowLeft:-.1,ArrowRight:.1,ArrowDown:-.1,ArrowUp:.1}[e.key];if(d!==undefined){e.preventDefault();rest=Math.round((rest+d*(e.shiftKey?10:1))*10)/10;say()}});
R.querySelector(".lvl-bump").onclick=()=>{rest=(Math.random()<.5?-1:1)*(3+Math.random()*8);v+=rest>0?-6:6;say()};
// hanging frame = damped pendulum around its resting angle
(function loop(){requestAnimationFrame(loop);v+=(rest-a)*(drag?.35:.06);v*=drag?.5:.9;a+=v;
  hang.style.transform=`rotate(${a.toFixed(3)}deg)`;bub.style.transform=`translateX(${Math.max(-44,Math.min(44,-a*7)).toFixed(1)}px)`;
  read.textContent=Math.abs(a)<.05?"0.0°":`${a>0?"":"−"}${Math.abs(a).toFixed(1)}°`;say()})();
})();
</script>

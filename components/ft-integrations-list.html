<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}

.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}

.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}

.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.il{width:min(900px,100%);display:grid;gap:20px}.il-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.il-h h2{margin:0;font-size:clamp(26px,3.6vw,36px);letter-spacing:-.03em;max-width:16ch;line-height:1.1}.il-s{display:flex;gap:8px;align-items:center;height:40px;padding:0 12px;border:1px solid var(--ctl);border-radius:10px;color:var(--mu);background:var(--bg);min-width:240px}.il-s input{border:0;outline:0;background:none;flex:1;font-size:15px;color:var(--fg);min-width:0}
.il-g{display:grid;grid-template-columns:180px 1fr;gap:32px}.il-c{display:grid;gap:2px;align-content:start}.il-c button{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--mu);text-align:left}.il-c button:hover{background:var(--sf)}.il-c [aria-current=true]{background:var(--sf2);color:var(--fg);font-weight:550}.il-c span{font-variant-numeric:tabular-nums}
.il-l{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-content:start}.il-l li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 0;border-top:1px solid var(--line)}.il-l b{font-size:15px}.il-l small{grid-column:1;font-size:13px;color:var(--mu)}.il-l .d{grid-row:1/3;grid-column:2;align-self:center;color:var(--mu);font:12px 'Geist Mono',monospace}.il-l .em{grid-column:1/-1;color:var(--mu);border:0}
@media (max-width:700px){.il-g{grid-template-columns:1fr}.il-c{display:flex;overflow-x:auto;gap:4px}.il-c button{white-space:nowrap;gap:6px}.il-l{grid-template-columns:1fr}}
</style>
<div class="k"><section class="il"><div class="il-h"><h2>Works with what you already use</h2><label class="il-s"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search 40+ integrations" aria-label="Search integrations"></label></div><div class="il-g"><nav class="il-c" id="c" aria-label="Categories"></nav><ul class="il-l" id="l"></ul></div></section></div>
<script>
const I=[["Slack","Chat","Post updates and approve from a message","→"],["Microsoft Teams","Chat","Notifications in channels","→"],["GitHub","Dev","Link commits and pull requests","⇄"],["GitLab","Dev","Merge request status on tasks","⇄"],["Linear","Dev","Two-way issue sync","⇄"],["Figma","Design","Embed frames that stay current","←"],["Google Drive","Files","Attach and preview documents","←"],["Dropbox","Files","Attach files from any folder","←"],["Google Calendar","Calendar","Due dates on your calendar","⇄"],["Outlook Calendar","Calendar","Due dates on your calendar","⇄"],["Stripe","Billing","Invoices marked paid automatically","←"],["Xero","Billing","Sync invoices and contacts","⇄"],["Zapier","Automation","Connect 6,000 other apps","⇄"],["Webhooks","Automation","Send events to your own server","→"]];let cat='All';const q=document.getElementById('q');
function draw(){const v=q.value.toLowerCase(),M=I.filter(i=>!v||(i[0]+i[2]).toLowerCase().includes(v)),C=['All',...new Set(I.map(i=>i[1]))];document.getElementById('c').innerHTML=C.map(c=>`<button aria-current="${c===cat}" data-c="${c}">${c}<span>${c==='All'?M.length:M.filter(i=>i[1]===c).length}</span></button>`).join('');const L=M.filter(i=>cat==='All'||i[1]===cat);
document.getElementById('l').innerHTML=L.length?L.map(([n,,d,s])=>`<li><b>${n}</b><small>${d}</small><span class="d" title="${s==='⇄'?'Two-way sync':s==='→'?'Sends data to '+n:'Reads data from '+n}">${s}</span></li>`).join(''):`<li class="em">No integration called “${q.value.replace(/</g,'&lt;')}” yet. <a href="#">Request it</a> or use Webhooks.</li>`}
document.getElementById('c').onclick=e=>{const b=e.target.closest('button');if(b){cat=b.dataset.c;draw()}};q.oninput=draw;draw();
</script>

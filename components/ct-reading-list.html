<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.rl2{width:min(520px,100%);display:grid;gap:12px}.rl2-h{display:flex;justify-content:space-between;align-items:baseline}.rl2-h h1{margin:0;font-size:22px;letter-spacing:-.02em}.rl2-h span{font-size:13px}.rl2-bar{height:4px;border-radius:2px;background:var(--sf2);overflow:hidden}.rl2-bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s cubic-bezier(.23,1,.32,1)}
.rl2-l{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.rl2-l li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);transition:background .2s}.rl2-l li:first-child{border:0}.rl2-l li.dr{background:var(--sf);opacity:.7}.rl2-l li.ov{box-shadow:inset 0 2px 0 var(--ac)}
.rl2-l input{width:20px;height:20px;accent-color:var(--ok)}.rl2-l div{display:grid;gap:2px;min-width:0}.rl2-l b{font-size:15px;font-weight:550}.rl2-l small{font-size:12px;color:var(--mu)}.rl2-l .dn b{text-decoration:line-through;color:var(--mu)}.rl2-l .mv{display:flex;gap:2px}.rl2-l .mv button{width:30px;height:30px;border-radius:6px;color:var(--mu);display:grid;place-items:center}.rl2-l .mv button:hover{background:var(--sf2);color:var(--fg)}.rl2-l .mv .i{width:14px;height:14px}.rl2-l .hd{cursor:grab;touch-action:none}
#cl{justify-self:start}
</style>
<div class="k"><div class="rl2"><div class="rl2-h"><h1>Reading list</h1><span class="mu tn" id="tt"></span></div><div class="rl2-bar"><i id="br"></i></div><ol class="rl2-l" id="l"></ol><button class="b gh sm" id="cl">Clear finished</button></div></div>
<script>
let R=[["The castle that taught us about caching","fieldnotes.example",12,0],["Kerning is a conversation","type.example",8,1],["A field guide to accessible colour","quill.example",14,0],["Debugging a memory leak with heap snapshots","shipit.dev",11,0],["Cobblestones are a technology","fieldnotes.example",6,0]];const l=document.getElementById('l');
function draw(f){const left=R.filter(r=>!r[3]).reduce((a,r)=>a+r[2],0),done=R.filter(r=>r[3]).length;document.getElementById('tt').textContent=`${left} min left · ${done}/${R.length} read`;document.getElementById('br').style.width=(R.length?done/R.length*100:0)+'%';
l.innerHTML=R.map(([t,s,m,d],i)=>`<li class="${d?'dn':''}" data-i="${i}"><input type="checkbox" ${d?'checked':''} aria-label="Mark “${t}” as read" data-c="${i}"><div><b>${t}</b><small>${s} · ${m} min</small></div><span class="mv"><button data-u="${i}" aria-label="Move up" ${i?'':'disabled'}><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button><button data-d="${i}" aria-label="Move down" ${i<R.length-1?'':'disabled'}><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button class="hd" data-h="${i}" aria-label="Drag to reorder"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button></span></li>`).join('');if(f)l.querySelector(f)?.focus()}
l.onchange=e=>{const i=+e.target.dataset.c;R[i][3]=e.target.checked?1:0;draw(`[data-c="${i}"]`)};
l.onclick=e=>{const u=e.target.closest('[data-u]'),d=e.target.closest('[data-d]');if(u){const i=+u.dataset.u;[R[i-1],R[i]]=[R[i],R[i-1]];draw(`[data-u="${i-1}"]`)}if(d){const i=+d.dataset.d;[R[i+1],R[i]]=[R[i],R[i+1]];draw(`[data-d="${i+1}"]`)}};
let dg=null;l.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-h]');if(!h)return;dg=+h.dataset.h;h.setPointerCapture(e.pointerId);l.children[dg].classList.add('dr')});
l.addEventListener('pointermove',e=>{if(dg==null)return;const li=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.parentElement===l);[...l.children].forEach(x=>x.classList.toggle('ov',x===li&&+li.dataset.i!==dg))});
l.addEventListener('pointerup',()=>{if(dg==null)return;const t=l.querySelector('.ov');if(t){const to=+t.dataset.i,it=R.splice(dg,1)[0];R.splice(to,0,it)}dg=null;draw()});
document.getElementById('cl').onclick=()=>{R=R.filter(r=>!r[3]);draw()};draw();
</script>

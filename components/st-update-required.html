<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.ur-w{width:min(420px,100%);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--bg);display:grid;gap:12px}.ur-v{display:flex;gap:8px;align-items:center;font:13px 'Geist Mono',monospace;color:var(--mu)}.ur-v b{color:var(--ac)}.ur-w h1{margin:0;font-size:22px;letter-spacing:-.02em}
.ur-w ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}.ur-sz{font-size:13px;margin:0}
.ur-pr{display:flex;gap:10px;align-items:center}.ur-pr div{flex:1;height:8px;border-radius:4px;background:var(--sf2);overflow:hidden}.ur-pr i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s linear}.ur-pr span{font-size:13px;width:36px;text-align:right}
.ur-ac{display:flex;gap:8px}.ur-ac .b{height:44px;flex:1}.ur-m{font-size:13px;margin:0}.ur-m:empty{display:none}
</style>
<div class="k ur"><main class="ur-w" role="dialog" aria-labelledby="ut"><div class="ur-v tn"><span>4.2.1</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M5 12h14M13 6l6 6-6 6"/></svg><b>4.3.0</b></div><h1 id="ut">An update is ready</h1><ul><li><b>Offline drafts.</b> Write on the train, it syncs later.</li><li><b>Faster search.</b> Results show as you type.</li><li><b>Fixes</b> the crash when attaching HEIC photos.</li></ul><p class="mu ur-sz">38 MB · about 20 seconds on this connection. You'll stay signed in.</p>
<div class="ur-pr" id="pr" hidden><div><i id="pi"></i></div><span class="tn" id="pt">0%</span></div><div class="ur-ac" id="ac"><button class="b ac" id="up">Update now</button><button class="b gh" id="lt">Tonight at 02:00</button></div><p class="ur-m mu" id="m" role="status"></p></main></div>
<script>
const $=i=>document.getElementById(i);
$('up').onclick=()=>{$('ac').hidden=true;$('pr').hidden=false;let p=0;const t=setInterval(()=>{p=Math.min(100,p+Math.random()*9+3);$('pi').style.width=p+'%';$('pt').textContent=Math.round(p)+'%';if(p>=100){clearInterval(t);$('m').textContent='Installed. Restarting…';setTimeout(()=>{document.querySelector('.ur-w h1').textContent='You\'re on 4.3.0';$('pr').hidden=true;$('m').textContent='Your drafts and settings are where you left them.'},1000)}},180)};
$('lt').onclick=()=>{$('ac').hidden=true;$('m').innerHTML='We\'ll update tonight at 02:00 if your device is charging. <button id="u" style="text-decoration:underline;font-weight:600">Update now instead</button>';$('u').onclick=()=>{$('m').textContent='';$('up').click()}};
</script>

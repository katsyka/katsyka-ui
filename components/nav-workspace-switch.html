<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.ws{width:240px;position:relative;align-self:start;margin-top:32px}.ws-t{width:100%;display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;text-align:left}.ws-t:hover,.ws-t[aria-expanded=true]{background:var(--bg);box-shadow:0 0 0 1px var(--line)}.ws-n{display:grid;flex:1;min-width:0}.ws-n b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ws-n small{font-size:12px}
.ws-lg{width:32px;height:32px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:750;flex:none;font-size:14px}
.ws-m{position:absolute;top:56px;left:0;width:280px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:5;box-shadow:0 12px 28px -12px #0004;transform-origin:top left;animation:wsm .16s cubic-bezier(.23,1,.32,1)}@keyframes wsm{from{opacity:0;transform:scale(.97)}}
.ws-s{display:flex;gap:6px;align-items:center;height:34px;padding:0 8px;margin-bottom:4px;border-bottom:1px solid var(--line);color:var(--mu)}.ws-s input{border:0;outline:0;background:none;flex:1;font-size:14px;color:var(--fg)}
.ws-h{font-size:11px;color:var(--mu);font-weight:650;padding:8px 8px 4px;text-transform:uppercase;letter-spacing:.05em}#l button{width:100%;display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;text-align:left;font-size:14px}#l button:hover,#l button:focus-visible{background:var(--sf)}#l .ws-lg{width:24px;height:24px;font-size:11px;border-radius:6px}#l kbd{margin-left:auto;font:11px 'Geist Mono',monospace;color:var(--mu)}#l [aria-checked=true]::after{content:"✓";color:var(--ac);margin-left:6px}
.ws-f{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}.ws-f button{width:100%;display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;font-size:14px;color:var(--mu)}.ws-f button:hover{background:var(--sf);color:var(--fg)}
</style>
<div class="k"><div class="ws"><button class="ws-t" id="t" aria-haspopup="menu" aria-expanded="false"><span class="ws-lg" id="lg"></span><span class="ws-n"><b id="nm"></b><small class="mu" id="pl"></small></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m6 9 6 6 6-6"/></svg></button><div class="ws-m" id="m" role="menu" hidden><label class="ws-s"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Find workspace" aria-label="Find workspace"></label><div id="l"></div><div class="ws-f"><button role="menuitem"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M12 5v14M5 12h14"/></svg>Create workspace</button><button role="menuitem"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/></svg>Join with invite code</button></div></div></div></div>
<script>
let W=[["Northwind Design","Team · 14 members","#0f766e"],["Kestrel Labs","Business · 42 members","#7c3aed"],["Personal","Free","#64748b"],["Fjordline","Team · 8 members","#be123c"],["Night Owl Press","Free","#b45309"]],cur=0,rec=[0,1,2];const $=i=>document.getElementById(i);
function head(){const [n,p,c]=W[cur];$('lg').textContent=n[0];$('lg').style.setProperty('--c',c);$('nm').textContent=n;$('pl').textContent=p}
function list(){const v=$('q').value.toLowerCase(),M=W.map((w,i)=>[w,i]).filter(([w])=>w[0].toLowerCase().includes(v));const R=v?[]:rec.map(i=>[W[i],i]),O=v?M:M.filter(([,i])=>!rec.includes(i));const it=([w,i])=>`<button role="menuitemradio" aria-checked="${i===cur}" data-i="${i}"><span class="ws-lg" style="--c:${w[2]}">${w[0][0]}</span>${w[0]}<kbd>⌘${i+1}</kbd></button>`;$('l').innerHTML=(R.length?'<div class="ws-h">Recent</div>'+R.map(it).join(''):'')+(O.length?`<div class="ws-h">${v?'Results':'All workspaces'}</div>`+O.map(it).join(''):'<p class="mu" style="font-size:13px;padding:8px;margin:0">No match.</p>')}
function pick(i){cur=i;rec=[i,...rec.filter(x=>x!==i)].slice(0,3);head();close()}
const open=()=>{$('m').hidden=false;$('t').setAttribute('aria-expanded',true);$('q').value='';list();$('q').focus()},close=()=>{$('m').hidden=true;$('t').setAttribute('aria-expanded',false)};
$('t').onclick=()=>$('m').hidden?open():close();$('l').onclick=e=>{const b=e.target.closest('[data-i]');if(b)pick(+b.dataset.i)};$('q').oninput=list;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&/^[1-9]$/.test(e.key)&&W[e.key-1]){e.preventDefault();pick(e.key-1)}if(e.key==='Escape'&&!$('m').hidden){close();$('t').focus()}});document.addEventListener('pointerdown',e=>{if(!$('m').hidden&&!e.target.closest('.ws'))close()});head();
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}


.k.pg{display:block;place-items:normal;padding:0;background:var(--bg);font-size:16px;min-height:0}
.pg .w{width:min(1180px,100% - 32px);margin-inline:auto;min-width:0}
.pg{overflow-x:clip}
.pg img{display:block;max-width:100%}
.pg h1,.pg h2,.pg h3,.pg p{margin:0}
.pg .ser{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.pg .h1{font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:-.035em;font-weight:650;text-wrap:balance}
.pg .h2{font-size:clamp(30px,4.4vw,52px);line-height:1.05;letter-spacing:-.03em;font-weight:620;text-wrap:balance}
.pg .h3{font-size:19px;line-height:1.3;font-weight:620;letter-spacing:-.01em}
.pg .lead{font-size:clamp(17px,1.6vw,20px);line-height:1.5;color:var(--mu);text-wrap:pretty;max-width:60ch}
.pg .eb{font:500 12px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pg .sec{padding:clamp(64px,10vw,128px) 0}
.pg .b.lg{height:48px;padding:0 22px;font-size:15px;border-radius:12px}
.pg .ph{width:100%;height:100%;object-fit:cover}
.pg .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pg .top .w{display:flex;align-items:center;gap:24px;height:64px}
.pg .logo{white-space:nowrap;font-weight:700;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.pg .links{display:flex;gap:24px;margin-left:auto;font-size:14px}.pg .links a{color:var(--mu);text-decoration:none}.pg .links a:hover{color:var(--fg)}
.pg .menu{display:none;margin-left:auto;width:44px;height:44px;place-items:center;border-radius:10px}
.pg .foot{border-top:1px solid var(--line);padding:32px 0;font-size:13px;color:var(--mu)}.pg .foot .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:760px){.pg .links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}.pg .links a{padding:12px 0;font-size:16px}.pg .top.open .links{display:flex}.pg .menu{display:grid}.pg .top .b{display:none}}
.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.lk{--ac:light-dark(#7c2d12,#fdba74);--ac-h:light-dark(#5c210d,#fed7aa);--ac-fg:light-dark(#fff,#2b1105)}
.lk-y{font-family:'Geist Mono',monospace;font-weight:500;color:var(--ac)}
.lk-hero{padding:80px 0 64px;display:grid;gap:28px}.lk-meta{display:flex;gap:24px;flex-wrap:wrap;color:var(--mu)}.lk-meta span{display:flex;gap:8px;align-items:center}
.lk-cd{display:flex;gap:12px;flex-wrap:wrap}.lk-cd div{min-width:96px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}.lk-cd b{font:600 clamp(28px,4vw,44px)/1 Geist,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.lk-cd span{font-size:12px;color:var(--mu)}
.lk-sch{background:var(--sf)}.lk-sh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.lk-f{display:flex;gap:6px;flex-wrap:wrap}.lk-f button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:550}.lk-f [aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.lk-f span{opacity:.7}
.lk-list{list-style:none;padding:0;margin:32px 0 0;display:grid;gap:8px}.lk-list li{display:grid;grid-template-columns:72px 1fr auto auto;gap:16px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 20px;animation:lkf .3s var(--ease) both}.lk-list time{font:500 14px 'Geist Mono',monospace}.lk-list div{display:grid;gap:2px}.lk-list .pill{white-space:nowrap}.lk-list .br{background:transparent;border:0;grid-column:2/-1;padding:4px 20px;color:var(--mu);font-size:13px}
.lk-star{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--mu)}.lk-star[aria-pressed=true]{color:var(--ac)}.lk-star[aria-pressed=true] .i{fill:currentColor}
@keyframes lkf{from{opacity:0;transform:translateY(6px)}}
.lk-sp{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:32px}.lk-sp figure{margin:0;display:grid;gap:12px}.lk-sp img{aspect-ratio:3/4;object-fit:cover;border-radius:12px;width:100%;filter:grayscale(1) contrast(1.05);transition:filter .3s}.lk-sp figure:hover img{filter:none}.lk-sp figcaption{display:grid;gap:2px}
@media (max-width:760px){.lk-list li{grid-template-columns:56px 1fr auto}.lk-list .pill{display:none}.lk-sp{grid-template-columns:1fr 1fr}.lk-cd div{min-width:0;flex:1}}
</style>
<div class="k pg lk">
<header class="top"><div class="w"><a class="logo" href="#">Edgecase <span class="lk-y">2027</span></a><nav class="links"><a href="#">Schedule</a><a href="#">Speakers</a><a href="#">Venue</a></nav><a class="b ac" href="#">Get a ticket</a><button class="menu ibt" aria-label="Menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button></div></header>
<section class="w lk-hero"><h1 class="h1">Two days about<br>the weird parts of the web.</h1><div class="lk-meta"><span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> 22–23 April 2027</span><span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg> Kulturhuset, Stockholm</span></div><div class="lk-cd" id="cd" aria-label="Time until the conference"></div></section>
<section class="sec lk-sch"><div class="w"><div class="lk-sh"><h2 class="h2">Day one</h2><div class="lk-f" role="group" aria-label="Filter track"><button aria-pressed="true" data-t="">All</button><button aria-pressed="false" data-t="a">Main stage</button><button aria-pressed="false" data-t="b">Workshop room</button><button aria-pressed="false" data-t="my">My day <span id="mc">0</span></button></div></div><ol class="lk-list" id="sl"></ol></div></section>
<section class="sec w"><h2 class="h2">Speakers</h2><div class="lk-sp"><figure><img src="media/pics/c/1014.jpg" alt=""><figcaption><b>Ines Aldana</b><span class="mu">Browser engine engineer</span></figcaption></figure><figure><img src="media/pics/c/1012.jpg" alt=""><figcaption><b>Tomas Reuter</b><span class="mu">Accessibility lead</span></figcaption></figure><figure><img src="media/pics/c/1006.jpg" alt=""><figcaption><b>Priya Nand</b><span class="mu">Font tooling author</span></figcaption></figure><figure><img src="media/pics/c/1083.jpg" alt=""><figcaption><b>Ola Bergkvist</b><span class="mu">Creative coder</span></figcaption></figure></div></section>
<footer class="foot"><div class="w"><span>Edgecase is demo content.</span><span>Code of conduct</span></div></footer>
</div>
<script>
document.querySelectorAll('.pg .menu').forEach(m=>m.addEventListener('click',()=>{const t=m.closest('.top');const o=t.classList.toggle('open');m.setAttribute('aria-expanded',o)}));
const S=[["09:00","Doors, coffee, badges","",""],["09:40","The DOM is a database, and that's fine","Ines Aldana","a"],["10:30","Hands-on: variable fonts from scratch","Priya Nand","b"],["11:20","Focus order is a design decision","Tomas Reuter","a"],["12:10","Lunch","",""],["13:30","Plotters, pens and canvas","Ola Bergkvist","b"],["14:20","What we learned shipping CSS anchor positioning","Ines Aldana","a"],["15:10","Workshop: screen-reader testing in 40 minutes","Tomas Reuter","b"]];
const my=new Set(),sl=document.getElementById('sl');let f='';
function draw(){sl.innerHTML=S.map((s,i)=>[s,i]).filter(([s,i])=>!s[3]?!f:f==='my'?my.has(i):!f||s[3]===f).map(([[t,ti,sp,tr],i])=>tr?`<li><time>${t}</time><div><b>${ti}</b><span class="mu">${sp}</span></div><span class="pill${tr==='a'?' info':''}">${tr==='a'?'Main stage':'Workshop'}</span><button class="lk-star" data-i="${i}" aria-pressed="${my.has(i)}" aria-label="Add to my day"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></button></li>`:`<li class="br"><time>${t}</time>${ti}</li>`).join('')||'<li class="br">Star talks to build your day.</li>';document.getElementById('mc').textContent=my.size}
sl.onclick=e=>{const b=e.target.closest('.lk-star');if(!b)return;const i=+b.dataset.i;my.has(i)?my.delete(i):my.add(i);draw()};
document.querySelectorAll('.lk-f button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lk-f button').forEach(x=>x.setAttribute('aria-pressed',x===b));f=b.dataset.t;draw()});draw();
const end=new Date('2027-04-22T09:00:00+02:00'),cd=document.getElementById('cd');function tick(){let s=Math.max(0,(end-Date.now())/1e3);const u=[['days',86400],['hours',3600],['min',60],['sec',1]].map(([n,v])=>{const x=Math.floor(s/v);s-=x*v;return `<div><b>${String(x).padStart(2,'0')}</b><span>${n}</span></div>`});cd.innerHTML=u.join('')}tick();setInterval(tick,1000);
</script>

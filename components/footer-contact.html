<style>
.fc-page{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;background:#0d0d0d}
.fc{background:#0d0d0d;color:#f5f5f5;padding:80px clamp(16px,4vw,24px) 24px;overflow:hidden}
.fc-in{max-width:1280px;margin:0 auto}
.fc-up{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:48px;margin-bottom:84px}
.fc-eye,.fc h4{font:500 12px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.12em;color:#8a8a8a;margin:0 0 18px}
.fc-cta{font-size:clamp(24px,3.2vw,38px);font-weight:500;letter-spacing:-.03em;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:12px;padding-bottom:8px;background:linear-gradient(#fff,#fff) 0 100%/100% 1px no-repeat,linear-gradient(#ffffff40,#ffffff40) 0 100%/100% 1px no-repeat;transition:color .2s}
.fc-cta svg{transition:transform .25s ease-out}
.fc-cta:hover svg{transform:translate(3px,-3px)}
.fc-copy{display:inline-flex;align-items:center;gap:8px;margin-top:18px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #ffffff29;background:none;color:#d4d4d4;font:13px Geist,sans-serif;cursor:pointer;transition:background .2s,color .2s,transform .1s}
.fc-copy:hover{background:#ffffff12}.fc-copy:active{transform:scale(.97)}
.fc-copy.ok{color:#0d0d0d;background:#f5f5f5}
.fc p{font-size:15px;line-height:1.7;color:#d4d4d4;margin:0}
.fc-pills{display:flex;flex-wrap:wrap;gap:10px}
.fc-pill{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid #ffffff29;color:#f5f5f5;text-decoration:none;font-size:13px;transition:background .2s,color .2s}
.fc-pill:hover{background:#fff;color:#0d0d0d}
.fc a:focus-visible,.fc button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.fc-word{font-size:clamp(54px,13.5vw,186px);font-weight:800;letter-spacing:-.05em;line-height:.86;color:#1c1c1c;user-select:none;text-align:center;margin:0 0 28px;white-space:nowrap}
.fc-bot{display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid #262626;font-size:12px;color:#8a8a8a;flex-wrap:wrap;gap:12px}
.fc-bot nav{display:flex;gap:24px}.fc-bot a{color:#8a8a8a;text-decoration:none}.fc-bot a:hover{color:#fff}
.fc-time{font-variant-numeric:tabular-nums}
@media(max-width:860px){.fc-up{grid-template-columns:1fr;gap:40px;margin-bottom:56px}.fc{padding-top:56px}}
</style>
<div class="fc-page">
<footer class="fc">
  <div class="fc-in">
    <div class="fc-up">
      <div>
        <p class="fc-eye">Start a conversation</p>
        <a href="mailto:hello@monolith.studio" class="fc-cta">hello@monolith.studio<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 17L17 7M7 7h10v10"/></svg></a>
        <div><button type="button" class="fc-copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg><span>Copy address</span></button></div>
      </div>
      <div><h4>Studio</h4><p>42 Redchurch Street<br>Shoreditch, London<br><span class="fc-time">--:--</span> local time</p></div>
      <div><h4>Elsewhere</h4><div class="fc-pills"><a href="#" class="fc-pill">Dribbble</a><a href="#" class="fc-pill">Behance</a><a href="#" class="fc-pill">Instagram</a><a href="#" class="fc-pill">LinkedIn</a></div></div>
    </div>
    <div class="fc-word" aria-hidden="true">MONOLITH</div>
    <div class="fc-bot">
      <span>&copy; 2026 Monolith Studio Ltd.</span>
      <nav aria-label="Footer"><a href="#">Work</a><a href="#">Capabilities</a><a href="#">Privacy</a></nav>
    </div>
  </div>
</footer>
</div>
<script>
(()=>{
  const t=document.querySelector('.fc-time');
  const tick=()=>{t.textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}).format(new Date())};
  tick();setInterval(tick,15000);
  const b=document.querySelector('.fc-copy'),l=b.querySelector('span'),addr='hello@monolith.studio';
  const fallback=()=>{const a=document.createElement('textarea');a.value=addr;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
  b.addEventListener('click',()=>{
    const done=()=>{b.classList.add('ok');l.textContent='Copied';setTimeout(()=>{b.classList.remove('ok');l.textContent='Copy address'},1600)};
    if(navigator.clipboard)navigator.clipboard.writeText(addr).then(done).catch(()=>{fallback();done()});else{fallback();done()}
  });
})();
</script>

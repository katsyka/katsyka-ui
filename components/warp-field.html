<style>
.wf{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#020205;color:#eef0ff;cursor:crosshair;user-select:none}
.wf canvas{position:absolute;inset:0;width:100%;height:100%}
.wf-in{position:relative;text-align:center;pointer-events:none;transition:opacity .6s,transform .8s cubic-bezier(.6,0,.2,1)}
.wf.jump .wf-in{opacity:.15;transform:scale(.92)}
.wf-eye{font:500 11px "Geist Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:#8d93c9}
.wf h1{font-size:clamp(44px,8vw,120px);line-height:.9;letter-spacing:-.06em;font-weight:600;margin:20px 0}
.wf h1 em{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-.02em;color:#c6ccff}
.wf p{color:#9aa0c8;font-size:17px;margin:0 auto;max-width:440px;line-height:1.5}
.wf-hud{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:space-between;padding:0 clamp(20px,4vw,48px);font:500 12px "Geist Mono",monospace;color:#5d6290;pointer-events:none}
.wf-hud b{color:#c6ccff;font-weight:500;font-variant-numeric:tabular-nums}
.wf-bar{position:absolute;left:50%;bottom:30px;width:180px;height:2px;margin-left:-90px;background:#ffffff14;border-radius:2px;overflow:hidden}
.wf-bar i{position:absolute;inset:0;background:linear-gradient(90deg,#6f7bff,#fff);transform-origin:left;transform:scaleX(var(--v,0))}
</style>
<section class="wf">
  <canvas></canvas>
  <div class="wf-in"><div class="wf-eye">Hold anywhere to jump</div><h1>Faster than it<br>has <em>any right</em> to be.</h1><p>Cold starts in 40 ms. Builds that finish before you switch tabs.</p></div>
  <div class="wf-hud"><span>VELOCITY <b data-v>0.08</b> c</span><span>SECTOR <b>7G-ALPHA</b></span></div>
  <div class="wf-bar"><i></i></div>
</section>
<script>
(()=>{
const root=document.querySelector(".wf"),c=root.querySelector("canvas"),x=c.getContext("2d"),vEl=root.querySelector("[data-v]"),bar=root.querySelector(".wf-bar");
let W,H,dpr=Math.min(devicePixelRatio,2),hold=false,speed=.08,cx=.5,cy=.5,tcx=.5,tcy=.5;
const fit=()=>{W=c.width=c.clientWidth*dpr;H=c.height=c.clientHeight*dpr};new ResizeObserver(fit).observe(c);fit();
const N=1400,S=[...Array(N)].map(()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random(),pz:0,h:Math.random()}));
S.forEach(s=>s.pz=s.z);
root.addEventListener("pointerdown",()=>{hold=true;root.classList.add("jump")});
addEventListener("pointerup",()=>{hold=false;root.classList.remove("jump")});
root.addEventListener("pointermove",e=>{const b=root.getBoundingClientRect();tcx=.5+((e.clientX-b.left)/b.width-.5)*.25;tcy=.5+((e.clientY-b.top)/b.height-.5)*.25});
(function f(){requestAnimationFrame(f);
  speed+=((hold?1:.08)-speed)*(hold?.025:.05);cx+=(tcx-cx)*.05;cy+=(tcy-cy)*.05;
  vEl.textContent=speed.toFixed(2);bar.style.setProperty("--v",speed);
  x.fillStyle=`rgba(2,2,5,${.55-speed*.35})`;x.fillRect(0,0,W,H);
  const ox=W*cx,oy=H*cy,F=Math.max(W,H)*.5,dz=.0022+speed*.03;
  for(const s of S){s.pz=s.z;s.z-=dz;if(s.z<=.002){s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;s.z=s.pz=1;continue}
    const sx=ox+s.x/s.z*F*.5,sy=oy+s.y/s.z*F*.5,px=ox+s.x/s.pz*F*.5,py=oy+s.y/s.pz*F*.5;
    if(sx<0||sx>W||sy<0||sy>H){s.z=0;continue}
    const k=1-s.z,hue=s.h<.15?28:s.h<.3?250:230;
    x.strokeStyle=`hsla(${hue},${s.h<.3?90:30}%,${70+k*25}%,${Math.min(1,k*1.4)})`;x.lineWidth=(.4+k*2.2)*dpr;
    x.beginPath();x.moveTo(px,py);x.lineTo(sx,sy);x.stroke()}
})();
})();
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.wh{align-items:start}.wh-w{width:min(720px,100%);display:grid;gap:16px}.wh-hd{display:flex;justify-content:space-between;align-items:center}.wh-hd h1{margin:0;font-size:24px;letter-spacing:-.02em}
.wh-ep,.wh-f{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:18px;display:grid;gap:10px}.wh-t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.wh-t code{font:600 14px 'Geist Mono',monospace;word-break:break-all}.wh-ep>p{margin:0;font-size:13px;font-family:'Geist Mono',monospace}.wh-ep h2,.wh-f h2{margin:8px 0 0;font-size:14px}
.wh-sec{padding:12px;border-radius:10px;background:var(--sf);display:grid;gap:6px}.wh-sec .lbl{margin:0}.wh-sr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.wh-sr code{font:13px 'Geist Mono',monospace;flex:1;min-width:200px;word-break:break-all}.wh-sec small{font-size:12px}
.wh-l{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.wh-l li{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}.wh-l li:first-child{border:0}.wh-l code{font:12px 'Geist Mono',monospace}.wh-l .c{font:600 12px 'Geist Mono',monospace;text-align:center;border-radius:6px;padding:2px 0}.wh-l .ok{background:var(--ok-sf);color:var(--ok)}.wh-l .no{background:var(--err-sf);color:var(--err)}.wh-l .ms{color:var(--mu);font-variant-numeric:tabular-nums}.wh-l .b{height:28px}
.wh-f .in{height:44px;font:14px 'Geist Mono',monospace}.wh-e{color:var(--err);font-size:13px}.wh-e:empty{display:none}.wh-f fieldset{border:0;margin:0;padding:0}.wh-ev{display:grid;grid-template-columns:1fr 1fr;gap:6px}.wh-ev label{display:flex;gap:8px;align-items:center;font:13px 'Geist Mono',monospace;min-height:32px}.wh-ev input{width:16px;height:16px;accent-color:var(--ac)}.wh-ac{display:flex;gap:8px;justify-content:flex-end}
</style>
<div class="k wh"><div class="wh-w"><div class="wh-hd"><h1>Webhooks</h1><button class="b ac sm" id="ad"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>Add endpoint</button></div>
<section class="wh-ep"><div class="wh-t"><code>https://api.northwind.example/hooks/quill</code><span class="pill ok">Enabled</span></div><p class="mu">order.created, order.paid, refund.created</p>
<div class="wh-sec"><span class="lbl">Signing secret</span><div class="wh-sr"><code id="sk">whsec_••••••••••••••••••••••</code><button class="b gh sm" id="rv" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Reveal</button><button class="b gh sm" id="rt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>Rotate</button></div><small class="mu" id="rm">Use it to verify the Quill-Signature header.</small></div>
<h2>Recent deliveries</h2><ul class="wh-l" id="l"></ul></section>
<form class="wh-f" id="f" hidden novalidate><h2>New endpoint</h2><label class="lbl" for="u">Endpoint URL</label><input class="in" id="u" type="url" placeholder="https://" aria-describedby="ue"><small class="wh-e" id="ue"></small><fieldset><legend class="lbl">Events</legend><div class="wh-ev"><label><input type="checkbox" checked>order.created</label><label><input type="checkbox">order.paid</label><label><input type="checkbox">order.refunded</label><label><input type="checkbox">customer.created</label></div></fieldset><div class="wh-ac"><button type="button" class="b gh" id="fc">Cancel</button><button class="b ac">Add endpoint</button></div></form></div></div>
<script>
const $=i=>document.getElementById(i);let SEC='whsec_8KdL2pQx7Vb3Nz5Rt1Ym4Hc9',shown=false;
const DV=[["order.paid",200,142],["order.created",200,98],["refund.created",500,3021],["order.created",200,110],["order.paid",410,88]];
const ago=i=>i?`${i*7} min ago`:'just now';
function draw(){$('l').innerHTML=DV.map(([e,c,ms],i)=>`<li><span class="c ${c<300?'ok':'no'}">${c}</span><code>${e}</code><span class="ms">${ms} ms · ${ago(i)}</span>${c>=300?`<button class="b sec sm" data-i="${i}">Redeliver</button>`:'<span></span>'}</li>`).join('')}draw();
$('l').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;b.disabled=true;b.textContent='Sending…';setTimeout(()=>{DV.unshift([DV[+b.dataset.i][0],200,121]);draw()},700)};
$('rv').onclick=e=>{shown=!shown;$('sk').textContent=shown?SEC:'whsec_••••••••••••••••••••••';e.currentTarget.setAttribute('aria-pressed',shown);e.currentTarget.lastChild.textContent=shown?'Hide':'Reveal'};
$('rt').onclick=e=>{const b=e.currentTarget;if(b.dataset.c!=='1'){b.dataset.c='1';b.lastChild.textContent='Confirm rotate';$('rm').textContent='The old secret keeps working for 24 hours so you can deploy the new one.';return}b.dataset.c='';SEC='whsec_'+Array.from({length:22},()=>'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*56)]).join('');shown=true;$('sk').textContent=SEC;b.lastChild.textContent='Rotate';$('rm').textContent='Rotated. Old secret expires in 24 hours.'};
$('ad').onclick=()=>{$('f').hidden=false;$('u').focus()};$('fc').onclick=()=>$('f').hidden=true;
$('f').onsubmit=e=>{e.preventDefault();let ok=true;try{const u=new URL($('u').value);ok=u.protocol==='https:'}catch{ok=false}$('u').setAttribute('aria-invalid',!ok);$('ue').textContent=ok?'':'Use a full https:// URL.';if(!ok)return $('u').focus();$('f').innerHTML='<p style="margin:0">Endpoint added. We sent a <code>ping</code> event to it.</p>'};
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}


.k.db{display:grid;grid-template-columns:232px 1fr;padding:0;place-items:stretch;background:var(--sf);min-height:100dvh;font-size:14px}
.db-side{background:var(--bg);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100dvh;overflow:auto}
.db-brand{display:flex;gap:10px;align-items:center;font-weight:700;padding:6px 8px 18px;font-size:15px}.db-brand i{width:28px;height:28px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:13px}
.db-side a{display:flex;gap:10px;align-items:center;height:36px;padding:0 10px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500}.db-side a:hover{background:var(--sf);color:var(--fg)}.db-side a[aria-current=page]{background:var(--sf2);color:var(--fg)}.db-side a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:650;background:var(--sf2);border-radius:999px;padding:1px 7px}
.db-side .db-sec{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:16px 10px 6px}
.db-user{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line)}.db-user .av{width:32px;height:32px;font-size:12px}.db-user div{display:grid;font-size:13px;min-width:0}.db-user span{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.db-main{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.db-top{display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}.db-top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}.db-top .sp{flex:1}
.k .db-mb{display:none}
.db-body{padding:24px;display:grid;gap:16px;align-content:start}
.db-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.db-kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px}.db-kpi span{color:var(--mu);font-size:13px}.db-kpi b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.db-kpi small{font-size:12px;font-weight:600}.db-up{color:var(--ok)}.db-dn{color:var(--err)}
.db-card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.db-card>h2,.db-ch h2{margin:0;font-size:15px;font-weight:650}.db-ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.db-tbl{width:100%;border-collapse:collapse;font-size:13.5px}.db-tbl th{text-align:left;font-weight:550;color:var(--mu);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.db-tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}.db-tbl tr:last-child td{border-bottom:0}.db-tbl tbody tr:hover{background:var(--sf)}.db-tw{overflow-x:auto;position:relative}
@media (max-width:900px){.k.db{grid-template-columns:1fr}.db-side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .25s var(--ease);box-shadow:var(--shadow)}.k.db.nav .db-side{transform:none}.k .db-mb{display:grid}.db-kpis{grid-template-columns:1fr 1fr}.db-body{padding:16px}.db-top{padding:0 12px 0 4px}}
.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.is-f{display:flex;gap:6px;align-items:center;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;color:var(--mu)}.is-f input{border:0;outline:0;background:none;width:120px;font-size:14px;color:var(--fg)}
.is-kb{font-size:12px;padding:10px 24px 0;margin:0}.is-kb kbd{font:11px 'Geist Mono',monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;margin-right:2px;background:var(--bg)}
.is-l{outline:0;padding:8px 0 80px}.is-g>button{display:flex;gap:8px;align-items:center;width:100%;padding:10px 24px;font-size:13px;font-weight:600;background:var(--sf);border-block:1px solid var(--line)}.is-g>button .i{transition:transform .2s}.is-g.cl>button .i{transform:rotate(-90deg)}.is-g>button span{color:var(--mu);font-weight:500}
.is-r{display:grid;grid-template-columns:20px 20px 64px 1fr auto 28px;gap:10px;align-items:center;padding:0 24px;height:44px;border-bottom:1px solid var(--line);background:var(--bg);cursor:default;font-size:14px}.is-r:hover{background:var(--sf)}.is-r.cur{box-shadow:inset 2px 0 0 var(--ac);background:var(--sf)}.is-r.sel{background:var(--ac-sf)}.is-r input{width:16px;height:16px;accent-color:var(--ac)}.is-r code{font:12px 'Geist Mono',monospace;color:var(--mu)}.is-r b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.is-r .av{width:24px;height:24px;font-size:10px}
.is-p{display:flex;gap:1.5px;align-items:flex-end;height:14px}.is-p i{width:3px;background:var(--ctl);border-radius:1px}.is-p i:nth-child(1){height:5px}.is-p i:nth-child(2){height:9px}.is-p i:nth-child(3){height:13px}.is-p[data-p="3"] i,.is-p[data-p="2"] i:nth-child(-n+2),.is-p[data-p="1"] i:nth-child(1){background:var(--fg)}.is-p[data-p="4"]{width:14px;height:14px;border-radius:3px;background:var(--err);color:#fff;font:700 10px/14px Geist;text-align:center;justify-content:center}.is-p[data-p="4"] i{display:none}.is-p[data-p="4"]::after{content:"!"}
.is-r .lb{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mu)}
.is-bar{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;translate:-50% 0;display:flex;gap:8px;align-items:center;background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;box-shadow:var(--shadow);animation:isb .2s var(--ease);z-index:20}.is-bar .b.sec{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}.is-bar .b.gh{color:var(--bg)}@keyframes isb{from{opacity:0;translate:-50% 8px}}
@media (max-width:700px){.is-r{grid-template-columns:20px 20px 1fr 28px}.is-r code,.is-r .lb{display:none}.is-kb{display:none}}
</style>
<div class="k db">
<aside class="db-side" aria-label="Main"><div class="db-brand"><i>◆</i>Trackr</div><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inbox</a><a href="#" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="m12 2 10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Issues</a><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>Cycles</a><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M3 6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects</a><div class="db-sec">Teams</div><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>Web</a><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>Mobile</a><div class="db-user"><span class="av" style="--c:#4338ca">DV</span><div><b>Dev V.</b><span>Web team</span></div></div></aside>
<main class="db-main"><header class="db-top"><button class="db-mb ibt" aria-label="Open navigation" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button><h1>Web · Issues</h1><span class="sp"></span><label class="is-f"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M4 6h16M7 12h10M10 18h4"/></svg><input id="qf" placeholder="Filter" aria-label="Filter issues"></label></header>
<div class="db-body" style="padding:0"><p class="is-kb mu"><kbd>j</kbd><kbd>k</kbd> move · <kbd>x</kbd> select · <kbd>Enter</kbd> open</p><div id="l" class="is-l" tabindex="0" aria-label="Issues"></div></div>

<script>
document.querySelectorAll('.db-mb').forEach(b=>b.addEventListener('click',()=>{const k=b.closest('.k');const o=k.classList.toggle('nav');b.setAttribute('aria-expanded',o)}));document.addEventListener('click',e=>{const k=document.querySelector('.k.db.nav');if(k&&!e.target.closest('.db-side,.db-mb'))k.classList.remove('nav')});
const G=[["In progress","#ca8a04"],["Todo","#64748b"],["Backlog","#a1a1aa"],["Done","#16a34a"]],A={DV:'#4338ca',MK:'#0f766e',SO:'#b45309'};
let I=[["WEB-142","Checkout button jumps on iOS Safari",0,4,"bug","DV"],["WEB-139","Migrate image CDN to AVIF",0,2,"perf","MK"],["WEB-151","Empty state for saved searches",1,1,"design","SO"],["WEB-148","Keyboard shortcut cheat sheet",1,2,"feature","DV"],["WEB-147","Flaky e2e test: login redirect",1,3,"bug","MK"],["WEB-120","Dark mode for marketing pages",2,1,"design","SO"],["WEB-118","Prefetch product pages on hover",2,2,"perf","DV"],["WEB-131","Update cookie copy",3,1,"content","SO"]].map(r=>({id:r[0],t:r[1],g:r[2],p:r[3],l:r[4],a:r[5]}));
const sel=new Set(),cl=new Set(),l=document.getElementById('l'),qf=document.getElementById('qf');let cur=0;
function vis(){return I.filter(x=>!cl.has(x.g)&&(!qf.value||(x.t+x.id+x.l).toLowerCase().includes(qf.value.toLowerCase()))).sort((a,b)=>a.g-b.g)}
function draw(){const V=vis();cur=Math.min(cur,V.length-1);l.innerHTML=G.map(([n,c],g)=>{const R=I.filter(x=>x.g===g&&(!qf.value||(x.t+x.id+x.l).toLowerCase().includes(qf.value.toLowerCase())));return `<div class="is-g${cl.has(g)?' cl':''}"><button data-g="${g}" aria-expanded="${!cl.has(g)}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="m6 9 6 6 6-6"/></svg><i style="width:10px;height:10px;border-radius:50%;border:2px solid ${c}"></i>${n} <span>${R.length}</span></button>${cl.has(g)?'':R.map(x=>`<div class="is-r${V[cur]===x?' cur':''}${sel.has(x.id)?' sel':''}" data-id="${x.id}"><input type="checkbox" ${sel.has(x.id)?'checked':''} aria-label="Select ${x.id}"><span class="is-p" data-p="${x.p}" aria-label="Priority ${x.p}"><i></i><i></i><i></i></span><code>${x.id}</code><b>${x.t}</b><span class="lb">${x.l}</span><span class="av" style="--c:${A[x.a]}">${x.a}</span></div>`).join('')}</div>`}).join('');const bar=document.getElementById('bar');bar.hidden=!sel.size;document.getElementById('bc').textContent=sel.size+' selected'}
l.onclick=e=>{const g=e.target.closest('[data-g]');if(g){const n=+g.dataset.g;cl.has(n)?cl.delete(n):cl.add(n);draw();return}const r=e.target.closest('.is-r');if(!r)return;const V=vis();cur=V.findIndex(x=>x.id===r.dataset.id);if(e.target.matches('input')){sel.has(r.dataset.id)?sel.delete(r.dataset.id):sel.add(r.dataset.id)}draw()};
document.addEventListener('keydown',e=>{if(e.target.matches('input:not([type=checkbox]),textarea,select'))return;const V=vis();if(e.key==='j'){cur=Math.min(V.length-1,cur+1);draw()}if(e.key==='k'){cur=Math.max(0,cur-1);draw()}if(e.key==='x'&&V[cur]){const id=V[cur].id;sel.has(id)?sel.delete(id):sel.add(id);draw()}if(e.key==='Escape'){sel.clear();draw()}});
document.getElementById('bar').onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='done')I.forEach(x=>{if(sel.has(x.id))x.g=3});if(a==='hi')I.forEach(x=>{if(sel.has(x.id))x.p=4});sel.clear();draw()};qf.oninput=draw;draw();
</script>

<style>
.bm{min-height:100vh;display:grid;place-items:center;background:#09090b;padding:60px 20px}
.bm-box{position:relative;width:min(760px,100%);aspect-ratio:760/420}
.bm-box svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bm-n{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:#131317;border:1px solid #ffffff17;box-shadow:0 8px 24px -8px #000;font-size:22px;z-index:1}
.bm-n.hub{width:92px;height:92px;border-radius:26px;background:linear-gradient(145deg,#1d1d23,#0f0f12);border-color:#ffffff26}
.bm-n.hub i{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 30deg,#ff5a1f,#ffcf6b,#7a5cff,#ff5a1f);animation:bm-r 6s linear infinite}
@keyframes bm-r{to{transform:rotate(1turn)}}
.bm-n span{position:absolute;top:calc(100% + 8px);font:12px "Geist Mono",monospace;color:#6c6c76;white-space:nowrap}
.bm-path{fill:none;stroke:#ffffff12;stroke-width:1.5}
.bm-pulse{fill:none;stroke-width:2.2;stroke-linecap:round}
</style>
<div class="bm"><div class="bm-box" id="bmBox">
  <svg viewBox="0 0 760 420" id="bmSvg"><defs><linearGradient id="bmG" gradientUnits="userSpaceOnUse" x1="0" x2="760"><stop offset="0" stop-color="#ffcf6b"/><stop offset=".5" stop-color="#ff5a1f"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs></svg>
  <div class="bm-n" style="left:9%;top:16%">◆<span>Stripe</span></div>
  <div class="bm-n" style="left:9%;top:50%">▲<span>Vercel</span></div>
  <div class="bm-n" style="left:9%;top:84%">●<span>Postgres</span></div>
  <div class="bm-n hub" style="left:50%;top:50%"><i></i></div>
  <div class="bm-n" style="left:91%;top:28%">✉<span>Email</span></div>
  <div class="bm-n" style="left:91%;top:72%">⌘<span>Slack</span></div>
</div></div>
<script>
(()=>{
const svg=document.getElementById("bmSvg"),NS="http://www.w3.org/2000/svg",H=[380,210];
const ends=[[68,67,1],[68,210,1],[68,353,1],[692,118,-1],[692,302,-1]];
ends.forEach(([x,y,dir],i)=>{
  const [a,b]=dir>0?[[x,y],H]:[H,[x,y]],mx=(a[0]+b[0])/2;
  const d=`M${a[0]} ${a[1]} C${mx} ${a[1]} ${mx} ${b[1]} ${b[0]} ${b[1]}`;
  const base=document.createElementNS(NS,"path");base.setAttribute("d",d);base.setAttribute("class","bm-path");svg.append(base);
  const p=document.createElementNS(NS,"path");p.setAttribute("d",d);p.setAttribute("class","bm-pulse");p.setAttribute("stroke","url(#bmG)");svg.append(p);
  const L=p.getTotalLength(),seg=L*.22;p.style.strokeDasharray=`${seg} ${L}`;
  p.animate([{strokeDashoffset:seg},{strokeDashoffset:-L}],{duration:2200+i*260,iterations:Infinity,delay:i*420,easing:"cubic-bezier(.5,0,.3,1)"});
});
})();
</script>

<style>
.lgx{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#120502;color:#f2efe6}
.lgx canvas{position:absolute;inset:0;width:100%;height:100%}
.lgx-in{position:relative;text-align:center;padding:0 24px;max-width:860px}
.lgx-eye{display:inline-block;font:500 11px "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:99px;background:#ffffff14;backdrop-filter:blur(10px);border:1px solid #ffffff1f}
.lgx h1{font-size:clamp(42px,7vw,96px);line-height:.95;letter-spacing:-.055em;font-weight:500;margin:22px 0 18px}
.lgx h1 em{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-.02em}
.lgx p{font-size:17px;line-height:1.55;color:#f2efe6b3;max-width:460px;margin:0 auto 32px}
.lgx-pal{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:99px;background:#0000003d;backdrop-filter:blur(14px);border:1px solid #ffffff1a}
.lgx-pal button{display:flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 6px;border:0;border-radius:99px;background:none;color:#f2efe6aa;font:500 13px Geist,sans-serif;cursor:pointer;transition:background .3s,color .3s}
.lgx-pal button i{width:20px;height:20px;border-radius:50%;background:var(--g)}
.lgx-pal button.on{background:#ffffff1f;color:#fff}
.lgx-cta{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:99px;background:#f2efe6;color:#04140f;font-weight:600;text-decoration:none;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.lgx-cta:hover{transform:scale(1.04)}
.lgx.nogl{background:radial-gradient(ellipse at 30% 30%,#ff6a2b,transparent 60%),radial-gradient(ellipse at 70% 70%,#7a1d06,transparent 60%),#120502}
</style>
<section class="lgx">
  <canvas></canvas>
  <div class="lgx-in">
    <span class="lgx-eye">Shader · WebGL</span>
    <h1>Colour that never<br><em>sits still.</em></h1>
    <p>A domain-warped noise field rendered on the GPU. Calm enough for a hero, alive enough to notice.</p>
    <a class="lgx-cta" href="#">Get started</a>
  </div>
  <div class="lgx-pal">
    <button class="on" data-p="ember" style="--g:linear-gradient(135deg,#7a1d06,#ffb36b)"><i></i>Ember</button>
    <button data-p="emerald" style="--g:linear-gradient(135deg,#0d5c46,#6fe3b5)"><i></i>Emerald</button>
    <button data-p="iris" style="--g:linear-gradient(135deg,#2a1a6e,#b9a4ff)"><i></i>Iris</button>
  </div>
</section>
<script>
(()=>{
const PAL={emerald:["#03120d","#0d5c46","#6fe3b5","#f2e9d8"],ember:["#120502","#7a1d06","#ff6a2b","#ffe3c4"],iris:["#07051a","#2a1a6e","#7c5cff","#f0e8ff"]};
const FS=`precision highp float;uniform vec2 r,m;uniform float t;uniform vec3 c0,c1,c2,c3;
float h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
void main(){vec2 uv=gl_FragCoord.xy/r,p=(gl_FragCoord.xy-.5*r)/r.y+(m-.5)*.12;float T=t*.045;
vec2 q=vec2(fbm(p*1.3+T),fbm(p*1.3+vec2(5.2,1.3)-T));
vec2 w=vec2(fbm(p*1.5+3.*q+vec2(1.7,9.2)+T*1.6),fbm(p*1.5+3.*q+vec2(8.3,2.8)-T));
float f=fbm(p*1.1+3.6*w);
vec3 col=mix(c0,c1,smoothstep(.15,.65,f));
col=mix(col,c2,smoothstep(.5,.95,length(w)*.85)*.9);
col=mix(col,c3,smoothstep(.55,.95,f*q.x*1.7)*.85);
col*=1.-.45*pow(length(uv-.5)*1.25,2.);
col+=(h(gl_FragCoord.xy+fract(t*7.))-.5)*.045;
gl_FragColor=vec4(col,1);}`;
const root=document.querySelector(".lgx"),c=root.querySelector("canvas"),gl=c.getContext("webgl");
if(!gl){root.classList.add("nogl");return}
const sh=(k,s)=>{const o=gl.createShader(k);gl.shaderSource(o,s);gl.compileShader(o);return o};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}"));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(pr,0,"p");gl.linkProgram(pr);
// fall back to a CSS gradient if the GPU refuses the shader instead of leaving a blank canvas
if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(pr));root.classList.add("nogl");return}
gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=k=>gl.getUniformLocation(pr,k),hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
let cur=PAL.ember.map(hex),tgt=cur.map(a=>a.slice()),m=[.5,.5],mt=[.5,.5],vis=true;
const fit=()=>{const s=Math.min(devicePixelRatio,1.5)*.75;c.width=c.clientWidth*s;c.height=c.clientHeight*s;gl.viewport(0,0,c.width,c.height)};
new ResizeObserver(fit).observe(c);fit();
root.addEventListener("pointermove",e=>{const b=root.getBoundingClientRect();mt=[(e.clientX-b.left)/b.width,1-(e.clientY-b.top)/b.height]});
new IntersectionObserver(([e])=>vis=e.isIntersecting).observe(root);
root.querySelectorAll(".lgx-pal button").forEach(b=>b.onclick=()=>{root.querySelector(".lgx-pal .on").classList.remove("on");b.classList.add("on");tgt=PAL[b.dataset.p].map(hex)});
const still=matchMedia("(prefers-reduced-motion:reduce)").matches,t0=performance.now();
(function f(now){requestAnimationFrame(f);if(!vis)return;
  cur=cur.map((a,i)=>a.map((v,j)=>v+(tgt[i][j]-v)*.04));m=m.map((v,i)=>v+(mt[i]-v)*.03);
  gl.uniform2f(U("r"),c.width,c.height);gl.uniform2f(U("m"),m[0],m[1]);gl.uniform1f(U("t"),still?20:(now-t0)/1000+20);
  ["c0","c1","c2","c3"].forEach((k,i)=>gl.uniform3fv(U(k),cur[i]));gl.drawArrays(gl.TRIANGLES,0,3)})(t0);
})();
</script>

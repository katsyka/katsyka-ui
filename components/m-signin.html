<script>

const ok=()=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value)&&pw.value.length>=8;

em.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();pw.focus()}});
em.addEventListener("blur",()=>{if(em.value&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value)){em.setAttribute("aria-invalid","true");err.textContent="That email looks incomplete."}});
eye.onclick=()=>{const s=pw.type==="password";pw.type=s?"text":"password";eye.setAttribute("aria-pressed",s);eye.setAttribute("aria-label",s?"Hide password":"Show password")};
f.onsubmit=e=>{e.preventDefault();if(!ok())return;go.classList.add("load");go.disabled=true;setTimeout(()=>{go.classList.remove("load");go.disabled=false;go.querySelector("span").textContent="Signed in ✓"},1300)};

</script>

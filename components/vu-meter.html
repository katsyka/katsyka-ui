<style>
.vu{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:#1b1a18;font-family:Geist,system-ui,sans-serif;color:#e9e2d4}
.vu-in{width:min(760px,100%)}
.vu-rack{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px;border-radius:16px;background:linear-gradient(#2c2a27,#1f1e1c);box-shadow:inset 0 1px 0 #ffffff14,0 30px 60px -30px #000}
.vu-m{position:relative;aspect-ratio:1.7;border-radius:8px;background:radial-gradient(120% 90% at 50% 100%,#fff3d0,#f0dcae 70%,#d9c08a);box-shadow:inset 0 0 0 3px #0e0d0c,inset 0 8px 18px #0000004d;overflow:hidden}
.vu-m svg{position:absolute;inset:0;width:100%;height:100%}
.vu-m text{font:600 9px Geist,system-ui,sans-serif;fill:#2b241a}
.vu-m .red{fill:#b42318}
.vu-needle{transform-origin:150px 168px}
.vu-pk{position:absolute;right:12px;top:10px;width:9px;height:9px;border-radius:50%;background:#5a1a14;box-shadow:inset 0 1px 2px #0008}
.vu-pk.on{background:#ff3b2f}
.vu-lb{position:absolute;left:0;right:0;bottom:12%;text-align:center;font:700 13px/1 Geist,system-ui,sans-serif;letter-spacing:.14em;color:#2b241a}
.vu-ctl{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.vu-ctl span{font:12px/1 "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#8d8577;margin-right:auto}
.vu-ctl button{height:36px;padding:0 14px;border-radius:999px;border:1px solid #e9e2d433;background:none;color:#e9e2d4;font:500 13px Geist,system-ui,sans-serif;cursor:pointer}
.vu-ctl button[aria-pressed="true"]{background:#e9e2d4;color:#1b1a18}
.vu-ctl button:focus-visible,.vu-ctl input:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.vu-ctl label{display:flex;align-items:center;gap:8px;font-size:13px;color:#b6ad9c}
.vu-ctl input{accent-color:#e9a23b;width:120px}
@media (max-width:560px){.vu-rack{grid-template-columns:1fr}}
</style>
<section class="vu">
  <div class="vu-in">
    <div class="vu-rack" aria-hidden="true"><div class="vu-m"></div><div class="vu-m"></div></div>
    <div class="vu-ctl"><span>Source</span>
      <div role="group" aria-label="Source" style="display:flex;gap:6px"><button data-s="music" aria-pressed="true">Music</button><button data-s="tone" aria-pressed="false">1 kHz tone</button><button data-s="off" aria-pressed="false">Silence</button></div>
      <label>Gain <input type="range" min="-12" max="6" step="0.5" value="0" aria-label="Gain in decibels"></label></div>
  </div>
</section>
<script>
(()=>{
// VU ballistics: needle is a damped spring chasing the rectified signal level (~300 ms rise).
const R=document.querySelector(".vu"),meters=[...R.querySelectorAll(".vu-m")],btns=[...R.querySelectorAll("[data-s]")],gain=R.querySelector("input");
const DB=[-20,-10,-7,-5,-3,-2,-1,0,1,2,3],A0=-48,A1=48,ang=db=>A0+(Math.max(-20,Math.min(3,db))+20)/23*(A1-A0)*(db<-7?.9:1);
const angOf=db=>{const t=(Math.pow(10,Math.max(-20,Math.min(3,db))/20)-.1)/(1.413-.1);return A0+Math.max(0,t)*(A1-A0)};
const pt=(a,r)=>[150+Math.sin(a*Math.PI/180)*r,168-Math.cos(a*Math.PI/180)*r];
const face=lab=>{let s=`<svg viewBox="0 0 300 176">`;
  const [x0,y0]=pt(angOf(-20),118),[x1,y1]=pt(angOf(0),118),[x2,y2]=pt(angOf(3),118);
  s+=`<path d="M${x0} ${y0}A118 118 0 0 1 ${x1} ${y1}" fill="none" stroke="#2b241a" stroke-width="1.4"/><path d="M${x1} ${y1}A118 118 0 0 1 ${x2} ${y2}" fill="none" stroke="#b42318" stroke-width="5"/>`;
  DB.forEach(d=>{const a=angOf(d),[a1,b1]=pt(a,118),[a2,b2]=pt(a,d%5===0||d>=0?130:126),[tx,ty]=pt(a,142);
    s+=`<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" stroke="${d>0?"#b42318":"#2b241a"}" stroke-width="1.4"/><text x="${tx}" y="${ty+3}" text-anchor="middle" class="${d>0?"red":""}">${d>0?"+"+d:d}</text>`});
  s+=`<text x="34" y="40" font-size="13" style="font-weight:700">−</text><text x="258" y="40" class="red" font-size="13" style="font-weight:700">+</text>`;
  s+=`<g class="vu-needle"><line x1="150" y1="168" x2="150" y2="34" stroke="#141210" stroke-width="1.6"/></g><circle cx="150" cy="168" r="14" fill="#141210"/></svg><i class="vu-pk"></i><div class="vu-lb">${lab}</div>`;return s};
meters.forEach((m,i)=>m.innerHTML=face(i?"VU · R":"VU · L"));
const N=meters.map(m=>({el:m.querySelector(".vu-needle"),pk:m.querySelector(".vu-pk"),a:A0,v:0,hold:0}));
let src="music",t=0;
btns.forEach(b=>b.onclick=()=>{src=b.dataset.s;btns.forEach(x=>x.setAttribute("aria-pressed",x===b))});
// cheap "music": kick every 0.5 s, snare offbeat, bass wobble, noise
const level=(ch)=>{if(src==="off")return-60;if(src==="tone")return-3+ +gain.value;
  const beat=t%.5,kick=Math.exp(-beat*14)*1,sn=Math.exp(-((t+.25)%.5)*18)*.6*(ch?1:.85),bass=.35+.15*Math.sin(t*2.1+ch),n=Math.random()*.25;
  const amp=(kick+sn+bass+n)*(.55+.45*Math.sin(t*.23)**2);return 20*Math.log10(amp+1e-4)-4+ +gain.value};
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  N.forEach((n,i)=>{const db=level(i),tg=angOf(db);
    const k=120,c=19;n.v+=((tg-n.a)*k-n.v*c)*dt;n.a+=n.v*dt;if(n.a<A0-2){n.a=A0-2;n.v=0}if(n.a>A1+4){n.a=A1+4;n.v*=-.3}
    n.el.style.transform=`rotate(${n.a.toFixed(2)}deg)`;if(db>0)n.hold=.25;n.hold-=dt;n.pk.classList.toggle("on",n.hold>0)})})(last);
})();
</script>

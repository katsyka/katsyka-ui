<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.wk2{padding:16px;place-items:stretch}.wk2-w{width:min(1100px,100%);margin:0 auto;display:grid;grid-template-rows:auto auto 1fr auto;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;height:min(720px,calc(100dvh - 32px))}
.wk2-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.wk2-h div{display:flex;gap:4px}
.wk2-d{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line);font-size:12px}.wk2-d div{padding:8px 6px;text-align:center;color:var(--mu)}.wk2-d b{display:block;font-size:18px;color:var(--fg);font-weight:600}.wk2-d .t b{background:var(--err);color:#fff;border-radius:50%;width:30px;height:30px;line-height:30px;margin:0 auto}
.wk2-sc{overflow:auto}.wk2-g{display:grid;grid-template-columns:52px repeat(7,1fr);position:relative;height:1152px;user-select:none}.wk2-hr{grid-column:1;font-size:11px;color:var(--mu);text-align:right;padding-right:8px;transform:translateY(-7px)}.wk2-col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(transparent 0 47px,var(--line) 47px 48px);cursor:crosshair;touch-action:none}
.wk2-e{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 6px;font-size:12px;line-height:1.3;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,var(--bg));border-left:0;box-shadow:inset 3px 0 0 var(--c);color:var(--fg);text-align:left;cursor:pointer}.wk2-e b{display:block;font-weight:600}.wk2-e span{color:var(--mu)}.wk2-e:focus-visible{outline:2px solid var(--focus)}.wk2-e.new{opacity:.75;outline:1.5px dashed var(--c)}
.wk2-now{position:absolute;left:0;right:0;height:2px;background:var(--err);z-index:3}.wk2-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--err)}
.wk2-ev{margin:0;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;min-height:40px}
</style>
<div class="k wk2"><div class="wk2-w"><div class="wk2-h"><b id="rg"></b><div><button class="b sec sm" id="td">Today</button><button class="ibt" id="pv" aria-label="Previous week"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg></button><button class="ibt" id="nx" aria-label="Next week"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m9 18 6-6-6-6"/></svg></button></div></div><div class="wk2-d" id="dh"></div><div class="wk2-sc" id="sc"><div class="wk2-g" id="g"></div></div><p class="wk2-ev" id="ev" role="status"></p></div></div>
<script>
const H=48,S=7,$=i=>document.getElementById(i);let base=new Date();base.setHours(0,0,0,0);base.setDate(base.getDate()-((base.getDay()+6)%7));
let E=[[0,9,10,"Standup","#2563eb"],[0,9.5,11,"Design review","#7c3aed"],[1,13,14.5,"Customer call · Halden","#0f766e"],[2,10,12,"Focus time","#64748b"],[2,11,12,"Interview: frontend","#b45309"],[3,15,16,"1:1 with Lena","#be123c"],[4,12,13,"Team lunch","#15803d"],[4,16,17.5,"Sprint demo","#2563eb"]].map(e=>({d:e[0],s:e[1],e:e[2],t:e[3],c:e[4],w:0}));
const fh=h=>`${String(Math.floor(h)).padStart(2,'0')}:${h%1?'30':'00'}`;
function layout(L){L.sort((a,b)=>a.s-b.s);const cols=[];L.forEach(e=>{let i=cols.findIndex(c=>c<=e.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=e.e;e.col=i});L.forEach(e=>{const ov=L.filter(o=>o.s<e.e&&o.e>e.s);e.n=Math.max(...ov.map(o=>o.col))+1})}
function draw(){const days=[...Array(7)].map((_,i)=>new Date(+base+i*864e5)),today=new Date().toDateString(),wk=0;$('rg').textContent=`${days[0].toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${days[6].toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;
$('dh').innerHTML='<div></div>'+days.map(d=>`<div class="${d.toDateString()===today?'t':''}">${d.toLocaleDateString('en-GB',{weekday:'short'})}<b>${d.getDate()}</b></div>`).join('');
let h='';for(let i=0;i<24;i++)h+=`<div class="wk2-hr" style="grid-row:${i+1};height:48px">${i?fh(i):''}</div>`;h+=days.map((d,i)=>`<div class="wk2-col" data-d="${i}" style="grid-column:${i+2};grid-row:1/25"></div>`).join('');$('g').innerHTML=h;$('g').style.gridTemplateRows='repeat(24,48px)';
const isThis=base.toDateString()===(()=>{const b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()-((b.getDay()+6)%7));return b.toDateString()})();
for(let d=0;d<7;d++){const col=$('g').querySelector(`[data-d="${d}"]`),L=isThis?E.filter(e=>e.d===d):[];layout(L);L.forEach(e=>{const w=100/e.n;col.insertAdjacentHTML('beforeend',`<button class="wk2-e${e.new?' new':''}" style="--c:${e.c};top:${e.s*H}px;height:${(e.e-e.s)*H-2}px;left:calc(${e.col*w}% + 2px);width:calc(${w}% - 4px)" data-k="${E.indexOf(e)}"><b>${e.t}</b><span>${fh(e.s)}–${fh(e.e)}</span></button>`)});if(days[d].toDateString()===today){const n=new Date();col.insertAdjacentHTML('beforeend',`<div class="wk2-now" style="top:${(n.getHours()+n.getMinutes()/60)*H}px" aria-label="Now"></div>`)}}}
let dr=null;$('g').addEventListener('pointerdown',e=>{const c=e.target.closest('.wk2-col');if(!c||e.target.closest('.wk2-e'))return;const r=c.getBoundingClientRect(),s=Math.floor((e.clientY-r.top)/H*2)/2;dr={d:+c.dataset.d,s,e:s+.5,t:'New event',c:'#0ea5e9',new:1};E.push(dr);c.setPointerCapture(e.pointerId);draw()});
$('g').addEventListener('pointermove',e=>{if(!dr)return;const c=$('g').querySelector(`[data-d="${dr.d}"]`),r=c.getBoundingClientRect(),h=Math.ceil((e.clientY-r.top)/H*2)/2;dr.e=Math.max(dr.s+.5,Math.min(24,h));draw()});
$('g').addEventListener('pointerup',()=>{if(!dr)return;const t=prompt('Event title','New event');if(t){dr.t=t;dr.new=0;$('ev').textContent=`Created “${t}” ${fh(dr.s)}–${fh(dr.e)}.`}else E.splice(E.indexOf(dr),1);dr=null;draw()});
$('g').addEventListener('click',e=>{const b=e.target.closest('.wk2-e');if(!b)return;const ev=E[+b.dataset.k];$('ev').textContent=`${ev.t} · ${new Date(+base+ev.d*864e5).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}, ${fh(ev.s)}–${fh(ev.e)}`});
$('pv').onclick=()=>{base=new Date(+base-7*864e5);draw()};$('nx').onclick=()=>{base=new Date(+base+7*864e5);draw()};$('td').onclick=()=>{base=new Date();base.setHours(0,0,0,0);base.setDate(base.getDate()-((base.getDay()+6)%7));draw()};draw();$('sc').scrollTop=8*H;
</script>

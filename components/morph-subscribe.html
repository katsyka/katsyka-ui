<style>
.mph{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.mph :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mph ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.mph *,.mph *::before,.mph *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mph{min-height:100vh;display:grid;place-items:center;padding:48px 16px;text-align:center}
.mph h2{font:400 44px/1 "Instrument Serif",serif;margin:0 0 10px}.mph>div>p{color:var(--mu);margin:0 auto 28px;max-width:36ch}
.mph-box{position:relative;margin:0 auto;width:var(--w,148px);height:52px;border-radius:26px;background:var(--fg);color:var(--bg);transition:width .34s cubic-bezier(.2,.8,.2,1),background .25s ease-out;overflow:hidden}
.mph-box>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .2s ease-out,filter .2s ease-out,transform .2s ease-out}
.mph-off{opacity:0;filter:blur(4px);transform:scale(.94);pointer-events:none}
.mph-open{border:0;background:none;color:inherit;font:600 15px Geist,system-ui,sans-serif;cursor:pointer;width:100%;height:100%;border-radius:26px}
.mph-open:active{transform:scale(.97)}
.mph-form{gap:6px;padding:6px 6px 6px 20px;justify-content:stretch}
.mph-form input{flex:1;min-width:0;height:40px;border:0;background:none;color:var(--bg);font:15px Geist,system-ui,sans-serif;outline:0}
.mph-form input::placeholder{color:color-mix(in oklab,var(--bg) 55%,transparent)}
.mph-form button{height:40px;padding:0 16px;border-radius:20px;border:0;background:var(--bg);color:var(--fg);font:600 14px Geist,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mph-form button:active{transform:scale(.97)}
.mph-box:focus-within{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus)}
.mph-spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--bg);border-right-color:transparent;animation:mphs .7s linear infinite}@keyframes mphs{to{transform:rotate(1turn)}}
.mph[data-s=done] .mph-box{background:var(--ok)}
.mph-done path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s ease-out .1s}
.mph[data-s=done] .mph-done path{stroke-dashoffset:0}
.mph-err{min-height:22px;margin-top:10px;color:var(--err);font-size:14px}
.mph-note{min-height:22px;margin-top:10px;color:var(--mu);font-size:14px}
</style>
<section class="mph" data-s="idle">
  <div>
    <h2>The Thursday letter</h2>
    <p>One short email a week about tools, type and things worth making.</p>
    <div class="mph-box">
      <button class="mph-open" type="button" aria-expanded="false" aria-controls="mph-f">Subscribe</button>
      <form class="mph-form mph-off" id="mph-f" novalidate>
        <label for="mph-e" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Email address</label>
        <input id="mph-e" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-describedby="mph-err" required>
        <button type="submit">Join</button>
      </form>
      <div class="mph-wait mph-off" aria-hidden="true"><span class="mph-spin"></span></div>
      <div class="mph-done mph-off" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <p class="mph-err" id="mph-err" role="alert"></p>
    <p class="mph-note" role="status"></p>
  </div>
</section>
<script>
(()=>{
const R=document.querySelector(".mph"),box=R.querySelector(".mph-box"),open=R.querySelector(".mph-open"),form=R.querySelector(".mph-form"),inp=R.querySelector("input"),err=R.querySelector(".mph-err"),note=R.querySelector(".mph-note");
const V={idle:[open,148],form:[form,Math.min(380,R.clientWidth-32)],wait:[R.querySelector(".mph-wait"),52],done:[R.querySelector(".mph-done"),52]};
let tries=0;
function go(s){R.dataset.s=s;Object.values(V).forEach(([el])=>{el.classList.toggle("mph-off",el!==V[s][0]);if(el.tagName)el.inert=el!==V[s][0]});box.style.setProperty("--w",V[s][1]+"px");open.setAttribute("aria-expanded",s==="form")}
open.onclick=()=>{go("form");setTimeout(()=>inp.focus(),60)};
form.addEventListener("keydown",e=>{if(e.key==="Escape"){go("idle");err.textContent="";open.focus()}});
inp.addEventListener("blur",()=>{if(inp.value&&!inp.checkValidity())err.textContent="That email doesn't look right. Check for typos."});
inp.addEventListener("input",()=>{if(err.textContent&&inp.checkValidity())err.textContent="";inp.removeAttribute("aria-invalid")});
form.onsubmit=e=>{e.preventDefault();if(!inp.value||!inp.checkValidity()){err.textContent=inp.value?"That email doesn't look right. Check for typos.":"Enter your email to subscribe.";inp.setAttribute("aria-invalid","true");inp.focus();return}
  err.textContent="";go("wait");note.textContent="Subscribing…";tries++;
  setTimeout(()=>{if(/fail/i.test(inp.value)){go("form");err.textContent="We couldn't reach the server. Your email is still here, try again.";note.textContent="";inp.focus();return}
    go("done");note.textContent="You're in. First letter arrives Thursday."},1000)};
go("idle");
})();
</script>

<style>
.rp{position:relative;height:100vh;min-height:520px;overflow:hidden;background:#0b2a2c;color:#fff;font-family:Geist,system-ui,sans-serif;touch-action:pan-y}
.rp img,.rp canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rp canvas{cursor:crosshair}
.rp.gl img{visibility:hidden}
.rp-c{position:absolute;right:clamp(20px,5vw,64px);top:clamp(96px,17vh,150px);text-align:right;pointer-events:none}
.rp small{font:500 12px "Geist Mono",monospace;letter-spacing:.16em;color:#ffffffe0}
.rp h2{margin:12px 0 0;font-size:clamp(44px,6vw,96px);line-height:.9;letter-spacing:-.06em;font-weight:600}
.rp em{font:italic 400 1.05em "Instrument Serif",serif;letter-spacing:-.025em}
</style>
<section class="rp" aria-label="Water ripple image">
  <img src="media/pics/w/1011.jpg" alt="A paddler in a red jacket on a still turquoise mountain lake" crossorigin="anonymous">
  <canvas aria-hidden="true"></canvas>
  <div class="rp-c"><small>MOVE ACROSS THE WATER</small><h2>Touch <em>the surface.</em></h2></div>
</section>
<script>
(()=>{
// Height-field wave simulation on a small grid (CPU), uploaded as a texture each frame; the shader bends the photo by the field's gradient.
const root=document.querySelector(".rp"),img=root.querySelector("img"),c=root.querySelector("canvas");
const gl=c.getContext("webgl",{antialias:false,premultipliedAlpha:false});if(!gl)return;
const vs="attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;v.y=1.-v.y;gl_Position=vec4(p,0,1);}";
const fs=`precision mediump float;uniform sampler2D I,Hm;uniform vec2 px,cv;varying vec2 v;
void main(){float l=texture2D(Hm,v-vec2(px.x,0)).r,r=texture2D(Hm,v+vec2(px.x,0)).r,t=texture2D(Hm,v-vec2(0,px.y)).r,b=texture2D(Hm,v+vec2(0,px.y)).r;
vec2 g=vec2(r-l,b-t);vec3 c=texture2D(I,(v-.5)*cv+.5+g*.08).rgb;c+=(g.y-g.x)*.22;gl_FragColor=vec4(c,1);}`;
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o},pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n),tex=(u,lin)=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t);
  for(const[k,v]of[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]])gl.texParameteri(gl.TEXTURE_2D,k,v);return t};
tex(0);gl.uniform1i(U("I"),0);tex(1);gl.uniform1i(U("Hm"),1);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
let W=0,H=0,a,b,bytes,ready=false,vis=false,raf=0,last=null,idle=0;
function size(){const d=Math.min(devicePixelRatio,2);c.width=c.clientWidth*d;c.height=c.clientHeight*d;gl.viewport(0,0,c.width,c.height);
  W=160;H=Math.max(40,Math.round(W*c.height/c.width));a=new Float32Array(W*H);b=new Float32Array(W*H);bytes=new Uint8Array(W*H);
  gl.uniform2f(U("px"),1/W,1/H);if(img.naturalWidth){const ca=c.width/c.height,ia=img.naturalWidth/img.naturalHeight;gl.uniform2f(U("cv"),ca>ia?1:ca/ia,ca>ia?ia/ca:1)}}
function drop(x,y,s,r){const cx=x*W|0,cy=y*H|0;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const X=cx+i,Y=cy+j,d=i*i+j*j;if(X>0&&Y>0&&X<W-1&&Y<H-1&&d<=r*r)a[Y*W+X]+=s*(1-d/(r*r+1))}}
function step(){for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;b[i]=((a[i-1]+a[i+1]+a[i-W]+a[i+W])*.5-b[i])*.975}
  [a,b]=[b,a];for(let i=0;i<W*H;i++){const v=128+a[i]*60;bytes[i]=v<0?0:v>255?255:v}}
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function frame(t){raf=0;if(!vis||!ready)return;
  if(!still&&t-idle>520){idle=t;drop(Math.random(),Math.random(),-.6,2)}
  step();gl.activeTexture(gl.TEXTURE1);gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,W,H,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,bytes);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);raf=requestAnimationFrame(frame)}
const go=()=>{if(!raf)raf=requestAnimationFrame(frame)};
function load(){try{gl.activeTexture(gl.TEXTURE0);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img)}catch(e){return}
  ready=true;root.classList.add("gl");size();go()}
img.complete&&img.naturalWidth?load():img.addEventListener("load",load);
new ResizeObserver(()=>{if(ready)size()}).observe(c);
new IntersectionObserver(e=>{vis=e[0].isIntersecting;if(vis)go()}).observe(root);
c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  if(last){const n=Math.min(8,Math.ceil(Math.hypot(x-last[0],y-last[1])*W/2));for(let k=1;k<=n;k++)drop(last[0]+(x-last[0])*k/n,last[1]+(y-last[1])*k/n,-.22,3)}last=[x,y]});
c.addEventListener("pointerleave",()=>last=null);
c.addEventListener("pointerdown",e=>{const r=c.getBoundingClientRect();drop((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,-3,5)});
})();
</script>

<style>
.pw{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.pw :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pw ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.pw *,.pw *::before,.pw *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.pw{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.pw-pn{width:min(420px,100%);padding:28px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pw-pn h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.025em}
.pw-pn>p{margin:4px 0 22px;font-size:14px;color:var(--mu)}
.pw-f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.pw-f label{font-size:14px;font-weight:550}
.pw-w{display:flex;align-items:center;height:42px;border-radius:10px;border:1px solid color-mix(in oklab,var(--ctl) 70%,var(--bg));background:var(--bg);box-shadow:0 1px 2px #0000000a;transition:border-color .15s,box-shadow .15s}
.pw-w:hover{border-color:var(--ctl)}
.pw-w:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklab,var(--focus) 22%,transparent)}
.pw-w input{flex:1;min-width:0;height:100%;padding:0 12px;border:0;background:none;color:var(--fg);font:16px Geist,system-ui,sans-serif;outline:0;letter-spacing:.02em}
.pw-w input:focus-visible{outline:0}
.pw-eye{display:grid;place-items:center;width:34px;height:34px;margin-right:4px;border:0;border-radius:8px;background:none;color:var(--mu);cursor:pointer}
.pw-eye:hover{background:var(--sf2);color:var(--fg)}
.pw-eye svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw-eye .sl{stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .25s var(--ease)}
.pw-eye[aria-pressed=false] .sl{stroke-dashoffset:0}
.pw-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.pw-meter i{height:4px;border-radius:2px;background:var(--sf2);transition:background-color .25s}
.pw[data-s="1"] .pw-meter i:nth-child(-n+1){background:var(--err)}
.pw[data-s="2"] .pw-meter i:nth-child(-n+2){background:var(--warn)}
.pw[data-s="3"] .pw-meter i:nth-child(-n+3){background:color-mix(in oklab,var(--ok) 70%,var(--warn))}
.pw[data-s="4"] .pw-meter i{background:var(--ok)}
.pw-lv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);margin-top:2px}
.pw-lv b{font-weight:600;color:var(--fg)}
.pw-caps{display:none;align-items:center;gap:6px;font-size:12.5px;color:var(--warn)}
.pw-caps.on{display:flex}
.pw-caps svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.pw-rq{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.pw-rq li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mu);transition:color .2s}
.pw-rq li i{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ctl);display:grid;place-items:center;transition:background-color .2s,border-color .2s}
.pw-rq li i svg{width:10px;height:10px;fill:none;stroke:light-dark(#fff,#052e14);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.pw-rq li.ok{color:var(--fg)}
.pw-rq li.ok i{background:var(--ok);border-color:var(--ok)}
.pw-rq li.ok i svg{opacity:1}
.pw-match{font-size:12.5px;min-height:18px;color:var(--mu)}
.pw-match.bad{color:var(--err)}.pw-match.good{color:var(--ok)}
.pw-go{width:100%;height:44px;margin-top:6px;border:0;border-radius:11px;background:var(--fg);color:var(--bg);font:600 14.5px Geist,system-ui,sans-serif;cursor:pointer;transition:opacity .2s}
.pw-go:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:420px){.pw-rq{grid-template-columns:1fr}}
</style>
<div class="pw" data-s="0">
  <form class="pw-pn" onsubmit="return false">
    <h2>Set a new password</h2><p>Make it something only you would know.</p>
    <input type="text" autocomplete="username" value="mira@studio.io" hidden>
    <div class="pw-f"><label for="pwA">New password</label>
      <div class="pw-w"><input id="pwA" type="password" autocomplete="new-password" aria-describedby="pwL pwR"><button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button></div>
      <div class="pw-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="pw-lv" id="pwL" aria-live="polite"><span>Strength: <b>—</b></span><span class="pw-caps" role="status"><svg viewBox="0 0 24 24"><path d="M12 3 4 12h4v6h8v-6h4z"/></svg>Caps Lock is on</span></div>
      <ul class="pw-rq" id="pwR" aria-label="Requirements">
        <li data-r="len"><i><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i>12+ characters</li>
        <li data-r="case"><i><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i>Upper &amp; lower case</li>
        <li data-r="num"><i><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i>A number</li>
        <li data-r="sym"><i><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i>A symbol</li>
      </ul></div>
    <div class="pw-f"><label for="pwB">Confirm password</label>
      <div class="pw-w"><input id="pwB" type="password" autocomplete="new-password" aria-describedby="pwM"><button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button></div>
      <div class="pw-match" id="pwM" aria-live="polite"></div></div>
    <button class="pw-go" disabled>Update password</button>
  </form>
</div>
<script>
const root=document.querySelector(".pw"),A=document.getElementById("pwA"),B=document.getElementById("pwB"),lv=document.querySelector(".pw-lv b"),caps=document.querySelector(".pw-caps"),M=document.getElementById("pwM"),go=document.querySelector(".pw-go");
const R={len:v=>v.length>=12,case:v=>/[a-z]/.test(v)&&/[A-Z]/.test(v),num:v=>/\d/.test(v),sym:v=>/[^A-Za-z0-9]/.test(v)};
const names=["—","Weak","Fair","Good","Strong"];
const upd=()=>{const v=A.value;let n=0;document.querySelectorAll(".pw-rq li").forEach(li=>{const ok=R[li.dataset.r](v);li.classList.toggle("ok",ok);n+=ok});
  const s=v?Math.max(1,n):0;root.dataset.s=s;lv.textContent=names[s];
  const m=B.value&&(B.value===v);M.textContent=!B.value?"":m?"Passwords match":"Passwords don’t match yet";M.className="pw-match"+(!B.value?"":m?" good":" bad");B.setAttribute("aria-invalid",!!B.value&&!m);
  go.disabled=!(n===4&&m)};
[A,B].forEach(i=>{i.addEventListener("input",upd);i.addEventListener("keydown",e=>caps.classList.toggle("on",e.getModifierState&&e.getModifierState("CapsLock")));i.addEventListener("blur",()=>caps.classList.remove("on"))});
document.querySelectorAll(".pw-eye").forEach(b=>b.addEventListener("click",()=>{const i=b.previousElementSibling,show=i.type==="password";i.type=show?"text":"password";b.setAttribute("aria-pressed",show);b.setAttribute("aria-label",show?"Hide password":"Show password")}));
go.addEventListener("click",()=>{go.textContent="Password updated ✓";go.disabled=true});
upd();
</script>

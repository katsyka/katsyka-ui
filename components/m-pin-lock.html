<main class="pn" id="pn">
  <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>

<script>

const L=["","ABC","DEF","GHI","JKL","MNO","PQRS","TUV","WXYZ"];
k.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}" aria-label="${n}"><b>${n}</b><small>${L[n-1]}</small></button>`).join("")+`<button class="t" id="fid" aria-label="Use Face ID"><svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M9 9v1M15 9v1M12 9v4h-1M9 16c1.7 1.3 4.3 1.3 6 0"/></svg></button><button data-n="0" aria-label="0"><b>0</b><small></small></button><button class="t" id="del" aria-label="Delete">Delete</button>`;
let v="",tries=0;const D=[...dots.children];
const draw=()=>D.forEach((d,i)=>d.classList.toggle("f",i<v.length));
const unlock=()=>{pn.classList.add("go");ok.hidden=false;lockb.focus()};
const press=n=>{if(v.length>=4)return;v+=n;msg.textContent="";draw();if(v.length===4)setTimeout(()=>{if(v==="1234")unlock();else{tries++;dots.classList.remove("bad");void dots.offsetWidth;dots.classList.add("bad");msg.textContent=tries>2?"Hint: it's the easiest one":"Wrong passcode. Try again.";navigator.vibrate&&navigator.vibrate([30,40,30]);v="";setTimeout(draw,250)}},150)};
k.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.n)press(b.dataset.n);else if(b.id==="del"){v=v.slice(0,-1);draw()}else if(b.id==="fid"){tt.textContent="Looking for your face…";setTimeout(unlock,900)}};
addEventListener("keydown",e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace"){v=v.slice(0,-1);draw()}});

</script>

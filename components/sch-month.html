<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.mo2{width:min(900px,100%);border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;position:relative}.mo2-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.mo2-h b{font-size:17px}
.mo2-w,.mo2-g{display:grid;grid-template-columns:repeat(7,1fr)}.mo2-w span{font-size:11px;color:var(--mu);padding:6px 8px;text-align:right}
.mo2-g>div{min-height:104px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;display:grid;align-content:start;gap:2px;outline:0;cursor:pointer}.mo2-g>div:nth-child(7n+1){border-left:0}.mo2-g>div.we{background:var(--sf)}.mo2-g>div.ot{color:var(--ctl)}.mo2-g>div:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
.mo2-g .n{justify-self:end;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}.mo2-g .td .n{background:var(--err);color:#fff;font-weight:700}
.mo2-g .p{font-size:11.5px;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px}.mo2-g .p b{font-weight:600}.mo2-g .more{font-size:11px;color:var(--mu);padding:0 6px;font-weight:600}
.mo2-pop{position:absolute;z-index:5;width:240px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 12px 28px -12px #0004;animation:mop .16s cubic-bezier(.23,1,.32,1)}@keyframes mop{from{opacity:0;transform:scale(.96)}}.mo2-pop h3{margin:0 0 8px;font-size:14px}.mo2-pop ul{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:13px}.mo2-pop li{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center}.mo2-pop li i{width:8px;height:8px;border-radius:50%;background:var(--c)}.mo2-pop time{color:var(--mu);font-variant-numeric:tabular-nums;font-size:12px}
@media (max-width:640px){.mo2-g>div{min-height:64px}.mo2-g .p{font-size:0;padding:0;height:6px;width:6px;border-radius:50%;background:var(--c)}.mo2-g .p *{display:none}.mo2-g>div{grid-template-columns:repeat(auto-fill,6px);gap:3px}.mo2-g .n{grid-column:1/-1}.mo2-g .more{display:none}}
</style>
<div class="k"><div class="mo2"><div class="mo2-h"><b id="mn"></b><div><button class="ibt" id="pv" aria-label="Previous month"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg></button><button class="ibt" id="nx" aria-label="Next month"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m9 18 6-6-6-6"/></svg></button></div></div><div class="mo2-w" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="mo2-g" id="g" role="grid"></div><div class="mo2-pop" id="pp" role="dialog" aria-label="Day events" hidden></div></div></div>
<script>
const $=i=>document.getElementById(i),now=new Date();let vm=new Date(now.getFullYear(),now.getMonth(),1),focus=now.getDate();
const C=['#2563eb','#0f766e','#b45309','#be123c','#7c3aed'],T=['Standup','Design crit','Dentist','1:1 Lena','Release','Gym','Board prep','Dinner with Sam','Flight to Lisbon','Book club'];
const ev=d=>{const n=(d*7+vm.getMonth()*3)%5;return Array.from({length:n%4},(_,k)=>({t:T[(d+k*3)%T.length],c:C[(d+k)%5],h:`${String(8+((d+k*2)%10)).padStart(2,'0')}:${k%2?'30':'00'}`}))};
function draw(){$('mn').textContent=vm.toLocaleDateString('en-GB',{month:'long',year:'numeric'});const f=(vm.getDay()+6)%7,dim=new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate(),prevDim=new Date(vm.getFullYear(),vm.getMonth(),0).getDate();let h='';const cells=Math.ceil((f+dim)/7)*7;
for(let i=0;i<cells;i++){const d=i-f+1,inM=d>=1&&d<=dim,dn=inM?d:d<1?prevDim+d:d-dim,we=i%7>4,td=inM&&vm.getMonth()===now.getMonth()&&vm.getFullYear()===now.getFullYear()&&d===now.getDate(),E=inM?ev(d):[];h+=`<div class="${we?'we':''}${inM?'':' ot'}${td?' td':''}" ${inM?`data-d="${d}" tabindex="${d===focus?0:-1}" role="gridcell" aria-label="${new Date(vm.getFullYear(),vm.getMonth(),d).toDateString()}, ${E.length} events"`:''}><span class="n">${dn}</span>${E.slice(0,2).map(e=>`<span class="p" style="--c:${e.c}"><b>${e.h}</b>${e.t}</span>`).join('')}${E.length>2?`<span class="more">+${E.length-2} more</span>`:''}</div>`}$('g').innerHTML=h}
function pop(cell){const d=+cell.dataset.d,E=ev(d),pp=$('pp'),r=cell.getBoundingClientRect(),pr=$('g').parentElement.getBoundingClientRect();pp.hidden=false;pp.innerHTML=`<h3>${new Date(vm.getFullYear(),vm.getMonth(),d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</h3>${E.length?`<ul>${E.map(e=>`<li style="--c:${e.c}"><i></i><span>${e.t}</span><time>${e.h}</time></li>`).join('')}</ul>`:'<p class="mu" style="margin:0;font-size:13px">Nothing planned.</p>'}`;pp.style.left=Math.min(pr.width-250,Math.max(8,r.left-pr.left))+'px';pp.style.top=(r.bottom-pr.top+4)+'px'}
$('g').onclick=e=>{const c=e.target.closest('[data-d]');if(c){focus=+c.dataset.d;pop(c)}};
$('g').onkeydown=e=>{const k={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];if(e.key==='Enter'){pop(e.target);return}if(e.key==='Escape'){$('pp').hidden=true;return}if(!k)return;e.preventDefault();const dim=new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate(),n=focus+k;if(n<1||n>dim)return;focus=n;$('pp').hidden=true;$('g').querySelectorAll('[data-d]').forEach(x=>x.tabIndex=+x.dataset.d===focus?0:-1);$('g').querySelector(`[data-d="${focus}"]`).focus()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.mo2-pop,[data-d]'))$('pp').hidden=true});$('pv').onclick=()=>{vm.setMonth(vm.getMonth()-1);focus=1;$('pp').hidden=true;draw()};$('nx').onclick=()=>{vm.setMonth(vm.getMonth()+1);focus=1;$('pp').hidden=true;draw()};draw();
</script>

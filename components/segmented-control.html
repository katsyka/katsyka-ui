<style>
.sg{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.sg :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sg ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.sg *,.sg *::before,.sg *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.sg{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.sg-pn{width:min(560px,100%);display:grid;gap:26px;padding:28px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.sg-lb{font:500 11px/1 "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.sg-c{--h:36px;position:relative;display:inline-flex;padding:3px;border-radius:11px;background:var(--sf2);isolation:isolate;max-width:100%}
.sg-c button{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:calc(var(--h) - 6px);padding:0 14px;border:0;border-radius:8px;background:none;color:var(--mu);font:550 13.5px Geist,system-ui,sans-serif;cursor:pointer;white-space:nowrap;transition:color .2s}
.sg-c button:hover{color:var(--fg)}
.sg-c button[aria-checked=true]{color:var(--fg)}
.sg-c button:focus-visible{outline-offset:-2px}
.sg-c svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sg-c .th{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--bg);box-shadow:0 1px 2px #0000001f,0 1px 6px -1px #00000014;transition:transform .3s var(--ease),width .3s var(--ease)}
.sg-c.full{display:flex}
.sg-c.sm{--h:30px;border-radius:9px}.sg-c.sm button{font-size:12.5px;padding:0 10px;border-radius:6px}.sg-c.sm .th{border-radius:6px}
.sg-c.lg{--h:44px;border-radius:13px}.sg-c.lg button{font-size:14.5px;padding:0 18px;border-radius:10px}.sg-c.lg .th{border-radius:10px}
.sg-c.ic button{padding:0 10px}
.sg-c.dark{background:var(--fg)}.sg-c.dark button{color:color-mix(in oklab,var(--bg) 60%,var(--fg))}.sg-c.dark button[aria-checked=true]{color:var(--fg)}.sg-c.dark .th{background:var(--bg)}
.sg-c .bd{font:500 11px "Geist Mono",monospace;padding:1px 6px;border-radius:99px;background:color-mix(in oklab,currentColor 14%,transparent)}
.sg-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sg-out{font-size:13.5px;color:var(--mu)}
.sg-out b{color:var(--fg);font-weight:600}
</style>
<div class="sg">
  <div class="sg-pn">
    <div><div class="sg-lb">Billing</div>
      <div class="sg-c full" role="radiogroup" aria-label="Billing period"><button role="radio" aria-checked="false" data-p="12">Monthly</button><button role="radio" aria-checked="true" data-p="10">Yearly <span class="bd">−20%</span></button></div>
      <p class="sg-out" aria-live="polite" style="margin:10px 0 0">Pro is <b id="sgP">$10</b> per month, <span id="sgB">billed yearly</span>.</p></div>
    <div><div class="sg-lb">Sizes</div>
      <div class="sg-row">
        <div class="sg-c sm" role="radiogroup" aria-label="Small"><button role="radio" aria-checked="true">1D</button><button role="radio" aria-checked="false">1W</button><button role="radio" aria-checked="false">1M</button><button role="radio" aria-checked="false">1Y</button></div>
        <div class="sg-c" role="radiogroup" aria-label="Default"><button role="radio" aria-checked="false">Preview</button><button role="radio" aria-checked="true">Code</button><button role="radio" aria-checked="false">Docs</button></div>
        <div class="sg-c lg" role="radiogroup" aria-label="Large"><button role="radio" aria-checked="true">Buy</button><button role="radio" aria-checked="false">Sell</button></div>
      </div></div>
    <div><div class="sg-lb">Icons &amp; inverse</div>
      <div class="sg-row">
        <div class="sg-c ic" role="radiogroup" aria-label="Theme"><button role="radio" aria-checked="false" aria-label="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button role="radio" aria-checked="true" aria-label="Dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><button role="radio" aria-checked="false" aria-label="System"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button></div>
        <div class="sg-c" role="radiogroup" aria-label="Layout"><button role="radio" aria-checked="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Grid</button><button role="radio" aria-checked="false"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</button></div>
        <div class="sg-c dark sm" role="radiogroup" aria-label="Units"><button role="radio" aria-checked="true">°C</button><button role="radio" aria-checked="false">°F</button></div>
      </div></div>
  </div>
</div>
<script>
document.querySelectorAll(".sg-c").forEach(g=>{
  const bs=[...g.querySelectorAll("button")],th=document.createElement("i");th.className="th";th.setAttribute("aria-hidden","true");g.prepend(th);
  const place=(anim)=>{const b=bs.find(x=>x.getAttribute("aria-checked")==="true");if(!anim)th.style.transition="none";th.style.width=b.offsetWidth+"px";th.style.transform=`translateX(${b.offsetLeft}px)`;if(!anim){th.offsetWidth;th.style.transition=""}};
  const sel=(b,f)=>{bs.forEach(x=>{x.setAttribute("aria-checked",x===b);x.tabIndex=x===b?0:-1});place(true);if(f)b.focus();g.dispatchEvent(new CustomEvent("change",{detail:b}))};
  bs.forEach(b=>{b.tabIndex=b.getAttribute("aria-checked")==="true"?0:-1;b.addEventListener("click",()=>sel(b))});
  g.addEventListener("keydown",e=>{const i=bs.indexOf(document.activeElement);const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(d&&i>-1){e.preventDefault();sel(bs[(i+d+bs.length)%bs.length],true)}});
  new ResizeObserver(()=>place(false)).observe(g);document.fonts&&document.fonts.ready.then(()=>place(false));
});
document.querySelector('[aria-label="Billing period"]').addEventListener("change",e=>{document.getElementById("sgP").textContent="$"+e.detail.dataset.p;document.getElementById("sgB").textContent=e.detail.dataset.p==="10"?"billed yearly":"billed monthly"});
</script>

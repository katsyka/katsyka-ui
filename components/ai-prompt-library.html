<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.pl2{width:min(900px,100%);display:grid;grid-template-columns:260px 1fr;border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden;min-height:420px}.pl2-s{border-right:1px solid var(--line);padding:12px;display:grid;gap:8px;align-content:start}
.pl2-q{display:flex;gap:6px;align-items:center;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;color:var(--mu)}.pl2-q input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:14px;color:var(--fg)}
.pl2-s ul{list-style:none;padding:0;margin:0;display:grid;gap:2px}.pl2-s li{padding:9px 10px;border-radius:8px;cursor:pointer;display:grid;font-size:14px}.pl2-s li:hover{background:var(--sf)}.pl2-s li[aria-selected=true]{background:var(--sf2)}.pl2-s li small{font-size:11px;color:var(--mu)}
.pl2-m{padding:20px;display:grid;gap:14px;align-content:start}.pl2-m h2{margin:0;font-size:18px}.pl2-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.pl2-f .in{height:38px}
.pl2-pv{padding:14px;border-radius:12px;background:var(--sf);font-size:14px;line-height:1.65;white-space:pre-wrap}.pl2-pv mark{background:var(--ac-sf);color:var(--ac);border-radius:3px;padding:0 2px;font-weight:600}.pl2-pv mark.e{background:var(--warn-sf);color:var(--warn)}.pl2-ft{display:flex;justify-content:space-between;align-items:center;font-size:12px}
@media (max-width:700px){.pl2{grid-template-columns:1fr}.pl2-s{border-right:0;border-bottom:1px solid var(--line)}.pl2-s ul{grid-auto-flow:column;overflow-x:auto}.pl2-s li{white-space:nowrap}}
</style>
<div class="k"><div class="pl2"><aside class="pl2-s"><label class="pl2-q"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search templates" aria-label="Search templates"></label><ul id="l" role="listbox" aria-label="Templates"></ul></aside><section class="pl2-m" id="m"></section></div></div>
<script>
const T=[["Release notes","Writing","Turn these merged pull requests into release notes for {audience}. Group by New, Improved and Fixed. Keep each line under {words} words.\n\nPull requests:\n{input}"],["Meeting summary","Writing","Summarise this {meeting} transcript in {bullets} bullets, then list decisions and owners.\n\n{input}"],["SQL from question","Data","Write a {dialect} query for: {question}. Explain any joins in one sentence."],["Polite follow-up","Email","Write a short follow-up email to {name} about {topic}. Tone: {tone}. No more than {words} words."]];
const V={audience:"customers",words:"15",input:"",meeting:"weekly product",bullets:"5",dialect:"Postgres",question:"",name:"",topic:"",tone:"friendly, direct"};let s=0;const q=document.getElementById('q'),m=document.getElementById('m');
function list(){document.getElementById('l').innerHTML=T.map((t,i)=>[t,i]).filter(([t])=>(t[0]+t[1]).toLowerCase().includes(q.value.toLowerCase())).map(([[n,c],i])=>`<li role="option" aria-selected="${i===s}" data-i="${i}">${n}<small>${c}</small></li>`).join('')}
function main(){const [n,,tp]=T[s],vars=[...new Set(tp.match(/\{(\w+)\}/g).map(x=>x.slice(1,-1)))];m.innerHTML=`<h2>${n}</h2><div class="pl2-f">${vars.map(v=>`<label><span class="lbl">${v}</span>${v==='input'?`<textarea class="in" data-v="${v}" rows="2" style="height:auto;padding:8px">${V[v]}</textarea>`:`<input class="in" data-v="${v}" value="${V[v]}">`}</label>`).join('')}</div><div class="pl2-pv" id="pv"></div><div class="pl2-ft"><span class="mu tn" id="cc"></span><button class="b ac sm" id="use">Use prompt</button></div>`;pv()}
function pv(){const [, ,tp]=T[s];let miss=0;const h=tp.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\{(\w+)\}/g,(_,v)=>{const x=(V[v]||'').trim();if(!x)miss++;return x?`<mark>${x.replace(/</g,'&lt;')}</mark>`:`<mark class="e">${v}</mark>`});document.getElementById('pv').innerHTML=h;const n=document.getElementById('pv').textContent.length;document.getElementById('cc').textContent=`${n} characters${miss?` · ${miss} field${miss>1?'s':''} empty`:''}`;document.getElementById('use').disabled=!!miss}
m.addEventListener('input',e=>{if(e.target.dataset.v){V[e.target.dataset.v]=e.target.value;pv()}});m.addEventListener('click',e=>{if(e.target.id==='use'){e.target.textContent='Copied to composer ✓'}});
document.getElementById('l').onclick=e=>{const li=e.target.closest('li');if(li){s=+li.dataset.i;list();main()}};q.oninput=list;list();main();
</script>

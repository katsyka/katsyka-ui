<style>
.tt{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.tt :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tt ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.tt *,.tt *::before,.tt *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.tt{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.tt-pn{width:min(620px,100%);display:grid;gap:14px}
.tt-c{padding:26px 24px;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tt-lb{font:500 11px/1 "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:22px}
.tt-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.tt-w{position:relative;display:inline-flex}
.tt-b{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:550 13.5px Geist,system-ui,sans-serif;cursor:pointer}
.tt-b:hover{background:var(--sf)}
.tt-b.ic{width:38px;padding:0;justify-content:center}
.tt-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[role=tooltip]{position:absolute;z-index:10;width:max-content;max-width:240px;padding:6px 10px;border-radius:8px;background:light-dark(#18181b,#f4f4f5);color:light-dark(#fafafa,#18181b);font:500 12.5px/1.4 Geist,system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .12s,transform .15s var(--ease)}
[role=tooltip]::after{content:"";position:absolute;width:8px;height:8px;background:inherit;border-radius:1px;transform:rotate(45deg)}
[role=tooltip].on{opacity:1}
[role=tooltip][data-pl=top]{bottom:calc(100% + 9px);left:50%;transform:translate(-50%,4px)}[role=tooltip][data-pl=top].on{transform:translate(-50%,0)}
[role=tooltip][data-pl=top]::after{bottom:-4px;left:calc(50% - 4px)}
[role=tooltip][data-pl=bottom]{top:calc(100% + 9px);left:50%;transform:translate(-50%,-4px)}[role=tooltip][data-pl=bottom].on{transform:translate(-50%,0)}
[role=tooltip][data-pl=bottom]::after{top:-4px;left:calc(50% - 4px)}
[role=tooltip][data-pl=left]{right:calc(100% + 9px);top:50%;transform:translate(4px,-50%)}[role=tooltip][data-pl=left].on{transform:translate(0,-50%)}
[role=tooltip][data-pl=left]::after{right:-4px;top:calc(50% - 4px)}
[role=tooltip][data-pl=right]{left:calc(100% + 9px);top:50%;transform:translate(-4px,-50%)}[role=tooltip][data-pl=right].on{transform:translate(0,-50%)}
[role=tooltip][data-pl=right]::after{left:-4px;top:calc(50% - 4px)}
[role=tooltip] kbd{margin-left:8px;padding:1px 5px;border-radius:4px;background:color-mix(in oklab,currentColor 18%,transparent);font:500 11px "Geist Mono",monospace}
[role=tooltip].rich{max-width:260px;padding:10px 12px;white-space:normal}
[role=tooltip].rich b{display:block;margin-bottom:2px;font-size:13px}
[role=tooltip].rich span{opacity:.75;font-weight:450}
.tt-txt{font-size:14.5px;line-height:1.7;color:var(--mu);text-align:center;margin:0}
.tt-abbr{position:relative;color:var(--fg);text-decoration:underline dotted;text-underline-offset:4px;cursor:help;border-radius:3px}
.tt-tb{display:inline-flex;gap:2px;padding:4px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.tt-tb .tt-b{border:0;width:34px;height:34px}
.tt-tb .tt-b:hover{background:var(--sf2)}
</style>
<div class="tt">
  <div class="tt-pn">
    <div class="tt-c"><div class="tt-lb">Placement</div>
      <div class="tt-row">
        <span class="tt-w"><button class="tt-b" data-tip="Tooltip on top" data-pl="top">Top</button></span>
        <span class="tt-w"><button class="tt-b" data-tip="Tooltip on the right" data-pl="right">Right</button></span>
        <span class="tt-w"><button class="tt-b" data-tip="Tooltip below" data-pl="bottom">Bottom</button></span>
        <span class="tt-w"><button class="tt-b" data-tip="Tooltip on the left" data-pl="left">Left</button></span>
      </div></div>
    <div class="tt-c"><div class="tt-lb">Toolbar with shortcuts · instant after the first</div>
      <div class="tt-row"><div class="tt-tb" role="toolbar" aria-label="Formatting">
        <span class="tt-w"><button class="tt-b ic" aria-label="Bold" data-tip="Bold" data-kbd="⌘B" data-pl="top"><svg viewBox="0 0 24 24"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/></svg></button></span>
        <span class="tt-w"><button class="tt-b ic" aria-label="Italic" data-tip="Italic" data-kbd="⌘I" data-pl="top"><svg viewBox="0 0 24 24"><path d="M19 4h-9M14 20H5M15 4 9 20"/></svg></button></span>
        <span class="tt-w"><button class="tt-b ic" aria-label="Link" data-tip="Insert link" data-kbd="⌘K" data-pl="top"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button></span>
        <span class="tt-w"><button class="tt-b ic" aria-label="Code" data-tip="Inline code" data-kbd="⌘E" data-pl="top"><svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg></button></span>
        <span class="tt-w"><button class="tt-b ic" aria-label="Quote" data-tip="Quote" data-kbd="⌘⇧9" data-pl="top"><svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5H3v7h4c0 3-1 5-4 6zM14 21c3 0 7-1 7-8V5h-7v7h4c0 3-1 5-4 6z"/></svg></button></span>
      </div></div></div>
    <div class="tt-c"><div class="tt-lb">Rich · inline text</div>
      <p class="tt-txt">Your build used <span class="tt-w"><span class="tt-abbr" tabindex="0" data-rich="ISR|Incremental static regeneration rebuilds pages in the background after a request." data-pl="top">ISR</span></span> and finished in <span class="tt-w"><span class="tt-abbr" tabindex="0" data-tip="Median of the last 20 builds: 44 s" data-pl="bottom">41 s</span></span>, slightly faster than usual.</p></div>
  </div>
</div>
<script>
let warm=0,coolT;
document.querySelectorAll("[data-tip],[data-rich]").forEach((el,i)=>{
  const t=document.createElement("span");t.setAttribute("role","tooltip");t.id="tt"+i;t.dataset.pl=el.dataset.pl;
  if(el.dataset.rich){const [h,b]=el.dataset.rich.split("|");t.className="rich";t.innerHTML=`<b>${h}</b><span>${b}</span>`}else{t.textContent=el.dataset.tip;if(el.dataset.kbd){const k=document.createElement("kbd");k.textContent=el.dataset.kbd;t.append(k)}}
  el.after(t);el.setAttribute("aria-describedby",t.id);
  let st;
  const show=d=>{clearTimeout(st);st=setTimeout(()=>{t.classList.add("on");warm=1;clearTimeout(coolT)},d)};
  const hide=()=>{clearTimeout(st);t.classList.remove("on");coolT=setTimeout(()=>warm=0,500)};
  el.addEventListener("pointerenter",()=>show(warm?0:450));el.addEventListener("pointerleave",hide);
  el.addEventListener("focus",()=>show(0));el.addEventListener("blur",hide);
  el.addEventListener("keydown",e=>{if(e.key==="Escape")hide()});
});
</script>

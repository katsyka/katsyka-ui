<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.lt2-w{width:min(520px,100%);display:grid;gap:12px}.lt2-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.lt2-h h1{margin:0;font-size:20px;letter-spacing:-.01em}.lt2-h span{font-size:13px}
.lt2-bar{height:10px;border-radius:5px;background:var(--sf2);overflow:hidden}.lt2-bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:5px;transition:width .3s linear}.lt2-w.pz .lt2-bar i{background:var(--ctl)}.lt2-n{margin:0;font-size:13px;color:var(--mu)}
.lt2-st{list-style:none;padding:0;margin:4px 0;display:grid;gap:4px}.lt2-st li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mu);padding:4px 0}.lt2-st li::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--ctl);box-sizing:border-box;flex:none}.lt2-st .dn{color:var(--fg)}.lt2-st .dn::before{background:var(--ok);border-color:var(--ok)}.lt2-st .on{color:var(--fg);font-weight:550}.lt2-st .on::before{border-color:var(--ac)}
.lt2-w2{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-sf);border-radius:10px;padding:0 12px;font-size:13px}.lt2-w2 summary{padding:10px 0;cursor:pointer;font-weight:550}.lt2-w2 ul{margin:0 0 10px;padding-left:18px;display:grid;gap:4px}
.lt2-ac{display:flex;gap:8px}.lt2-ac .b{height:40px}.lt2-cf{margin:0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--err-sf)}.lt2-cf button{font-weight:600;text-decoration:underline;min-height:32px;margin-left:6px}
</style>
<div class="k lt2"><main class="lt2-w"><div class="lt2-h"><h1>Importing contacts.csv</h1><span class="mu tn" id="eta"></span></div><div class="lt2-bar" role="progressbar" aria-label="Import progress" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="bi"></i></div><p class="tn lt2-n" id="n"></p>
<ol class="lt2-st" id="st"><li>Upload</li><li>Check columns</li><li>Import rows</li><li>Remove duplicates</li></ol>
<details class="lt2-w2" id="wd" hidden><summary id="ws"></summary><ul id="wl"></ul></details>
<div class="lt2-ac"><button class="b sec" id="ps"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M7 4h3v16H7zM14 4h3v16h-3z" fill="currentColor"/></svg>Pause</button><button class="b gh" id="cx">Cancel import</button></div><p class="lt2-cf" id="cf" hidden>Cancel? Rows imported so far will be removed. <button id="cy">Yes, cancel</button> <button id="cn">Keep going</button></p></main></div>
<script>
const $=i=>document.getElementById(i),TOT=48210;let done=0,stage=2,paused=false,rate=0,W=[],last=performance.now();const ST=[...$('st').children];
function draw(){const p=done/TOT*100;$('bi').style.width=p+'%';$('pb').setAttribute('aria-valuenow',Math.round(p));$('n').textContent=`${done.toLocaleString('en')} of ${TOT.toLocaleString('en')} rows · ${Math.round(rate).toLocaleString('en')} rows/s`;ST.forEach((l,i)=>l.className=i<stage?'dn':i===stage?'on':'');
const rem=rate?Math.round((TOT-done)/rate):0;$('eta').textContent=paused?'Paused':stage>=4?'Done':rem>60?`About ${Math.ceil(rem/60)} min left`:`About ${rem} s left`;if(W.length){$('wd').hidden=false;$('ws').textContent=`${W.length} rows skipped (show)`;$('wl').innerHTML=W.slice(-4).map(w=>`<li>${w}</li>`).join('')}}
const tk=setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;if(paused||stage>=4)return;const inc=Math.round(1400+Math.random()*900);done=Math.min(TOT,done+inc);rate=rate?rate*.8+inc/dt*.2:inc/dt;if(Math.random()<.15)W.push(`Row ${done-Math.floor(Math.random()*400)}: email “${['ana@','jo@@ex.com','(blank)','m.ruiz@example'][W.length%4]}” is not valid`);if(done>=TOT){stage=3;draw();setTimeout(()=>{stage=4;draw();document.querySelector('.lt2-h h1').textContent='Imported 48,210 contacts';$('ps').hidden=true;$('cx').hidden=true},900)}draw()},400);
$('ps').onclick=()=>{paused=!paused;document.querySelector('.lt2-w').classList.toggle('pz',paused);$('ps').innerHTML=paused?'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>Resume':'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M7 4h3v16H7zM14 4h3v16h-3z" fill="currentColor"/></svg>Pause';draw()};$('cx').onclick=()=>{$('cf').hidden=false;$('cy').focus()};$('cn').onclick=()=>$('cf').hidden=true;$('cy').onclick=()=>{clearInterval(tk);document.querySelector('.lt2-w').innerHTML='<h1 style="margin:0;font-size:20px">Import cancelled</h1><p class="mu" style="margin:0">No contacts were added.</p>'};draw();
</script>

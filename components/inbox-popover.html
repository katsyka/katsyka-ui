<style>
.ib{min-height:100vh;background:#0b0b0c;color:#e4e4e7}
.ib-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;height:64px;padding:0 clamp(16px,4vw,40px);border-bottom:1px solid #ffffff0d}
.ib-bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid #ffffff14;background:#121214;color:#e4e4e7;cursor:pointer;display:grid;place-items:center}
.ib-bell svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 2px}
.ib-bell.ring svg{animation:ib-ring .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes ib-ring{20%{transform:rotate(16deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(7deg)}80%{transform:rotate(-3deg)}}
.ib-bell em{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#ff5a1f;color:#160a04;font:700 11px "Geist Mono",monospace;font-style:normal;display:grid;place-items:center;border:2px solid #0b0b0c;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.ib-bell em.z{transform:scale(0)}
.ib-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fdba74,#f472b6)}
.ib-pop{position:absolute;top:72px;right:clamp(16px,4vw,40px);width:min(400px,calc(100vw - 32px));border-radius:18px;background:#141416;border:1px solid #ffffff14;box-shadow:0 30px 60px -20px #000;transform-origin:top right;opacity:0;transform:scale(.96) translateY(-6px);pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1,.3,1)}
.ib-pop.open{opacity:1;transform:none;pointer-events:auto}
.ib-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}.ib-h b{font-size:15px;font-weight:600}
.ib-h button{border:0;background:none;color:#a1a1aa;font:500 12.5px Geist,sans-serif;cursor:pointer}.ib-h button:hover{color:#fff}
.ib-tabs{position:relative;display:flex;gap:16px;padding:0 16px;margin-top:10px;border-bottom:1px solid #ffffff0d}
.ib-tabs button{height:38px;border:0;background:none;color:#71717a;font:500 13.5px Geist,sans-serif;cursor:pointer}.ib-tabs button.on{color:#fafafa}
.ib-tabs button span{font:11px "Geist Mono",monospace;margin-left:5px;padding:1px 6px;border-radius:99px;background:#ffffff0f}
.ib-tabs i{position:absolute;bottom:-1px;height:2px;background:#fafafa;border-radius:2px;transition:left .3s cubic-bezier(.3,1.2,.5,1),width .3s}
.ib-list{max-height:380px;overflow:auto;padding:6px}
.ib-it{position:relative;display:grid;grid-template-columns:36px 1fr auto;gap:12px;padding:12px 10px;border-radius:12px;cursor:pointer;transition:background .15s,opacity .3s,transform .3s}
.ib-it:hover{background:#ffffff06}
.ib-it .a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 12px Geist,sans-serif;color:#0b0b0c;background:var(--c)}
.ib-it p{margin:0;font-size:13.5px;line-height:1.45;color:#a1a1aa}.ib-it p b{color:#fafafa;font-weight:550}
.ib-it time{display:block;margin-top:3px;font:11.5px "Geist Mono",monospace;color:#52525b}
.ib-it .dot{width:8px;height:8px;margin-top:6px;border-radius:50%;background:#ff7a3d;transition:transform .3s}
.ib-it.read .dot{transform:scale(0)}.ib-it.read p{color:#71717a}
.ib-it .acts{display:flex;gap:6px;margin-top:9px}.ib-it .acts button{height:28px;padding:0 11px;border-radius:7px;border:1px solid #ffffff17;background:none;color:#e4e4e7;font:500 12px Geist,sans-serif;cursor:pointer}.ib-it .acts button:first-child{background:#fafafa;color:#0b0b0c;border-color:#fafafa}
.ib-it.out{opacity:0;transform:translateX(20px)}
.ib-empty{padding:40px 20px;text-align:center;color:#71717a;font-size:13.5px}.ib-empty b{display:block;color:#e4e4e7;font-size:15px;margin-bottom:4px}
.ib-f{padding:10px;border-top:1px solid #ffffff0d;text-align:center}.ib-f a{font-size:13px;color:#a1a1aa;text-decoration:none}
.ib-sim{position:absolute;left:clamp(16px,4vw,40px);top:84px;height:36px;padding:0 14px;border-radius:9px;border:1px solid #ffffff17;background:none;color:#a1a1aa;font:500 13px Geist,sans-serif;cursor:pointer}
</style>
<div class="ib">
  <div class="ib-bar"><button class="ib-bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><em>0</em></button><span class="ib-av"></span></div>
  <button class="ib-sim">Simulate new notification</button>
  <div class="ib-pop" role="dialog" aria-label="Notifications">
    <div class="ib-h"><b>Notifications</b><button data-all>Mark all as read</button></div>
    <div class="ib-tabs"><button class="on" data-t="all">All</button><button data-t="unread">Unread<span></span></button><button data-t="mention">Mentions</button><i></i></div>
    <div class="ib-list"></div>
    <div class="ib-f"><a href="#">View all activity</a></div>
  </div>
</div>
<script>
(()=>{
let id=0;const mk=(who,c,html,time,kind,acts)=>({id:id++,who,c,html,time,kind,acts,read:false});
let N=[mk("KM","#93c5fd","<b>Kenji Mori</b> mentioned you in <b>Pricing v3</b>: “can you check the annual toggle?”","2m ago","mention"),
 mk("AO","#86efac","<b>Amara Osei</b> invited you to <b>Q4 Launch</b>","1h ago","invite",1),
 mk("SL","#f9a8d4","<b>Sofia Lind</b> approved your pull request <b>#482</b>","3h ago","other"),
 mk("DC","#fdba74","<b>Daniel Cho</b> replied to your comment on <b>Onboarding flow</b>","Yesterday","mention")];
N[2].read=true;
const NEW=[["TR","#fcd34d","<b>Tomás Ruiz</b> assigned you <b>Fix chart tooltip</b>","just now","other"],["HI","#c4b5fd","<b>Hana Ivers</b> mentioned you: “ship it 🚀”","just now","mention"]];let ni=0;
const bell=document.querySelector(".ib-bell"),badge=bell.querySelector("em"),pop=document.querySelector(".ib-pop"),list=pop.querySelector(".ib-list"),tabs=pop.querySelector(".ib-tabs"),ink=tabs.querySelector("i");let tab="all";
function render(){const v=N.filter(n=>tab==="all"||(tab==="unread"&&!n.read)||(tab==="mention"&&n.kind==="mention"));
  list.innerHTML=v.length?v.map(n=>`<div class="ib-it${n.read?" read":""}" data-id="${n.id}"><span class="a" style="--c:${n.c}">${n.who}</span><div><p>${n.html}</p><time>${n.time}</time>${n.acts&&!n.done?'<div class="acts"><button data-ac="ok">Accept</button><button data-ac="no">Decline</button></div>':""}</div><span class="dot"></span></div>`).join("")
    :`<div class="ib-empty"><b>You're all caught up</b>New activity will show up here.</div>`;
  const u=N.filter(n=>!n.read).length;badge.textContent=u;badge.classList.toggle("z",!u);tabs.querySelector("[data-t=unread] span").textContent=u}
const moveInk=()=>{const b=tabs.querySelector(".on");ink.style.left=b.offsetLeft+"px";ink.style.width=b.offsetWidth+"px"};
tabs.onclick=e=>{const b=e.target.closest("button");if(!b)return;tabs.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));tab=b.dataset.t;moveInk();render()};
list.onclick=e=>{const it=e.target.closest(".ib-it");if(!it)return;const n=N.find(x=>x.id==it.dataset.id),ac=e.target.closest("[data-ac]");
  if(ac){n.done=1;n.read=true;n.html+=ac.dataset.ac==="ok"?" · <b>Joined</b>":" · Declined"}else n.read=true;
  if(tab==="unread"){it.classList.add("out");setTimeout(render,280)}else render()};
pop.querySelector("[data-all]").onclick=()=>{N.forEach(n=>n.read=true);render()};
bell.onclick=e=>{e.stopPropagation();pop.classList.toggle("open");moveInk()};pop.onclick=e=>e.stopPropagation();document.addEventListener("click",()=>pop.classList.remove("open"));
addEventListener("keydown",e=>{if(e.key==="Escape")pop.classList.remove("open")});
document.querySelector(".ib-sim").onclick=e=>{e.stopPropagation();const d=NEW[ni++%NEW.length];N.unshift(mk(...d));render();bell.classList.remove("ring");void bell.offsetWidth;bell.classList.add("ring");
  const first=list.querySelector(".ib-it");first?.animate([{opacity:0,transform:"translateY(-8px)"},{opacity:1,transform:"none"}],{duration:350,easing:"cubic-bezier(.2,1,.3,1)"})};
render();
})();
</script>

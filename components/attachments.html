<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}

.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}

.at{width:min(480px,100%);padding:16px}.at header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.at h2{margin:0;font-size:16px;font-weight:650}
.at label.b{cursor:pointer}.at label.b:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.at-l{list-style:none;margin:0;padding:0;border-radius:12px;transition:background .15s}.at-l.over{background:var(--ac-sf);outline:2px dashed var(--ac)}
.at-i{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}.at-i:last-child{border:0}
.at-ty{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;background:color-mix(in srgb,var(--c) 14%,var(--bg));color:var(--c);flex:none}
.at-tx{flex:1;min-width:0}.at-tx b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.at-tx small{font-size:12px;color:var(--mu)}.at-tx small.e{color:var(--err)}
.at-pr{height:4px;border-radius:2px;background:var(--sf2);margin-top:6px;overflow:hidden}.at-pr i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
</style>

const add=(name,size,st="done",fail)=>{const ext=(name.split(".").pop()||"").toUpperCase().slice(0,4);const li=document.createElement("li");li.className="at-i";li.style.setProperty("--c",T[ext]||"var(--mu)");

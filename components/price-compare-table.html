<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.pc{width:min(980px,100%)}.pc-w{border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:auto;max-height:620px}
.pc-t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}.pc-t th,.pc-t td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:center}.pc-t th:first-child,.pc-t td:first-child{text-align:left}
.pc-t thead th{position:sticky;top:0;background:var(--bg);z-index:2;vertical-align:bottom;padding:20px 16px}.pc-t thead b{display:block;font-size:16px}.pc-t thead span{display:block;font-weight:400;color:var(--mu);font-size:13px;margin:2px 0 10px}.pc-t thead .b{height:36px;width:100%}
.pc-t .grp td{background:var(--sf);font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:0}.pc-t .grp button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;min-height:40px;font:inherit;text-transform:inherit;letter-spacing:inherit}.pc-t .grp .i{transition:transform .2s}.pc-t .grp.cl .i{transform:rotate(-90deg)}
.pc-t .ft{display:inline-flex;gap:6px;align-items:center}.pc-t .tip{width:18px;height:18px;border-radius:50%;color:var(--mu);display:inline-grid;place-items:center;position:relative}.pc-t .tip .i{width:14px;height:14px}.pc-t .tip:hover::after,.pc-t .tip:focus-visible::after{content:attr(data-t);position:absolute;left:24px;top:50%;translate:0 -50%;width:220px;background:var(--fg);color:var(--bg);font-size:12px;padding:8px 10px;border-radius:8px;text-align:left;z-index:3;font-weight:400}
.pc-t .y .i{color:var(--ok)}.pc-t .n{color:var(--mu)}.pc-t .hl{background:color-mix(in srgb,var(--ac) 5%,transparent)}
.pc-tabs{display:none}
@media (max-width:700px){.pc-tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--sf2);padding:4px;border-radius:12px}.pc-tabs button{flex:1;height:40px;border-radius:9px;font-weight:550;color:var(--mu)}.pc-tabs [aria-selected=true]{background:var(--bg);color:var(--fg)}.pc-t [data-c]:not(.on){display:none}}
</style>
<div class="k">
<section class="pc"><div class="pc-tabs" role="tablist" aria-label="Plan" id="tb"></div><div class="pc-w"><table class="pc-t" id="t"></table></div></section>
</div>
<script>
const PL=[["Free","€0"],["Pro","€15 / mo"],["Business","€45 / mo"]],G=[["Core",[["Projects","How many active projects you can have at once.",["3","Unlimited","Unlimited"]],["Storage","Total file storage across the workspace.",["2 GB","100 GB","1 TB"]],["Version history","How far back you can restore any file.",["7 days","90 days","Unlimited"]]]],["Collaboration",[["Guests","Invite clients who can view and comment.",[0,1,1]],["Comments & mentions","",[1,1,1]],["Shared libraries","Publish components across projects.",[0,1,1]]]],["Security",[["SSO (SAML)","Sign in with Okta, Azure AD or Google Workspace.",[0,0,1]],["Audit log","Every permission change and export, kept 1 year.",[0,0,1]],["Data residency","Choose EU or US hosting.",[0,0,1]]]]];
const t=document.getElementById('t'),tb=document.getElementById('tb');let c=1;
const cell=(v,i)=>`<td data-c="${i}" class="${i===1?'hl ':''}${i===c?'on ':''}${v===1?'y':v===0?'n':''}">${v===1?'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span class="vh">Included</span>':v===0?'–<span class="vh">Not included</span>':v}</td>`;
function draw(){t.innerHTML=`<thead><tr><th><span class="vh">Feature</span></th>${PL.map(([n,p],i)=>`<th data-c="${i}" class="${i===1?'hl ':''}${i===c?'on':''}"><b>${n}</b><span>${p}</span><a class="b ${i===1?'ac':'sec'}" href="#">${i?'Choose '+n:'Get started'}</a></th>`).join('')}</tr></thead>`+G.map(([g,R],gi)=>`<tbody data-g="${gi}"><tr class="grp"><td colspan="4"><button aria-expanded="true">${g}<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m6 9 6 6 6-6"/></svg></button></td></tr>${R.map(([f,tip,v])=>`<tr><td><span class="ft">${f}${tip?`<button class="tip" data-t="${tip}" aria-label="${tip}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></button>`:''}</span></td>${v.map(cell).join('')}</tr>`).join('')}</tbody>`).join('');
tb.innerHTML=PL.map(([n],i)=>`<button role="tab" aria-selected="${i===c}" data-i="${i}">${n}</button>`).join('')}draw();
t.onclick=e=>{const b=e.target.closest('.grp button');if(!b)return;const tr=b.closest('tr'),cl=tr.classList.toggle('cl');b.setAttribute('aria-expanded',!cl);let r=tr.nextElementSibling;while(r){r.hidden=cl;r=r.nextElementSibling}};
tb.onclick=e=>{const b=e.target.closest('button');if(!b)return;c=+b.dataset.i;draw()};
</script>

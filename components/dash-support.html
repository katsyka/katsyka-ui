<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}


.k.db{display:grid;grid-template-columns:232px 1fr;padding:0;place-items:stretch;background:var(--sf);min-height:100dvh;font-size:14px}
.db-side{background:var(--bg);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100dvh;overflow:auto}
.db-brand{display:flex;gap:10px;align-items:center;font-weight:700;padding:6px 8px 18px;font-size:15px}.db-brand i{width:28px;height:28px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:13px}
.db-side a{display:flex;gap:10px;align-items:center;height:36px;padding:0 10px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500}.db-side a:hover{background:var(--sf);color:var(--fg)}.db-side a[aria-current=page]{background:var(--sf2);color:var(--fg)}.db-side a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:650;background:var(--sf2);border-radius:999px;padding:1px 7px}
.db-side .db-sec{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:16px 10px 6px}
.db-user{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line)}.db-user .av{width:32px;height:32px;font-size:12px}.db-user div{display:grid;font-size:13px;min-width:0}.db-user span{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.db-main{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.db-top{display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}.db-top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}.db-top .sp{flex:1}
.k .db-mb{display:none}
.db-body{padding:24px;display:grid;gap:16px;align-content:start}
.db-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.db-kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px}.db-kpi span{color:var(--mu);font-size:13px}.db-kpi b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.db-kpi small{font-size:12px;font-weight:600}.db-up{color:var(--ok)}.db-dn{color:var(--err)}
.db-card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.db-card>h2,.db-ch h2{margin:0;font-size:15px;font-weight:650}.db-ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.db-tbl{width:100%;border-collapse:collapse;font-size:13.5px}.db-tbl th{text-align:left;font-weight:550;color:var(--mu);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.db-tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}.db-tbl tr:last-child td{border-bottom:0}.db-tbl tbody tr:hover{background:var(--sf)}.db-tw{overflow-x:auto;position:relative}
@media (max-width:900px){.k.db{grid-template-columns:1fr}.db-side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .25s var(--ease);box-shadow:var(--shadow)}.k.db.nav .db-side{transform:none}.k .db-mb{display:grid}.db-kpis{grid-template-columns:1fr 1fr}.db-body{padding:16px}.db-top{padding:0 12px 0 4px}}
.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.hd-m{display:grid;grid-template-columns:320px 1fr;height:100dvh}.hd-q{list-style:none;margin:0;padding:8px;overflow:auto;border-right:1px solid var(--line);background:var(--bg)}
.hd-q li{padding:12px;border-radius:10px;cursor:pointer;display:grid;gap:4px;border:1px solid transparent}.hd-q li:hover{background:var(--sf)}.hd-q li[aria-selected=true]{background:var(--sf);border-color:var(--line)}.hd-q .r1{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hd-q .r1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hd-q p{margin:0;font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hd-q .r3{display:flex;gap:6px;align-items:center;font-size:12px}.hd-q .sla{font-variant-numeric:tabular-nums;color:var(--mu)}.hd-q .sla.late{color:var(--err);font-weight:600}.hd-q .un b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-right:6px;vertical-align:middle}
.hd-v{display:flex;flex-direction:column;min-width:0;min-height:0}.hd-th{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.hd-msg{max-width:640px;display:grid;gap:6px}.hd-msg .mh{display:flex;gap:8px;align-items:center;font-size:13px}.hd-msg .av{width:26px;height:26px;font-size:10px}.hd-msg .bd{padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px;line-height:1.55}.hd-msg.me{align-self:flex-end}.hd-msg.me .bd{background:var(--ac-sf);border-color:transparent}.hd-msg.nt .bd{background:var(--warn-sf);border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent)}
.hd-c{border-top:1px solid var(--line);background:var(--bg);padding:10px 16px 14px}.hd-tb{display:flex;gap:4px;align-items:center;margin-bottom:8px}.hd-tb button{height:30px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--mu)}.hd-tb [aria-selected=true]{background:var(--sf2);color:var(--fg)}.hd-tb select{margin-left:auto;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:12px;max-width:140px}
.hd-c textarea{height:auto;padding:10px 12px;resize:vertical;font-size:14px}.hd-c.note textarea{background:var(--warn-sf)}.hd-ac{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px}
@media (max-width:900px){.hd-m{grid-template-columns:1fr;height:auto}.hd-q{max-height:240px;border-right:0;border-bottom:1px solid var(--line)}}
</style>
<div class="k db hd">
<aside class="db-side" aria-label="Main"><div class="db-brand"><i>H</i>Helpline</div><a href="#" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12z"/></svg>Inbox<em id="nc">5</em></a><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Mine</a><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Snoozed</a><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M20 6 9 17l-5-5"/></svg>Solved</a><div class="db-sec">Views</div><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 22a7 7 0 0 0 7-7c0-4-3-6-4-9-1.5 2-2 3-3.5 3.5C11 7 11 4 9 2 9 6 5 9 5 15a7 7 0 0 0 7 7z"/></svg>Urgent</a><a href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Billing</a><div class="db-user"><span class="av" style="--c:#7c3aed">NB</span><div><b>Noor B.</b><span>Agent · online</span></div></div></aside>
<main class="db-main hd-m"><ul class="hd-q" id="q" role="listbox" aria-label="Tickets"></ul>
<section class="hd-v"><header class="db-top"><button class="db-mb ibt" aria-label="Open navigation" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button><h1 id="ts"></h1><span class="sp"></span><select class="in" id="st" aria-label="Status" style="width:auto;height:34px"><option>Open</option><option>Pending</option><option>Solved</option></select></header>
<div class="hd-th" id="th"></div><form class="hd-c" id="cf"><div class="hd-tb" role="tablist"><button type="button" role="tab" aria-selected="true" data-n="0">Reply</button><button type="button" role="tab" aria-selected="false" data-n="1">Internal note</button><select id="mc" aria-label="Insert macro"><option value="">Macros…</option><option>Thanks for your patience. I've refunded the duplicate charge. It shows in 3–5 days.</option><option>Could you send a screenshot of the error and your browser version?</option></select></div><textarea class="in" id="tx" rows="3" placeholder="Write a reply…" aria-label="Message"></textarea><div class="hd-ac"><span class="mu" id="hn">Customer will be emailed</span><button class="b ac sm" id="sd">Send</button></div></form></section></main>
</div>
<script>
document.querySelectorAll('.db-mb').forEach(b=>b.addEventListener('click',()=>{const k=b.closest('.k');const o=k.classList.toggle('nav');b.setAttribute('aria-expanded',o)}));document.addEventListener('click',e=>{const k=document.querySelector('.k.db.nav');if(k&&!e.target.closest('.db-side,.db-mb'))k.classList.remove('nav')});
const T=[{id:1,c:"Marta Silva",s:"Charged twice for March",p:"Urgent",sla:-12,un:1,m:[["c","Hi, I see two charges of €29 on 1 March. Can you refund one?"],["n","Stripe shows a retry after a 3DS timeout. Safe to refund ch_2."]]},{id:2,c:"Ken Ito",s:"Can't export to PDF",p:"High",sla:48,un:1,m:[["c","Export spins forever on Safari 17. Chrome works."]]},{id:3,c:"Ola Nordmann",s:"How do I add a teammate?",p:"Normal",sla:190,m:[["c","Where's the invite button?"],["a","Settings → Members → Invite. You need the Admin role."],["c","Found it, thanks!"]]},{id:4,c:"Priya R.",s:"Feature request: dark mode for email",p:"Low",sla:900,un:1,m:[["c","Would love dark mode in the email digests."]]},{id:5,c:"Diego Luna",s:"Login loop after password reset",p:"High",sla:22,un:1,m:[["c","After resetting I get sent back to login every time."]]}];
const PC={Urgent:'err',High:'warn',Normal:'',Low:''},q=document.getElementById('q'),th=document.getElementById('th');let cur=1,note=0;
const sla=m=>m<0?`${-m}m overdue`:m<60?`${m}m left`:`${Math.floor(m/60)}h ${m%60}m left`;
function list(){q.innerHTML=T.map(t=>`<li role="option" aria-selected="${t.id===cur}" data-id="${t.id}" class="${t.un?'un':''}"><div class="r1"><b>${t.c}</b><span class="sla ${t.sla<30?'late':''}">${sla(t.sla)}</span></div><p>${t.s}</p><div class="r3"><span class="pill ${PC[t.p]}">${t.p}</span></div></li>`).join('');document.getElementById('nc').textContent=T.filter(t=>t.un).length}
function show(){const t=T.find(x=>x.id===cur);t.un=0;document.getElementById('ts').textContent=t.s;th.innerHTML=t.m.map(([w,x])=>`<div class="hd-msg ${w==='a'?'me':w==='n'?'nt me':''}"><div class="mh"><span class="av" style="--c:${w==='c'?'#64748b':'#7c3aed'}">${w==='c'?t.c[0]:'NB'}</span><b>${w==='c'?t.c:'Noor'}</b><span class="mu">${w==='n'?'internal note':''}</span></div><div class="bd">${x.replace(/</g,'&lt;')}</div></div>`).join('');th.scrollTop=th.scrollHeight;list()}
q.onclick=e=>{const li=e.target.closest('li');if(li){cur=+li.dataset.id;show()}};
document.querySelectorAll('.hd-tb [role=tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.hd-tb [role=tab]').forEach(x=>x.setAttribute('aria-selected',x===b));note=+b.dataset.n;document.getElementById('cf').classList.toggle('note',!!note);document.getElementById('hn').textContent=note?'Only your team sees notes':'Customer will be emailed';document.getElementById('tx').placeholder=note?'Write a note for your team…':'Write a reply…'});
document.getElementById('mc').onchange=e=>{if(e.target.value){const t=document.getElementById('tx');t.value=(t.value?t.value+'\n':'')+e.target.value;e.target.value='';t.focus()}};
document.getElementById('cf').onsubmit=e=>{e.preventDefault();const t=document.getElementById('tx');if(!t.value.trim())return t.focus();T.find(x=>x.id===cur).m.push([note?'n':'a',t.value.trim()]);t.value='';show()};show();
</script>

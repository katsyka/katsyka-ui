<style>
.bg-dix{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;--ink:#1b1a17;--fb:#efe9dc;--ink2:var(--ink);background:var(--fb);color:var(--ink);isolation:isolate;font:16px/1.5 Geist,system-ui,sans-serif}
.bg-dix canvas,.bg-dix>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.bg-dix>img{display:none;filter:grayscale(1) contrast(1.2)}
.bg-dix.nogl canvas{display:none}.bg-dix.nogl>img{display:block}
.bg-dix-nav{display:flex;align-items:center;gap:28px;padding:20px clamp(16px,4vw,48px)}
.bg-dix-nav nav{display:flex;gap:22px}
.bg-dix-nav b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.bg-dix-nav a{color:inherit;text-decoration:none;font-size:14px;opacity:.72;transition:opacity .15s ease-out}.bg-dix-nav a:hover{opacity:1}
.bg-dix-main{flex:1;display:grid;padding:clamp(24px,5vw,64px) clamp(16px,4vw,48px) clamp(32px,6vw,72px)}
.bg-dix-eye{margin:0;font:500 11px/1.4 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.bg-dix-sub{font-size:17px;line-height:1.55;max-width:44ch;margin:0;opacity:.8;text-wrap:pretty}
.bg-dix-mono{font:13px "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.bg-dix-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--ink);color:var(--fb);font:600 15px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease-out,opacity .15s ease-out}
.bg-dix-btn:active{transform:scale(.97)}.bg-dix-ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink) 35%,transparent)}
.bg-dix-card{background:color-mix(in oklab,var(--fb) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in oklab,var(--ink) 12%,transparent);border-radius:16px;padding:20px}
.bg-dix-card>.bg-dix-eye:first-child{margin-bottom:10px}
.bg-dix-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.bg-dix-pal{margin-left:auto;display:flex;gap:2px}
.bg-dix-pal button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.bg-dix-pal button i{width:18px;height:18px;border-radius:50%;background:var(--g);box-shadow:0 0 0 1px color-mix(in oklab,var(--ink) 30%,transparent);transition:transform .15s ease-out}
.bg-dix-pal button[aria-pressed=true] i{box-shadow:0 0 0 2px var(--fb),0 0 0 3.5px var(--ink)}
.bg-dix :focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:760px){.bg-dix-main{grid-template-columns:1fr!important;gap:28px!important}.bg-dix-nav nav{display:none}}

.bg-dix-main{grid-template-rows:auto auto 1fr;align-items:start;gap:24px}
.bg-dix-story{align-self:end}
.bg-dix-mast{display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;font:500 13px "Geist Mono",monospace;font-variant-numeric:tabular-nums}
.bg-dix-find{display:flex;gap:8px;width:100%;max-width:480px}.bg-dix-find input{flex:1;min-width:0;min-height:48px;padding:0 14px;border:1px solid var(--ink);border-radius:0;background:var(--fb);color:var(--ink);font:15px Geist,system-ui,sans-serif}
.bg-dix-find .bg-dix-btn{border-radius:0}
.bg-dix-story{max-width:520px;background:var(--fb);color:var(--ink);padding:22px;border:1px solid var(--ink);border-radius:0;backdrop-filter:none}
.bg-dix-story h1{font:400 clamp(30px,4vw,48px)/1.02 "Instrument Serif",serif;margin:8px 0 10px;text-wrap:balance}
.bg-dix-story a{color:inherit;font-weight:600}

</style>
<section class="bg-dix">
  <canvas aria-hidden="true"></canvas>
  <img src="media/pics/w/1036.jpg" alt="" crossorigin="anonymous">
  <header class="bg-dix-nav"><b>The Municipal Archive</b><nav aria-label="The Municipal Archive"><a href="#">Newspapers</a><a href="#">Maps</a><a href="#">Photographs</a></nav><div class="bg-dix-pal" role="group" aria-label="Colour"><button type="button" aria-pressed="true" data-k="#1b1a17,#efe9dc,#efe9dc" style="--g:linear-gradient(135deg,#1b1a17,#efe9dc)" aria-label="Paper"><i></i></button><button type="button" aria-pressed="false" data-k="#0d2a6b,#dfe8ff,#dfe8ff" style="--g:linear-gradient(135deg,#0d2a6b,#dfe8ff)" aria-label="Blueprint"><i></i></button><button type="button" aria-pressed="false" data-k="#04140a,#5cff8a,#5cff8a" style="--g:linear-gradient(135deg,#04140a,#5cff8a)" aria-label="Phosphor"><i></i></button></div></header>
  <main class="bg-dix-main">
<div class="bg-dix-mast"><span>Morning Edition</span><span>Tuesday 14 January 1936</span><span>Page 1 of 12</span></div>
<form class="bg-dix-find" role="search" onsubmit="return false"><label class="bg-dix-vh" for="bg-dix-q">Search the archive</label><input id="bg-dix-q" type="search" placeholder="Search names, streets, years" autocomplete="off"><button class="bg-dix-btn" type="submit">Search</button></form>
<article class="bg-dix-story"><p class="bg-dix-eye">Front page · scanned</p><h1>Snow closes the pass road for nine days</h1><p class="bg-dix-sub" style="margin:0 0 14px">Post arrives by sledge as crews dig out the upper switchbacks.</p><a href="#">Open the full scan →</a></article>
</main>
</section>
<script>
(()=>{
const S=document.currentScript?document.currentScript.previousElementSibling:document.querySelector(".bg-dix");
const root=S&&S.classList.contains("bg-dix")?S:document.querySelector(".bg-dix");
const cv=root.querySelector("canvas"),gl=cv.getContext("webgl",{antialias:false});
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches,IMG=true;
const off=()=>root.classList.add("nogl");
if(!gl)return off();
const FS="precision highp float;uniform vec2 r,m,us;uniform float t,ld;uniform sampler2D u;uniform vec3 k0,k1,k2;\nfloat h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}\nvec2 h2(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}\nfloat n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\nfloat fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=mat2(.8,.6,-.6,.8)*p*2.03+1.7;a*=.5;}return v;}\nvec2 cover(vec2 q){float ra=r.x/r.y,ia=us.x/us.y;vec2 s=ra>ia?vec2(1.,ia/ra):vec2(ra/ia,1.);return (q-.5)*s+.5;}\nvec3 img(vec2 q){return texture2D(u,clamp(q,.001,.999)).rgb;}\nfloat lum(vec3 c){return dot(c,vec3(.299,.587,.114));}\n\nfloat b2(vec2 a){a=floor(a);return fract(a.x/2.+a.y*a.y*.75);}\nfloat b8(vec2 a){return b2(.25*a)*.0625+b2(.5*a)*.25+b2(a);}\nvoid main(){float px=3.;vec2 cell=floor(gl_FragCoord.xy/px)*px+px*.5;vec2 q=cover(cell/r);\nfloat l=lum(img(q));l=clamp((l-.5)*1.25+.52,0.,1.);float d=step(b8(gl_FragCoord.xy/px)/1.33,l);\nvec3 col=mix(k0,k1,d);vec2 a=(gl_FragCoord.xy/r-m)*vec2(r.x/r.y,1.);float lens=smoothstep(.16,.15,length(a));\ncol=mix(col,img(cover(gl_FragCoord.xy/r)),lens);col=mix(k1,col,ld);gl_FragColor=vec4(col,1);}";
const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
const P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}"));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(P);
if(!gl.getProgramParameter(P,gl.LINK_STATUS))return off();
gl.useProgram(P);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};["r","m","us","t","ld","k0","k1","k2"].forEach(k=>U[k]=gl.getUniformLocation(P,k));
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
let fr=0,ready=!IMG,vis=true,raf=0,t0=performance.now(),mx=.5,my=.5,sx=.5,sy=.5,ld=0,ldT=0;
const pal=k=>{k.split(",").forEach((c,i)=>gl.uniform3fv(U["k"+i],hex(c)));if(RM)draw()};
if(IMG){const im=root.querySelector("img"),tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,...p));
  const go=()=>{try{gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im)}catch(e){return off()}gl.uniform2f(U.us,im.naturalWidth,im.naturalHeight);ready=true;ldT=performance.now();loop()};
  im.complete&&im.naturalWidth?go():(im.onload=go,im.onerror=off)}
function size(){const d=Math.min(devicePixelRatio||1,1.5)*1,w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(U.r,w,h)}
function draw(){if(!ready)return;size();const now=performance.now();sx+=(mx-sx)*.06;sy+=(my-sy)*.06;
  gl.uniform1f(U.t,RM?8:(now-t0)/1000);gl.uniform2f(U.m,sx,sy);gl.uniform1f(U.ld,IMG?Math.min(1,(now-ldT)/900):1);gl.drawArrays(gl.TRIANGLES,0,3)}
function loop(){cancelAnimationFrame(raf);if(RM){draw();if(IMG&&performance.now()-ldT<1000)raf=requestAnimationFrame(loop);return}if(!vis||document.hidden)return;if(fr++%1===0)draw();raf=requestAnimationFrame(loop)}
root.addEventListener("pointermove",e=>{const b=root.getBoundingClientRect();mx=(e.clientX-b.left)/b.width;my=1-(e.clientY-b.top)/b.height});
root.addEventListener("pointerleave",()=>{mx=.5;my=.5});
new IntersectionObserver(([e])=>{vis=e.isIntersecting;loop()}).observe(root);
document.addEventListener("visibilitychange",loop);
new ResizeObserver(()=>{if(RM)draw()}).observe(root);
root.querySelectorAll("[data-tg]").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")));
root.querySelectorAll("[data-one]").forEach(b=>b.addEventListener("click",()=>b.parentNode.querySelectorAll("[data-one]").forEach(x=>x.setAttribute("aria-pressed",x===b))));
const btns=[...root.querySelectorAll("[data-k]")];
btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.setAttribute("aria-pressed",x===b));pal(b.dataset.k);const s=root.style;["ink","fb"].forEach(k=>b.dataset[k]?s.setProperty("--"+k,b.dataset[k]):s.removeProperty("--"+k))});
pal("#1b1a17,#efe9dc,#efe9dc");loop();
})();
</script>

<style>
.pld{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.pld :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pld ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.pld *,.pld *::before,.pld *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.pld{min-height:100vh;display:grid;place-items:center;padding:48px 16px}
.pld-stage{position:relative;width:min(360px,100%);display:grid;justify-items:center}
.pld-cam{position:relative;z-index:2;width:100%;height:150px;border-radius:26px 26px 18px 18px;background:linear-gradient(var(--sf),var(--sf2));box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.pld-cam::before{content:"";position:absolute;left:50%;top:26px;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#3a4a63 0 12%,#0b0d12 40%,#1b1f27 62%,#2b2f37 64% 70%,#0d0f13 72%);box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--line)}
.pld-slot{position:absolute;left:12%;right:12%;bottom:12px;height:6px;border-radius:3px;background:#0b0b0d}
.pld-flash{position:absolute;right:22px;top:20px;width:44px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f5f5f5,#c9c9c9);box-shadow:inset 0 0 0 1px #0002}
.pld-shoot{position:absolute;left:20px;top:22px;width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:var(--ac-fg);cursor:pointer;box-shadow:0 3px 0 color-mix(in oklab,var(--ac),#000 30%);transition:transform .12s ease-out,box-shadow .12s ease-out}
.pld-shoot:active{transform:translateY(3px);box-shadow:0 0 0 color-mix(in oklab,var(--ac),#000 30%)}
.pld-shoot:disabled{opacity:.5;cursor:default}
.pld-tray{position:relative;width:100%;display:grid;justify-items:center;margin-top:-10px;clip-path:inset(0 -300px -300px -300px)}
.pld-photo{position:relative;width:82%;margin:0;padding:12px 12px 52px;background:#fbfaf6;border-radius:3px;box-shadow:0 18px 30px -16px rgb(0 0 0/.45),0 0 0 1px #0000000f;transform:translateY(-103%);cursor:grab;touch-action:none;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.pld-photo.out{transform:translateY(0) rotate(-2deg)}
.pld-photo:active{cursor:grabbing}
.pld-img{aspect-ratio:1;background:#1b1a17;overflow:hidden;position:relative}
.pld-img img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(var(--b,0)) saturate(var(--s,0)) contrast(var(--c,.4)) sepia(var(--sp,.8)) blur(var(--bl,6px))}
.pld-cap{position:absolute;left:12px;right:12px;bottom:12px;height:30px;border:0;background:none;font:italic 400 22px "Instrument Serif",serif;color:#2a2620;text-align:center}
.pld-cap:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pld-meta{margin-top:20px;min-height:22px;color:var(--mu);font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.pld-flashfx{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
</style>
<section class="pld">
  <div class="pld-stage">
    <div class="pld-cam"><span class="pld-flash" aria-hidden="true"></span><button class="pld-shoot" type="button" aria-label="Take a photo"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg></button><span class="pld-slot" aria-hidden="true"></span></div>
    <div class="pld-tray"><figure class="pld-photo">
      <div class="pld-img"><img src="media/pics/c/1035.jpg" alt="A waterfall pouring over mossy rocks" crossorigin="anonymous"></div>
      <label style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)" for="pld-cap">Caption</label>
      <input class="pld-cap" id="pld-cap" value="summer, the falls" maxlength="28" autocomplete="off">
    </figure></div>
    <p class="pld-meta" aria-live="polite">Press the red button. Shake the photo to develop it faster.</p>
  </div>
  <div class="pld-flashfx" aria-hidden="true"></div>
</section>
<script>
(()=>{
const R=document.querySelector(".pld"),shoot=R.querySelector(".pld-shoot"),ph=R.querySelector(".pld-photo"),img=R.querySelector(".pld-img img"),meta=R.querySelector(".pld-meta"),fx=R.querySelector(".pld-flashfx");
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let dev=0,run=false,last=0,drag=null,shake=0;
function paint(){const k=dev,e=1-Math.pow(1-k,2);img.style.setProperty("--b",(.08+e*.92).toFixed(3));img.style.setProperty("--s",e.toFixed(3));img.style.setProperty("--c",(.4+e*.6).toFixed(3));img.style.setProperty("--sp",(.8*(1-e)).toFixed(3));img.style.setProperty("--bl",(6*(1-e)).toFixed(2)+"px")}
function loop(t){if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;shake*=.92;dev=Math.min(1,dev+dt*(1/9)*(1+shake*4));paint();
  if(dev>=1){run=false;meta.textContent="Developed. Give it a caption.";shoot.disabled=false;return}meta.textContent="Developing… "+Math.round(dev*100)+"%";requestAnimationFrame(loop)}
shoot.onclick=()=>{shoot.disabled=true;dev=0;paint();ph.classList.remove("out");
  if(!RM)fx.animate([{opacity:.85},{opacity:0}],{duration:420,easing:"ease-out"});
  setTimeout(()=>{ph.classList.add("out");run=true;last=performance.now();requestAnimationFrame(loop)},RM?0:350)};
ph.addEventListener("pointerdown",e=>{if(e.target.closest("input")||!ph.classList.contains("out"))return;ph.setPointerCapture(e.pointerId);drag={x:e.clientX,vx:0,lx:e.clientX};ph.style.transition="none"});
ph.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,v=e.clientX-drag.lx;drag.lx=e.clientX;if(Math.sign(v)!==Math.sign(drag.vx)&&Math.abs(v)>3)shake=Math.min(2,shake+.35);drag.vx=v;
  const d=Math.max(-60,Math.min(60,dx));ph.style.transform=`translate(${d}px,0) rotate(${-2+d/12}deg)`});
const end=()=>{if(!drag)return;drag=null;ph.style.transition="";ph.style.transform=""};
ph.addEventListener("pointerup",end);ph.addEventListener("pointercancel",end);
paint();
})();
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}

.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}

.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}

.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}

.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.cs-w{width:min(560px,100%);display:grid;gap:20px;justify-items:center;text-align:center}.cs-w h1{margin:0;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.02em}
.cs-cd{display:flex;gap:6px;align-items:flex-start}.cs-u{display:grid;gap:6px;justify-items:center}.cs-u small{font-size:12px;color:var(--mu)}.cs-ds{display:flex;gap:3px}
.cs-d{position:relative;width:clamp(28px,7vw,52px);height:clamp(42px,10vw,72px);perspective:300px;font:600 clamp(22px,6vw,46px)/1 'Geist Mono',monospace}.cs-d span{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--fg);color:var(--bg);display:flex;justify-content:center;backface-visibility:hidden}.cs-d .t{top:0;border-radius:8px 8px 0 0;align-items:flex-end;line-height:0}.cs-d .b2{bottom:0;border-radius:0 0 8px 8px;align-items:flex-start;line-height:0;border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent)}
.cs-d .t>i,.cs-d .b2>i{font-style:normal;display:block}.cs-d .t>i{transform:translateY(50%)}.cs-d .b2>i{transform:translateY(-50%)}
.cs-d .fl{top:0;border-radius:8px 8px 0 0;align-items:flex-end;transform-origin:bottom;animation:csf .45s cubic-bezier(.4,0,.6,1) forwards;z-index:2}@keyframes csf{to{transform:rotateX(-180deg)}}
.cs-sep{font:600 clamp(18px,5vw,46px)/clamp(42px,10vw,72px) 'Geist Mono',monospace;color:var(--mu)}
.cs-f{display:flex;gap:8px;width:100%}.cs-f .in{height:48px;font-size:16px}.cs-f .b{height:48px;flex:none}.cs-er{color:var(--err);font-size:13px;margin:-12px 0 0}.cs-er:empty{display:none}
.cs-ok{display:grid;gap:8px;animation:cso .3s cubic-bezier(.23,1,.32,1)}.cs-ok p{margin:0}.cs-ok b{font-size:20px}.cs-rf{display:flex;gap:8px;align-items:center;justify-content:center}.cs-rf code{font:14px 'Geist Mono',monospace;background:var(--sf2);padding:6px 10px;border-radius:8px}@keyframes cso{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.cs-d .fl{animation:none;display:none}}
@media (max-width:480px){.cs-f{flex-direction:column}}
</style>
<div class="k cs"><main class="cs-w"><h1>Ferry opens to everyone in</h1><div class="cs-cd" id="cd" role="timer" aria-live="off"></div>
<form id="f" class="cs-f" novalidate><label class="vh" for="em">Email</label><input class="in" id="em" type="email" autocomplete="email" placeholder="you@example.com"><button class="b ac" id="sb">Join the waitlist</button></form><p class="cs-er" id="er" role="alert"></p>
<div class="cs-ok" id="ok" hidden><p>You're <b class="tn" id="pos"></b> on the list.</p><p class="mu">Share your link. Each friend who joins moves you up 25 places.</p><div class="cs-rf"><code id="rf">ferry.app/r/k7q2</code><button class="b sec sm" id="cp"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy link</span></button></div></div></main></div>
<script>
const end=Date.now()+((3*24+7)*3600+42*60+15)*1000,cd=document.getElementById('cd'),U=['days','hours','min','sec'];
cd.innerHTML=U.map((u,i)=>`<div class="cs-u"><div class="cs-ds" data-u="${i}"><div class="cs-d"></div><div class="cs-d"></div></div><small>${u}</small></div>${i<3?'<span class="cs-sep" aria-hidden="true">:</span>':''}`).join('');
const prev=['','','',''];function digit(el,v,o){el.innerHTML=`<span class="t"><i>${v}</i></span><span class="b2"><i>${v}</i></span>${o!==undefined&&o!==v?`<span class="fl t"><i>${o}</i></span>`:''}`}
function tick(){let s=Math.max(0,Math.floor((end-Date.now())/1000));const v=[Math.floor(s/86400),Math.floor(s/3600)%24,Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0'));v.forEach((x,i)=>{if(x!==prev[i]){const D=cd.querySelectorAll(`[data-u="${i}"] .cs-d`);[0,1].forEach(j=>{if(x[j]!==prev[i][j])digit(D[j],x[j],prev[i][j]||undefined)});prev[i]=x}});cd.setAttribute('aria-label',`${+v[0]} days ${+v[1]} hours ${+v[2]} minutes`)}tick();setInterval(tick,1000);
document.getElementById('f').onsubmit=e=>{e.preventDefault();const em=document.getElementById('em'),ok=/^\S+@\S+\.\S+$/.test(em.value);em.setAttribute('aria-invalid',!ok);document.getElementById('er').textContent=ok?'':'Enter your email to join.';if(!ok)return em.focus();const b=document.getElementById('sb');b.disabled=true;b.textContent='Joining…';setTimeout(()=>{document.getElementById('f').hidden=true;document.getElementById('pos').textContent='#4,218';document.getElementById('ok').hidden=false},700)};
document.getElementById('cp').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText('https://ferry.app/r/k7q2'):Promise.reject()).catch(()=>{});document.querySelector('#cp span').textContent='Copied'};
</script>

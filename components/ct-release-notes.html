<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.rn{width:min(760px,100%)}.rn-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}.rn-h h1{margin:0;font-size:28px;letter-spacing:-.02em}.rn-f{display:flex;gap:4px}.rn-f button{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--mu)}.rn-f [aria-pressed=true]{background:var(--sf2);color:var(--fg)}
.rn-v{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:24px 0;border-top:1px solid var(--line)}.rn-v aside{display:grid;gap:2px;align-content:start;position:sticky;top:16px}.rn-v aside b{font:600 16px 'Geist Mono',monospace;display:flex;gap:6px;align-items:center}.rn-v aside button{width:28px;height:28px;border-radius:6px;color:var(--mu);display:grid;place-items:center}.rn-v aside button:hover{background:var(--sf2);color:var(--fg)}.rn-v aside .i{width:14px;height:14px}.rn-v time{font-size:13px;color:var(--mu)}
.rn-v ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}.rn-v li{display:grid;grid-template-columns:80px 1fr;gap:12px;font-size:15px;line-height:1.55}.rn-t{font:600 11px 'Geist Mono',monospace;text-transform:uppercase;letter-spacing:.04em;padding:3px 0}.rn-t.new{color:var(--ok)}.rn-t.imp{color:var(--info)}.rn-t.fix{color:var(--mu)}
.rn-v li.rn-br{display:block;grid-column:1/-1;padding:12px 14px;border-radius:10px;background:var(--warn-sf);font-size:14px}.rn-br pre{margin:8px 0 0;font:12.5px/1.6 'Geist Mono',monospace;background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto}
.rn-m{position:fixed;bottom:20px;left:50%;translate:-50% 0;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;margin:0}.rn-m:empty{display:none}
@media (max-width:600px){.rn-v{grid-template-columns:1fr;gap:10px}.rn-v aside{position:static;grid-auto-flow:column;justify-content:start;gap:12px;align-items:center}.rn-v li{grid-template-columns:1fr}}
</style>
<div class="k"><div class="rn"><div class="rn-h"><h1>Release notes</h1><div class="rn-f" role="group" aria-label="Filter" id="f"><button aria-pressed="true" data-t="">All</button><button aria-pressed="false" data-t="new">New</button><button aria-pressed="false" data-t="imp">Improved</button><button aria-pressed="false" data-t="fix">Fixed</button></div></div><div id="l"></div><p class="rn-m" id="m" role="status"></p></div></div>
<script>
const V=[["2.14.0","12 Nov 2026",[["new","Instant rollbacks from the CLI with shipit rollback."],["imp","Build logs stream 3× faster on large projects."],["fix","Preview URLs no longer 404 for branch names with slashes."]],"Node 18 is no longer supported. Set engines.node to 20 or later:\n\"engines\": { \"node\": \">=20\" }"],["2.13.2","4 Nov 2026",[["fix","Environment variables with = in the value are parsed correctly."],["fix","Fixed a crash when the project folder name contained spaces."]]],["2.13.0","28 Oct 2026",[["new","Region pinning with --region."],["imp","Cold starts reduced by ~40% for edge functions."],["imp","Clearer error when a domain's DNS is misconfigured."]]]];
const l=document.getElementById('l');let t='';
function draw(){l.innerHTML=V.map(([v,d,E,br])=>{const F=E.filter(e=>!t||e[0]===t);if(!F.length&&!(br&&!t))return'';return`<section class="rn-v" id="v${v.replace(/\./g,'-')}"><aside><b>v${v}<button data-v="${v}" aria-label="Copy link to v${v}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg></button></b><time>${d}</time></aside><ul>${br&&!t?`<li class="rn-br"><b>Breaking change.</b> ${br.split('\n')[0]}<pre>${br.split('\n')[1]}</pre></li>`:''}${F.map(([k,x])=>`<li><span class="rn-t ${k}">${{new:'New',imp:'Improved',fix:'Fixed'}[k]}</span><span>${x}</span></li>`).join('')}</ul></section>`}).join('')}
document.getElementById('f').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#f button').forEach(x=>x.setAttribute('aria-pressed',x===b));t=b.dataset.t;draw()};
l.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const u=location.href.split('#')[0]+'#v'+b.dataset.v.replace(/\./g,'-');(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).catch(()=>{});const m=document.getElementById('m');m.textContent='Link to v'+b.dataset.v+' copied';setTimeout(()=>m.textContent='',1600)};draw();
</script>

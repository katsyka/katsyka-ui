<style>
.si{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.si :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.si ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.si *,.si *::before,.si *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.si{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.si-pn{width:min(640px,100%);display:grid;gap:14px}
.si-c{padding:20px 22px;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.si-lb{font:500 11px/1 "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:14px}
.si-row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.si-d{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.si-d i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--c)}
.si-d i.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:si-p 1.8s ease-out infinite}
@keyframes si-p{to{transform:scale(2.8);opacity:0}}
.si-pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 9px;border-radius:99px;font-size:13px;font-weight:550;background:color-mix(in oklab,var(--c) 12%,var(--bg));color:color-mix(in oklab,var(--c) 75%,var(--fg));border:1px solid color-mix(in oklab,var(--c) 25%,transparent)}
.si-pill i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.si-pill svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.si-pill .sp{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:si-r .8s linear infinite}
@keyframes si-r{to{transform:rotate(1turn)}}
.si-sys{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--ok-sf);border:1px solid color-mix(in oklab,var(--ok) 25%,transparent)}
.si-sys b{font-size:14.5px;font-weight:600}
.si-sys a{margin-left:auto;font-size:13px;color:var(--fg);white-space:nowrap}
.si-up{margin-top:14px}
.si-up .hd{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px}
.si-up .hd span{color:var(--mu);font:500 12.5px "Geist Mono",monospace}
.si-bars{display:flex;gap:2px;height:30px}
.si-bars i{flex:1;border-radius:2px;background:var(--ok);opacity:.85;transition:opacity .15s}
.si-bars i:hover{opacity:1;transform:scaleY(1.08)}
.si-bars i.w{background:var(--warn)}.si-bars i.e{background:var(--err)}
.si-ax{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--mu)}
.si-tip{min-height:18px;margin-top:4px;font-size:12.5px;color:var(--mu);text-align:center}
.si-av{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:650}
.si-av i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2.5px var(--bg)}
.si-av i.dnd::after{content:"";position:absolute;left:3px;right:3px;top:5px;height:2px;border-radius:1px;background:#fff}
.si-av i.away{background:var(--bg);box-shadow:inset 0 0 0 2.5px var(--warn),0 0 0 2.5px var(--bg)}
</style>
<div class="si">
  <div class="si-pn">
    <div class="si-c"><div class="si-lb">System status</div>
      <div class="si-sys" role="status"><span class="si-d" style="--c:var(--ok)"><i class="live"></i></span><b>All systems operational</b><a href="#">Status page →</a></div>
      <div class="si-up"><div class="hd"><b style="font-weight:550">API</b><span>99.97% uptime</span></div><div class="si-bars" id="siB" role="img" aria-label="90 day uptime, 2 incidents"></div><div class="si-ax"><span>90 days ago</span><span>Today</span></div><div class="si-tip" id="siT" aria-live="polite"></div></div></div>
    <div class="si-c"><div class="si-lb">Status pills</div>
      <div class="si-row">
        <span class="si-pill" style="--c:var(--ok)"><i></i>Active</span>
        <span class="si-pill" style="--c:var(--warn)"><i></i>Pending</span>
        <span class="si-pill" style="--c:var(--err)"><i></i>Failed</span>
        <span class="si-pill" style="--c:var(--info)"><span class="sp" aria-hidden="true"></span>Building</span>
        <span class="si-pill" style="--c:var(--mu)"><i></i>Draft</span>
        <span class="si-pill" style="--c:var(--ok)"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Verified</span>
      </div></div>
    <div class="si-c"><div class="si-lb">Presence</div>
      <div class="si-row">
        <span class="si-av" style="background:#c2410c;--c:var(--ok)" role="img" aria-label="Mira, online">MO<i></i></span>
        <span class="si-av" style="background:#0e7490;--c:var(--err)" role="img" aria-label="Jun, do not disturb">JL<i class="dnd"></i></span>
        <span class="si-av" style="background:#7c3aed" role="img" aria-label="Sofia, away">SR<i class="away"></i></span>
        <span class="si-av" style="background:#71717a;--c:var(--ctl)" role="img" aria-label="Tomás, offline">TB<i></i></span>
        <span class="si-d" style="--c:var(--ok)"><i class="live"></i>Live · 1,204 watching</span>
        <span class="si-d" style="--c:var(--err)"><i class="live"></i>Recording</span>
      </div></div>
  </div>
</div>
<script>
const B=document.getElementById("siB"),T=document.getElementById("siT"),D=new Date();
for(let i=89;i>=0;i--){const b=document.createElement("i"),d=new Date(D);d.setDate(D.getDate()-i);const st=i===61?"e":(i===23||i===7)?"w":"";if(st)b.className=st;
  const lbl=`${d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}: ${st==="e"?"Major outage · 42 min":st==="w"?"Degraded performance · 11 min":"No incidents"}`;
  b.addEventListener("pointerenter",()=>T.textContent=lbl);B.append(b)}
B.addEventListener("pointerleave",()=>T.textContent="");
document.querySelector('.si a[href="#"]').addEventListener("click",e=>e.preventDefault());
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}

.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}

.mk-m{color:inherit;background:linear-gradient(104deg,transparent .4em,color-mix(in srgb,var(--warn) 34%,transparent) .5em calc(100% - .4em),transparent calc(100% - .3em)) 0 85%/0 72% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .2em;margin:0 -.2em;transition:background-size 1s cubic-bezier(.6,.1,.3,1) var(--d,0s)}

<div class="k"><article class="mk"><p>Most dark modes fail for one reason: they <mark class="mk-m">invert the light theme</mark> and call it done. Good ones <span class="mk-u">rebuild the palette<svg viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8c40-6 90-7 196-3"/></svg></span>, lift surfaces instead of adding shadows, and <mark class="mk-m" style="--d:.5s">check contrast on every level</mark>. That's the <span class="mk-o">difference<svg viewBox="0 0 120 50" preserveAspectRatio="none" aria-hidden="true"><path d="M60 4C20 2 3 14 4 27c1 15 40 20 70 17s45-12 42-24C113 6 80 2 50 6"/></svg></span> people feel without naming it.</p><button class="b sec" id="rp">Replay</button></article></div>
<script>

const a=document.querySelector(".mk");new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&a.classList.add("on")),{threshold:.4}).observe(a);

</script>

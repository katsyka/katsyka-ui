<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.ap{align-items:start}.ap-w{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.ap-c{display:grid;gap:22px}.ap-c h1{margin:0;font-size:24px;letter-spacing:-.02em}.ap-c fieldset{border:0;margin:0;padding:0}
.ap-th{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ap-th button{display:grid;gap:8px;font-size:13px;font-weight:550;justify-items:start}.ap-mini{width:100%;aspect-ratio:4/3;border-radius:10px;border:2px solid var(--line);display:block;transition:border-color .15s}.ap-th [aria-checked=true] .ap-mini{border-color:var(--ac)}
.ap-mini.lt{background:linear-gradient(#fff 22%,#f4f4f5 22%)}.ap-mini.dk{background:linear-gradient(#27272a 22%,#18181b 22%)}.ap-mini.sys{background:linear-gradient(90deg,transparent 50%,#18181b 50%),linear-gradient(#fff 22%,#f4f4f5 22%)}
.ap-ac{display:flex;gap:10px}.ap-ac button{width:36px;height:36px;border-radius:50%;background:var(--c);outline-offset:3px}.ap-ac [aria-checked=true]{outline:2px solid var(--fg)}
.ap-seg{display:inline-flex;background:var(--sf2);border-radius:10px;padding:3px}.ap-seg button{height:34px;padding:0 14px;border-radius:8px;font-weight:550;color:var(--mu)}.ap-seg [aria-checked=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px #0000001a}
.ap-fs{display:grid;gap:4px}.ap-fs .lbl{display:flex;justify-content:space-between}.ap-fs input{accent-color:var(--ac)}.ap-rm{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}.ap-rm input{width:18px;height:18px;accent-color:var(--ac)}.ap-rm small{width:100%;padding-left:26px;margin-top:-6px}
.ap-pv{--pa:#c2410c;--pd:16px;--pf:15px;color-scheme:light;--pbg:#fff;--psf:#f4f4f5;--pfg:#18181b;--pmu:#71717a;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--pbg);color:var(--pfg);position:sticky;top:16px;transition:background .3s,color .3s}
.ap-pv.dark{--pbg:#18181b;--psf:#232327;--pfg:#f4f4f5;--pmu:#a1a1aa}.ap-pt{display:flex;gap:6px;padding:10px 12px;background:var(--psf)}.ap-pt i{width:10px;height:10px;border-radius:50%;background:var(--pmu);opacity:.4}
.ap-pb{display:grid;grid-template-columns:110px 1fr;font-size:var(--pf);min-height:260px}.ap-pb aside{background:var(--psf);padding:var(--pd) 10px;display:grid;gap:calc(var(--pd)/3);align-content:start}.ap-pb aside span{padding:calc(var(--pd)/3) 8px;border-radius:6px;color:var(--pmu)}.ap-pb aside .on{background:color-mix(in srgb,var(--pa) 14%,transparent);color:var(--pa);font-weight:600}
.ap-pb>div{padding:var(--pd);display:grid;gap:calc(var(--pd)/2);align-content:start}.ap-pb p{margin:0;color:var(--pmu);line-height:1.5}.ap-pb button{justify-self:start;background:var(--pa);color:#fff;border-radius:8px;padding:calc(var(--pd)/3) calc(var(--pd)*.9);font-weight:600;font-size:.9em;transition:background .3s}
@media (max-width:760px){.ap-w{grid-template-columns:1fr}.ap-pv{position:static}}
</style>
<div class="k ap"><div class="ap-w"><div class="ap-c"><h1>Appearance</h1>
<fieldset><legend class="lbl">Theme</legend><div class="ap-th" role="radiogroup"><button role="radio" aria-checked="true" data-t="system"><span class="ap-mini sys"></span>System</button><button role="radio" aria-checked="false" data-t="light"><span class="ap-mini lt"></span>Light</button><button role="radio" aria-checked="false" data-t="dark"><span class="ap-mini dk"></span>Dark</button></div></fieldset>
<fieldset><legend class="lbl">Accent</legend><div class="ap-ac" role="radiogroup" id="ac"></div></fieldset>
<fieldset><legend class="lbl">Density</legend><div class="ap-seg" role="radiogroup" id="dn"><button role="radio" aria-checked="false" data-d="12">Compact</button><button role="radio" aria-checked="true" data-d="16">Default</button><button role="radio" aria-checked="false" data-d="22">Roomy</button></div></fieldset>
<label class="ap-fs"><span class="lbl">Text size <b class="tn" id="fv">15px</b></span><input type="range" id="fs" min="13" max="19" value="15"></label>
<label class="ap-rm"><input type="checkbox" id="rm"> Reduce motion <small class="mu">Overrides the system setting</small></label></div>
<div class="ap-pv" id="pv" aria-label="Preview"><div class="ap-pt"><i></i><i></i><i></i></div><div class="ap-pb"><aside><span class="on">Inbox</span><span>Drafts</span><span>Sent</span></aside><div><b>Quarterly report draft</b><p>Hi team, the numbers for Q3 are in and they look better than expected.</p><button>Reply</button></div></div></div></div></div>
<script>
const pv=document.getElementById('pv'),A=[['Ember','#c2410c'],['Ocean','#0369a1'],['Moss','#4d7c0f'],['Plum','#7e22ce'],['Graphite','#3f3f46']],ac=document.getElementById('ac');
ac.innerHTML=A.map(([n,c],i)=>`<button role="radio" aria-checked="${!i}" aria-label="${n}" style="--c:${c}" data-c="${c}"></button>`).join('');
const radio=(g,b)=>g.querySelectorAll('[role=radio]').forEach(x=>x.setAttribute('aria-checked',x===b));
const mq=matchMedia('(prefers-color-scheme:dark)');let th='system';const apply=()=>pv.classList.toggle('dark',th==='dark'||(th==='system'&&mq.matches));mq.addEventListener('change',apply);
document.querySelector('.ap-th').onclick=e=>{const b=e.target.closest('button');if(!b)return;radio(b.parentElement,b);th=b.dataset.t;apply()};
ac.onclick=e=>{const b=e.target.closest('button');if(!b)return;radio(ac,b);pv.style.setProperty('--pa',b.dataset.c)};
document.getElementById('dn').onclick=e=>{const b=e.target.closest('button');if(!b)return;radio(b.parentElement,b);pv.style.setProperty('--pd',b.dataset.d+'px')};
document.getElementById('fs').oninput=e=>{pv.style.setProperty('--pf',e.target.value+'px');document.getElementById('fv').textContent=e.target.value+'px'};
document.getElementById('rm').onchange=e=>pv.style.transition=e.target.checked?'none':'';apply();
</script>

<style>
.sr{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.sr :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.sr *,.sr *::before,.sr *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.sr{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
.sr-card{width:min(400px,100%);padding:24px;border-radius:28px;background:var(--sf);box-shadow:var(--shadow)}
.sr-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sr-top div{padding:12px 14px;border-radius:16px;background:var(--bg)}
.sr-top small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.sr-top b{display:block;font-size:26px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:2px}
.sr-ring{position:relative;width:300px;max-width:100%;aspect-ratio:1;margin:0 auto;touch-action:none}
.sr-ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sr-track{fill:none;stroke:var(--sf2);stroke-width:40}
.sr-arc{fill:none;stroke:url(#srG);stroke-width:40;stroke-linecap:round}
.sr-hr{font:500 11px "Geist Mono",monospace;fill:var(--mu);text-anchor:middle;dominant-baseline:middle}
.sr-mk{stroke:var(--ctl);stroke-width:1.5}
.sr-h{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--fg);box-shadow:0 2px 8px light-dark(#0003,#000a);cursor:grab;font-size:18px;touch-action:none}
.sr-h:active{cursor:grabbing}.sr-h svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:static}
.sr-mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.sr-mid b{display:block;font-size:34px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.sr-mid span{font-size:13px;font-weight:550}
.sr-mid span.ok{color:var(--ok)}.sr-mid span.lo{color:var(--warn)}.sr-mid span.hi{color:var(--info)}
.sr-note{margin:14px 0 0;font-size:13px;color:var(--mu);text-align:center}
</style>
<section class="sr"><div class="sr-card">
  <div class="sr-top"><div><small>🌙 Bedtime</small><b data-o="bed">23:00</b></div><div><small>☀️ Wake up</small><b data-o="wake">07:00</b></div></div>
  <div class="sr-ring">
    <svg viewBox="0 0 300 300"><defs><linearGradient id="srG" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><circle class="sr-track" cx="150" cy="150" r="124"/><path class="sr-arc"/><g class="sr-dial"></g></svg>
    <div class="sr-mid"><div><b data-o="dur">8h 0m</b><span data-o="q" class="ok">Within your goal</span></div></div>
    <div class="sr-h" data-k="bed" role="slider" tabindex="0" aria-label="Bedtime"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
    <div class="sr-h" data-k="wake" role="slider" tabindex="0" aria-label="Wake-up time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
  </div>
  <p class="sr-note">Drag either handle, or focus it and use arrow keys (5 min) and Page Up/Down (1 h).</p>
</div></section>
<script>
(()=>{
const R=124,C=150,DAY=1440,ring=document.querySelector(".sr-ring"),arc=ring.querySelector(".sr-arc"),dial=ring.querySelector(".sr-dial");
let m={bed:23*60,wake:7*60};
let g="";for(let h=0;h<24;h++){const a=h/24*2*Math.PI-Math.PI/2;g+=`<line class="sr-mk" x1="${C+Math.cos(a)*92}" y1="${C+Math.sin(a)*92}" x2="${C+Math.cos(a)*(h%6?96:100)}" y2="${C+Math.sin(a)*(h%6?96:100)}"/>`;
  if(h%3===0)g+=`<text class="sr-hr" x="${C+Math.cos(a)*80}" y="${C+Math.sin(a)*80}">${h===0?"12AM":h===12?"12PM":h%12+(h<12?"":"")}</text>`}dial.innerHTML=g;
const pt=min=>{const a=min/DAY*2*Math.PI-Math.PI/2;return[C+Math.cos(a)*R,C+Math.sin(a)*R]};
const hm=x=>`${String(x/60|0).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`;
function draw(){const d=(m.wake-m.bed+DAY)%DAY,[x0,y0]=pt(m.bed),[x1,y1]=pt(m.wake);arc.setAttribute("d",`M${x0} ${y0} A${R} ${R} 0 ${d>720?1:0} 1 ${x1} ${y1}`);
  const w=ring.clientWidth/300;ring.querySelectorAll(".sr-h").forEach(h=>{const[x,y]=pt(m[h.dataset.k]);h.style.left=x*w+"px";h.style.top=y*w+"px";h.setAttribute("aria-valuenow",m[h.dataset.k]);h.setAttribute("aria-valuetext",hm(m[h.dataset.k]))});
  document.querySelector("[data-o=bed]").textContent=hm(m.bed);document.querySelector("[data-o=wake]").textContent=hm(m.wake);
  document.querySelector("[data-o=dur]").textContent=`${d/60|0}h ${d%60}m`;const q=document.querySelector("[data-o=q]");
  q.className=d<420?"lo":d>600?"hi":"ok";q.textContent=d<420?"Below 7 hours":d>600?"Over 10 hours":"Within your goal"}
let drag=null;
ring.querySelectorAll(".sr-h").forEach(h=>{h.addEventListener("pointerdown",e=>{drag=h.dataset.k;h.setPointerCapture(e.pointerId)});
  h.addEventListener("pointermove",e=>{if(drag!==h.dataset.k)return;const r=ring.getBoundingClientRect();let a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))+Math.PI/2;if(a<0)a+=2*Math.PI;m[drag]=Math.round(a/(2*Math.PI)*DAY/5)*5%DAY;draw()});
  h.addEventListener("pointerup",()=>drag=null);
  h.addEventListener("keydown",e=>{const d={ArrowUp:5,ArrowRight:5,ArrowDown:-5,ArrowLeft:-5,PageUp:60,PageDown:-60}[e.key];if(d){e.preventDefault();m[h.dataset.k]=(m[h.dataset.k]+d+DAY)%DAY;draw()}})});
// dragging the arc moves the whole window, keeping the duration
arc.style.pointerEvents="stroke";arc.style.cursor="grab";let arcD=null;
arc.addEventListener("pointerdown",e=>{const r=ring.getBoundingClientRect();arcD={a:Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2)),b:m.bed,w:m.wake};arc.setPointerCapture(e.pointerId)});
arc.addEventListener("pointermove",e=>{if(!arcD)return;const r=ring.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2)),dm=Math.round((a-arcD.a)/(2*Math.PI)*DAY/5)*5;m.bed=(arcD.b+dm+DAY*2)%DAY;m.wake=(arcD.w+dm+DAY*2)%DAY;draw()});
arc.addEventListener("pointerup",()=>arcD=null);
new ResizeObserver(draw).observe(ring);draw();
})();
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.su{width:min(420px,100%);padding:28px}.su-st{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 24px;counter-reset:s}.su-st li{flex:1;font-size:12px;color:var(--mu);display:grid;gap:8px;counter-increment:s}.su-st li::before{content:"";height:4px;border-radius:2px;background:var(--sf2);transition:background .3s}.su-st li.on,.su-st li.dn{color:var(--fg);font-weight:550}.su-st li.on::before,.su-st li.dn::before{background:var(--ac)}
.su fieldset{border:0;padding:0;margin:0;display:grid;gap:14px;animation:suf .3s var(--ease)}.su legend{font-size:20px;font-weight:650;letter-spacing:-.02em;margin-bottom:14px;padding:0}.su .in{height:44px;font-size:16px}
@keyframes suf{from{opacity:0;transform:translateX(10px)}}
.su-m{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:-6px}.su-m i{height:4px;border-radius:2px;background:var(--sf2);transition:background .2s}.su-m[data-l="1"] i:nth-child(-n+1){background:var(--err)}.su-m[data-l="2"] i:nth-child(-n+2){background:var(--warn)}.su-m[data-l="3"] i:nth-child(-n+3){background:var(--ok)}.su-m[data-l="4"] i{background:var(--ok)}
.su-url{margin:0;font:13px 'Geist Mono',monospace}.su-url b{color:var(--fg)}
.su-er{color:var(--err);font-size:13px;margin:12px 0 0}.su-er:empty{display:none}.su-nav{display:flex;justify-content:space-between;margin-top:20px}.su-nav #nx{margin-left:auto;height:44px;min-width:120px}.su-nav .gh{height:44px}
.su-done{text-align:center;display:grid;justify-items:center;gap:8px;padding:12px 0}.su-done>.i{width:52px;height:52px;padding:12px;border-radius:50%;background:var(--ok-sf);color:var(--ok)}.su-done h2{margin:6px 0 0;font-size:20px}.su-done p{margin:0}
</style>
<div class="k">
<div class="card su"><ol class="su-st" id="st"><li class="on">Account</li><li>About you</li><li>Workspace</li></ol>
<form id="f" novalidate>
<fieldset data-s="0"><legend>Create your account</legend><label><span class="lbl">Email</span><input class="in" name="em" type="email" autocomplete="email"></label><label><span class="lbl">Password</span><input class="in" name="pw" type="password" autocomplete="new-password" id="pw"></label><div class="su-m" aria-hidden="true"><i></i><i></i><i></i><i></i></div><small class="mu" id="pm">Use 10+ characters with a number and a symbol.</small></fieldset>
<fieldset data-s="1" hidden><legend>About you</legend><label><span class="lbl">Full name</span><input class="in" name="nm" autocomplete="name"></label><label><span class="lbl">Role</span><select class="in" name="rl"><option value="">Choose…</option><option>Engineering</option><option>Design</option><option>Product</option><option>Marketing</option><option>Other</option></select></label></fieldset>
<fieldset data-s="2" hidden><legend>Name your workspace</legend><label><span class="lbl">Workspace name</span><input class="in" name="ws" id="ws"></label><p class="su-url mu">plane.app/<b id="sl">your-team</b></p></fieldset>
<div data-s="3" hidden class="su-done"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px"><path d="M20 6 9 17l-5-5"/></svg><h2>You're all set</h2><p class="mu" id="sum"></p></div>
<p class="su-er" id="er" role="alert"></p><div class="su-nav"><button type="button" class="b gh" id="bk" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="m15 18-6-6 6-6"/></svg>Back</button><button class="b ac" id="nx">Continue</button></div></form></div>
</div>
<script>
const f=document.getElementById('f'),$=i=>document.getElementById(i),S=[...f.querySelectorAll('[data-s]')],L=[...document.querySelectorAll('.su-st li')];let s=0;
const pw=$('pw'),m=document.querySelector('.su-m');pw.oninput=()=>{const v=pw.value;let l=v?1:0;if(v.length>=10)l++;if(/\d/.test(v)&&/[^\w\s]/.test(v))l++;if(v.length>=14&&/[A-Z]/.test(v))l++;m.dataset.l=l;$('pm').textContent=['Use 10+ characters with a number and a symbol.','Weak: add length.','Okay: add a number and a symbol.','Strong.','Very strong.'][l]};
$('ws').oninput=e=>$('sl').textContent=e.target.value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'your-team';
function check(){const E=f.elements,er=[];if(s==0){if(!/^\S+@\S+\.\S+$/.test(E.em.value))er.push([E.em,'Enter a valid email.']);else if(+m.dataset.l<2)er.push([E.pw,'Choose a stronger password.'])}if(s==1){if(!E.nm.value.trim())er.push([E.nm,'Tell us your name.']);else if(!E.rl.value)er.push([E.rl,'Pick a role.'])}if(s==2&&E.ws.value.trim().length<2)er.push([E.ws,'Workspace name needs 2+ characters.']);f.querySelectorAll('.in').forEach(i=>i.removeAttribute('aria-invalid'));$('er').textContent=er.length?er[0][1]:'';if(er.length){er[0][0].setAttribute('aria-invalid',true);er[0][0].focus()}return!er.length}
function go(n){S[s].hidden=true;s=n;S[s].hidden=false;L.forEach((l,i)=>{l.className=i<s?'dn':i==s?'on':''});$('bk').hidden=s==0||s==3;$('nx').textContent=s==2?'Create workspace':s==3?'Open workspace':'Continue';const fi=S[s].querySelector('input,select');if(fi)fi.focus()}
f.onsubmit=e=>{e.preventDefault();if(s==3)return;if(!check())return;if(s==2){const b=$('nx');b.disabled=true;b.textContent='Creating…';setTimeout(()=>{b.disabled=false;$('sum').textContent=`${f.elements.nm.value.split(' ')[0]}, your workspace “${f.elements.ws.value}” is ready at plane.app/${$('sl').textContent}.`;go(3)},900);return}go(s+1)};
$('bk').onclick=()=>go(s-1);m.dataset.l=0;
</script>

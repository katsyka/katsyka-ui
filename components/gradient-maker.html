<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.gm{padding:16px}.gm-w{display:grid;grid-template-columns:1fr 280px;gap:16px;width:min(980px,100%)}
.gm-c{position:relative;aspect-ratio:4/3;border-radius:22px;touch-action:none;overflow:hidden}
.gm-h{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgb(0 0 0/.3);cursor:grab;padding:0}.gm-h:active{cursor:grabbing;scale:1.15}
.gm-s{display:grid;gap:12px;align-content:start}.gm-pts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gm-pts label{display:grid;gap:4px;font:12px 'Geist Mono',monospace;color:var(--mu);justify-items:center}
.gm-pts input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg);cursor:pointer}
.gm-a{display:flex;gap:8px}.gm-a .b{flex:1;display:flex;gap:6px;align-items:center;justify-content:center}
.gm-code{margin:0;font:12px/1.5 'Geist Mono',monospace;background:var(--sf2);border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:180px;overflow:auto}.gm-st{font-size:13px;min-height:1.2em}
@media (max-width:760px){.gm-w{grid-template-columns:1fr}}
</style>
<div class="k gm"><div class="gm-w"><div class="gm-c" id="c" aria-label="Gradient canvas. Drag the points."></div><div class="gm-s"><div class="gm-pts" id="pts"></div><div class="gm-a"><button class="b" id="sh"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle</button><button class="b ac" id="cp"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>Copy CSS</button></div><pre class="gm-code" id="code"></pre><span role="status" class="mu gm-st" id="st"></span></div></div></div>
<script>
let P=[[20,25,'#ff3d7f'],[80,20,'#ffd23f'],[25,80,'#5b6cff'],[78,75,'#3dd6c6']];
const c=document.getElementById('c'),pts=document.getElementById('pts'),code=document.getElementById('code'),st=document.getElementById('st');
const css=()=>P.map(p=>`radial-gradient(at ${p[0]|0}% ${p[1]|0}%, ${p[2]} 0, transparent 60%)`).join(',\n  ')+`,\n  ${P[0][2]}`;
function paint(){c.style.background=css().replace(/\n\s*/g,'');code.textContent='background:\n  '+css()+';';c.querySelectorAll('.gm-h').forEach((h,i)=>{h.style.left=P[i][0]+'%';h.style.top=P[i][1]+'%';h.style.background=P[i][2]})}
function build(){c.innerHTML='';pts.innerHTML='';P.forEach((p,i)=>{const h=document.createElement('button');h.className='gm-h';h.setAttribute('aria-label','Point '+(i+1)+', arrows to move');h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);h.onpointermove=ev=>{const r=c.getBoundingClientRect();P[i][0]=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));P[i][1]=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));paint()};h.onpointerup=()=>h.onpointermove=null};
h.onkeydown=e=>{const k={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];if(!k)return;e.preventDefault();P[i][0]=Math.max(0,Math.min(100,P[i][0]+k[0]));P[i][1]=Math.max(0,Math.min(100,P[i][1]+k[1]));paint()};c.append(h);
const l=document.createElement('label');l.innerHTML=`<input type="color" value="${p[2]}" aria-label="Colour ${i+1}">${i+1}`;l.querySelector('input').oninput=e=>{P[i][2]=e.target.value;paint()};pts.append(l)});paint()}
const hx=h=>{const f=n=>{const k=(n+h/30)%12,a=.85*Math.min(.6,.4);return Math.round(255*(.6-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
document.getElementById('sh').onclick=()=>{const b=Math.random()*360;P=P.map((p,i)=>[10+Math.random()*80,10+Math.random()*80,hx((b+i*(60+Math.random()*50))%360)]);build()};
document.getElementById('cp').onclick=()=>{const t='background:\n  '+css()+';',done=()=>{st.textContent='CSS copied';setTimeout(()=>st.textContent='',1500)};(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()})};
build();
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.cdt{width:min(720px,100%);display:grid;gap:14px}.cdt-b{border-radius:12px;overflow:hidden;background:#111113;color:#e4e4e7;border:1px solid #27272a}
.cdt-h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #27272a;padding:0 6px 0 4px}.cdt-tb{display:flex;overflow-x:auto}.cdt-tb button{height:40px;padding:0 12px;font:500 13px Geist,sans-serif;color:#a1a1aa;border-bottom:2px solid transparent;white-space:nowrap}.cdt-tb [aria-selected=true]{color:#fafafa;border-color:#fafafa}.cdt-tb button:focus-visible{outline:2px solid #93c5fd;outline-offset:-2px}
.cdt-cp{display:flex;gap:6px;align-items:center;height:30px;padding:0 10px;border-radius:6px;color:#a1a1aa;font-size:12px}.cdt-cp:hover{background:#27272a;color:#fafafa}
.cdt-p{margin:0;padding:14px 0;font:13.5px/1.7 'Geist Mono',monospace;overflow-x:auto;counter-reset:ln}.cdt-p span.l{display:block;padding:0 16px 0 0;white-space:pre}.cdt-p span.l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:3em;padding-right:1em;text-align:right;color:#52525b;user-select:none}.cdt-p span.hl{background:#3b82f61f;box-shadow:inset 2px 0 0 #60a5fa}
.cdt-p .k{color:#c084fc}.cdt-p .s{color:#86efac}.cdt-p .c{color:#71717a}.cdt-p .n{color:#fbbf24}.cdt-n{font-size:13px;margin:0}
</style>
<div class="k"><div class="cdt"><div class="cdt-b" data-hl="3,4"><div class="cdt-h"><div class="cdt-tb" role="tablist" aria-label="Language"></div><button class="cdt-cp" aria-label="Copy code"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy</span></button></div><pre class="cdt-p"></pre></div><p class="mu cdt-n">Pick a language once: every snippet on the page follows.</p><div class="cdt-b" data-ex="2"><div class="cdt-h"><div class="cdt-tb" role="tablist" aria-label="Language"></div><button class="cdt-cp" aria-label="Copy code"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy</span></button></div><pre class="cdt-p"></pre></div></div></div>
<script>
const S=[{curl:`curl https://api.shipit.dev/v1/deploys \\\n  -H "Authorization: Bearer $TOKEN" \\\n  -d project=harbor-web \\\n  -d branch=main`,js:`import { Shipit } from "@shipit/sdk";\n\nconst client = new Shipit(process.env.TOKEN);\nconst deploy = await client.deploys.create({ project: "harbor-web", branch: "main" });\nconsole.log(deploy.url);`,py:`from shipit import Shipit\n\nclient = Shipit(os.environ["TOKEN"])\ndeploy = client.deploys.create(project="harbor-web", branch="main")\nprint(deploy.url)`,go:`client := shipit.New(os.Getenv("TOKEN"))\n\n// create a deploy\nd, err := client.Deploys.Create(ctx, "harbor-web", "main")\nif err != nil { log.Fatal(err) }\nfmt.Println(d.URL)`},{curl:`curl https://api.shipit.dev/v1/deploys/dpl_8f2a/rollback \\\n  -X POST -H "Authorization: Bearer $TOKEN"`,js:`// roll back to the previous release\nawait client.deploys.rollback("dpl_8f2a");`,py:`# roll back to the previous release\nclient.deploys.rollback("dpl_8f2a")`,go:`// roll back to the previous release\nerr := client.Deploys.Rollback(ctx, "dpl_8f2a")`}],NAME={curl:'cURL',js:'JavaScript',py:'Python',go:'Go'};
let lang='curl';try{lang=localStorage.getItem('cdt-lang')||'curl'}catch(e){}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),hl=src=>src.split('\n').map(ln=>{const t=ln.trim();if(t.startsWith('//')||t.startsWith('#'))return'<span class="c">'+esc(ln)+'</span>';return ln.split(/("[^"\n]*")/).map((part,i)=>i%2?'<span class="s">'+esc(part)+'</span>':esc(part).replace(/\b(import|from|const|await|if|return|func|err|nil)\b/g,'<span class="k">$1</span>')).join('')}).join('\n');
const B=[...document.querySelectorAll('.cdt-b')];
function draw(focus){B.forEach((b,i)=>{const ex=S[b.dataset.ex?1:0],H=(b.dataset.hl||'').split(',').map(Number);b.querySelector('.cdt-tb').innerHTML=Object.keys(ex).map(k=>`<button role="tab" aria-selected="${k===lang}" tabindex="${k===lang?0:-1}" data-l="${k}">${NAME[k]}</button>`).join('');b.querySelector('.cdt-p').innerHTML=hl(ex[lang]).split('\n').map((x,j)=>`<span class="l${H.includes(j+1)?' hl':''}">${x||' '}</span>`).join('')});if(focus)focus.querySelector(`[data-l="${lang}"]`).focus()}
B.forEach(b=>{b.querySelector('.cdt-tb').onclick=e=>{const t=e.target.closest('[data-l]');if(!t)return;lang=t.dataset.l;try{localStorage.setItem('cdt-lang',lang)}catch(_){}draw()};b.querySelector('.cdt-tb').onkeydown=e=>{const K=Object.keys(S[0]),i=K.indexOf(lang);if(e.key==='ArrowRight'){lang=K[(i+1)%K.length];draw(b)}if(e.key==='ArrowLeft'){lang=K[(i+K.length-1)%K.length];draw(b)}};
b.querySelector('.cdt-cp').onclick=e=>{const c=e.currentTarget,t=S[b.dataset.ex?1:0][lang],d=()=>{c.querySelector('span').textContent='Copied';setTimeout(()=>c.querySelector('span').textContent='Copy',1400)};(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(d).catch(d)}});draw();
</script>

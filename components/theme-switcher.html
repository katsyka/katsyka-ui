<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k{transition:none}
.ts{width:min(520px,100%);padding:24px}.ts h2{margin:0;font-size:17px;font-weight:650}.ts>p{margin:4px 0 20px}
.ts-g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ts-g button{display:flex;flex-direction:column;gap:8px;align-items:center;font-weight:550;border-radius:14px;padding:6px 6px 8px;transition:background .15s}
.ts-g button:hover{background:var(--sf)}
.ts-pv{position:relative;display:block;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.ts-g [aria-checked=true] .ts-pv{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac)}
.ts-pv.l,.ts-pv .l{background:#f6f6f4}.ts-pv.d,.ts-pv .d{background:#0f0f11}
.ts-pv i{position:absolute;left:12%;right:12%;height:14%;border-radius:4px}
.ts-pv i:nth-child(1){top:14%;right:40%}.ts-pv i:nth-child(2){top:38%;height:30%}.ts-pv i:nth-child(3){top:76%;right:55%;height:10%}
.l i{background:#fff;box-shadow:0 1px 2px #0000001a}.l i:nth-child(3){background:#c2410c}
.d i{background:#1c1c20;box-shadow:inset 0 1px 0 #ffffff0d}.d i:nth-child(3){background:#ff8a4c}
.ts-pv.s>span{position:absolute;inset:0}.ts-pv.s .d{clip-path:polygon(100% 0,100% 100%,0 100%)}
.ts-demo{display:grid;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.ts-demo select{appearance:auto}
.ts-ck{display:flex;gap:8px;align-items:center}.ts-ck input{width:16px;height:16px;margin:0}
.ts-st{margin:12px 0 0;font-size:13px;min-height:18px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
</style>
<div class="k" id="k"><section class="card ts"><h2>Appearance</h2><p class="mu">System follows your device and switches at sunset if your device does.</p>
  <div class="ts-g" role="radiogroup" aria-label="Theme" id="g">
    <button role="radio" aria-checked="false" data-t="light"><span class="ts-pv l"><i></i><i></i><i></i></span><b>Light</b></button>
    <button role="radio" aria-checked="false" data-t="dark"><span class="ts-pv d"><i></i><i></i><i></i></span><b>Dark</b></button>
    <button role="radio" aria-checked="true" data-t="system"><span class="ts-pv s"><span class="l"><i></i><i></i><i></i></span><span class="d"><i></i><i></i><i></i></span></span><b>System</b></button></div>
  <div class="ts-demo"><label class="lbl" for="sel">Form controls follow too</label><select class="in" id="sel"><option>Native select</option><option>Second</option></select><label class="ts-ck"><input type="checkbox" checked> Native checkbox</label></div>
  <p class="ts-st mu" id="st" role="status"></p></section></div>
<script>
const k=document.getElementById("k"),mq=matchMedia("(prefers-color-scheme: dark)");let mode="system";
let meta=document.querySelector('meta[name=theme-color]');if(!meta){meta=document.createElement("meta");meta.name="theme-color";document.head.append(meta)}
const apply=()=>{const dark=mode==="dark"||(mode==="system"&&mq.matches);k.style.colorScheme=mode==="system"?"light dark":mode;document.documentElement.style.colorScheme=mode==="system"?"light dark":mode;meta.content=dark?"#0f0f11":"#ffffff";st.textContent=mode==="system"?`Following your device: ${mq.matches?"dark":"light"} right now.`:`Always ${mode}.`};
try{const s=localStorage.getItem("theme");if(s)mode=s}catch(e){}
const pick=(t,x,y)=>{mode=t;try{localStorage.setItem("theme",t)}catch(e){}g.querySelectorAll("button").forEach(b=>{b.setAttribute("aria-checked",b.dataset.t===t);b.tabIndex=b.dataset.t===t?0:-1});
 if(!document.startViewTransition||matchMedia("(prefers-reduced-motion: reduce)").matches){apply();return}
 const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));const vt=document.startViewTransition(apply);vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:500,easing:"cubic-bezier(.2,.8,.2,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{})};
const B=[...g.querySelectorAll("button")];
B.forEach((b,i)=>{b.onclick=e=>{const r=b.getBoundingClientRect();pick(b.dataset.t,e.clientX||r.left+r.width/2,e.clientY||r.top+r.height/2)};b.onkeydown=e=>{const d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(d){e.preventDefault();const n=B[(i+d+3)%3];n.focus();n.click()}}});
mq.addEventListener("change",apply);
B.forEach(b=>{b.setAttribute("aria-checked",b.dataset.t===mode);b.tabIndex=b.dataset.t===mode?0:-1});apply();
</script>

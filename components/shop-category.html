<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}


.k.pg{display:block;place-items:normal;padding:0;background:var(--bg);font-size:16px;min-height:0}
.pg .w{width:min(1180px,100% - 32px);margin-inline:auto;min-width:0}
.pg{overflow-x:clip}
.pg img{display:block;max-width:100%}
.pg h1,.pg h2,.pg h3,.pg p{margin:0}
.pg .ser{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.pg .h1{font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:-.035em;font-weight:650;text-wrap:balance}
.pg .h2{font-size:clamp(30px,4.4vw,52px);line-height:1.05;letter-spacing:-.03em;font-weight:620;text-wrap:balance}
.pg .h3{font-size:19px;line-height:1.3;font-weight:620;letter-spacing:-.01em}
.pg .lead{font-size:clamp(17px,1.6vw,20px);line-height:1.5;color:var(--mu);text-wrap:pretty;max-width:60ch}
.pg .eb{font:500 12px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pg .sec{padding:clamp(64px,10vw,128px) 0}
.pg .b.lg{height:48px;padding:0 22px;font-size:15px;border-radius:12px}
.pg .ph{width:100%;height:100%;object-fit:cover}
.pg .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pg .top .w{display:flex;align-items:center;gap:24px;height:64px}
.pg .logo{white-space:nowrap;font-weight:700;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.pg .links{display:flex;gap:24px;margin-left:auto;font-size:14px}.pg .links a{color:var(--mu);text-decoration:none}.pg .links a:hover{color:var(--fg)}
.pg .menu{display:none;margin-left:auto;width:44px;height:44px;place-items:center;border-radius:10px}
.pg .foot{border-top:1px solid var(--line);padding:32px 0;font-size:13px;color:var(--mu)}.pg .foot .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:760px){.pg .links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}.pg .links a{padding:12px 0;font-size:16px}.pg .top.open .links{display:flex}.pg .menu{display:grid}.pg .top .b{display:none}}
.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.sc3-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding:32px 0 12px}.sc3-h h1{margin:0;font-size:28px;letter-spacing:-.02em}.sc3-h h1 span{font-size:15px;font-weight:400}.sc3-tb{display:flex;gap:10px;align-items:center;font-size:13px}.sc3-tb select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;color:var(--fg);margin-left:6px}.sc3-fb{display:none}
.sc3-ch{display:flex;gap:6px;flex-wrap:wrap;min-height:8px;margin-bottom:12px}.sc3-ch button{display:flex;gap:4px;align-items:center;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--sf2);font-size:12px}.sc3-ch .i{width:12px;height:12px}.sc3-ch .clr{background:none;text-decoration:underline;padding:0 6px}
.sc3-g{display:grid;grid-template-columns:220px 1fr;gap:32px;padding-bottom:80px}.sc3-f{display:grid;gap:20px;align-content:start;position:sticky;top:16px}.sc3-f fieldset{border:0;margin:0;padding:0}.sc3-f input[type=range]{width:100%;accent-color:var(--fg)}.sc3-fh,.sc3-ap{display:none}
.sc3-sz{display:flex;flex-wrap:wrap;gap:6px}.sc3-sz button{min-width:44px;height:36px;border:1px solid var(--ctl);border-radius:8px;font-size:13px}.sc3-sz [aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.sc3-cl{display:flex;gap:8px;flex-wrap:wrap}.sc3-cl button{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px #0002;outline-offset:2px}.sc3-cl [aria-pressed=true]{outline:2px solid var(--fg)}.sc3-is{display:flex;gap:8px;align-items:center;font-size:14px}.sc3-is input{width:18px;height:18px;accent-color:var(--fg)}
.sc3-l{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 16px;align-content:start}.sc3-l a{display:grid;gap:6px;color:inherit;text-decoration:none;font-size:14px}.sc3-im{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--sf)}.sc3-im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}.sc3-im img+img{opacity:0}.sc3-l a:hover .sc3-im img+img{opacity:1}.sc3-im .pill{position:absolute;top:8px;left:8px}
.sc3-dots{display:flex;gap:4px}.sc3-dots i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px #0002}.sc3-l .em{grid-column:1/-1;text-align:center;color:var(--mu);padding:48px 0}
@media (max-width:860px){.sc3-g{grid-template-columns:1fr}.sc3-fb{display:inline-flex}.sc3-f{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-shadow:0 -8px 32px #0003;max-height:80dvh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.23,1,.32,1)}.sc3-f.open{transform:none}.sc3-fh{display:flex;justify-content:space-between;align-items:center}.sc3-ap{display:inline-flex;height:48px}.sc3-l{grid-template-columns:1fr 1fr}}
</style>
<div class="k pg sc3"><div class="w"><div class="sc3-h"><h1>Outerwear <span class="mu tn" id="ct"></span></h1><div class="sc3-tb"><button class="b sec sm sc3-fb" id="fb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Filters</button><label class="mu">Sort <select id="so"><option value="pop">Popular</option><option value="lo">Price, low to high</option><option value="hi">Price, high to low</option><option value="new">Newest</option></select></label></div></div><div class="sc3-ch" id="ch"></div>
<div class="sc3-g"><aside class="sc3-f" id="fp" aria-label="Filters"><div class="sc3-fh"><b>Filters</b><button class="ibt" id="fx" aria-label="Close filters"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><fieldset><legend class="lbl">Max price: <b class="tn" id="pv"></b></legend><input type="range" id="pr" min="60" max="320" step="10" value="320"></fieldset><fieldset><legend class="lbl">Size</legend><div class="sc3-sz" id="szf"></div></fieldset><fieldset><legend class="lbl">Colour</legend><div class="sc3-cl" id="clf"></div></fieldset><label class="sc3-is"><input type="checkbox" id="is"> In stock only</label><button class="b ac sc3-ap" id="ap">Show results</button></aside><ul class="sc3-l" id="l"></ul></div></div></div>
<script>
const CL={Olive:'#4d5a36',Navy:'#1f2a44',Sand:'#c8b28a',Black:'#1c1c1c',Rust:'#9a3f1f'},P=[["Field jacket",240,["Olive","Navy"],["S","M","L"],1,"c/1043","c/1063",3],["Rain shell",180,["Black","Rust"],["XS","S","M","L","XL"],1,"c/1052","c/1053",5],["Quilted vest",120,["Sand","Olive"],["M","L"],1,"c/1050","c/1049",1],["Wool overshirt",160,["Rust","Navy"],["S","M"],0,"c/1072","c/1057",4],["Down parka",320,["Black"],["M","L","XL"],1,"c/1041","w/1036",2],["Linen chore coat",140,["Sand"],["XS","S","M"],1,"c/1047","c/1048",6],["Waxed cap",60,["Olive","Black"],["One size"],1,"c/1063","c/1043",7]];
const F={max:320,sz:new Set(),cl:new Set(),stock:false},$=i=>document.getElementById(i);
$('szf').innerHTML=['XS','S','M','L','XL'].map(s=>`<button aria-pressed="false" data-s="${s}">${s}</button>`).join('');$('clf').innerHTML=Object.entries(CL).map(([n,c])=>`<button aria-pressed="false" aria-label="${n}" data-c="${n}" style="--c:${c}"></button>`).join('');
function draw(){const so=$('so').value;let L=P.filter(p=>p[1]<=F.max&&(!F.sz.size||p[3].some(s=>F.sz.has(s)))&&(!F.cl.size||p[2].some(c=>F.cl.has(c)))&&(!F.stock||p[4]));L.sort((a,b)=>so==='lo'?a[1]-b[1]:so==='hi'?b[1]-a[1]:so==='new'?b[7]-a[7]:a[7]-b[7]);
$('l').innerHTML=L.length?L.map(([n,pr,cs,,st,i1,i2])=>`<li><a href="#"><span class="sc3-im"><img src="media/pics/${i1}.jpg" alt="" loading="lazy"><img src="media/pics/${i2}.jpg" alt="" loading="lazy">${st?'':'<span class="pill">Sold out</span>'}</span><b>${n}</b><span class="tn">€${pr}</span><span class="sc3-dots" aria-label="Colours: ${cs.join(', ')}">${cs.map(c=>`<i style="--c:${CL[c]}"></i>`).join('')}</span></a></li>`).join(''):'<li class="em">Nothing matches. Try removing a filter.</li>';$('ct').textContent=L.length+' items';$('pv').textContent='€'+F.max;$('ap').textContent=`Show ${L.length} results`;
const C=[...(F.max<320?[['p','Under €'+F.max]]:[]),...[...F.sz].map(s=>['s',s]),...[...F.cl].map(c=>['c',c]),...(F.stock?[['k','In stock']]:[])];$('ch').innerHTML=C.map(([k,v])=>`<button data-k="${k}" data-v="${v}" aria-label="Remove ${v}">${v}<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`).join('')+(C.length?'<button class="clr" data-k="all">Clear all</button>':'')}
$('pr').oninput=e=>{F.max=+e.target.value;draw()};$('szf').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset.s;F.sz.has(s)?F.sz.delete(s):F.sz.add(s);b.setAttribute('aria-pressed',F.sz.has(s));draw()};$('clf').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;F.cl.has(c)?F.cl.delete(c):F.cl.add(c);b.setAttribute('aria-pressed',F.cl.has(c));draw()};$('is').onchange=e=>{F.stock=e.target.checked;draw()};$('so').onchange=draw;
$('ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,v=b.dataset.v;if(k==='all'){F.max=320;F.sz.clear();F.cl.clear();F.stock=false}if(k==='p')F.max=320;if(k==='s')F.sz.delete(v);if(k==='c')F.cl.delete(v);if(k==='k')F.stock=false;$('pr').value=F.max;$('is').checked=F.stock;$('szf').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',F.sz.has(x.dataset.s)));$('clf').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',F.cl.has(x.dataset.c)));draw()};
$('fb').onclick=()=>$('fp').classList.add('open');$('fx').onclick=$('ap').onclick=()=>$('fp').classList.remove('open');draw();
</script>

<style>
.si-stage{min-height:100vh;display:grid;place-items:center;padding:40px 16px;background:radial-gradient(ellipse at top,#16161c,#08080a 70%)}
.si{width:min(400px,100%);padding:32px;border-radius:22px;background:#0f0f12;border:1px solid #ffffff12;box-shadow:0 30px 80px -30px #000}
.si-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f4f3ef,#9e9ca8);margin-bottom:22px}
.si h2{margin:0 0 6px;font-size:24px;letter-spacing:-.035em;font-weight:600}
.si>p{margin:0 0 26px;color:#85858f;font-size:14.5px}
.si-oauth{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.si-oauth button{height:44px;border-radius:12px;border:1px solid #ffffff17;background:#ffffff05;color:#eee;font:500 14px Geist,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.si-oauth button:hover{background:#ffffff0d}
.si-or{display:flex;align-items:center;gap:12px;color:#55555e;font-size:12px;margin-bottom:22px}.si-or::before,.si-or::after{content:"";flex:1;height:1px;background:#ffffff12}
.si-f{position:relative;margin-bottom:14px}
.si-f input{width:100%;height:54px;padding:22px 44px 6px 14px;border-radius:12px;border:1px solid #ffffff17;background:#0a0a0c;color:#f4f3ef;font:15px Geist,sans-serif;outline:0;transition:border-color .2s,box-shadow .2s}
.si-f input:focus{border-color:#ff7a45;box-shadow:0 0 0 4px #ff5a1f22}
.si-f label{position:absolute;left:15px;top:17px;color:#6f6f79;font-size:15px;pointer-events:none;transform-origin:left top;transition:transform .2s cubic-bezier(.3,.7,.4,1),color .2s}
.si-f input:focus+label,.si-f input:not(:placeholder-shown)+label{transform:translateY(-10px) scale(.76);color:#a1a1ab}
.si-f.bad input{border-color:#ff5c5c}.si-f .err{font-size:12px;color:#ff7b7b;margin:6px 2px 0;display:none}.si-f.bad .err{display:block}
.si-eye{position:absolute;right:8px;top:11px;width:32px;height:32px;border:0;background:none;color:#7c7c86;cursor:pointer;border-radius:8px}
.si-eye:hover{color:#fff;background:#ffffff0d}
.si-eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.si-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 2px 4px}
.si-meter i{height:3px;border-radius:2px;background:#ffffff14;transition:background .3s}
.si-hint{font-size:12px;color:#6f6f79;margin:0 2px 18px;height:16px}
.si-go{position:relative;width:100%;height:48px;border:0;border-radius:12px;background:#f4f3ef;color:#0a0a0a;font:600 15px Geist,sans-serif;cursor:pointer;overflow:hidden;transition:transform .15s,background .3s}
.si-go:active{transform:scale(.98)}
.si-go .sp{display:none;width:18px;height:18px;border-radius:50%;border:2px solid #0003;border-top-color:#0a0a0a;animation:si-sp .7s linear infinite;margin:auto}
@keyframes si-sp{to{transform:rotate(1turn)}}
.si-go.load span{display:none}.si-go.load .sp{display:block}
.si-go.ok{background:#3ddc84}
.si-foot{text-align:center;font-size:13.5px;color:#7c7c86;margin:20px 0 0}.si-foot a{color:#f4f3ef}
</style>
<div class="si-stage"><form class="si" novalidate>
  <div class="si-logo"></div>
  <h2>Create your account</h2><p>Start a 14-day trial. No card needed.</p>
  <div class="si-oauth"><button type="button">G&nbsp; Google</button><button type="button"> GitHub</button></div>
  <div class="si-or">or with email</div>
  <div class="si-f" data-email><input type="email" id="siE" placeholder=" " autocomplete="email"><label for="siE">Work email</label><p class="err">Enter a valid email address</p></div>
  <div class="si-f"><input type="password" id="siP" placeholder=" " autocomplete="new-password"><label for="siP">Password</label>
    <button class="si-eye" type="button" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div class="si-meter"><i></i><i></i><i></i><i></i></div>
  <p class="si-hint">Use 8+ characters with a mix of letters, numbers & symbols</p>
  <button class="si-go"><span>Create account</span><i class="sp"></i></button>
  <p class="si-foot">Already have one? <a href="#">Sign in</a></p>
</form></div>
<script>
(()=>{
const f=document.querySelector(".si"),e=f.querySelector("#siE"),p=f.querySelector("#siP"),bars=[...f.querySelectorAll(".si-meter i")],hint=f.querySelector(".si-hint"),go=f.querySelector(".si-go");
const C=["#ff5c5c","#ff9f43","#ffd43b","#3ddc84"],T=["Too weak","Could be stronger","Good","Strong password"];
p.addEventListener("input",()=>{const v=p.value;let s=0;
  if(v.length>=8)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^\w]/.test(v)||v.length>14)s++;
  bars.forEach((b,i)=>b.style.background=v&&i<Math.max(1,s)?C[Math.max(1,s)-1]:"");
  hint.textContent=v?T[Math.max(1,s)-1]:"Use 8+ characters with a mix of letters, numbers & symbols"});
f.querySelector(".si-eye").onclick=()=>{p.type=p.type==="password"?"text":"password";p.focus()};
e.addEventListener("blur",()=>e.closest(".si-f").classList.toggle("bad",!!e.value&&!e.checkValidity()));
f.addEventListener("submit",ev=>{ev.preventDefault();const ef=e.closest(".si-f");
  if(!e.value||!e.checkValidity()){ef.classList.add("bad");ef.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:300});return}
  go.classList.add("load");setTimeout(()=>{go.classList.replace("load","ok");go.firstElementChild.textContent="Welcome aboard ✓"},1300)});
})();
</script>

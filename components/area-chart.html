<style>
.ac{min-height:100vh;display:grid;place-items:center;padding:40px clamp(12px,3vw,40px);background:#0a0a0b;color:#e4e4e7}
.ac-card{width:min(1000px,100%);border-radius:22px;background:#101012;border:1px solid #ffffff0d;padding:22px 22px 14px}
.ac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.ac-top span{font-size:13px;color:#a1a1aa}.ac-top b{display:block;font-size:34px;letter-spacing:-.045em;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.ac-top b span{font-size:inherit;color:#fafafa}.ac-top b em{font-style:normal;font:600 13px "Geist Mono",monospace;color:#4ade80;margin-left:10px;letter-spacing:0}
.ac-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ac-lg{display:flex;gap:4px}
.ac-lg button{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:0;background:none;color:#a1a1aa;font:500 12.5px Geist,sans-serif;cursor:pointer;transition:opacity .2s}
.ac-lg button i{width:10px;height:3px;border-radius:2px;background:var(--c)}.ac-lg button.off{opacity:.35}
.ac-lg button:hover{background:#ffffff08}
.ac-tabs{display:flex;padding:3px;border-radius:9px;background:#0a0a0b;border:1px solid #ffffff0d}
.ac-tabs button{height:28px;padding:0 11px;border:0;border-radius:6px;background:none;color:#71717a;font:500 12.5px "Geist Mono",monospace;cursor:pointer}
.ac-tabs button.on{background:#27272a;color:#fafafa}
.ac-plot{position:relative;height:340px;margin-top:10px;cursor:crosshair}
.ac-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ac-plot text{font:11px "Geist Mono",monospace;fill:#52525b}
.ac-plot .g line{stroke:#ffffff0a}
.ac-x{position:absolute;top:0;bottom:24px;width:1px;background:linear-gradient(#ffffff40,#ffffff10);opacity:0;pointer-events:none;transition:opacity .15s}
.ac-dt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #101012;opacity:0;pointer-events:none;transition:opacity .15s}
.ac-tip{position:absolute;top:8px;min-width:170px;padding:10px 12px;border-radius:12px;background:#18181bf2;border:1px solid #ffffff17;backdrop-filter:blur(8px);box-shadow:0 14px 30px -10px #000;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .15s}
.ac-tip header{font:500 11.5px "Geist Mono",monospace;color:#71717a;margin-bottom:6px}
.ac-tip div{display:flex;align-items:center;gap:8px;margin-top:3px}.ac-tip div i{width:8px;height:8px;border-radius:2px;background:var(--c)}.ac-tip div b{margin-left:auto;font-variant-numeric:tabular-nums}
.ac-plot.hov .ac-x,.ac-plot.hov .ac-dt,.ac-plot.hov .ac-tip{opacity:1}
.ac-plot.hov .ac-dt.off{opacity:0}
</style>
<div class="ac"><div class="ac-card">
  <div class="ac-top"><div><span>Total revenue</span><b><span data-tot>$0</span><em data-dl></em></b></div>
    <div class="ac-ctl"><div class="ac-lg"><button data-s="0" style="--c:#ff7a3d"><i></i>This period</button><button data-s="1" style="--c:#71717a"><i></i>Previous</button></div>
      <div class="ac-tabs"><button data-n="7">7D</button><button data-n="30" class="on">30D</button><button data-n="90">90D</button></div></div></div>
  <div class="ac-plot"><svg><defs><linearGradient id="acG" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff7a3d" stop-opacity=".3"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></linearGradient></defs>
    <g class="g"></g><path class="a1" fill="url(#acG)"/><path class="l2" fill="none" stroke="#71717a" stroke-width="1.6" stroke-dasharray="4 5"/><path class="l1" fill="none" stroke="#ff7a3d" stroke-width="2.4" stroke-linejoin="round"/><g class="xl"></g></svg>
    <i class="ac-x"></i><i class="ac-dt" style="background:#ff7a3d"></i><i class="ac-dt" style="background:#71717a"></i><div class="ac-tip"></div></div>
</div></div>
<script>
(()=>{
const plot=document.querySelector(".ac-plot"),svg=plot.querySelector("svg"),PAD={l:48,r:8,t:12,b:24};
let seed=3;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const series=n=>{seed=n*31+7;let a=1800,b=1650;const A=[],B=[];for(let i=0;i<n;i++){a*=1+.012+(rnd()-.5)*.14;b*=1+.006+(rnd()-.5)*.12;const wk=[.82,1,1.04,1.06,1.08,.95,.78][i%7];A.push(a*wk);B.push(b*wk)}return[A,B]};
let n=30,data=series(30),cur=data.map(s=>s.slice()),show=[1,1],W,H;
const fmt=v=>"$"+(v>=1000?(v/1000).toFixed(1)+"k":Math.round(v));
const day=i=>{const d=new Date(2026,9,30);d.setDate(d.getDate()-(n-1-i));return d.toLocaleDateString("en",{month:"short",day:"numeric"})};
let yMax=1,X,Y;
function scale(){const mx=Math.max(...cur[0],...(show[1]?cur[1]:[0]));yMax=Math.ceil(mx/1000)*1000||1000;
  X=i=>PAD.l+i/(n-1)*(W-PAD.l-PAD.r);Y=v=>PAD.t+(1-v/yMax)*(H-PAD.t-PAD.b)}
const path=a=>{let d="";a.forEach((v,i)=>{const x=X(i),y=Y(v);if(!i)d=`M${x} ${y}`;else{const px=X(i-1),py=Y(a[i-1]),cx=(px+x)/2;d+=` C${cx} ${py} ${cx} ${y} ${x} ${y}`}});return d};
function render(){W=plot.clientWidth;H=plot.clientHeight;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);scale();
  svg.querySelector(".g").innerHTML=[0,.25,.5,.75,1].map(k=>`<line x1="${PAD.l}" x2="${W-PAD.r}" y1="${Y(yMax*k)}" y2="${Y(yMax*k)}"/><text x="${PAD.l-10}" y="${Y(yMax*k)+4}" text-anchor="end">${fmt(yMax*k)}</text>`).join("");
  const step=Math.ceil(n/6);svg.querySelector(".xl").innerHTML=[...Array(n)].map((_,i)=>i%step===0||i===n-1?`<text x="${X(i)}" y="${H-6}" text-anchor="${i===n-1?"end":i===0?"start":"middle"}">${day(i)}</text>`:"").join("");
  const d1=path(cur[0]);svg.querySelector(".l1").setAttribute("d",show[0]?d1:"");svg.querySelector(".a1").setAttribute("d",show[0]?d1+` L${X(n-1)} ${Y(0)} L${X(0)} ${Y(0)}Z`:"");
  svg.querySelector(".l2").setAttribute("d",show[1]?path(cur[1]):"")}
function totals(){const t=data[0].reduce((a,b)=>a+b,0),p=data[1].reduce((a,b)=>a+b,0),el=document.querySelector("[data-tot]"),from=parseFloat(el.dataset.v||0),t0=performance.now();el.dataset.v=t;
  document.querySelector("[data-dl]").textContent=(t>p?"+":"")+((t-p)/p*100).toFixed(1)+"%";
  (function f(now){const k=Math.min(1,(now-t0)/700),e=1-(1-k)**3;el.textContent="$"+Math.round(from+(t-from)*e).toLocaleString("en");if(k<1)requestAnimationFrame(f)})(t0)}
function setN(nn){const from=cur.map(s=>[...Array(nn)].map((_,i)=>{const t=i/(nn-1)*(s.length-1),k=Math.floor(t),f=t-k;return s[k]*(1-f)+s[Math.min(k+1,s.length-1)]*f}));
  n=nn;data=series(nn);totals();const t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/650),e=k<.5?4*k*k*k:1-(-2*k+2)**3/2;cur=from.map((s,j)=>s.map((v,i)=>v+(data[j][i]-v)*e));render();if(k<1)requestAnimationFrame(f)})(t0)}
const tip=plot.querySelector(".ac-tip"),xl=plot.querySelector(".ac-x"),dots=plot.querySelectorAll(".ac-dt");
plot.addEventListener("pointermove",e=>{const r=plot.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left-PAD.l)/(W-PAD.l-PAD.r)*(n-1)))),x=X(i);
  plot.classList.add("hov");xl.style.left=x+"px";dots.forEach((d,j)=>{d.style.left=x+"px";d.style.top=Y(data[j][i])+"px";d.classList.toggle("off",!show[j])});
  tip.innerHTML=`<header>${day(i)}, 2026</header>${show[0]?`<div style="--c:#ff7a3d"><i></i>This period<b>$${Math.round(data[0][i]).toLocaleString("en")}</b></div>`:""}${show[1]?`<div style="--c:#71717a"><i></i>Previous<b>$${Math.round(data[1][i]).toLocaleString("en")}</b></div>`:""}`;
  tip.style.left=(x>W/2?x-tip.offsetWidth-14:x+14)+"px"});
plot.addEventListener("pointerleave",()=>plot.classList.remove("hov"));
document.querySelectorAll(".ac-tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".ac-tabs button").forEach(x=>x.classList.toggle("on",x===b));setN(+b.dataset.n)});
document.querySelectorAll(".ac-lg button").forEach(b=>b.onclick=()=>{const s=+b.dataset.s;if(show[s]&&show.filter(Boolean).length===1)return;show[s]^=1;b.classList.toggle("off",!show[s]);render()});
new ResizeObserver(render).observe(plot);totals();
// draw-in on load
const l1=svg.querySelector(".l1");requestAnimationFrame(()=>{const L=l1.getTotalLength();l1.animate([{strokeDasharray:`0 ${L}`},{strokeDasharray:`${L} ${L}`}],{duration:1400,easing:"cubic-bezier(.6,0,.2,1)"})});
})();
</script>

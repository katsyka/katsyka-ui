<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}


.k.pg{display:block;place-items:normal;padding:0;background:var(--bg);font-size:16px;min-height:0}
.pg .w{width:min(1180px,100% - 32px);margin-inline:auto;min-width:0}
.pg{overflow-x:clip}
.pg img{display:block;max-width:100%}
.pg h1,.pg h2,.pg h3,.pg p{margin:0}
.pg .ser{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.pg .h1{font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:-.035em;font-weight:650;text-wrap:balance}
.pg .h2{font-size:clamp(30px,4.4vw,52px);line-height:1.05;letter-spacing:-.03em;font-weight:620;text-wrap:balance}
.pg .h3{font-size:19px;line-height:1.3;font-weight:620;letter-spacing:-.01em}
.pg .lead{font-size:clamp(17px,1.6vw,20px);line-height:1.5;color:var(--mu);text-wrap:pretty;max-width:60ch}
.pg .eb{font:500 12px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pg .sec{padding:clamp(64px,10vw,128px) 0}
.pg .b.lg{height:48px;padding:0 22px;font-size:15px;border-radius:12px}
.pg .ph{width:100%;height:100%;object-fit:cover}
.pg .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pg .top .w{display:flex;align-items:center;gap:24px;height:64px}
.pg .logo{white-space:nowrap;font-weight:700;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.pg .links{display:flex;gap:24px;margin-left:auto;font-size:14px}.pg .links a{color:var(--mu);text-decoration:none}.pg .links a:hover{color:var(--fg)}
.pg .menu{display:none;margin-left:auto;width:44px;height:44px;place-items:center;border-radius:10px}
.pg .foot{border-top:1px solid var(--line);padding:32px 0;font-size:13px;color:var(--mu)}.pg .foot .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:760px){.pg .links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}.pg .links a{padding:12px 0;font-size:16px}.pg .top.open .links{display:flex}.pg .menu{display:grid}.pg .top .b{display:none}}
.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.lt{--ac:light-dark(#3f6212,#bef264);--ac-h:light-dark(#365314,#d9f99d);--ac-fg:light-dark(#fff,#1a2e05)}
.lt-hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center;padding:56px 0}.lt-hero img{aspect-ratio:3/4;object-fit:cover;border-radius:999px 999px 16px 16px;width:100%}.lt-hero>div{display:grid;gap:24px}
.lt-mh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.lt-df{display:flex;gap:8px}.lt-df button{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:13px}.lt-df [aria-pressed=true]{background:var(--ac);color:var(--ac-fg);border-color:var(--ac)}
.lt-tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-top:24px}.lt-tabs button{padding:12px 0;font-size:16px;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px}.lt-tabs [aria-selected=true]{color:var(--fg);border-color:var(--fg)}
.lt-menu{list-style:none;padding:0;margin:0;columns:2;column-gap:56px}.lt-menu li{break-inside:avoid;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:20px 0;border-bottom:1px dashed var(--line)}.lt-menu b{font-size:17px;font-weight:600}.lt-menu .mu{grid-column:1/-1;font-size:14px}.lt-menu em{font-style:normal;font-size:11px;font-weight:600;color:var(--ac);margin-left:6px}.lt-menu .x{opacity:.3}
.lt-bk{background:var(--sf)}.lt-bg{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.lt-hrs{list-style:none;padding:0;margin:24px 0 0;max-width:340px}.lt-hrs li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.lt-hrs .td{font-weight:650}.lt-hrs .td::before{content:"Today · ";color:var(--ac)}
.lt-f{padding:24px;display:grid;gap:16px}.lt-r{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lt-r .in{height:44px;font-size:16px}.lt-sl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-8px}.lt-sl button{height:44px;border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums;font-weight:550}.lt-sl [aria-checked=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.lt-sl button:disabled{text-decoration:line-through;color:var(--mu);opacity:.6;cursor:not-allowed}.lt-ms:empty{display:none}.lt-ms{font-size:14px;color:var(--ok)}
@media (max-width:760px){.lt-hero,.lt-bg{grid-template-columns:1fr}.lt-hero img{width:60%;}.lt-menu{columns:1}}
</style>
<div class="k pg lt">
<header class="top"><div class="w"><a class="logo ser" href="#" style="font-size:24px;font-weight:400">Fennel</a><nav class="links"><a href="#mn">Menu</a><a href="#bk">Book</a><a href="#">Private dining</a></nav><a class="b ac" href="#bk">Book a table</a><button class="menu ibt" aria-label="Menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button></div></header>
<section class="w lt-hero"><img src="media/pics/c/1080.jpg" alt="Fresh strawberries"><div><p class="eb" id="op"></p><h1 class="h1 ser">Seasonal plates,<br>natural wine,<br>no rush.</h1><p class="lead">Thirty-two seats on Vesterbrogade. The menu changes when the market does.</p></div></section>
<section class="sec w" id="mn"><div class="lt-mh"><h2 class="h2 ser">This week</h2><div class="lt-df" role="group" aria-label="Dietary filter"><button aria-pressed="false" data-f="v">Vegetarian</button><button aria-pressed="false" data-f="g">Gluten-free</button></div></div><div class="lt-tabs" role="tablist" aria-label="Course"><button role="tab" aria-selected="true" data-c="0">Small</button><button role="tab" aria-selected="false" data-c="1">Large</button><button role="tab" aria-selected="false" data-c="2">Sweet</button></div><ul class="lt-menu" id="ml" aria-live="polite"></ul></section>
<section class="sec lt-bk" id="bk"><div class="w lt-bg"><div><h2 class="h2 ser">Book a table</h2><ul class="lt-hrs" id="hr"></ul></div><form class="card lt-f" onsubmit="return false"><div class="lt-r"><label><span class="lbl">Guests</span><select class="in" id="gs"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label><span class="lbl">Date</span><input class="in" type="date" id="dt"></label></div><span class="lbl">Time</span><div class="lt-sl" id="sl" role="radiogroup" aria-label="Time"></div><button class="b ac lg" id="go" style="width:100%">Reserve</button><p id="ms" role="status" class="lt-ms"></p></form></div></section>
<footer class="foot"><div class="w"><span>Fennel · Vesterbrogade 41</span><span>Groups of 7+ call us</span></div></footer>
</div>
<script>
document.querySelectorAll('.pg .menu').forEach(m=>m.addEventListener('click',()=>{const t=m.closest('.top');const o=t.classList.toggle('open');m.setAttribute('aria-expanded',o)}));
const MN=[[["Charred leeks, hazelnut","Brown butter, dill","g v",95],["Raw scallop, green strawberry","Horseradish, sorrel","g",135],["Sourdough & cultured butter","Our own starter","v",45]],[["Halibut, mussel sauce","Fermented celeriac, sea herbs","g",245],["Pumpkin, smoked ricotta","Pumpkin seed praline","v",195],["Pork neck, plums","Mustard greens","g",235]],[["Strawberry, sheep's yogurt","Elderflower granita","g v",95],["Rye, salted caramel","Malted cream","v",90]]];
const ml=document.getElementById('ml');let c=0;const F=new Set();
function menu(){ml.innerHTML=MN[c].map(([n,d,t,p])=>{const ok=[...F].every(f=>t.includes(f));return `<li class="${ok?'':'x'}"><b>${n}${t.includes('v')?'<em>V</em>':''}${t.includes('g')?'<em>GF</em>':''}</b><span class="tn">${p} kr</span><span class="mu">${d}</span></li>`}).join('')}
document.querySelectorAll('.lt-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lt-tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));c=+b.dataset.c;menu()});
document.querySelectorAll('.lt-df button').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);on?F.add(b.dataset.f):F.delete(b.dataset.f);menu()});menu();
const H=[["Monday","Closed"],["Tuesday","17:30–23:00"],["Wednesday","17:30–23:00"],["Thursday","17:30–23:00"],["Friday","17:00–00:00"],["Saturday","12:00–00:00"],["Sunday","12:00–16:00"]],d=new Date(),wd=(d.getDay()+6)%7;
document.getElementById('hr').innerHTML=H.map(([n,h],i)=>`<li class="${i===wd?'td':''}"><span>${n}</span><span class="tn">${h}</span></li>`).join('');
const h=H[wd][1],m=h.match(/(\d+):(\d+)–(\d+):(\d+)/),now=d.getHours()*60+d.getMinutes();let open=false;if(m){const a=+m[1]*60+ +m[2],z=(+m[3]||24)*60+ +m[4];open=now>=a&&now<z}
document.getElementById('op').textContent=open?'● Open now · until '+h.split('–')[1]:'Closed now · '+(m?'opens '+h.split('–')[0]:'opens tomorrow');
const dt=document.getElementById('dt'),sl=document.getElementById('sl');dt.valueAsDate=new Date(+d+864e5*2);dt.min=d.toISOString().slice(0,10);let pick=null;
['17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00'].forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('role','radio');b.setAttribute('aria-checked','false');b.disabled=i==3||i==4;b.onclick=()=>{sl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));pick=t};sl.append(b)});
document.getElementById('go').onclick=e=>{const ms=document.getElementById('ms');if(!pick){ms.style.color='var(--err)';ms.textContent='Pick a time first.';return}const b=e.currentTarget;b.disabled=true;b.textContent='Reserving…';setTimeout(()=>{b.disabled=false;b.textContent='Reserve';ms.style.color='var(--ok)';ms.textContent=`Table for ${document.getElementById('gs').value} at ${pick} is held. Confirmation sent by email.`},800)};
</script>

<style>
.pv{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.pv :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pv ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.pv *,.pv *::before,.pv *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.pv{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:var(--sf)}
.pv-bar{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center}
.pv-anc{position:relative}
.pv-t{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:550 13.5px Geist,system-ui,sans-serif;cursor:pointer}
.pv-t:hover,.pv-t[aria-expanded=true]{background:var(--sf2)}
.pv-t.pr{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pv-t svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pv-p{position:absolute;top:calc(100% + 12px);left:50%;z-index:20;width:320px;padding:16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);box-shadow:0 18px 40px -12px #00000040,0 2px 6px #00000014;opacity:0;visibility:hidden;transform:translate(-50%,-6px) scale(.98);transform-origin:top center;transition:opacity .15s,transform .2s var(--ease),visibility 0s .2s}
.pv-p.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .15s,transform .2s var(--ease)}
.pv-p::before{content:"";position:absolute;top:-6px;left:calc(50% - 6px);width:12px;height:12px;background:var(--bg);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);border-radius:3px 0 0 0}
.pv-p.end{left:auto;right:-8px;transform:translateY(-6px) scale(.98);transform-origin:top right}
.pv-p.end.on{transform:none}
.pv-p.end::before{left:auto;right:20px}
.pv-p h3{margin:0;font-size:14.5px;font-weight:600}
.pv-p>p{margin:3px 0 12px;font-size:13px;color:var(--mu)}
.pv-row{display:flex;gap:6px}
.pv-row input{flex:1;min-width:0;height:36px;padding:0 10px;border-radius:9px;border:1px solid color-mix(in oklab,var(--ctl) 70%,var(--bg));background:var(--sf);color:var(--fg);font:500 13px "Geist Mono",monospace}
.pv-row input:focus-visible{outline:0;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklab,var(--focus) 22%,transparent)}
.pv-row button{height:36px;padding:0 12px;border:0;border-radius:9px;background:var(--fg);color:var(--bg);font:550 13px Geist,system-ui,sans-serif;cursor:pointer;min-width:66px}
.pv-acc{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.pv-acc svg{width:16px;height:16px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pv-acc select{margin-left:auto;height:30px;padding:0 6px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 12.5px Geist,system-ui,sans-serif}
.pv-ppl{display:flex;margin:4px 0 12px}
.pv-ppl i{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);margin-left:-8px;display:grid;place-items:center;font:600 10.5px Geist,system-ui,sans-serif;font-style:normal;color:#fff}
.pv-ppl i:first-child{margin-left:0}
.pv-g{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;font-size:13px}
.pv-g label{color:var(--mu)}
.pv-g input[type=range]{width:100%;accent-color:var(--fg)}
.pv-sw{display:flex;gap:6px}
.pv-sw button{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px #0000001f}
.pv-sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
</style>
<div class="pv">
  <div class="pv-bar">
    <div class="pv-anc"><button class="pv-t" aria-expanded="false" aria-controls="pvA"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Appearance</button>
      <div class="pv-p" id="pvA" role="dialog" aria-label="Appearance">
        <h3>Appearance</h3><p>Applies to this board only.</p>
        <div class="pv-g"><label for="pvD">Density</label><input type="range" id="pvD" min="0" max="2" value="1"><span id="pvCl">Accent</span><div class="pv-sw" role="group" aria-labelledby="pvCl"><button style="background:#c2410c" aria-pressed="true" aria-label="Ember"></button><button style="background:#0e7490" aria-pressed="false" aria-label="Tide"></button><button style="background:#6d28d9" aria-pressed="false" aria-label="Dusk"></button><button style="background:#15803d" aria-pressed="false" aria-label="Moss"></button></div></div>
      </div></div>
    <div class="pv-anc"><button class="pv-t pr" aria-expanded="false" aria-controls="pvB"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button>
      <div class="pv-p end" id="pvB" role="dialog" aria-label="Share">
        <h3>Share “Q4 roadmap”</h3><p>Anyone with the link can view.</p>
        <div class="pv-ppl" aria-label="4 people have access"><i style="background:#c2410c">MO</i><i style="background:#0e7490">JL</i><i style="background:#7c3aed">SR</i><i style="background:#71717a">+1</i></div>
        <div class="pv-row"><input readonly value="northwind.app/r/q4-7hk2" aria-label="Share link"><button type="button" id="pvCp">Copy</button></div>
        <div class="pv-acc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Link access<select aria-label="Link access"><option>Can view</option><option>Can comment</option><option>Can edit</option></select></div>
      </div></div>
  </div>
</div>
<script>
const pairs=[...document.querySelectorAll(".pv-t")].map(t=>[t,document.getElementById(t.getAttribute("aria-controls"))]);
const close=(except,f)=>pairs.forEach(([t,p])=>{if(t===except)return;if(p.classList.contains("on")&&f)t.focus();p.classList.remove("on");t.setAttribute("aria-expanded","false")});
pairs.forEach(([t,p])=>t.addEventListener("click",()=>{const o=!p.classList.contains("on");close(t);p.classList.toggle("on",o);t.setAttribute("aria-expanded",o);if(o)setTimeout(()=>p.querySelector("input,button,select")?.focus(),50)}));
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".pv-anc"))close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close(null,true)});
document.getElementById("pvCp").addEventListener("click",function(){const i=this.previousElementSibling;i.select();navigator.clipboard?.writeText(i.value).catch(()=>{});this.textContent="Copied ✓";setTimeout(()=>this.textContent="Copy",1500)});
document.querySelectorAll(".pv-sw button").forEach(b=>b.addEventListener("click",()=>b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))));
</script>

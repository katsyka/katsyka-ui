<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.as{display:grid;grid-template-columns:1fr 1fr;padding:0;place-items:stretch;background:var(--bg)}
.as-ph{margin:0;position:relative;overflow:hidden}.as-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.as-ph figcaption{position:absolute;left:32px;right:32px;bottom:32px;color:#fff;font:400 26px/1.25 'Instrument Serif',serif;display:grid;gap:8px;text-shadow:0 1px 12px #0008}.as-ph figcaption span{font:500 12px Geist,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.as-m{display:grid;place-items:center;padding:48px 16px}.as-f{width:min(360px,100%);display:grid;gap:16px}.as-lg{display:flex;gap:8px;align-items:center;font-weight:700;color:inherit;text-decoration:none;margin-bottom:24px}.as-lg .i{color:var(--ac)}
.as-f h1{margin:0;font-size:28px;letter-spacing:-.02em}.as-f .mu{margin:-8px 0 8px}.as-f .in{height:44px;font-size:16px}.as-pl{display:flex;justify-content:space-between}.as-pl a,.as-alt a{color:var(--ac);font-weight:550}
.as-pw{position:relative;display:block}.as-pw .ibt{position:absolute;right:4px;top:4px;width:36px;height:36px}.as-pw .in{padding-right:44px}
.as-e{color:var(--err);font-size:13px;display:block;margin-top:4px}.as-e:empty{display:none}.as-rm{display:flex;gap:8px;align-items:center;font-size:14px;min-height:24px}.as-rm input{width:18px;height:18px;accent-color:var(--ac)}
.as-go{height:44px;font-size:15px}.as-st{margin:0;font-size:14px;color:var(--err)}.as-st:empty{display:none}.as-alt{text-align:center;margin:0!important;font-size:14px}
.as-sp{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:assp .7s linear infinite}@keyframes assp{to{transform:rotate(1turn)}}
@media (max-width:820px){.k.as{grid-template-columns:1fr}.as-ph{display:none}}
</style>
<div class="k as">
<figure class="as-ph"><img src="media/pics/c/1035.jpg" alt=""><figcaption>“Skógafoss at 5 a.m., the only time it's empty.”<span>Photo of the week</span></figcaption></figure>
<main class="as-m"><form class="as-f" id="f" novalidate><a class="as-lg" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Waypoint</a><h1>Welcome back</h1><p class="mu">Sign in to your trips and saved routes.</p>
<label><span class="lbl">Email</span><input class="in" id="em" type="email" autocomplete="email" aria-describedby="e1"><small class="as-e" id="e1"></small></label>
<label><span class="lbl as-pl">Password<a href="#">Forgot?</a></span><span class="as-pw"><input class="in" id="pw" type="password" autocomplete="current-password" aria-describedby="e2"><button type="button" class="ibt" id="sh" aria-label="Show password" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span><small class="as-e" id="e2"></small></label>
<label class="as-rm"><input type="checkbox" checked> Keep me signed in for 30 days</label>
<button class="b ac as-go" id="go">Sign in</button><p class="as-st" id="st" role="alert"></p><p class="mu as-alt">New here? <a href="#">Create an account</a></p></form></main>
</div>
<script>
const $=i=>document.getElementById(i),f=$('f'),em=$('em'),pw=$('pw'),go=$('go');
$('sh').onclick=e=>{const b=e.currentTarget,s=pw.type==='password';pw.type=s?'text':'password';b.setAttribute('aria-pressed',s);b.setAttribute('aria-label',s?'Hide password':'Show password')};
function v(i,m,ok){i.setAttribute('aria-invalid',!ok);$(i.getAttribute('aria-describedby')).textContent=ok?'':m;return ok}
f.onsubmit=e=>{e.preventDefault();$('st').textContent='';const a=v(em,'Enter a valid email address.',/^\S+@\S+\.\S+$/.test(em.value)),b=v(pw,'Enter your password.',pw.value.length>0);if(!a)return em.focus();if(!b)return pw.focus();
go.disabled=true;go.innerHTML='<span class="as-sp"></span>Signing in…';setTimeout(()=>{go.disabled=false;go.textContent='Sign in';if(pw.value!=='demo'){$('st').textContent='Email or password is wrong. (Hint: the demo password is “demo”.)';pw.select()}else{go.textContent='Signed in ✓'}},900)};
</script>

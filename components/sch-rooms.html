<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.rb{width:min(1000px,100%);display:grid;gap:12px}.rb-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.rb-h h2{margin:0;font-size:22px;letter-spacing:-.02em;margin-right:auto}.rb-h select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;color:var(--fg)}.rb-sc{display:flex;gap:6px;align-items:center;font-size:14px}.rb-sc input{width:16px;height:16px;accent-color:var(--fg)}
.rb-w{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow-x:auto;position:relative}.rb-g{min-width:760px;display:grid;grid-template-columns:150px repeat(20,1fr);user-select:none}
.rb-hd{font-size:11px;color:var(--mu);padding:8px 0 6px;border-bottom:1px solid var(--line)}.rb-hd:nth-child(odd){color:transparent}.rb-hd:first-child{color:var(--mu)}.rb-rn{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;font-size:14px}.rb-rn small{color:var(--mu);font-size:11px}
.rb-tr{grid-column:2/-1;position:relative;border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line) calc(10% - 1px) 10%);cursor:crosshair;touch-action:none}
.rb-b{position:absolute;top:6px;bottom:6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,var(--bg));box-shadow:inset 3px 0 0 var(--c);font-size:11.5px;padding:3px 7px;overflow:hidden;white-space:nowrap;display:grid}.rb-b small{color:var(--mu)}.rb-b.new{background:color-mix(in srgb,var(--ac) 20%,var(--bg));box-shadow:inset 3px 0 0 var(--ac)}.rb-b.bad{background:var(--err-sf);box-shadow:inset 3px 0 0 var(--err)}
.rb-now{position:absolute;top:0;bottom:0;width:2px;background:var(--err);z-index:2;pointer-events:none}.rb-m{font-size:13px;margin:0;color:var(--mu)}
</style>
<div class="k"><div class="rb"><div class="rb-h"><h2>Rooms today</h2><label class="mu">Seats ≥ <select id="cap"><option value="0">any</option><option value="4">4</option><option value="8">8</option></select></label><label class="rb-sc"><input type="checkbox" id="scr"> Has screen</label></div><div class="rb-w"><div class="rb-g" id="g"></div></div><p class="rb-m" id="m" role="status">Drag across free time to book.</p></div></div>
<script>
const R=[["Fjord","4 seats",4,1],["Harbour","8 seats · screen",8,1],["Library","2 seats",2,0],["Atrium","14 seats · screen",14,1]],H0=8,H1=18,N=(H1-H0)*2;let B=[[0,9,10,"Design crit","Lena","#7c3aed"],[0,13,14.5,"1:1","Jonas","#0f766e"],[1,10,12,"Sprint planning","Web team","#2563eb"],[2,11,11.5,"Phone call","Sam","#b45309"],[3,15,17,"All hands","Everyone","#be123c"]];
const $=i=>document.getElementById(i),fh=h=>`${String(Math.floor(h)).padStart(2,'0')}:${h%1?'30':'00'}`,P=h=>(h-H0)/(H1-H0)*100;
function draw(tmp){const cap=+$('cap').value,sc=$('scr').checked,V=R.map((r,i)=>[r,i]).filter(([r])=>r[2]>=cap&&(!sc||r[3]));let h='<div class="rb-hd" style="padding-left:12px">Room</div>'+Array.from({length:N},(_,i)=>`<div class="rb-hd">${i%2?'':fh(H0+i/2)}</div>`).join('');
const n=new Date(),nh=n.getHours()+n.getMinutes()/60;V.forEach(([[name,info],ri])=>{h+=`<div class="rb-rn"><b>${name}</b><small>${info}</small></div><div class="rb-tr" data-r="${ri}">${B.filter(b=>b[0]===ri).map(b=>`<div class="rb-b" style="left:${P(b[1])}%;width:${P(b[2])-P(b[1])}%;--c:${b[5]}"><b>${b[3]}</b><small>${fh(b[1])}–${fh(b[2])} · ${b[4]}</small></div>`).join('')}${tmp&&tmp.r===ri?`<div class="rb-b ${tmp.bad?'bad':'new'}" style="left:${P(tmp.s)}%;width:${P(tmp.e)-P(tmp.s)}%"><b>${tmp.bad?'Overlaps a booking':'New booking'}</b><small>${fh(tmp.s)}–${fh(tmp.e)}</small></div>`:''}${nh>H0&&nh<H1?`<span class="rb-now" style="left:${P(nh)}%"></span>`:''}</div>`});$('g').innerHTML=h}
const hAt=(tr,x)=>{const r=tr.getBoundingClientRect();return Math.max(H0,Math.min(H1,H0+Math.round((x-r.left)/r.width*N)/2))};let dr=null;
$('g').addEventListener('pointerdown',e=>{const tr=e.target.closest('.rb-tr');if(!tr||e.target.closest('.rb-b'))return;const s=hAt(tr,e.clientX);dr={r:+tr.dataset.r,a:s,s,e:s+.5,tr};tr.setPointerCapture(e.pointerId);draw(dr)});
$('g').addEventListener('pointermove',e=>{if(!dr)return;const h=hAt(dr.tr,e.clientX);dr.s=Math.min(dr.a,h);dr.e=Math.max(dr.a+.5,h);dr.bad=B.some(b=>b[0]===dr.r&&b[1]<dr.e&&b[2]>dr.s);draw(dr);dr.tr=$('g').querySelector(`[data-r="${dr.r}"]`)});
$('g').addEventListener('pointerup',()=>{if(!dr)return;const d=dr;dr=null;if(d.bad){$('m').textContent=`${R[d.r][0]} is already booked then. Try another time or room.`;draw();return}B.push([d.r,d.s,d.e,'Your booking','You','#0ea5e9']);$('m').textContent=`Booked ${R[d.r][0]}, ${fh(d.s)}–${fh(d.e)}.`;draw()});$('cap').onchange=$('scr').onchange=()=>draw();draw();
</script>

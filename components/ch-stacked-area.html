<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.sa{width:min(760px,100%);padding:20px;margin:0}.sa figcaption{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sa-m{display:flex;background:var(--sf2);border-radius:8px;padding:2px}.sa-m button{height:28px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--mu)}.sa-m [aria-checked=true]{background:var(--bg);color:var(--fg)}
.sa-c{position:relative;height:260px}.sa-c svg{width:100%;height:100%;display:block}.sa path{transition:opacity .2s}.sa svg.iso path.ly:not(.on){opacity:.15}.sa .g{stroke:var(--line)}.sa .ax{fill:var(--mu);font-size:11px}.sa .x{stroke:var(--fg);stroke-opacity:.3}
.sa-tip{position:absolute;top:4px;background:var(--fg);color:var(--bg);font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;display:grid;gap:3px;min-width:140px}.sa-tip div{display:flex;justify-content:space-between;gap:12px}.sa-tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.sa-l{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sa-l button{display:flex;gap:6px;align-items:center;font-size:12px;height:28px;padding:0 8px;border-radius:6px}.sa-l button:hover{background:var(--sf)}.sa-l [aria-pressed=true]{background:var(--sf2);font-weight:600}.sa-l i{width:10px;height:10px;border-radius:3px;background:var(--c)}
</style>
<div class="k"><figure class="sa card"><figcaption><b>Signups by source</b><div class="sa-m" role="radiogroup" aria-label="Scale"><button role="radio" aria-checked="true" data-m="abs">Count</button><button role="radio" aria-checked="false" data-m="pct">Share</button></div></figcaption><div class="sa-c" id="c"><svg id="s" role="img" aria-label="Stacked area chart of weekly signups by source"></svg><div class="sa-tip" id="tp" hidden></div></div><div class="sa-l" id="l"></div></figure></div>
<script>
const L=[["Organic search","#4c1d95"],["Referral","#7c3aed"],["Social","#a78bfa"],["Direct","#ddd6fe"]],N=12,D=L.map((_,k)=>Array.from({length:N},(_,i)=>Math.round([140,60,40,90][k]+Math.sin(i/2+k)*[30,20,25,15][k]+i*[9,4,-1,2][k])));
const s=document.getElementById('s'),c=document.getElementById('c'),tp=document.getElementById('tp');let pct=false,iso=-1,hi=-1;
function draw(){const W=c.clientWidth,H=260,Lm=40,B=22,T=8,tot=Array.from({length:N},(_,i)=>D.reduce((a,d)=>a+d[i],0)),mx=pct?1:Math.ceil(Math.max(...tot)/100)*100,X=i=>Lm+i/(N-1)*(W-Lm-8),Y=v=>T+(1-v/mx)*(H-T-B);
s.setAttribute('viewBox',`0 0 ${W} ${H}`);let acc=Array(N).fill(0),h=[0,.5,1].map(f=>`<line class="g" x1="${Lm}" x2="${W}" y1="${Y(mx*f)}" y2="${Y(mx*f)}"/><text class="ax" x="${Lm-6}" y="${Y(mx*f)+4}" text-anchor="end">${pct?Math.round(f*100)+'%':Math.round(mx*f)}</text>`).join('');
D.forEach((d,k)=>{const lo=acc.slice(),hiA=acc.map((a,i)=>a+(pct?d[i]/tot[i]:d[i]));h+=`<path class="ly${iso===k?' on':''}" fill="${L[k][1]}" d="M${hiA.map((v,i)=>`${X(i)},${Y(v)}`).join('L')}L${lo.map((v,i)=>`${X(i)},${Y(v)}`).reverse().join('L')}Z"/>`;acc=hiA});
h+=Array.from({length:N},(_,i)=>i%3?'':`<text class="ax" x="${X(i)}" y="${H-5}" text-anchor="middle">W${i+1}</text>`).join('');if(hi>=0)h+=`<line class="x" x1="${X(hi)}" x2="${X(hi)}" y1="${T}" y2="${H-B}"/>`;s.innerHTML=h;s.classList.toggle('iso',iso>=0);
if(hi>=0){tp.hidden=false;tp.style.left=(X(hi)>W/2?X(hi)-160:X(hi)+12)+'px';tp.innerHTML=`<b>Week ${hi+1} · ${tot[hi]}</b>`+L.map((l,k)=>[l,k]).reverse().map(([[n,col],k])=>`<div><span><i style="--c:${col}"></i>${n}</span><b>${pct?Math.round(D[k][hi]/tot[hi]*100)+'%':D[k][hi]}</b></div>`).join('')}else tp.hidden=true}
c.onpointermove=e=>{const r=c.getBoundingClientRect();hi=Math.max(0,Math.min(N-1,Math.round((e.clientX-r.left-40)/(r.width-48)*(N-1))));draw()};c.onpointerleave=()=>{hi=-1;draw()};
document.getElementById('l').innerHTML=L.map(([n,col],k)=>`<button aria-pressed="false" data-k="${k}" style="--c:${col}"><i></i>${n}</button>`).reverse().join('');
document.getElementById('l').onclick=e=>{const b=e.target.closest('button');if(!b)return;iso=iso===+b.dataset.k?-1:+b.dataset.k;document.querySelectorAll('.sa-l button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.k===iso));draw()};
document.querySelector('.sa-m').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));pct=b.dataset.m==='pct';draw()};draw();addEventListener('resize',draw);
</script>

<style>
.lp{min-height:100vh;display:grid;place-items:center;background:#f5f3ef;color:#1b1a18;padding:60px clamp(20px,8vw,120px)}
.lp p{max-width:820px;margin:0;font-size:clamp(24px,3.2vw,42px);line-height:1.32;letter-spacing:-.035em;font-weight:450}
.lp small{display:block;font:500 12px "Geist Mono",monospace;letter-spacing:.06em;color:#8e8a82;margin-bottom:26px}
.lp a{position:relative;color:inherit;text-decoration:none;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;letter-spacing:-.01em;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .45s cubic-bezier(.6,0,.2,1);cursor:pointer}
.lp a:hover{background-size:100% 1.5px}
.lp-card{position:fixed;left:0;top:0;z-index:5;width:260px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 0 #0000000d,0 24px 50px -14px #0005;pointer-events:none;opacity:0;transform:translateY(8px) scale(.94) rotate(-2deg);transform-origin:50% 100%;transition:opacity .2s,transform .35s cubic-bezier(.2,1.3,.4,1)}
.lp-card.on{opacity:1;transform:none}
.lp-card .im{height:150px;background:#ddd center/cover;transition:background-image .2s}
.lp-card div.t{padding:12px 14px 14px}
.lp-card b{display:block;font-size:14px;letter-spacing:-.01em;margin-bottom:3px}
.lp-card span{font:12px "Geist Mono",monospace;color:#8e8a82}
</style>
<section class="lp">
  <div><small>HOVER THE ITALIC WORDS</small>
  <p>We started in a <a data-i="1050" data-t="The workshop" data-u="ui.katsyka.dev/workshop">tiny workshop</a> above a bakery, built our first product for a <a data-i="1062" data-t="Marlow Coffee" data-u="marlow.coffee">coffee roaster</a> down the street, and somehow ended up designing tools for <a data-i="1076" data-t="Tidal Energy" data-u="tidal.energy">ocean engineers</a> and <a data-i="1043" data-t="Field Notes" data-u="fieldnotes.app">field biologists</a>. The common thread is <a data-i="1025" data-t="Our principles" data-u="ui.katsyka.dev/about">care for the details</a>.</p></div>
  <div class="lp-card"><div class="im"></div><div class="t"><b></b><span></span></div></div>
</section>
<script>
(()=>{
const card=document.querySelector(".lp-card"),im=card.querySelector(".im"),tt=card.querySelector("b"),uu=card.querySelector("span");
document.querySelectorAll(".lp a[data-i]").forEach(a=>{new Image().src=`https://picsum.photos/id/${a.dataset.i}/520/300`;
  a.addEventListener("mouseenter",()=>{im.style.backgroundImage=`url(https://picsum.photos/id/${a.dataset.i}/520/300)`;tt.textContent=a.dataset.t;uu.textContent=a.dataset.u;
    const r=a.getBoundingClientRect(),x=Math.max(12,Math.min(innerWidth-272,r.left+r.width/2-130)),above=r.top>240;
    card.style.left=x+"px";card.style.top=(above?r.top-card.offsetHeight-12:r.bottom+12)+"px";card.style.transformOrigin=above?"50% 100%":"50% 0";card.classList.add("on")});
  a.addEventListener("mouseleave",()=>card.classList.remove("on"))});
addEventListener("scroll",()=>card.classList.remove("on"),{passive:true});
})();
</script>

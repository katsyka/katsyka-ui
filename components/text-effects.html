<style>
.tx{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:56px;padding:64px clamp(20px,6vw,90px);background:#09090b}
.tx small{display:block;font:12px "Geist Mono",monospace;color:#55555e;margin-bottom:10px}
.tx-big{font-size:clamp(34px,5.4vw,72px);line-height:1;letter-spacing:-.05em;font-weight:600;margin:0}
.tx-scr{font-family:"Geist Mono",monospace;letter-spacing:-.04em;cursor:default}
.tx-scr span.x{color:#ff5a1f}
.tx-rot{display:inline-grid;vertical-align:bottom;height:1.25em;margin-bottom:-.12em;padding:0 .08em;overflow:hidden}
.tx-rot b{grid-area:1/1;line-height:1.2;font-weight:inherit;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:#ff7a45;transform:translateY(110%);transition:transform .7s cubic-bezier(.7,0,.2,1)}
.tx-rot b.in{transform:none}.tx-rot b.out{transform:translateY(-110%)}
.tx-sweep{background:linear-gradient(90deg,#3a3a42 0%,#3a3a42 40%,#fff 50%,#3a3a42 60%,#3a3a42 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tx-sw 3.5s linear infinite}
@keyframes tx-sw{from{background-position:100% 0}to{background-position:-150% 0}}
.tx-fill{position:relative;color:transparent;-webkit-text-stroke:1.5px #ffffff40;cursor:default}
.tx-fill::after{content:attr(data-text);position:absolute;inset:0;color:#f4f3ef;-webkit-text-stroke:0;clip-path:inset(0 100% 0 0);transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.tx-fill:hover::after{clip-path:inset(0 0 0 0)}
</style>
<section class="tx">
  <div><small>scramble · hover to replay</small><p class="tx-big tx-scr" data-scramble>DECRYPTING SIGNAL</p></div>
  <div><small>rotating word</small><p class="tx-big">Built for <span class="tx-rot"><b class="in">designers</b><b>founders</b><b>engineers</b><b>everyone</b></span></p></div>
  <div><small>light sweep</small><p class="tx-big tx-sweep">Loading the good stuff…</p></div>
  <div><small>stroke to fill · hover</small><p class="tx-big tx-fill" data-text="Make it unmistakable.">Make it unmistakable.</p></div>
</section>
<script>
(()=>{
const G="ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&$@*+=<>/";
document.querySelectorAll("[data-scramble]").forEach(el=>{
  const final=el.textContent;let raf;
  const run=()=>{cancelAnimationFrame(raf);const start=performance.now();
    (function f(t){const p=(t-start)/1100;let out="";
      for(let i=0;i<final.length;i++){const c=final[i];
        if(c===" "||p*final.length*1.3>i+final.length*.3*Math.random()) out+=c;
        else out+=`<span class="x">${G[Math.random()*G.length|0]}</span>`}
      el.innerHTML=out;if(p<1)raf=requestAnimationFrame(f);else el.textContent=final})(start)};
  run();el.addEventListener("mouseenter",run);
});
document.querySelectorAll(".tx-rot").forEach(r=>{const w=[...r.children];let i=0;
  setInterval(()=>{const a=w[i],b=w[i=(i+1)%w.length];a.classList.replace("in","out");b.classList.remove("out");
    void b.offsetWidth;b.classList.add("in");setTimeout(()=>{a.style.transition="none";a.classList.remove("out");void a.offsetWidth;a.style.transition=""},700)},2000)});
})();
</script>

<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k .card{box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 7%,transparent)}
.k.sp2{align-items:start}.sp2-f{width:min(680px,100%);display:grid;gap:0;padding-bottom:80px}.sp2-f h1{margin:0;font-size:24px;letter-spacing:-.02em}.sp2-f>p{margin:4px 0 20px}
.sp2-row{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line);align-items:start}.sp2-row .lbl{padding-top:10px;margin:0}.sp2-row .in{font-size:15px}.sp2-row textarea.in{height:auto;padding:10px 12px;resize:vertical}
.sp2-av{display:flex;gap:16px;align-items:center}.sp2-av>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp2-av small{width:100%}.sp2-img{width:64px;height:64px;border-radius:50%;background:#4338ca center/cover;color:#fff;display:grid;place-items:center;font-weight:650;font-size:20px;flex:none}
.sp2-pre{display:flex;align-items:center;border:1px solid var(--ctl);border-radius:10px;overflow:hidden}.sp2-pre:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}.sp2-pre span{padding:0 0 0 12px;color:var(--mu)}.sp2-pre .in{border:0;padding-left:2px}.sp2-pre .in:focus{box-shadow:none}
.sp2-h{display:flex;gap:6px;align-items:center;margin-top:6px}.sp2-h.ok{color:var(--ok)}.sp2-h.no{color:var(--err)}
.sp2-bar{position:sticky;bottom:16px;margin-top:16px;display:flex;gap:8px;align-items:center;padding:10px 10px 10px 16px;border-radius:12px;background:var(--fg);color:var(--bg);animation:spb .2s cubic-bezier(.23,1,.32,1)}.sp2-bar span{flex:1;font-size:14px}.k .sp2-bar .b.gh{color:var(--bg)}.k .sp2-bar .b.gh:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}@keyframes spb{from{opacity:0;transform:translateY(8px)}}
@media (max-width:640px){.sp2-row{grid-template-columns:1fr;gap:6px}.sp2-row .lbl{padding:0}}
</style>
<div class="k sp2"><form class="sp2-f" id="f" novalidate><h1>Profile</h1><p class="mu">This is how others see you across the workspace.</p>
<div class="sp2-row"><span class="lbl">Photo</span><div class="sp2-av"><span class="sp2-img" id="im">LK</span><div><label class="b sec sm" for="up"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Upload</label><input type="file" id="up" accept="image/*" class="vh"><button type="button" class="b gh sm" id="rm">Remove</button><small class="mu">JPG or PNG, at least 256 × 256.</small></div></div></div>
<div class="sp2-row"><label class="lbl" for="nm">Display name</label><input class="in" id="nm" value="Lena Kraus" autocomplete="name"></div>
<div class="sp2-row"><label class="lbl" for="un">Username</label><div><div class="sp2-pre"><span>quill.so/</span><input class="in" id="un" value="lena" autocomplete="username" aria-describedby="uh" spellcheck="false"></div><small id="uh" class="sp2-h mu">Letters, numbers and dashes.</small></div></div>
<div class="sp2-row"><label class="lbl" for="bio">Bio</label><div><textarea class="in" id="bio" rows="3" maxlength="160">Type designer in Hamburg. Mostly grotesques.</textarea><small class="mu tn" id="bc"></small></div></div>
<div class="sp2-row"><label class="lbl" for="tz">Time zone</label><select class="in" id="tz"><option>Europe/Berlin (UTC+1)</option><option>Europe/London (UTC+0)</option><option>America/New_York (UTC−5)</option><option>Asia/Tokyo (UTC+9)</option></select></div>
<div class="sp2-bar" id="bar" hidden><span>You have unsaved changes</span><button type="button" class="b gh sm" id="rs">Discard</button><button class="b ac sm" id="sv">Save changes</button></div></form></div>
<script>
const $=i=>document.getElementById(i),f=$('f'),bar=$('bar'),fields=['nm','un','bio','tz'],init={};fields.forEach(k=>init[k]=$(k).value);let photo=0,t;
const dirty=()=>photo||fields.some(k=>$(k).value!==init[k]);const chk=()=>{bar.hidden=!dirty()};
const bc=()=>$('bc').textContent=`${$('bio').value.length} / 160`;bc();
f.addEventListener('input',e=>{if(e.target.id==='bio')bc();chk()});f.addEventListener('change',chk);
$('un').addEventListener('input',e=>{const v=e.target.value=e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,''),h=$('uh');clearTimeout(t);if(v===init.un){h.className='sp2-h mu';h.textContent='This is your current username.';return}if(v.length<3){h.className='sp2-h no';h.textContent='At least 3 characters.';return}h.className='sp2-h mu';h.textContent='Checking…';t=setTimeout(()=>{const taken=['admin','support','lena-k','max'].includes(v);h.className='sp2-h '+(taken?'no':'ok');h.textContent=taken?`quill.so/${v} is taken.`:`quill.so/${v} is available.`;$('un').setAttribute('aria-invalid',taken)},450)});
$('up').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const im=$('im');im.style.backgroundImage=`url(${URL.createObjectURL(fl)})`;im.textContent='';photo=1;chk()};$('rm').onclick=()=>{const im=$('im');im.style.backgroundImage='';im.textContent='LK';photo=1;chk()};
$('rs').onclick=()=>{fields.forEach(k=>$(k).value=init[k]);photo=0;$('im').style.backgroundImage='';$('im').textContent='LK';bc();$('uh').className='sp2-h mu';$('uh').textContent='Letters, numbers and dashes.';chk()};
f.onsubmit=e=>{e.preventDefault();if($('un').getAttribute('aria-invalid')==='true')return $('un').focus();const b=$('sv');b.disabled=true;b.textContent='Saving…';setTimeout(()=>{fields.forEach(k=>init[k]=$(k).value);photo=0;b.disabled=false;b.textContent='Save changes';bar.querySelector('span').textContent='Saved';setTimeout(()=>{bar.querySelector('span').textContent='You have unsaved changes';chk()},900)},700)};
</script>

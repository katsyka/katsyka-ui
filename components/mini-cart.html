<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.k{place-items:start center;padding-top:40px;align-content:start;gap:24px}
.mc-hd{width:min(820px,100%);display:flex;align-items:center;gap:24px;padding:10px 12px 10px 20px;border-radius:14px}.mc-lg{font:400 24px/1 "Instrument Serif",serif}
.mc-n{display:flex;gap:4px;flex:1}.mc-n a{padding:6px 10px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500}.mc-n a:hover{color:var(--fg);background:var(--sf)}
.mc-w{position:relative}.mc-btn{width:44px;padding:0;position:relative}
.mc-c{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ac);color:var(--ac-fg);font-size:11px;font-weight:700;display:grid;place-items:center}
.mc-c.bump{animation:bp .4s cubic-bezier(.3,1.6,.5,1)}@keyframes bp{40%{transform:scale(1.4)}}
.mc-dd{position:absolute;right:0;top:calc(100% + 8px);z-index:10;width:340px;padding:16px;transform-origin:top right;animation:dd .18s var(--ease)}
@keyframes dd{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.mc-ship{font-size:13px;margin-bottom:8px}.mc-ship>i{display:block;height:6px;border-radius:3px;background:var(--sf2);margin-top:6px;overflow:hidden}.mc-ship>i>i{display:block;height:100%;background:var(--ok);transition:width .4s var(--ease)}
.mc-dd ul{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
.mc-dd li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.mc-dd img{width:44px;height:52px;border-radius:6px;object-fit:cover}
.mc-dd li .tx{flex:1;min-width:0}.mc-dd li b{display:block;font-weight:550}.mc-dd li small{color:var(--mu);font-size:12px}
.mc-q{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}.mc-q button{width:28px;height:28px;display:grid;place-items:center;color:var(--mu)}.mc-q button:hover{color:var(--fg)}.mc-q output{min-width:20px;text-align:center;font-size:13px;font-weight:600}
.mc-dd dl{display:flex;justify-content:space-between;margin:12px 0;font-weight:650}.mc-dd dd{margin:0}
.mc-e{padding:24px 0;text-align:center;color:var(--mu)}
@media (max-width:600px){.mc-n{display:none}.mc-hd{justify-content:space-between}.mc-dd{width:min(340px,calc(100vw - 32px))}}
</style>
<div class="k"><header class="card mc-hd"><b class="mc-lg">Field Prints</b><nav class="mc-n"><a href="#">Prints</a><a href="#">Frames</a><a href="#">Gifts</a></nav>
  <div class="mc-w"><button class="b gh mc-btn" id="cb" aria-expanded="false" aria-controls="dd" aria-label="Cart, 2 items"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M5 7h14l-1 14H6zM9 7a3 3 0 0 1 6 0"/></svg><span class="mc-c tn" id="cc">2</span></button>
  <div class="card mc-dd" id="dd" hidden><div class="mc-ship"><span id="st"></span><i><i id="sb"></i></i></div><ul id="l"></ul><dl><dt>Subtotal</dt><dd class="tn" id="sub"></dd></dl><button class="b ac" style="width:100%;height:42px">Checkout</button><button class="b gh" style="width:100%;margin-top:4px">View cart</button></div></div></header>
  <button class="b sec mc-add" id="add"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M12 5v14M5 12h14"/></svg>Add “Low tide” to cart</button></div>
<script>
const C=[["1043","Valley floor","50×70 · Oak",106,1],["1080","Strawberries","30×40",38,1]];const FREE=150;
const draw=()=>{const n=C.reduce((a,c)=>a+c[4],0),s=C.reduce((a,c)=>a+c[3]*c[4],0);cc.textContent=n;cc.hidden=!n;cb.setAttribute("aria-label",`Cart, ${n} item${n===1?"":"s"}`);
 l.innerHTML=C.length?C.map(([p,t,v,pr,q],i)=>`<li><img src="media/pics/c/${p}.jpg" alt=""><span class="tx"><b>${t}</b><small>${v} · <span class="tn">$${pr*q}</span></small></span><span class="mc-q"><button data-i="${i}" data-d="-1" aria-label="Decrease ${t}">−</button><output>${q}</output><button data-i="${i}" data-d="1" aria-label="Increase ${t}">+</button></span></li>`).join(""):'<li class="mc-e">Your cart is empty.</li>';
 sub.textContent="$"+s;st.innerHTML=s>=FREE?"You've got <b>free shipping</b>":`<b class="tn">$${FREE-s}</b> away from free shipping`;sb.style.width=Math.min(100,s/FREE*100)+"%"};
l.onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;const c=C[b.dataset.i];c[4]+=+b.dataset.d;if(c[4]<=0)C.splice(b.dataset.i,1);draw()};
const open=o=>{dd.hidden=!o;cb.setAttribute("aria-expanded",o)};
cb.onclick=()=>open(dd.hidden);
document.addEventListener("click",e=>{if(!e.target.closest(".mc-w")&&e.target!==add&&!add.contains(e.target))open(false)});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!dd.hidden){open(false);cb.focus()}});
add.onclick=()=>{const c=C.find(c=>c[1]==="Low tide");if(c)c[4]++;else C.push(["1050","Low tide","50×70",48,1]);draw();cc.classList.remove("bump");void cc.offsetWidth;cc.classList.add("bump")};
document.querySelectorAll('a[href="#"]').forEach(a=>a.onclick=e=>e.preventDefault());draw();
</script>

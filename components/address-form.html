<style>
.k{color-scheme:light dark;--bg:light-dark(#ffffff,#0f0f11);--sf:light-dark(#f6f6f4,#18181b);--sf2:light-dark(#ececea,#26262b);--fg:light-dark(#18181b,#f4f4f5);--mu:light-dark(#5b5b66,#a1a1aa);--line:light-dark(#e4e4e1,#2a2a2f);--ctl:light-dark(#8a8a94,#71717a);--ac:light-dark(#c2410c,#ff8a4c);--ac-h:light-dark(#9a3412,#ffa36e);--ac-fg:light-dark(#ffffff,#1a0a03);--ac-sf:light-dark(#fff1e8,#2a1409);--focus:light-dark(#1d4ed8,#93c5fd);--ok:light-dark(#15803d,#4ade80);--ok-sf:light-dark(#ecfdf3,#0b2a17);--warn:light-dark(#a16207,#facc15);--warn-sf:light-dark(#fefce8,#2a2306);--err:light-dark(#b91c1c,#f87171);--err-sf:light-dark(#fef2f2,#2c1010);--info:light-dark(#1d4ed8,#93c5fd);--info-sf:light-dark(#eff6ff,#0f1b33);--shadow:light-dark(0 1px 2px #0000000d\,0 8px 24px -8px #00000026,0 1px 2px #0006\,0 12px 32px -8px #000a);--r1:6px;--r2:10px;--r3:14px;--ease:cubic-bezier(.2,.8,.2,1);font:16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.k :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.k ::selection{background:var(--ac);color:var(--ac-fg)}
@media (prefers-reduced-motion:reduce){.k *,.k *::before,.k *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.k{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--sf);font-size:14px}
.k :where(button,input,select,textarea){font:inherit;color:inherit}
.k :where(button){cursor:pointer;background:none;border:0;padding:0}
.k [hidden]{display:none!important}
.k .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.k .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:550;background:var(--fg);color:var(--bg);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.k .b:active{transform:translateY(1px)}.k .b:disabled{opacity:.45;cursor:not-allowed}
.k .b.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.k .b.sec:hover{background:var(--sf)}
.k .b.ac{background:var(--ac);color:var(--ac-fg)}.k .b.ac:hover{background:var(--ac-h)}
.k .b.gh{background:none;color:var(--fg)}.k .b.gh:hover{background:var(--sf)}
.k .b.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.k .ibt{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}.k .ibt:hover{background:var(--sf);color:var(--fg)}
.k .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--c,#6b7280)}
.k .mu{color:var(--mu)}.k .tn{font-variant-numeric:tabular-nums}
.k .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k .in{height:40px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.k .in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.k .in[aria-invalid=true]{border-color:var(--err)}
.k .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:550}
.k .pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu)}
.k .pill.ok{background:var(--ok-sf);color:var(--ok)}.k .pill.warn{background:var(--warn-sf);color:var(--warn)}.k .pill.err{background:var(--err-sf);color:var(--err)}.k .pill.info{background:var(--info-sf);color:var(--info)}

.af2{width:min(520px,100%);padding:24px}.af2 h2{margin:0 0 16px;font-size:17px;font-weight:650}
.af2-g{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}.f2.full{grid-column:1/-1}
.af2 select.in{appearance:auto}
.f2 .er{display:block;margin-top:4px;font-size:12px;color:var(--err)}
.af2-sum{margin-bottom:16px;padding:12px 14px;border-radius:10px;background:var(--err-sf);color:var(--err);border:1px solid color-mix(in srgb,var(--err) 30%,transparent)}.af2-sum b{display:block;margin-bottom:4px}.af2-sum a{color:inherit;display:block;font-size:13px}
.af2-ck{display:flex;align-items:center;gap:8px;margin:16px 0;cursor:pointer}.af2-ck input{accent-color:var(--ac);width:16px;height:16px;margin:0}
#sv{width:100%;height:44px}
@media (max-width:420px){.af2-g{grid-template-columns:1fr}}
</style>
<div class="k"><form class="card af2" id="f" novalidate><h2>Shipping address</h2>
  <div class="af2-sum" id="sum" role="alert" tabindex="-1" hidden></div>
  <div class="af2-g">
    <div class="f2 full"><label class="lbl" for="nm">Full name</label><input class="in" id="nm" autocomplete="name" required></div>
    <div class="f2 full"><label class="lbl" for="co">Country</label><select class="in" id="co" autocomplete="country"><option value="NO">Norway</option><option value="GB">United Kingdom</option><option value="US">United States</option><option value="DE">Germany</option></select></div>
    <div class="f2 full"><label class="lbl" for="a1">Street address</label><input class="in" id="a1" autocomplete="address-line1" required></div>
    <div class="f2 full"><label class="lbl" for="a2">Apartment, floor <span class="mu">(optional)</span></label><input class="in" id="a2" autocomplete="address-line2"></div>
    <div class="f2"><label class="lbl" for="pc" id="pcl">Postcode</label><input class="in tn" id="pc" autocomplete="postal-code" required></div>
    <div class="f2"><label class="lbl" for="ct">City</label><input class="in" id="ct" autocomplete="address-level2" required></div>
    <div class="f2 full"><label class="lbl" for="ph">Phone <span class="mu">(for the courier)</span></label><input class="in tn" id="ph" type="tel" autocomplete="tel" inputmode="tel"></div>
  </div>
  <label class="af2-ck"><input type="checkbox" checked> Use as billing address</label>
  <button class="b ac" id="sv">Save address</button></form></div>
<script>
const PC={NO:["Postcode",/^\d{4}$/,"4 digits, like 5013"],GB:["Postcode",/^[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}$/i,"like SW1A 1AA"],US:["ZIP code",/^\d{5}(-\d{4})?$/,"5 digits, like 94103"],DE:["Postleitzahl",/^\d{5}$/,"5 digits, like 10115"]};
const L={nm:"Full name",a1:"Street address",pc:"",ct:"City"};
const chk=el=>{let m="";const v=el.value.trim();if(el.required&&!v)m=(el.id==="pc"?PC[co.value][0]:L[el.id])+" is required";else if(el.id==="pc"&&v&&!PC[co.value][1].test(v))m=`${PC[co.value][0]} should be ${PC[co.value][2]}`;
 let er=el.parentElement.querySelector(".er");if(m){if(!er){er=document.createElement("span");er.className="er";er.id=el.id+"-e";el.parentElement.append(er)}er.textContent=m;el.setAttribute("aria-invalid","true");el.setAttribute("aria-describedby",er.id)}else{er&&er.remove();el.removeAttribute("aria-invalid");el.removeAttribute("aria-describedby")}return m};
co.onchange=()=>{pcl.textContent=PC[co.value][0];if(pc.value)chk(pc)};
f.querySelectorAll("[required]").forEach(i=>{i.addEventListener("blur",()=>i.value&&chk(i));i.addEventListener("input",()=>i.hasAttribute("aria-invalid")&&chk(i))});
f.onsubmit=e=>{e.preventDefault();const errs=[...f.querySelectorAll("[required]")].map(i=>[i,chk(i)]).filter(x=>x[1]);
 if(errs.length){sum.hidden=false;sum.innerHTML=`<b>Fix ${errs.length} field${errs.length>1?"s":""} to continue</b>`+errs.map(([i,m])=>`<a href="#${i.id}">${m}</a>`).join("");sum.focus();sum.querySelectorAll("a").forEach(a=>a.onclick=ev=>{ev.preventDefault();document.querySelector(a.getAttribute("href")).focus()});return}
 sum.hidden=true;sv.textContent="Saving…";sv.disabled=true;setTimeout(()=>{sv.textContent="Saved ✓";setTimeout(()=>{sv.textContent="Save address";sv.disabled=false},1400)},800)};
</script>

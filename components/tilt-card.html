<style>
.tc-stage{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1a1622,#08080a 65%);perspective:1100px}
.tc{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--o:0;position:relative;width:330px;aspect-ratio:5/7;border-radius:22px;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.9,.3,1);cursor:pointer}
.tc.live{transition:transform .08s linear}
.tc-face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:linear-gradient(160deg,#25202f,#121016);border:1px solid #ffffff1c;box-shadow:0 40px 80px -30px #000c}
.tc-art{position:absolute;inset:14px 14px 38%;border-radius:14px;background:radial-gradient(circle at 30% 30%,#ff8a4c,transparent 55%),radial-gradient(circle at 75% 70%,#7a5cff,transparent 55%),#1b1724;overflow:hidden}
.tc-art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 4px)}
.tc-art b{position:absolute;left:16px;bottom:14px;font:600 44px/1 Geist,sans-serif;letter-spacing:-.06em;color:#fff;transform:translateZ(40px)}
.tc-info{position:absolute;left:22px;right:22px;bottom:22px}
.tc-info small{font:500 11px "Geist Mono",monospace;color:#9890a8;letter-spacing:.1em;text-transform:uppercase}
.tc-info h3{margin:6px 0 4px;font-size:22px;letter-spacing:-.03em;font-weight:600}
.tc-info p{margin:0;font-size:13px;color:#8d8799}
.tc-row{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid #ffffff12;font:12px "Geist Mono",monospace;color:#b6afc4}
.tc-foil{position:absolute;inset:0;border-radius:inherit;mix-blend-mode:soft-light;opacity:calc(var(--o)*.5);background:repeating-linear-gradient(115deg,#ff8a8a 0%,#ffe08a 6%,#8affc4 12%,#8ac8ff 18%,#d08aff 24%,#ff8a8a 30%) var(--mx) var(--my)/400% 400%;-webkit-mask:linear-gradient(115deg,transparent 20%,#000 45%,#000 55%,transparent 80%) var(--mx) var(--my)/250% 250%;mask:linear-gradient(115deg,transparent 20%,#000 45%,#000 55%,transparent 80%) var(--mx) var(--my)/250% 250%;transition:opacity .4s;pointer-events:none}
.tc-glare{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx) var(--my),#ffffff55,transparent 45%);mix-blend-mode:overlay;opacity:var(--o);transition:opacity .4s;pointer-events:none}
.tc-hint{position:absolute;bottom:36px;font:12px "Geist Mono",monospace;color:#5c5866}
</style>
<div class="tc-stage">
  <div class="tc">
    <div class="tc-face">
      <div class="tc-art"><b>No. 07</b></div>
      <div class="tc-info"><small>Founding member</small><h3>Mira Okafor</h3><p>Joined the beta on day one</p><div class="tc-row"><span>#00407</span><span>2026</span></div></div>
    </div>
    <div class="tc-foil"></div><div class="tc-glare"></div>
  </div>
  <div class="tc-hint">move over the card</div>
</div>
<script>
(()=>{
const c=document.querySelector(".tc");
c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  c.classList.add("live");
  c.style.setProperty("--ry",(px-.5)*24+"deg");c.style.setProperty("--rx",(.5-py)*24+"deg");
  c.style.setProperty("--mx",px*100+"%");c.style.setProperty("--my",py*100+"%");c.style.setProperty("--o",1)});
c.addEventListener("pointerleave",()=>{c.classList.remove("live");c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg");c.style.setProperty("--o",0)});
})();
</script>

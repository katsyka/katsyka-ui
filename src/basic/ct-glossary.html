<!--Glossary A–Z|Content|A glossary with a sticky A–Z jump bar (letters without terms disabled), instant filter that highlights matches, term anchors you can link to, and “see also” cross-links that jump and flash the target.|glossary,a-z,index,filter,definitions,docs-->
<div class="k"><div class="gl"><h1>Glossary</h1><label class="gl-s">@I(search,16)<input id="q" type="search" placeholder="Filter terms" aria-label="Filter terms"></label><nav class="gl-az" id="az" aria-label="Jump to letter"></nav><div id="l"></div></div></div>
<style>
.gl{width:min(720px,100%)}.gl h1{margin:0 0 16px;font-size:28px;letter-spacing:-.02em}.gl-s{display:flex;gap:8px;align-items:center;height:44px;padding:0 12px;border:1px solid var(--ctl);border-radius:10px;color:var(--mu);background:var(--bg)}.gl-s:focus-within{border-color:var(--ac)}.gl-s input{border:0;outline:0;background:none;flex:1;font-size:16px;color:var(--fg);min-width:0}
.gl-az{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:2px;padding:10px 0;background:var(--sf);border-bottom:1px solid var(--line);margin-bottom:8px}.gl-az a,.gl-az span{width:28px;height:32px;display:grid;place-items:center;border-radius:6px;font:600 13px 'Geist Mono',monospace;text-decoration:none;color:var(--fg)}.gl-az a:hover{background:var(--sf2)}.gl-az span{color:var(--ctl)}
.gl h2{font:600 14px 'Geist Mono',monospace;color:var(--mu);margin:20px 0 6px;scroll-margin-top:60px}.gl dl{margin:0}.gl dt{font-weight:650;font-size:16px;padding-top:10px;scroll-margin-top:70px;border-radius:6px;transition:background .6s}.gl dt.fl{background:var(--warn-sf)}.gl dd{margin:2px 0 10px;color:var(--mu);font-size:15px;line-height:1.6;padding-bottom:10px;border-bottom:1px solid var(--line)}.gl dd a{color:var(--ac)}.gl mark{background:var(--warn-sf);color:inherit;border-radius:2px}.gl .em{color:var(--mu);padding:24px 0}
</style>
<script>
const G=[["API key","A secret string that identifies your project when calling the API.",["Token"]],["Build cache","Files kept between builds so unchanged dependencies aren't reinstalled.",["Deploy"]],["CDN","A network of servers that serve your files from the location nearest each visitor.",["Edge function"]],["Deploy","A built, immutable version of your project with its own URL.",["Preview","Rollback"]],["Edge function","Code that runs on the CDN, close to the visitor, before the request reaches your server.",["CDN"]],["Environment","A set of variables and settings: development, preview or production.",[]],["Preview","A deploy created for a branch or pull request, separate from production.",["Deploy"]],["Region","The data centre where your serverless functions run.",[]],["Rollback","Pointing production back at an earlier deploy. Takes about two seconds.",["Deploy"]],["Token","A credential for the CLI or API. Scoped to a team and revocable.",["API key"]],["Webhook","An HTTP request we send to your server when something happens, like a finished deploy.",[]]];
const id=t=>'g-'+t.toLowerCase().replace(/\W+/g,'-'),q=document.getElementById('q'),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function draw(){const v=q.value.trim().toLowerCase(),re=v?new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'):null,m=s=>re?esc(s).replace(re,'<mark>$1</mark>'):esc(s),L=G.filter(([t,d])=>!v||(t+' '+d).toLowerCase().includes(v)),by={};L.forEach(g=>(by[g[0][0].toUpperCase()]||=[]).push(g));
document.getElementById('az').innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>by[c]?`<a href="#l-${c}">${c}</a>`:`<span aria-hidden="true">${c}</span>`).join('');
document.getElementById('l').innerHTML=Object.keys(by).length?Object.entries(by).map(([c,T])=>`<h2 id="l-${c}">${c}</h2><dl>${T.map(([t,d,s])=>`<dt id="${id(t)}">${m(t)}</dt><dd>${m(d)}${s.length?` See also: ${s.map(x=>`<a href="#${id(x)}">${x}</a>`).join(', ')}.`:''}</dd>`).join('')}</dl>`).join(''):`<p class="em">No terms match “${esc(q.value)}”.</p>`}
document.querySelector('.gl').addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();const t=document.querySelector(a.getAttribute('href'));if(!t)return;t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});if(t.tagName==='DT'){t.classList.add('fl');setTimeout(()=>t.classList.remove('fl'),1200)}});q.oninput=draw;draw();
</script>

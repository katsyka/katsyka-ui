<!--Toggle Groups|Buttons|Three everyday toggle groups in an editor toolbar: multi-select Bold / Italic / Underline, single-select text alignment as a radio group with arrow keys, and a view switch. Each shows pressed state with fill, not just colour.|toggle,toolbar,segmented,radio,editor-->
<div class="k"><div class="card tg">
  <div class="tg-bar" role="toolbar" aria-label="Formatting">
    <div class="tg-g" aria-label="Text style"><button aria-pressed="true" aria-label="Bold" data-s="fb"><b>B</b></button><button aria-pressed="false" aria-label="Italic" data-s="fi"><i style="font-family:Georgia,serif">I</i></button><button aria-pressed="false" aria-label="Underline" data-s="fu"><u>U</u></button></div>
    <span class="tg-sep"></span>
    <div class="tg-g" role="radiogroup" aria-label="Alignment" id="al"><button role="radio" aria-checked="true" aria-label="Align left" data-a="left">@I(list,18)</button><button role="radio" aria-checked="false" aria-label="Align centre" data-a="center" tabindex="-1"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M7 12h10M5 18h14"/></svg></button><button role="radio" aria-checked="false" aria-label="Align right" data-a="right" tabindex="-1"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M9 12h12M6 18h15"/></svg></button></div>
    <span class="tg-sep"></span>
    <div class="tg-v" role="radiogroup" aria-label="View" id="vw"><button role="radio" aria-checked="true">Edit</button><button role="radio" aria-checked="false" tabindex="-1">Preview</button></div>
  </div>
  <p class="tg-tx" id="tx" contenteditable="true" spellcheck="false">The crossing takes 22 minutes. The schedule gives it 25. Those three minutes are the whole secret: never spent, always saved.</p></div></div>
<style>
.tg{width:min(560px,100%);overflow:hidden}
.tg-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line);background:var(--sf)}
.tg-g{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.tg-g button{width:34px;height:32px;border-radius:7px;display:grid;place-items:center;font-size:15px;color:var(--mu);transition:background .15s,color .15s}
.tg-g button:hover{color:var(--fg);background:var(--sf)}
.tg-g [aria-pressed=true],.tg-g [aria-checked=true]{background:var(--fg)!important;color:var(--bg)!important}
.tg-sep{width:1px;height:24px;background:var(--line)}
.tg-v{position:relative;display:flex;margin-left:auto;padding:2px;border-radius:10px;background:var(--sf2)}
.tg-v button{position:relative;z-index:1;height:32px;padding:0 12px;border-radius:8px;font-weight:550;color:var(--mu);transition:color .2s}.tg-v [aria-checked=true]{color:var(--fg);background:var(--bg);box-shadow:0 1px 2px #0002}
.tg-tx{margin:0;padding:20px;min-height:120px;font-size:16px;line-height:26px;outline:0}
.tg-tx.fb{font-weight:700}.tg-tx.fi{font-style:italic}.tg-tx.fu{text-decoration:underline;text-underline-offset:3px}
.tg-tx[contenteditable=false]{background:var(--sf);color:var(--mu)}
</style>
<script>
document.querySelectorAll("[data-s]").forEach(b=>{b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);tx.classList.toggle(b.dataset.s,on)}});tx.classList.add("fb");
const radio=(g,fn)=>{const B=[...g.querySelectorAll("[role=radio]")];const sel=b=>{B.forEach(x=>{x.setAttribute("aria-checked",x===b);x.tabIndex=x===b?0:-1});fn(b)};B.forEach((b,i)=>{b.onclick=()=>sel(b);b.onkeydown=e=>{const d=e.key==="ArrowRight"||e.key==="ArrowDown"?1:e.key==="ArrowLeft"||e.key==="ArrowUp"?-1:0;if(d){e.preventDefault();const n=B[(i+d+B.length)%B.length];n.focus();sel(n)}}})};
radio(al,b=>tx.style.textAlign=b.dataset.a);radio(vw,b=>tx.contentEditable=b.textContent==="Edit");
</script>

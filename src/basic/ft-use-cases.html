<!--Use Cases by Role|Features|Tabs by role (Studios, Shops, Agencies) that swap a photo and three role-specific outcomes, with the tab set in the URL hash, arrow-key navigation and a cross-fade that respects reduced motion.|features,use cases,tabs,roles,personas-->
<div class="k pg uc"><section class="w uc-w"><h2 class="h2">One tool, three kinds of teams</h2><div class="uc-tb" role="tablist" id="tb"></div><div class="uc-p" id="p" role="tabpanel"></div></section></div>
<style>
.uc-w{padding:80px 0;display:grid;gap:24px}.uc-tb{display:flex;gap:6px;border-bottom:1px solid var(--line)}.uc-tb button{height:44px;padding:0 4px;margin-right:20px;font-size:16px;font-weight:550;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px}.uc-tb [aria-selected=true]{color:var(--fg);border-color:var(--fg)}
.uc-p{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;animation:ucf .35s cubic-bezier(.23,1,.32,1)}@keyframes ucf{from{opacity:0;transform:translateY(6px)}}.uc-p img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}.uc-p h3{margin:0 0 16px;font-size:24px;letter-spacing:-.02em}.uc-p ul{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:14px}.uc-p li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:16px;line-height:1.5}.uc-p li .i{color:var(--ok);margin-top:3px}.uc-p a{color:var(--fg);font-weight:600;display:inline-flex;gap:6px;align-items:center}
@media (max-width:760px){.uc-p{grid-template-columns:1fr;gap:20px}}@media (prefers-reduced-motion:reduce){.uc-p{animation:none}}
</style>
<script>
const U=[["studios","Studios","c/1082","For small creative studios",["Client portals with your logo, not ours","Time tracked straight from the task","Invoices that match the hours exactly"]],["shops","Shops","c/1080","For independent shops",["Stock counts that update with every sale","Supplier orders drafted when you run low","One view of online and in-store sales"]],["agencies","Agencies","c/1031","For agencies with many clients",["Separate workspaces per client, one login","Utilisation per person, per week","Retainer burn-down your clients can see"]]],tb=document.getElementById('tb'),p=document.getElementById('p');
tb.innerHTML=U.map(([k,n],i)=>`<button role="tab" id="t-${k}" aria-controls="p" data-i="${i}">${n}</button>`).join('');const T=[...tb.children];
function sel(i,f){T.forEach((t,j)=>{t.setAttribute('aria-selected',i===j);t.tabIndex=i===j?0:-1});const [k,,img,h,L]=U[i];p.setAttribute('aria-labelledby','t-'+k);p.style.animation='none';p.offsetWidth;p.style.animation='';p.innerHTML=`<img src="media/pics/${img}.jpg" alt=""><div><h3>${h}</h3><ul>${L.map(x=>`<li>@I(check,18)<span>${x}</span></li>`).join('')}</ul><a href="#">See how ${U[i][1].toLowerCase()} use it @I(arrowr,16)</a></div>`;try{history.replaceState(null,'','#'+k)}catch(e){}if(f)T[i].focus()}
tb.onclick=e=>{const b=e.target.closest('button');if(b)sel(+b.dataset.i)};tb.onkeydown=e=>{const i=T.findIndex(t=>t.tabIndex===0);if(e.key==='ArrowRight')sel((i+1)%3,1);if(e.key==='ArrowLeft')sel((i+2)%3,1)};
sel(Math.max(0,U.findIndex(u=>u[0]===location.hash.slice(1))));
</script>

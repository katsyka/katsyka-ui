<!--Keyboard Shortcuts Showcase|Features|A “made for the keyboard” section: press real keys (or click them) and a small demo task list reacts (new task, complete, move, search) while the pressed keys light up on a minimal keyboard row.|features,keyboard,shortcuts,interactive,productivity-->
<div class="k"><section class="ks"><div class="ks-t"><h2>Your hands never leave the keys</h2><p class="lead mu">Try it: click the demo, then press the keys.</p><ul class="ks-k" id="kk"><li><span><kbd>C</kbd></span>New task</li><li><span><kbd>X</kbd></span>Complete</li><li><span><kbd>J</kbd><kbd>K</kbd></span>Move down / up</li><li><span><kbd>/</kbd></span>Search</li></ul></div>
<div class="ks-d" id="d" tabindex="0" aria-label="Demo task list. Press C, X, J, K or slash."><div class="ks-s" id="s" hidden><span>@I(search,14)</span><input id="q" placeholder="Search tasks" aria-label="Search tasks"></div><ul id="l"></ul><p class="ks-hint" id="h">Click here, then press a key</p></div></section></div>
<style>
.ks{width:min(980px,100%);display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}.ks h2{margin:0 0 10px;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.1}.ks .lead{margin:0 0 20px;font-size:17px}
.ks-k{list-style:none;padding:0;margin:0;display:grid;gap:10px}.ks-k li{display:grid;grid-template-columns:90px 1fr;align-items:center;font-size:15px}.ks-k span{display:flex;gap:4px}
.ks kbd{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:7px;border:1px solid var(--ctl);border-bottom-width:3px;font:600 13px 'Geist Mono',monospace;background:var(--bg);transition:transform .08s,border-bottom-width .08s,background .15s}.ks kbd.dn{transform:translateY(2px);border-bottom-width:1px;background:var(--ac-sf);border-color:var(--ac)}
.ks-d{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:12px;min-height:280px;display:grid;align-content:start;gap:4px;outline:0;position:relative}.ks-d:focus-visible,.ks-d:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.ks-s{display:flex;gap:8px;align-items:center;padding:4px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;color:var(--mu)}.ks-s input{border:0;outline:0;background:none;flex:1;font-size:15px;color:var(--fg)}
.ks-d ul{list-style:none;padding:0;margin:0;display:grid;gap:2px}.ks-d li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-size:15px;animation:ksf .2s cubic-bezier(.23,1,.32,1)}@keyframes ksf{from{opacity:0;transform:translateY(-3px)}}.ks-d li::before{content:"";width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ctl);flex:none}.ks-d li.cur{background:var(--sf2)}.ks-d li.dn{color:var(--mu);text-decoration:line-through}.ks-d li.dn::before{background:var(--ok);border-color:var(--ok)}
.ks-hint{position:absolute;bottom:10px;right:12px;margin:0;font-size:12px;color:var(--mu)}
@media (max-width:760px){.ks{grid-template-columns:1fr;gap:24px}}
</style>
<script>
let T=[["Reply to Lena about the brief",0],["Book flights for Lisbon",0],["Review pull request #142",1],["Order more coffee beans",0]],cur=0,n=1;const d=document.getElementById('d'),l=document.getElementById('l'),q=document.getElementById('q');
const flash=k=>{document.querySelectorAll('#kk kbd').forEach(x=>{if(x.textContent.toLowerCase()===k){x.classList.add('dn');setTimeout(()=>x.classList.remove('dn'),180)}})};
function draw(){const v=q.value.toLowerCase(),V=T.map((t,i)=>[t,i]).filter(([t])=>!v||t[0].toLowerCase().includes(v));cur=Math.min(cur,Math.max(0,V.length-1));l.innerHTML=V.map(([[t,dn]],k)=>`<li class="${k===cur?'cur':''}${dn?' dn':''}">${t}</li>`).join('')}
d.addEventListener('keydown',e=>{if(e.target===q){if(e.key==='Escape'){q.value='';document.getElementById('s').hidden=true;d.focus();draw()}else setTimeout(draw);return}const k=e.key.toLowerCase();if(!['c','x','j','k','/'].includes(k))return;e.preventDefault();flash(k);const h=document.getElementById('h');
if(k==='c'){T.unshift([`New task ${n++}`,0]);cur=0;h.textContent='C: created a task'}if(k==='x'){const v=q.value.toLowerCase(),V=T.filter(t=>!v||t[0].toLowerCase().includes(v));if(V[cur]){V[cur][1]=V[cur][1]?0:1}h.textContent='X: toggled complete'}if(k==='j'){cur=Math.min(T.length-1,cur+1);h.textContent='J: moved down'}if(k==='k'){cur=Math.max(0,cur-1);h.textContent='K: moved up'}if(k==='/'){document.getElementById('s').hidden=false;q.focus();h.textContent='Esc to close search'}draw()});
document.querySelectorAll('#kk kbd').forEach(x=>{x.style.cursor='pointer';x.onclick=()=>{d.focus();d.dispatchEvent(new KeyboardEvent('keydown',{key:x.textContent.toLowerCase(),bubbles:true}))}});draw();
</script>

<!--Request Access State|States|A 403 page that unblocks you: shows who owns the file, lets you pick the access level and add a note, then switches to a pending state with the request time and an option to switch accounts.|403,permission,access request,empty state-->
<div class="k na"><main class="na-w"><div class="na-ic">@I(lock,22)</div><h1>You need access to “Q4 roadmap”</h1><p class="mu">You're signed in as <b>sam@contractor.example</b>. <button class="na-sw">Switch account</button></p>
<form id="f" class="na-f"><div class="na-ow"><span class="av" style="--c:#0f766e">MV</span><div><b>Mira Vos</b><span class="mu">Owner · usually replies within a day</span></div></div><fieldset><legend class="lbl">Access level</legend><div class="na-lv" role="radiogroup"><button type="button" role="radio" aria-checked="true">Can view</button><button type="button" role="radio" aria-checked="false">Can comment</button><button type="button" role="radio" aria-checked="false">Can edit</button></div></fieldset><label class="lbl" for="nt">Message (optional)</label><textarea class="in" id="nt" rows="2" placeholder="I'm working on the pricing section with Lea."></textarea><button class="b ac" id="sb">Request access</button></form>
<div class="na-pd" id="pd" hidden>@I(clock,18)<div><b>Request sent to Mira</b><span class="mu" id="pt"></span></div><button class="b gh sm" id="cx">Cancel request</button></div></main></div>
<style>
.na-w{width:min(460px,100%);display:grid;gap:14px}.na-ic{width:44px;height:44px;border-radius:12px;background:var(--sf2);display:grid;place-items:center;color:var(--mu)}.na-w h1{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}.na-w>p{margin:-6px 0 0;font-size:14px}.na-sw{text-decoration:underline;color:var(--fg);font-size:14px;min-height:28px}
.na-f{display:grid;gap:12px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.na-ow{display:flex;gap:10px;align-items:center}.na-ow div{display:grid;font-size:14px}.na-ow span.mu{font-size:12px}.na-f fieldset{border:0;margin:0;padding:0}
.na-lv{display:flex;background:var(--sf2);border-radius:10px;padding:3px}.na-lv button{flex:1;height:34px;border-radius:8px;font-size:13px;font-weight:550;color:var(--mu)}.na-lv [aria-checked=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px #0000001a}
.na-f textarea{height:auto;padding:10px 12px;resize:vertical;font-size:15px}.na-f .b{height:44px}
.na-pd{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--info-sf);animation:nap .25s cubic-bezier(.23,1,.32,1)}.na-pd>.i{color:var(--info)}.na-pd div{display:grid;flex:1;font-size:14px}.na-pd span{font-size:12px}@keyframes nap{from{opacity:0;transform:translateY(4px)}}
</style>
<script>
const $=i=>document.getElementById(i);document.querySelector('.na-lv').onclick=e=>{const b=e.target.closest('button');if(b)b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b))};
$('f').onsubmit=e=>{e.preventDefault();const b=$('sb');b.disabled=true;b.textContent='Sending…';setTimeout(()=>{$('f').hidden=true;$('pd').hidden=false;const lv=document.querySelector('.na-lv [aria-checked=true]').textContent.toLowerCase();$('pt').textContent=`Asked for “${lv}” at ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}. We'll email you when she answers.`;b.disabled=false;b.textContent='Request access'},700)};
$('cx').onclick=()=>{$('pd').hidden=true;$('f').hidden=false};
</script>

<!--Status Incident Page|States|A public status page for an outage: component list with current state, an incident timeline with updates (investigating → identified → monitoring → resolved) that you can step through, and 90-day uptime bars with hover detail.|status,incident,uptime,outage,timeline-->
<div class="k sx"><main class="sx-w"><div class="sx-bn" id="bn"></div><ul class="sx-c" id="c"></ul><section class="sx-in"><h2>Incident: delayed webhook deliveries</h2><ol class="sx-tl" id="tl"></ol><button class="b sec sm" id="nx">Next update</button></section>
<section class="sx-up"><div class="sx-uh"><b>API uptime</b><span class="mu tn">99.94% · 90 days</span></div><div class="sx-bars" id="bars"></div><p class="mu tn sx-tip" id="tip">Hover a day</p></section></main></div>
<style>
.sx-w{width:min(640px,100%);display:grid;gap:16px}.sx-bn{padding:14px 16px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:center}.sx-bn.warn{background:var(--warn-sf)}.sx-bn.ok{background:var(--ok-sf);color:var(--ok)}
.sx-c{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.sx-c li{display:flex;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);font-size:14px}.sx-c li:first-child{border:0}
.sx-in{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:16px;display:grid;gap:12px;justify-items:start}.sx-in h2{margin:0;font-size:16px}.sx-tl{list-style:none;padding:0;margin:0;display:grid;gap:12px;width:100%}.sx-tl li{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:14px;animation:sxf .3s cubic-bezier(.23,1,.32,1)}.sx-tl b{display:block}.sx-tl time{font:12px 'Geist Mono',monospace;color:var(--mu);padding-top:2px}@keyframes sxf{from{opacity:0;transform:translateY(-4px)}}
.sx-up{display:grid;gap:8px}.sx-uh{display:flex;justify-content:space-between;font-size:14px}.sx-bars{display:flex;gap:2px;height:32px}.sx-bars i{flex:1;border-radius:2px;background:var(--ok);opacity:.85}.sx-bars i:hover{opacity:1;transform:scaleY(1.1)}.sx-bars .w{background:var(--warn)}.sx-bars .e{background:var(--err)}.sx-tip{font-size:12px;margin:0;min-height:18px}
@media (max-width:520px){.sx-tl li{grid-template-columns:1fr;gap:2px}}
</style>
<script>
const U=[["14:02","Investigating","Webhook deliveries are delayed by up to 20 minutes. API requests are not affected."],["14:19","Identified","A queue worker pool ran out of memory after a config change. Rolling it back."],["14:41","Monitoring","Rollback complete. Delayed webhooks are being delivered now, oldest first."],["15:05","Resolved","All delayed webhooks delivered. Total delay peaked at 23 minutes."]];let k=1;
const C=()=>[["API","Operational"],["Webhooks",k<4?"Degraded":"Operational"],["Dashboard","Operational"],["Payments","Operational"]];
function draw(){document.getElementById('c').innerHTML=C().map(([n,s])=>`<li><span>${n}</span><span class="pill ${s==='Operational'?'ok':'warn'}">${s}</span></li>`).join('');document.getElementById('tl').innerHTML=U.slice(0,k).reverse().map(([t,s,d])=>`<li><time>${t} UTC</time><div><b>${s}</b>${d}</div></li>`).join('');const bn=document.getElementById('bn');bn.className='sx-bn '+(k<4?'warn':'ok');bn.textContent=k<4?'Webhooks are degraded. Everything else is working.':'All systems operational';document.getElementById('nx').hidden=k>=4}
document.getElementById('nx').onclick=()=>{k++;draw()};draw();
const bars=document.getElementById('bars'),D=Array.from({length:90},(_,i)=>i===89?'w':i===61?'e':i===34||i===12?'w':'');bars.innerHTML=D.map((c,i)=>`<i class="${c}" data-i="${i}"></i>`).join('');
bars.onpointerover=e=>{const b=e.target.closest('i');if(!b)return;const i=+b.dataset.i,d=new Date(Date.now()-(89-i)*864e5),c=D[i];document.getElementById('tip').textContent=`${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}: ${c==='e'?'Major outage, 41 min':c==='w'?'Degraded, 23 min':'No incidents'}`};
</script>

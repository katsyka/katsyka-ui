<!--Stat Grid|Data|Four metric tiles with a period switch: tabular values, delta badges that use an arrow and sign as well as colour, and a small sparkline per tile.|stats,kpi,metrics,dashboard,sparkline-->
<div class="k"><section class="sg">
  <header class="sg-h"><h2>Overview</h2><div class="sg-seg" role="radiogroup" aria-label="Period"><button role="radio" aria-checked="false" data-p="0">7d</button><button role="radio" aria-checked="true" data-p="1">30d</button><button role="radio" aria-checked="false" data-p="2">90d</button></div></header>
  <div class="sg-g" id="g"></div></section></div>
<style>
.sg{width:min(880px,100%)}
.sg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sg-h h2{margin:0;font-size:18px;font-weight:650}
.sg-seg{display:flex;padding:3px;border-radius:10px;background:var(--sf2)}.sg-seg button{height:28px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:550;color:var(--mu)}
.sg-seg [aria-checked=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px #0002}
.sg-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.sg-t{padding:16px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.sg-t h3{margin:0;font-size:13px;font-weight:500;color:var(--mu)}
.sg-t b{display:block;margin:6px 0 8px;font-size:26px;line-height:30px;font-weight:650;letter-spacing:-.02em}
.sg-f{display:flex;align-items:center;justify-content:space-between}
.sg-t svg.sp{width:80px;height:28px}
</style>
<script>
const D=[["Revenue",["$12.4k","$48.2k","$139k"],[8.1,12.4,9.8]],["Active users",["3 102","9 840","21 400"],[2.3,5.1,-1.2]],["Conversion",["3.1%","2.9%","3.0%"],[0.4,-0.3,0.1]],["Avg. order",["$41.20","$39.80","$40.10"],[-1.8,0.6,1.1]]];
const sp=(seed,up)=>{let x=seed,p=[];for(let i=0;i<12;i++){x=(x*9301+49297)%233280;p.push(14+(x/233280-.5)*14-(up?i:-i)*.8)}return p.map((y,i)=>`${i*7.2},${y.toFixed(1)}`).join(" ")};
const draw=p=>g.innerHTML=D.map(([n,v,d],i)=>{const up=d[p]>=0;return`<article class="sg-t"><h3>${n}</h3><b class="tn">${v[p]}</b><div class="sg-f"><span class="pill ${up?"ok":"err"} tn" aria-label="${up?"Up":"Down"} ${Math.abs(d[p])}%">${up?"↑":"↓"} ${up?"+":"−"}${Math.abs(d[p])}%</span><svg class="sp" viewBox="0 0 80 28" aria-hidden="true"><polyline points="${sp(i*7+p+3,up)}" fill="none" stroke="${up?"var(--ok)":"var(--err)"}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg></div></article>`}).join("");
draw(1);document.querySelectorAll(".sg-seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".sg-seg button").forEach(x=>x.setAttribute("aria-checked",x===b));draw(+b.dataset.p)});
</script>

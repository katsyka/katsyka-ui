<!--Custom Domains Settings|Settings|Add a custom domain and verify DNS: shows the exact records to add with copy buttons, a check-again button that walks through pending → verifying → live, and SSL status per domain.|settings,domains,dns,verification,ssl-->
<div class="k dm"><div class="dm-w"><h1>Domains</h1><form class="dm-add" id="f" novalidate><label class="vh" for="d">Domain</label><input class="in" id="d" placeholder="docs.yourcompany.com" autocomplete="off" spellcheck="false" aria-describedby="er"><button class="b ac">Add domain</button></form><p class="dm-er" id="er" role="alert"></p><div id="l" class="dm-l"></div></div></div>
<style>
.k.dm{align-items:start}.dm-w{width:min(720px,100%);display:grid;gap:14px}.dm-w h1{margin:0;font-size:24px;letter-spacing:-.02em}
.dm-add{display:flex;gap:8px}.dm-add .in{height:44px;font:15px 'Geist Mono',monospace}.dm-add .b{height:44px;flex:none}.dm-er{color:var(--err);font-size:13px;margin:-6px 0 0}.dm-er:empty{display:none}
.dm-l{display:grid;gap:12px}.dm-d{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;animation:dmf .25s cubic-bezier(.23,1,.32,1)}@keyframes dmf{from{opacity:0;transform:translateY(-4px)}}
.dm-h{display:flex;gap:12px;align-items:center;padding:14px 16px}.dm-h code{font:600 15px 'Geist Mono',monospace;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.dm-h .b{height:32px}
.dm-rec{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--sf);display:grid;gap:10px}.dm-rec p{margin:0;font-size:13px}.dm-tw{overflow-x:auto;position:relative}.dm-rec table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}.dm-rec th{text-align:left;font-weight:550;color:var(--mu);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}.dm-rec td{padding:8px 10px;font-family:'Geist Mono',monospace;white-space:nowrap}.dm-rec td .ibt{width:28px;height:28px}
.dm-sp{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:dms .7s linear infinite;display:inline-block}@keyframes dms{to{transform:rotate(1turn)}}
</style>
<script>
let D=[{d:'help.northwind.example',s:'live'}];const l=document.getElementById('l'),SP={live:['ok','● Live · SSL active'],pending:['warn','Waiting for DNS'],checking:['info','<span class="dm-sp"></span> Checking DNS…'],ssl:['info','<span class="dm-sp"></span> Issuing certificate…']};
const cp=t=>(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{});
function draw(){l.innerHTML=D.map((x,i)=>{const sub=x.d.split('.').length>2,name=sub?x.d.split('.')[0]:'@';return `<div class="dm-d"><div class="dm-h"><code>${x.d}</code><span class="pill ${SP[x.s][0]}">${SP[x.s][1]}</span>${x.s==='pending'?`<button class="b sec sm" data-c="${i}">Check again</button>`:''}<button class="ibt" data-r="${i}" aria-label="Remove ${x.d}">@I(trash,16)</button></div>${x.s!=='live'?`<div class="dm-rec"><p>Add this record at your DNS provider. Changes can take up to an hour.${x.tries?` <b>Not found yet (${x.tries} ${x.tries>1?'checks':'check'}).</b>`:''}</p><div class="dm-tw"><table><thead><tr><th>Type</th><th>Name</th><th>Value</th><th></th></tr></thead><tbody><tr><td>${sub?'CNAME':'A'}</td><td>${name}</td><td>${sub?'cname.quill-hosting.net':'76.76.21.21'}</td><td><button class="ibt" data-cp="${sub?'cname.quill-hosting.net':'76.76.21.21'}" aria-label="Copy value">@I(copy,14)</button></td></tr><tr><td>TXT</td><td>_quill</td><td>verify=${btoa(x.d).slice(0,14).toLowerCase()}</td><td><button class="ibt" data-cp="verify=${btoa(x.d).slice(0,14).toLowerCase()}" aria-label="Copy value">@I(copy,14)</button></td></tr></tbody></table></div></div>`:''}</div>`}).join('')}
l.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cp){cp(b.dataset.cp);b.innerHTML='@I(check,14)';setTimeout(()=>b.innerHTML='@I(copy,14)',1200);return}if(b.dataset.r){D.splice(+b.dataset.r,1);draw();return}if(b.dataset.c){const x=D[+b.dataset.c];x.s='checking';draw();setTimeout(()=>{x.tries=(x.tries||0)+1;if(x.tries<2){x.s='pending';draw();return}x.s='ssl';draw();setTimeout(()=>{x.s='live';draw()},1400)},1200)}};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('d'),v=i.value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,''),er=document.getElementById('er');const ok=/^([a-z0-9-]+\.)+[a-z]{2,}$/.test(v);i.setAttribute('aria-invalid',!ok);er.textContent=!ok?'Enter a domain like docs.yourcompany.com, without https://':D.some(x=>x.d===v)?'That domain is already added.':'';if(er.textContent)return i.focus();D.unshift({d:v,s:'pending'});i.value='';draw()};draw();
</script>

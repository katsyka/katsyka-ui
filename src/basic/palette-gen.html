<!--Palette Generator|Custom|A five-colour palette generator: press Space or the button to roll new harmonious colours, lock the ones you like, click a swatch to copy its hex, and each swatch picks black or white text by contrast.|colour,palette,generator,tool,colourful-->
<div class="k pgn"><div class="pgn-w" id="w" role="list"></div><div class="pgn-bar"><span class="mu">Press <kbd>Space</kbd> to roll</span><button class="b ac" id="go">@I(shuffle,16)Roll palette</button></div><div class="pgn-t" id="t" role="status"></div></div>
<style>
.k.pgn{padding:0;place-items:stretch;display:grid;grid-template-rows:1fr auto;min-height:100dvh;background:var(--bg)}
.pgn-w{display:grid;grid-template-columns:repeat(5,1fr)}.pgn-s{display:grid;align-content:end;justify-items:center;gap:10px;padding:24px 8px;border:0;cursor:pointer;font:inherit;transition:background .35s var(--ease);position:relative}
.pgn-s b{font:600 clamp(14px,1.8vw,20px) 'Geist Mono',monospace;letter-spacing:.02em}.pgn-s small{font-size:12px;opacity:.75}
.pgn-l{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.18);border:0;color:inherit;cursor:pointer}.pgn-l[aria-pressed=true]{background:rgb(0 0 0/.18)}
.pgn-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}.pgn-bar .b{display:flex;gap:8px;align-items:center}
kbd{font:12px 'Geist Mono',monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
.pgn-t{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.pgn-t.on{opacity:1}
@media (max-width:600px){.pgn-w{grid-template-columns:1fr}.pgn-s{grid-template-columns:1fr auto;align-items:center;justify-items:start;text-align:left;padding:16px}.pgn-s small{grid-row:2}.pgn-l{grid-row:1/3;grid-column:2}}
</style>
<script>
const w=document.getElementById('w'),t=document.getElementById('t');let P=[],L=[0,0,0,0,0],tt;
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0),f(8),f(4)].map(x=>Math.round(x*255))}
const hex=c=>'#'+c.map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase(),lum=c=>{const v=c.map(x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4});return .2126*v[0]+.7152*v[1]+.0722*v[2]};
const NAMES=['Base','Light','Accent','Pop','Deep'];
function roll(){const h=Math.random()*360,mode=Math.floor(Math.random()*3),off=[[0,30,60,180,210],[0,120,240,30,150],[0,25,-25,180,155]][mode];const L2=[[62,78],[88,90],[55,70],[60,85],[25,45]];
P=P.length?P:Array(5);for(let i=0;i<5;i++){if(L[i])continue;const s=55+Math.random()*35,l=L2[i][0]+Math.random()*(L2[i][1]-L2[i][0]);P[i]=hsl((h+off[i]+360)%360,s,l)}draw()}
function draw(){w.innerHTML='';P.forEach((c,i)=>{const d=document.createElement('div');d.className='pgn-s';d.role='listitem';d.style.background=hex(c);const dark=lum(c)>.4;d.style.color=dark?'#111':'#fff';d.innerHTML=`<button class="pgn-l" aria-pressed="${!!L[i]}" aria-label="${L[i]?'Unlock':'Lock'} ${NAMES[i]}">${L[i]?'@I(lock,18)':'@I(unlock,18)'}</button><b>${hex(c)}</b><small>${NAMES[i]}</small>`;d.querySelector('.pgn-l').onclick=e=>{e.stopPropagation();L[i]^=1;draw()};d.tabIndex=0;d.setAttribute('aria-label',`${NAMES[i]} ${hex(c)}, press Enter to copy`);d.onclick=()=>copy(hex(c));d.onkeydown=e=>{if(e.key==='Enter')copy(hex(c))};w.append(d)})}
function copy(h){const done=()=>{t.textContent='Copied '+h;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400)};(navigator.clipboard?navigator.clipboard.writeText(h):Promise.reject()).then(done).catch(()=>{const a=document.createElement('textarea');a.value=h;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()})}
document.getElementById('go').onclick=roll;addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('button,input,textarea')){e.preventDefault();roll()}});roll();
</script>

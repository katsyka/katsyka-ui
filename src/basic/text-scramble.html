<!--Text Scramble|Text|A headline that decodes from random glyphs into the real words, left to right, on load and again on hover or focus. Width is locked so nothing shifts, screen readers get the real text, and reduced motion skips straight to it.|text effect,scramble,decode,headline,hover-->
<div class="k"><section class="sc2"><p class="sc2-k">Release 4.0</p><h1 class="sc2-h" tabindex="0" data-t="Signal through the noise">Signal through the noise</h1><p class="sc2-p">Hover or focus the headline to run it again.</p>
<ul class="sc2-l"><li data-t="Encrypted end to end">Encrypted end to end</li><li data-t="Synced in 40 ms">Synced in 40 ms</li><li data-t="Works offline">Works offline</li></ul></section></div>
<style>
.sc2{width:min(760px,100%);text-align:center}
.sc2-k{margin:0;font:600 12px "Geist Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.sc2-h{margin:12px 0 0;font-size:clamp(34px,6vw,64px);line-height:1.05;font-weight:650;letter-spacing:-.035em;outline:0;cursor:default}
.sc2-h:focus-visible{outline:2px solid var(--focus);outline-offset:6px;border-radius:6px}
.sc2-h .g,.sc2-l .g{color:var(--mu);font-family:"Geist Mono",monospace;font-weight:500}
.sc2-p{color:var(--mu);margin:16px 0 0}
.sc2-l{list-style:none;padding:0;margin:32px 0 0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.sc2-l li{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font:500 14px "Geist Mono",monospace}
</style>
<script>
const G="ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+=<>/";
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const run=(el,delay=0)=>{const t=el.dataset.t;el.setAttribute("aria-label",t);if(RM){el.textContent=t;return}
 cancelAnimationFrame(el._r);const w=el.getBoundingClientRect().width;el.style.minWidth=w+"px";const start=performance.now()+delay,D=Math.max(600,t.length*45);
 const f=now=>{const p=Math.max(0,(now-start)/D);let h="";for(let i=0;i<t.length;i++){const c=t[i];if(c===" "||i<p*t.length)h+=c===" "?" ":c.replace(/[&<]/g,"");else h+='<span class="g" aria-hidden="true">'+G[Math.random()*G.length|0]+"</span>"}el.innerHTML=h;if(p<1)el._r=requestAnimationFrame(f);else{el.textContent=t;el.style.minWidth=""}};el._r=requestAnimationFrame(f)};
const h=document.querySelector(".sc2-h");run(h);["pointerenter","focus"].forEach(e=>h.addEventListener(e,()=>run(h)));
document.querySelectorAll(".sc2-l li").forEach((li,i)=>{run(li,300+i*150);li.addEventListener("pointerenter",()=>run(li))});
</script>

<!--Deployments Dashboard|Dashboards|A DevOps deploy feed: environment cards with health and version, a deployment list with live build progress that streams log lines, promote/rollback actions with confirmation, and status filters.|dashboard,devops,deploy,ci,logs,status-->
<div class="k db">
<aside class="db-side" aria-label="Main"><div class="db-brand"><i>›</i>shipit</div><a href="#">@I(home,18)Projects</a><a href="#" aria-current="page">@I(zap,18)Deployments</a><a href="#">@I(globe,18)Domains</a><a href="#">@I(chart,18)Usage</a><a href="#">@I(settings,18)Settings</a><div class="db-sec">Project</div><a href="#">@I(hash,18)harbor-web</a><div class="db-user"><span class="av" style="--c:#0f766e">RV</span><div><b>Rui Vaz</b><span>harbor team</span></div></div></aside>
<main class="db-main"><header class="db-top"><button class="db-mb ibt" aria-label="Open navigation" aria-expanded="false">@I(list,20)</button><h1>harbor-web</h1><span class="sp"></span><button class="b ac sm" id="nd">@I(zap,14)Deploy main</button></header>
<div class="db-body"><div class="dp-env"><div class="db-card"><span class="pill ok">● Healthy</span><b>Production</b><span class="mu tn" id="pv">v2.14.0 · 3h ago</span></div><div class="db-card"><span class="pill ok">● Healthy</span><b>Preview</b><span class="mu">12 branches</span></div><div class="db-card"><span class="pill warn">● Degraded</span><b>Staging</b><span class="mu">p95 1.8 s</span></div></div>
<section class="db-card"><div class="db-ch"><h2>Deployments</h2><div class="dp-f" role="group" aria-label="Filter"><button aria-pressed="true" data-f="">All</button><button aria-pressed="false" data-f="ok">Ready</button><button aria-pressed="false" data-f="err">Failed</button></div></div><ul class="dp-l" id="l"></ul></section></div></main>
</div>
<style>
.dp-env{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.dp-env .db-card{display:grid;gap:6px;justify-items:start}.dp-env b{font-size:16px}
.dp-f{display:flex;gap:4px}.dp-f button{height:30px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--mu)}.dp-f [aria-pressed=true]{background:var(--sf2);color:var(--fg)}
.dp-l{list-style:none;padding:0;margin:0}.dp-l>li{border-top:1px solid var(--line)}.dp-r{display:grid;grid-template-columns:20px 1fr auto auto;gap:12px;align-items:center;padding:12px 4px}.dp-r>div{display:grid;min-width:0}.dp-r code{font:12px 'Geist Mono',monospace;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dp-dot{width:10px;height:10px;border-radius:50%;background:var(--c);justify-self:center}.dp-dot.run{animation:dpp 1s infinite}@keyframes dpp{50%{opacity:.3}}
.dp-r .act{display:flex;gap:6px}.dp-r .b{height:30px}
.dp-log{margin:0 0 12px 36px;background:#0c0c0e;color:#d4d4d8;border-radius:10px;padding:10px 12px;font:12px/1.6 'Geist Mono',monospace;max-height:160px;overflow:auto}.dp-log .g{color:#4ade80}.dp-log .r{color:#f87171}.dp-pr{height:3px;background:var(--sf2);border-radius:2px;margin:0 0 10px 36px;overflow:hidden}.dp-pr i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s}
.dp-cf{display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 12px 36px;padding:10px 12px;border-radius:10px;background:var(--warn-sf);flex-wrap:wrap}
@media (max-width:900px){.dp-env{grid-template-columns:1fr}.dp-r{grid-template-columns:20px 1fr}.dp-r .tm,.dp-r .act{grid-column:2}}
</style>
<script>
let L=[{id:7,br:"main",msg:"Fix cart rounding on 3-for-2 offers",s:"run",t:"just now",env:"Production"},{id:6,br:"feat/search",msg:"Add instant search with debounce",s:"ok",t:"38 min ago",env:"Preview"},{id:5,br:"main",msg:"Bump Next to 15.2",s:"err",t:"2h ago",env:"Production"},{id:4,br:"main",msg:"Image CDN for product photos",s:"ok",t:"3h ago",env:"Production",cur:1}];
const C={run:'var(--warn)',ok:'var(--ok)',err:'var(--err)'},l=document.getElementById('l');let f='',open=7,conf=null;
const LOG=["$ pnpm install --frozen-lockfile","  ✓ 812 packages in 6.1s","$ next build","  ✓ Compiled 214 modules","  ✓ Generated 48 static pages","› Uploading 3.4 MB to fra1, iad1","  ✓ Edge config pushed","<g>✓ Ready in 41s</g>"];let li=0;
function draw(){l.innerHTML=L.filter(d=>!f||d.s===f).map(d=>`<li><div class="dp-r"><span class="dp-dot ${d.s==='run'?'run':''}" style="--c:${C[d.s]}" aria-label="${d.s==='run'?'Building':d.s==='ok'?'Ready':'Failed'}"></span><div><b>${d.msg}</b><code>${d.br} · ${d.env}${d.cur?' · current':''}</code></div><span class="mu tm">${d.t}</span><div class="act"><button class="b gh sm" data-log="${d.id}" aria-expanded="${open===d.id}">Logs</button>${d.s==='ok'&&!d.cur?`<button class="b sec sm" data-pr="${d.id}">${d.env==='Production'?'Rollback':'Promote'}</button>`:''}</div></div>${d.s==='run'?`<div class="dp-pr"><i style="width:${li/LOG.length*100}%"></i></div>`:''}${conf===d.id?`<div class="dp-cf">${d.env==='Production'?'Roll production back to':'Promote to production:'} <b>${d.msg}</b>? <button class="b sm" style="background:var(--fg);color:var(--bg)" data-yes="${d.id}">Confirm</button><button class="b gh sm" data-no>Cancel</button></div>`:''}${open===d.id?`<pre class="dp-log">${(d.s==='run'?LOG.slice(0,li):d.s==='err'?LOG.slice(0,3).concat(['<r>✗ Type error: Property "slug" does not exist on type "Post"</r>','<r>Build failed in 22s</r>']):LOG).join('\n').replace(/<g>(.*?)<\/g>/g,'<span class="g">$1</span>').replace(/<r>(.*?)<\/r>/g,'<span class="r">$1</span>')}</pre>`:''}</li>`).join('')}
l.onclick=e=>{const g=e.target.closest('[data-log]');if(g){open=open==+g.dataset.log?null:+g.dataset.log;draw();return}const p=e.target.closest('[data-pr]');if(p){conf=+p.dataset.pr;draw();return}const y=e.target.closest('[data-yes]');if(y){const d=L.find(x=>x.id==y.dataset.yes);L.forEach(x=>x.cur=0);d.cur=1;d.env='Production';conf=null;document.getElementById('pv').textContent='v2.'+(10+d.id)+'.0 · just now';draw();return}if(e.target.closest('[data-no]')){conf=null;draw()}};
document.querySelectorAll('.dp-f button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dp-f button').forEach(x=>x.setAttribute('aria-pressed',x===b));f=b.dataset.f;draw()});
function run(){const d=L.find(x=>x.s==='run');if(!d)return;const t=setInterval(()=>{li++;if(li>=LOG.length){clearInterval(t);d.s='ok';L.forEach(x=>x.cur=0);d.cur=1;document.getElementById('pv').textContent='v2.'+(10+d.id)+'.0 · just now'}draw()},700)}run();
document.getElementById('nd').onclick=()=>{if(L.some(x=>x.s==='run'))return;const id=Math.max(...L.map(x=>x.id))+1;L.unshift({id,br:'main',msg:'Manual deploy of main',s:'run',t:'just now',env:'Production'});li=0;open=id;draw();run()};draw();
</script>

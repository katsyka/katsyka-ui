<!--Integrations Settings|Settings|A connected apps page: search and category filter, connect flows with a permission review step, connected apps showing scopes and last sync, and disconnect with confirmation.|settings,integrations,apps,oauth,connect-->
<div class="k ig"><div class="ig-w"><h1>Integrations</h1><div class="ig-tb"><label class="ig-s">@I(search,15)<input id="q" type="search" placeholder="Search apps" aria-label="Search apps"></label><div class="ig-f" role="group" aria-label="Category" id="cf"></div></div><ul class="ig-l" id="l"></ul></div>
<dialog class="ig-d" id="dl" aria-labelledby="dh"><h2 id="dh"></h2><p class="mu">This app will be able to:</p><ul id="sc" class="ig-sc"></ul><div class="ig-ac"><button class="b gh" id="cx">Cancel</button><button class="b ac" id="ok">Allow and connect</button></div></dialog></div>
<style>
.k.ig{align-items:start}.ig-w{width:min(760px,100%);display:grid;gap:16px}.ig-w h1{margin:0;font-size:24px;letter-spacing:-.02em}
.ig-tb{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.ig-s{display:flex;gap:8px;align-items:center;height:40px;padding:0 12px;border:1px solid var(--ctl);border-radius:10px;color:var(--mu);background:var(--bg);flex:1;min-width:200px}.ig-s input{border:0;outline:0;background:none;font-size:16px;color:var(--fg);flex:1;min-width:0}.ig-s:focus-within{border-color:var(--ac)}
.ig-f{display:flex;gap:4px}.ig-f button{height:34px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--mu)}.ig-f [aria-pressed=true]{background:var(--sf2);color:var(--fg)}
.ig-l{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.ig-l li{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}.ig-l li:first-child{border:0}
.ig-lg{width:44px;height:44px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:750;font-size:16px}.ig-l div{display:grid;gap:2px}.ig-l small{color:var(--mu);font-size:13px}.ig-l .on small{color:var(--ok)}.ig-l .em{display:block;text-align:center;color:var(--mu);padding:24px}
.ig-d{width:min(420px,calc(100% - 32px));border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--bg);color:var(--fg)}.ig-d::backdrop{background:#0006}.ig-d[open]{animation:igd .2s cubic-bezier(.23,1,.32,1)}@keyframes igd{from{opacity:0;transform:scale(.97)}}.ig-d h2{margin:0 0 4px;font-size:19px}.ig-d p{margin:0 0 12px;font-size:14px}
.ig-sc{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px;font-size:14px}.ig-sc li{display:flex;gap:10px;align-items:center}.ig-sc .i{color:var(--ok)}.ig-ac{display:flex;gap:8px;justify-content:flex-end}
</style>
<script>
const A=[["Slack","Chat","#4a154b","Post updates to channels",["Post messages to channels you choose","Read channel names"],1,"Synced 2 min ago"],["GitHub","Dev","#24292f","Link commits and pull requests",["Read repository metadata","Read pull request status"],1,"Synced 1 h ago"],["Figma","Design","#a259ff","Embed live frames",["View files you share"]],["Linear","Dev","#5e6ad2","Sync issues both ways",["Read and create issues","Read team names"]],["Google Drive","Files","#1a73e8","Attach docs and sheets",["View files you pick"]],["Zoom","Chat","#2d8cff","Start calls from tasks",["Create meetings on your behalf"]]];
let cat='',cur=-1;const l=document.getElementById('l'),q=document.getElementById('q'),dl=document.getElementById('dl');
document.getElementById('cf').innerHTML=['All',...new Set(A.map(a=>a[1]))].map((c,i)=>`<button aria-pressed="${!i}" data-c="${i?c:''}">${c}</button>`).join('');
function draw(){const L=A.map((a,i)=>[a,i]).filter(([a])=>(!cat||a[1]===cat)&&(a[0]+a[3]).toLowerCase().includes(q.value.toLowerCase()));l.innerHTML=L.length?L.map(([a,i])=>`<li class="${a[5]?'on':''}"><span class="ig-lg" style="--c:${a[2]}">${a[0][0]}</span><div><b>${a[0]}</b><small>${a[5]?'● Connected · '+a[6]:a[3]}</small></div>${a[5]?(a[7]?`<span style="display:flex;gap:6px"><button class="b gh sm" data-k="${i}">Keep</button><button class="b sm" style="background:var(--err);color:#fff" data-y="${i}">Disconnect</button></span>`:`<button class="b gh sm" data-d="${i}">Disconnect</button>`):`<button class="b sec sm" data-c="${i}">Connect</button>`}</li>`).join(''):`<li class="em">No apps match “${q.value.replace(/</g,'&lt;')}”. <a href="#">Request an integration</a></li>`}
l.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.c!==undefined&&b.closest('li')){cur=+d.c;const a=A[cur];document.getElementById('dh').textContent=`Connect ${a[0]}`;document.getElementById('sc').innerHTML=a[4].map(s=>`<li>@I(check,16)${s}</li>`).join('');dl.showModal();return}if(d.d){A[d.d][7]=1}if(d.k){A[d.k][7]=0}if(d.y){A[d.y][5]=0;A[d.y][7]=0}draw()};
document.getElementById('cx').onclick=()=>dl.close();document.getElementById('ok').onclick=e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Connecting…';setTimeout(()=>{A[cur][5]=1;A[cur][6]='Synced just now';dl.close();b.disabled=false;b.textContent='Allow and connect';draw()},800)};
document.getElementById('cf').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#cf button').forEach(x=>x.setAttribute('aria-pressed',x===b));cat=b.dataset.c;draw()};q.oninput=draw;draw();
</script>

<!--Lowtide Festival Landing|Landings|A music-festival page built like a screen-printed poster: huge multicolour lineup type, day tabs that swap the lineup and the poster colours, a countdown to gates opening, and a ticket tier picker with a running total.|landing,music,festival,colourful,poster,tickets-->
<div class="k pg fe" id="pg">
<header class="top"><div class="w"><a class="logo" href="#">LOWTIDE ’27</a><nav class="links"><a href="#lu">Lineup</a><a href="#tk">Tickets</a></nav><a class="b ac" href="#tk">Get tickets</a><button class="menu ibt" aria-label="Menu" aria-expanded="false">@I(list,22)</button></div></header>
<section class="fe-hero"><div class="w"><p class="fe-k">3 days · 4 stages · on the old salt flats</p><h1 class="fe-t"><span>LOW</span><span>TIDE</span></h1>
<div class="fe-cd" id="cd" aria-label="Countdown to gates opening"></div></div></section>
<section class="w fe-lu" id="lu"><div class="fe-tabs" role="tablist" id="tabs"></div><div class="fe-names" id="names" role="tabpanel"></div></section>
<section class="w fe-tk" id="tk"><h2 class="h2">Tickets</h2><div class="fe-tiers" id="tiers"></div><div class="fe-sum"><span id="sum">0 tickets · €0</span><button class="b ac lg" id="buy" disabled>Checkout</button></div><p class="fe-msg" id="msg" role="status"></p></section>
<footer class="foot"><div class="w"><span>Lowtide is demo content.</span><span>Ages 16+. No glass on the flats.</span></div></footer>
</div>
<style>
.fe{--p1:#ff3d7f;--p2:#ffd23f;--p3:#3dd6c6;--pb:#1d1a6b;background:var(--pb)!important;color:#fff;transition:background .4s var(--ease)}
.fe .top{background:color-mix(in srgb,var(--pb) 85%,transparent);border-color:rgb(255 255 255/.14)}.fe .links a{color:rgb(255 255 255/.75)}.fe .logo{color:#fff;font-weight:800}.fe .b.ac{background:var(--p2);color:#14123d}.fe .foot{color:rgb(255 255 255/.65);border-color:rgb(255 255 255/.14)}.fe .menu{color:#fff}
.fe-hero{padding:56px 0 24px}.fe-k{font:600 13px/1.4 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--p3)}
.fe-t{font-size:clamp(96px,24vw,300px);line-height:.78;font-weight:900;letter-spacing:-.06em;display:grid;margin:18px 0 28px!important}.fe-t span:first-child{color:var(--p1)}.fe-t span:last-child{color:var(--p2);margin-left:.4em}
.fe-cd{display:flex;gap:10px;flex-wrap:wrap}.fe-cd div{background:#fff;color:var(--pb);border-radius:14px;padding:10px 14px;min-width:84px;display:grid;font-variant-numeric:tabular-nums}.fe-cd b{font-size:30px;line-height:1;font-weight:800}.fe-cd span{font-size:12px;font-weight:600;opacity:.7}
.fe-lu{padding:56px 0}.fe-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.fe-tabs button{height:44px;padding:0 18px;border-radius:99px;border:2px solid rgb(255 255 255/.35);color:#fff;font:600 15px Geist,sans-serif;background:none;cursor:pointer}.fe-tabs button[aria-selected=true]{background:#fff;color:var(--pb);border-color:#fff}
.fe-names{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;font-weight:850;letter-spacing:-.03em;text-transform:uppercase;line-height:1}.fe-names span{animation:fen .4s var(--ease) both}.fe-names .x1{font-size:clamp(44px,8vw,96px)}.fe-names .x2{font-size:clamp(30px,5vw,56px)}.fe-names .x3{font-size:clamp(20px,3vw,30px);opacity:.85}
@keyframes fen{from{opacity:0;transform:translateY(12px)}}
.fe-tk{padding:24px 0 80px}.fe-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.fe-tier{border-radius:20px;padding:20px;color:#14123d;display:grid;gap:10px}.fe-tier h3{margin:0;font-size:20px;font-weight:800}.fe-tier p{margin:0;font-size:14px;opacity:.8}.fe-tier .pr{font-size:34px;font-weight:850;letter-spacing:-.03em}
.fe-q{display:flex;align-items:center;gap:6px}.fe-q button{width:44px;height:44px;border-radius:12px;border:0;background:rgb(20 18 61/.12);color:inherit;display:grid;place-items:center;cursor:pointer}.fe-q button:disabled{opacity:.35}.fe-q output{min-width:32px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.fe-sum{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:18px;font-weight:700;border-top:1px solid rgb(255 255 255/.2);padding-top:16px}.fe-msg{margin-top:12px!important;color:var(--p3)}
@media (max-width:760px){.fe-tiers{grid-template-columns:1fr}}
</style>
<script>
const DAYS={Friday:{c:['#ff3d7f','#ffd23f','#3dd6c6','#1d1a6b'],n:[['Marrow Bay',1],['Sister Cobalt',1],['Velvet Ferry',2],['Okra Moon',2],['The Low Bells',2],['Dune Static',3],['Pea Coat',3],['Hollis & Fen',3],['Twelve Kites',3]]},Saturday:{c:['#ffb703','#8ecae6','#ff5d5d','#5b1238'],n:[['Glass Animals Club',1],['Ruby Sedan',1],['Neon Parish',2],['Kelp',2],['Ana Lisboa',2],['Saltwater Choir',3],['Mopeds',3],['Lanternfish',3],['Gold Static',3]]},Sunday:{c:['#a3e635','#f472b6','#facc15','#0f3d3e'],n:[['Harbour Lights',1],['Juniper Rail',1],['Small Hours',2],['Tin Orchard',2],['Marisol',2],['The Undertow',3],['Paper Moons',3],['Fogline',3],['Wren',3]]}};
const pg=document.getElementById('pg'),tabs=document.getElementById('tabs'),names=document.getElementById('names');
function show(d){const D=DAYS[d];['--p1','--p2','--p3','--pb'].forEach((v,i)=>pg.style.setProperty(v,D.c[i]));tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.textContent===d));names.innerHTML=D.n.map((n,i)=>`<span class="x${n[1]}" style="color:${D.c[i%3]};animation-delay:${i*30}ms">${n[0]}</span>`).join('<span class="x3" aria-hidden="true">·</span>')}
Object.keys(DAYS).forEach(d=>{const b=document.createElement('button');b.role='tab';b.textContent=d;b.onclick=()=>show(d);tabs.append(b)});
tabs.onkeydown=e=>{const bs=[...tabs.children],i=bs.indexOf(document.activeElement);if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=bs[(i+(e.key==='ArrowRight'?1:bs.length-1))%bs.length];n.focus();n.click()}};show('Friday');
const gate=new Date(new Date().getFullYear()+1,6,16,14),cd=document.getElementById('cd');
function tick(){let s=Math.max(0,(gate-Date.now())/1e3|0);const u=[['days',86400],['hours',3600],['min',60],['sec',1]].map(([l,k])=>{const v=s/k|0;s-=v*k;return`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`});cd.innerHTML=u.join('')}tick();setInterval(tick,1000);
const T=[['Day pass','One day, any stage',69,'#ffd23f'],['Weekend','All three days',159,'#3dd6c6'],['Weekend + camp','Pitch on the flats',219,'#ff7eb3']],q=T.map(()=>0),tiers=document.getElementById('tiers'),sum=document.getElementById('sum'),buy=document.getElementById('buy');
T.forEach((t,i)=>{const d=document.createElement('div');d.className='fe-tier';d.style.background=t[3];d.innerHTML=`<h3>${t[0]}</h3><p>${t[1]}</p><span class="pr">€${t[2]}</span><div class="fe-q"><button aria-label="Remove one ${t[0]}">@I(minus,18)</button><output aria-live="polite">0</output><button aria-label="Add one ${t[0]}">@I(plus,18)</button></div>`;const [m,p]=d.querySelectorAll('button'),o=d.querySelector('output');const up=()=>{o.textContent=q[i];m.disabled=!q[i];p.disabled=q[i]>=8;const n=q.reduce((a,b)=>a+b,0);sum.textContent=`${n} ticket${n===1?'':'s'} · €${q.reduce((a,v,j)=>a+v*T[j][2],0)}`;buy.disabled=!n};m.onclick=()=>{q[i]--;up()};p.onclick=()=>{q[i]++;up()};up();tiers.append(d)});
buy.onclick=()=>{buy.disabled=true;buy.textContent='Reserving…';setTimeout(()=>{buy.textContent='Checkout';buy.disabled=false;document.getElementById('msg').textContent='Held for 10 minutes. (Demo: no payment is taken.)'},900)};
</script>

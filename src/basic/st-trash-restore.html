<!--Trash and Restore|States|A recently-deleted view: items with days left before permanent deletion as a shrinking bar, restore one or all, select and delete forever with a confirm, and an empty state when clear.|trash,deleted,restore,undo,empty state-->
<div class="k tz"><main class="tz-w"><div class="tz-h"><h1>Recently deleted</h1><button class="b sec sm" id="ra">Restore all</button></div><p class="mu">Items are deleted forever after 30 days.</p><ul class="tz-l" id="l"></ul><p class="tz-m" id="m" role="status"></p></main></div>
<style>
.tz-w{width:min(560px,100%);display:grid;gap:10px}.tz-h{display:flex;justify-content:space-between;align-items:center}.tz-h h1{margin:0;font-size:22px;letter-spacing:-.02em}.tz-w>p{margin:-4px 0 4px;font-size:14px}
.tz-l{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.tz-l li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);transition:opacity .2s}.tz-l li:first-child{border:0}.tz-l .ic{width:36px;height:36px;border-radius:9px;background:var(--sf2);display:grid;place-items:center;color:var(--mu)}.tz-l div{display:grid;gap:4px;min-width:0}.tz-l b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tz-d{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}.tz-d i{width:60px;height:4px;border-radius:2px;background:var(--sf2);overflow:hidden}.tz-d i::after{content:"";display:block;height:100%;width:var(--w);background:var(--c)}.tz-l .ac{display:flex;gap:4px}
.tz-em{padding:32px;text-align:center;color:var(--mu);display:block!important}.tz-m{font-size:14px;margin:0;display:flex;gap:8px;align-items:center}.tz-m:empty{display:none}.tz-m button{text-decoration:underline;font-weight:600;min-height:32px}
</style>
<script>
let I=[["Brand guidelines v3.pdf","file",27],["Onboarding flow","grid",12],["Old logo exports","folder",3],["Interview notes, Mar","file",1]];const l=document.getElementById('l'),m=document.getElementById('m'),IC={file:'@I(file,18)',grid:'@I(grid,18)',folder:'@I(folder,18)'};let pend=null;
function draw(){l.innerHTML=I.length?I.map(([n,t,d],i)=>`<li><span class="ic">${IC[t]}</span><div><b>${n}</b><span class="tz-d"><i style="--w:${d/30*100}%;--c:${d<4?'var(--err)':d<10?'var(--warn)':'var(--ctl)'}"></i>${d} day${d>1?'s':''} left</span></div><span class="ac">${pend===i?`<button class="b sm" style="background:var(--err);color:#fff" data-y="${i}">Delete forever</button><button class="b gh sm" data-n>Cancel</button>`:`<button class="b gh sm" data-r="${i}">Restore</button><button class="ibt" data-d="${i}" aria-label="Delete ${n} forever">@I(trash,16)</button>`}</span></li>`).join(''):'<li class="tz-em">Trash is empty.</li>';document.getElementById('ra').hidden=!I.length}
l.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.r){const it=I.splice(+d.r,1)[0];m.textContent=`Restored “${it[0]}”.`}if(d.d){pend=+d.d}if(d.n!==undefined){pend=null}if(d.y){const it=I.splice(+d.y,1)[0];pend=null;m.textContent=`“${it[0]}” deleted forever.`}draw()};
document.getElementById('ra').onclick=()=>{const n=I.length;const old=I;I=[];draw();m.innerHTML=`Restored ${n} items. <button id="u">Undo</button>`;document.getElementById('u').onclick=()=>{I=old;m.textContent='';draw()}};draw();
</script>

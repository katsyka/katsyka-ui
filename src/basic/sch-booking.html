<!--Booking Page|Scheduling|A meeting booking page: host and meeting info, a month calendar with available days, time slots for the chosen day in the visitor's time zone (switchable), a details form and a confirmation with add-to-calendar.|scheduling,booking,calendar,time slots,timezone-->
<div class="k"><div class="bk card"><aside class="bk-h"><img src="media/pics/c/1014.jpg" alt=""><span class="mu">Ines Aldana</span><h1>Intro call</h1><p class="mu">@I(clock,14) 30 min · @I(video,14) Video call</p><p>A quick call to see if we're a good fit. Bring one question you'd most like answered.</p></aside>
<div class="bk-c" id="c"><div class="bk-mh"><button class="ibt" id="pm" aria-label="Previous month">@I(left,16)</button><b id="mn"></b><button class="ibt" id="nm" aria-label="Next month">@I(right,16)</button></div><div class="bk-g" id="g" role="grid"></div><label class="bk-tz">@I(globe,14)<select id="tz" aria-label="Time zone"></select></label></div>
<div class="bk-s" id="s"><b id="sd">Pick a day</b><div id="sl" class="bk-sl"></div></div></div></div>
<style>
.bk{width:min(940px,100%);display:grid;grid-template-columns:240px 1fr 200px;overflow:hidden;min-height:440px}.bk-h{padding:24px;border-right:1px solid var(--line);display:grid;gap:8px;align-content:start}.bk-h img{width:44px;height:44px;border-radius:50%;object-fit:cover}.bk-h span{font-size:13px}.bk-h h1{margin:0;font-size:22px;letter-spacing:-.02em}.bk-h p{margin:0;font-size:14px;line-height:1.55;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bk-c{padding:20px;display:grid;gap:12px;align-content:start}.bk-mh{display:flex;justify-content:space-between;align-items:center}.bk-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.bk-g .dw{font-size:11px;color:var(--mu);padding:4px 0}
.bk-g button{aspect-ratio:1;max-height:48px;border-radius:50%;font-weight:550;font-variant-numeric:tabular-nums;color:var(--mu);position:relative}.bk-g button.av{color:var(--ac);background:var(--ac-sf);font-weight:700}.bk-g button.av:hover{background:color-mix(in srgb,var(--ac) 22%,transparent)}.bk-g button[aria-selected=true]{background:var(--ac);color:var(--ac-fg)}.bk-g button:disabled{opacity:.4;cursor:default}.bk-g .td::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;border-radius:50%;background:currentColor;translate:-50%}
.bk-tz{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu)}.bk-tz select{border:0;background:none;font:inherit;color:var(--fg);padding:4px}
.bk-s{padding:20px 16px;border-left:1px solid var(--line);display:grid;gap:10px;align-content:start;max-height:520px;overflow:auto}.bk-s b{font-size:14px}.bk-sl{display:grid;gap:6px}.bk-sl button{height:44px;border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);color:var(--ac);border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums;animation:bkf .2s cubic-bezier(.23,1,.32,1) both}@keyframes bkf{from{opacity:0;transform:translateY(4px)}}.bk-sl button:hover{border-color:var(--ac)}.bk-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bk-pair button:first-child{background:var(--fg);color:var(--bg);border-color:var(--fg);animation:none}
.bk-f{display:grid;gap:10px;padding:20px;grid-column:2/-1;animation:bkf .25s}.bk-f .in{height:42px;font-size:15px}.bk-f textarea.in{height:auto;padding:10px}.bk-ok{grid-column:2/-1;padding:32px;display:grid;gap:10px;justify-items:start;animation:bkf .3s}.bk-ok h2{margin:0;font-size:22px}
@media (max-width:860px){.bk{grid-template-columns:1fr}.bk-h,.bk-s{border:0;border-bottom:1px solid var(--line)}.bk-f,.bk-ok{grid-column:1}}
</style>
<script>
const $=i=>document.getElementById(i),now=new Date();let vm=new Date(now.getFullYear(),now.getMonth(),1),sel=null,slot=null;const TZ=[Intl.DateTimeFormat().resolvedOptions().timeZone,'Europe/London','America/New_York','Asia/Tokyo'].filter((v,i,a)=>a.indexOf(v)===i);
$('tz').innerHTML=TZ.map(z=>`<option>${z}</option>`).join('');const avail=d=>{const wd=d.getDay();return d>now&&wd>0&&wd<6&&(d.getDate()*7)%5!==0};
function cal(){$('mn').textContent=vm.toLocaleDateString('en-GB',{month:'long',year:'numeric'});const f=(vm.getDay()+6)%7,dim=new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate();let h=['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<span class="dw">${d}</span>`).join('')+'<span></span>'.repeat(f);
for(let d=1;d<=dim;d++){const dt=new Date(vm.getFullYear(),vm.getMonth(),d),a=avail(dt),td=dt.toDateString()===now.toDateString();h+=`<button class="${a?'av':''}${td?' td':''}" ${a?'':'disabled'} data-d="${d}" aria-selected="${sel&&sel.toDateString()===dt.toDateString()}" aria-label="${dt.toDateString()}${a?', available':''}">${d}</button>`}$('g').innerHTML=h;$('pm').disabled=vm<=new Date(now.getFullYear(),now.getMonth(),1)}
function slots(){if(!sel)return;$('sd').textContent=sel.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});const tz=$('tz').value,S=[9,9.5,10.5,11,13,14.5,15,16];$('sl').innerHTML=S.map((h,i)=>{const u=new Date(Date.UTC(sel.getFullYear(),sel.getMonth(),sel.getDate(),h-1,(h%1)*60));const t=u.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:tz});return slot===i?`<div class="bk-pair"><button data-ok="${i}">${t}</button><button data-ok="${i}">Next</button></div>`:`<button data-s="${i}" style="animation-delay:${i*25}ms">${t}</button>`}).join('')}
$('g').onclick=e=>{const b=e.target.closest('button.av');if(!b)return;sel=new Date(vm.getFullYear(),vm.getMonth(),+b.dataset.d);slot=null;cal();slots()};$('pm').onclick=()=>{vm.setMonth(vm.getMonth()-1);cal()};$('nm').onclick=()=>{vm.setMonth(vm.getMonth()+1);cal()};$('tz').onchange=slots;
$('sl').onclick=e=>{const s=e.target.closest('[data-s]');if(s){slot=+s.dataset.s;slots();return}const o=e.target.closest('[data-ok]');if(o){const t=o.parentElement.firstChild.textContent;$('c').hidden=true;$('s').hidden=true;document.querySelector('.bk').insertAdjacentHTML('beforeend',`<form class="bk-f" id="bf"><b>${sel.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${t}</b><label><span class="lbl">Name</span><input class="in" required autocomplete="name"></label><label><span class="lbl">Email</span><input class="in" type="email" required autocomplete="email"></label><label><span class="lbl">Your question (optional)</span><textarea class="in" rows="2"></textarea></label><div style="display:flex;gap:8px"><button type="button" class="b gh" id="bb">Back</button><button class="b ac">Confirm booking</button></div></form>`);$('bb').onclick=()=>{$('bf').remove();$('c').hidden=false;$('s').hidden=false};$('bf').onsubmit=ev=>{ev.preventDefault();if(!$('bf').checkValidity()){$('bf').reportValidity();return}$('bf').outerHTML=`<div class="bk-ok"><span class="pill ok">Confirmed</span><h2>You're booked with Ines</h2><p class="mu" style="margin:0">${sel.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${t} (${$('tz').value}). A calendar invite is on its way.</p><button class="b sec">@I(cal,16)Add to calendar</button></div>`}}};cal();
</script>

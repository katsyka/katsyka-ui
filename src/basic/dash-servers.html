<!--Server Monitor Dashboard|Dashboards|Infrastructure monitoring: a host grid coloured by CPU that updates live, sparklines per host, an incident banner with acknowledge, and a host detail drawer with memory, disk and recent alerts.|dashboard,monitoring,servers,devops,live,sparkline-->
<div class="k db">
<aside class="db-side" aria-label="Main"><div class="db-brand"><i>◎</i>Watchtower</div><a href="#" aria-current="page">@I(grid,18)Hosts</a><a href="#">@I(bell,18)Alerts<em>2</em></a><a href="#">@I(chart,18)Metrics</a><a href="#">@I(file,18)Logs</a><div class="db-user"><span class="av" style="--c:#0f766e">TS</span><div><b>Tarek S.</b><span>On call until 18:00</span></div></div></aside>
<main class="db-main"><header class="db-top"><button class="db-mb ibt" aria-label="Open navigation" aria-expanded="false">@I(list,20)</button><h1>Production · eu-central</h1><span class="sp"></span><span class="mu tn" id="up">Updated now</span></header>
<div class="db-body"><div class="sm-inc" id="inc" role="alert"><span>@I(flame,18)</span><div><b>db-03: disk 91% full</b><span>Started 14 min ago · auto-paged Tarek</span></div><button class="b sec sm" id="ack">Acknowledge</button></div>
<div class="sm-leg mu"><span><i style="--c:var(--ok)"></i>&lt;60%</span><span><i style="--c:var(--warn)"></i>60–85%</span><span><i style="--c:var(--err)"></i>&gt;85% CPU</span></div><div class="sm-g" id="g"></div></div></main>
<dialog class="sm-dr" id="dr" aria-labelledby="dh"><header><h2 id="dh"></h2><button class="ibt" id="dx" aria-label="Close">@I(x)</button></header><div id="dd"></div></dialog>
</div>
<style>
.sm-inc{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--err-sf);color:var(--fg)}.sm-inc>span{color:var(--err)}.sm-inc div{display:grid;flex:1}.sm-inc div span{font-size:13px;color:var(--mu)}.sm-inc.ok{background:var(--sf2)}.sm-inc.ok>span{color:var(--mu)}
.sm-leg{display:flex;gap:16px;font-size:12px}.sm-leg span{display:flex;gap:6px;align-items:center}.sm-leg i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.sm-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.sm-h{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;text-align:left;transition:border-color .15s}.sm-h:hover{border-color:var(--ctl)}.sm-h .t{display:flex;justify-content:space-between;align-items:center}.sm-h code{font:600 13px 'Geist Mono',monospace}.sm-h .d{width:8px;height:8px;border-radius:50%;background:var(--c)}.sm-h b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.sm-h small{color:var(--mu);font-size:12px}.sm-h svg{width:100%;height:28px}.sm-h path{fill:none;stroke:var(--c);stroke-width:1.5;vector-effect:non-scaling-stroke}
.sm-dr{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(400px,100%);border:0;border-left:1px solid var(--line);padding:20px;background:var(--bg);color:var(--fg)}.sm-dr[open]{animation:smd .25s cubic-bezier(.23,1,.32,1)}@keyframes smd{from{transform:translateX(24px);opacity:0}}.sm-dr::backdrop{background:#0004}.sm-dr header{display:flex;justify-content:space-between;align-items:center}.sm-dr h2{margin:0;font:600 18px 'Geist Mono',monospace}
.sm-m{display:grid;gap:4px;margin-top:16px}.sm-m .h{display:flex;justify-content:space-between;font-size:13px}.sm-m .tr{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden}.sm-m .tr i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:4px}.sm-al{list-style:none;padding:0;margin:20px 0 0;font-size:13px}.sm-al li{padding:10px 0;border-top:1px solid var(--line);display:grid}
</style>
<script>
const H=['web-01','web-02','web-03','web-04','api-01','api-02','api-03','db-01','db-02','db-03','cache-01','queue-01'].map((n,i)=>({n,v:Array.from({length:24},()=>20+Math.random()*40+(n==='api-02'?30:0)),disk:n==='db-03'?91:30+(i*13)%50,mem:40+(i*17)%45}));
const g=document.getElementById('g'),col=v=>v>85?'var(--err)':v>60?'var(--warn)':'var(--ok)';
function draw(){g.innerHTML=H.map((h,i)=>{const v=h.v[h.v.length-1],mx=100,p=h.v.map((y,j)=>`${(j/23*100).toFixed(1)},${(28-y/mx*28).toFixed(1)}`).join('L');return `<button class="sm-h" data-i="${i}" style="--c:${col(v)}" aria-label="${h.n}, CPU ${Math.round(v)}%"><span class="t"><code>${h.n}</code><span class="d"></span></span><b>${Math.round(v)}%</b><small>CPU · mem ${h.mem}% · disk ${h.disk}%</small><svg viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><path d="M${p}"/></svg></button>`}).join('')}
function tick(){H.forEach(h=>{h.v.shift();h.v.push(Math.max(3,Math.min(99,h.v[h.v.length-1]+(Math.random()-.5)*18)))});draw();document.getElementById('up').textContent='Updated '+new Date().toLocaleTimeString('en-GB')}
draw();if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(tick,2000);
const dr=document.getElementById('dr');g.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const h=H[b.dataset.i];document.getElementById('dh').textContent=h.n;document.getElementById('dd').innerHTML=[['CPU',Math.round(h.v[23])],['Memory',h.mem],['Disk',h.disk]].map(([n,v])=>`<div class="sm-m"><div class="h"><span>${n}</span><b class="tn">${v}%</b></div><div class="tr"><i style="--w:${v}%;--c:${col(v)}"></i></div></div>`).join('')+`<ul class="sm-al"><li><b>${h.disk>85?'Disk above 85%':'No open alerts'}</b><span class="mu">${h.disk>85?'14 min ago':'Last alert 6 days ago'}</span></li><li><b>Kernel updated to 6.8.12</b><span class="mu">Yesterday 03:12</span></li></ul>`;dr.showModal()};
document.getElementById('dx').onclick=()=>dr.close();dr.onclick=e=>{if(e.target===dr)dr.close()};
document.getElementById('ack').onclick=e=>{const i=document.getElementById('inc');i.classList.add('ok');i.querySelector('div span').textContent='Acknowledged by you just now · still open';e.currentTarget.textContent='Acknowledged';e.currentTarget.disabled=true};
</script>

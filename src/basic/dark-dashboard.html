<!--Dark Dashboard|Dark|A dark analytics view built by the rules: #0f0f11 base, surfaces stepped by lightness, off-white text, chart colours desaturated and lightened for dark, hairline borders, numbers in tabular figures and a hover crosshair on the chart.|dark mode,dashboard,chart,analytics,kpi-->
<div class="k"><div class="dd">
  <header class="dd-h"><div><h1>Overview</h1><p>Last 30 days · updated 2 min ago</p></div><div class="dd-seg"><button aria-pressed="false">7d</button><button aria-pressed="true">30d</button><button aria-pressed="false">90d</button></div></header>
  <div class="dd-k"><div><span>Revenue</span><b class="tn">$48,210</b><em class="up">↑ 12.4%</em></div><div><span>Orders</span><b class="tn">1,204</b><em class="up">↑ 6.1%</em></div><div><span>Refunds</span><b class="tn">18</b><em class="dn">↑ 2</em></div><div><span>Avg. order</span><b class="tn">$40.04</b><em>— 0.0%</em></div></div>
  <section class="dd-c"><header><b>Revenue</b><span class="dd-lg"><i style="--c:var(--s1)"></i>This period<i style="--c:var(--s2)"></i>Previous</span></header>
    <div class="dd-ch" id="ch"><svg id="sv" viewBox="0 0 600 200" preserveAspectRatio="none"></svg><div class="dd-x" id="x" hidden><i></i><span id="tt"></span></div></div></section>
  <section class="dd-c"><header><b>Top products</b></header><table class="dd-t"><tbody id="tb"></tbody></table></section>
</div></div>
<style>
.k{color-scheme:dark;--e0:#0f0f11;--e1:#17171a;--e2:#1e1e22;--tx:#ececee;--tx2:#a1a1aa;--hl:#ffffff12;--s1:#8ab4ff;--s2:#5b5b66;--up:#6ee7a0;--dn:#fca5a5;background:var(--e0);color:var(--tx);place-items:start center}
.dd{width:min(920px,100%);display:grid;gap:12px}
.dd-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.dd h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}.dd-h p{margin:2px 0 0;color:var(--tx2);font-size:13px}
.dd-seg{display:flex;padding:3px;border-radius:9px;background:var(--e1);border:1px solid var(--hl)}.dd-seg button{height:28px;padding:0 12px;border-radius:6px;font-size:13px;color:var(--tx2)}.dd-seg [aria-pressed=true]{background:var(--e2);color:var(--tx);box-shadow:inset 0 1px 0 #ffffff0d}
.dd-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.dd-k div,.dd-c{background:var(--e1);border:1px solid var(--hl);border-radius:14px;padding:16px}
.dd-k span{font-size:13px;color:var(--tx2)}.dd-k b{display:block;margin:4px 0;font-size:26px;font-weight:600;letter-spacing:-.02em}
.dd-k em{font-style:normal;font-size:12px;font-weight:600;color:var(--tx2)}.dd-k .up{color:var(--up)}.dd-k .dn{color:var(--dn)}
.dd-c header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.dd-c b{font-weight:550}
.dd-lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}.dd-lg i{width:10px;height:3px;border-radius:2px;background:var(--c);margin-left:8px}
.dd-ch{position:relative;height:220px}.dd-ch svg{width:100%;height:100%;overflow:visible}
.dd-x{position:absolute;top:0;bottom:0;pointer-events:none}.dd-x i{position:absolute;top:0;bottom:0;width:1px;background:#ffffff26}
.dd-x span{position:absolute;top:4px;left:8px;white-space:nowrap;padding:6px 8px;border-radius:8px;background:var(--e2);border:1px solid var(--hl);font-size:12px;font-variant-numeric:tabular-nums}
.dd-t{width:100%;border-collapse:collapse}.dd-t td{padding:10px 0;border-top:1px solid var(--hl);font-size:14px}.dd-t td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.dd-t .bar{width:40%;padding:0 16px}.dd-t .bar i{display:block;height:6px;border-radius:3px;background:var(--s1);opacity:.85}
.dd img{filter:brightness(.9)}
</style>
<script>
const N=30,a=[],b=[];let s1=7,s2=3;const R=()=>(s1=(s1*16807)%2147483647)/2147483647,R2=()=>(s2=(s2*48271)%2147483647)/2147483647;
for(let i=0;i<N;i++){a.push(1200+i*28+R()*500);b.push(1150+i*14+R2()*420)}
const mx=Math.max(...a,...b)*1.1,X=i=>i/(N-1)*600,Y=v=>200-v/mx*200;
const line=d=>d.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
sv.innerHTML=[.25,.5,.75].map(f=>`<line x1="0" x2="600" y1="${200*f}" y2="${200*f}" stroke="#ffffff0f" vector-effect="non-scaling-stroke"/>`).join("")+`<defs><linearGradient id="gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8ab4ff" stop-opacity=".22"/><stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/></linearGradient></defs><path d="${line(a)} L600 200 L0 200Z" fill="url(#gf)"/><path d="${line(b)}" fill="none" stroke="var(--s2)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><path d="${line(a)}" fill="none" stroke="var(--s1)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
ch.addEventListener("pointermove",e=>{const r=ch.getBoundingClientRect(),i=Math.round((e.clientX-r.left)/r.width*(N-1));if(i<0||i>=N)return;x.hidden=false;x.style.left=i/(N-1)*r.width+"px";tt.innerHTML=`Nov ${i+1} · <b style="color:var(--s1)">$${Math.round(a[i]).toLocaleString("en")}</b> <span style="color:var(--tx2)">vs $${Math.round(b[i]).toLocaleString("en")}</span>`;const sp=x.querySelector("span");sp.style.left=i>N*.6?"auto":"8px";sp.style.right=i>N*.6?"8px":"auto"});
ch.addEventListener("pointerleave",()=>x.hidden=true);
const P=[["Valley floor print",12840],["Low tide print",9120],["Oak frame 50×70",7410],["Gift card",3980]];
tb.innerHTML=P.map(([n,v])=>`<tr><td>${n}</td><td class="bar"><i style="width:${v/P[0][1]*100}%"></i></td><td>$${v.toLocaleString("en")}</td></tr>`).join("");
document.querySelectorAll(".dd-seg button").forEach((b,i,A)=>b.onclick=()=>A.forEach(x=>x.setAttribute("aria-pressed",x===b)));
</script>

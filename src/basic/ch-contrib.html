<!--Contribution Heatmap|Charts|A year of daily activity as a calendar heatmap with month labels, five-step single-hue scale, a hover/keyboard tooltip with the exact date and count, and current/longest streak stats.|chart,heatmap,calendar,activity,streak-->
<div class="k"><figure class="cb card"><figcaption><b id="tt"></b><span class="mu" id="sk"></span></figcaption><div class="cb-w"><div class="cb-m" id="m" aria-hidden="true"></div><div class="cb-g" id="g" role="grid" aria-label="Daily activity over the last year"></div></div><div class="cb-k"><span class="mu">Less</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span class="mu">More</span></div><p class="cb-t mu" id="tp" aria-live="polite">Hover a day</p></figure></div>
<style>
.cb{width:min(820px,100%);max-width:100%;min-width:0;padding:20px;margin:0}.cb figcaption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:14px}.cb-w{overflow-x:auto;padding-bottom:4px;max-width:100%}
.cb-m{display:grid;grid-template-columns:repeat(53,13px);gap:3px;font-size:10px;color:var(--mu);height:14px;margin-bottom:4px}.cb-g{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.cb-g i,.cb-k i{width:13px;height:13px;border-radius:3px;background:var(--sf2);display:block}.cb-g i{outline-offset:1px}.cb-g i:hover,.cb-g i:focus{outline:1.5px solid var(--fg)}
[data-l="1"]{background:#bbf7d0!important}[data-l="2"]{background:#4ade80!important}[data-l="3"]{background:#16a34a!important}[data-l="4"]{background:#14532d!important}
@media (prefers-color-scheme:dark){[data-l="1"]{background:#14532d!important}[data-l="2"]{background:#166534!important}[data-l="3"]{background:#22c55e!important}[data-l="4"]{background:#86efac!important}}
.cb-k{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:11px;margin-top:10px}.cb-k span{margin:0 4px}.cb-t{font-size:13px;margin:8px 0 0;min-height:20px}
</style>
<script>
const g=document.getElementById('g'),m=document.getElementById('m'),today=new Date();today.setHours(0,0,0,0);const start=new Date(today);start.setDate(start.getDate()-364-((today.getDay()+6)%7));let sd=9;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
const D=[];for(let d=new Date(start);d<=today;d.setDate(d.getDate()+1)){const we=d.getDay()%6===0,v=rnd()<(we?.35:.78)?Math.floor(rnd()*rnd()*14)+1:0;D.push([new Date(d),v])}
const lv=v=>v===0?0:v<3?1:v<6?2:v<10?3:4;g.innerHTML=D.map(([d,v],i)=>`<i data-l="${lv(v)}" data-i="${i}" tabindex="${i===D.length-1?0:-1}" role="gridcell" aria-label="${v} contributions on ${d.toDateString()}"></i>`).join('');
let last=-1;m.innerHTML=Array.from({length:53},(_,w)=>{const d=D[w*7]?.[0];if(!d)return'<span></span>';const mo=d.getMonth();const s=mo!==last?d.toLocaleDateString('en',{month:'short'}):'';last=mo;return`<span>${s}</span>`}).join('');
const tot=D.reduce((a,x)=>a+x[1],0);let cur=0,lng=0,run=0;D.forEach(x=>{run=x[1]?run+1:0;lng=Math.max(lng,run)});for(let i=D.length-1;i>=0&&D[i][1];i--)cur++;
document.getElementById('tt').textContent=`${tot.toLocaleString('en')} contributions in the last year`;document.getElementById('sk').textContent=`Current streak ${cur} days · longest ${lng} days`;
const tip=i=>{const [d,v]=D[i];document.getElementById('tp').textContent=`${v||'No'} contribution${v===1?'':'s'} on ${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}`};
g.addEventListener('pointerover',e=>{if(e.target.dataset.i)tip(+e.target.dataset.i)});g.addEventListener('focusin',e=>{if(e.target.dataset.i)tip(+e.target.dataset.i)});
g.addEventListener('keydown',e=>{const i=+e.target.dataset.i,k={ArrowUp:-1,ArrowDown:1,ArrowLeft:-7,ArrowRight:7}[e.key];if(k===undefined)return;e.preventDefault();const n=g.children[i+k];if(n){e.target.tabIndex=-1;n.tabIndex=0;n.focus()}});
g.parentElement.scrollLeft=9999;
</script>

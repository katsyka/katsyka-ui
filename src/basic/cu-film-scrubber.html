<!--Film Strip Scrubber|Custom|A video timeline styled as a film strip with sprocket holes: drag or flick the strip under a fixed playhead with inertia, frames snap, a timecode counter rolls, and arrow keys step one frame.|custom,film,scrubber,timeline,inertia,timecode-->
<div class="k fl2"><div class="fl2-w"><div class="fl2-v"><img id="v" alt=""><span class="fl2-tc tn" id="tc">00:00:00:00</span></div><div class="fl2-s" id="s" tabindex="0" role="slider" aria-label="Frame" aria-valuemin="0"><div class="fl2-t" id="t"></div><span class="fl2-ph" aria-hidden="true"></span></div><p class="fl2-h">Drag or flick the strip · ← → step a frame</p></div></div>
<style>
.k.fl2{background:light-dark(#e8e4dc,#0e0e0d)}.fl2-w{width:min(820px,100%);display:grid;gap:14px}.fl2-v{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}.fl2-v img{width:100%;height:100%;object-fit:cover}.fl2-tc{position:absolute;right:12px;bottom:12px;font:600 14px 'Geist Mono',monospace;color:#fff;background:#000a;padding:4px 10px;border-radius:6px}
.fl2-s{position:relative;height:96px;background:#141311;border-radius:8px;overflow:hidden;touch-action:pan-y;cursor:grab;outline:0}.fl2-s:active{cursor:grabbing}.fl2-s:focus-visible{box-shadow:0 0 0 3px #93c5fd}
.fl2-s::before,.fl2-s::after{content:"";position:absolute;left:0;right:0;height:12px;z-index:2;background:radial-gradient(circle at 8px 6px,#e8e4dc 3.2px,transparent 3.6px) 0 0/16px 12px;pointer-events:none}.fl2-s::before{top:3px}.fl2-s::after{bottom:3px}
.fl2-t{position:absolute;top:18px;bottom:18px;left:50%;display:flex;gap:4px;will-change:transform}.fl2-t img{height:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px;flex:none;opacity:.75;pointer-events:none}.fl2-t img.on{opacity:1}
.fl2-ph{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#f59e0b;translate:-50% 0;z-index:3;box-shadow:0 0 0 1px #0006}.fl2-ph::before{content:"";position:absolute;top:0;left:50%;translate:-50% 0;border:6px solid transparent;border-top-color:#f59e0b}
.fl2-h{margin:0;font-size:12px;color:light-dark(#57534e,#a8a29e);text-align:center}
</style>
<script>
const P=['w/1011','w/1016','w/1018','w/1019','w/1033','w/1036','w/1039','w/1040','w/1044','w/1074','w/1076','w/525','w/564'],N=P.length*4,FPS=24,t=document.getElementById('t'),s=document.getElementById('s'),v=document.getElementById('v');
t.innerHTML=Array.from({length:N},(_,i)=>`<img src="media/pics/${P[Math.floor(i/4)]}.jpg" alt="">`).join('');const IM=[...t.children];s.setAttribute('aria-valuemax',N-1);
let fw=0,x=0,vel=0,raf=0,cur=-1;const measure=()=>{fw=IM[0].getBoundingClientRect().width+4};
function render(){t.style.transform=`translateX(${x-fw/2}px)`;const f=Math.max(0,Math.min(N-1,Math.round(-x/fw)));if(f!==cur){cur=f;IM.forEach((m,i)=>m.classList.toggle('on',i===f));v.src=`media/pics/${P[Math.floor(f/4)]}.jpg`;const sec=Math.floor(f/FPS),fr=f%FPS;document.getElementById('tc').textContent=`00:00:${String(sec).padStart(2,'0')}:${String(fr).padStart(2,'0')}`;s.setAttribute('aria-valuenow',f);s.setAttribute('aria-valuetext',`Frame ${f+1} of ${N}`)}}
const clamp=()=>{x=Math.max(-(N-1)*fw,Math.min(0,x))};
function coast(){vel*=.94;x+=vel;clamp();if(Math.abs(vel)>.3){render();raf=requestAnimationFrame(coast)}else snap()}
function snap(){const tx=Math.round(x/fw)*fw;const go=()=>{x+=(tx-x)*.25;if(Math.abs(tx-x)<.5){x=tx;render();return}render();raf=requestAnimationFrame(go)};go()}
let sx=0,lx=0,lt=0,drag=false;s.addEventListener('pointerdown',e=>{cancelAnimationFrame(raf);drag=true;sx=e.clientX-x;lx=e.clientX;lt=performance.now();vel=0;s.setPointerCapture(e.pointerId)});
s.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now();vel=(e.clientX-lx)/Math.max(1,now-lt)*16;lx=e.clientX;lt=now;x=e.clientX-sx;clamp();render()});
s.addEventListener('pointerup',()=>{drag=false;matchMedia('(prefers-reduced-motion:reduce)').matches?snap():coast()});
s.addEventListener('keydown',e=>{const k={ArrowLeft:1,ArrowRight:-1,Home:Infinity,End:-Infinity}[e.key];if(k===undefined)return;e.preventDefault();cancelAnimationFrame(raf);x=isFinite(k)?Math.round(x/fw)*fw+k*fw:k>0?0:-(N-1)*fw;clamp();render()});
const init=()=>{measure();x=-Math.round(N/3)*fw;render()};IM[0].complete?init():IM[0].onload=init;addEventListener('resize',()=>{const f=cur;measure();x=-f*fw;render()});
</script>

<!--Billing Toggle Pricing|Pricing|Three plans with a monthly/yearly switch that animates prices with a rolling number, shows the yearly saving per plan, and highlights the recommended tier without a glow.|pricing,plans,toggle,yearly,cards-->
<div class="k">
<section class="pt"><header><h2>Plans that scale with your team</h2><div class="pt-sw" role="radiogroup" aria-label="Billing period"><button role="radio" aria-checked="false" data-y="0">Monthly</button><button role="radio" aria-checked="true" data-y="1">Yearly <span class="pill ok">−20%</span></button></div></header>
<div class="pt-g" id="g"></div><p class="mu pt-fn">Prices in EUR, VAT excluded. Cancel any time.</p></section>
</div>
<style>
.pt{width:min(1040px,100%)}.pt header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}.pt h2{margin:0;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.pt-sw{display:flex;background:var(--sf2);border-radius:12px;padding:4px}.pt-sw button{height:36px;padding:0 14px;border-radius:9px;font-weight:550;color:var(--mu);display:flex;gap:6px;align-items:center}.pt-sw [aria-checked=true]{background:var(--bg);color:var(--fg);box-shadow:var(--shadow)}
.pt-g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.pt-c{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:16px;align-content:start}.pt-c.rec{border:2px solid var(--fg);position:relative}.pt-c.rec::before{content:"Most teams pick this";position:absolute;top:-12px;left:20px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.pt-c h3{margin:0;font-size:16px}.pt-c>p{margin:-8px 0 0;color:var(--mu);font-size:14px;min-height:42px}.pt-pr{display:flex;align-items:baseline;gap:6px;height:48px}.pt-pr b{font-size:44px;letter-spacing:-.03em;display:inline-flex;overflow:hidden;height:48px;line-height:48px}.pt-pr b span{display:inline-block;transition:transform .45s var(--ease)}.pt-pr small{color:var(--mu)}
.pt-sv{font-size:13px;color:var(--ok);min-height:18px;margin-top:-10px}.pt-c .b{height:44px}.pt-c ul{list-style:none;padding:16px 0 0;margin:0;border-top:1px solid var(--line);display:grid;gap:10px;font-size:14px}.pt-c li{display:flex;gap:8px}.pt-c li .i{color:var(--ok);width:16px;height:16px;margin-top:2px}
.pt-fn{font-size:13px;margin-top:16px}
@media (max-width:820px){.pt-g{grid-template-columns:1fr}}
</style>
<script>
const P=[["Starter","For freelancers and side projects.",12,"Start free trial",["3 projects","5 GB storage","Email support"]],["Team","For teams shipping every week.",29,"Start free trial",["Unlimited projects","100 GB storage","Roles & permissions","Priority support"],1],["Scale","For companies with compliance needs.",79,"Talk to sales",["Everything in Team","SSO & SCIM","Audit log","99.9% SLA"]]];
const g=document.getElementById('g');let y=1;
g.innerHTML=P.map(([n,d,p,c,f,r],i)=>`<article class="pt-c${r?' rec':''}"><h3>${n}</h3><p>${d}</p><div class="pt-pr"><span>€</span><b class="tn" id="p${i}"></b><small>/ user / mo</small></div><div class="pt-sv" id="s${i}"></div><a class="b ${r?'ac':'sec'}" href="#">${c}</a><ul>${f.map(x=>`<li>@I(check)${x}</li>`).join('')}</ul></article>`).join('');
function digits(el,v){const s=String(v);if(el.children.length!==s.length)el.innerHTML=s.split('').map(()=>'<span>'+[...Array(10).keys()].join('<br>')+'</span>').join('');[...el.children].forEach((c,i)=>c.style.transform=`translateY(${-s[i]*48}px)`);el.setAttribute('aria-label','€'+v)}
function upd(){P.forEach(([,, p],i)=>{const v=y?Math.round(p*.8):p;digits(document.getElementById('p'+i),v);document.getElementById('s'+i).textContent=y?`€${(p-v)*12} saved per user a year`:''})}
document.querySelectorAll('.pt-sw button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pt-sw button').forEach(x=>x.setAttribute('aria-checked',x===b));y=+b.dataset.y;upd()});upd();
</script>

<!--Sparkline Table|Charts|A metrics table where each row has an inline sparkline with its last point marked, min/max dots, a trend arrow and colour that respects whether up is good or bad for that metric.|chart,sparkline,table,trend,metrics-->
<div class="k"><div class="st2 card"><table><thead><tr><th>Metric</th><th>Last 30 days</th><th>Now</th><th>Change</th></tr></thead><tbody id="b"></tbody></table></div></div>
<style>
.st2{width:min(720px,100%);padding:6px 0;overflow-x:auto}.st2 table{width:100%;border-collapse:collapse;font-size:14px}.st2 th{text-align:left;font-weight:550;font-size:12px;color:var(--mu);padding:10px 18px;border-bottom:1px solid var(--line)}.st2 td{padding:12px 18px;border-bottom:1px solid var(--line)}.st2 tr:last-child td{border:0}
.st2 svg{width:140px;height:32px;display:block;overflow:visible}.st2 .ln{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-linejoin:round}.st2 td:nth-child(3){font-weight:650;font-variant-numeric:tabular-nums}
.st2 .ch{display:inline-flex;gap:4px;align-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.st2 .good{color:var(--ok)}.st2 .bad{color:var(--err)}.st2 .ch .i{width:14px;height:14px}
</style>
<script>
const M=[["Active users",1,12400,.003,"",0],["Churn rate",0,2.1,-.002,"%",1],["Avg. response time",0,284,.002,"ms",0],["Conversion",1,3.8,.0025,"%",1],["Support tickets",0,118,-.004,"",0]];
document.getElementById('b').innerHTML=M.map(([n,upGood,v,tr,u,dec],k)=>{let s=k*7+3;const r=()=>(s=s*16807%2147483647)/2147483647,D=Array.from({length:30},(_,i)=>v*(1-tr*(29-i))*(1+(r()-.5)*.08));D[29]=v;const mn=Math.min(...D),mx=Math.max(...D),X=i=>i/29*140,Y=x=>2+(1-(x-mn)/(mx-mn||1))*28,ch=(D[29]-D[0])/D[0],good=(ch>0)===!!upGood,im=D.indexOf(mn),ix=D.indexOf(mx),f=x=>dec?x.toFixed(1):Math.round(x).toLocaleString('en');
return `<tr><td>${n}</td><td><svg viewBox="0 0 140 32" role="img" aria-label="${n} trend, from ${f(D[0])}${u} to ${f(v)}${u}"><path class="ln" d="M${D.map((x,i)=>`${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join('L')}"/><circle cx="${X(im)}" cy="${Y(mn)}" r="2" fill="var(--mu)"/><circle cx="${X(ix)}" cy="${Y(mx)}" r="2" fill="var(--mu)"/><circle cx="140" cy="${Y(v)}" r="3.5" fill="${good?'var(--ok)':'var(--err)'}"/></svg></td><td>${f(v)}${u}</td><td><span class="ch ${good?'good':'bad'}">${ch>0?'@I(up)':'@I(down)'}${(Math.abs(ch)*100).toFixed(1)}%</span></td></tr>`}).join('');
</script>

<!--Personal Budget Dashboard|Dashboards|A monthly budget view: a donut of spending by category you can click to filter, budget bars that turn amber/red as they fill, a transaction list with category re-assignment, and safe-to-spend per day.|dashboard,finance,budget,donut,transactions-->
<div class="k db">
<aside class="db-side" aria-label="Main"><div class="db-brand"><i>€</i>Pocket</div><a href="#" aria-current="page">@I(chart,18)Budget</a><a href="#">@I(card,18)Accounts</a><a href="#">@I(repeat,18)Subscriptions<em>9</em></a><a href="#">@I(flame,18)Goals</a><div class="db-user"><span class="av" style="--c:#be123c">LS</span><div><b>Lina S.</b><span>Personal</span></div></div></aside>
<main class="db-main"><header class="db-top"><button class="db-mb ibt" aria-label="Open navigation" aria-expanded="false">@I(list,20)</button><h1 id="mo"></h1><span class="sp"></span><span class="mu tn" id="sts"></span></header>
<div class="db-body"><div class="bu-top"><section class="db-card bu-dn"><svg viewBox="0 0 120 120" id="dn" aria-label="Spending by category" role="img"></svg><div class="bu-c"><b class="tn" id="tot"></b><span class="mu" id="cl">spent of €2,100</span></div></section>
<section class="db-card"><div class="db-ch"><h2>Budgets</h2><button class="b gh sm" id="clr" hidden>Show all</button></div><ul class="bu-b" id="bb"></ul></section></div>
<section class="db-card"><div class="db-ch"><h2>Transactions</h2></div><ul class="bu-tx" id="tx"></ul></section></div></main>
</div>
<style>
.bu-top{display:grid;grid-template-columns:280px 1fr;gap:16px}.bu-dn{display:grid;place-items:center;position:relative}.bu-dn svg{width:220px;height:220px;transform:rotate(-90deg)}.bu-dn circle{fill:none;stroke-width:16;cursor:pointer;transition:stroke-width .2s,opacity .2s}.bu-dn circle:hover,.bu-dn circle.on{stroke-width:20}.bu-dn.f circle:not(.on){opacity:.25}.bu-c{position:absolute;display:grid;text-align:center}.bu-c b{font-size:26px;letter-spacing:-.02em}.bu-c span{font-size:12px}
.bu-b{list-style:none;padding:0;margin:0;display:grid;gap:14px}.bu-b li{display:grid;gap:6px}.bu-b .h{display:flex;justify-content:space-between;font-size:13px}.bu-b .h b{display:flex;gap:8px;align-items:center}.bu-b .h i{width:10px;height:10px;border-radius:3px;background:var(--c)}.bu-b .tr{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden}.bu-b .tr i{display:block;height:100%;width:var(--w);background:var(--k);border-radius:4px;transition:width .5s var(--ease)}
.bu-tx{list-style:none;padding:0;margin:0}.bu-tx li{display:grid;grid-template-columns:36px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.bu-tx .ic{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);display:grid;place-items:center;font-weight:700}.bu-tx div{display:grid}.bu-tx small{color:var(--mu)}.bu-tx select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:12px;padding:0 6px}
@media (max-width:900px){.bu-top{grid-template-columns:1fr}.bu-tx li{grid-template-columns:36px 1fr auto}.bu-tx select{grid-column:2/-1;justify-self:start}}
</style>
<script>
const CAT=[["Rent",900,"#6366f1"],["Groceries",400,"#16a34a"],["Eating out",200,"#ea580c"],["Transport",120,"#0ea5e9"],["Fun",180,"#db2777"],["Other",300,"#64748b"]];
let T=[["Landlord",900,0,1],["Lidl",64.2,1,2],["Café Nero",8.4,2,3],["Monthly travel pass",49,3,1],["Spotify",11.99,4,4],["Rewe",88.1,1,6],["Ramen Bar",31.5,2,8],["Cinema",24,4,9],["Pharmacy",17.6,5,10],["Bolt ride",13.8,3,12],["Lidl",52.7,1,13],["Pizza night",42,2,14],["Bookshop",22,4,15]];let fc=null;
const d=new Date(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();document.getElementById('mo').textContent=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
function draw(){const sp=CAT.map((_,i)=>T.filter(t=>t[2]===i).reduce((a,t)=>a+t[1],0)),tot=sp.reduce((a,b)=>a+b,0);let off=0;const C=2*Math.PI*48;
document.getElementById('dn').innerHTML=sp.map((v,i)=>{const len=v/tot*C,s=`<circle class="${fc===i?'on':''}" r="48" cx="60" cy="60" stroke="${CAT[i][2]}" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}" data-i="${i}" tabindex="0" aria-label="${CAT[i][0]} €${v.toFixed(0)}"/>`;off+=len;return s}).join('');document.querySelector('.bu-dn').classList.toggle('f',fc!==null);
document.getElementById('tot').textContent='€'+(fc===null?tot:sp[fc]).toFixed(0);document.getElementById('cl').textContent=fc===null?'spent of €2,100':`${CAT[fc][0]} of €${CAT[fc][1]}`;
document.getElementById('bb').innerHTML=CAT.map(([n,b,c],i)=>{const p=sp[i]/b;return `<li><div class="h"><b><i style="--c:${c}"></i>${n}</b><span class="tn">€${sp[i].toFixed(0)} <span class="mu">/ €${b}</span></span></div><div class="tr"><i style="--w:${Math.min(100,p*100)}%;--k:${p>1?'var(--err)':p>.8?'var(--warn)':c}"></i></div></li>`}).join('');
document.getElementById('tx').innerHTML=T.map((t,j)=>[t,j]).filter(([t])=>fc===null||t[2]===fc).reverse().map(([[n,v,c,dd],j])=>`<li><span class="ic" style="--c:${CAT[c][2]}">${n[0]}</span><div><b>${n}</b><small>${dd} ${d.toLocaleDateString('en-GB',{month:'short'})}</small></div><select data-j="${j}" aria-label="Category for ${n}">${CAT.map((x,k)=>`<option value="${k}" ${k===c?'selected':''}>${x[0]}</option>`).join('')}</select><b class="tn">−€${v.toFixed(2)}</b></li>`).join('');
const left=2100-tot,dl=Math.max(1,dim-d.getDate()+1);document.getElementById('sts').textContent=`€${(left/dl).toFixed(0)}/day safe to spend`;document.getElementById('clr').hidden=fc===null}
document.getElementById('dn').onclick=e=>{const c=e.target.closest('circle');if(!c)return;fc=fc===+c.dataset.i?null:+c.dataset.i;draw()};document.getElementById('dn').onkeydown=e=>{if(e.key==='Enter')e.target.dispatchEvent(new Event('click',{bubbles:true}))};
document.getElementById('clr').onclick=()=>{fc=null;draw()};document.getElementById('tx').onchange=e=>{T[e.target.dataset.j][2]=+e.target.value;draw()};draw();
</script>

<!--Agent Steps Timeline|AI|An AI agent's work shown as a live timeline: thinking, tool calls (search, read file, run code) with collapsible inputs and outputs, a step needing approval with Approve/Deny, durations, and the final result.|ai,agent,tool calls,timeline,approval,transparency-->
<div class="k"><div class="ag"><div class="ag-h"><b>Task</b><p>Find last quarter's three biggest refunds and draft an apology email for each customer.</p></div><ol class="ag-l" id="l"></ol><div class="ag-r" id="r" hidden></div></div></div>
<style>
.ag{width:min(640px,100%);display:grid;gap:14px}.ag-h{padding:14px 16px;border-radius:12px;background:var(--sf2)}.ag-h b{font-size:12px;color:var(--mu)}.ag-h p{margin:4px 0 0;font-size:15px}
.ag-l{list-style:none;padding:0;margin:0;display:grid}.ag-l>li{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:14px;animation:agf .3s cubic-bezier(.23,1,.32,1)}@keyframes agf{from{opacity:0;transform:translateY(4px)}}.ag-l>li::after{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}.ag-l>li:last-child::after{display:none}
.ag-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sf2);color:var(--mu);z-index:1}.ag-ic .i{width:13px;height:13px}.ag-l .run .ag-ic{background:var(--ac-sf);color:var(--ac)}.ag-l .run .ag-ic .i{animation:agr 1.2s linear infinite}@keyframes agr{to{transform:rotate(1turn)}}.ag-l .ok .ag-ic{background:var(--ok-sf);color:var(--ok)}.ag-l .ask .ag-ic{background:var(--warn-sf);color:var(--warn)}.ag-l .no .ag-ic{background:var(--err-sf);color:var(--err)}
.ag-l details summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;font-size:14px;list-style:none;min-height:24px}.ag-l details summary::-webkit-details-marker{display:none}.ag-l summary code{font:12px 'Geist Mono',monospace;color:var(--mu)}.ag-l summary small{margin-left:auto;font:11px 'Geist Mono',monospace;color:var(--mu)}
.ag-l pre{margin:8px 0 0;background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.55 'Geist Mono',monospace;overflow-x:auto;white-space:pre-wrap}.ag-ap{display:flex;gap:8px;align-items:center;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--warn-sf);font-size:13px;flex-wrap:wrap}.ag-ap span{flex:1;min-width:160px}
.ag-r{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:grid;gap:8px;animation:agf .3s}.ag-r h3{margin:0;font-size:15px}.ag-r ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
</style>
<script>
const ST=[["think","Planning","I'll query refunds for Q3, sort by amount, then look up each customer.","",900],["tool","Query database","refunds.search","SELECT customer, amount, reason FROM refunds\nWHERE date BETWEEN '2026-07-01' AND '2026-09-30'\nORDER BY amount DESC LIMIT 3;\n\n→ 3 rows: Halden Logistics €1,240 · Mirabel Clinics €890 · Ostra Foods €610",1400],["tool","Read customer notes","crm.read","Halden: double-charged after plan change.\nMirabel: outage on 14 Aug during their clinic hours.\nOstra: shipped wrong SKU twice.",1100],["ask","Send 3 emails","email.send","To: ops@halden.example, it@mirabel.example, buying@ostra.example\nSubject: About your refund in Q3\n(3 personalised drafts attached)",0]];
const IC={think:'@I(bolt)',tool:'@I(settings)',ask:'@I(send)'},l=document.getElementById('l');let k=0;
function step(){if(k>=ST.length)return;const [t,n,code,out,ms]=ST[k],li=document.createElement('li');li.className=t==='ask'?'ask':'run';li.innerHTML=`<span class="ag-ic">${t==='ask'?IC.ask:'@I(refresh)'}</span><details ${t==='ask'?'open':''}><summary><b>${n}</b>${code?`<code>${code}</code>`:''}<small></small></summary><pre>${out||ST[k][2]}</pre>${t==='ask'?'<div class="ag-ap"><span>The agent wants to send emails on your behalf.</span><button class="b sm" style="background:var(--fg);color:var(--bg)" data-a="y">Approve</button><button class="b gh sm" data-a="n">Deny</button></div>':''}</details>`;l.append(li);
if(t==='ask'){li.querySelector('small').textContent='waiting for you';return}const t0=performance.now();setTimeout(()=>{li.className='ok';li.querySelector('.ag-ic').innerHTML=IC[t];li.querySelector('small').textContent=((performance.now()-t0)/1000).toFixed(1)+' s';k++;step()},ms)}
l.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const li=b.closest('li'),ok=b.dataset.a==='y';li.className=ok?'ok':'no';li.querySelector('.ag-ic').innerHTML=ok?'@I(check)':'@I(x)';li.querySelector('small').textContent=ok?'approved':'denied';li.querySelector('.ag-ap').remove();const r=document.getElementById('r');r.hidden=false;r.innerHTML=ok?'<h3>Done</h3><ul><li>Found the 3 largest Q3 refunds (€2,740 total).</li><li>Sent 3 apology emails, each naming what went wrong.</li><li>Logged the emails on each customer record.</li></ul>':'<h3>Stopped before sending</h3><ul><li>The 3 drafts are saved in Outbox for you to edit.</li></ul>'};step();
</script>

<!--Agenda List|Scheduling|A mobile-first agenda: days as sticky headers, events with time, duration bar and location, a live “now” marker between past and upcoming events, past events dimmed, and a jump-to-today button.|scheduling,agenda,list,mobile,sticky headers-->
<div class="k"><div class="ag2"><div class="ag2-h"><h2>Agenda</h2><button class="b sec sm" id="td">Today</button></div><div class="ag2-l" id="l"></div></div></div>
<style>
.ag2{width:min(420px,100%);height:min(640px,calc(100dvh - 96px));display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden}.ag2-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.ag2-h h2{margin:0;font-size:18px}
.ag2-l{flex:1;overflow:auto;overscroll-behavior:contain}.ag2-l h3{position:sticky;top:0;z-index:2;margin:0;padding:8px 16px;font-size:12px;font-weight:650;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.ag2-l h3 span{color:var(--mu);font-weight:500}.ag2-l h3.t{color:var(--err)}
.ag2-e{display:grid;grid-template-columns:52px 4px 1fr;gap:12px;padding:12px 16px;align-items:stretch}.ag2-e time{font:600 13px 'Geist Mono',monospace;display:grid;align-content:start}.ag2-e time small{font-weight:400;color:var(--mu);font-size:11px}.ag2-e i{border-radius:2px;background:var(--c)}.ag2-e div{display:grid;gap:2px;font-size:14px}.ag2-e div small{color:var(--mu);font-size:12px}.ag2-e.past{opacity:.45}
.ag2-now{display:flex;align-items:center;gap:8px;padding:0 16px;font:600 11px 'Geist Mono',monospace;color:var(--err)}.ag2-now::after{content:"";flex:1;height:2px;background:var(--err)}.ag2-em{padding:10px 16px 14px 80px;font-size:13px;color:var(--mu)}
</style>
<script>
const C=['#2563eb','#0f766e','#b45309','#be123c','#7c3aed'],T=[["Standup","Video call",.25],["Deep work","No meetings",2],["Lunch with Sam","Fennel",1],["Design crit","Room Fjord",1],["Gym","Forge/27",1],["Call with Halden","Video call",.5],["Dentist","Keizersgracht 210",.75]],now=new Date(),l=document.getElementById('l');let h='';
for(let k=-1;k<5;k++){const d=new Date(now);d.setDate(d.getDate()+k);d.setHours(0,0,0,0);const td=k===0,E=[];const n=k===2?0:3+((k+5)%3);for(let j=0;j<n;j++){const [t,loc,dur]=T[(j*3+k+7)%T.length],s=8.5+j*2.5+((k+7)%2);E.push({t,loc,dur,s,c:C[(j+k+5)%5]})}
h+=`<h3 class="${td?'t':''}" ${td?'id="today"':''}>${td?'Today':k===1?'Tomorrow':k===-1?'Yesterday':d.toLocaleDateString('en-GB',{weekday:'long'})}<span>${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></h3>`;if(!E.length)h+='<p class="ag2-em">Nothing planned.</p>';let drawn=false;const nh=now.getHours()+now.getMinutes()/60;
E.forEach(e=>{const past=k<0||(td&&e.s+e.dur<=nh);if(td&&!drawn&&e.s>nh){h+=`<div class="ag2-now" id="nw">${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>`;drawn=true}const f=x=>`${String(Math.floor(x)).padStart(2,'0')}:${x%1?String(Math.round(x%1*60)).padStart(2,'0'):'00'}`;h+=`<div class="ag2-e${past?' past':''}" style="--c:${e.c}"><time>${f(e.s)}<small>${e.dur<1?e.dur*60+' min':e.dur+' h'}</small></time><i></i><div><b>${e.t}</b><small>${e.loc}</small></div></div>`});if(td&&!drawn)h+=`<div class="ag2-now" id="nw">${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>`}
l.innerHTML=h;const go=()=>{const t=document.getElementById('today');l.scrollTop=t.offsetTop};document.getElementById('td').onclick=go;go();
</script>

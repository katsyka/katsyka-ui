<!--Waterfall Chart|Charts|A profit bridge from revenue to net income: floating bars for each addition and deduction with connector lines, totals as solid bars, signed value labels, and positive/negative in two distinct hues.|chart,waterfall,bridge,finance,svg-->
<div class="k"><figure class="wf card"><figcaption><b>From revenue to profit</b><span class="mu">FY 2026, € thousands</span></figcaption><svg id="s" role="img" aria-label="Waterfall chart: revenue 2,400, minus costs, net profit 412"></svg></figure></div>
<style>
.wf{width:min(780px,100%);padding:20px;margin:0}.wf figcaption{display:grid;margin-bottom:10px}.wf svg{width:100%;height:300px;display:block}.wf .g{stroke:var(--line)}.wf .ax{fill:var(--mu);font-size:11px}.wf .cn{stroke:var(--ctl);stroke-dasharray:2 3}.wf .lb{font-size:11px;font-weight:650;fill:var(--fg)}.wf .tot{fill:var(--fg)}.wf .pos{fill:#0f766e}.wf .neg{fill:#c2410c}
</style>
<script>
const D=[["Revenue",2400,'t'],["Cost of goods",-920],["Salaries",-610],["Marketing",-240],["Other income",64],["Rent",-140],["Taxes",-142],["Net profit",0,'t']],s=document.getElementById('s');
function draw(){const W=s.clientWidth,H=300,L=44,B=40,T=16,mx=2600,Y=v=>T+(1-v/mx)*(H-T-B),bw=(W-L)/D.length;s.setAttribute('viewBox',`0 0 ${W} ${H}`);
let h=[0,1000,2000].map(v=>`<line class="g" x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join(''),run=0,prev=null;
D.forEach(([n,v,t],i)=>{const x=L+i*bw+bw*.18,w=bw*.64;let a,b,cls,lab;if(t){if(i)v=run;a=0;b=v;run=v;cls='tot';lab=v}else{a=run;b=run+v;run=b;cls=v>0?'pos':'neg';lab=(v>0?'+':'')+v}
const y0=Y(Math.max(a,b)),hh=Math.abs(Y(a)-Y(b));h+=`<rect class="${cls}" x="${x}" y="${y0}" width="${w}" height="${Math.max(1,hh)}" rx="3"/><text class="lb" x="${x+w/2}" y="${y0-6}" text-anchor="middle">${lab}</text><text class="ax" x="${x+w/2}" y="${H-B+16}" text-anchor="middle">${n.length>11&&W<600?n.split(' ')[0]:n}</text>`;if(prev!==null)h+=`<line class="cn" x1="${prev}" x2="${x}" y1="${Y(t&&i?run:a)}" y2="${Y(t&&i?run:a)}"/>`;prev=x+w});s.innerHTML=h}draw();addEventListener('resize',draw);
</script>

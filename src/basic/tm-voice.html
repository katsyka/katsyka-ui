<!--Voice Note Testimonials|Testimonials|Customer voice notes as playable cards: a waveform that fills as it “plays”, scrubbing by click, one-at-a-time playback, speed toggle, and the transcript revealed in sync for accessibility.|testimonials,audio,voice,waveform,transcript-->
<div class="k"><section class="vn"><h2>In their own voice</h2><div class="vn-l" id="l"></div></section></div>
<style>
.vn{width:min(640px,100%);display:grid;gap:14px}.vn h2{margin:0 0 4px;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.vn-c{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:16px;display:grid;gap:12px}.vn-t{display:flex;gap:12px;align-items:center}.vn-t img{width:40px;height:40px;border-radius:50%;object-fit:cover}.vn-t div{display:grid;flex:1;font-size:14px}.vn-t small{color:var(--mu);font-size:12px}
.vn-p{display:flex;gap:12px;align-items:center}.vn-pp{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none;transition:transform .12s}.vn-pp:active{transform:scale(.95)}
.vn-wv{flex:1;height:40px;display:flex;align-items:center;gap:2px;cursor:pointer}.vn-wv i{flex:1;border-radius:2px;height:var(--h);background:var(--ctl);opacity:.45}.vn-wv i.on{background:var(--ac);opacity:1}
.vn-tm{font:12px 'Geist Mono',monospace;color:var(--mu);width:36px;text-align:right}.vn-sp{height:28px;padding:0 8px;border:1px solid var(--line);border-radius:999px;font:600 11px 'Geist Mono',monospace}
.vn-tx{margin:0;font-size:14px;line-height:1.6;color:var(--mu)}.vn-tx span{transition:color .2s}.vn-tx span.on{color:var(--fg)}
</style>
<script>
const V=[["Rosa Mendes","Ceramics studio, Porto","media/pics/c/1012.jpg","I was dreading moving the class bookings. It took me one evening. My students didn't even notice, which is the best compliment I can give.",21],["Femi Adeyemi","Cycling club organiser","media/pics/c/1083.jpg","Before, I spent Sunday nights texting forty people about Monday's ride. Now they just check the app and I get my Sundays back.",17],["Hanne Lie","Freelance translator","media/pics/c/1014.jpg","The invoices look professional and they go out on time. Clients pay faster. That's really all I needed.",14]];
const l=document.getElementById('l');let cur=-1,t=null,pos=[0,0,0],sp=[1,1,1];
l.innerHTML=V.map(([n,r,img,tx,d],i)=>{let s=i*13+5;const rnd=()=>(s=s*16807%2147483647)/2147483647;return `<article class="vn-c"><div class="vn-t"><img src="${img}" alt=""><div><b>${n}</b><small>${r}</small></div></div><div class="vn-p"><button class="vn-pp" data-p="${i}" aria-label="Play ${n}'s voice note">@I(play,18)</button><div class="vn-wv" data-w="${i}" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="${d}" aria-valuenow="0" tabindex="0">${Array.from({length:48},(_,k)=>`<i style="--h:${Math.round(20+Math.abs(Math.sin(k/3+i))*60+rnd()*20)}%"></i>`).join('')}</div><span class="vn-tm tn" id="tm${i}">0:${String(d).padStart(2,'0')}</span><button class="vn-sp" data-s="${i}" aria-label="Playback speed">1×</button></div><p class="vn-tx" id="tx${i}">${tx.split(' ').map(w=>`<span>${w}</span>`).join(' ')}</p></article>`}).join('');
function ui(i){const d=V[i][4],p=pos[i]/d,W=l.querySelectorAll(`[data-w="${i}"] i`),S=l.querySelectorAll(`#tx${i} span`);W.forEach((w,k)=>w.classList.toggle('on',k/W.length<p));S.forEach((s,k)=>s.classList.toggle('on',k/S.length<p));l.querySelector(`[data-w="${i}"]`).setAttribute('aria-valuenow',Math.round(pos[i]));const r=Math.ceil(d-pos[i]);document.getElementById('tm'+i).textContent='0:'+String(r).padStart(2,'0')}
function stop(){if(cur<0)return;clearInterval(t);const b=l.querySelector(`[data-p="${cur}"]`);b.innerHTML='@I(play,18)';b.setAttribute('aria-label','Play');cur=-1}
function play(i){stop();cur=i;const b=l.querySelector(`[data-p="${i}"]`);b.innerHTML='@I(pause,18)';b.setAttribute('aria-label','Pause');if(pos[i]>=V[i][4])pos[i]=0;t=setInterval(()=>{pos[i]=Math.min(V[i][4],pos[i]+.1*sp[i]);ui(i);if(pos[i]>=V[i][4])stop()},100)}
l.onclick=e=>{const p=e.target.closest('[data-p]');if(p){const i=+p.dataset.p;cur===i?stop():play(i);return}const s=e.target.closest('[data-s]');if(s){const i=+s.dataset.s;sp[i]=sp[i]===1?1.5:sp[i]===1.5?2:1;s.textContent=sp[i]+'×';return}const w=e.target.closest('[data-w]');if(w){const i=+w.dataset.w,r=w.getBoundingClientRect();pos[i]=(e.clientX-r.left)/r.width*V[i][4];ui(i)}};
l.onkeydown=e=>{const w=e.target.closest('[data-w]');if(!w)return;const i=+w.dataset.w;if(e.key==='ArrowRight')pos[i]=Math.min(V[i][4],pos[i]+2);else if(e.key==='ArrowLeft')pos[i]=Math.max(0,pos[i]-2);else return;e.preventDefault();ui(i)};
</script>

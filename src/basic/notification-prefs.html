<!--Notification Preferences|Forms|A channels × events matrix: rows of events, columns for Email / Push / SMS, a column toggle that sets all, row descriptions, quiet hours with time inputs, and a sticky save bar that appears only when something changed.|settings,notifications,matrix,checkbox,preferences-->
<div class="k"><section class="card np"><h2>Notifications</h2><p class="mu">Choose how you hear about activity in Field Prints.</p>
  <table class="np-t"><thead><tr><th scope="col"><span class="vh">Event</span></th><th scope="col"><label><input type="checkbox" data-col="0"> Email</label></th><th scope="col"><label><input type="checkbox" data-col="1"> Push</label></th><th scope="col"><label><input type="checkbox" data-col="2"> SMS</label></th></tr></thead><tbody id="tb"></tbody></table>
  <div class="np-q"><label class="np-sw"><input type="checkbox" id="qh" checked><span><b>Quiet hours</b><small class="mu">Hold push and SMS overnight</small></span></label><div class="np-tm" id="tm"><label>From <input class="in tn" type="time" value="22:00"></label><label>to <input class="in tn" type="time" value="07:30"></label></div></div>
  <div class="np-bar" id="bar" hidden><span>Unsaved changes</span><button class="b gh sm" id="rs">Reset</button><button class="b ac sm" id="sv">Save</button></div></section></div>
<style>
.np{width:min(620px,100%);padding:24px}.np h2{margin:0;font-size:17px;font-weight:650}.np>p{margin:4px 0 16px}
.np-t{width:100%;border-collapse:collapse}
.np-t th{font-size:13px;font-weight:550;padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.np-t th:first-child{text-align:left}
.np-t th label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.np-t td{padding:12px 6px;border-bottom:1px solid var(--line);text-align:center}.np-t td:first-child{text-align:left}
.np-t td b{display:block;font-weight:550}.np-t td small{color:var(--mu);font-size:12px}
.np input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--ac);cursor:pointer}
.np-q{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:20px}
.np-sw{display:flex;gap:10px;align-items:center;cursor:pointer}.np-sw b{display:block;font-weight:550}.np-sw small{font-size:12px}
.np-tm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu)}.np-tm label{display:flex;gap:6px;align-items:center}.np-tm input{width:auto;height:34px}
.np-tm.off{opacity:.45;pointer-events:none}
.np-bar{position:sticky;bottom:12px;display:flex;align-items:center;gap:8px;margin-top:20px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--fg);color:var(--bg);animation:nb .25s var(--ease)}
.np-bar span{flex:1;font-weight:550}.np-bar .gh{color:var(--bg)}.np-bar .gh:hover{background:#ffffff1f}
@keyframes nb{from{opacity:0;transform:translateY(8px)}}
</style>
<script>
const E=[["Orders","Placed, shipped and delivered",[1,1,1]],["Comments","Replies and mentions",[1,1,0]],["Team","Invites and role changes",[1,0,0]],["Billing","Receipts and failed payments",[1,0,1]],["Product news","New features, once a month",[0,0,0]]];
tb.innerHTML=E.map(([n,d,v],r)=>`<tr><td><b>${n}</b><small>${d}</small></td>${v.map((x,c)=>`<td><input type="checkbox" data-r="${r}" data-c="${c}" ${x?"checked":""} aria-label="${n} by ${["email","push","SMS"][c]}"></td>`).join("")}</tr>`).join("");
const snap=()=>[...document.querySelectorAll(".np input")].map(i=>i.type==="checkbox"?i.checked:i.value).join();let base;
const cols=()=>[0,1,2].forEach(c=>{const L=[...tb.querySelectorAll(`[data-c="${c}"]`)],n=L.filter(i=>i.checked).length,h=document.querySelector(`[data-col="${c}"]`);h.checked=n===L.length;h.indeterminate=n>0&&n<L.length});
const dirty=()=>{cols();bar.hidden=snap()===base};
document.querySelectorAll("[data-col]").forEach(h=>h.onchange=()=>{tb.querySelectorAll(`[data-c="${h.dataset.col}"]`).forEach(i=>i.checked=h.checked);dirty()});
document.querySelector(".np").addEventListener("input",e=>{if(!e.target.dataset.col)dirty()});
qh.addEventListener("change",()=>tm.classList.toggle("off",!qh.checked));
cols();base=snap();
let saved=[...document.querySelectorAll(".np input")].map(i=>i.type==="checkbox"?i.checked:i.value);
rs.onclick=()=>{document.querySelectorAll(".np input").forEach((i,k)=>i.type==="checkbox"?i.checked=saved[k]:i.value=saved[k]);tm.classList.toggle("off",!qh.checked);dirty()};
sv.onclick=()=>{sv.textContent="Saved ✓";setTimeout(()=>{saved=[...document.querySelectorAll(".np input")].map(i=>i.type==="checkbox"?i.checked:i.value);base=snap();bar.hidden=true;sv.textContent="Save"},700)};
</script>

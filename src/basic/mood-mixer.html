<!--Paint Mixer|Custom|A playful paint mixer: tap paint pots to drop colour into a bowl, the mix blends subtractively (more like real paint than RGB averaging), shows the resulting hex and a name, with undo and empty.|colour,mixer,paint,playful,colourful-->
<div class="k mx"><div class="mx-w"><div class="mx-bowl" aria-hidden="true"><div class="mx-p" id="p"></div></div><div class="mx-info"><b id="hx" aria-live="polite">Empty bowl</b><span class="mu" id="ct">Add some paint</span></div>
<div class="mx-pots" id="pots" role="group" aria-label="Paint pots"></div><div class="mx-ctl"><button class="b" id="un" disabled>Undo</button><button class="b" id="em" disabled>Empty</button></div></div></div>
<style>
.mx-w{display:grid;justify-items:center;gap:20px;width:min(440px,100%)}
.mx-bowl{width:220px;height:130px;border-radius:0 0 110px 110px;border:6px solid var(--fg);border-top:0;position:relative;overflow:hidden}.mx-p{position:absolute;inset:auto 0 0;height:0;background:#ddd;transition:height .4s var(--ease),background .4s var(--ease);border-radius:0 0 104px 104px}
.mx-p::before{content:"";position:absolute;left:10%;right:10%;top:8px;height:10px;border-radius:50%;background:rgb(255 255 255/.3)}
.mx-info{display:grid;justify-items:center;gap:2px}.mx-info b{font:600 20px 'Geist Mono',monospace}
.mx-pots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}.mx-pots button{border:0;border-radius:16px 16px 22px 22px;height:64px;cursor:pointer;font:600 12px Geist,sans-serif;display:grid;place-items:end center;padding-bottom:8px;transition:transform .12s var(--ease)}.mx-pots button:active{transform:scale(.94)}
.mx-ctl{display:flex;gap:8px}
.mx-drop{position:fixed;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);pointer-events:none;animation:mxd .4s ease-in forwards}@keyframes mxd{to{translate:var(--dx) var(--dy);opacity:.6}}
</style>
<script>
const PA=[['Cyan','#00a6d6',[1,0,0,0]],['Magenta','#e6007e',[0,1,0,0]],['Yellow','#ffe600',[0,0,1,0]],['White','#ffffff',[0,0,0,0]],['Red','#e63022',[0,.9,.9,0]],['Blue','#1e3fd8',[.9,.7,0,0]],['Green','#14a35a',[.85,0,.85,0]],['Black','#1a1a1a',[0,0,0,1]]];
const pots=document.getElementById('pots'),p=document.getElementById('p'),hx=document.getElementById('hx'),ct=document.getElementById('ct'),un=document.getElementById('un'),em=document.getElementById('em');let mix=[];
PA.forEach((q,i)=>{const b=document.createElement('button');b.style.background=q[1];b.style.color=['Yellow','White'].includes(q[0])?'#222':'#fff';if(q[0]==='White')b.style.boxShadow='inset 0 0 0 1px var(--line)';b.textContent=q[0];b.onclick=e=>{mix.push(i);drop(b,q[1]);draw()};pots.append(b)});
function drop(b,c){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=b.getBoundingClientRect(),t=p.parentElement.getBoundingClientRect(),d=document.createElement('i');d.className='mx-drop';d.style.background=c;d.style.left=r.left+r.width/2-9+'px';d.style.top=r.top+'px';d.style.setProperty('--dx',(t.left+t.width/2-r.left-r.width/2)+'px');d.style.setProperty('--dy',(t.top+t.height/2-r.top)+'px');document.body.append(d);setTimeout(()=>d.remove(),400)}
function draw(){un.disabled=em.disabled=!mix.length;if(!mix.length){p.style.height='0';hx.textContent='Empty bowl';ct.textContent='Add some paint';return}
let c=0,m=0,y=0,k=0;mix.forEach(i=>{const v=PA[i][2];c+=v[0];m+=v[1];y+=v[2];k+=v[3]});const n=mix.length;c/=n;m/=n;y/=n;k/=n;
const rgb=[1-c,1-m,1-y].map(v=>Math.round(255*v*(1-k)*(1-.12*Math.min(1,(c+m+y)))));const h='#'+rgb.map(v=>Math.max(0,v).toString(16).padStart(2,'0')).join('').toUpperCase();
p.style.background=h;p.style.height=Math.min(100,20+n*10)+'%';hx.textContent=h;const cnt={};mix.forEach(i=>cnt[PA[i][0]]=(cnt[PA[i][0]]||0)+1);ct.textContent=Object.entries(cnt).map(([a,b])=>b+' '+a.toLowerCase()).join(' + ')}
un.onclick=()=>{mix.pop();draw()};em.onclick=()=>{mix=[];draw()};
</script>

<!--Gift Card Builder|Commerce|A digital gift card configurator: amount presets plus custom with min/max, a design picker, recipient and message with live preview of the card, delivery date scheduling, and a total.|ecommerce,gift card,preview,form,configurator-->
<div class="k"><div class="gc"><div class="gc-pv" id="pv" aria-hidden="true"><div class="gc-c" id="cc"><span class="gc-b">Mossware</span><b class="tn" id="ca">€50</b><p id="cm">A little something for your kitchen.</p><span class="gc-to" id="ct">For you</span></div></div>
<form class="gc-f" id="f" novalidate><h1>Send a gift card</h1><fieldset><legend class="lbl">Amount</legend><div class="gc-am" id="am" role="radiogroup"></div><label class="gc-cu"><span class="vh">Custom amount</span><span>€</span><input class="in tn" id="cu" inputmode="numeric" placeholder="Other (10–500)"></label><small class="gc-er" id="ae"></small></fieldset>
<fieldset><legend class="lbl">Design</legend><div class="gc-ds" id="ds" role="radiogroup"></div></fieldset>
<label><span class="lbl">Recipient's name</span><input class="in" id="rn" autocomplete="off" maxlength="30"></label><label><span class="lbl">Their email</span><input class="in" id="re" type="email" autocomplete="off"><small class="gc-er" id="ee"></small></label><label><span class="lbl">Message <span class="mu tn" id="mc"></span></span><textarea class="in" id="ms" rows="2" maxlength="120">A little something for your kitchen.</textarea></label><label><span class="lbl">Send on</span><input class="in" id="dt" type="date"></label><button class="b ac lg" id="go"></button></form></div></div>
<style>
.gc{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}.gc-pv{position:sticky;top:16px;perspective:900px}.gc-c{aspect-ratio:1.586;border-radius:18px;padding:22px;display:grid;grid-template-rows:auto 1fr auto auto;color:#fff;background:var(--g);box-shadow:0 1px 2px #0002,0 12px 28px -14px #0006;transition:background .4s;transform:rotateX(6deg) rotateY(-8deg)}
.gc-b{font-weight:700;font-size:14px;opacity:.9}.gc-c b{font-size:44px;letter-spacing:-.03em;align-self:center}.gc-c p{margin:0;font-size:14px;line-height:1.4;opacity:.9;overflow-wrap:anywhere}.gc-to{font-size:12px;opacity:.75;margin-top:8px}
.gc-f{display:grid;gap:16px}.gc-f h1{margin:0;font-size:26px;letter-spacing:-.02em}.gc-f fieldset{border:0;margin:0;padding:0}.gc-f .in{height:44px;font-size:16px}.gc-f textarea.in{height:auto;padding:10px 12px;resize:vertical}.gc-f .lbl{display:flex;justify-content:space-between}
.gc-am{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.gc-am button{height:44px;border:1px solid var(--ctl);border-radius:10px;font-weight:600}.gc-am [aria-checked=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gc-cu{display:flex;align-items:center;gap:6px;margin-top:8px;border:1px solid var(--ctl);border-radius:10px;padding-left:12px}.gc-cu .in{border:0}.gc-cu .in:focus{box-shadow:none}.gc-cu:focus-within{border-color:var(--ac)}.gc-er{color:var(--err);font-size:12px;display:block;margin-top:4px}.gc-er:empty{display:none}
.gc-ds{display:flex;gap:10px}.gc-ds button{width:56px;height:36px;border-radius:8px;background:var(--g);outline-offset:3px}.gc-ds [aria-checked=true]{outline:2px solid var(--fg)}
@media (max-width:760px){.gc{grid-template-columns:1fr}.gc-pv{position:static;max-width:360px}}
</style>
<script>
const G=[['Moss','linear-gradient(135deg,#3f6212,#1a2e05)'],['Clay','linear-gradient(135deg,#c2410c,#7c2d12)'],['Ink','linear-gradient(135deg,#1e3a8a,#0f172a)'],['Sand','linear-gradient(135deg,#a8865a,#5b4630)']],A=[25,50,100,150],$=i=>document.getElementById(i);let amt=50,g=0;
$('am').innerHTML=A.map(a=>`<button type="button" role="radio" aria-checked="${a===50}" data-a="${a}">€${a}</button>`).join('');$('ds').innerHTML=G.map(([n,c],i)=>`<button type="button" role="radio" aria-checked="${!i}" aria-label="${n}" style="--g:${c}" data-i="${i}"></button>`).join('');
function up(){$('cc').style.setProperty('--g',G[g][1]);$('ca').textContent='€'+(amt||0);$('cm').textContent=$('ms').value||' ';$('ct').textContent=$('rn').value?'For '+$('rn').value:'For you';$('mc').textContent=$('ms').value.length+'/120';const d=$('dt').value&&$('dt').value!==new Date().toISOString().slice(0,10);$('go').textContent=amt?`${d?'Schedule':'Send'} €${amt} gift card`:'Choose an amount'}
$('am').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('am').querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));amt=+b.dataset.a;$('cu').value='';$('ae').textContent='';up()};
$('cu').oninput=()=>{const v=+$('cu').value.replace(/\D/g,'');$('cu').value=v||'';$('am').querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',false));amt=v;$('ae').textContent=v&&(v<10||v>500)?'Choose between €10 and €500.':'';if(v<10||v>500)amt=0;up()};
$('ds').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('ds').querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));g=+b.dataset.i;up()};['rn','ms','dt'].forEach(i=>$(i).addEventListener('input',up));
$('dt').valueAsDate=new Date();$('dt').min=new Date().toISOString().slice(0,10);
$('f').onsubmit=e=>{e.preventDefault();const ok=/^\S+@\S+\.\S+$/.test($('re').value);$('re').setAttribute('aria-invalid',!ok);$('ee').textContent=ok?'':'Where should we send it?';if(!ok)return $('re').focus();if(!amt)return $('cu').focus();const b=$('go');b.disabled=true;b.textContent='Adding to bag…';setTimeout(()=>{b.disabled=false;b.textContent='Added to bag ✓'},700)};up();
</script>

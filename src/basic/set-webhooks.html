<!--Webhooks Settings|Settings|Webhook endpoints: add an endpoint with event checkboxes, a signing secret with reveal and rotate, a recent deliveries log with status codes and response times, and redeliver.|settings,webhooks,developer,api,events,logs-->
<div class="k wh"><div class="wh-w"><div class="wh-hd"><h1>Webhooks</h1><button class="b ac sm" id="ad">@I(plus,14)Add endpoint</button></div>
<section class="wh-ep"><div class="wh-t"><code>https://api.northwind.example/hooks/quill</code><span class="pill ok">Enabled</span></div><p class="mu">order.created, order.paid, refund.created</p>
<div class="wh-sec"><span class="lbl">Signing secret</span><div class="wh-sr"><code id="sk">whsec_••••••••••••••••••••••</code><button class="b gh sm" id="rv" aria-pressed="false">@I(eye,14)Reveal</button><button class="b gh sm" id="rt">@I(refresh,14)Rotate</button></div><small class="mu" id="rm">Use it to verify the Quill-Signature header.</small></div>
<h2>Recent deliveries</h2><ul class="wh-l" id="l"></ul></section>
<form class="wh-f" id="f" hidden novalidate><h2>New endpoint</h2><label class="lbl" for="u">Endpoint URL</label><input class="in" id="u" type="url" placeholder="https://" aria-describedby="ue"><small class="wh-e" id="ue"></small><fieldset><legend class="lbl">Events</legend><div class="wh-ev"><label><input type="checkbox" checked>order.created</label><label><input type="checkbox">order.paid</label><label><input type="checkbox">order.refunded</label><label><input type="checkbox">customer.created</label></div></fieldset><div class="wh-ac"><button type="button" class="b gh" id="fc">Cancel</button><button class="b ac">Add endpoint</button></div></form></div></div>
<style>
.k.wh{align-items:start}.wh-w{width:min(720px,100%);display:grid;gap:16px}.wh-hd{display:flex;justify-content:space-between;align-items:center}.wh-hd h1{margin:0;font-size:24px;letter-spacing:-.02em}
.wh-ep,.wh-f{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:18px;display:grid;gap:10px}.wh-t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.wh-t code{font:600 14px 'Geist Mono',monospace;word-break:break-all}.wh-ep>p{margin:0;font-size:13px;font-family:'Geist Mono',monospace}.wh-ep h2,.wh-f h2{margin:8px 0 0;font-size:14px}
.wh-sec{padding:12px;border-radius:10px;background:var(--sf);display:grid;gap:6px}.wh-sec .lbl{margin:0}.wh-sr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.wh-sr code{font:13px 'Geist Mono',monospace;flex:1;min-width:200px;word-break:break-all}.wh-sec small{font-size:12px}
.wh-l{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.wh-l li{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}.wh-l li:first-child{border:0}.wh-l code{font:12px 'Geist Mono',monospace}.wh-l .c{font:600 12px 'Geist Mono',monospace;text-align:center;border-radius:6px;padding:2px 0}.wh-l .ok{background:var(--ok-sf);color:var(--ok)}.wh-l .no{background:var(--err-sf);color:var(--err)}.wh-l .ms{color:var(--mu);font-variant-numeric:tabular-nums}.wh-l .b{height:28px}
.wh-f .in{height:44px;font:14px 'Geist Mono',monospace}.wh-e{color:var(--err);font-size:13px}.wh-e:empty{display:none}.wh-f fieldset{border:0;margin:0;padding:0}.wh-ev{display:grid;grid-template-columns:1fr 1fr;gap:6px}.wh-ev label{display:flex;gap:8px;align-items:center;font:13px 'Geist Mono',monospace;min-height:32px}.wh-ev input{width:16px;height:16px;accent-color:var(--ac)}.wh-ac{display:flex;gap:8px;justify-content:flex-end}
</style>
<script>
const $=i=>document.getElementById(i);let SEC='whsec_8KdL2pQx7Vb3Nz5Rt1Ym4Hc9',shown=false;
const DV=[["order.paid",200,142],["order.created",200,98],["refund.created",500,3021],["order.created",200,110],["order.paid",410,88]];
const ago=i=>i?`${i*7} min ago`:'just now';
function draw(){$('l').innerHTML=DV.map(([e,c,ms],i)=>`<li><span class="c ${c<300?'ok':'no'}">${c}</span><code>${e}</code><span class="ms">${ms} ms · ${ago(i)}</span>${c>=300?`<button class="b sec sm" data-i="${i}">Redeliver</button>`:'<span></span>'}</li>`).join('')}draw();
$('l').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;b.disabled=true;b.textContent='Sending…';setTimeout(()=>{DV.unshift([DV[+b.dataset.i][0],200,121]);draw()},700)};
$('rv').onclick=e=>{shown=!shown;$('sk').textContent=shown?SEC:'whsec_••••••••••••••••••••••';e.currentTarget.setAttribute('aria-pressed',shown);e.currentTarget.lastChild.textContent=shown?'Hide':'Reveal'};
$('rt').onclick=e=>{const b=e.currentTarget;if(b.dataset.c!=='1'){b.dataset.c='1';b.lastChild.textContent='Confirm rotate';$('rm').textContent='The old secret keeps working for 24 hours so you can deploy the new one.';return}b.dataset.c='';SEC='whsec_'+Array.from({length:22},()=>'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*56)]).join('');shown=true;$('sk').textContent=SEC;b.lastChild.textContent='Rotate';$('rm').textContent='Rotated. Old secret expires in 24 hours.'};
$('ad').onclick=()=>{$('f').hidden=false;$('u').focus()};$('fc').onclick=()=>$('f').hidden=true;
$('f').onsubmit=e=>{e.preventDefault();let ok=true;try{const u=new URL($('u').value);ok=u.protocol==='https:'}catch{ok=false}$('u').setAttribute('aria-invalid',!ok);$('ue').textContent=ok?'':'Use a full https:// URL.';if(!ok)return $('u').focus();$('f').innerHTML='<p style="margin:0">Endpoint added. We sent a <code>ping</code> event to it.</p>'};
</script>

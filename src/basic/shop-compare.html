<!--Product Compare|Commerce|Compare up to three products side by side: sticky product headers with remove, rows grouped by spec, “highlight differences” toggle that hides identical rows, best-value marks, and add-from-list.|ecommerce,compare,specs,table,products-->
<div class="k"><div class="pcm"><div class="pcm-h"><h1>Compare headphones</h1><label class="pcm-d"><input type="checkbox" id="df"> Only show differences</label></div><div class="pcm-w"><table id="t"></table></div></div></div>
<style>
.pcm{width:min(920px,100%);display:grid;gap:14px}.pcm-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pcm-h h1{margin:0;font-size:24px;letter-spacing:-.02em}.pcm-d{display:flex;gap:8px;align-items:center;font-size:14px}.pcm-d input{width:18px;height:18px;accent-color:var(--fg)}
.pcm-w{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:14px;background:var(--bg);position:relative}.pcm table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:560px}.pcm th,.pcm td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.pcm td:first-child,.pcm th:first-child{color:var(--mu);width:150px;font-weight:500}
.pcm thead th{position:sticky;top:0;background:var(--bg);z-index:2;vertical-align:bottom}.pcm thead .p{display:grid;gap:6px}.pcm thead img{width:100%;max-width:140px;aspect-ratio:1;object-fit:cover;border-radius:10px}.pcm thead b{font-size:15px;color:var(--fg)}.pcm thead .x{justify-self:start;font-size:12px;color:var(--mu);text-decoration:underline;min-height:28px}
.pcm .grp td{background:var(--sf);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:8px 14px}.pcm .best{color:var(--ok);font-weight:650}.pcm .best::after{content:" · best";font-size:11px;font-weight:500}
.pcm .add{display:grid;place-items:center;height:100%;border:1.5px dashed var(--ctl);border-radius:10px;padding:12px;gap:6px;color:var(--mu);font-size:13px}.pcm .add select{height:34px;border:1px solid var(--ctl);border-radius:8px;background:var(--bg);font:inherit;color:var(--fg);max-width:140px}
</style>
<script>
const ALL=[{n:"Aero ANC",img:"c/1082",p:249,bat:30,w:254,anc:"Adaptive",cod:"LDAC, AAC",fold:"Yes",mic:4},{n:"Pulse Over-ear",img:"c/1014",p:179,bat:45,w:268,anc:"On/off",cod:"AAC",fold:"Yes",mic:2},{n:"Field Studio",img:"c/1083",p:329,bat:24,w:310,anc:"Adaptive",cod:"LDAC, aptX, AAC",fold:"No",mic:6},{n:"Nimbus Lite",img:"c/1012",p:99,bat:38,w:198,anc:"None",cod:"SBC, AAC",fold:"Yes",mic:1}];let sel=[0,1,2];
const R=[["Price",[["Price","p",v=>'€'+v,'lo']]],["Battery & weight",[["Battery","bat",v=>v+' h','hi'],["Weight","w",v=>v+' g','lo']]],["Sound",[["Noise cancelling","anc"],["Codecs","cod"],["Microphones","mic",v=>v,'hi']]],["Build",[["Folds flat","fold"]]]];
function draw(){const P=sel.map(i=>ALL[i]),diff=document.getElementById('df').checked;let h=`<thead><tr><th></th>${P.map((p,k)=>`<th><div class="p"><img src="media/pics/${p.img}.jpg" alt=""><b>${p.n}</b><button class="x" data-x="${k}">Remove</button></div></th>`).join('')}${P.length<3?`<th><label class="add">Add a product<select id="ad"><option value="">Choose…</option>${ALL.map((a,i)=>sel.includes(i)?'':`<option value="${i}">${a.n}</option>`).join('')}</select></label></th>`:''}</tr></thead><tbody>`;
R.forEach(([g,rows])=>{const rr=rows.filter(([,k])=>!diff||new Set(P.map(p=>p[k])).size>1);if(!rr.length)return;h+=`<tr class="grp"><td colspan="${P.length+2}">${g}</td></tr>`;rr.forEach(([n,k,f=v=>v,best])=>{const vals=P.map(p=>p[k]),b=best?(best==='lo'?Math.min(...vals):Math.max(...vals)):null;h+=`<tr><td>${n}</td>${P.map(p=>`<td class="${best&&P.length>1&&p[k]===b?'best':''}">${f(p[k])}</td>`).join('')}${P.length<3?'<td></td>':''}</tr>`})});document.getElementById('t').innerHTML=h+'</tbody>';const ad=document.getElementById('ad');if(ad)ad.onchange=()=>{if(ad.value){sel.push(+ad.value);draw()}}}
document.getElementById('t').onclick=e=>{const b=e.target.closest('[data-x]');if(b&&sel.length>1){sel.splice(+b.dataset.x,1);draw()}};document.getElementById('df').onchange=draw;draw();
</script>

<!--Size Guide Dialog|Commerce|A size guide with a cm/in toggle, the measurement table with the recommended row highlighted, and a two-question fit finder (height, usual size, fit preference) that suggests a size with a confidence note.|ecommerce,size guide,fit,dialog,table,units-->
<div class="k"><div class="sg"><div class="sg-h"><h2>Size guide · Field jacket</h2><div class="sg-u" role="radiogroup" aria-label="Units"><button role="radio" aria-checked="true" data-u="cm">cm</button><button role="radio" aria-checked="false" data-u="in">in</button></div></div>
<div class="sg-tw"><table id="t"></table></div>
<form class="sg-ff" id="ff"><h3>Find my size</h3><div class="sg-r"><label><span class="lbl">Height</span><select class="in" id="ht"><option value="0">Under 165 cm</option><option value="1" selected>165–175 cm</option><option value="2">176–185 cm</option><option value="3">Over 185 cm</option></select></label><label><span class="lbl">Usual size</span><select class="in" id="us"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option></select></label></div><fieldset><legend class="lbl">I like it</legend><div class="sg-ft" role="radiogroup"><button type="button" role="radio" aria-checked="false" data-f="-1">Close fitting</button><button type="button" role="radio" aria-checked="true" data-f="0">As designed</button><button type="button" role="radio" aria-checked="false" data-f="1">Room for layers</button></div></fieldset><p class="sg-res" id="rs" aria-live="polite"></p></form></div></div>
<style>
.sg{width:min(640px,100%);display:grid;gap:18px}.sg-h{display:flex;justify-content:space-between;align-items:center;gap:12px}.sg-h h2{margin:0;font-size:20px}.sg-u{display:flex;background:var(--sf2);border-radius:8px;padding:2px}.sg-u button{height:30px;padding:0 12px;border-radius:6px;font-weight:600;color:var(--mu)}.sg-u [aria-checked=true]{background:var(--bg);color:var(--fg)}
.sg-tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);position:relative}.sg table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.sg th,.sg td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--line)}.sg th:first-child,.sg td:first-child{text-align:left;font-weight:650}.sg th{font-size:12px;color:var(--mu);font-weight:550}.sg tr:last-child td{border:0}.sg tr.rec td{background:var(--ac-sf)}.sg tr.rec td:first-child::after{content:" · your size";font-weight:500;color:var(--ac);font-size:12px}
.sg-ff{display:grid;gap:12px;padding:18px;border-radius:14px;background:var(--sf)}.sg-ff h3{margin:0;font-size:16px}.sg-r{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sg-ff .in{height:42px}.sg-ff fieldset{border:0;margin:0;padding:0}.sg-ft{display:flex;gap:6px;flex-wrap:wrap}.sg-ft button{height:36px;padding:0 12px;border:1px solid var(--ctl);border-radius:999px;font-size:13px;background:var(--bg)}.sg-ft [aria-checked=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sg-res{margin:0;font-size:15px;padding:12px;border-radius:10px;background:var(--bg)}.sg-res b{font-size:20px}
</style>
<script>
const Z=['XS','S','M','L','XL'],M=[["Chest",[88,94,100,106,112]],["Waist",[76,82,88,94,100]],["Sleeve",[61,62.5,64,65.5,67]],["Length",[70,72,74,76,78]]];let u='cm',rec=2;const $=i=>document.getElementById(i);
function tbl(){const cv=v=>u==='cm'?v:(v/2.54).toFixed(1);$('t').innerHTML=`<thead><tr><th>Size</th>${M.map(m=>`<th>${m[0]} (${u})</th>`).join('')}</tr></thead><tbody>${Z.map((z,i)=>`<tr class="${i===rec?'rec':''}"><td>${z}</td>${M.map(m=>`<td>${cv(m[1][i])}</td>`).join('')}</tr>`).join('')}</tbody>`}
function fit(){const us=Z.indexOf($('us').value),h=+$('ht').value,f=+document.querySelector('.sg-ft [aria-checked=true]').dataset.f;let r=us+f+(h===3&&us<3?1:0)-(h===0&&us>0&&f<1?0:0);r=Math.max(0,Math.min(4,r));rec=r;const sure=f===0&&h>0&&h<3;$('rs').innerHTML=`We suggest <b>${Z[r]}</b>. ${sure?'Most people with your answers kept this size.':r!==us?`That's one ${r>us?'up':'down'} from your usual, because of your answers.`:'If you\'re between sizes, size up for layering.'}`;tbl()}
document.querySelector('.sg-u').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));u=b.dataset.u;tbl()};
document.querySelector('.sg-ft').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));fit()};$('ht').onchange=$('us').onchange=fit;fit();
</script>

<!--Long Task Progress|States|A long import with honest progress: per-stage steps, rows processed with a rate and time remaining that smooths over time, a warnings counter you can expand, and pause/cancel with confirm.|progress,import,loading,long task,eta-->
<div class="k lt2"><main class="lt2-w"><div class="lt2-h"><h1>Importing contacts.csv</h1><span class="mu tn" id="eta"></span></div><div class="lt2-bar" role="progressbar" aria-label="Import progress" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="bi"></i></div><p class="tn lt2-n" id="n"></p>
<ol class="lt2-st" id="st"><li>Upload</li><li>Check columns</li><li>Import rows</li><li>Remove duplicates</li></ol>
<details class="lt2-w2" id="wd" hidden><summary id="ws"></summary><ul id="wl"></ul></details>
<div class="lt2-ac"><button class="b sec" id="ps">@I(pause,16)Pause</button><button class="b gh" id="cx">Cancel import</button></div><p class="lt2-cf" id="cf" hidden>Cancel? Rows imported so far will be removed. <button id="cy">Yes, cancel</button> <button id="cn">Keep going</button></p></main></div>
<style>
.lt2-w{width:min(520px,100%);display:grid;gap:12px}.lt2-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.lt2-h h1{margin:0;font-size:20px;letter-spacing:-.01em}.lt2-h span{font-size:13px}
.lt2-bar{height:10px;border-radius:5px;background:var(--sf2);overflow:hidden}.lt2-bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:5px;transition:width .3s linear}.lt2-w.pz .lt2-bar i{background:var(--ctl)}.lt2-n{margin:0;font-size:13px;color:var(--mu)}
.lt2-st{list-style:none;padding:0;margin:4px 0;display:grid;gap:4px}.lt2-st li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mu);padding:4px 0}.lt2-st li::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--ctl);box-sizing:border-box;flex:none}.lt2-st .dn{color:var(--fg)}.lt2-st .dn::before{background:var(--ok);border-color:var(--ok)}.lt2-st .on{color:var(--fg);font-weight:550}.lt2-st .on::before{border-color:var(--ac)}
.lt2-w2{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-sf);border-radius:10px;padding:0 12px;font-size:13px}.lt2-w2 summary{padding:10px 0;cursor:pointer;font-weight:550}.lt2-w2 ul{margin:0 0 10px;padding-left:18px;display:grid;gap:4px}
.lt2-ac{display:flex;gap:8px}.lt2-ac .b{height:40px}.lt2-cf{margin:0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--err-sf)}.lt2-cf button{font-weight:600;text-decoration:underline;min-height:32px;margin-left:6px}
</style>
<script>
const $=i=>document.getElementById(i),TOT=48210;let done=0,stage=2,paused=false,rate=0,W=[],last=performance.now();const ST=[...$('st').children];
function draw(){const p=done/TOT*100;$('bi').style.width=p+'%';$('pb').setAttribute('aria-valuenow',Math.round(p));$('n').textContent=`${done.toLocaleString('en')} of ${TOT.toLocaleString('en')} rows · ${Math.round(rate).toLocaleString('en')} rows/s`;ST.forEach((l,i)=>l.className=i<stage?'dn':i===stage?'on':'');
const rem=rate?Math.round((TOT-done)/rate):0;$('eta').textContent=paused?'Paused':stage>=4?'Done':rem>60?`About ${Math.ceil(rem/60)} min left`:`About ${rem} s left`;if(W.length){$('wd').hidden=false;$('ws').textContent=`${W.length} rows skipped (show)`;$('wl').innerHTML=W.slice(-4).map(w=>`<li>${w}</li>`).join('')}}
const tk=setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;if(paused||stage>=4)return;const inc=Math.round(1400+Math.random()*900);done=Math.min(TOT,done+inc);rate=rate?rate*.8+inc/dt*.2:inc/dt;if(Math.random()<.15)W.push(`Row ${done-Math.floor(Math.random()*400)}: email “${['ana@','jo@@ex.com','(blank)','m.ruiz@example'][W.length%4]}” is not valid`);if(done>=TOT){stage=3;draw();setTimeout(()=>{stage=4;draw();document.querySelector('.lt2-h h1').textContent='Imported 48,210 contacts';$('ps').hidden=true;$('cx').hidden=true},900)}draw()},400);
$('ps').onclick=()=>{paused=!paused;document.querySelector('.lt2-w').classList.toggle('pz',paused);$('ps').innerHTML=paused?'@I(play,16)Resume':'@I(pause,16)Pause';draw()};$('cx').onclick=()=>{$('cf').hidden=false;$('cy').focus()};$('cn').onclick=()=>$('cf').hidden=true;$('cy').onclick=()=>{clearInterval(tk);document.querySelector('.lt2-w').innerHTML='<h1 style="margin:0;font-size:20px">Import cancelled</h1><p class="mu" style="margin:0">No contacts were added.</p>'};draw();
</script>

<!--Teacher Gradebook Dashboard|Dashboards|A class gradebook: students × assignments grid with editable scores that recolour by band, column averages, a missing-work filter, and a per-student trend sparkline.|dashboard,education,gradebook,teacher,table,editable-->
<div class="k db">
<aside class="db-side" aria-label="Main"><div class="db-brand"><i>A+</i>Classbook</div><a href="#">@I(home,18)Today</a><a href="#" aria-current="page">@I(grid,18)Gradebook</a><a href="#">@I(file,18)Assignments</a><a href="#">@I(msg,18)Messages<em>4</em></a><div class="db-sec">Classes</div><a href="#">@I(hash,18)Physics 10B</a><a href="#">@I(hash,18)Physics 11A</a><div class="db-user"><span class="av" style="--c:#0f766e">MR</span><div><b>Ms. Reyes</b><span>Teacher</span></div></div></aside>
<main class="db-main"><header class="db-top"><button class="db-mb ibt" aria-label="Open navigation" aria-expanded="false">@I(list,20)</button><h1>Physics 10B</h1><span class="sp"></span><label class="gb-mf"><input type="checkbox" id="mf"> Missing work only</label></header>
<div class="db-body"><section class="db-card" style="padding:0"><div class="db-tw"><table class="db-tbl gb" id="t"></table></div></section><p class="mu" style="font-size:12px;margin:0">Click a score to edit. Empty means not handed in. Scores out of 100.</p></div></main>
</div>
<style>
.gb-mf{display:flex;gap:8px;align-items:center;font-size:13px;min-height:36px}.gb-mf input{width:16px;height:16px;accent-color:var(--ac)}
.gb th,.gb td{text-align:center}.gb th:first-child,.gb td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1}.gb th small{display:block;font-weight:400;font-size:11px}
.gb input{width:52px;height:32px;text-align:center;border:1px solid transparent;border-radius:6px;font:inherit;font-variant-numeric:tabular-nums;background:var(--b,transparent);color:var(--fg)}.gb input:hover{border-color:var(--line)}.gb input:focus{outline:0;border-color:var(--ac);background:var(--bg)}
.gb input[data-b="a"]{--b:var(--ok-sf)}.gb input[data-b="c"]{--b:var(--warn-sf)}.gb input[data-b="f"]{--b:var(--err-sf)}.gb input[data-b="m"]{--b:repeating-linear-gradient(0deg,transparent,transparent);border:1px dashed var(--ctl)}
.gb .st{display:flex;gap:10px;align-items:center}.gb .st .av{width:28px;height:28px;font-size:10px}.gb svg{width:56px;height:20px}.gb path{fill:none;stroke:var(--ac);stroke-width:1.5}.gb tfoot td{font-weight:600;font-variant-numeric:tabular-nums;background:var(--sf)}.gb .avg{font-weight:650;font-variant-numeric:tabular-nums}
</style>
<script>
const AS=[["Lab 1","Motion"],["Quiz 1","Vectors"],["Lab 2","Forces"],["Test 1","Unit 1"],["Lab 3","Energy"]],C=['#0f766e','#7c3aed','#b45309','#be123c','#0369a1','#15803d','#9333ea'];
const S=[["Amira K.",[92,88,95,90,94]],["Ben L.",[71,64,null,68,72]],["Chloé D.",[85,90,82,88,null]],["Dawit T.",[58,62,55,61,49]],["Elsa N.",[96,94,98,97,99]],["Farid H.",[77,null,74,80,83]],["Gwen O.",[88,79,84,null,90]]];
const t=document.getElementById('t'),mf=document.getElementById('mf'),band=v=>v==null?'m':v>=85?'a':v>=65?'':v>=50?'c':'f',avg=a=>{const v=a.filter(x=>x!=null);return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):'–'};
function spark(a){const v=a.map((x,i)=>[i,x]).filter(p=>p[1]!=null);return `<svg viewBox="0 0 56 20" aria-hidden="true"><path d="M${v.map(([i,x])=>`${(i/4*54+1).toFixed(1)},${(19-(x-40)/60*18).toFixed(1)}`).join('L')}"/></svg>`}
function draw(){const R=S.map((s,i)=>[s,i]).filter(([s])=>!mf.checked||s[1].includes(null));t.innerHTML=`<thead><tr><th>Student</th>${AS.map(([a,b])=>`<th>${a}<small class="mu">${b}</small></th>`).join('')}<th>Average</th><th>Trend</th></tr></thead><tbody>${R.map(([[n,sc],i])=>`<tr><td><span class="st"><span class="av" style="--c:${C[i]}">${n.split(' ').map(w=>w[0]).join('')}</span>${n}</span></td>${sc.map((v,j)=>`<td><input inputmode="numeric" value="${v??''}" data-s="${i}" data-a="${j}" data-b="${band(v)}" aria-label="${n}, ${AS[j][0]}" placeholder="–"></td>`).join('')}<td class="avg">${avg(sc)}</td><td>${spark(sc)}</td></tr>`).join('')||'<tr><td colspan="8" class="mu" style="text-align:center;padding:24px">Everyone has handed everything in.</td></tr>'}</tbody><tfoot><tr><td>Class average</td>${AS.map((_,j)=>`<td>${avg(S.map(s=>s[1][j]))}</td>`).join('')}<td>${avg(S.map(s=>avg(s[1])).filter(x=>x!=='–'))}</td><td></td></tr></tfoot>`}
t.addEventListener('change',e=>{const i=e.target;if(!i.dataset.s)return;let v=i.value.trim();v=v===''?null:Math.max(0,Math.min(100,parseInt(v)||0));S[i.dataset.s][1][i.dataset.a]=v;const k=`[data-s="${i.dataset.s}"][data-a="${i.dataset.a}"]`;draw();const n=t.querySelector(k);n&&n.focus()});
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.s){e.target.blur();const n=t.querySelector(`[data-s="${+e.target.dataset.s+1}"][data-a="${e.target.dataset.a}"]`);n&&n.focus()}});mf.onchange=draw;draw();
</script>

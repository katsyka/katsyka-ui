<!--Dark Pricing|Dark|Pricing tiers on a dark page without neon: the featured plan is lifted by a lighter surface and a calm accent hairline, not a glow. Monthly/yearly switch with rolling prices, checks in muted green, and contrast-checked muted text.|dark mode,pricing,plans,toggle,saas-->
<div class="k"><section class="dp"><header><h2>Simple plans for every studio</h2><p>Start free. Upgrade when your work outgrows it.</p>
  <div class="dp-sw" role="radiogroup" aria-label="Billing"><button role="radio" aria-checked="false" data-y="0">Monthly</button><button role="radio" aria-checked="true" data-y="1">Yearly <em>−20%</em></button></div></header>
  <div class="dp-g" id="g"></div></section></div>
<style>
.k{color-scheme:dark;--e0:#0f0f11;--e1:#16161a;--e2:#1d1d22;--hl:#ffffff12;--ac2:#ffa36e;background:var(--e0)}
.dp{width:min(980px,100%)}.dp header{text-align:center}.dp h2{margin:0;font-size:clamp(26px,4vw,36px);font-weight:650;letter-spacing:-.025em;color:#f4f4f5}.dp header p{margin:8px 0 20px;color:#a1a1aa}
.dp-sw{display:inline-flex;padding:4px;border-radius:12px;background:var(--e1);border:1px solid var(--hl)}.dp-sw button{height:34px;padding:0 14px;border-radius:8px;font-weight:550;color:#a1a1aa}.dp-sw [aria-checked=true]{background:var(--e2);color:#f4f4f5;box-shadow:inset 0 1px 0 #ffffff0f}.dp-sw em{font-style:normal;color:#86efac;font-size:12px;margin-left:4px}
.dp-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:28px;align-items:start}
.dp-c{padding:24px;border-radius:18px;background:var(--e1);border:1px solid var(--hl);display:flex;flex-direction:column}
.dp-c.ft{background:var(--e2);border-color:color-mix(in srgb,var(--ac2) 45%,transparent);box-shadow:inset 0 1px 0 #ffffff14}
.dp-c h3{display:flex;justify-content:space-between;align-items:center;margin:0;font-size:16px;font-weight:600;color:#f4f4f5}.dp-c h3 span{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--ac2) 16%,transparent);color:var(--ac2)}
.dp-c>p{margin:6px 0 16px;color:#a1a1aa;font-size:14px;min-height:40px}
.dp-pr{display:flex;align-items:baseline;gap:4px;height:48px;overflow:hidden}.dp-pr b{font-size:40px;font-weight:650;letter-spacing:-.03em;color:#f4f4f5;display:inline-block;transition:transform .35s var(--ease),opacity .35s}.dp-pr b.out{transform:translateY(-60%);opacity:0}.dp-pr b.in{transform:translateY(60%);opacity:0;transition:none}
.dp-pr small{color:#a1a1aa}.dp-sub{font-size:12px;color:#8b8b94;min-height:18px}
.dp-c .b{margin:16px 0 20px;height:42px;width:100%}.dp-c:not(.ft) .b{background:var(--e2);color:#f4f4f5;border:1px solid var(--hl)}.dp-c:not(.ft) .b:hover{background:#26262b}.dp-c.ft .b{background:var(--ac2);color:#1a0a03}
.dp-c ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px;color:#d4d4d8}.dp-c li{display:flex;gap:8px}.dp-c li .i{color:#86efac;width:16px;height:16px;margin-top:2px}
</style>
<script>
const P=[["Starter","For trying things out",[0,0],["3 projects","1 GB storage","Community support"]],["Studio","For working photographers",[24,19],["Unlimited projects","200 GB storage","Client proofing","Priority email support"],1],["Team","For agencies and shared studios",[59,47],["Everything in Studio","5 seats included","Roles and audit log","SSO"]]];
const CK='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';let y=1;
g.innerHTML=P.map(([n,d,p,f,ft],i)=>'<article class="dp-c'+(ft?' ft':'')+'"><h3>'+n+(ft?'<span>Most popular</span>':'')+'</h3><p>'+d+'</p><div class="dp-pr"><b class="tn" data-i="'+i+'">$'+p[y]+'</b><small>/ month</small></div><div class="dp-sub" data-s="'+i+'"></div><button class="b">'+(p[0]?'Start 14-day trial':'Start free')+'</button><ul>'+f.map(x=>'<li>'+CK+x+'</li>').join('')+'</ul></article>').join('');
const sub=()=>g.querySelectorAll("[data-s]").forEach(s=>{const p=P[s.dataset.s][2];s.textContent=p[0]?(y?'$'+p[1]*12+' billed yearly':'Billed monthly'):'Free forever'});sub();
document.querySelectorAll(".dp-sw button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".dp-sw button").forEach(x=>x.setAttribute("aria-checked",x===b));y=+b.dataset.y;
 g.querySelectorAll(".dp-pr b").forEach(el=>{el.classList.add("out");setTimeout(()=>{el.textContent='$'+P[el.dataset.i][2][y];el.classList.remove("out");el.classList.add("in");requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove("in")))},200)});sub()});
</script>

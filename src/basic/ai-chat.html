<!--AI Chat Thread|AI|A chat interface with streaming replies (word by word with a stop button), markdown-ish formatting, copy per message, an auto-growing composer that sends on Enter and newlines on Shift+Enter, and scroll-to-latest.|ai,chat,streaming,assistant,composer-->
<div class="k ac2"><div class="ac2-w"><div class="ac2-l" id="l" aria-live="polite"></div><button class="ac2-dn" id="dn" hidden aria-label="Scroll to latest">@I(down,16)</button><form class="ac2-f" id="f"><label class="vh" for="t">Message</label><textarea id="t" rows="1" placeholder="Ask anything about your workspace…"></textarea><button class="ac2-s" id="s" aria-label="Send">@I(send,16)</button></form><p class="ac2-n mu">Answers can be wrong. Check anything important.</p></div></div>
<style>
.k.ac2{padding:0;place-items:stretch;background:var(--bg)}.ac2-w{width:min(760px,100%);margin:0 auto;display:flex;flex-direction:column;height:100dvh;position:relative;padding:0 16px}
.ac2-l{flex:1;overflow:auto;padding:32px 0 16px;display:flex;flex-direction:column;gap:24px}.ac2-m{display:grid;gap:6px;max-width:100%}.ac2-m.u{justify-self:end;align-self:flex-end;max-width:80%;background:var(--sf2);padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:15px;line-height:1.55}
.ac2-m.a{font-size:15.5px;line-height:1.65}.ac2-m.a p{margin:0 0 .7em}.ac2-m.a ul{margin:0 0 .7em;padding-left:20px}.ac2-m.a code{font:.88em 'Geist Mono',monospace;background:var(--sf2);padding:1px 5px;border-radius:4px}.ac2-m.a strong{font-weight:650}.ac2-cur::after{content:"";display:inline-block;width:8px;height:16px;background:var(--fg);vertical-align:-3px;margin-left:2px;animation:acb 1s steps(2) infinite}@keyframes acb{50%{opacity:0}}
.ac2-ac{display:flex;gap:2px;opacity:.6}.ac2-ac:hover,.ac2-ac:focus-within{opacity:1}.ac2-ac .ibt{width:30px;height:30px}
.ac2-f{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--ctl);border-radius:18px;padding:8px 8px 8px 16px;background:var(--bg);margin-bottom:6px}.ac2-f:focus-within{border-color:var(--fg)}.ac2-f textarea{flex:1;border:0;outline:0;background:none;resize:none;font:16px/1.5 Geist,sans-serif;color:var(--fg);max-height:180px;padding:6px 0}
.ac2-s{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}.ac2-s:disabled{opacity:.3}.ac2-s.stop{background:var(--fg)}.ac2-n{font-size:11px;text-align:center;margin:0 0 max(10px,env(safe-area-inset-bottom))}
.ac2-dn{position:absolute;left:50%;translate:-50% 0;bottom:110px;width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px #0002}
</style>
<script>
const $=i=>document.getElementById(i),l=$('l'),t=$('t'),s=$('s');let stop=false,busy=false;
const A={def:"Here's what I found in your workspace:\n\n- **3 projects** are due this week: *Kestrel launch*, *Q4 report* and *Website refresh*.\n- *Kestrel launch* has 7 open tasks, 2 of them overdue.\n\nWant me to draft a status update for the team?",draft:"Sure. Here's a draft you can paste in `#kestrel`:\n\n**Kestrel launch, week 46.** We're on track for Friday. Two tasks slipped (*press kit*, *pricing page copy*); Lena and Jonas are on them today. Blockers: none.\n\nShall I post it, or would you like it shorter?"};
const fmt=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').split('\n\n').map(b=>b.startsWith('- ')?'<ul>'+b.split('\n').map(li=>'<li>'+li.slice(2)+'</li>').join('')+'</ul>':'<p>'+b+'</p>').join('');
function add(r,h){const d=document.createElement('div');d.className='ac2-m '+r;d.innerHTML=h;l.append(d);l.scrollTop=l.scrollHeight;return d}
async function reply(txt){busy=true;stop=false;s.innerHTML='@I(x,16)';s.classList.add('stop');s.setAttribute('aria-label','Stop generating');const d=add('a','<div class="ac2-b ac2-cur"></div>'),b=d.firstChild,W=txt.split(/(\s+)/);let o='';const red=matchMedia('(prefers-reduced-motion:reduce)').matches;
for(const w of W){if(stop)break;o+=w;b.innerHTML=fmt(o);if(!red)await new Promise(r=>setTimeout(r,28));if(l.scrollHeight-l.scrollTop-l.clientHeight<120)l.scrollTop=l.scrollHeight}
b.classList.remove('ac2-cur');if(stop)b.insertAdjacentHTML('beforeend','<p class="mu" style="font-size:13px">Stopped.</p>');d.insertAdjacentHTML('beforeend',`<div class="ac2-ac"><button class="ibt" data-cp aria-label="Copy">@I(copy,15)</button><button class="ibt" aria-label="Good response">@I(heart,15)</button><button class="ibt" data-rg aria-label="Regenerate">@I(refresh,15)</button></div>`);busy=false;s.innerHTML='@I(send,16)';s.classList.remove('stop');s.setAttribute('aria-label','Send');t.focus()}
$('f').onsubmit=e=>{e.preventDefault();if(busy){stop=true;return}const v=t.value.trim();if(!v)return;add('u',v.replace(/</g,'&lt;'));t.value='';t.style.height='';reply(/draft|yes|sure|update/i.test(v)?A.draft:A.def)};
t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit()}};t.oninput=()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};
l.onclick=e=>{const c=e.target.closest('[data-cp]');if(c){const x=c.closest('.ac2-m').querySelector('.ac2-b').innerText;(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).catch(()=>{});c.innerHTML='@I(check,15)';setTimeout(()=>c.innerHTML='@I(copy,15)',1200)}const r=e.target.closest('[data-rg]');if(r&&!busy){r.closest('.ac2-m').remove();reply(A.def)}};
l.onscroll=()=>$('dn').hidden=l.scrollHeight-l.scrollTop-l.clientHeight<80;$('dn').onclick=()=>l.scrollTo({top:l.scrollHeight,behavior:'smooth'});
add('u','What needs my attention this week?');reply(A.def);
</script>

<!--Drill-down Mobile Menu|Navigation|A mobile navigation drawer with nested levels that slide in from the right (shop → women → jackets), a back button with the parent's name, focus moved to each level's heading, and a search row at the top.|navigation,mobile,drawer,nested,drill down,menu-->
<div class="k dd2"><div class="dd2-ph"><header class="dd2-hd"><button class="ibt" id="op" aria-label="Open menu" aria-expanded="false">@I(list,22)</button><b>Field Studio</b>@I(bag,20)</header><p class="mu" style="padding:16px">Tap the menu.</p>
<div class="dd2-d" id="d" role="dialog" aria-label="Menu" hidden><div class="dd2-top"><label class="dd2-s">@I(search,16)<input placeholder="Search products" aria-label="Search products"></label><button class="ibt" id="cl" aria-label="Close menu">@I(x,20)</button></div><div class="dd2-vp" id="vp"></div></div></div></div>
<style>
.dd2-ph{width:min(390px,100%);height:min(720px,calc(100dvh - 96px));border:1px solid var(--line);border-radius:24px;background:var(--bg);overflow:hidden;position:relative}.dd2-hd{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}.dd2-hd .ibt{width:44px;height:44px;color:var(--fg)}
.dd2-d{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:ddi .28s cubic-bezier(.23,1,.32,1)}@keyframes ddi{from{transform:translateX(-100%)}}.dd2-top{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}.dd2-s{flex:1;display:flex;gap:8px;align-items:center;height:40px;padding:0 10px;border-radius:10px;background:var(--sf);color:var(--mu)}.dd2-s input{border:0;outline:0;background:none;flex:1;font-size:16px;color:var(--fg);min-width:0}.dd2-top .ibt{width:44px;height:44px}
.dd2-vp{flex:1;position:relative;overflow:hidden}.dd2-lv{position:absolute;inset:0;overflow:auto;transition:transform .3s cubic-bezier(.23,1,.32,1);background:var(--bg)}.dd2-lv.in{animation:ddl .3s cubic-bezier(.23,1,.32,1)}.dd2-lv.back{animation:ddb .3s cubic-bezier(.23,1,.32,1)}@keyframes ddl{from{transform:translateX(100%)}}@keyframes ddb{from{transform:translateX(-30%);opacity:.5}}
.dd2-bk{display:flex;gap:4px;align-items:center;height:48px;padding:0 12px;color:var(--mu);font-size:14px;width:100%}.dd2-lv h2{margin:0;padding:8px 16px 8px;font-size:24px;letter-spacing:-.02em;outline:0}.dd2-lv ul{list-style:none;padding:0;margin:0}.dd2-lv li>*{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0 16px;font-size:17px;color:var(--fg);text-decoration:none;text-align:left;border-bottom:1px solid var(--line)}.dd2-lv li>*:active{background:var(--sf)}.dd2-lv li .i{color:var(--mu)}
@media (prefers-reduced-motion:reduce){.dd2-d,.dd2-lv.in,.dd2-lv.back{animation:none}}
</style>
<script>
const M={t:"Menu",c:[{t:"Women",c:[{t:"Jackets",c:[{t:"Waxed jackets"},{t:"Rain shells"},{t:"Down"},{t:"All jackets"}]},{t:"Knitwear"},{t:"Trousers"},{t:"Shop all women"}]},{t:"Men",c:[{t:"Jackets"},{t:"Shirts"},{t:"Shop all men"}]},{t:"Home",c:[{t:"Ceramics"},{t:"Textiles"}]},{t:"Journal"},{t:"Stores"}]};
const vp=document.getElementById('vp'),d=document.getElementById('d'),op=document.getElementById('op');let path=[M];
function show(dir){const n=path[path.length-1],par=path[path.length-2];vp.innerHTML=`<div class="dd2-lv ${dir}">${par?`<button class="dd2-bk" data-b>@I(left,16)${par.t}</button>`:''}<h2 tabindex="-1">${n.t}</h2><ul>${n.c.map((x,i)=>x.c?`<li><button data-i="${i}" aria-haspopup="true">${x.t}@I(right,18)</button></li>`:`<li><a href="#">${x.t}</a></li>`).join('')}</ul></div>`;vp.querySelector('h2').focus()}
vp.onclick=e=>{const b=e.target.closest('[data-i]');if(b){path.push(path[path.length-1].c[+b.dataset.i]);show('in');return}if(e.target.closest('[data-b]')){path.pop();show('back')}};
op.onclick=()=>{d.hidden=false;op.setAttribute('aria-expanded',true);path=[M];show('')};const close=()=>{d.hidden=true;op.setAttribute('aria-expanded',false);op.focus()};document.getElementById('cl').onclick=close;d.addEventListener('keydown',e=>{if(e.key==='Escape')close()});setTimeout(()=>op.click(),300);
</script>

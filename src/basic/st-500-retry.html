<!--Server Error Page|States|A 500 page that owns the problem: plain apology, auto-retry countdown with cancel, a copyable request ID for support, and a live status line linking to the status page.|500,error,retry,countdown,support-->
<div class="k s5"><main class="s5-w"><div class="s5-ic">@I(zap,22)</div><h1>Something broke on our side</h1><p class="mu">Not your fault, and your work is saved. We'll try again automatically.</p>
<div class="s5-rt"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15"/><circle cx="18" cy="18" r="15" id="rg"/></svg><span id="rl" aria-live="polite">Retrying in 10 s</span><button class="b sec sm" id="cn">Cancel</button><button class="b ac sm" id="now">Retry now</button></div>
<div class="s5-id"><span class="mu">Request ID</span><code id="rid">req_7f3a91c2e4b8</code><button class="ibt" id="cp" aria-label="Copy request ID">@I(copy,16)</button></div>
<p class="s5-st"><span class="s5-dot"></span>Elevated error rates on the API since 14:02 UTC. <a href="#">Status page</a></p></main></div>
<style>
.s5-w{width:min(480px,100%);display:grid;gap:16px;justify-items:start}.s5-ic{width:44px;height:44px;border-radius:12px;background:var(--err-sf);color:var(--err);display:grid;place-items:center}.s5-w h1{margin:0;font-size:26px;letter-spacing:-.02em}.s5-w>p{margin:-8px 0 0}
.s5-rt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);width:100%}.s5-rt svg{width:28px;height:28px;transform:rotate(-90deg)}.s5-rt circle{fill:none;stroke-width:3}.s5-rt circle:first-child{stroke:var(--sf2)}#rg{stroke:var(--ac);stroke-dasharray:94.2;transition:stroke-dashoffset 1s linear}.s5-rt span{flex:1;font-size:14px;font-variant-numeric:tabular-nums}
.s5-id{display:flex;gap:10px;align-items:center;font-size:13px}.s5-id code{font:13px 'Geist Mono',monospace;background:var(--sf2);padding:4px 8px;border-radius:6px}
.s5-st{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu);margin:0;flex-wrap:wrap}.s5-st a{color:var(--fg)}.s5-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
</style>
<script>
const $=i=>document.getElementById(i);let n=10,t,tries=1;
function start(){clearInterval(t);n=10;tick();t=setInterval(tick,1000)}
function tick(){$('rg').style.strokeDashoffset=94.2*(1-n/10);$('rl').textContent=n>0?`Retrying in ${n} s (attempt ${tries} of 3)`:'Retrying…';if(n<=0){clearInterval(t);setTimeout(fail,900)}n--}
function fail(){tries++;if(tries>3){$('rl').textContent='Still failing. We\'ve been alerted. Try again in a few minutes.';$('cn').hidden=true;return}start()}
$('cn').onclick=()=>{clearInterval(t);$('rl').textContent='Auto-retry cancelled.';$('cn').hidden=true};$('now').onclick=()=>{$('cn').hidden=false;clearInterval(t);n=0;tick()};start();
$('cp').onclick=e=>{const b=e.currentTarget;(navigator.clipboard?navigator.clipboard.writeText($('rid').textContent):Promise.reject()).catch(()=>{});b.innerHTML='@I(check,16)';b.setAttribute('aria-label','Copied');setTimeout(()=>{b.innerHTML='@I(copy,16)';b.setAttribute('aria-label','Copy request ID')},1400)};
</script>

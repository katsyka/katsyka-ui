<!--User Admin Dashboard|Dashboards|An admin users table: sortable columns, role dropdown per row, invite pending rows with resend, suspend with undo toast, CSV export, and pagination with page-size.|dashboard,admin,users,table,roles,sortable-->
<div class="k db">
<aside class="db-side" aria-label="Main"><div class="db-brand"><i>⚙</i>Admin</div><a href="#">@I(chart,18)Overview</a><a href="#" aria-current="page">@I(users,18)Users</a><a href="#">@I(shield,18)Security</a><a href="#">@I(card,18)Billing</a><a href="#">@I(file,18)Audit log</a><div class="db-user"><span class="av" style="--c:#334155">AO</span><div><b>Admin</b><span>Owner</span></div></div></aside>
<main class="db-main"><header class="db-top"><button class="db-mb ibt" aria-label="Open navigation" aria-expanded="false">@I(list,20)</button><h1>Users <span class="mu tn" id="ct" style="font-weight:400"></span></h1><span class="sp"></span><button class="b sec sm" id="csv" aria-label="Export CSV">@I(download,14)<span class="au-x">Export CSV</span></button><button class="b ac sm">@I(plus,14)Invite</button></header>
<div class="db-body"><section class="db-card" style="padding:0"><div class="db-tw"><table class="db-tbl au"><thead id="th"></thead><tbody id="tb"></tbody></table></div><footer class="au-pg"><label class="mu">Rows <select id="ps"><option>5</option><option selected>8</option><option>20</option></select></label><span class="mu tn" id="pi"></span><div><button class="ibt" id="pp" aria-label="Previous page">@I(left,16)</button><button class="ibt" id="np" aria-label="Next page">@I(right,16)</button></div></footer></section></div>
<div class="au-toast" id="ts" role="status" hidden><span id="tt"></span><button id="un">Undo</button></div></main>
</div>
<style>
.au th button{display:inline-flex;gap:4px;align-items:center;font:inherit;color:inherit;min-height:28px}.au th button .i{width:12px;height:12px;opacity:.4}.au th[aria-sort] button .i{opacity:1}.au th[aria-sort=descending] .i{transform:rotate(180deg)}
.au td .u{display:flex;gap:10px;align-items:center}.au td .u .av{width:30px;height:30px;font-size:11px}.au td .u div{display:grid}.au td .u small{color:var(--mu)}
.au select,.au-pg select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font:inherit;font-size:13px;padding:0 6px;color:var(--fg)}.au .sus td{opacity:.5}
.au-pg{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;gap:12px}.au-pg label{display:flex;gap:8px;align-items:center}.au-pg div{display:flex;gap:4px}
.au-toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));translate:-50% 0;background:var(--fg);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;animation:aut .2s cubic-bezier(.23,1,.32,1);z-index:40}.au-toast button{color:inherit;font-weight:650;text-decoration:underline;min-height:32px;padding:0 6px}@media (max-width:600px){.au-x{display:none}}@keyframes aut{from{opacity:0;translate:-50% 8px}}
</style>
<script>
const N=["Aisha Bello","Björn Sund","Carmen Vidal","Dmitri Orlov","Esi Mensah","Felix Brandt","Grace Liu","Hiro Sato","Ines Duarte","Jonah Fisch","Kara Novak","Luis Herrera","Maja Kowal","Nadia Aziz"],C=['#0f766e','#7c3aed','#b45309','#be123c','#0369a1','#15803d','#9333ea','#334155'];
let U=N.map((n,i)=>({n,e:n.toLowerCase().split(' ')[0]+'@northwind.example',r:i?['Admin','Member','Member','Viewer'][i%4]:'Owner',s:i===3||i===11?'invited':'active',l:i===3||i===11?null:Date.now()-((i*7919)%(864e5*40)),c:C[i%8]}));
let key='n',dir=1,pg=0,last=null;const th=document.getElementById('th'),tb=document.getElementById('tb'),ps=document.getElementById('ps');
const ago=t=>{if(!t)return'–';const d=(Date.now()-t)/864e5;return d<1?'Today':d<2?'Yesterday':Math.floor(d)+' days ago'};
const COLS=[['n','Name'],['r','Role'],['s','Status'],['l','Last active']];
function draw(){const L=[...U].sort((a,b)=>((a[key]??0)>(b[key]??0)?1:(a[key]??0)<(b[key]??0)?-1:0)*dir),sz=+ps.value,np=Math.ceil(L.length/sz);pg=Math.min(pg,np-1);
th.innerHTML='<tr>'+COLS.map(([k,n])=>`<th ${k===key?`aria-sort="${dir>0?'ascending':'descending'}"`:''}><button data-k="${k}">${n}@I(up)</button></th>`).join('')+'<th><span class="vh">Actions</span></th></tr>';
tb.innerHTML=L.slice(pg*sz,pg*sz+sz).map(u=>`<tr class="${u.s==='suspended'?'sus':''}"><td><span class="u"><span class="av" style="--c:${u.c}">${u.n.split(' ').map(w=>w[0]).join('')}</span><div><b>${u.n}</b><small>${u.e}</small></div></span></td><td><select data-r="${u.e}" aria-label="Role for ${u.n}" ${u.r==='Owner'?'disabled':''}>${['Owner','Admin','Member','Viewer'].map(r=>`<option ${r===u.r?'selected':''} ${r==='Owner'&&u.r!=='Owner'?'disabled':''}>${r}</option>`).join('')}</select></td><td><span class="pill ${u.s==='active'?'ok':u.s==='invited'?'info':'err'}">${u.s[0].toUpperCase()+u.s.slice(1)}</span></td><td class="mu">${ago(u.l)}</td><td style="text-align:right">${u.s==='invited'?`<button class="b gh sm" data-rs="${u.e}">Resend invite</button>`:u.r!=='Owner'?`<button class="b gh sm" data-su="${u.e}">${u.s==='suspended'?'Restore':'Suspend'}</button>`:''}</td></tr>`).join('');
document.getElementById('pi').textContent=`${pg*sz+1}–${Math.min(L.length,pg*sz+sz)} of ${L.length}`;document.getElementById('pp').disabled=pg===0;document.getElementById('np').disabled=pg>=np-1;document.getElementById('ct').textContent=U.length}
th.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;dir=key===b.dataset.k?-dir:1;key=b.dataset.k;draw();th.querySelector(`[data-k="${key}"]`).focus()};
tb.onchange=e=>{const u=U.find(x=>x.e===e.target.dataset.r);if(u){const o=u.r;u.r=e.target.value;toast(`${u.n} is now ${u.r}`,()=>{u.r=o})}};
tb.onclick=e=>{const s=e.target.closest('[data-su]');if(s){const u=U.find(x=>x.e===s.dataset.su),o=u.s;u.s=o==='suspended'?'active':'suspended';draw();toast(`${u.n} ${u.s==='suspended'?'suspended':'restored'}`,()=>{u.s=o})}const r=e.target.closest('[data-rs]');if(r){r.textContent='Sent';r.disabled=true}};
let tt;function toast(m,undo){last=undo;const t=document.getElementById('ts');document.getElementById('tt').textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,5000);draw()}
document.getElementById('un').onclick=()=>{if(last)last();last=null;document.getElementById('ts').hidden=true;draw()};
document.getElementById('pp').onclick=()=>{pg--;draw()};document.getElementById('np').onclick=()=>{pg++;draw()};ps.onchange=()=>{pg=0;draw()};
document.getElementById('csv').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['name,email,role,status\n'+U.map(u=>[u.n,u.e,u.r,u.s].join(',')).join('\n')],{type:'text/csv'}));a.download='users.csv';a.click()};draw();
</script>

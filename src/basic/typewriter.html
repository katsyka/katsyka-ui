<div class="k"><section class="tw"><h1><span class="vh">Design that works for phones, for the dark, and for real people.</span><span aria-hidden="true">Design that works<br>for <span class="tw-w" id="w"></span><i class="tw-c"></i></span></h1><p class="mu">Katsyka UI · mobile, dark mode and everyday components.</p></section></div>
<style>
.tw{width:min(820px,100%)}

<script>
const P=["phones.","the dark.","real people.","thumbs.","slow networks."];let i=0,s="",del=false;const tw=document.querySelector(".tw");

const tick=()=>{const full=P[i];tw.classList.add("typing");if(!del){s=full.slice(0,s.length+1);w.textContent=s;if(s===full){del=true;tw.classList.remove("typing");return setTimeout(tick,1600)}const c=full[s.length-1];setTimeout(tick,c===" "?140:55+Math.random()*70)}
 else{s=s.slice(0,-1);w.textContent=s;if(!s){del=false;i=(i+1)%P.length;tw.classList.remove("typing");return setTimeout(tick,350)}setTimeout(tick,28)}};tick()}

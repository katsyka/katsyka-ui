<!--AI Usage Meter|AI|Monthly AI credit usage: a segmented bar by feature (chat, summaries, images), daily usage sparkline with the projection to month end, a cap warning with a spending limit toggle, and per-member breakdown.|ai,usage,credits,billing,meter,limits-->
<div class="k"><div class="us card"><div class="us-h"><div><b>AI credits</b><span class="mu tn" id="per"></span></div><span class="tn us-n" id="n"></span></div><div class="us-bar" id="bar" role="img"></div><ul class="us-lg" id="lg"></ul><svg class="us-sp" id="sp" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true"></svg><p class="us-w" id="w"></p><label class="us-lim"><input type="checkbox" id="lim" checked> Stop AI features at the monthly limit</label><details class="us-m"><summary>By member</summary><ul id="mb"></ul></details></div></div>
<style>
.us{width:min(520px,100%);padding:20px;display:grid;gap:12px}.us-h{display:flex;justify-content:space-between;align-items:end}.us-h div{display:grid}.us-h span.mu{font-size:12px}.us-n{font-size:22px;font-weight:650;letter-spacing:-.02em}.us-n small{font-size:14px;color:var(--mu);font-weight:500}
.us-bar{display:flex;height:12px;border-radius:6px;background:var(--sf2);overflow:hidden;gap:2px}.us-bar i{width:var(--w);background:var(--c)}.us-lg{list-style:none;padding:0;margin:0;display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.us-lg li{display:flex;gap:6px;align-items:center}.us-lg i{width:8px;height:8px;border-radius:2px;background:var(--c)}.us-lg b{font-variant-numeric:tabular-nums}
.us-sp{width:100%;height:60px}.us-sp .a{fill:none;stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke}.us-sp .p{fill:none;stroke:var(--fg);stroke-dasharray:3 3;stroke-opacity:.45;vector-effect:non-scaling-stroke}.us-sp .cap{stroke:var(--err);stroke-opacity:.5;vector-effect:non-scaling-stroke}
.us-w{margin:0;font-size:13px;padding:10px 12px;border-radius:10px}.us-w.warn{background:var(--warn-sf)}.us-w.ok{background:var(--sf)}.us-lim{display:flex;gap:8px;align-items:center;font-size:14px}.us-lim input{width:18px;height:18px;accent-color:var(--fg)}
.us-m summary{cursor:pointer;font-size:14px;font-weight:550;min-height:28px}.us-m ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}.us-m li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:13px}.us-m .av{width:28px;height:28px;font-size:10px}
</style>
<script>
const CAP=20000,F=[["Chat",8200,"var(--fg)"],["Summaries",3900,"#0ea5e9"],["Images",2600,"#d97706"]],d=new Date(),day=d.getDate(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),used=F.reduce((a,f)=>a+f[1],0),proj=Math.round(used/day*dim);
document.getElementById('per').textContent=`${d.toLocaleDateString('en-GB',{month:'long'})} · day ${day} of ${dim}`;document.getElementById('n').innerHTML=`${used.toLocaleString('en')} <small>/ ${CAP.toLocaleString('en')}</small>`;
document.getElementById('bar').innerHTML=F.map(([,v,c])=>`<i style="--w:${v/CAP*100}%;--c:${c}"></i>`).join('');document.getElementById('bar').setAttribute('aria-label',`${used} of ${CAP} credits used`);document.getElementById('lg').innerHTML=F.map(([n,v,c])=>`<li><i style="--c:${c}"></i>${n} <b>${v.toLocaleString('en')}</b></li>`).join('');
let acc=0;const D=Array.from({length:day},(_,i)=>acc+=used/day*(.7+((i*37)%10)/16)),X=i=>i/(dim-1)*300,Y=v=>58-v/(CAP*1.1)*56;
document.getElementById('sp').innerHTML=`<line class="cap" x1="0" x2="300" y1="${Y(CAP)}" y2="${Y(CAP)}"/><path class="a" d="M${D.map((v,i)=>`${X(i)},${Y(v*used/acc)}`).join('L')}"/><path class="p" d="M${X(day-1)},${Y(used)}L300,${Y(proj)}"/>`;
const w=document.getElementById('w'),lim=document.getElementById('lim');function warn(){const over=proj>CAP;w.className='us-w '+(over?'warn':'ok');w.textContent=over?`At this pace you'll use about ${proj.toLocaleString('en')} credits, over the limit around the ${Math.ceil(CAP/(used/day))}th. ${lim.checked?'AI features will pause then.':'Extra usage is billed at €2 per 1,000 credits.'}`:`On pace for about ${proj.toLocaleString('en')} credits. You're within your limit.`}lim.onchange=warn;warn();
document.getElementById('mb').innerHTML=[["Lena K.",6100,'#0f766e'],["Jonas L.",4300,'#7c3aed'],["Sam R.",2800,'#b45309'],["Others",1500,'#64748b']].map(([n,v,c])=>`<li><span class="av" style="--c:${c}">${n[0]}</span><span>${n}</span><b class="tn">${v.toLocaleString('en')}</b></li>`).join('');
</script>

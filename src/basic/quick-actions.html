<!--Quick Actions|Cards|A grid of quick-action tiles for a dashboard home: icon, label and hint per tile, a keyboard shortcut shown on hover, a "New" badge, and a pinned/unpinned state you can toggle.|dashboard,actions,shortcuts,tiles,grid-->
<div class="k"><section class="qa"><header><h2>Quick actions</h2><span class="mu">Press a key to jump</span></header><div class="qa-g" id="g"></div></section></div>
<style>
.qa{width:min(760px,100%)}.qa header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.qa h2{margin:0;font-size:17px;font-weight:650}
.qa-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.qa-t{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s}
.qa-t:hover{border-color:var(--ctl);transform:translateY(-1px);box-shadow:var(--shadow)}.qa-t:active{transform:none}
.qa-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--bg));color:var(--c)}
.qa-t b{font-weight:600}.qa-t small{display:block;margin-top:2px;color:var(--mu);font-size:13px;line-height:17px}
.qa-t kbd{position:absolute;top:12px;right:12px;font:500 11px Geist;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--mu);opacity:0;transition:opacity .15s}
.qa-t:hover kbd,.qa-t:focus-visible kbd{opacity:1}
.qa-t .pill{position:absolute;top:12px;right:12px}.qa-t:hover .pill{opacity:0}
.qa-t.hit{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
</style>
<script>
const A=[["N","New project","Start from a template","#2563eb",'<path d="M12 5v14M5 12h14"/>'],["U","Upload files","Drag in or browse","#16a34a",'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>'],["I","Invite people","Add to this workspace","#9333ea",'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>'],["R","Run report","Weekly numbers as PDF","#ea580c",'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',1],["S","Schedule post","Pick a date and time","#0891b2",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],["K","API keys","Create or revoke","#64748b",'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14 9l2 2"/>']];
g.innerHTML=A.map(([k,n,h,c,ic,nw])=>`<button class="qa-t" style="--c:${c}" data-k="${k}" aria-keyshortcuts="${k}"><span class="qa-ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ic}</svg></span><span><b>${n}</b><small>${h}</small></span>${nw?'<span class="pill info">New</span>':""}<kbd>${k}</kbd></button>`).join("");
const hit=b=>{b.classList.add("hit");b.focus();setTimeout(()=>b.classList.remove("hit"),500)};
g.onclick=e=>{const b=e.target.closest(".qa-t");if(b)hit(b)};
addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;const b=g.querySelector(`[data-k="${e.key.toUpperCase()}"]`);if(b){e.preventDefault();hit(b)}});
</script>

<!--Passkey Sign In|Auth|A passkey-first login: a big “Sign in with passkey” action with an animated fingerprint scan, a fallback to email, and success/cancelled states. Uses WebAuthn feature detection.|auth,passkey,webauthn,biometric,fingerprint-->
<div class="k">
<div class="card pk"><div class="pk-fp" id="fp" aria-hidden="true"><svg viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 46c-2-5-3-9-3-14a17 17 0 0 1 34 0"/><path d="M24 52c-2-6-3-12-3-20a11 11 0 0 1 22 0c0 4 0 8-1 11"/><path d="M32 32c0 9-1 15-4 22"/><path d="M38 32c0 8-1 14-3 20"/><path d="M45 44c1-4 1-8 1-12"/><path d="M14 22a21 21 0 0 1 36 0"/></g></svg><i class="pk-scan"></i></div>
<h1 id="ti">Sign in to Atlas</h1><p class="mu" id="sb">Use Face ID, Touch ID or your security key. Nothing to type, nothing to phish.</p>
<button class="b ac pk-go" id="go">@I(lock,16)Sign in with passkey</button><div class="pk-or"><span>or</span></div><button class="b sec pk-go" id="em">@I(mail,16)Continue with email</button><p class="pk-n mu" id="nt"></p></div>
</div>
<style>
.pk{width:min(380px,100%);padding:36px 28px;text-align:center;display:grid;justify-items:center;gap:6px}.pk h1{margin:16px 0 0;font-size:22px;letter-spacing:-.02em}.pk p{margin:0 0 16px}
.pk-fp{width:88px;height:88px;border-radius:24px;background:var(--sf);color:var(--mu);display:grid;place-items:center;position:relative;overflow:hidden;transition:color .3s,background .3s}.pk-fp svg{width:56px}
.pk-scan{position:absolute;left:0;right:0;height:2px;background:var(--ac);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 20%,transparent);top:0;opacity:0}
.pk-fp.on{color:var(--ac)}.pk-fp.on .pk-scan{opacity:1;animation:pks 1.2s ease-in-out infinite alternate}@keyframes pks{to{top:calc(100% - 2px)}}
.pk-fp.ok{color:var(--ok);background:var(--ok-sf)}.pk-fp.no{color:var(--err);background:var(--err-sf);animation:pkx .35s}@keyframes pkx{25%{translate:-5px}75%{translate:5px}}
.pk-go{width:100%;height:44px}.pk-or{width:100%;display:flex;align-items:center;gap:12px;color:var(--mu);font-size:12px;margin:6px 0}.pk-or::before,.pk-or::after{content:"";flex:1;height:1px;background:var(--line)}.pk-n{font-size:12px;margin:8px 0 0!important}
</style>
<script>
const $=i=>document.getElementById(i),fp=$('fp'),go=$('go');
$('nt').textContent=window.PublicKeyCredential?'This browser supports passkeys.':'This browser can\'t use passkeys. Use email instead.';if(!window.PublicKeyCredential)go.disabled=true;
let n=0;go.onclick=()=>{fp.className='pk-fp on';go.disabled=true;go.textContent='Waiting for your device…';setTimeout(()=>{const ok=n++%2==0;fp.className='pk-fp '+(ok?'ok':'no');go.disabled=false;if(ok){$('ti').textContent='Welcome back, Lena';$('sb').textContent='Signed in with the passkey on this device.';go.innerHTML='Continue to Atlas'}else{$('sb').textContent='The request was cancelled. Try again or use email.';go.innerHTML='Try again'}},1600)};
$('em').onclick=e=>{e.currentTarget.textContent='Opening email sign-in…'};
</script>

<!--Notification Matrix|Settings|Notification preferences as a matrix: events down the side, email/push/in-app across the top, with column toggles, a “mute all for 1 hour / until tomorrow” snooze, and quiet hours.|settings,notifications,matrix,checkbox,snooze-->
<div class="k nm"><div class="nm-w"><div class="nm-h"><h1>Notifications</h1><div class="nm-sn"><label for="sn" class="mu">Pause all</label><select class="in" id="sn"><option value="">Off</option><option value="1h">For 1 hour</option><option value="tm">Until tomorrow 09:00</option><option value="wk">For a week</option></select></div></div><p class="nm-ps" id="ps" role="status" hidden></p>
<div class="nm-tw"><table class="nm-t" id="t"></table></div>
<section class="nm-q"><div><b>Quiet hours</b><span class="mu">Push notifications wait until the morning.</span></div><div class="nm-qt"><label><span class="vh">From</span><input class="in" type="time" value="22:00"></label><span class="mu">to</span><label><span class="vh">To</span><input class="in" type="time" value="08:00"></label></div></section></div></div>
<style>
.k.nm{align-items:start}.nm-w{width:min(720px,100%);display:grid;gap:16px}.nm-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.nm-h h1{margin:0;font-size:24px;letter-spacing:-.02em}.nm-sn{display:flex;gap:10px;align-items:center;font-size:14px}.nm-sn .in{width:auto;height:36px}
.nm-ps{margin:0;padding:10px 14px;border-radius:10px;background:var(--warn-sf);font-size:14px}
.nm-tw{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow-x:auto;position:relative}.nm-t{width:100%;border-collapse:collapse;font-size:14px}.nm-t th,.nm-t td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:center}.nm-t th:first-child,.nm-t td:first-child{text-align:left}.nm-t tr:last-child td{border:0}
.nm-t thead th{font-weight:550;font-size:13px}.nm-t thead button{display:grid;justify-items:center;gap:2px;margin:0 auto;font:inherit;min-height:44px;padding:0 6px;border-radius:8px}.nm-t thead button:hover{background:var(--sf)}.nm-t thead small{font-size:11px;color:var(--mu);font-weight:400}
.nm-t td small{display:block;color:var(--mu);font-size:12px}.nm-t .grp td{background:var(--sf);font-size:12px;font-weight:650;color:var(--mu);padding:8px 16px}
.nm-t input{width:20px;height:20px;accent-color:var(--ac);cursor:pointer}.nm-w.paused .nm-t tbody{opacity:.5}
.nm-q{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);flex-wrap:wrap}.nm-q>div:first-child{display:grid}.nm-q span.mu{font-size:13px}.nm-qt{display:flex;gap:8px;align-items:center}.nm-qt .in{width:auto;height:38px}
</style>
<script>
const CH=['Email','Push','In-app'],G=[["Your work",[["Mentions","Someone @mentions you",[1,1,1]],["Replies","Replies to your comments",[1,0,1]],["Assigned to you","Tasks and reviews",[1,1,1]]]],["Team",[["New members","Someone joins the workspace",[0,0,1]],["Weekly digest","Monday summary",[1,0,0]]]],["Account",[["Security alerts","New sign-ins, password changes",[1,1,1],1]]]];
const t=document.getElementById('t');
function draw(){t.innerHTML=`<thead><tr><th>Event</th>${CH.map((c,j)=>`<th><button data-col="${j}" aria-label="Toggle all ${c}">${c}<small>toggle all</small></button></th>`).join('')}</tr></thead><tbody>${G.map(([g,R],gi)=>`<tr class="grp"><td colspan="4">${g}</td></tr>${R.map(([n,d,v,lock],ri)=>`<tr><td>${n}<small>${d}${lock?' · always on':''}</small></td>${v.map((x,j)=>`<td><input type="checkbox" ${x?'checked':''} ${lock?'disabled':''} data-g="${gi}" data-r="${ri}" data-c="${j}" aria-label="${n} by ${CH[j]}"></td>`).join('')}</tr>`).join('')}`).join('')}</tbody>`}
t.onchange=e=>{const i=e.target;G[i.dataset.g][1][i.dataset.r][2][i.dataset.c]=i.checked?1:0};
t.onclick=e=>{const b=e.target.closest('[data-col]');if(!b)return;const j=+b.dataset.col,rows=G.flatMap(g=>g[1]).filter(r=>!r[3]),on=rows.some(r=>!r[2][j]);rows.forEach(r=>r[2][j]=on?1:0);draw();t.querySelector(`[data-col="${j}"]`).focus()};
document.getElementById('sn').onchange=e=>{const v=e.target.value,ps=document.getElementById('ps');document.querySelector('.nm-w').classList.toggle('paused',!!v);ps.hidden=!v;const u={'1h':new Date(Date.now()+36e5).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),tm:'tomorrow 09:00',wk:new Date(Date.now()+6048e5).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}[v];ps.textContent=v?`All notifications paused until ${u}. Security alerts still come through.`:''};draw();
</script>

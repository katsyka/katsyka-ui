<!--Technical Spec Sheet|Features|A hardware spec sheet laid out like a printed datasheet: grouped specs in a two-column definition list, a model switcher that highlights changed values, and a downloadable spec as text.|features,specs,hardware,datasheet,comparison-->
<div class="k"><section class="sp4"><div class="sp4-h"><div><h2>Kestrel 14 · technical specifications</h2><p class="mu">Values that differ between models are marked.</p></div><div class="sp4-m" role="radiogroup" aria-label="Model" id="m"><button role="radio" aria-checked="true" data-m="0">Kestrel 14</button><button role="radio" aria-checked="false" data-m="1">Kestrel 14 Pro</button></div></div><div class="sp4-g" id="g"></div><button class="b sec sm" id="dl">@I(download,14)Download as text</button></section></div>
<style>
.sp4{width:min(860px,100%);display:grid;gap:20px}.sp4-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.sp4-h h2{margin:0;font-size:24px;letter-spacing:-.02em}.sp4-h p{margin:4px 0 0;font-size:14px}
.sp4-m{display:flex;background:var(--sf2);border-radius:10px;padding:3px}.sp4-m button{height:34px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:550;color:var(--mu)}.sp4-m [aria-checked=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px #0000001a}
.sp4-g{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;border-top:2px solid var(--fg)}.sp4-s{padding:18px 0;border-bottom:1px solid var(--line)}.sp4-s h3{margin:0 0 10px;font-size:13px;font-weight:650}.sp4-s dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}.sp4-s dt{color:var(--mu)}.sp4-s dd{margin:0;font-variant-numeric:tabular-nums}.sp4-s dd.ch{font-weight:650}.sp4-s dd.ch::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-left:8px;vertical-align:middle}.sp4-s dd.fl{animation:spf 1s}@keyframes spf{0%{background:var(--ac-sf)}100%{background:transparent}}
#dl{justify-self:start}@media (max-width:700px){.sp4-g{grid-template-columns:1fr}}
</style>
<script>
const S=[["Display",[["Size","14.2″","14.2″"],["Resolution","2880 × 1800","3024 × 1964"],["Refresh","60 Hz","120 Hz adaptive"],["Brightness","500 nits","1,000 nits"]]],["Performance",[["Chip","K3, 8-core","K3 Pro, 12-core"],["Memory","16 GB","32 GB"],["Storage","512 GB","1 TB"]]],["Battery & power",[["Battery","70 Wh","72 Wh"],["Video playback","Up to 18 h","Up to 20 h"],["Charger","65 W USB-C","96 W USB-C"]]],["Size & weight",[["Thickness","14.9 mm","15.5 mm"],["Weight","1.38 kg","1.55 kg"]]],["Ports",[["USB-C / TB4","2","3"],["HDMI","None","HDMI 2.1"],["Card reader","None","SDXC"]]],["Wireless",[["Wi-Fi","Wi-Fi 7","Wi-Fi 7"],["Bluetooth","5.4","5.4"]]]];let m=0;
function draw(fl){document.getElementById('g').innerHTML=S.map(([g,R])=>`<section class="sp4-s"><h3>${g}</h3><dl>${R.map(([k,a,b])=>`<dt>${k}</dt><dd class="${a!==b?'ch':''}${fl&&a!==b?' fl':''}">${m?b:a}</dd>`).join('')}</dl></section>`).join('')}
document.getElementById('m').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));m=+b.dataset.m;draw(1)};
document.getElementById('dl').onclick=()=>{const t=`${m?'Kestrel 14 Pro':'Kestrel 14'}\n\n`+S.map(([g,R])=>g+'\n'+R.map(([k,a,b])=>`  ${k}: ${m?b:a}`).join('\n')).join('\n\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='kestrel-14-specs.txt';a.click()};draw();
</script>

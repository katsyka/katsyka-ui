<!--Juice Brand Landing|Landings|A cold-pressed juice brand page where a bottle switcher swaps the hero colour, ingredient list and nutrition per bottle, plus a subscription builder that mixes six bottles a week with a live price.|landing,drinks,product,colourful,subscription-->
<div class="k pg ju" id="pg">
<header class="top"><div class="w"><a class="logo" href="#">PRESSD</a><nav class="links"><a href="#hero">Bottles</a><a href="#box">Weekly box</a></nav><a class="b ac" href="#box">Build a box</a><button class="menu ibt" aria-label="Menu" aria-expanded="false">@I(list,22)</button></div></header>
<section class="ju-hero" id="hero"><div class="w ju-in"><div class="ju-tx"><p class="eb" id="kc"></p><h1 class="ju-t" id="nm"></h1><p class="ju-d" id="ds"></p><ul class="ju-ing" id="ing"></ul></div>
<div class="ju-bot" aria-hidden="true"><div class="ju-cap"></div><div class="ju-b" id="bt"><span id="lb"></span></div></div></div>
<div class="w ju-sw" role="radiogroup" aria-label="Choose a juice" id="sw"></div></section>
<section class="w ju-box" id="box"><h2 class="h2">Your weekly six</h2><p class="lead">Tap a bottle to add it. Tap a slot to remove it. Delivered cold every Monday.</p>
<div class="ju-slots" id="slots"></div><div class="ju-add" id="add"></div><div class="ju-tot"><span id="tot">0 of 6 · €0.00</span><button class="b ac lg" id="go" disabled>Subscribe</button></div><p role="status" id="st" class="ju-st"></p></section>
<footer class="foot"><div class="w"><span>PRESSD is demo content.</span><span>Pause or skip any week.</span></div></footer>
</div>
<style>
.ju{--c:#ff7a1a;--t:#fff2e6;--k:#3d1600}
.ju .b.ac{background:var(--k);color:var(--t)}
.ju-hero{background:var(--c);color:var(--k);padding:48px 0 32px;transition:background .45s var(--ease),color .45s var(--ease)}.ju-hero .eb{color:inherit;opacity:.75}
.ju-in{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}.ju-t{font-size:clamp(56px,10vw,128px);line-height:.88;letter-spacing:-.05em;font-weight:900;text-transform:uppercase;margin:12px 0!important}.ju-d{font-size:19px;max-width:34ch;line-height:1.45}
.ju-ing{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-wrap:wrap;gap:8px}.ju-ing li{border:2px solid currentColor;border-radius:99px;padding:6px 12px;font-weight:650;font-size:14px}
.ju-bot{display:grid;justify-items:center}.ju-cap{width:64px;height:34px;background:var(--k);border-radius:8px 8px 2px 2px}.ju-b{width:170px;height:330px;border-radius:30px 30px 26px 26px;background:var(--t);display:grid;place-items:center;transition:transform .45s var(--ease)}.ju-b span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;font-size:40px;letter-spacing:-.02em;color:var(--c)}
.ju-b.sw{animation:jub .45s var(--ease)}@keyframes jub{40%{transform:rotate(-6deg) translateY(-8px)}}
.ju-sw{display:flex;gap:10px;margin-top:32px!important;flex-wrap:wrap}.ju-sw button{width:48px;height:48px;border-radius:50%;border:3px solid var(--t);cursor:pointer}.ju-sw button[aria-checked=true]{outline:3px solid var(--k);outline-offset:2px}
.ju-box{padding:72px 0}.ju-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:28px 0 16px}.ju-slot{aspect-ratio:3/5;border-radius:14px;border:2px dashed var(--line);background:none;display:grid;place-items:end center;padding:8px;font:700 12px Geist,sans-serif;color:inherit;cursor:pointer}.ju-slot.f{border:0;animation:jui .25s var(--ease)}@keyframes jui{from{transform:scale(.85)}}
.ju-add{display:flex;flex-wrap:wrap;gap:8px}.ju-add button{height:44px;padding:0 14px 0 8px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--fg);display:flex;align-items:center;gap:8px;font:500 14px Geist,sans-serif;cursor:pointer}.ju-add i{width:28px;height:28px;border-radius:50%}.ju-add button:disabled{opacity:.4}
.ju-tot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;font-weight:650;font-size:18px;font-variant-numeric:tabular-nums}.ju-st{margin-top:10px!important;color:var(--mu)}
@media (max-width:760px){.ju-in{grid-template-columns:1fr}.ju-bot{display:none}.ju-slots{grid-template-columns:repeat(3,1fr)}}
</style>
<script>
const J=[['Sunrise','#ff7a1a','#fff2e6','#3d1600','Carrot, orange, turmeric, ginger. Tastes like a warm morning.',['Carrot','Orange','Turmeric','Ginger'],'110 kcal · 22g sugar'],['Greenhouse','#4cc16b','#ecfbef','#0f3319','Cucumber, celery, apple, lime and a lot of spinach.',['Cucumber','Celery','Apple','Spinach','Lime'],'70 kcal · 12g sugar'],['Beet It','#c2185b','#ffe6f0','#fff','Beetroot, apple, lemon. Earthy, sharp, very red.',['Beetroot','Apple','Lemon'],'95 kcal · 18g sugar'],['Pineapple Mint','#ffd23f','#fffbe0','#3a2f00','Pineapple, mint, a pinch of salt. Summer in a bottle.',['Pineapple','Mint','Sea salt'],'120 kcal · 24g sugar'],['Blue Lagoon','#3a86ff','#e6efff','#fff','Coconut water, blue spirulina, lime.',['Coconut water','Spirulina','Lime'],'45 kcal · 8g sugar']];
const pg=document.getElementById('pg'),sw=document.getElementById('sw'),bt=document.getElementById('bt');let cur=0;
function set(i){cur=i;const j=J[i];pg.style.setProperty('--c',j[1]);pg.style.setProperty('--t',j[2]);pg.style.setProperty('--k',j[3]);document.getElementById('nm').textContent=j[0];document.getElementById('lb').textContent=j[0];document.getElementById('ds').textContent=j[4];document.getElementById('kc').textContent=j[6]+' · 330ml';document.getElementById('ing').innerHTML=j[5].map(x=>`<li>${x}</li>`).join('');sw.querySelectorAll('button').forEach((b,k)=>{b.setAttribute('aria-checked',k===i);b.tabIndex=k===i?0:-1});bt.classList.remove('sw');void bt.offsetWidth;bt.classList.add('sw')}
J.forEach((j,i)=>{const b=document.createElement('button');b.role='radio';b.style.background=j[1];b.setAttribute('aria-label',j[0]);b.onclick=()=>set(i);sw.append(b)});
sw.onkeydown=e=>{if(!/Arrow(Right|Left)/.test(e.key))return;const n=(cur+(e.key==='ArrowRight'?1:J.length-1))%J.length;set(n);sw.children[n].focus()};set(0);
const box=[],slots=document.getElementById('slots'),add=document.getElementById('add'),tot=document.getElementById('tot'),go=document.getElementById('go');
J.forEach((j,i)=>{const b=document.createElement('button');b.innerHTML=`<i style="background:${j[1]}"></i>${j[0]}`;b.setAttribute('aria-label','Add '+j[0]);b.onclick=()=>{if(box.length<6){box.push(i);draw()}};add.append(b)});
function draw(){slots.innerHTML='';for(let k=0;k<6;k++){const s=document.createElement('button');s.className='ju-slot';const i=box[k];if(i!=null){s.classList.add('f');s.style.background=J[i][1];s.style.color=J[i][3]==='#fff'?'#fff':J[i][3];s.textContent=J[i][0];s.setAttribute('aria-label','Remove '+J[i][0]);s.onclick=()=>{box.splice(k,1);draw()}}else{s.setAttribute('aria-label','Empty slot');s.tabIndex=-1}slots.append(s)}const n=box.length;tot.textContent=`${n} of 6 · €${(n*4.5).toFixed(2)}`;go.disabled=n<6;add.querySelectorAll('button').forEach(b=>b.disabled=n>=6)}draw();
go.onclick=()=>{go.disabled=true;go.textContent='Saving…';setTimeout(()=>{go.textContent='Subscribe';document.getElementById('st').textContent='Box saved. First delivery next Monday. (Demo)'},800)};
</script>

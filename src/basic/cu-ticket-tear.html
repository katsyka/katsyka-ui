<!--Tear-off Ticket|Custom|A paper ticket with a perforated stub: drag the stub down (or press Enter) to tear it along the perforation; it rips progressively with a jagged edge, falls away with a slight spin, and reveals “Admitted”.|custom,ticket,tear,perforation,drag,gesture-->
<div class="k tt2"><div class="tt2-w"><div class="tt2-tk"><div class="tt2-m"><span class="tt2-e">EDGECASE 2027</span><b>Two-day pass</b><dl><div><dt>Holder</dt><dd>Sam Rivera</dd></div><div><dt>Gate</dt><dd>B</dd></div><div><dt>Doors</dt><dd>08:30</dd></div></dl><p class="tt2-ad" id="ad" aria-live="polite"></p></div><div class="tt2-pf" aria-hidden="true"></div><button class="tt2-st" id="st" aria-label="Tear off the stub to check in"><span>ADMIT ONE</span><code>EC27-4418</code><small>drag down to tear</small></button></div><button class="b gh sm" id="rs" hidden>Reset ticket</button></div></div>
<style>
.k.tt2{background:light-dark(#e9e4da,#151412)}.tt2-w{display:grid;gap:14px;justify-items:center}.tt2-tk{width:min(320px,90vw);filter:drop-shadow(0 12px 20px #0003)}
.tt2-m{background:#fbf7ee;color:#1c1917;border-radius:12px 12px 0 0;padding:22px;display:grid;gap:10px}.tt2-e{font:700 11px 'Geist Mono',monospace;letter-spacing:.14em;color:#b45309}.tt2-m b{font-size:24px;letter-spacing:-.02em}.tt2-m dl{display:flex;gap:20px;margin:0}.tt2-m dt{font-size:11px;color:#78716c}.tt2-m dd{margin:0;font-weight:650}.tt2-ad{margin:0;font:700 14px 'Geist Mono',monospace;color:#15803d;letter-spacing:.06em;min-height:20px}
.tt2-pf{height:14px;background:radial-gradient(circle at 7px 7px,transparent 5px,#fbf7ee 5.5px) -7px 0/14px 14px repeat-x,#fbf7ee;-webkit-mask:radial-gradient(circle at 0 7px,transparent 7px,#000 7.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 7px,transparent 7px,#000 7.5px) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 7px,transparent 7px,#000 7.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 7px,transparent 7px,#000 7.5px) right/51% 100% no-repeat;border-top:2px dashed #d6cfc1}
.tt2-st{width:100%;background:#fbf7ee;color:#1c1917;border-radius:0 0 12px 12px;padding:16px 22px 18px;display:grid;gap:4px;text-align:left;touch-action:none;cursor:grab;transform-origin:var(--ox,10%) 0;transform:translateY(var(--dy,0px)) rotate(var(--rot,0deg));clip-path:polygon(var(--clip));transition:none}.tt2-st span{font:800 18px Geist,sans-serif;letter-spacing:.1em}.tt2-st code{font:13px 'Geist Mono',monospace;color:#57534e}.tt2-st small{font-size:11px;color:#a8a29e}
.tt2-st.fall{transition:transform .9s cubic-bezier(.5,0,.75,0),opacity .9s;transform:translateY(420px) rotate(24deg);opacity:0;pointer-events:none}.tt2-st:focus-visible{outline:2px solid #2563eb;outline-offset:3px}
</style>
<script>
const st=document.getElementById('st'),ad=document.getElementById('ad'),rs=document.getElementById('rs');let p=0,dr=false,y0=0;
function tear(pr){p=pr;const w=Math.round(p*100),pts=['0% 0%'];for(let i=0;i<=w;i+=5)pts.push(`${i}% ${i%10?6:0}px`);pts.push(`${w}% 0%`,'100% 0%','100% 100%','0% 100%');st.style.setProperty('--clip',pts.join(','));st.style.setProperty('--ox',w+'%');st.style.setProperty('--rot',(p*4)+'deg');st.style.setProperty('--dy',(p*10)+'px')}
function done(){st.classList.add('fall');ad.textContent='✓ ADMITTED · 08:41';rs.hidden=false;rs.focus()}
st.onpointerdown=e=>{if(st.classList.contains('fall'))return;dr=true;y0=e.clientY;st.setPointerCapture(e.pointerId)};st.onpointermove=e=>{if(!dr)return;tear(Math.max(0,Math.min(1,(e.clientY-y0)/140)));if(p>=1){dr=false;done()}};
st.onpointerup=()=>{if(!dr)return;dr=false;if(p>.6){tear(1);done()}else{const f=()=>{tear(Math.max(0,p-.08));if(p>0)requestAnimationFrame(f)};f()}};
st.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();let q=0;const f=()=>{q+=.08;tear(Math.min(1,q));q<1?requestAnimationFrame(f):done()};f()}};
rs.onclick=()=>{st.classList.remove('fall');tear(0);ad.textContent='';rs.hidden=true;st.focus()};tear(0);
</script>

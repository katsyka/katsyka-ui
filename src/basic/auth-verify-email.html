<div class="k">

<h1 id="h">Verify your email</h1><p class="mu" id="p">We sent a confirmation link to <b>maya@hey.example</b>. Click it to activate your account.</p>

</div>
<style>
.ve{width:min(420px,100%);padding:32px;text-align:center;display:grid;justify-items:center}.ve h1{margin:16px 0 6px;font-size:22px;letter-spacing:-.02em}.ve p{margin:0}

<script>

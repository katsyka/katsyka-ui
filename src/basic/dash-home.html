<!--Smart Home Dashboard|Dashboards|A home control panel: rooms as tabs, light dimmers with real sliders, a thermostat dial you drag, door lock with hold-to-unlock, and an energy-today bar.|dashboard,smart home,iot,controls,thermostat-->
<div class="k db">
<aside class="db-side" aria-label="Main"><div class="db-brand"><i>⌂</i>Hearth</div><a href="#" aria-current="page">@I(home,18)Rooms</a><a href="#">@I(bolt,18)Energy</a><a href="#">@I(repeat,18)Automations</a><a href="#">@I(shield,18)Security</a><div class="db-user"><span class="av" style="--c:#b45309">FO</span><div><b>The Okoro home</b><span>4 people</span></div></div></aside>
<main class="db-main"><header class="db-top"><button class="db-mb ibt" aria-label="Open navigation" aria-expanded="false">@I(list,20)</button><h1>Rooms</h1><span class="sp"></span><span class="mu tn">Outside 6°C · rain</span></header>
<div class="db-body"><div class="sh-tb" role="tablist" id="tb"></div><div class="sh-g">
<section class="db-card"><div class="db-ch"><h2>Lights</h2><button class="b gh sm" id="ao">All off</button></div><div id="li" class="sh-li"></div></section>
<section class="db-card sh-th"><div class="db-ch"><h2>Heating</h2><span class="pill" id="hs">Heating</span></div><div class="sh-dial" id="dl" role="slider" tabindex="0" aria-label="Target temperature" aria-valuemin="15" aria-valuemax="26"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="80" class="tr"/><circle cx="100" cy="100" r="80" class="fl" id="fl"/><circle r="11" id="kn" class="kn"/></svg><div class="sh-dv"><b class="tn" id="tv">21.0°</b><span class="mu" id="cv">Now 19.4°</span></div></div></section>
<section class="db-card"><div class="db-ch"><h2>Front door</h2><span class="pill ok" id="ls">Locked</span></div><button class="sh-lk" id="lk" aria-describedby="lh"><span class="sh-pr" id="pr"></span>@I(lock,22)<span id="lt">Hold to unlock</span></button><p class="mu" id="lh" style="font-size:12px;margin:8px 0 0">Press and hold for one second. Locks itself after 2 minutes.</p></section>
<section class="db-card"><div class="db-ch"><h2>Energy today</h2><b class="tn">8.4 kWh</b></div><div class="sh-en" id="en"></div><div class="sh-el mu"><span>00</span><span>12</span><span>24</span></div></section></div></div></main>
</div>
<style>
.sh-tb{display:flex;gap:6px;overflow-x:auto}.sh-tb button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:550;white-space:nowrap}.sh-tb [aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sh-g{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.sh-li{display:grid;gap:12px}.sh-l{display:grid;grid-template-columns:40px 1fr 44px;gap:12px;align-items:center}.sh-l .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sf2);color:var(--mu);transition:background .2s,color .2s}.sh-l.on .ic{background:color-mix(in srgb,#f59e0b calc(var(--v)*1%),var(--sf2));color:#fff}.sh-l div{display:grid;gap:2px}.sh-l input[type=range]{width:100%;accent-color:#d97706}.sh-l small{color:var(--mu);font-size:12px}
.sh-sw{width:44px;height:26px;border-radius:13px;background:var(--ctl);position:relative;transition:background .2s}.sh-sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s cubic-bezier(.23,1,.32,1)}.sh-sw[aria-checked=true]{background:#d97706}.sh-sw[aria-checked=true]::after{transform:translateX(18px)}
.sh-dial{position:relative;width:200px;height:200px;margin:0 auto;touch-action:none;cursor:grab;border-radius:50%}.sh-dial svg{width:100%;height:100%;transform:rotate(135deg)}.sh-dial .tr,.sh-dial .fl{fill:none;stroke-width:12;stroke-linecap:round}.sh-dial .tr{stroke:var(--sf2);stroke-dasharray:377 503}.sh-dial .fl{stroke:#ea580c;stroke-dasharray:0 503;transition:stroke .3s}.sh-dial .kn{fill:var(--bg);stroke:#ea580c;stroke-width:3}.sh-dial.cool .fl,.sh-dial.cool .kn{stroke:#0284c7}
.sh-dv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.sh-dv b{font-size:40px;letter-spacing:-.03em}.sh-dv span{font-size:13px}
.sh-lk{width:100%;height:72px;border-radius:14px;border:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:center;font-weight:600;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}.sh-lk>*{position:relative}.sh-pr{position:absolute!important;inset:0;background:var(--ok-sf);transform:scaleX(0);transform-origin:left}.sh-lk:active{transform:scale(.99)}
.sh-en{display:flex;align-items:flex-end;gap:2px;height:90px}.sh-en i{flex:1;background:color-mix(in srgb,var(--ac) 70%,transparent);border-radius:2px 2px 0 0;height:var(--h)}.sh-en i.f{background:var(--sf2)}.sh-el{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
@media (max-width:900px){.sh-g{grid-template-columns:1fr}}
</style>
<script>
const R={"Living room":[["Ceiling",80,1],["Floor lamp",40,1],["Shelf strip",0,0]],"Kitchen":[["Pendants",100,1],["Under-cabinet",60,0]],"Bedroom":[["Bedside left",20,1],["Bedside right",0,0]],"Office":[["Desk lamp",90,1]]};let room="Living room";
const tb=document.getElementById('tb'),li=document.getElementById('li');tb.innerHTML=Object.keys(R).map(r=>`<button role="tab" aria-selected="${r===room}">${r}</button>`).join('');
tb.onclick=e=>{const b=e.target.closest('button');if(!b)return;room=b.textContent;tb.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));lights()};
function lights(){li.innerHTML=R[room].map(([n,v,on],i)=>`<div class="sh-l${on?' on':''}" style="--v:${on?v:0}"><span class="ic">@I(sun,18)</span><div><b>${n}</b><input type="range" min="0" max="100" value="${v}" data-i="${i}" aria-label="${n} brightness"><small class="tn">${on?v+'%':'Off'}</small></div><button class="sh-sw" role="switch" aria-checked="${!!on}" aria-label="${n}" data-t="${i}"></button></div>`).join('')}
li.oninput=e=>{const i=+e.target.dataset.i,L=R[room][i];L[1]=+e.target.value;L[2]=L[1]>0?1:0;const row=e.target.closest('.sh-l');row.classList.toggle('on',!!L[2]);row.style.setProperty('--v',L[1]);row.querySelector('small').textContent=L[2]?L[1]+'%':'Off';row.querySelector('.sh-sw').setAttribute('aria-checked',!!L[2])};
li.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const L=R[room][+b.dataset.t];L[2]=L[2]?0:1;if(L[2]&&!L[1])L[1]=60;lights();li.querySelector(`[data-t="${b.dataset.t}"]`).focus()};
document.getElementById('ao').onclick=()=>{R[room].forEach(L=>L[2]=0);lights()};lights();
const dl=document.getElementById('dl'),fl=document.getElementById('fl'),kn=document.getElementById('kn');let T=21;const MIN=15,MAX=26,CUR=19.4;
function setT(v){T=Math.round(Math.max(MIN,Math.min(MAX,v))*2)/2;const p=(T-MIN)/(MAX-MIN),a=p*270*Math.PI/180;fl.setAttribute('stroke-dasharray',`${377*p} 503`);kn.setAttribute('cx',100+80*Math.cos(a));kn.setAttribute('cy',100+80*Math.sin(a));document.getElementById('tv').textContent=T.toFixed(1)+'°';dl.setAttribute('aria-valuenow',T);dl.setAttribute('aria-valuetext',T.toFixed(1)+' degrees');const heat=T>CUR;dl.classList.toggle('cool',!heat);document.getElementById('hs').textContent=heat?'Heating to '+T.toFixed(1)+'°':'Idle';document.getElementById('hs').className='pill '+(heat?'warn':'')}
const ang=e=>{const r=dl.getBoundingClientRect();let a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI-135;a=(a+360)%360;if(a>300)a=0;return Math.min(270,a)};
dl.onpointerdown=e=>{dl.setPointerCapture(e.pointerId);setT(MIN+ang(e)/270*(MAX-MIN));dl.onpointermove=m=>setT(MIN+ang(m)/270*(MAX-MIN))};dl.onpointerup=()=>dl.onpointermove=null;
dl.onkeydown=e=>{if(['ArrowUp','ArrowRight'].includes(e.key)){setT(T+.5);e.preventDefault()}if(['ArrowDown','ArrowLeft'].includes(e.key)){setT(T-.5);e.preventDefault()}};setT(21);
const lk=document.getElementById('lk'),pr=document.getElementById('pr');let hold=null,locked=true,t0;
const lock=s=>{locked=s;document.getElementById('ls').textContent=s?'Locked':'Unlocked';document.getElementById('ls').className='pill '+(s?'ok':'warn');document.getElementById('lt').textContent=s?'Hold to unlock':'Tap to lock';pr.style.transform='scaleX(0)'};
lk.onpointerdown=e=>{if(!locked){lock(true);return}t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/1000);pr.style.transform=`scaleX(${p})`;if(p>=1){lock(false);hold=null;return}hold=requestAnimationFrame(f)};hold=requestAnimationFrame(f)};
const cancel=()=>{if(hold){cancelAnimationFrame(hold);hold=null;pr.style.transition='transform .2s';pr.style.transform='scaleX(0)';setTimeout(()=>pr.style.transition='',200)}};lk.onpointerup=lk.onpointerleave=cancel;
lk.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();lock(!locked)}};
const h=new Date().getHours();document.getElementById('en').innerHTML=Array.from({length:24},(_,i)=>`<i class="${i>h?'f':''}" style="--h:${i>h?3:Math.round(15+Math.abs(Math.sin(i/3.8))*60+(i>17&&i<22?25:0))}%"></i>`).join('');
</script>

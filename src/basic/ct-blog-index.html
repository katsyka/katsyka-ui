<!--Blog Index|Content|A blog index with a featured post, tag filter that syncs to the URL, posts as a typographic list with dates and reading times (no card grid), and a “load more” that appends with focus moving to the first new post.|blog,index,list,tags,pagination,editorial-->
<div class="k pg bi"><div class="w bi-w"><h1>Writing</h1><a class="bi-ft" href="#"><img src="media/pics/w/1040.jpg" alt=""><div><span class="mu">Featured · 12 min read</span><h2>The castle that taught us about caching</h2><p class="mu">A 19th-century fortress, a broken booking site and the CDN rule that fixed both.</p></div></a>
<div class="bi-tg" role="group" aria-label="Filter by topic" id="tg"></div><ol class="bi-l" id="l"></ol><button class="b sec" id="mo">Load more posts</button></div></div>
<style>
.bi-w{width:min(820px,100% - 32px);padding:56px 0 96px}.bi-w h1{margin:0 0 28px;font-size:40px;letter-spacing:-.03em}
.bi-ft{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;color:inherit;text-decoration:none;align-items:center;margin-bottom:40px}.bi-ft img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px}.bi-ft div{display:grid;gap:8px}.bi-ft span{font-size:13px}.bi-ft h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}.bi-ft:hover h2{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}.bi-ft p{margin:0}
.bi-tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bi-tg button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}.bi-tg [aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bi-l{list-style:none;padding:0;margin:0 0 24px}.bi-l li{border-bottom:1px solid var(--line);animation:bif .3s cubic-bezier(.23,1,.32,1)}@keyframes bif{from{opacity:0;transform:translateY(4px)}}.bi-l a{display:grid;grid-template-columns:110px 1fr auto;gap:16px;padding:18px 0;color:inherit;text-decoration:none;align-items:baseline;outline-offset:4px}.bi-l time{font:13px 'Geist Mono',monospace;color:var(--mu)}.bi-l b{font-size:18px;font-weight:600;letter-spacing:-.01em}.bi-l a:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}.bi-l span{font-size:13px;color:var(--mu);white-space:nowrap}
@media (max-width:640px){.bi-ft{grid-template-columns:1fr}.bi-l a{grid-template-columns:1fr}.bi-l span{display:none}}
</style>
<script>
const T=['All','Engineering','Design','Company'],P=[["2026-11-10","What we learned moving 40 TB off the cloud","Engineering",9],["2026-11-03","A field guide to accessible colour","Design",14],["2026-10-27","We're now 40 people. Here's what changed","Company",6],["2026-10-20","Debugging a memory leak with heap snapshots","Engineering",11],["2026-10-13","Why our icons have 1.5px strokes","Design",5],["2026-10-06","The four-day week, one year in","Company",8],["2026-09-29","Postgres 17 upgrade, zero downtime","Engineering",12],["2026-09-22","Designing empty states that help","Design",7],["2026-09-15","Our new office is a former bakery","Company",4]];
const l=document.getElementById('l');let tag=(location.hash.match(/tag=(\w+)/)||[])[1]||'All',n=5;
document.getElementById('tg').innerHTML=T.map(t=>`<button aria-pressed="${t===tag}" data-t="${t}">${t}</button>`).join('');
function draw(focusFrom){const L=P.filter(p=>tag==='All'||p[2]===tag);l.innerHTML=L.slice(0,n).map(([d,t,c,m],i)=>`<li><a href="#" data-i="${i}"><time datetime="${d}">${new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</time><b>${t}</b><span>${c} · ${m} min</span></a></li>`).join('');document.getElementById('mo').hidden=L.length<=n;if(focusFrom!=null){const a=l.querySelector(`[data-i="${focusFrom}"]`);a&&a.focus()}}
document.getElementById('tg').onclick=e=>{const b=e.target.closest('button');if(!b)return;tag=b.dataset.t;n=5;document.querySelectorAll('#tg button').forEach(x=>x.setAttribute('aria-pressed',x===b));try{history.replaceState(null,'',tag==='All'?'#':'#tag='+tag)}catch(_){}draw()};
document.getElementById('mo').onclick=()=>{const k=n;n+=4;draw(k)};draw();
</script>

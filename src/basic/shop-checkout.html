<!--One-page Checkout|Commerce|A single-page checkout: contact, delivery address with country-aware postcode, shipping method cards with dates, payment method tabs, an order summary that collapses on mobile, and inline validation on blur.|ecommerce,checkout,form,payment,shipping-->
<div class="k pg ck"><div class="w ck-g"><form class="ck-f" id="f" novalidate><h1>Checkout</h1>
<section><h2>Contact</h2><label><span class="lbl">Email</span><input class="in" name="email" type="email" autocomplete="email" required data-m="Enter an email for the receipt."><small class="ck-e"></small></label></section>
<section><h2>Delivery</h2><div class="ck-2"><label><span class="lbl">First name</span><input class="in" autocomplete="given-name" required data-m="Required."><small class="ck-e"></small></label><label><span class="lbl">Last name</span><input class="in" autocomplete="family-name" required data-m="Required."><small class="ck-e"></small></label></div><label><span class="lbl">Address</span><input class="in" autocomplete="street-address" required data-m="Enter a street address."><small class="ck-e"></small></label><div class="ck-3"><label><span class="lbl">Country</span><select class="in" id="cy" autocomplete="country"><option value="NL">Netherlands</option><option value="DE">Germany</option><option value="GB">United Kingdom</option></select></label><label><span class="lbl">Postcode</span><input class="in" id="pc" autocomplete="postal-code" required data-m=""><small class="ck-e"></small></label><label><span class="lbl">City</span><input class="in" autocomplete="address-level2" required data-m="Required."><small class="ck-e"></small></label></div></section>
<section><h2>Shipping</h2><div class="ck-sh" role="radiogroup" id="sh"></div></section>
<section><h2>Payment</h2><div class="ck-pt" role="tablist"><button type="button" role="tab" aria-selected="true">Card</button><button type="button" role="tab" aria-selected="false">iDEAL</button><button type="button" role="tab" aria-selected="false">PayPal</button></div><div class="ck-card"><label><span class="lbl">Card number</span><input class="in tn" id="cn" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234" required data-m="Enter a valid card number."><small class="ck-e"></small></label><div class="ck-2"><label><span class="lbl">Expiry</span><input class="in tn" id="ex" inputmode="numeric" autocomplete="cc-exp" placeholder="MM / YY" required data-m="Use MM / YY."><small class="ck-e"></small></label><label><span class="lbl">CVC</span><input class="in tn" inputmode="numeric" autocomplete="cc-csc" maxlength="4" required data-m="3 or 4 digits."><small class="ck-e"></small></label></div></div></section>
<button class="b ac lg" id="pay"></button><p class="mu ck-sec">@I(lock,14) Payments are encrypted. Demo only, no card is charged.</p></form>
<aside class="ck-sum"><details open id="sd"><summary><span>Order summary</span><b class="tn" id="t1"></b></summary><ul><li><img src="media/pics/c/1063.jpg" alt=""><span>Stoneware mug, Moss × 2</span><b class="tn">€48.00</b></li><li><img src="media/pics/c/1072.jpg" alt=""><span>Linen apron, Rust × 1</span><b class="tn">€62.00</b></li></ul><dl><div><dt>Subtotal</dt><dd class="tn">€110.00</dd></div><div><dt>Shipping</dt><dd class="tn" id="sp"></dd></div><div class="tot"><dt>Total</dt><dd class="tn" id="t2"></dd></div></dl></details></aside></div></div>
<style>
.ck-g{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;padding:40px 0 80px;align-items:start}.ck-f{display:grid;gap:28px}.ck-f h1{margin:0;font-size:28px;letter-spacing:-.02em}.ck-f section{display:grid;gap:12px}.ck-f h2{margin:0;font-size:16px}.ck-f .in{height:44px;font-size:16px}.ck-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ck-3{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:12px}
.ck-e{display:block;color:var(--err);font-size:12px;margin-top:4px}.ck-e:empty{display:none}
.ck-sh{display:grid;gap:8px}.ck-sh button{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:left}.ck-sh button::before{content:"";width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ctl);box-sizing:border-box}.ck-sh [aria-checked=true]{border:2px solid var(--fg);padding:13px}.ck-sh [aria-checked=true]::before{border:5px solid var(--fg)}.ck-sh span{display:grid}.ck-sh small{color:var(--mu);font-size:12px}
.ck-pt{display:flex;gap:4px;background:var(--sf2);padding:3px;border-radius:10px}.ck-pt button{flex:1;height:36px;border-radius:8px;font-weight:550;color:var(--mu)}.ck-pt [aria-selected=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px #0000001a}.ck-card{display:grid;gap:12px}
.ck-sec{display:flex;gap:6px;align-items:center;font-size:12px;margin:-16px 0 0;justify-content:center}
.ck-sum{position:sticky;top:16px;background:var(--sf);border-radius:16px;padding:20px}.ck-sum summary{display:flex;justify-content:space-between;font-weight:600;cursor:pointer;list-style:none}.ck-sum summary::-webkit-details-marker{display:none}.ck-sum ul{list-style:none;padding:0;margin:16px 0;display:grid;gap:12px}.ck-sum li{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;font-size:14px}.ck-sum img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.ck-sum dl{margin:0;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px;font-size:14px}.ck-sum dl div{display:flex;justify-content:space-between}.ck-sum dd{margin:0}.ck-sum .tot{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
@media (min-width:861px){.ck-sum summary{pointer-events:none}.ck-sum summary b{display:none}}
@media (max-width:860px){.ck-g{grid-template-columns:1fr;gap:16px;padding-top:16px}.ck-sum{position:static;order:-1}.ck-3{grid-template-columns:1fr 1fr}.ck-3 label:first-child{grid-column:1/-1}}
</style>
<script>
const S=[["Standard",4.9,4,6],["Express",9.9,1,2],["Pick-up point",0,3,4]],$=i=>document.getElementById(i),f=$('f');let sh=0;const D=n=>new Date(Date.now()+n*864e5).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function draw(){$('sh').innerHTML=S.map(([n,p,a,b],i)=>`<button type="button" role="radio" aria-checked="${i===sh}" data-i="${i}"><span><b>${n}</b><small>${D(a)} – ${D(b)}</small></span><b class="tn">${p?'€'+p.toFixed(2):'Free'}</b></button>`).join('');const t=110+S[sh][1];$('sp').textContent=S[sh][1]?'€'+S[sh][1].toFixed(2):'Free';$('t1').textContent=$('t2').textContent='€'+t.toFixed(2);$('pay').textContent=`Pay €${t.toFixed(2)}`}
$('sh').onclick=e=>{const b=e.target.closest('button');if(b){sh=+b.dataset.i;draw()}};document.querySelector('.ck-pt').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelector('.ck-card').hidden=b.textContent!=='Card'};
const PC={NL:[/^\d{4}\s?[A-Z]{2}$/i,'Use 1234 AB.'],DE:[/^\d{5}$/,'Use 5 digits.'],GB:[/^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/i,'Use a UK postcode like SW1A 1AA.']};
function val(i){let ok=i.value.trim()!=='';let m=i.dataset.m;if(i.type==='email')ok=/^\S+@\S+\.\S+$/.test(i.value);if(i.id==='pc'){const[r,msg]=PC[$('cy').value];ok=r.test(i.value.trim());m=msg}if(i.id==='cn')ok=i.value.replace(/\D/g,'').length>=15;if(i.id==='ex')ok=/^(0[1-9]|1[0-2])\s?\/\s?\d{2}$/.test(i.value);i.setAttribute('aria-invalid',!ok);const e=i.parentElement.querySelector('.ck-e');if(e)e.textContent=ok?'':m;return ok}
f.addEventListener('focusout',e=>{if(e.target.matches('input[required]')&&e.target.value)val(e.target)});
$('cn').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ')};$('ex').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=v.length>2?v.slice(0,2)+' / '+v.slice(2):v};
f.onsubmit=e=>{e.preventDefault();const I=[...f.querySelectorAll('input[required]')].filter(i=>!i.closest('[hidden]'));const bad=I.filter(i=>!val(i));if(bad.length){bad[0].focus();return}const b=$('pay');b.disabled=true;b.textContent='Processing…';setTimeout(()=>{b.textContent='Paid · order #A-20420'},1200)};draw();
</script>

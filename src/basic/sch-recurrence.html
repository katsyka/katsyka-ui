<!--Recurrence Rule Builder|Scheduling|A repeat-rule editor: every N days/weeks/months, weekday toggles for weekly, “on the 2nd Tuesday” for monthly, end after N times or on a date, with a plain-English summary and the next five dates.|scheduling,recurrence,repeat,rrule,form-->
<div class="k"><div class="rr card"><h2>Repeat</h2><div class="rr-r"><span>Every</span><input class="in tn" id="n" type="number" min="1" max="30" value="1" aria-label="Interval"><select class="in" id="u" aria-label="Unit"><option value="d">day</option><option value="w" selected>week</option><option value="m">month</option></select></div>
<div id="wd" class="rr-wd" role="group" aria-label="On days"></div><div id="md" class="rr-md" hidden><label><input type="radio" name="mm" value="date" checked> On day <b id="dn"></b></label><label><input type="radio" name="mm" value="nth"> On the <b id="nth"></b></label></div>
<fieldset class="rr-e"><legend class="lbl">Ends</legend><label><input type="radio" name="e" value="never" checked> Never</label><label><input type="radio" name="e" value="cnt"> After <input class="in tn" id="cnt" type="number" min="1" value="10" aria-label="Occurrences"> times</label><label><input type="radio" name="e" value="on"> On <input class="in" id="ed" type="date" aria-label="End date"></label></fieldset>
<p class="rr-s" id="s" aria-live="polite"></p><ol class="rr-l tn" id="l"></ol></div></div>
<style>
.rr{width:min(440px,100%);padding:22px;display:grid;gap:14px}.rr h2{margin:0;font-size:18px}.rr-r{display:flex;gap:8px;align-items:center;font-size:15px}.rr-r .in{height:40px;width:auto}.rr-r input{width:64px}
.rr-wd{display:flex;gap:6px}.rr-wd button{width:40px;height:40px;border-radius:50%;border:1px solid var(--ctl);font-weight:600;font-size:13px}.rr-wd [aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rr-md,.rr-e{display:grid;gap:8px;font-size:14px}.rr-e{border:0;margin:0;padding:0}.rr-md label,.rr-e label{display:flex;gap:8px;align-items:center;min-height:36px}.rr input[type=radio]{width:18px;height:18px;accent-color:var(--fg)}.rr-e .in{height:36px;width:auto}.rr-e input[type=number]{width:70px}
.rr-s{margin:0;padding:12px;border-radius:10px;background:var(--sf2);font-size:15px;font-weight:550}.rr-l{margin:0;padding-left:20px;font-size:13px;color:var(--mu);display:grid;gap:3px}
</style>
<script>
const $=i=>document.getElementById(i),st=new Date();st.setHours(10,0,0,0);const W=['Mo','Tu','We','Th','Fr','Sa','Su'],WN=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],ON=['first','second','third','fourth','last'];let days=new Set([(st.getDay()+6)%7]);
$('wd').innerHTML=W.map((w,i)=>`<button aria-pressed="${days.has(i)}" data-i="${i}" aria-label="${WN[i]}">${w}</button>`).join('');const nthI=Math.min(4,Math.floor((st.getDate()-1)/7));$('dn').textContent=st.getDate();$('nth').textContent=`${ON[nthI]} ${WN[(st.getDay()+6)%7]}`;$('ed').valueAsDate=new Date(+st+90*864e5);
function gen(){const n=Math.max(1,+$('n').value||1),u=$('u').value,end=document.querySelector('[name=e]:checked').value,cnt=+$('cnt').value||1,ed=new Date($('ed').value+'T23:59'),mm=document.querySelector('[name=mm]:checked').value,out=[];let d=new Date(st),guard=0;
while(out.length<(end==='cnt'?Math.min(cnt,5):5)&&guard++<800){let ok=true;if(u==='w'){const wk=Math.floor((d-st)/6048e5);ok=days.has((d.getDay()+6)%7)&&wk%n===0}if(u==='d')ok=Math.round((d-st)/864e5)%n===0;if(u==='m'){const mo=(d.getFullYear()-st.getFullYear())*12+d.getMonth()-st.getMonth();ok=mo%n===0&&(mm==='date'?d.getDate()===st.getDate():(d.getDay()===st.getDay()&&Math.floor((d.getDate()-1)/7)===nthI))}if(end==='on'&&d>ed)break;if(ok&&d>=st)out.push(new Date(d));d=new Date(+d+864e5)}
const unit={d:'day',w:'week',m:'month'}[u],every=n===1?`Every ${unit}`:`Every ${n} ${unit}s`,on=u==='w'?' on '+[...days].sort().map(i=>WN[i]).join(', ').replace(/, ([^,]*)$/,' and $1'):u==='m'?(mm==='date'?` on day ${st.getDate()}`:` on the ${ON[nthI]} ${WN[(st.getDay()+6)%7]}`):'',fin=end==='cnt'?`, ${cnt} times`:end==='on'?`, until ${ed.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}`:'';
$('s').textContent=(u==='w'&&!days.size)?'Pick at least one day.':every+on+fin+' at 10:00.';$('l').innerHTML=out.map(x=>`<li>${x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</li>`).join('');$('wd').hidden=u!=='w';$('md').hidden=u!=='m'}
$('wd').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;days.has(i)?days.delete(i):days.add(i);b.setAttribute('aria-pressed',days.has(i));gen()};document.querySelector('.rr').addEventListener('input',gen);document.querySelector('.rr').addEventListener('change',gen);gen();
</script>

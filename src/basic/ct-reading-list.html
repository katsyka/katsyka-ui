<!--Reading List Sidebar|Content|A save-for-later reading queue: articles with estimated time, total time remaining, drag (or move buttons) to reorder, mark as read with strike and progress, and a “clear finished” action.|reading list,queue,save,reorder,progress-->
<div class="k"><div class="rl2"><div class="rl2-h"><h1>Reading list</h1><span class="mu tn" id="tt"></span></div><div class="rl2-bar"><i id="br"></i></div><ol class="rl2-l" id="l"></ol><button class="b gh sm" id="cl">Clear finished</button></div></div>
<style>
.rl2{width:min(520px,100%);display:grid;gap:12px}.rl2-h{display:flex;justify-content:space-between;align-items:baseline}.rl2-h h1{margin:0;font-size:22px;letter-spacing:-.02em}.rl2-h span{font-size:13px}.rl2-bar{height:4px;border-radius:2px;background:var(--sf2);overflow:hidden}.rl2-bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s cubic-bezier(.23,1,.32,1)}
.rl2-l{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.rl2-l li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);transition:background .2s}.rl2-l li:first-child{border:0}.rl2-l li.dr{background:var(--sf);opacity:.7}.rl2-l li.ov{box-shadow:inset 0 2px 0 var(--ac)}
.rl2-l input{width:20px;height:20px;accent-color:var(--ok)}.rl2-l div{display:grid;gap:2px;min-width:0}.rl2-l b{font-size:15px;font-weight:550}.rl2-l small{font-size:12px;color:var(--mu)}.rl2-l .dn b{text-decoration:line-through;color:var(--mu)}.rl2-l .mv{display:flex;gap:2px}.rl2-l .mv button{width:30px;height:30px;border-radius:6px;color:var(--mu);display:grid;place-items:center}.rl2-l .mv button:hover{background:var(--sf2);color:var(--fg)}.rl2-l .mv .i{width:14px;height:14px}.rl2-l .hd{cursor:grab;touch-action:none}
#cl{justify-self:start}
</style>
<script>
let R=[["The castle that taught us about caching","fieldnotes.example",12,0],["Kerning is a conversation","type.example",8,1],["A field guide to accessible colour","quill.example",14,0],["Debugging a memory leak with heap snapshots","shipit.dev",11,0],["Cobblestones are a technology","fieldnotes.example",6,0]];const l=document.getElementById('l');
function draw(f){const left=R.filter(r=>!r[3]).reduce((a,r)=>a+r[2],0),done=R.filter(r=>r[3]).length;document.getElementById('tt').textContent=`${left} min left · ${done}/${R.length} read`;document.getElementById('br').style.width=(R.length?done/R.length*100:0)+'%';
l.innerHTML=R.map(([t,s,m,d],i)=>`<li class="${d?'dn':''}" data-i="${i}"><input type="checkbox" ${d?'checked':''} aria-label="Mark “${t}” as read" data-c="${i}"><div><b>${t}</b><small>${s} · ${m} min</small></div><span class="mv"><button data-u="${i}" aria-label="Move up" ${i?'':'disabled'}>@I(up)</button><button data-d="${i}" aria-label="Move down" ${i<R.length-1?'':'disabled'}>@I(down)</button><button class="hd" data-h="${i}" aria-label="Drag to reorder">@I(grid)</button></span></li>`).join('');if(f)l.querySelector(f)?.focus()}
l.onchange=e=>{const i=+e.target.dataset.c;R[i][3]=e.target.checked?1:0;draw(`[data-c="${i}"]`)};
l.onclick=e=>{const u=e.target.closest('[data-u]'),d=e.target.closest('[data-d]');if(u){const i=+u.dataset.u;[R[i-1],R[i]]=[R[i],R[i-1]];draw(`[data-u="${i-1}"]`)}if(d){const i=+d.dataset.d;[R[i+1],R[i]]=[R[i],R[i+1]];draw(`[data-d="${i+1}"]`)}};
let dg=null;l.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-h]');if(!h)return;dg=+h.dataset.h;h.setPointerCapture(e.pointerId);l.children[dg].classList.add('dr')});
l.addEventListener('pointermove',e=>{if(dg==null)return;const li=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.parentElement===l);[...l.children].forEach(x=>x.classList.toggle('ov',x===li&&+li.dataset.i!==dg))});
l.addEventListener('pointerup',()=>{if(dg==null)return;const t=l.querySelector('.ov');if(t){const to=+t.dataset.i,it=R.splice(dg,1)[0];R.splice(to,0,it)}dg=null;draw()});
document.getElementById('cl').onclick=()=>{R=R.filter(r=>!r[3]);draw()};draw();
</script>

<!--Restaurant Landing|Landings|A neighbourhood restaurant: a menu with course tabs and dietary filters, opening hours that highlight today and say if it's open now, and a reservation widget with time slots.|landing,restaurant,menu,reservation,hours-->
<div class="k pg lt">
<header class="top"><div class="w"><a class="logo ser" href="#" style="font-size:24px;font-weight:400">Fennel</a><nav class="links"><a href="#mn">Menu</a><a href="#bk">Book</a><a href="#">Private dining</a></nav><a class="b ac" href="#bk">Book a table</a><button class="menu ibt" aria-label="Menu" aria-expanded="false">@I(list,22)</button></div></header>
<section class="w lt-hero"><img src="media/pics/c/1080.jpg" alt="Fresh strawberries"><div><p class="eb" id="op"></p><h1 class="h1 ser">Seasonal plates,<br>natural wine,<br>no rush.</h1><p class="lead">Thirty-two seats on Vesterbrogade. The menu changes when the market does.</p></div></section>
<section class="sec w" id="mn"><div class="lt-mh"><h2 class="h2 ser">This week</h2><div class="lt-df" role="group" aria-label="Dietary filter"><button aria-pressed="false" data-f="v">Vegetarian</button><button aria-pressed="false" data-f="g">Gluten-free</button></div></div><div class="lt-tabs" role="tablist" aria-label="Course"><button role="tab" aria-selected="true" data-c="0">Small</button><button role="tab" aria-selected="false" data-c="1">Large</button><button role="tab" aria-selected="false" data-c="2">Sweet</button></div><ul class="lt-menu" id="ml" aria-live="polite"></ul></section>
<section class="sec lt-bk" id="bk"><div class="w lt-bg"><div><h2 class="h2 ser">Book a table</h2><ul class="lt-hrs" id="hr"></ul></div><form class="card lt-f" onsubmit="return false"><div class="lt-r"><label><span class="lbl">Guests</span><select class="in" id="gs"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label><span class="lbl">Date</span><input class="in" type="date" id="dt"></label></div><span class="lbl">Time</span><div class="lt-sl" id="sl" role="radiogroup" aria-label="Time"></div><button class="b ac lg" id="go" style="width:100%">Reserve</button><p id="ms" role="status" class="lt-ms"></p></form></div></section>
<footer class="foot"><div class="w"><span>Fennel · Vesterbrogade 41</span><span>Groups of 7+ call us</span></div></footer>
</div>
<style>
.lt{--ac:light-dark(#3f6212,#bef264);--ac-h:light-dark(#365314,#d9f99d);--ac-fg:light-dark(#fff,#1a2e05)}
.lt-hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center;padding:56px 0}.lt-hero img{aspect-ratio:3/4;object-fit:cover;border-radius:999px 999px 16px 16px;width:100%}.lt-hero>div{display:grid;gap:24px}
.lt-mh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.lt-df{display:flex;gap:8px}.lt-df button{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:13px}.lt-df [aria-pressed=true]{background:var(--ac);color:var(--ac-fg);border-color:var(--ac)}
.lt-tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-top:24px}.lt-tabs button{padding:12px 0;font-size:16px;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px}.lt-tabs [aria-selected=true]{color:var(--fg);border-color:var(--fg)}
.lt-menu{list-style:none;padding:0;margin:0;columns:2;column-gap:56px}.lt-menu li{break-inside:avoid;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:20px 0;border-bottom:1px dashed var(--line)}.lt-menu b{font-size:17px;font-weight:600}.lt-menu .mu{grid-column:1/-1;font-size:14px}.lt-menu em{font-style:normal;font-size:11px;font-weight:600;color:var(--ac);margin-left:6px}.lt-menu .x{opacity:.3}
.lt-bk{background:var(--sf)}.lt-bg{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.lt-hrs{list-style:none;padding:0;margin:24px 0 0;max-width:340px}.lt-hrs li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.lt-hrs .td{font-weight:650}.lt-hrs .td::before{content:"Today · ";color:var(--ac)}
.lt-f{padding:24px;display:grid;gap:16px}.lt-r{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lt-r .in{height:44px;font-size:16px}.lt-sl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-8px}.lt-sl button{height:44px;border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums;font-weight:550}.lt-sl [aria-checked=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.lt-sl button:disabled{text-decoration:line-through;color:var(--mu);opacity:.6;cursor:not-allowed}.lt-ms:empty{display:none}.lt-ms{font-size:14px;color:var(--ok)}
@media (max-width:760px){.lt-hero,.lt-bg{grid-template-columns:1fr}.lt-hero img{width:60%;}.lt-menu{columns:1}}
</style>
<script>
const MN=[[["Charred leeks, hazelnut","Brown butter, dill","g v",95],["Raw scallop, green strawberry","Horseradish, sorrel","g",135],["Sourdough & cultured butter","Our own starter","v",45]],[["Halibut, mussel sauce","Fermented celeriac, sea herbs","g",245],["Pumpkin, smoked ricotta","Pumpkin seed praline","v",195],["Pork neck, plums","Mustard greens","g",235]],[["Strawberry, sheep's yogurt","Elderflower granita","g v",95],["Rye, salted caramel","Malted cream","v",90]]];
const ml=document.getElementById('ml');let c=0;const F=new Set();
function menu(){ml.innerHTML=MN[c].map(([n,d,t,p])=>{const ok=[...F].every(f=>t.includes(f));return `<li class="${ok?'':'x'}"><b>${n}${t.includes('v')?'<em>V</em>':''}${t.includes('g')?'<em>GF</em>':''}</b><span class="tn">${p} kr</span><span class="mu">${d}</span></li>`}).join('')}
document.querySelectorAll('.lt-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lt-tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));c=+b.dataset.c;menu()});
document.querySelectorAll('.lt-df button').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);on?F.add(b.dataset.f):F.delete(b.dataset.f);menu()});menu();
const H=[["Monday","Closed"],["Tuesday","17:30–23:00"],["Wednesday","17:30–23:00"],["Thursday","17:30–23:00"],["Friday","17:00–00:00"],["Saturday","12:00–00:00"],["Sunday","12:00–16:00"]],d=new Date(),wd=(d.getDay()+6)%7;
document.getElementById('hr').innerHTML=H.map(([n,h],i)=>`<li class="${i===wd?'td':''}"><span>${n}</span><span class="tn">${h}</span></li>`).join('');
const h=H[wd][1],m=h.match(/(\d+):(\d+)–(\d+):(\d+)/),now=d.getHours()*60+d.getMinutes();let open=false;if(m){const a=+m[1]*60+ +m[2],z=(+m[3]||24)*60+ +m[4];open=now>=a&&now<z}
document.getElementById('op').textContent=open?'● Open now · until '+h.split('–')[1]:'Closed now · '+(m?'opens '+h.split('–')[0]:'opens tomorrow');
const dt=document.getElementById('dt'),sl=document.getElementById('sl');dt.valueAsDate=new Date(+d+864e5*2);dt.min=d.toISOString().slice(0,10);let pick=null;
['17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00'].forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('role','radio');b.setAttribute('aria-checked','false');b.disabled=i==3||i==4;b.onclick=()=>{sl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));pick=t};sl.append(b)});
document.getElementById('go').onclick=e=>{const ms=document.getElementById('ms');if(!pick){ms.style.color='var(--err)';ms.textContent='Pick a time first.';return}const b=e.currentTarget;b.disabled=true;b.textContent='Reserving…';setTimeout(()=>{b.disabled=false;b.textContent='Reserve';ms.style.color='var(--ok)';ms.textContent=`Table for ${document.getElementById('gs').value} at ${pick} is held. Confirmation sent by email.`},800)};
</script>

<!--Breadcrumbs with Switchers|Navigation|Breadcrumbs where each segment opens a menu of its siblings (switch project or folder without going back), middle segments collapse to “…” on narrow screens, and the current page is marked.|navigation,breadcrumbs,switcher,dropdown,hierarchy-->
<div class="k"><nav class="bc" aria-label="Breadcrumb"><ol id="o"></ol></nav></div>
<style>
.bc{width:min(860px,100%);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.bc ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:0}
.bc li{display:flex;align-items:center;gap:2px;position:relative;min-width:0}.bc li+li::before{content:"/";color:var(--ctl);margin:0 4px}.bc button{display:flex;gap:4px;align-items:center;height:32px;padding:0 8px;border-radius:7px;font-size:14px;color:var(--mu);min-width:0;max-width:200px}.bc button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bc button:hover{background:var(--sf);color:var(--fg)}.bc button .i{width:12px;height:12px;flex:none;opacity:.6}.bc [aria-current] button{color:var(--fg);font-weight:600}
.bc-m{position:absolute;top:36px;left:0;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:5;box-shadow:0 10px 24px -10px #0004;transform-origin:top left;animation:bcm .15s cubic-bezier(.23,1,.32,1)}@keyframes bcm{from{opacity:0;transform:scale(.96)}}.bc-m a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:7px;font-size:14px;color:var(--fg);text-decoration:none}.bc-m a:hover,.bc-m a:focus-visible{background:var(--sf)}.bc-m a[aria-current] {font-weight:650}.bc-m a[aria-current]::after{content:"✓";color:var(--ac)}
.bc .ell{display:none}@media (max-width:600px){.bc li.mid{display:none}.bc .ell{display:flex}}
</style>
<script>
const P=[["Northwind",["Northwind","Personal","Fjordline"]],["Projects",["Projects","Archive"]],["Kestrel launch",["Kestrel launch","Website refresh","Q4 report"]],["Design",["Research","Design","Engineering","Marketing"]],["Homepage hero v3",null]],o=document.getElementById('o');let open=-1;
function draw(){o.innerHTML=P.map(([n,sib],i)=>`${i===1?`<li class="ell"><button aria-label="Show hidden levels" data-e>…</button></li>`:''}<li class="${i>0&&i<P.length-2?'mid':''}" ${i===P.length-1?'aria-current="page"':''}><button ${sib?`aria-haspopup="menu" aria-expanded="${open===i}" data-i="${i}"`:''}><span>${n}</span>${sib?'@I(down)':''}</button>${open===i?`<div class="bc-m" role="menu">${sib.map(s=>`<a href="#" role="menuitem" data-s="${s}" ${s===n?'aria-current="true"':''}>${s}</a>`).join('')}</div>`:''}</li>`).join('')}
o.onclick=e=>{const a=e.target.closest('[data-s]');if(a){e.preventDefault();P[open][0]=a.dataset.s;open=-1;draw();return}const el=e.target.closest('[data-e]');if(el){o.querySelectorAll('.mid').forEach(x=>x.style.display='flex');el.parentElement.remove();return}const b=e.target.closest('[data-i]');if(b){open=open===+b.dataset.i?-1:+b.dataset.i;draw();const m=o.querySelector('.bc-m a');m&&m.focus()}};
document.addEventListener('pointerdown',e=>{if(open>=0&&!e.target.closest('.bc')){open=-1;draw()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open>=0){const i=open;open=-1;draw();o.querySelector(`[data-i="${i}"]`).focus()}});draw();
</script>

<!--Response Versions and Feedback|AI|An assistant reply with version navigation (‹ 2 / 3 ›) after regenerating, thumbs up/down where down opens reason chips and an optional note, and a “thanks” state; versions keep their own feedback.|ai,feedback,regenerate,versions,rating-->
<div class="k"><div class="rv2"><div class="rv2-q">Suggest a name for a plant-care app.</div><div class="rv2-a"><p id="tx" aria-live="polite"></p><div class="rv2-bar"><div class="rv2-v" id="vv"><button class="ibt" id="pv" aria-label="Previous version">@I(left,14)</button><span class="tn" id="vn"></span><button class="ibt" id="nx" aria-label="Next version">@I(right,14)</button></div><button class="ibt" id="up" aria-label="Good response" aria-pressed="false">@I(up,16)</button><button class="ibt" id="dn" aria-label="Bad response" aria-pressed="false">@I(down,16)</button><button class="b gh sm" id="rg">@I(refresh,14)Regenerate</button></div><form class="rv2-fb" id="fb" hidden><b>What went wrong?</b><div class="rv2-ch" id="ch"></div><textarea class="in" id="nt" rows="2" placeholder="Anything else? (optional)"></textarea><div><button type="button" class="b gh sm" id="cx">Cancel</button><button class="b sec sm">Send feedback</button></div></form><p class="rv2-ty mu" id="ty"></p></div></div></div>
<style>
.rv2{width:min(620px,100%);display:grid;gap:14px}.rv2-q{justify-self:end;background:var(--sf2);padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:15px}.rv2-a p{margin:0 0 10px;font-size:16px;line-height:1.65;animation:rvx .25s cubic-bezier(.23,1,.32,1)}@keyframes rvx{from{opacity:0}}
.rv2-bar{display:flex;gap:2px;align-items:center;color:var(--mu)}.rv2-bar .ibt{width:32px;height:32px}.rv2-bar .ibt[aria-pressed=true]{color:var(--fg);background:var(--sf2)}.rv2-v{display:flex;align-items:center;font-size:12px;margin-right:6px}.rv2-v .ibt{width:28px;height:28px}.rv2-bar .b{margin-left:4px}
.rv2-fb{margin-top:8px;padding:14px;border:1px solid var(--line);border-radius:12px;display:grid;gap:10px;animation:rvx .2s}.rv2-fb b{font-size:14px}.rv2-ch{display:flex;gap:6px;flex-wrap:wrap}.rv2-ch button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}.rv2-ch [aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.rv2-fb textarea{height:auto;padding:8px 10px;font-size:14px}.rv2-fb>div:last-child{display:flex;gap:6px;justify-content:flex-end}
.rv2-ty{font-size:13px;margin:8px 0 0}.rv2-ty:empty{display:none}
</style>
<script>
const R=["How about **Rootine**? It's a pun on routine, short, and the .app domain is usually easier to get for invented words.","Try **Sprout**. Friendly and obvious. It may be crowded in app stores, so pair it with a subtitle like “Sprout: plant care schedule”.","**Leaflet** works: it suggests leaves and small reminders. Check trademarks, it's also a mapping library name."],fb=[{},{},{}];let n=1,v=0;const $=i=>document.getElementById(i),RS=['Not helpful','Inaccurate','Too long','Ignored my request','Unsafe'];
function draw(){$('tx').innerHTML=R[v].replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');$('vv').hidden=n<2;$('vn').textContent=`${v+1} / ${n}`;$('pv').disabled=v===0;$('nx').disabled=v>=n-1;const f=fb[v];$('up').setAttribute('aria-pressed',f.r==='up');$('dn').setAttribute('aria-pressed',f.r==='dn');$('fb').hidden=true;$('ty').textContent=f.sent?'Thanks, that helps us improve.':''}
$('pv').onclick=()=>{v--;draw()};$('nx').onclick=()=>{v++;draw()};$('rg').onclick=()=>{if(n<3){n++;v=n-1;draw()}else{v=(v+1)%3;draw()}};
$('up').onclick=()=>{fb[v]={r:fb[v].r==='up'?null:'up',sent:fb[v].r!=='up'};draw()};
$('dn').onclick=()=>{if(fb[v].r==='dn'){fb[v]={};draw();return}fb[v]={r:'dn'};draw();$('fb').hidden=false;$('ch').innerHTML=RS.map(r=>`<button type="button" aria-pressed="false">${r}</button>`).join('');$('ch').querySelector('button').focus()};
$('ch').onclick=e=>{const b=e.target.closest('button');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};$('cx').onclick=()=>{fb[v]={};draw()};
$('fb').onsubmit=e=>{e.preventDefault();fb[v].sent=1;fb[v].why=[...$('ch').querySelectorAll('[aria-pressed=true]')].map(b=>b.textContent);draw()};draw();
</script>

<!--Payment Failed State|States|A declined-payment recovery screen: names the likely reason from the decline code in plain words, keeps the order intact, offers the right next step (retry, other card, bank transfer), and shows what happens if unpaid.|payment,failed,declined,checkout,error,recovery-->
<div class="k pf2"><main class="pf2-w"><div class="pf2-h"><span class="pf2-ic">@I(card,20)</span><div><h1>Your payment didn't go through</h1><p class="mu">Order #A-20419 is saved. Nothing has been charged.</p></div></div>
<label class="lbl" for="cd">Simulate decline reason</label><select class="in" id="cd"><option value="insufficient">Insufficient funds</option><option value="3ds">Bank authentication failed</option><option value="expired">Card expired</option><option value="fraud">Blocked by your bank</option></select>
<section class="pf2-r" id="r" aria-live="polite"></section><p class="mu pf2-n">If it isn't paid by Friday the order is cancelled and the items go back on sale. We'll remind you on Thursday.</p></main></div>
<style>
.pf2-w{width:min(480px,100%);display:grid;gap:12px}.pf2-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}.pf2-ic{width:44px;height:44px;border-radius:12px;background:var(--err-sf);color:var(--err);display:grid;place-items:center;flex:none}.pf2-h h1{margin:0;font-size:22px;letter-spacing:-.02em;line-height:1.2}.pf2-h p{margin:4px 0 0;font-size:14px}
.pf2-w>.in{height:40px}.pf2-r{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--bg);display:grid;gap:12px;animation:pff .25s cubic-bezier(.23,1,.32,1)}.pf2-r h2{margin:0;font-size:16px}.pf2-r p{margin:0;font-size:14px;color:var(--mu)}.pf2-r .b{height:44px}.pf2-r .row{display:flex;gap:8px;flex-wrap:wrap}@keyframes pff{from{opacity:0}}
.pf2-n{font-size:12px;margin:0}
</style>
<script>
const R={insufficient:["The card didn't have enough funds","Your bank declined €184.00. You can try again after topping up, or use another card.",["Try again","Use another card"]],"3ds":["Your bank couldn't confirm it was you","The security check in your banking app timed out or was declined. Retrying usually works.",["Retry with bank check","Use another card"]],expired:["This card has expired","The card ending 4242 expired in 10/2026. Add the new card your bank sent you.",["Update card details","Pay by bank transfer"]],fraud:["Your bank blocked this payment","Banks sometimes block unusual purchases. Call the number on the back of your card, then retry, or pay another way.",["Retry after calling","Pay by bank transfer"]]};
const r=document.getElementById('r'),cd=document.getElementById('cd');
function draw(){const [h,p,a]=R[cd.value];r.style.animation='none';r.offsetWidth;r.style.animation='';r.innerHTML=`<h2>${h}</h2><p>${p}</p><div class="row"><button class="b ac" id="a1">${a[0]}</button><button class="b sec">${a[1]}</button></div>`;document.getElementById('a1').onclick=e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Processing…';setTimeout(()=>{r.innerHTML='<h2 style="color:var(--ok)">Paid. Thank you.</h2><p>Receipt sent. Your order ships tomorrow.</p>'},1100)}}cd.onchange=draw;draw();
</script>

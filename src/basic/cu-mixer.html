<!--Mixing Desk Faders|Custom|A small audio mixing desk: vertical faders with tactile caps you drag (or arrow-key), per-channel mute/solo buttons, dB readouts, and VU meters that bounce with level and respect mute and solo logic.|custom,audio,mixer,faders,vu meter,skeuomorphic-->
<div class="k mx"><div class="mx-d" id="d"></div></div>
<style>
.k.mx{background:light-dark(#d9d6cf,#111110)}.mx-d{display:flex;gap:6px;padding:18px;border-radius:14px;background:light-dark(#2b2a28,#1c1b19);box-shadow:inset 0 1px 0 #ffffff14,0 20px 40px -20px #000a}
.mx-ch{width:72px;display:grid;justify-items:center;gap:10px;padding:10px 6px;border-radius:8px;background:#ffffff08;color:#d6d3cc;font:600 11px 'Geist Mono',monospace}.mx-ch>b{letter-spacing:.06em;color:#a8a49b}
.mx-vu{display:flex;gap:3px;height:120px;align-items:flex-end}.mx-vu i{width:6px;height:100%;border-radius:2px;background:linear-gradient(#ef4444 0 12%,#facc15 12% 30%,#22c55e 30%);-webkit-mask:linear-gradient(transparent calc(100% - var(--l,0%)),#000 calc(100% - var(--l,0%)));mask:linear-gradient(transparent calc(100% - var(--l,0%)),#000 calc(100% - var(--l,0%)));opacity:.9}
.mx-tr{position:relative;width:44px;height:180px;touch-action:none;cursor:ns-resize;outline:0}.mx-tr::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:4px;translate:-50%;border-radius:2px;background:#0008;box-shadow:inset 0 1px 1px #000}.mx-tr::after{content:"";position:absolute;inset:6px 6px;background:repeating-linear-gradient(transparent 0 15px,#ffffff22 15px 16px);pointer-events:none}
.mx-cap{position:absolute;left:4px;right:4px;height:26px;top:var(--y);border-radius:4px;background:linear-gradient(#5b5853,#3a3834 45%,#2a2825 55%,#4a4743);box-shadow:0 3px 6px #000a,inset 0 1px 0 #ffffff30;translate:0 -50%;z-index:1}.mx-cap::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:#e5e2da;translate:0 -50%}.mx-tr:focus-visible .mx-cap{outline:2px solid #93c5fd;outline-offset:2px}
.mx-db{font-variant-numeric:tabular-nums;color:#e9e6df}.mx-bt{display:flex;gap:4px}.mx-bt button{width:28px;height:24px;border-radius:4px;background:#ffffff14;color:#a8a49b;font:700 10px 'Geist Mono',monospace;transition:background .12s,color .12s}.mx-bt [data-k=m][aria-pressed=true]{background:#ef4444;color:#fff}.mx-bt [data-k=s][aria-pressed=true]{background:#facc15;color:#1c1b19}
@media (max-width:480px){.mx-ch{width:56px}.mx-tr{width:36px}}
</style>
<script>
const CH=['KICK','BASS','GTR','VOX','MAST'],st=CH.map((_,i)=>({v:[.7,.6,.55,.75,.8][i],m:false,s:false})),d=document.getElementById('d');
d.innerHTML=CH.map((c,i)=>`<div class="mx-ch"><b>${c}</b><div class="mx-vu"><i></i><i></i></div><div class="mx-tr" data-i="${i}" role="slider" tabindex="0" aria-label="${c} fader" aria-valuemin="-60" aria-valuemax="6"><span class="mx-cap"></span></div><span class="mx-db" id="db${i}"></span>${i<4?`<div class="mx-bt"><button data-k="m" data-i="${i}" aria-pressed="false" aria-label="Mute ${c}">M</button><button data-k="s" data-i="${i}" aria-pressed="false" aria-label="Solo ${c}">S</button></div>`:'<div class="mx-bt" style="height:24px"></div>'}</div>`).join('');
const dB=v=>v<=0?'-∞':((v*66-60)).toFixed(1);function ui(i){const tr=d.querySelector(`.mx-tr[data-i="${i}"]`);tr.style.setProperty('--y',(6+(1-st[i].v)*168)+'px');document.getElementById('db'+i).textContent=dB(st[i].v);tr.setAttribute('aria-valuenow',Math.round(st[i].v*66-60));tr.setAttribute('aria-valuetext',dB(st[i].v)+' dB')}CH.forEach((_,i)=>ui(i));
let dr=-1;d.addEventListener('pointerdown',e=>{const tr=e.target.closest('.mx-tr');if(!tr)return;dr=+tr.dataset.i;tr.setPointerCapture(e.pointerId);mv(e)});const mv=e=>{if(dr<0)return;const r=d.querySelector(`.mx-tr[data-i="${dr}"]`).getBoundingClientRect();st[dr].v=Math.max(0,Math.min(1,1-(e.clientY-r.top-6)/(r.height-12)));ui(dr)};d.addEventListener('pointermove',mv);d.addEventListener('pointerup',()=>dr=-1);
d.addEventListener('keydown',e=>{const tr=e.target.closest('.mx-tr');if(!tr)return;const i=+tr.dataset.i,k={ArrowUp:.03,ArrowDown:-.03,PageUp:.15,PageDown:-.15}[e.key];if(k===undefined)return;e.preventDefault();st[i].v=Math.max(0,Math.min(1,st[i].v+k));ui(i)});
d.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const s=st[+b.dataset.i];s[b.dataset.k]=!s[b.dataset.k];b.setAttribute('aria-pressed',s[b.dataset.k])});
const red=matchMedia('(prefers-reduced-motion:reduce)').matches;let t=0;(function vu(){t+=.05;const solo=st.slice(0,4).some(x=>x.s);let sum=0;d.querySelectorAll('.mx-ch').forEach((c,i)=>{let on=i===4?1:(!st[i].m&&(!solo||st[i].s));const base=[.9,.6,.5,.7][i]??0,beat=i===0?Math.max(0,Math.sin(t*6))**4:.55+.45*Math.sin(t*(2+i)+i)*Math.sin(t*.7+i);let lv=i===4?sum/2.2:on*st[i].v*base*(red?.7:beat)*(red?1:.85+Math.random()*.15);if(i<4)sum+=lv;lv=Math.min(1,lv*st[i].v/(i===4?st[4].v||1:1)*(i===4?st[4].v:1));c.querySelectorAll('.mx-vu i').forEach((v,k)=>v.style.setProperty('--l',Math.max(0,Math.min(100,(lv*(k?.95:1))*100))+'%'))});requestAnimationFrame(vu)})();
</script>

<!--Prompt Templates|AI|A prompt template library: searchable templates by category, a selected template with {variables} turned into inline fields, a live preview of the final prompt, character count and a “use prompt” action.|ai,prompts,templates,variables,library-->
<div class="k"><div class="pl2"><aside class="pl2-s"><label class="pl2-q">@I(search,15)<input id="q" placeholder="Search templates" aria-label="Search templates"></label><ul id="l" role="listbox" aria-label="Templates"></ul></aside><section class="pl2-m" id="m"></section></div></div>
<style>
.pl2{width:min(900px,100%);display:grid;grid-template-columns:260px 1fr;border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden;min-height:420px}.pl2-s{border-right:1px solid var(--line);padding:12px;display:grid;gap:8px;align-content:start}
.pl2-q{display:flex;gap:6px;align-items:center;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;color:var(--mu)}.pl2-q input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:14px;color:var(--fg)}
.pl2-s ul{list-style:none;padding:0;margin:0;display:grid;gap:2px}.pl2-s li{padding:9px 10px;border-radius:8px;cursor:pointer;display:grid;font-size:14px}.pl2-s li:hover{background:var(--sf)}.pl2-s li[aria-selected=true]{background:var(--sf2)}.pl2-s li small{font-size:11px;color:var(--mu)}
.pl2-m{padding:20px;display:grid;gap:14px;align-content:start}.pl2-m h2{margin:0;font-size:18px}.pl2-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.pl2-f .in{height:38px}
.pl2-pv{padding:14px;border-radius:12px;background:var(--sf);font-size:14px;line-height:1.65;white-space:pre-wrap}.pl2-pv mark{background:var(--ac-sf);color:var(--ac);border-radius:3px;padding:0 2px;font-weight:600}.pl2-pv mark.e{background:var(--warn-sf);color:var(--warn)}.pl2-ft{display:flex;justify-content:space-between;align-items:center;font-size:12px}
@media (max-width:700px){.pl2{grid-template-columns:1fr}.pl2-s{border-right:0;border-bottom:1px solid var(--line)}.pl2-s ul{grid-auto-flow:column;overflow-x:auto}.pl2-s li{white-space:nowrap}}
</style>
<script>
const T=[["Release notes","Writing","Turn these merged pull requests into release notes for {audience}. Group by New, Improved and Fixed. Keep each line under {words} words.\n\nPull requests:\n{input}"],["Meeting summary","Writing","Summarise this {meeting} transcript in {bullets} bullets, then list decisions and owners.\n\n{input}"],["SQL from question","Data","Write a {dialect} query for: {question}. Explain any joins in one sentence."],["Polite follow-up","Email","Write a short follow-up email to {name} about {topic}. Tone: {tone}. No more than {words} words."]];
const V={audience:"customers",words:"15",input:"",meeting:"weekly product",bullets:"5",dialect:"Postgres",question:"",name:"",topic:"",tone:"friendly, direct"};let s=0;const q=document.getElementById('q'),m=document.getElementById('m');
function list(){document.getElementById('l').innerHTML=T.map((t,i)=>[t,i]).filter(([t])=>(t[0]+t[1]).toLowerCase().includes(q.value.toLowerCase())).map(([[n,c],i])=>`<li role="option" aria-selected="${i===s}" data-i="${i}">${n}<small>${c}</small></li>`).join('')}
function main(){const [n,,tp]=T[s],vars=[...new Set(tp.match(/\{(\w+)\}/g).map(x=>x.slice(1,-1)))];m.innerHTML=`<h2>${n}</h2><div class="pl2-f">${vars.map(v=>`<label><span class="lbl">${v}</span>${v==='input'?`<textarea class="in" data-v="${v}" rows="2" style="height:auto;padding:8px">${V[v]}</textarea>`:`<input class="in" data-v="${v}" value="${V[v]}">`}</label>`).join('')}</div><div class="pl2-pv" id="pv"></div><div class="pl2-ft"><span class="mu tn" id="cc"></span><button class="b ac sm" id="use">Use prompt</button></div>`;pv()}
function pv(){const [, ,tp]=T[s];let miss=0;const h=tp.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\{(\w+)\}/g,(_,v)=>{const x=(V[v]||'').trim();if(!x)miss++;return x?`<mark>${x.replace(/</g,'&lt;')}</mark>`:`<mark class="e">${v}</mark>`});document.getElementById('pv').innerHTML=h;const n=document.getElementById('pv').textContent.length;document.getElementById('cc').textContent=`${n} characters${miss?` · ${miss} field${miss>1?'s':''} empty`:''}`;document.getElementById('use').disabled=!!miss}
m.addEventListener('input',e=>{if(e.target.dataset.v){V[e.target.dataset.v]=e.target.value;pv()}});m.addEventListener('click',e=>{if(e.target.id==='use'){e.target.textContent='Copied to composer ✓'}});
document.getElementById('l').onclick=e=>{const li=e.target.closest('li');if(li){s=+li.dataset.i;list();main()}};q.oninput=list;list();main();
</script>

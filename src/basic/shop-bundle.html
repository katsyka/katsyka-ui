<!--Bundle Builder|Commerce|A build-your-own bundle: pick any 3 of 8 items, a progress tray that fills slot by slot with thumbnails, tiered discount (2 = 10%, 3 = 20%) shown live, and swap/remove in the tray.|ecommerce,bundle,discount,builder,upsell-->
<div class="k"><div class="bd"><h1>Build a breakfast box</h1><p class="mu">Pick 3 and save 20%. Pick 2 and save 10%.</p><ul class="bd-g" id="g"></ul><div class="bd-tr" id="tr" aria-live="polite"></div></div></div>
<style>
.bd{width:min(900px,100%);display:grid;gap:12px;padding-bottom:110px}.bd h1{margin:0;font-size:26px;letter-spacing:-.02em}.bd>p{margin:0}
.bd-g{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.bd-g button{width:100%;display:grid;gap:6px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);position:relative;transition:border-color .15s}.bd-g img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.bd-g b{font-size:14px}.bd-g span{font-size:13px;color:var(--mu)}
.bd-g [aria-pressed=true]{border:2px solid var(--fg);padding:7px}.bd-g [aria-pressed=true]::after{content:"✓";position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700}.bd-g button:disabled{opacity:.45;cursor:not-allowed}
.bd-tr{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));translate:-50% 0;width:min(620px,calc(100% - 32px));display:flex;gap:12px;align-items:center;padding:10px 10px 10px 12px;border-radius:16px;background:var(--fg);color:var(--bg);box-shadow:0 12px 32px -12px #0008;z-index:10}
.bd-sl{display:flex;gap:6px}.bd-sl i{width:44px;height:44px;border-radius:10px;border:1.5px dashed color-mix(in srgb,var(--bg) 40%,transparent);overflow:hidden;display:block}.bd-sl img{width:100%;height:100%;object-fit:cover;animation:bdi .3s cubic-bezier(.23,1,.32,1)}@keyframes bdi{from{transform:scale(.6);opacity:0}}
.bd-sm{flex:1;display:grid;font-size:13px;line-height:1.3}.bd-sm b{font-size:15px}.bd-sm s{opacity:.6;margin-right:6px}.bd-tr .b{background:var(--bg);color:var(--fg);height:44px}.bd-tr .b:disabled{opacity:.5}
@media (max-width:700px){.bd-g{grid-template-columns:1fr 1fr}.bd-sl i{width:36px;height:36px}}
</style>
<script>
const P=[["Rye sourdough",6,"c/1073"],["Strawberry jam",7,"c/1080"],["Filter coffee",12,"c/1060"],["Honey, raw",9,"c/1069"],["Granola",8,"c/1057"],["Cultured butter",5,"c/1056"],["Earl grey",7,"c/1042"],["Marmalade",7,"c/1026"]],sel=[],g=document.getElementById('g'),tr=document.getElementById('tr');
function draw(){g.innerHTML=P.map(([n,p,img],i)=>`<li><button aria-pressed="${sel.includes(i)}" data-i="${i}" ${sel.length>=3&&!sel.includes(i)?'disabled':''}><img src="media/pics/${img}.jpg" alt=""><b>${n}</b><span class="tn">€${p}</span></button></li>`).join('');
const sub=sel.reduce((a,i)=>a+P[i][1],0),d=sel.length===3?.2:sel.length===2?.1:0,tot=sub*(1-d);tr.innerHTML=`<div class="bd-sl">${[0,1,2].map(k=>`<i>${sel[k]!=null?`<img src="media/pics/${P[sel[k]][2]}.jpg" alt="${P[sel[k]][0]}">`:''}</i>`).join('')}</div><div class="bd-sm">${sel.length?`<b class="tn">${d?`<s>€${sub.toFixed(2)}</s>`:''}€${tot.toFixed(2)}</b><span>${sel.length===3?'You save 20%':`Add ${3-sel.length} more to save ${sel.length===2?'20%':sel.length===1?'10%':''}`}</span>`:'<b>Pick 3 items</b><span>Your box is empty</span>'}</div><button class="b" ${sel.length<2?'disabled':''}>Add box</button>`}
g.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i,k=sel.indexOf(i);k>=0?sel.splice(k,1):sel.length<3&&sel.push(i);draw();g.querySelector(`[data-i="${i}"]`).focus()};draw();
</script>

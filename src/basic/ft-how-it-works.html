<!--How It Works Steps|Features|A three-step process that is also interactive: each step has a tiny working control (paste a link, pick a plan, see the result), the connecting line fills as you complete steps, and the last step shows the real outcome.|features,how it works,steps,interactive,onboarding-->
<div class="k"><section class="hw"><h2>How it works</h2><ol class="hw-l" id="l"><li><span class="hw-n">1</span><div><h3>Paste your store link</h3><form id="f1" class="hw-r"><label class="vh" for="u">Store URL</label><input class="in" id="u" value="mossware.example"><button class="b sec sm">Scan</button></form><p class="mu" id="o1">We read your product pages. Nothing to install.</p></div></li>
<li><span class="hw-n">2</span><div><h3>Choose what to translate</h3><div class="hw-r" role="group" aria-label="Languages" id="lg"><button aria-pressed="true">German</button><button aria-pressed="true">French</button><button aria-pressed="false">Spanish</button><button aria-pressed="false">Japanese</button></div><p class="mu" id="o2"></p></div></li>
<li><span class="hw-n">3</span><div><h3>Go live</h3><p class="mu" id="o3">Your translated store will appear here.</p><div class="hw-pv" id="pv" hidden></div></div></li></ol></section></div>
<style>
.hw{width:min(720px,100%)}.hw h2{margin:0 0 28px;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em}.hw-l{list-style:none;padding:0;margin:0;display:grid;gap:0;position:relative}.hw-l li{display:grid;grid-template-columns:40px 1fr;gap:18px;padding-bottom:32px;position:relative}.hw-l li:not(:last-child)::after{content:"";position:absolute;left:19px;top:44px;bottom:4px;width:2px;background:linear-gradient(var(--fg) var(--f,0%),var(--line) var(--f,0%));transition:--f .5s}
.hw-n{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;background:var(--bg);transition:background .3s,color .3s,border-color .3s}.hw-l li.dn .hw-n{background:var(--fg);color:var(--bg);border-color:var(--fg)}.hw-l h3{margin:8px 0 10px;font-size:19px}.hw-l p{margin:8px 0 0;font-size:14px}
.hw-r{display:flex;gap:8px;flex-wrap:wrap}.hw-r .in{height:40px;max-width:260px;font:14px 'Geist Mono',monospace}.hw-r .b{height:40px}#lg button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px}#lg [aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hw-pv{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;animation:hwf .35s cubic-bezier(.23,1,.32,1)}@keyframes hwf{from{opacity:0;transform:translateY(6px)}}.hw-pv div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;display:grid;gap:4px;background:var(--bg)}.hw-pv code{font:11px 'Geist Mono',monospace;color:var(--mu)}
</style>
<script>
const $=i=>document.getElementById(i),L=[...$('l').children],T={German:['de','Steinzeugbecher, Moos'],French:['fr','Mug en grès, mousse'],Spanish:['es','Taza de gres, musgo'],Japanese:['ja','炻器マグ、モス']};let scanned=0;
const done=k=>{L.forEach((l,i)=>{l.classList.toggle('dn',i<k);l.style.setProperty('--f',i<k-1?'100%':i===k-1?'50%':'0%')})};
function langs(){const S=[...$('lg').querySelectorAll('[aria-pressed=true]')].map(b=>b.textContent);$('o2').textContent=S.length?`${S.length} language${S.length>1?'s':''} · about ${S.length*3} minutes for 142 products`:'Pick at least one.';if(scanned&&S.length){done(3);$('o3').textContent='Live. Visitors see their language automatically.';$('pv').hidden=false;$('pv').innerHTML=S.map(s=>`<div><code>${T[s][0]}.mossware.example</code><b>${T[s][1]}</b><span class="mu">€24</span></div>`).join('')}else if(scanned)done(1)}
$('f1').onsubmit=e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Scanning…';setTimeout(()=>{b.disabled=false;b.textContent='Rescan';scanned=1;$('o1').textContent=`Found 142 products and 6 pages on ${$('u').value}.`;done(1);langs()},800)};
$('lg').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');langs()};langs();
</script>

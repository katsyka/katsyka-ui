<!--Testimonial Wall|Testimonials|A masonry wall of quotes of very different lengths, filterable by where they came from (reviews, emails, interviews), with long quotes clamped and a “read more” that expands in place.|testimonials,masonry,wall,filter,reviews-->
<div class="k"><section class="tw"><div class="tw-h"><h2>What people wrote to us</h2><div class="tw-f" role="group" aria-label="Source" id="f"><button aria-pressed="true" data-s="">All</button><button aria-pressed="false" data-s="Review">Reviews</button><button aria-pressed="false" data-s="Email">Emails</button><button aria-pressed="false" data-s="Interview">Interviews</button></div></div><div class="tw-g" id="g"></div></section></div>
<style>
.tw{width:min(1080px,100%)}.tw-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}.tw-h h2{margin:0;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.tw-f{display:flex;gap:4px;flex-wrap:wrap}.tw-f button{height:34px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--mu)}.tw-f [aria-pressed=true]{background:var(--sf2);color:var(--fg)}
.tw-g{columns:3 280px;column-gap:14px}.tw-q{break-inside:avoid;margin:0 0 14px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:grid;gap:12px;animation:twf .3s cubic-bezier(.23,1,.32,1) both}@keyframes twf{from{opacity:0;transform:translateY(6px)}}
.tw-q p{margin:0;font-size:15px;line-height:1.55}.tw-q.cl p{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.tw-q .more{justify-self:start;font-size:13px;font-weight:600;color:var(--ac);min-height:28px}
.tw-q footer{display:flex;gap:10px;align-items:center;font-size:13px}.tw-q .av{width:32px;height:32px;font-size:11px}.tw-q footer div{display:grid}.tw-q small{color:var(--mu);font-size:12px}.tw-q .src{margin-left:auto;font-size:11px;color:var(--mu);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
</style>
<script>
const Q=[["Review","Exactly what it says. Set it up during lunch.","Dana K.","Bookkeeper","#0f766e"],["Email","I want to tell you about the night our server died during a product launch. Your status page said everything was fine, which was wrong, but your support person stayed on chat with me until 2 a.m., walked me through restoring from the snapshot, and then emailed the next morning to check. I've been a customer for six years and that night is why I'll stay another six.","Marcus Hale","CTO, ticketing startup","#7c3aed"],["Interview","The thing nobody tells you about switching tools is the retraining. With this, the team was using it properly by day three because it behaves like what they already knew.","Leila Farouk","Office manager","#b45309"],["Review","Fast. Doesn't nag. Exports are clean CSV, not some proprietary mess.","Jon P.","Data analyst","#be123c"],["Email","Small thing, but the keyboard shortcuts match the ones in my editor. Whoever decided that: thank you.","Ana Ruiz","Developer","#0369a1"],["Interview","We tried three competitors. Two were prettier. This one was the only one our accountant could use without calling us.","Kofi Mensah","Founder, coffee importer","#15803d"],["Review","Price went up last year and I grumbled, but they told us three months ahead and gave us the old rate until renewal. That's how you do it.","Sigrid L.","Agency owner","#9333ea"],["Email","Our board asked where the monthly report came from. I said I clicked a button. They didn't believe me.","Hannah Cole","COO, non-profit","#a16207"]];
const g=document.getElementById('g');let s='';
function draw(){g.innerHTML=Q.filter(q=>!s||q[0]===s).map(([src,t,n,r,c],i)=>`<figure class="tw-q${t.length>220?' cl':''}" style="animation-delay:${i*40}ms"><p>${t}</p>${t.length>220?'<button class="more" aria-expanded="false">Read more</button>':''}<footer><span class="av" style="--c:${c}">${n.split(' ').map(w=>w[0]).join('').slice(0,2)}</span><div><b>${n}</b><small>${r}</small></div><span class="src">${src}</span></footer></figure>`).join('')}
g.onclick=e=>{const b=e.target.closest('.more');if(!b)return;const f=b.closest('.tw-q'),o=f.classList.toggle('cl');b.textContent=o?'Read more':'Show less';b.setAttribute('aria-expanded',!o)};
document.getElementById('f').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#f button').forEach(x=>x.setAttribute('aria-pressed',x===b));s=b.dataset.s;draw()};draw();
</script>

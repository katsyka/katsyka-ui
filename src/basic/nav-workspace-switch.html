<!--Workspace Switcher|Navigation|A sidebar-top org switcher: current workspace with plan, a dropdown with search (appears when there are many), recent workspaces first, keyboard shortcuts ⌘1–⌘9, and create / join actions.|navigation,workspace,switcher,dropdown,organization-->
<div class="k"><div class="ws"><button class="ws-t" id="t" aria-haspopup="menu" aria-expanded="false"><span class="ws-lg" id="lg"></span><span class="ws-n"><b id="nm"></b><small class="mu" id="pl"></small></span>@I(down,16)</button><div class="ws-m" id="m" role="menu" hidden><label class="ws-s">@I(search,14)<input id="q" placeholder="Find workspace" aria-label="Find workspace"></label><div id="l"></div><div class="ws-f"><button role="menuitem">@I(plus,16)Create workspace</button><button role="menuitem">@I(users,16)Join with invite code</button></div></div></div></div>
<style>
.ws{width:240px;position:relative;align-self:start;margin-top:32px}.ws-t{width:100%;display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;text-align:left}.ws-t:hover,.ws-t[aria-expanded=true]{background:var(--bg);box-shadow:0 0 0 1px var(--line)}.ws-n{display:grid;flex:1;min-width:0}.ws-n b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ws-n small{font-size:12px}
.ws-lg{width:32px;height:32px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:750;flex:none;font-size:14px}
.ws-m{position:absolute;top:56px;left:0;width:280px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:5;box-shadow:0 12px 28px -12px #0004;transform-origin:top left;animation:wsm .16s cubic-bezier(.23,1,.32,1)}@keyframes wsm{from{opacity:0;transform:scale(.97)}}
.ws-s{display:flex;gap:6px;align-items:center;height:34px;padding:0 8px;margin-bottom:4px;border-bottom:1px solid var(--line);color:var(--mu)}.ws-s input{border:0;outline:0;background:none;flex:1;font-size:14px;color:var(--fg)}
.ws-h{font-size:11px;color:var(--mu);font-weight:650;padding:8px 8px 4px;text-transform:uppercase;letter-spacing:.05em}#l button{width:100%;display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;text-align:left;font-size:14px}#l button:hover,#l button:focus-visible{background:var(--sf)}#l .ws-lg{width:24px;height:24px;font-size:11px;border-radius:6px}#l kbd{margin-left:auto;font:11px 'Geist Mono',monospace;color:var(--mu)}#l [aria-checked=true]::after{content:"✓";color:var(--ac);margin-left:6px}
.ws-f{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}.ws-f button{width:100%;display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;font-size:14px;color:var(--mu)}.ws-f button:hover{background:var(--sf);color:var(--fg)}
</style>
<script>
let W=[["Northwind Design","Team · 14 members","#0f766e"],["Kestrel Labs","Business · 42 members","#7c3aed"],["Personal","Free","#64748b"],["Fjordline","Team · 8 members","#be123c"],["Night Owl Press","Free","#b45309"]],cur=0,rec=[0,1,2];const $=i=>document.getElementById(i);
function head(){const [n,p,c]=W[cur];$('lg').textContent=n[0];$('lg').style.setProperty('--c',c);$('nm').textContent=n;$('pl').textContent=p}
function list(){const v=$('q').value.toLowerCase(),M=W.map((w,i)=>[w,i]).filter(([w])=>w[0].toLowerCase().includes(v));const R=v?[]:rec.map(i=>[W[i],i]),O=v?M:M.filter(([,i])=>!rec.includes(i));const it=([w,i])=>`<button role="menuitemradio" aria-checked="${i===cur}" data-i="${i}"><span class="ws-lg" style="--c:${w[2]}">${w[0][0]}</span>${w[0]}<kbd>⌘${i+1}</kbd></button>`;$('l').innerHTML=(R.length?'<div class="ws-h">Recent</div>'+R.map(it).join(''):'')+(O.length?`<div class="ws-h">${v?'Results':'All workspaces'}</div>`+O.map(it).join(''):'<p class="mu" style="font-size:13px;padding:8px;margin:0">No match.</p>')}
function pick(i){cur=i;rec=[i,...rec.filter(x=>x!==i)].slice(0,3);head();close()}
const open=()=>{$('m').hidden=false;$('t').setAttribute('aria-expanded',true);$('q').value='';list();$('q').focus()},close=()=>{$('m').hidden=true;$('t').setAttribute('aria-expanded',false)};
$('t').onclick=()=>$('m').hidden?open():close();$('l').onclick=e=>{const b=e.target.closest('[data-i]');if(b)pick(+b.dataset.i)};$('q').oninput=list;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&/^[1-9]$/.test(e.key)&&W[e.key-1]){e.preventDefault();pick(e.key-1)}if(e.key==='Escape'&&!$('m').hidden){close();$('t').focus()}});document.addEventListener('pointerdown',e=>{if(!$('m').hidden&&!e.target.closest('.ws'))close()});head();
</script>

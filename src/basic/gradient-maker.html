<!--Gradient Maker|Custom|A mesh-style gradient builder: four colour points you can drag around a canvas, change each point's colour, shuffle into a new colourful set, and copy the CSS (layered radial gradients).|gradient,colour,generator,tool,css,colourful-->
<div class="k gm"><div class="gm-w"><div class="gm-c" id="c" aria-label="Gradient canvas. Drag the points."></div><div class="gm-s"><div class="gm-pts" id="pts"></div><div class="gm-a"><button class="b" id="sh">@I(shuffle,16)Shuffle</button><button class="b ac" id="cp">@I(copy,16)Copy CSS</button></div><pre class="gm-code" id="code"></pre><span role="status" class="mu gm-st" id="st"></span></div></div></div>
<style>
.k.gm{padding:16px}.gm-w{display:grid;grid-template-columns:1fr 280px;gap:16px;width:min(980px,100%)}
.gm-c{position:relative;aspect-ratio:4/3;border-radius:22px;touch-action:none;overflow:hidden}
.gm-h{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgb(0 0 0/.3);cursor:grab;padding:0}.gm-h:active{cursor:grabbing;scale:1.15}
.gm-s{display:grid;gap:12px;align-content:start}.gm-pts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gm-pts label{display:grid;gap:4px;font:12px 'Geist Mono',monospace;color:var(--mu);justify-items:center}
.gm-pts input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg);cursor:pointer}
.gm-a{display:flex;gap:8px}.gm-a .b{flex:1;display:flex;gap:6px;align-items:center;justify-content:center}
.gm-code{margin:0;font:12px/1.5 'Geist Mono',monospace;background:var(--sf2);border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:180px;overflow:auto}.gm-st{font-size:13px;min-height:1.2em}
@media (max-width:760px){.gm-w{grid-template-columns:1fr}}
</style>
<script>
let P=[[20,25,'#ff3d7f'],[80,20,'#ffd23f'],[25,80,'#5b6cff'],[78,75,'#3dd6c6']];
const c=document.getElementById('c'),pts=document.getElementById('pts'),code=document.getElementById('code'),st=document.getElementById('st');
const css=()=>P.map(p=>`radial-gradient(at ${p[0]|0}% ${p[1]|0}%, ${p[2]} 0, transparent 60%)`).join(',\n  ')+`,\n  ${P[0][2]}`;
function paint(){c.style.background=css().replace(/\n\s*/g,'');code.textContent='background:\n  '+css()+';';c.querySelectorAll('.gm-h').forEach((h,i)=>{h.style.left=P[i][0]+'%';h.style.top=P[i][1]+'%';h.style.background=P[i][2]})}
function build(){c.innerHTML='';pts.innerHTML='';P.forEach((p,i)=>{const h=document.createElement('button');h.className='gm-h';h.setAttribute('aria-label','Point '+(i+1)+', arrows to move');h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);h.onpointermove=ev=>{const r=c.getBoundingClientRect();P[i][0]=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));P[i][1]=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));paint()};h.onpointerup=()=>h.onpointermove=null};
h.onkeydown=e=>{const k={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];if(!k)return;e.preventDefault();P[i][0]=Math.max(0,Math.min(100,P[i][0]+k[0]));P[i][1]=Math.max(0,Math.min(100,P[i][1]+k[1]));paint()};c.append(h);
const l=document.createElement('label');l.innerHTML=`<input type="color" value="${p[2]}" aria-label="Colour ${i+1}">${i+1}`;l.querySelector('input').oninput=e=>{P[i][2]=e.target.value;paint()};pts.append(l)});paint()}
const hx=h=>{const f=n=>{const k=(n+h/30)%12,a=.85*Math.min(.6,.4);return Math.round(255*(.6-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
document.getElementById('sh').onclick=()=>{const b=Math.random()*360;P=P.map((p,i)=>[10+Math.random()*80,10+Math.random()*80,hx((b+i*(60+Math.random()*50))%360)]);build()};
document.getElementById('cp').onclick=()=>{const t='background:\n  '+css()+';',done=()=>{st.textContent='CSS copied';setTimeout(()=>st.textContent='',1500)};(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()})};
build();
</script>

<!--Customer Journey Quotes|Testimonials|One customer's quotes over time on a horizontal timeline (week 1, month 3, year 2): each stop shows what they said then and a small metric, so the testimonial reads as a story.|testimonials,timeline,story,journey,customer-->
<div class="k"><section class="tj"><div class="tj-h"><img src="media/pics/c/1006.jpg" alt=""><div><h2>Two years with Priya</h2><span class="mu">Co-founder of a two-person design studio</span></div></div><ol class="tj-l" id="l" role="tablist" aria-label="Timeline"></ol><div class="tj-p" id="p" role="tabpanel" aria-live="polite"></div></section></div>
<style>
.tj{width:min(820px,100%);display:grid;gap:24px}.tj-h{display:flex;gap:14px;align-items:center}.tj-h img{width:56px;height:56px;border-radius:50%;object-fit:cover}.tj-h h2{margin:0;font-size:22px;letter-spacing:-.02em}.tj-h div{display:grid}
.tj-l{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}.tj-l::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line)}.tj-l::after{content:"";position:absolute;left:0;top:9px;height:2px;width:var(--p,0%);background:var(--ac);transition:width .4s cubic-bezier(.23,1,.32,1)}
.tj-l button{position:relative;z-index:1;display:grid;gap:10px;justify-items:start;font-size:13px;color:var(--mu);text-align:left;min-height:44px}.tj-l button::before{content:"";width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--ctl);transition:all .2s;box-sizing:border-box}.tj-l .past::before{border-color:var(--ac);background:var(--ac)}.tj-l [aria-selected=true]{color:var(--fg);font-weight:650}.tj-l [aria-selected=true]::before{border-color:var(--ac);background:var(--bg);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.tj-p{display:grid;grid-template-columns:1fr 200px;gap:24px;align-items:center;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--bg);animation:tjf .3s cubic-bezier(.23,1,.32,1)}@keyframes tjf{from{opacity:0;transform:translateY(6px)}}.tj-p blockquote{margin:0;font-size:clamp(18px,2.2vw,22px);line-height:1.4;letter-spacing:-.01em}.tj-p .m{display:grid;gap:2px;padding-left:20px;border-left:1px solid var(--line)}.tj-p .m b{font-size:32px;letter-spacing:-.03em}.tj-p .m span{font-size:13px;color:var(--mu)}
@media (max-width:640px){.tj-p{grid-template-columns:1fr}.tj-p .m{border:0;padding:0}}
</style>
<script>
const S=[["Week 1","Honestly I signed up because the trial didn't need a card. First impression: fewer buttons than I expected. Good sign.","1","project set up"],["Month 3","We moved all client work over. My co-founder stopped asking me where things are, which saved our friendship.","19","active projects"],["Year 1","Raised our day rate. Clients see a tidy portal now instead of email threads, and it shows.","+22%","day rate"],["Year 2","Still two people. Doing the work of four. Not planning to change that.","64","projects shipped"]];
const l=document.getElementById('l'),p=document.getElementById('p');let i=0;
l.innerHTML=S.map((s,k)=>`<li><button role="tab" data-i="${k}">${s[0]}</button></li>`).join('');
function show(n,f){i=n;l.querySelectorAll('button').forEach((b,k)=>{b.setAttribute('aria-selected',k===i);b.tabIndex=k===i?0:-1;b.classList.toggle('past',k<i)});l.style.setProperty('--p',(i/(S.length-1)*100*.78)+'%');p.style.animation='none';p.offsetWidth;p.style.animation='';p.innerHTML=`<blockquote>“${S[i][1]}”</blockquote><div class="m"><b class="tn">${S[i][2]}</b><span>${S[i][3]}</span></div>`;if(f)l.querySelectorAll('button')[i].focus()}
l.onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.i)};l.onkeydown=e=>{if(e.key==='ArrowRight')show(Math.min(S.length-1,i+1),1);if(e.key==='ArrowLeft')show(Math.max(0,i-1),1)};show(0);
</script>

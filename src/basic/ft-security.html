<!--Security Section|Features|A trust section without fake badges: plain statements of how data is protected, each expandable into the technical detail, plus a “request our security docs” form gated on a work email.|features,security,trust,compliance,accordion-->
<div class="k"><section class="sx2"><div class="sx2-t"><h2>Your data, handled carefully</h2><p class="mu">What we actually do, in plain words. Open any line for the technical version.</p><form class="sx2-f" id="f" novalidate><label class="lbl" for="em">Get our security documentation</label><div><input class="in" id="em" type="email" autocomplete="email" placeholder="you@company.com"><button class="b sec">Request</button></div><p class="sx2-m" id="m" role="status"></p></form></div>
<div class="sx2-l" id="l"></div></section></div>
<style>
.sx2{width:min(980px,100%);display:grid;grid-template-columns:1fr 1.2fr;gap:56px;align-items:start}.sx2 h2{margin:0 0 10px;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.1}.sx2-t>p{margin:0 0 24px;font-size:16px;line-height:1.6}
.sx2-f>div{display:flex;gap:8px}.sx2-f .in{height:44px;font-size:16px}.sx2-f .b{height:44px}.sx2-m{font-size:13px;margin:8px 0 0}.sx2-m:empty{display:none}
.sx2-l details{border-top:1px solid var(--line)}.sx2-l details:last-child{border-bottom:1px solid var(--line)}.sx2-l summary{display:grid;grid-template-columns:24px 1fr 20px;gap:14px;align-items:center;padding:18px 0;cursor:pointer;list-style:none;font-size:16px;font-weight:550}.sx2-l summary::-webkit-details-marker{display:none}.sx2-l summary .i:first-child{color:var(--ok)}.sx2-l summary .i:last-child{color:var(--mu);transition:transform .2s cubic-bezier(.23,1,.32,1)}.sx2-l [open] summary .i:last-child{transform:rotate(45deg)}
.sx2-l p{margin:0 0 18px 38px;font-size:14px;line-height:1.65;color:var(--mu)}.sx2-l code{font:12.5px 'Geist Mono',monospace;background:var(--sf2);padding:1px 4px;border-radius:4px}
@media (max-width:760px){.sx2{grid-template-columns:1fr;gap:28px}}
</style>
<script>
const S=[["Encrypted everywhere","Data is encrypted in transit with TLS 1.3 and at rest with AES-256. Keys live in a managed HSM and rotate every 90 days."],["Stored in the EU","Primary storage in Frankfurt, backups in Amsterdam. Nothing is replicated outside the EU unless you turn on a US region."],["Least-privilege access","Engineers can't read customer content by default. Access requires a ticket, a second approver and expires after 4 hours. Every access is logged."],["Independent audits","SOC 2 Type II report renewed every October, plus a yearly external penetration test. Reports available under NDA."],["You can leave","Export everything as JSON or CSV at any time. On deletion, data is purged from live systems in 7 days and backups in 35."]];
document.getElementById('l').innerHTML=S.map(([a,b],i)=>`<details ${i?'':'open'}><summary>@I(shield,20)<span>${a}</span>@I(plus,18)</summary><p>${b}</p></details>`).join('');
document.getElementById('f').onsubmit=e=>{e.preventDefault();const em=document.getElementById('em'),m=document.getElementById('m'),v=em.value.trim(),ok=/^\S+@\S+\.\S+$/.test(v),free=/@(gmail|yahoo|hotmail|outlook|icloud)\./i.test(v);em.setAttribute('aria-invalid',!ok||free);m.style.color=ok&&!free?'var(--ok)':'var(--err)';m.textContent=!ok?'Enter a valid email.':free?'Please use your work email, the documents are shared under NDA.':`Sent. Check ${v} for the NDA and download link.`;if(!ok||free)em.focus()};
</script>

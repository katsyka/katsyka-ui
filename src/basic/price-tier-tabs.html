<!--Audience Tabs Pricing|Pricing|Pricing that changes by audience: tabs for Personal, Teams and Education swap the whole plan set with a cross-fade, keep the tab in sync with arrow keys, and highlight one plan per audience.|pricing,tabs,audience,segments,plans-->
<div class="k">
<section class="pa"><div class="pa-tb" role="tablist" aria-label="Audience" id="tb"><button role="tab" aria-selected="true" data-i="0" id="t0">Personal</button><button role="tab" aria-selected="false" data-i="1" tabindex="-1" id="t1">Teams</button><button role="tab" aria-selected="false" data-i="2" tabindex="-1" id="t2">Education</button></div>
<div class="pa-g" id="g" role="tabpanel" aria-labelledby="t0"></div></section>
</div>
<style>
.pa{width:min(900px,100%)}.pa-tb{display:flex;gap:4px;justify-content:center;margin-bottom:24px}.pa-tb button{height:40px;padding:0 18px;border-radius:999px;font-weight:550;color:var(--mu)}.pa-tb [aria-selected=true]{background:var(--fg);color:var(--bg)}
.pa-g{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;animation:paf .3s var(--ease)}@keyframes paf{from{opacity:0;transform:translateY(6px)}}
.pa-c{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:10px;align-content:start}.pa-c.hl{border:2px solid var(--ac)}.pa-c h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:center}.pa-c b{font-size:40px;letter-spacing:-.03em}.pa-c b small{font-size:14px;color:var(--mu);font-weight:500}.pa-c p{margin:0;color:var(--mu);font-size:14px}.pa-c ul{list-style:none;padding:0;margin:6px 0;display:grid;gap:8px;font-size:14px}.pa-c li{display:flex;gap:8px}.pa-c li .i{color:var(--ok);width:16px;height:16px;margin-top:2px}.pa-c .b{height:44px}
@media (max-width:640px){.pa-g{grid-template-columns:1fr}}
</style>
<script>
const S=[[["Free","€0","Notes, tasks and a calendar for one.",["5 GB","Sync on 2 devices"]],["Plus","€5","Everything, on every device.",["100 GB","Unlimited devices","Offline mode"],1]],[["Team","€9","Per member, for groups up to 50.",["Shared spaces","Admin console","Guest access"],1],["Business","€18","Per member, for regulated work.",["SSO & SCIM","Audit log","Data residency"]]],[["Student","€0","Free with a school email.",["Everything in Plus","Renews yearly"],1],["Campus","Custom","For whole schools and districts.",["Rostering","LMS integrations","Volume pricing"]]]];
const tb=document.getElementById('tb'),g=document.getElementById('g'),T=[...tb.children];
function sel(i,f){T.forEach((t,j)=>{t.setAttribute('aria-selected',i===j);t.tabIndex=i===j?0:-1});g.setAttribute('aria-labelledby','t'+i);g.style.animation='none';g.offsetWidth;g.style.animation='';g.innerHTML=S[i].map(([n,p,d,f,h])=>`<div class="pa-c${h?' hl':''}"><h3>${n}${h?'<span class="pill info">Recommended</span>':''}</h3><b class="tn">${p}${p[0]==='€'?'<small> /mo</small>':''}</b><p>${d}</p><ul>${f.map(x=>`<li>@I(check)${x}</li>`).join('')}</ul><a class="b ${h?'ac':'sec'}" href="#">${p==='Custom'?'Contact us':'Choose '+n}</a></div>`).join('');if(f)T[i].focus()}
tb.onclick=e=>{const b=e.target.closest('[role=tab]');if(b)sel(+b.dataset.i)};tb.onkeydown=e=>{const i=T.findIndex(t=>t.getAttribute('aria-selected')==='true');if(e.key==='ArrowRight')sel((i+1)%3,1);if(e.key==='ArrowLeft')sel((i+2)%3,1)};sel(0);
</script>

<!--Model Picker|AI|A model selection popover: models listed with speed, quality and cost as small bars, a context window note, “best for” tags, keyboard navigation, the current choice in the trigger, and a one-line explanation of the trade-off.|ai,model,picker,dropdown,listbox,llm-->
<div class="k"><div class="mp"><button class="mp-t" id="t" aria-haspopup="listbox" aria-expanded="false" aria-controls="lb"><span class="mp-d"></span><span id="tn"></span>@I(down,16)</button><ul class="mp-l" id="lb" role="listbox" aria-label="Model" tabindex="-1" hidden></ul><p class="mp-x mu" id="x"></p></div></div>
<style>
.mp{width:min(420px,100%);position:relative;align-self:start;margin-top:40px}.mp-t{display:flex;gap:8px;align-items:center;height:40px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;font-size:14px}.mp-t:hover{border-color:var(--ctl)}.mp-d{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mp-l{position:absolute;top:46px;left:0;width:100%;list-style:none;margin:0;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #0000000d,0 12px 28px -12px #0004;z-index:5;transform-origin:top left;animation:mpo .16s cubic-bezier(.23,1,.32,1);outline:0}@keyframes mpo{from{opacity:0;transform:scale(.97)}}
.mp-l li{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 12px;border-radius:10px;cursor:pointer}.mp-l li.cur{background:var(--sf2)}.mp-l li[aria-selected=true] b::after{content:" ✓";color:var(--ac)}.mp-l b{font-size:14px}.mp-l small{grid-column:1/-1;font-size:12px;color:var(--mu)}
.mp-m{display:flex;gap:10px;font-size:11px;color:var(--mu);grid-column:1/-1}.mp-m span{display:flex;gap:4px;align-items:center}.mp-m i{display:flex;gap:2px}.mp-m i::before,.mp-m i::after,.mp-m em{content:"";width:5px;height:8px;border-radius:1px;background:var(--line)}.mp-m em{display:inline-block}
.mp-bar{display:inline-flex;gap:2px}.mp-bar s{width:5px;height:9px;border-radius:1px;background:var(--line);text-decoration:none}.mp-bar s.f{background:var(--fg)}
.mp-tg{display:flex;gap:4px;flex-wrap:wrap}.mp-tg span{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sf2);color:var(--mu)}.mp-x{font-size:13px;margin:10px 0 0}
</style>
<script>
const M=[["Swift","Quick answers, autocomplete and simple edits",5,2,1,"128k",["Chat","Autocomplete"]],["Balanced","Most everyday writing and coding",3,4,2,"200k",["Writing","Code review"]],["Deep","Long documents, analysis and tricky reasoning",1,5,4,"1M",["Research","Analysis"]],["Vision","Reading screenshots, charts and PDFs",3,4,3,"200k",["Images","Documents"]]];
const $=i=>document.getElementById(i),lb=$('lb'),t=$('t');let sel=1,cur=1;const bar=(n,c=5)=>`<span class="mp-bar">${Array.from({length:c},(_,i)=>`<s class="${i<n?'f':''}"></s>`).join('')}</span>`;
function draw(){lb.innerHTML=M.map(([n,d,sp,q,c,ctx,tg],i)=>`<li role="option" id="o${i}" aria-selected="${i===sel}" class="${i===cur?'cur':''}" data-i="${i}"><b>${n}</b><span class="mp-tg">${tg.map(x=>`<span>${x}</span>`).join('')}</span><small>${d} · ${ctx} context</small><span class="mp-m"><span>Speed ${bar(sp)}</span><span>Quality ${bar(q)}</span><span>Cost ${bar(c,4)}</span></span></li>`).join('');lb.setAttribute('aria-activedescendant','o'+cur);$('tn').textContent=M[sel][0];$('x').textContent=sel===0?'Fastest and cheapest. May miss nuance on long tasks.':sel===2?'Slowest and most expensive. Worth it for long, careful work.':sel===3?'Use it when your question includes images or PDFs.':'A good default for most work.'}
const open=o=>{lb.hidden=!o;t.setAttribute('aria-expanded',o);if(o){cur=sel;draw();lb.focus()}else t.focus()};
t.onclick=()=>open(lb.hidden);lb.onclick=e=>{const li=e.target.closest('li');if(!li)return;sel=+li.dataset.i;open(false);draw()};lb.onpointermove=e=>{const li=e.target.closest('li');if(li&&+li.dataset.i!==cur){cur=+li.dataset.i;draw()}};
lb.onkeydown=e=>{if(e.key==='ArrowDown'){cur=(cur+1)%M.length;draw();e.preventDefault()}if(e.key==='ArrowUp'){cur=(cur+M.length-1)%M.length;draw();e.preventDefault()}if(e.key==='Enter'||e.key===' '){sel=cur;open(false);draw();e.preventDefault()}if(e.key==='Escape')open(false)};
document.addEventListener('pointerdown',e=>{if(!lb.hidden&&!e.target.closest('.mp'))open(false)});draw();
</script>

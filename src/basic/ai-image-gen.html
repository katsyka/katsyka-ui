<!--Image Generation Grid|AI|A text-to-image panel: prompt with aspect ratio and style chips, four results that develop from blur with per-tile progress, then select, upscale (with spinner) and download actions, plus prompt history.|ai,image generation,prompt,grid,progress-->
<div class="k"><div class="ig2"><form class="ig2-f" id="f"><label class="vh" for="p">Prompt</label><textarea class="in" id="p" rows="2">A quiet coastal road at golden hour, cliffs and sea, film photo</textarea><div class="ig2-o"><div class="ig2-ch" role="radiogroup" aria-label="Aspect"><button type="button" role="radio" aria-checked="false" data-a="1/1">1:1</button><button type="button" role="radio" aria-checked="true" data-a="4/5">4:5</button><button type="button" role="radio" aria-checked="false" data-a="16/9">16:9</button></div><div class="ig2-ch" role="radiogroup" aria-label="Style"><button type="button" role="radio" aria-checked="true">Photo</button><button type="button" role="radio" aria-checked="false">Illustration</button><button type="button" role="radio" aria-checked="false">3D</button></div><button class="b ac" id="go">Generate</button></div></form><div class="ig2-g" id="g"></div><p class="mu ig2-h" id="h"></p></div></div>
<style>
.ig2{width:min(820px,100%);display:grid;gap:16px}.ig2-f{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.ig2-f textarea{height:auto;padding:10px 12px;font-size:16px;resize:vertical;border-color:var(--line)}.ig2-o{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ig2-o .b{margin-left:auto}
.ig2-ch{display:flex;background:var(--sf2);border-radius:9px;padding:2px}.ig2-ch button{height:30px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:550;color:var(--mu)}.ig2-ch [aria-checked=true]{background:var(--bg);color:var(--fg)}
.ig2-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ig2-t{position:relative;border-radius:12px;overflow:hidden;background:var(--sf2);aspect-ratio:var(--ar,4/5)}.ig2-t img{width:100%;height:100%;object-fit:cover;filter:blur(var(--b,24px)) saturate(var(--s,.4));transform:scale(1.08);transition:filter .3s,transform .6s cubic-bezier(.23,1,.32,1)}.ig2-t.dn img{transform:none}
.ig2-t .pg2{position:absolute;left:10px;bottom:10px;font:600 12px 'Geist Mono',monospace;background:#000a;color:#fff;padding:2px 8px;border-radius:999px}.ig2-t .ac{position:absolute;inset:auto 8px 8px;display:flex;gap:6px;opacity:0;transition:opacity .2s}.ig2-t.dn:hover .ac,.ig2-t.dn:focus-within .ac{opacity:1}.ig2-t .ac button{flex:1;height:32px;border-radius:8px;background:#fffe;color:#111;font-size:12px;font-weight:600}
.ig2-t.sel{outline:3px solid var(--ac);outline-offset:2px}.ig2-h{font-size:13px;margin:0}
@media (max-width:700px){.ig2-g{grid-template-columns:1fr 1fr}.ig2-t .ac{opacity:1}}
</style>
<script>
const P=['c/1057','c/1050','c/1035','c/1049','c/1051','c/1043','c/1026','c/1053'],g=document.getElementById('g');let ar='4/5',run=0,hist=[];
document.querySelectorAll('.ig2-ch').forEach(c=>c.onclick=e=>{const b=e.target.closest('button');if(!b)return;c.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));if(b.dataset.a){ar=b.dataset.a;g.style.setProperty('--ar',ar)}});
document.getElementById('f').onsubmit=e=>{e.preventDefault();const p=document.getElementById('p').value.trim();if(!p)return;run++;hist.unshift(p);document.getElementById('h').textContent='Recent: '+hist.slice(0,3).map(x=>'“'+x.slice(0,40)+(x.length>40?'…':'')+'”').join(' · ');const go=document.getElementById('go');go.disabled=true;go.textContent='Generating…';
g.innerHTML=[0,1,2,3].map(i=>`<div class="ig2-t" data-i="${i}"><img src="media/pics/${P[(i+run*4)%P.length]}.jpg" alt="Generated image ${i+1} for: ${p.replace(/"/g,'')}"><span class="pg2">0%</span><div class="ac"><button data-u="${i}">Upscale</button><button data-d="${i}">Save</button></div></div>`).join('');
const T=[...g.children];let done=0;T.forEach((t,i)=>{let v=0;const iv=setInterval(()=>{v=Math.min(100,v+Math.random()*12+4);t.style.setProperty('--b',(24*(1-v/100)).toFixed(1)+'px');t.style.setProperty('--s',(.4+.6*v/100).toFixed(2));t.querySelector('.pg2').textContent=Math.round(v)+'%';if(v>=100){clearInterval(iv);t.classList.add('dn');t.querySelector('.pg2').remove();if(++done===4){go.disabled=false;go.textContent='Generate again'}}},120+i*40)})};
g.onclick=e=>{const u=e.target.closest('[data-u]');if(u){u.textContent='Upscaling…';u.disabled=true;setTimeout(()=>{u.textContent='4K ✓'},1300);return}const d=e.target.closest('[data-d]');if(d){d.textContent='Saved ✓';return}const t=e.target.closest('.ig2-t.dn');if(t)g.querySelectorAll('.ig2-t').forEach(x=>x.classList.toggle('sel',x===t))};
document.getElementById('f').requestSubmit();
</script>

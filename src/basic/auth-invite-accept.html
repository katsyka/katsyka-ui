<!--Accept Invitation|Auth|A team invite landing: who invited you, the workspace with member avatars, your role, a name + password form prefilled with the invited email, and a decline link with confirmation.|auth,invite,team,onboarding,workspace-->
<div class="k">
<div class="card ia"><div class="ia-ws"><span class="ia-lg">N</span><div><b>Northwind Design</b><span class="mu">14 members</span></div><div class="ia-av" aria-hidden="true"><span class="av" style="--c:#0f766e">AK</span><span class="av" style="--c:#7c3aed">JL</span><span class="av" style="--c:#b45309">MS</span><span class="av ia-more">+11</span></div></div>
<h1><b>Jonas Lind</b> invited you to join Northwind Design as an <span class="pill info">Editor</span></h1>
<form id="f" novalidate><label><span class="lbl">Email</span><input class="in" value="sam@northwind.example" readonly aria-readonly="true"></label><label><span class="lbl">Your name</span><input class="in" id="nm" autocomplete="name"></label><label><span class="lbl">Create a password</span><input class="in" id="pw" type="password" autocomplete="new-password" minlength="8"></label><p class="ia-er" id="er" role="alert"></p><button class="b ac ia-go" id="go">Accept and join</button></form>
<p class="ia-dc mu" id="dc">Not expecting this? <button id="dl">Decline invitation</button></p><p class="mu ia-ex">@I(clock,14) Invite expires in 6 days</p></div>
</div>
<style>
.ia{width:min(420px,100%);padding:28px}.ia-ws{display:flex;gap:12px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.ia-ws>div:nth-child(2){display:grid;flex:1}.ia-lg{width:44px;height:44px;border-radius:12px;background:#1e293b;color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.ia-av{display:flex}.ia-av .av{width:28px;height:28px;font-size:10px;border:2px solid var(--bg);margin-left:-8px}.ia-more{background:var(--sf2)!important;color:var(--mu)!important}
.ia h1{font-size:17px;font-weight:450;line-height:1.5;margin:20px 0}.ia h1 b{font-weight:650}
.ia form{display:grid;gap:12px}.ia .in{height:44px;font-size:16px}.ia .in[readonly]{background:var(--sf);color:var(--mu)}.ia-go{height:44px;margin-top:4px}.ia-er{color:var(--err);font-size:13px;margin:0}.ia-er:empty{display:none}
.ia-dc{text-align:center;font-size:13px;margin:16px 0 4px}.ia-dc button{color:var(--fg);text-decoration:underline;font-size:13px;min-height:32px}.ia-ex{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;margin:0}
</style>
<script>
const $=i=>document.getElementById(i);
$('f').onsubmit=e=>{e.preventDefault();const nm=$('nm'),pw=$('pw');[nm,pw].forEach(i=>i.removeAttribute('aria-invalid'));let m='';if(!nm.value.trim()){m='Add your name so teammates know who you are.';nm.setAttribute('aria-invalid',true);nm.focus()}else if(pw.value.length<8){m='Password needs at least 8 characters.';pw.setAttribute('aria-invalid',true);pw.focus()}$('er').textContent=m;if(m)return;const g=$('go');g.disabled=true;g.textContent='Joining…';setTimeout(()=>{g.textContent='Joined. Opening Northwind Design'},900)};
function dec(){const d=$('dc');d.innerHTML='Decline the invite from Jonas? <button id="y">Yes, decline</button> · <button id="n">Keep it</button>';$('y').onclick=()=>{d.textContent='Invitation declined. Jonas will be notified.';$('f').querySelectorAll('input,button').forEach(i=>i.disabled=true)};$('n').onclick=()=>{d.innerHTML='Not expecting this? <button id="dl">Decline invitation</button>';$('dl').onclick=dec}}$('dl').onclick=dec;
</script>

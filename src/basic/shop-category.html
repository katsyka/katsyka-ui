<!--Category Grid with Filters|Commerce|A product listing: filter sidebar (price range, size, colour, in stock) that becomes a bottom sheet on mobile, active filter chips, sort, result count, and product cards with second-image hover and colour dots.|ecommerce,category,filters,grid,sort,listing-->
<div class="k pg sc3"><div class="w"><div class="sc3-h"><h1>Outerwear <span class="mu tn" id="ct"></span></h1><div class="sc3-tb"><button class="b sec sm sc3-fb" id="fb">@I(sliders,14)Filters</button><label class="mu">Sort <select id="so"><option value="pop">Popular</option><option value="lo">Price, low to high</option><option value="hi">Price, high to low</option><option value="new">Newest</option></select></label></div></div><div class="sc3-ch" id="ch"></div>
<div class="sc3-g"><aside class="sc3-f" id="fp" aria-label="Filters"><div class="sc3-fh"><b>Filters</b><button class="ibt" id="fx" aria-label="Close filters">@I(x)</button></div><fieldset><legend class="lbl">Max price: <b class="tn" id="pv"></b></legend><input type="range" id="pr" min="60" max="320" step="10" value="320"></fieldset><fieldset><legend class="lbl">Size</legend><div class="sc3-sz" id="szf"></div></fieldset><fieldset><legend class="lbl">Colour</legend><div class="sc3-cl" id="clf"></div></fieldset><label class="sc3-is"><input type="checkbox" id="is"> In stock only</label><button class="b ac sc3-ap" id="ap">Show results</button></aside><ul class="sc3-l" id="l"></ul></div></div></div>
<style>
.sc3-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding:32px 0 12px}.sc3-h h1{margin:0;font-size:28px;letter-spacing:-.02em}.sc3-h h1 span{font-size:15px;font-weight:400}.sc3-tb{display:flex;gap:10px;align-items:center;font-size:13px}.sc3-tb select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;color:var(--fg);margin-left:6px}.sc3-fb{display:none}
.sc3-ch{display:flex;gap:6px;flex-wrap:wrap;min-height:8px;margin-bottom:12px}.sc3-ch button{display:flex;gap:4px;align-items:center;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--sf2);font-size:12px}.sc3-ch .i{width:12px;height:12px}.sc3-ch .clr{background:none;text-decoration:underline;padding:0 6px}
.sc3-g{display:grid;grid-template-columns:220px 1fr;gap:32px;padding-bottom:80px}.sc3-f{display:grid;gap:20px;align-content:start;position:sticky;top:16px}.sc3-f fieldset{border:0;margin:0;padding:0}.sc3-f input[type=range]{width:100%;accent-color:var(--fg)}.sc3-fh,.sc3-ap{display:none}
.sc3-sz{display:flex;flex-wrap:wrap;gap:6px}.sc3-sz button{min-width:44px;height:36px;border:1px solid var(--ctl);border-radius:8px;font-size:13px}.sc3-sz [aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.sc3-cl{display:flex;gap:8px;flex-wrap:wrap}.sc3-cl button{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px #0002;outline-offset:2px}.sc3-cl [aria-pressed=true]{outline:2px solid var(--fg)}.sc3-is{display:flex;gap:8px;align-items:center;font-size:14px}.sc3-is input{width:18px;height:18px;accent-color:var(--fg)}
.sc3-l{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 16px;align-content:start}.sc3-l a{display:grid;gap:6px;color:inherit;text-decoration:none;font-size:14px}.sc3-im{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--sf)}.sc3-im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}.sc3-im img+img{opacity:0}.sc3-l a:hover .sc3-im img+img{opacity:1}.sc3-im .pill{position:absolute;top:8px;left:8px}
.sc3-dots{display:flex;gap:4px}.sc3-dots i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px #0002}.sc3-l .em{grid-column:1/-1;text-align:center;color:var(--mu);padding:48px 0}
@media (max-width:860px){.sc3-g{grid-template-columns:1fr}.sc3-fb{display:inline-flex}.sc3-f{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-shadow:0 -8px 32px #0003;max-height:80dvh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.23,1,.32,1)}.sc3-f.open{transform:none}.sc3-fh{display:flex;justify-content:space-between;align-items:center}.sc3-ap{display:inline-flex;height:48px}.sc3-l{grid-template-columns:1fr 1fr}}
</style>
<script>
const CL={Olive:'#4d5a36',Navy:'#1f2a44',Sand:'#c8b28a',Black:'#1c1c1c',Rust:'#9a3f1f'},P=[["Field jacket",240,["Olive","Navy"],["S","M","L"],1,"c/1043","c/1063",3],["Rain shell",180,["Black","Rust"],["XS","S","M","L","XL"],1,"c/1052","c/1053",5],["Quilted vest",120,["Sand","Olive"],["M","L"],1,"c/1050","c/1049",1],["Wool overshirt",160,["Rust","Navy"],["S","M"],0,"c/1072","c/1057",4],["Down parka",320,["Black"],["M","L","XL"],1,"c/1041","w/1036",2],["Linen chore coat",140,["Sand"],["XS","S","M"],1,"c/1047","c/1048",6],["Waxed cap",60,["Olive","Black"],["One size"],1,"c/1063","c/1043",7]];
const F={max:320,sz:new Set(),cl:new Set(),stock:false},$=i=>document.getElementById(i);
$('szf').innerHTML=['XS','S','M','L','XL'].map(s=>`<button aria-pressed="false" data-s="${s}">${s}</button>`).join('');$('clf').innerHTML=Object.entries(CL).map(([n,c])=>`<button aria-pressed="false" aria-label="${n}" data-c="${n}" style="--c:${c}"></button>`).join('');
function draw(){const so=$('so').value;let L=P.filter(p=>p[1]<=F.max&&(!F.sz.size||p[3].some(s=>F.sz.has(s)))&&(!F.cl.size||p[2].some(c=>F.cl.has(c)))&&(!F.stock||p[4]));L.sort((a,b)=>so==='lo'?a[1]-b[1]:so==='hi'?b[1]-a[1]:so==='new'?b[7]-a[7]:a[7]-b[7]);
$('l').innerHTML=L.length?L.map(([n,pr,cs,,st,i1,i2])=>`<li><a href="#"><span class="sc3-im"><img src="media/pics/${i1}.jpg" alt="" loading="lazy"><img src="media/pics/${i2}.jpg" alt="" loading="lazy">${st?'':'<span class="pill">Sold out</span>'}</span><b>${n}</b><span class="tn">€${pr}</span><span class="sc3-dots" aria-label="Colours: ${cs.join(', ')}">${cs.map(c=>`<i style="--c:${CL[c]}"></i>`).join('')}</span></a></li>`).join(''):'<li class="em">Nothing matches. Try removing a filter.</li>';$('ct').textContent=L.length+' items';$('pv').textContent='€'+F.max;$('ap').textContent=`Show ${L.length} results`;
const C=[...(F.max<320?[['p','Under €'+F.max]]:[]),...[...F.sz].map(s=>['s',s]),...[...F.cl].map(c=>['c',c]),...(F.stock?[['k','In stock']]:[])];$('ch').innerHTML=C.map(([k,v])=>`<button data-k="${k}" data-v="${v}" aria-label="Remove ${v}">${v}@I(x)</button>`).join('')+(C.length?'<button class="clr" data-k="all">Clear all</button>':'')}
$('pr').oninput=e=>{F.max=+e.target.value;draw()};$('szf').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset.s;F.sz.has(s)?F.sz.delete(s):F.sz.add(s);b.setAttribute('aria-pressed',F.sz.has(s));draw()};$('clf').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;F.cl.has(c)?F.cl.delete(c):F.cl.add(c);b.setAttribute('aria-pressed',F.cl.has(c));draw()};$('is').onchange=e=>{F.stock=e.target.checked;draw()};$('so').onchange=draw;
$('ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,v=b.dataset.v;if(k==='all'){F.max=320;F.sz.clear();F.cl.clear();F.stock=false}if(k==='p')F.max=320;if(k==='s')F.sz.delete(v);if(k==='c')F.cl.delete(v);if(k==='k')F.stock=false;$('pr').value=F.max;$('is').checked=F.stock;$('szf').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',F.sz.has(x.dataset.s)));$('clf').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',F.cl.has(x.dataset.c)));draw()};
$('fb').onclick=()=>$('fp').classList.add('open');$('fx').onclick=$('ap').onclick=()=>$('fp').classList.remove('open');draw();
</script>

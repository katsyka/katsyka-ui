<!--Release Notes|Content|Versioned release notes: version + date rail, entries tagged New / Improved / Fixed with filters, a “breaking change” callout with migration snippet, and permalinks you can copy per version.|changelog,release notes,versions,filter,permalink-->
<div class="k"><div class="rn"><div class="rn-h"><h1>Release notes</h1><div class="rn-f" role="group" aria-label="Filter" id="f"><button aria-pressed="true" data-t="">All</button><button aria-pressed="false" data-t="new">New</button><button aria-pressed="false" data-t="imp">Improved</button><button aria-pressed="false" data-t="fix">Fixed</button></div></div><div id="l"></div><p class="rn-m" id="m" role="status"></p></div></div>
<style>
.rn{width:min(760px,100%)}.rn-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}.rn-h h1{margin:0;font-size:28px;letter-spacing:-.02em}.rn-f{display:flex;gap:4px}.rn-f button{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--mu)}.rn-f [aria-pressed=true]{background:var(--sf2);color:var(--fg)}
.rn-v{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:24px 0;border-top:1px solid var(--line)}.rn-v aside{display:grid;gap:2px;align-content:start;position:sticky;top:16px}.rn-v aside b{font:600 16px 'Geist Mono',monospace;display:flex;gap:6px;align-items:center}.rn-v aside button{width:28px;height:28px;border-radius:6px;color:var(--mu);display:grid;place-items:center}.rn-v aside button:hover{background:var(--sf2);color:var(--fg)}.rn-v aside .i{width:14px;height:14px}.rn-v time{font-size:13px;color:var(--mu)}
.rn-v ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}.rn-v li{display:grid;grid-template-columns:80px 1fr;gap:12px;font-size:15px;line-height:1.55}.rn-t{font:600 11px 'Geist Mono',monospace;text-transform:uppercase;letter-spacing:.04em;padding:3px 0}.rn-t.new{color:var(--ok)}.rn-t.imp{color:var(--info)}.rn-t.fix{color:var(--mu)}
.rn-v li.rn-br{display:block;grid-column:1/-1;padding:12px 14px;border-radius:10px;background:var(--warn-sf);font-size:14px}.rn-br pre{margin:8px 0 0;font:12.5px/1.6 'Geist Mono',monospace;background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto}
.rn-m{position:fixed;bottom:20px;left:50%;translate:-50% 0;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;margin:0}.rn-m:empty{display:none}
@media (max-width:600px){.rn-v{grid-template-columns:1fr;gap:10px}.rn-v aside{position:static;grid-auto-flow:column;justify-content:start;gap:12px;align-items:center}.rn-v li{grid-template-columns:1fr}}
</style>
<script>
const V=[["2.14.0","12 Nov 2026",[["new","Instant rollbacks from the CLI with shipit rollback."],["imp","Build logs stream 3× faster on large projects."],["fix","Preview URLs no longer 404 for branch names with slashes."]],"Node 18 is no longer supported. Set engines.node to 20 or later:\n\"engines\": { \"node\": \">=20\" }"],["2.13.2","4 Nov 2026",[["fix","Environment variables with = in the value are parsed correctly."],["fix","Fixed a crash when the project folder name contained spaces."]]],["2.13.0","28 Oct 2026",[["new","Region pinning with --region."],["imp","Cold starts reduced by ~40% for edge functions."],["imp","Clearer error when a domain's DNS is misconfigured."]]]];
const l=document.getElementById('l');let t='';
function draw(){l.innerHTML=V.map(([v,d,E,br])=>{const F=E.filter(e=>!t||e[0]===t);if(!F.length&&!(br&&!t))return'';return`<section class="rn-v" id="v${v.replace(/\./g,'-')}"><aside><b>v${v}<button data-v="${v}" aria-label="Copy link to v${v}">@I(hash,14)</button></b><time>${d}</time></aside><ul>${br&&!t?`<li class="rn-br"><b>Breaking change.</b> ${br.split('\n')[0]}<pre>${br.split('\n')[1]}</pre></li>`:''}${F.map(([k,x])=>`<li><span class="rn-t ${k}">${{new:'New',imp:'Improved',fix:'Fixed'}[k]}</span><span>${x}</span></li>`).join('')}</ul></section>`}).join('')}
document.getElementById('f').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#f button').forEach(x=>x.setAttribute('aria-pressed',x===b));t=b.dataset.t;draw()};
l.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const u=location.href.split('#')[0]+'#v'+b.dataset.v.replace(/\./g,'-');(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).catch(()=>{});const m=document.getElementById('m');m.textContent='Link to v'+b.dataset.v+' copied';setTimeout(()=>m.textContent='',1600)};draw();
</script>

<!--Closing CTA Split|Features|A closing call-to-action section: photo on one half, a short promise, an email field with inline validation and success state, a secondary “talk to us” link, and the three things people worry about answered in one line each.|cta,call to action,signup,closing,photo-->
<div class="k pg cx"><section class="cx-w"><img src="media/pics/c/1057.jpg" alt="A coastal road winding along cliffs at sunset"><div class="cx-t"><h2 class="h2">Try it on your next project</h2><p class="lead">Free for 30 days. If it isn't saving you time by week two, cancel with one click.</p><form id="f" novalidate><label class="vh" for="em">Work email</label><div class="cx-f"><input class="in" id="em" type="email" autocomplete="email" placeholder="you@company.com" aria-describedby="er"><button class="b ac lg" id="sb">Start free trial</button></div><p class="cx-er" id="er" role="alert"></p></form><div class="cx-ok" id="ok" hidden>@I(mail,20)<span></span></div><ul class="cx-q"><li><b>Card needed?</b> No.</li><li><b>Migrating?</b> We import from spreadsheets and 6 other tools.</li><li><b>Stuck?</b> A human answers within 4 hours. <a href="#">Talk to us</a></li></ul></div></section></div>
<style>
.cx-w{display:grid;grid-template-columns:1fr 1fr;min-height:560px}.cx-w>img{width:100%;height:100%;object-fit:cover}.cx-t{padding:clamp(32px,6vw,80px);display:grid;gap:18px;align-content:center;background:var(--sf)}
.cx-f{display:flex;gap:8px}.cx-f .in{height:48px;font-size:16px;background:var(--bg)}.cx-f .b{flex:none}.cx-er{color:var(--err);font-size:13px;margin:6px 0 0}.cx-er:empty{display:none}
.cx-ok{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--ok-sf);font-size:15px;animation:cxo .3s cubic-bezier(.23,1,.32,1)}.cx-ok .i{color:var(--ok)}@keyframes cxo{from{opacity:0;transform:translateY(4px)}}
.cx-q{list-style:none;padding:16px 0 0;margin:0;display:grid;gap:8px;border-top:1px solid var(--line);font-size:14px;color:var(--mu)}.cx-q b{color:var(--fg);font-weight:600}.cx-q a{color:var(--fg)}
@media (max-width:760px){.cx-w{grid-template-columns:1fr}.cx-w>img{aspect-ratio:16/9}.cx-f{flex-direction:column}}
</style>
<script>
document.getElementById('f').onsubmit=e=>{e.preventDefault();const em=document.getElementById('em'),ok=/^\S+@\S+\.\S+$/.test(em.value.trim());em.setAttribute('aria-invalid',!ok);document.getElementById('er').textContent=ok?'':'Enter your email to start.';if(!ok)return em.focus();const b=document.getElementById('sb');b.disabled=true;b.textContent='Creating your workspace…';setTimeout(()=>{document.getElementById('f').hidden=true;const o=document.getElementById('ok');o.hidden=false;o.querySelector('span').textContent=`Check ${em.value.trim()} for your sign-in link.`},900)};
</script>

<!--Overflowing Tabs|Navigation|A tab bar that measures itself and moves tabs that don't fit into a “More” menu (the active tab always stays visible), with an animated underline indicator and arrow-key navigation; resize the window to see it reflow.|navigation,tabs,overflow,more menu,responsive,indicator-->
<div class="k"><div class="to"><div class="to-b" id="b" role="tablist" aria-label="Project sections"><span class="to-in" id="ind" aria-hidden="true"></span></div><p class="mu to-p" id="p" role="tabpanel"></p><p class="mu" style="font-size:12px">Resize the window to see tabs move into More.</p></div></div>
<style>
.to{width:min(860px,100%);resize:horizontal;overflow:hidden}.to-b{display:flex;align-items:center;border-bottom:1px solid var(--line);position:relative;white-space:nowrap}.to-b>button{height:44px;padding:0 14px;font-size:14px;font-weight:550;color:var(--mu);flex:none}.to-b>button[aria-selected=true]{color:var(--fg)}.to-b>button:hover{color:var(--fg)}
.to-in{position:absolute;bottom:-1px;height:2px;background:var(--fg);transition:left .25s cubic-bezier(.23,1,.32,1),width .25s cubic-bezier(.23,1,.32,1)}
.to-mw{position:relative;margin-left:auto;flex:none}.to-mb{height:44px;padding:0 12px;font-size:14px;font-weight:550;color:var(--mu);display:flex;gap:4px;align-items:center}.to-mb.act{color:var(--fg)}
.to-m{position:absolute;right:0;top:44px;min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:5;box-shadow:0 10px 24px -10px #0004;transform-origin:top right;animation:tom .15s cubic-bezier(.23,1,.32,1)}@keyframes tom{from{opacity:0;transform:scale(.96)}}.to-m button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:14px}.to-m button:hover,.to-m button:focus-visible{background:var(--sf)}.to-m [aria-selected=true]{font-weight:650}
.to-p{padding:20px 0;margin:0}
</style>
<script>
const T=['Overview','Tasks','Timeline','Files','Discussions','Docs','Automations','Reports','Integrations','Settings'],b=document.getElementById('b'),ind=document.getElementById('ind');let act=0,open=false;
function draw(){b.querySelectorAll('button,.to-mw').forEach(x=>x.remove());const W=b.clientWidth-90;let vis=[],used=0;const widths=T.map(t=>t.length*8+30);const ordered=[act,...T.map((_,i)=>i).filter(i=>i!==act)];const keep=new Set();for(const i of ordered){if(used+widths[i]<=W){keep.add(i);used+=widths[i]}}
T.forEach((t,i)=>{if(keep.has(i))b.insertAdjacentHTML('beforeend',`<button role="tab" aria-selected="${i===act}" tabindex="${i===act?0:-1}" data-i="${i}">${t}</button>`)});const hid=T.map((t,i)=>[t,i]).filter(([,i])=>!keep.has(i));
if(hid.length)b.insertAdjacentHTML('beforeend',`<div class="to-mw"><button class="to-mb" aria-haspopup="true" aria-expanded="${open}">More (${hid.length}) @I(down,14)</button>${open?`<div class="to-m" role="menu">${hid.map(([t,i])=>`<button role="menuitem" data-i="${i}">${t}</button>`).join('')}</div>`:''}</div>`);
const a=b.querySelector(`[role=tab][data-i="${act}"]`);if(a){ind.style.left=a.offsetLeft+'px';ind.style.width=a.offsetWidth+'px'}document.getElementById('p').textContent=`${T[act]}: content for this section.`}
b.onclick=e=>{const mb=e.target.closest('.to-mb');if(mb){open=!open;draw();if(open)b.querySelector('.to-m button').focus();return}const t=e.target.closest('[data-i]');if(t){act=+t.dataset.i;open=false;draw();b.querySelector(`[role=tab][data-i="${act}"]`).focus()}};
b.onkeydown=e=>{if(!e.target.matches('[role=tab]'))return;const tabs=[...b.querySelectorAll('[role=tab]')],i=tabs.indexOf(e.target);if(e.key==='ArrowRight'&&tabs[i+1]){act=+tabs[i+1].dataset.i;draw();b.querySelector(`[role=tab][data-i="${act}"]`).focus()}if(e.key==='ArrowLeft'&&tabs[i-1]){act=+tabs[i-1].dataset.i;draw();b.querySelector(`[role=tab][data-i="${act}"]`).focus()}};
document.addEventListener('pointerdown',e=>{if(open&&!e.target.closest('.to-mw')){open=false;draw()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open){open=false;draw();b.querySelector('.to-mb').focus()}});new ResizeObserver(()=>draw()).observe(b);
</script>

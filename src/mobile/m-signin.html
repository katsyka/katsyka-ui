<!--Sign In|Mobile sign-in that respects the keyboard: email and password with the right input types and autofill, a reveal toggle, a Continue button that waits for valid input then loads, plus passkey and social options.|auth,login,form,passkey,keyboard-->
<main class="sc si">
  <button class="ib" aria-label="Back" style="margin-left:-12px">@I(left)</button>
  <h1 class="si-h">Welcome back</h1>
  <p class="si-p">Sign in to sync your routes across devices.</p>
  <form id="f" novalidate>
    <label class="si-f"><span>Email</span><input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="next" placeholder="you@example.com" required></label>
    <label class="si-f"><span>Password</span><span class="si-pw"><input id="pw" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="At least 8 characters" required minlength="8"><button type="button" class="ib" id="eye" aria-label="Show password" aria-pressed="false">@I(eye,20)</button></span></label>
    <p class="si-err" id="err" role="alert"></p>
    <a href="#" class="si-fg">Forgot password?</a>
    <button class="btn" id="go" disabled><span>Continue</span></button>
  </form>
  <div class="si-or"><span>or</span></div>
  <button class="btn sec si-alt">@I(lock,20) Sign in with a passkey</button>
  <button class="btn sec si-alt"><svg class="i" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.6 1.3-.1 1.7-.8 3.3-.8 1.5 0 1.9.8 3.3.8 1.4 0 2.2-1.2 3-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.6-1-2.3-4.1zM13.9 4.9c.7-.8 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg> Continue with Apple</button>
  <p class="si-t">New here? <a href="#">Create an account</a></p>
</main>
<style>
.si{padding:calc(var(--st) + 4px) 24px calc(var(--sbt) + 24px)}
.si-h{margin:16px 0 0;font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.025em}
.si-p{margin:8px 0 32px;color:var(--mu);font-size:17px;line-height:24px}
.si-f{display:block;margin-bottom:16px}
.si-f>span:first-child{display:block;margin-bottom:6px;font-size:15px;font-weight:500}
.si-f input{width:100%;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--ctl);background:var(--bg);font-size:17px!important;outline:0;transition:border-color .15s,box-shadow .15s}
.si-f input::placeholder{color:var(--mu);opacity:.8}
.si-f input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.si-f input[aria-invalid=true]{border-color:var(--err)}
.si-pw{position:relative;display:block}.si-pw input{padding-right:52px}.si-pw .ib{position:absolute;right:4px;top:4px;color:var(--mu)}
.si-pw .ib[aria-pressed=true]{color:var(--fg)}
.si-err{min-height:20px;margin:-8px 0 4px;font-size:14px;color:var(--err)}
.si-fg{display:inline-flex;align-items:center;min-height:44px;margin:-8px 0 16px;color:var(--ac);font-size:15px;font-weight:500;text-decoration:none}
.btn:disabled{opacity:.4;transform:none}
.btn.load span{opacity:0}.btn.load{position:relative}.btn.load::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.si-or{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--mu);font-size:14px}.si-or::before,.si-or::after{content:"";flex:1;border-top:1px solid var(--line)}
.si-alt{margin-bottom:12px;font-size:16px!important}
.si-t{margin:24px 0 0;text-align:center;color:var(--mu);font-size:15px}.si-t a{color:var(--ac);font-weight:500;text-decoration:none}
</style>
<script>
const ok=()=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value)&&pw.value.length>=8;
[em,pw].forEach(i=>i.addEventListener("input",()=>{go.disabled=!ok();i.removeAttribute("aria-invalid");err.textContent=""}));
em.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();pw.focus()}});
em.addEventListener("blur",()=>{if(em.value&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value)){em.setAttribute("aria-invalid","true");err.textContent="That email looks incomplete."}});
eye.onclick=()=>{const s=pw.type==="password";pw.type=s?"text":"password";eye.setAttribute("aria-pressed",s);eye.setAttribute("aria-label",s?"Hide password":"Show password")};
f.onsubmit=e=>{e.preventDefault();if(!ok())return;go.classList.add("load");go.disabled=true;setTimeout(()=>{go.classList.remove("load");go.disabled=false;go.querySelector("span").textContent="Signed in ✓"},1300)};
document.querySelectorAll('a[href="#"]').forEach(a=>a.onclick=e=>e.preventDefault());
</script>

<!--Bag|A shopping bag with quantity steppers that update every total live, remove that collapses the row, a promo code field and a checkout bar that always shows what you'll pay.|cart,bag,stepper,checkout,ecommerce-->
<header class="bar"><div class="nb"><span><button class="ib" aria-label="Back">@I(left)</button></span><h2>Bag <span class="mu tn" id="cnt"></span></h2><span></span></div></header>
<main class="sc ca">
  <ul class="ca-l" id="l"></ul>
  <p class="ca-e" id="empty" hidden>Your bag is empty.</p>
  <form class="ca-pc" id="pc"><label class="vh" for="code">Promo code</label><input id="code" placeholder="Promo code" autocapitalize="characters" autocomplete="off" enterkeyhint="done"><button class="btn sec">Apply</button></form>
  <p class="ca-m" id="pm" role="status">Try FIELD10</p>
  <dl class="ca-s"><div><dt>Subtotal</dt><dd class="tn" id="sub"></dd></div><div id="dr" hidden><dt>Discount</dt><dd class="tn" id="dis" style="color:var(--ok)"></dd></div><div><dt>Shipping</dt><dd id="shp">Free</dd></div><div class="tot"><dt>Total</dt><dd class="tn" id="tot"></dd></div></dl>
</main>
<div class="cta"><button class="btn" id="co">Checkout · <span class="tn" id="ct"></span></button></div>
<style>
.ca{padding-bottom:calc(var(--sbt) + 96px)}
.ca-l{list-style:none;margin:0;padding:0 var(--gut)}
.ca-i{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s var(--ease),opacity .3s}
.ca-i.gone{grid-template-rows:0fr;opacity:0}
.ca-i>div{overflow:hidden}
.ca-r{display:flex;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line)}
.ca-r img{width:80px;height:100px;border-radius:12px;object-fit:cover;flex:none;background:var(--sf)}
.ca-r .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.ca-r b{font-size:17px;line-height:22px;font-weight:500}.ca-r small{font-size:14px;color:var(--mu);line-height:19px}
.ca-r .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.ca-r .pr{font-weight:600;font-variant-numeric:tabular-nums}
.ca-st{display:flex;align-items:center;border-radius:22px;background:var(--sf)}
.ca-st button{width:40px;height:40px;display:grid;place-items:center;border-radius:20px}.ca-st button:active{background:var(--sf2)}
.ca-st .i{width:18px;height:18px}
.ca-st output{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.ca-pc{display:flex;gap:8px;margin:20px var(--gut) 0}
.ca-pc input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--ctl);background:var(--bg);font-size:17px!important;text-transform:uppercase;outline:0}
.ca-pc input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}.ca-pc .btn{width:auto;min-height:48px;border-radius:12px;font-size:15px!important}
.ca-m{margin:6px var(--gut) 0;font-size:13px;color:var(--mu);min-height:18px}.ca-m.ok{color:var(--ok)}.ca-m.bad{color:var(--err)}
.ca-s{margin:16px var(--gut) 0}.ca-s div{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}.ca-s dt{color:var(--mu)}.ca-s dd{margin:0}
.ca-s .tot{margin-top:6px;padding-top:12px;border-top:.5px solid var(--line);font-size:17px;font-weight:650}.ca-s .tot dt{color:var(--fg)}
.ca-e{text-align:center;color:var(--mu);padding:48px 0}
</style>
<script>
const IT=[["1043","Valley floor","50×70 · Natural oak",106,1],["1080","Strawberries","30×40 · No frame",38,2],["1022","Northern static","50×70 · Black ash",106,1]];
const IC=p=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`,MI=IC('<path d="M5 12h14"/>'),PL=IC('<path d="M12 5v14M5 12h14"/>'),TR=IC('<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>');
let disc=0;
l.innerHTML=IT.map(([p,n,v,pr,q],i)=>`<li class="ca-i" data-i="${i}"><div><div class="ca-r"><img src="media/pics/c/${p}.jpg" alt=""><span class="tx"><b>${n}</b><small>${v}</small><span class="ft"><span class="pr"></span><span class="ca-st"><button class="dn" aria-label="Decrease ${n}"></button><output aria-live="polite">${q}</output><button class="up" aria-label="Increase ${n}">${PL}</button></span></span></span></div></div></li>`).join("");
const $=n=>"$"+n.toFixed(0);
const sum=()=>{let s=0,c=0;l.querySelectorAll(".ca-i:not(.gone)").forEach(li=>{const it=IT[li.dataset.i];s+=it[3]*it[4];c+=it[4];li.querySelector(".pr").textContent=$(it[3]*it[4]);li.querySelector(".dn").innerHTML=it[4]>1?MI:TR;li.querySelector(".dn").setAttribute("aria-label",(it[4]>1?"Decrease ":"Remove ")+it[1])});
 const d=s*disc,sh=s>=100||!s?0:8;sub.textContent=$(s);dr.hidden=!disc;dis.textContent="−"+$(d);shp.textContent=sh?$(sh):"Free";tot.textContent=ct.textContent=$(s-d+sh);cnt.textContent=c?`(${c})`:"";co.disabled=!c;empty.hidden=!!c};
l.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const li=b.closest(".ca-i"),it=IT[li.dataset.i];
 if(b.classList.contains("up"))it[4]++;else if(it[4]>1)it[4]--;else{li.classList.add("gone");setTimeout(()=>li.remove(),300);it[4]=0}li.querySelector("output").textContent=it[4];sum()});
pc.onsubmit=e=>{e.preventDefault();const ok=code.value.trim().toUpperCase()==="FIELD10";disc=ok?.1:0;pm.textContent=ok?"FIELD10 applied: 10% off":"That code isn't valid.";pm.className="ca-m "+(ok?"ok":"bad");sum()};
sum();
</script>

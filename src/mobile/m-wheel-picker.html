<!--Wheel Picker|An alarm time picker built from scroll-snap columns with a 3D drum effect: hours, minutes and AM/PM. Flick or use arrow keys; the summary updates with time until the alarm.|picker,wheel,time,scroll snap,alarm-->
<header class="bar"><div class="nb"><span><button class="ib" style="width:auto;padding:0 8px;color:var(--ac);font-size:17px">Cancel</button></span><h2>Add alarm</h2><span><button class="ib" id="sv" style="width:auto;padding:0 8px;color:var(--ac);font-size:17px;font-weight:600">Save</button></span></div></header>
<main class="sc wp">
  <div class="wp-w" aria-label="Alarm time"><i class="wp-band" aria-hidden="true"></i>
    <div class="wp-c" id="ch" role="listbox" tabindex="0" aria-label="Hour"></div><div class="wp-c" id="cm" role="listbox" tabindex="0" aria-label="Minute"></div><div class="wp-c" id="ca" role="listbox" tabindex="0" aria-label="AM or PM"></div></div>
  <p class="wp-s" id="sum" role="status"></p>
  <div class="grp" style="margin-top:24px">
    <a class="row" href="#"><span class="tx"><b>Repeat</b></span><span class="mu">Weekdays</span>@I(right,18)</a>
    <a class="row" href="#"><span class="tx"><b>Label</b></span><span class="mu">Ferry</span>@I(right,18)</a>
    <a class="row" href="#"><span class="tx"><b>Sound</b></span><span class="mu">Harbour</span>@I(right,18)</a>
  </div>
</main>
<style>
.wp{padding-top:calc(var(--st) + 60px)!important}
.wp-w{position:relative;display:grid;grid-template-columns:1fr 1fr .8fr;height:220px;margin:0 var(--gut);-webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wp-band{position:absolute;left:0;right:0;top:50%;height:40px;margin-top:-20px;border-radius:10px;background:var(--sf2);pointer-events:none}
.wp-c{position:relative;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:90px 0;perspective:600px;outline:0;overscroll-behavior:contain}
.wp-c::-webkit-scrollbar{display:none}.wp-c:focus-visible{box-shadow:inset 0 0 0 2px var(--focus);border-radius:10px}
.wp-c div{height:40px;display:grid;place-items:center;scroll-snap-align:center;font-size:24px;font-variant-numeric:tabular-nums;transform-origin:center;transition:color .15s;will-change:transform}
.wp-c div.on{font-weight:600}
.wp-s{text-align:center;margin:16px 0 0;font-size:15px;color:var(--mu)}
.row>.i{color:var(--ctl)}
</style>
<script>
const H=Array.from({length:12},(_,i)=>i+1),Mi=Array.from({length:60},(_,i)=>String(i).padStart(2,"0")),A=["AM","PM"];
const fill=(c,L,v)=>{c.innerHTML=L.map(x=>`<div role="option">${x}</div>`).join("");c.dataset.v=v};
fill(ch,H,6);fill(cm,Mi,30);fill(ca,A,0);
const val=c=>Math.round(c.scrollTop/40);
const paint=c=>{const st=c.scrollTop;const k=val(c);[...c.children].forEach((d,i)=>{const off=(i*40-st)/40;d.style.transform=`rotateX(${Math.max(-80,Math.min(80,-off*22))}deg) translateZ(0)`;d.style.opacity=Math.max(.15,1-Math.abs(off)*.28);d.classList.toggle("on",i===k);d.setAttribute("aria-selected",i===k)})};
const sum_=()=>{const h=H[val(ch)],m=+Mi[val(cm)],pm=val(ca);let h24=h%12+(pm?12:0);const now=new Date(2026,10,11,13,12);let t=new Date(2026,10,11,h24,m);if(t<=now)t=new Date(+t+864e5);const d=(t-now)/6e4;sum.textContent=`Alarm in ${Math.floor(d/60)} h ${Math.round(d%60)} min`};
[ch,cm,ca].forEach(c=>{c.scrollTop=c.dataset.v*40;paint(c);c.addEventListener("scroll",()=>{paint(c);sum_()},{passive:true});
 c.addEventListener("keydown",e=>{const d=e.key==="ArrowDown"?1:e.key==="ArrowUp"?-1:0;if(d){e.preventDefault();c.scrollTo({top:(val(c)+d)*40,behavior:"smooth"})}});
 c.addEventListener("click",e=>{const i=[...c.children].indexOf(e.target);if(i>=0)c.scrollTo({top:i*40,behavior:"smooth"})})});
sum_();
document.querySelectorAll('a[href="#"]').forEach(a=>a.onclick=e=>e.preventDefault());
sv.onclick=()=>{sv.textContent="Saved";setTimeout(()=>sv.textContent="Save",1400)};
</script>

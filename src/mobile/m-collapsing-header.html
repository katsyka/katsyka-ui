<!--Collapsing Header|An album page whose cover stretches when you pull down, parallaxes as you scroll, and hands its title to a nav bar that fades in, with the play button pinned in place.|header,parallax,stretch,collapsing,album-->
<header class="ch-bar" id="bar"><button class="ib gl" aria-label="Back">@I(left)</button><h2 id="bt">Valley Hours</h2><button class="ib gl" aria-label="More">@I(more)</button></header>
<main class="sc ch" id="sc">
  <div class="ch-cv" id="cv"><img id="im" src="media/pics/c/1043.jpg" alt=""></div>
  <section class="ch-b">
    <div class="ch-hd"><span><h1 id="tt">Valley Hours</h1><p>Mire · 2026 · 9 songs, 38 min</p></span><button class="ch-pp" aria-label="Play">@I(play,26)</button></div>
    <div class="ch-ac"><button class="chip">@I(shuffle,16) Shuffle</button><button class="chip">@I(download,16) Download</button><button class="chip">@I(heart,16) Save</button></div>
    <ol class="ch-l" id="l"></ol>
    <p class="ch-ft">Released 4 September 2026<br>℗ 2026 Mire, under licence to Low Tide Records</p>
  </section>
</main>
<style>
.ch-bar{position:absolute;inset:0 0 auto;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 4px) 12px 8px;transition:background .25s,box-shadow .25s}
.ch-bar h2{margin:0;font-size:17px;font-weight:600;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .25s var(--ease)}
.ch-bar.on{background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 .5px 0 var(--line)}
.ch-bar.on h2{opacity:1;transform:none}.ch-bar.on .gl{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}.ch-bar.on .gl::before{display:none}
.ch{padding-top:0!important;padding-bottom:var(--sbt)!important}
.ch-cv{position:relative;height:380px;overflow:hidden}
.ch-cv img{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;transform-origin:bottom;will-change:transform}
.ch-b{position:relative;background:var(--bg);margin-top:-1px}
.ch-hd{display:flex;align-items:center;gap:12px;padding:20px var(--gut) 0}
.ch-hd span{flex:1;min-width:0}.ch-hd h1{margin:0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.025em}.ch-hd p{margin:2px 0 0;font-size:15px;color:var(--mu)}
.ch-pp{width:56px;height:56px;border-radius:50%;flex:none;background:var(--ac)!important;color:var(--ac-fg)!important;display:grid;place-items:center;margin-top:-56px;box-shadow:0 8px 20px -6px #0006;transition:transform .15s}.ch-pp:active{transform:scale(.92)}
.ch-ac{display:flex;gap:8px;padding:16px var(--gut) 8px}.ch-ac .chip .i{width:16px;height:16px}
.ch-l{list-style:none;margin:0;padding:0 var(--gut)}
.ch-l li{display:flex;align-items:center;gap:14px;min-height:56px;border-bottom:.5px solid var(--line);font-size:16px}
.ch-l li span:first-child{width:20px;color:var(--mu);font-variant-numeric:tabular-nums;text-align:right}.ch-l li b{flex:1;font-weight:500}.ch-l li time{color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}
.ch-ft{padding:20px var(--gut);margin:0;font-size:13px;line-height:19px;color:var(--mu)}
</style>
<script>
const T=[["Before the Sun","3:41"],["Valley Floor","4:12"],["Granite","3:05"],["Thaw","5:20"],["Salt Flats","3:58"],["Long Shadow","4:44"],["Switchback","3:29"],["Ridge Line","4:31"],["Valley Hours","5:02"]];
l.innerHTML=T.map(([n,t],i)=>`<li><span>${i+1}</span><b>${n}</b><time>${t}</time></li>`).join("");
const H=380;const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const upd=()=>{const y=sc.scrollTop;if(y<0)im.style.transform=`scale(${1+(-y)/H})`;else im.style.transform=RM?"":`translateY(${y*.45}px)`;bar.classList.toggle("on",y>H-100)};
sc.addEventListener("scroll",upd,{passive:true});upd();
let py=null,pull=0;sc.addEventListener("pointerdown",e=>{if(sc.scrollTop<=0)py=e.clientY});addEventListener("pointermove",e=>{if(py===null)return;pull=Math.max(0,e.clientY-py);cv.style.height=H+pull*.5+"px"});addEventListener("pointerup",()=>{if(py===null)return;py=null;cv.style.transition="height .45s cubic-bezier(.3,1.3,.5,1)";cv.style.height=H+"px";setTimeout(()=>cv.style.transition="",450)});
</script>

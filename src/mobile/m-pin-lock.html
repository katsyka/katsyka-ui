<!--Passcode Lock|A lock screen passcode pad: round keys with letters, dots that fill as you type, a shake and a gentle message on a wrong code, Face ID and delete in the bottom corners, and an unlock that zooms through. The code is 1234.|passcode,pin,lock screen,keypad,security-->
<main class="pn" id="pn">
  @I(lock,28)
  <h1 id="tt">Enter passcode</h1>
  <div class="pn-d" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="pn-m" id="msg" role="status" aria-live="assertive"></p>
  <div class="pn-k" id="k"></div>
  <div class="pn-ok" id="ok" hidden>@I(check,40)<b>Unlocked</b><button class="btn sec" id="lockb" style="width:auto;min-height:44px;margin-top:16px">Lock again</button></div>
</main>
<style>
.pn{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 40px) 40px max(24px,var(--sbt));text-align:center}
.pn>.i{color:var(--mu)}
.pn h1{margin:16px 0 0;font-size:20px;font-weight:600}
.pn-d{display:flex;gap:22px;margin:24px 0 0}.pn-d i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fg);transition:background .12s,transform .12s}
.pn-d i.f{background:var(--fg);transform:scale(1.1)}
.pn-d.bad{animation:sh .45s}.pn-d.bad i{box-shadow:inset 0 0 0 1.5px var(--err)}
@keyframes sh{15%,55%{transform:translateX(-12px)}35%,75%{transform:translateX(12px)}}
.pn-m{min-height:20px;margin:16px 0 0;font-size:15px;color:var(--err)}
.pn-k{display:grid;grid-template-columns:repeat(3,78px);gap:16px 24px;margin-top:auto}
.pn-k button{width:78px;height:78px;border-radius:50%;background:var(--sf2)!important;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .25s}
.pn-k button:active{background:var(--ctl)!important;transition:none}
.pn-k b{font-size:34px;line-height:36px;font-weight:400}.pn-k small{font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--mu);height:12px}
.pn-k .t{background:none!important;font-size:17px;font-weight:500}.pn-k .t:active{background:none!important;opacity:.5}
.pn.go>*:not(.pn-ok){animation:out .5s var(--ease) forwards}
@keyframes out{to{opacity:0;transform:scale(1.4)}}
.pn-ok{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ok);animation:fi .4s .3s backwards}.pn-ok b{font-size:22px;color:var(--fg)}
@keyframes fi{from{opacity:0;transform:scale(.8)}}
</style>
<script>
const L=["","ABC","DEF","GHI","JKL","MNO","PQRS","TUV","WXYZ"];
k.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}" aria-label="${n}"><b>${n}</b><small>${L[n-1]}</small></button>`).join("")+`<button class="t" id="fid" aria-label="Use Face ID"><svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M9 9v1M15 9v1M12 9v4h-1M9 16c1.7 1.3 4.3 1.3 6 0"/></svg></button><button data-n="0" aria-label="0"><b>0</b><small></small></button><button class="t" id="del" aria-label="Delete">Delete</button>`;
let v="",tries=0;const D=[...dots.children];
const draw=()=>D.forEach((d,i)=>d.classList.toggle("f",i<v.length));
const unlock=()=>{pn.classList.add("go");ok.hidden=false;lockb.focus()};
const press=n=>{if(v.length>=4)return;v+=n;msg.textContent="";draw();if(v.length===4)setTimeout(()=>{if(v==="1234")unlock();else{tries++;dots.classList.remove("bad");void dots.offsetWidth;dots.classList.add("bad");msg.textContent=tries>2?"Hint: it's the easiest one":"Wrong passcode. Try again.";navigator.vibrate&&navigator.vibrate([30,40,30]);v="";setTimeout(draw,250)}},150)};
k.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.n)press(b.dataset.n);else if(b.id==="del"){v=v.slice(0,-1);draw()}else if(b.id==="fid"){tt.textContent="Looking for your face…";setTimeout(unlock,900)}};
addEventListener("keydown",e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace"){v=v.slice(0,-1);draw()}});
lockb.onclick=()=>{pn.classList.remove("go");ok.hidden=true;v="";tries=0;tt.textContent="Enter passcode";draw()};
</script>

<!--Order Tracking|Live delivery tracking: the courier moves along the route on the map, the sheet shows a big ETA, a four-step progress line and call/message buttons for the courier.|delivery,tracking,map,progress,eta-->
<div class="ot-map"><svg class="mp" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="900" fill="var(--land)"/><path fill="var(--park)" d="M36 110h120a10 10 0 0 1 10 10v84a10 10 0 0 1-10 10H36a10 10 0 0 1-10-10v-84a10 10 0 0 1 10-10zM246 300l92-12 12 96-98 10zM20 740h140v120H20z"/><path fill="var(--water)" d="M0 560c80-24 140 40 220 30s140-70 180-50v140c-70-20-140 40-220 20S60 640 0 660z"/><g fill="none" stroke="var(--road2)" stroke-width="6" stroke-linecap="round"><path d="M0 70h400M0 160h400M0 400l400-30M0 470h400M0 800h400M60 0v900M210 0v540M260 700v200M350 0v540M340 690v210"/></g><g fill="none" stroke="var(--road)" stroke-width="12" stroke-linecap="round"><path d="M-10 262 410 222M128 -10l34 920M300 -10c-20 310 20 510-20 920"/></g><g fill="var(--label)" font-family="Geist,system-ui" font-size="11" font-weight="600" letter-spacing=".04em"><text x="48" y="168">FLORA PARK</text><text x="220" y="640">HARBOUR</text><text x="176" y="248" transform="rotate(-5.5 176 248)">STRANDGATEN</text></g></svg><svg class="mp mp-r" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path id="rt" d="M90 120 L60 160 L150 254 L210 248 L210 400 L300 386 L310 470" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="120" r="7" fill="var(--bg)" stroke="var(--fg)" stroke-width="3"/><g transform="translate(310 470)"><circle r="16" fill="var(--fg)"/><path d="M-6 0l6-6 6 6v6h-12z" fill="var(--bg)"/></g><g id="cr"><circle r="20" fill="var(--ac)" opacity=".2"><animate attributeName="r" values="12;24;12" dur="2s" repeatCount="indefinite"/></circle><circle r="10" fill="var(--ac)" stroke="var(--bg)" stroke-width="3"/></g></svg>
<button class="ib gl ot-bk" aria-label="Back">@I(left)</button></div>
<section class="ot-sh">
  <i class="ot-gr" aria-hidden="true"></i>
  <p class="ot-k">Arriving in</p>
  <h1 class="ot-eta tn"><span id="eta">12</span> min</h1>
  <p class="mu ot-s" id="st">Jonas picked up your order and is on the way.</p>
  <ol class="ot-p" id="pg"><li class="d">Confirmed</li><li class="d">Packed</li><li class="c">On the way</li><li>Delivered</li></ol>
  <div class="ot-cr"><span class="av" style="--c:#0f766e">J</span><span class="tx"><b>Jonas</b><small>Cargo bike · ★ 4.9</small></span><button class="ib ot-a" aria-label="Message Jonas">@I(msg,20)</button><button class="ib ot-a" aria-label="Call Jonas">@I(phone,20)</button></div>
</section>
<style>
.ot-map{position:relative;flex:1;min-height:0;--land:light-dark(#f1eee8,#1a1b1f);--water:light-dark(#c2dcf0,#14273a);--park:light-dark(#d6ebcf,#18291d);--road:light-dark(#ffffff,#33343b);--road2:light-dark(#ffffffcc,#27282e);--label:light-dark(#8a8780,#6f7078)}
.mp{position:absolute;inset:0;width:100%;height:100%}
.ot-bk{position:absolute;top:calc(var(--st) + 4px);left:12px}
.ot-sh{position:relative;margin-top:-28px;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 20px max(20px,var(--sbt));box-shadow:0 -8px 24px -12px light-dark(#0003,#000a)}
.ot-gr{display:block;width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.ot-k{margin:0;font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.ot-eta{margin:2px 0 0;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.03em}
.ot-s{margin:6px 0 0;font-size:15px;line-height:20px}
.ot-p{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0 0;padding:0;counter-reset:s}
.ot-p li{position:relative;padding-top:18px;font-size:12px;font-weight:500;color:var(--mu)}
.ot-p li::before{content:"";position:absolute;top:0;left:0;right:4px;height:4px;border-radius:2px;background:var(--line)}
.ot-p li.d::before{background:var(--fg)}.ot-p li.d{color:var(--fg)}
.ot-p li.c::before{background:linear-gradient(90deg,var(--ac) var(--p,40%),var(--line) 0)}.ot-p li.c{color:var(--ac)}
.ot-cr{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px;border-radius:18px;background:var(--sf)}
.ot-cr .tx{flex:1}.ot-cr b{display:block;font-size:16px;font-weight:600}.ot-cr small{font-size:13px;color:var(--mu)}
.ot-a{background:var(--bg)!important}
</style>
<script>
const rt=document.getElementById("rt"),L=rt.getTotalLength();let t=.42;
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const draw=()=>{const p=rt.getPointAtLength(L*t);cr.setAttribute("transform",`translate(${p.x} ${p.y})`);eta.textContent=Math.max(1,Math.round((1-t)*21));pg.querySelector(".c")&&pg.querySelector(".c").style.setProperty("--p",t*100+"%")};
draw();if(!RM)setInterval(()=>{t+=.004;if(t>=1){t=1;draw();pg.querySelector(".c").className="d";pg.lastElementChild.className="d";eta.textContent="0";st.textContent="Delivered. Enjoy!";return}draw()},120);
</script>
